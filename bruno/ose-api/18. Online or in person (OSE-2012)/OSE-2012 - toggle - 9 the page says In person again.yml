info:
  name: OSE-2012 | sunny | update | the page says "In person" again, with its place
  type: http
  seq: 38

http:
  method: GET
  url: "{{baseUrl}}/events/mode-toggle-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const html = String(res.getBody() || '');
        test('OSE-2012 sunny: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2012 sunny: In person, at its place', function () {
          expect(html).to.include('data-mode="in_person">In person</span>');
          expect(html).to.include('Mode Fixture Hall');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
