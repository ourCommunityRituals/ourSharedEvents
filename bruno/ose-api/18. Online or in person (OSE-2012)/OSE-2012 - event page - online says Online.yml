info:
  name: OSE-2012 | sunny | event page | the online event says "Online"
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/events/mode-online-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const html = String(res.getBody() || '');
        test('OSE-2012 sunny: the page opens by its link', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2012 sunny: it says "Online", once', function () {
          expect(html.split('data-testid="event-mode"').length - 1).to.eql(1);
          expect(html).to.include('data-testid="event-mode" data-mode="online">Online</p>');
        });
        test('OSE-2012: one h1', function () { expect((html.match(/<h1[\s>]/g) || []).length).to.eql(1); });
        test('OSE-2012 place, not person: the online page shows no place and no map', function () {
          expect(html).to.not.include('data-testid="venue-map"');
          expect(html).to.not.include('Mode Fixture Hall');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
