info:
  name: OSE-2012 | rainy | /events | the online event is link only, so it is not on the list
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const html = String(res.getBody() || '');
        test('OSE-2012: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2012 rainy: /events does not list the online event the brand API returns', function () {
          expect(html).to.not.include('Mode Fixture (online)');
          expect(html).to.not.include('mode-online-evt');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
