info:
  name: OSE-2012 | rainy | update | an in-person event cannot give up its place (400)
  type: http
  seq: 32

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/mode-toggle-evt"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"location":null}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2012: 400 LOCATION_REQUIRED', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('LOCATION_REQUIRED');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
