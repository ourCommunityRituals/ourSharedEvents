info:
  name: OSE-2012 | sunny | /s code | a click on the online event is answered like any other
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/s/MODEsl"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2012 sunny: 302 to the event', function () {
          expect(res.getStatus()).to.eql(302);
          expect(String(res.getHeader('Location') || '')).to.include('mode-online-evt');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
