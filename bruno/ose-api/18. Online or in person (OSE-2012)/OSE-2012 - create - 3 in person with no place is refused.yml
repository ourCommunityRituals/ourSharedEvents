info:
  name: OSE-2012 | rainy | create | in person with no place is refused (400)
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"title":"OSE-2012 in person, no place","attendance_mode":"in_person"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2012: 400 LOCATION_REQUIRED', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('LOCATION_REQUIRED');
        });
        test('OSE-2012: the refusal made no event', function () { expect(res.getBody().id).to.eql(undefined); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
