info:
  name: OSE-2012 | fat finger | update | the mode cannot be cleared (400)
  type: http
  seq: 31

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/mode-toggle-evt"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"attendance_mode":null}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2012: 400 INVALID_ATTENDANCE_MODE', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('INVALID_ATTENDANCE_MODE');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
