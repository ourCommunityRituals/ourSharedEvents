info:
  name: GET /api/v2/events/:id (not found)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/nonexistent-event-id-99999"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        test('Returns 404 or 503', function() {

        \    expect(res.getStatus()).to.be.oneOf([404, 503]);

        });

        

        if (res.getStatus() === 404) {

        \    test('NOT_FOUND code', function() {

        \        expect(json.code).to.eql('NOT_FOUND');

        \    });

        

        \    test('ok is false', function() {

        \        expect(json.ok).to.eql(false);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
