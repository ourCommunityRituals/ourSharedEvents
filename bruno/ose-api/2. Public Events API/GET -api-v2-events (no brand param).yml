info:
  name: GET /api/v2/events (no brand param)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        test('Defaults to root brand', function() {\r

        \    // Should return same results as brand=root\r

        \    expect(res.getStatus()).to.be.oneOf([200, 503]);\r

        });\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('ok is true', function() {\r

        \        expect(json.ok).to.eql(true);\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
