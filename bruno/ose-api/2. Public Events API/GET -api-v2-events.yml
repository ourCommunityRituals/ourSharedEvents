info:
  name: GET /api/v2/events
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events?brand={{brandId}}"
  params:
    - name: brand
      value: "{{brandId}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: "if (bru.getEnvVar('dbStatus') === 'not_configured') {

        \    console.warn('DB not configured — expecting 503');

        }"
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('items is array', function() {

        \        expect(json.items).to.be.an('array');

        \    });

        

        \    test('status is 200', function() {

        \        expect(json.status).to.eql(200);

        \    });

        

        \    if (json.items.length > 0) {

        \        const item = json.items[0];

        \        test('Event has required fields', function() {

        \            expect(item).to.have.property('id');

        \            expect(item).to.have.property('brand_id');

        \            expect(item).to.have.property('title');

        \            expect(item).to.have.property('slug');

        \            expect(item).to.have.property('status');

        \            expect(item).to.have.property('start_date');

        \        });

        

        \        // OSE-844 (X-10): the API emits the canonical field names the

        \        // surface templates read (name/startDateISO/venue), mapped in

        \        // enrichWithPhase. This is the live-response T3 restoration of the

        \        // guard the archived events.spec.ts asserted before it was defanged.

        \        test('OSE-844: emits canonical name/startDateISO/venue', function() {

        \            expect(item).to.have.property('name');

        \            expect(item.name, 'name must equal the title column').to.eql(item.title);

        \            expect(item).to.have.property('startDateISO');

        \            if (item.start_date) { expect(item.startDateISO).to.match(/^\\d{4}-\\d{2}-\\d{2}/); }

        \            expect(item).to.have.property('venue');

        \        });

        

        \        // Capture first event ID for downstream tests

        \        bru.setEnvVar('testEventId', item.id);

        \        console.log('Captured testEventId: ' + item.id);

        \    }

        } else if (res.getStatus() === 503) {

        \    test('503 has error code', function() {

        \        expect(json.code).to.be.oneOf(['DB_NOT_CONFIGURED', 'DB_ERROR']);

        \    });

        \    test('503 has requestId', function() {

        \        expect(json.requestId).to.be.a('string');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
