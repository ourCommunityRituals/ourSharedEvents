info:
  name: GET /api/v2/events/:id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('ok is true', function() {\r

        \        expect(json.ok).to.eql(true);\r

        \    });\r

        \r

        \    test('item is object with id', function() {\r

        \        expect(json.item).to.be.an('object');\r

        \        expect(json.item.id).to.be.a('string');\r

        \    });\r

        \r

        \    test('Has Cache-Control header', function() {\r

        \        expect(res.getHeader('Cache-Control')).to.include('private');\r

        \    });\r

        \r

        \    test('Has X-Request-Id header', function() {\r

        \        expect(res.getHeader('X-Request-Id')).to.be.a('string');\r

        \    });\r

        } else if (res.getStatus() === 404) {\r

        \    test('404 has NOT_FOUND code', function() {\r

        \        expect(json.code).to.eql('NOT_FOUND');\r

        \    });\r

        } else if (res.getStatus() === 503) {\r

        \    test('503 indicates DB issue', function() {\r

        \        expect(json.code).to.be.oneOf(['DB_NOT_CONFIGURED', 'DB_ERROR']);\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
