info:
  name: GET /api/v2/events/:id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('item is object with id', function() {

        \        expect(json.item).to.be.an('object');

        \        expect(json.item.id).to.be.a('string');

        \    });

        

        \    test('Has Cache-Control header', function() {

        \        expect(res.getHeader('Cache-Control')).to.include('private');

        \    });

        

        \    test('Has X-Request-Id header', function() {

        \        expect(res.getHeader('X-Request-Id')).to.be.a('string');

        \    });

        } else if (res.getStatus() === 404) {

        \    test('404 has NOT_FOUND code', function() {

        \        expect(json.code).to.eql('NOT_FOUND');

        \    });

        } else if (res.getStatus() === 503) {

        \    test('503 indicates DB issue', function() {

        \        expect(json.code).to.be.oneOf(['DB_NOT_CONFIGURED', 'DB_ERROR']);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
