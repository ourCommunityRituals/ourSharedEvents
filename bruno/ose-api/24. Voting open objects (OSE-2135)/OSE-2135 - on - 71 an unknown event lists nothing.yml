info:
  name: "OSE-2135 | on | an unknown event lists nothing"
  type: http
  seq: 71

http:
  method: GET
  url: "{{baseUrl}}/api/v2/vote/evt-ose-2135-no-such-event/objects"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') !== 'on') {
          console.log('NOT RUN (VOTING_ENABLED is off on this environment): the open-read half runs only while it is on');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        test('OSE-2135 on: an unknown event is the empty list', function () { expect(res.getStatus()).to.eql(200); expect(res.getBody()).to.eql({ objects: [] }); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
