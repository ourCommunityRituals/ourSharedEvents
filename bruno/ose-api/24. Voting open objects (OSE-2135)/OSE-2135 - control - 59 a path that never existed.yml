info:
  name: "OSE-2135 | control | a path that never existed is the router 404"
  type: http
  seq: 59

http:
  method: GET
  url: "{{baseUrl}}/api/v2/vote-never-was/objects"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2135 control: the router 404', function () { expect(res.getStatus()).to.eql(404); });
        bru.setVar('voteReadNowhere', JSON.stringify(res.getBody()));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
