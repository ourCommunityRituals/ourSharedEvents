info:
  name: "OSE-2135 | setup | add a second song, left in draft"
  type: http
  seq: 31

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteReadNightId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Read song two\", \"sort\": 1}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2135 setup: the second song is added, in draft', function () { expect(res.getStatus()).to.eql(201); expect(b.object.state).to.eql('draft'); });
        bru.setVar('voteReadSongTwoId', (b.object && b.object.id) || 'missing-song-two');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
