info:
  name: OSE-2234 | dates | the set closed with that edit
  type: http
  seq: 93

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteReadNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2234 dates: the set is closed', function () { expect(res.getStatus()).to.eql(200); expect(b.set.state).to.eql('closed'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
