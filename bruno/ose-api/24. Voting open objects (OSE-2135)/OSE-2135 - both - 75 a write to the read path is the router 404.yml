info:
  name: "OSE-2135 | both | a POST to the read path is the router 404"
  type: http
  seq: 75

http:
  method: POST
  url: "{{baseUrl}}/api/v2/vote/{{voteReadNightId}}/objects"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2135: a write to the read path does not exist', function () { expect(res.getStatus()).to.eql(404); expect(JSON.stringify(res.getBody())).to.not.contain('Read song'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
