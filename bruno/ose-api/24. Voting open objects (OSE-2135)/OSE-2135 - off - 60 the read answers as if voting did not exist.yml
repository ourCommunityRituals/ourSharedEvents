info:
  name: "OSE-2135 | off | with VOTING_ENABLED off the read is the router 404, byte for byte"
  type: http
  seq: 60

http:
  method: GET
  url: "{{baseUrl}}/api/v2/vote/{{voteReadNightId}}/objects"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') === 'on') {
          console.log('NOT RUN (VOTING_ENABLED is on on this environment): the switch-off half runs only while it is off');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const b = res.getBody();
        const text = JSON.stringify(b);
        test('OSE-2135 off: 404, the same answer as a path that never existed', function () { expect(res.getStatus()).to.eql(404); expect(text).to.eql(bru.getVar('voteReadNowhere')); });
        test('OSE-2135 off: no song, no id and no cookie in the answer', function () { expect(text).to.not.contain('Read song'); expect(text).to.not.contain(bru.getVar('voteReadSongOneId')); expect(res.getHeader('set-cookie')).to.be.undefined; });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
