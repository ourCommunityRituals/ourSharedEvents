info:
  name: "OSE-2135 | on | a closed song is not listed"
  type: http
  seq: 91

http:
  method: GET
  url: "{{baseUrl}}/api/v2/vote/{{voteReadNightId}}/objects"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') !== 'on') {
          console.log('NOT RUN (VOTING_ENABLED is off on this environment): the open-read half runs only while it is on');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        test('OSE-2135 on: after the refused close the song is still listed', function () { expect(res.getStatus()).to.eql(200); expect((res.getBody() || {}).objects).to.have.length(1); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
