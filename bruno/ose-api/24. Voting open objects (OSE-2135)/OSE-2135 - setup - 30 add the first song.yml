info:
  name: "OSE-2135 | setup | add the first song"
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteReadNightId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Read song one\", \"sort\": 0}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2135 setup: the first song is added', function () { expect(res.getStatus()).to.eql(201); });
        bru.setVar('voteReadSongOneId', (b.object && b.object.id) || 'missing-song-one');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
