info:
  name: OSE-2234 | dates | the night is moved back
  type: http
  seq: 94

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{voteReadNightId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"start_date\": \"2099-06-01\", \"end_date\": \"2099-06-01\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2234 dates: the date change is saved', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
