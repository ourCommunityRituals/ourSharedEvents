info:
  name: OSE-1955 | security | pre page | escaped alt, no handler, CSP, no cookie, no stored URL
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/thumb-pre-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const html = String(res.getBody() || '');
        const ids = ['pre-sponsor-strip', 'live-sponsor-strip', 'post-sponsor-thanks'];
        let start = -1;
        for (const id of ids) {
          const at = html.indexOf('data-testid="' + id + '"');
          if (at > -1) { start = at; break; }
        }
        const strip = start < 0 ? '' : html.slice(start, html.indexOf('</section>', start));
        const items = strip.split('data-testid="sponsor-item"').slice(1);
        const itemOf = (needle) => items.find((i) => i.includes(needle)) || '';
        const src = (id) => 'src="/api/v2/sponsors/' + id + '/logo?slot=sidebar"';
        test('OSE-1955 security: markup in the display name is escaped inside alt', function () {
          expect(itemOf('sb_thumb_xss')).to.include('alt="Thumb&quot; onerror=&quot;alert(1)"');
          expect(html).to.not.include('<script>alert(1)');
        });
        test('OSE-1955 security: no inline handler attribute anywhere in the strip', function () {
          const bare = strip.replace(/="[^"]*"/g, '=""');
          expect(/\son[a-z]+\s*=/i.test(bare)).to.eql(false);
        });
        test('OSE-1955 security: one img and one alt per art item (nothing broke out of alt)', function () {
          for (const it of items.filter((i) => i.includes('sponsor-thumb'))) {
            expect(it.split('<img ').length - 1).to.eql(1);
            expect(it.split(' alt="').length - 1).to.eql(1);
          }
        });
        test('OSE-1955 security: no stored logo URL and no credential reaches the page', function () {
          expect(html).to.not.include('avatars.githubusercontent.com');
          expect(html).to.not.include('127.0.0.1/ose-1955');
          expect(html).to.not.include('hunter2');
          expect(html).to.not.include('ose1955:');
        });
        test("OSE-1955 security: the CSP keeps img-src to 'self' data:", function () {
          const csp = String(res.getHeader('content-security-policy') || '');
          expect(csp).to.match(/(^|;)\s*img-src 'self' data:\s*(;|$)/);
          expect(csp).to.not.match(/script-src[^;]*unsafe-inline/);
        });
        test('OSE-1955 security: the event page sets no cookie', function () {
          expect(res.getHeader('set-cookie')).to.eql(undefined);
        });
        test('OSE-1955 security: every outbound sponsor link is https with noreferrer', function () {
          const anchors = strip.match(/<a [^>]*>/g) || [];
          expect(anchors.length).to.eql(8);
          for (const a of anchors) {
            const href = (a.match(/href="([^"]*)"/) || [])[1] || '';
            if (/^[a-z]+:/i.test(href)) {
              expect(href).to.match(/^https:\/\//);
              expect(a).to.match(/rel="[^"]*\bnoreferrer\b/);
            } else {
              expect(href).to.match(/^\/sponsors\//);
            }
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
