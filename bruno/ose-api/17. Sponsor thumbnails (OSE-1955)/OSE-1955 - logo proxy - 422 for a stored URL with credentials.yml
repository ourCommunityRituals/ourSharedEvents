info:
  name: OSE-1955 | fat-finger | logo proxy | 422 for a stored URL with credentials
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_thumb_creds/logo?slot=sidebar"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-1955 fat-finger: a URL carrying a user and password is never fetched (422)', function () { expect(res.getStatus()).to.eql(422); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
