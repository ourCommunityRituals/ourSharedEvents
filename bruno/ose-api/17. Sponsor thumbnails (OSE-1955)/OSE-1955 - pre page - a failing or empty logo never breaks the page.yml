info:
  name: OSE-1955 | rainy | pre page | a failing or empty logo never breaks the page
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/thumb-pre-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const html = String(res.getBody() || '');
        const ids = ['pre-sponsor-strip', 'live-sponsor-strip', 'post-sponsor-thanks'];
        let start = -1;
        for (const id of ids) {
          const at = html.indexOf('data-testid="' + id + '"');
          if (at > -1) { start = at; break; }
        }
        const strip = start < 0 ? '' : html.slice(start, html.indexOf('</section>', start));
        const items = strip.split('data-testid="sponsor-item"').slice(1);
        const itemOf = (needle) => items.find((i) => i.includes(needle)) || '';
        const src = (id) => 'src="/api/v2/sponsors/' + id + '/logo?slot=sidebar"';
        test('OSE-1955 rainy: a stored URL the proxy refuses still lists the sponsor (art, name as alt)', function () {
          expect(itemOf('sb_thumb_badurl')).to.include('alt="Thumb Bad Url"');
          expect(itemOf('sb_thumb_creds')).to.include('alt="Thumb Creds"');
        });
        test('OSE-1955 rainy: an empty logo URL is the name, and the page never names the proxy for it', function () {
          expect(itemOf('Thumb Empty Logo')).to.include('>Thumb Empty Logo</a>');
          expect(html).to.not.include('/api/v2/sponsors/sb_thumb_empty/logo');
        });
        test('OSE-1955 rainy: a sponsor that has not answered is not on the page', function () {
          expect(html).to.not.include('Thumb One Side');
          expect(html).to.not.include('sb_thumb_oneside');
        });
        test('OSE-1955 rainy: a javascript: website is never a link; the tap opens the sponsor card', function () {
          const it = itemOf('Thumb Js Site');
          expect(it).to.include('href="/sponsors/sb_thumb_jsweb"');
          expect(html).to.not.include('javascript:alert');
        });
        test('OSE-1955 rainy: exactly the eight on-show sponsors, in one list', function () {
          expect(items.length).to.eql(8);
          expect(html.split('data-testid="sponsor-list"').length - 1).to.eql(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
