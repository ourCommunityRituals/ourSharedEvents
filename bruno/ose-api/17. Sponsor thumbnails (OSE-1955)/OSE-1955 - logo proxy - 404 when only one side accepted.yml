info:
  name: OSE-1955 | rainy | logo proxy | 404 when only one side accepted
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_thumb_oneside/logo?slot=sidebar"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-1955 rainy: the sponsor has not answered, so its logo is not served (404, ADR-019)', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
