info:
  name: OSE-1955 | rainy | logo proxy | 404 when the event switch is off
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_thumb_switchoff/logo?slot=sidebar"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-1955 rainy: useSponsors off, so the logo is not served (404, OSE-1900)', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
