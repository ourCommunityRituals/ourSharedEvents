info:
  name: OSE-2014 | sunny | promote | promotion changed no date of the first try
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/series-ci-try1-evt"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const item = (res.getBody() || {}).item || {};
        test('OSE-2014 sunny: promote: date, end date, zone and title are exactly as before', function () {
          expect(res.getStatus()).to.eql(200);
          expect(JSON.stringify([item.start_date, item.end_date, item.timezone, item.title])).to.eql(bru.getVar('seriesTry1Before'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
