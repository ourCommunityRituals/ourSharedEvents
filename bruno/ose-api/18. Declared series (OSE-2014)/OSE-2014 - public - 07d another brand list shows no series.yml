info:
  name: OSE-2014 | rainy | public | another brand sees none of this brand's series
  type: http
  seq: 78

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events?brand=series-ci-other"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2014 rainy: public: the other brand\'s series map is empty', function () { expect(res.getStatus()).to.eql(200); expect(b.series).to.eql({}); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
