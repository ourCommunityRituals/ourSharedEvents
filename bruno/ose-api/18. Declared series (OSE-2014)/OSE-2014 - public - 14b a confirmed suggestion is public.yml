info:
  name: OSE-2014 | sunny | public | once confirmed, the suggestion shows publicly under its new name
  type: http
  seq: 145

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/series-ci-sugg-evt"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = (res.getBody() || {}).series || {};
        test('OSE-2014 sunny: public: the confirmed series shows, with the name the organizer gave', function () { expect(res.getStatus()).to.eql(200); expect(s.id).to.eql('evtsrs_ci_suggest'); expect(s.name).to.eql('Thursday bocce'); });
        test('OSE-2014 sunny: public: it does not say it was detected', function () { expect(JSON.stringify(s)).to.not.include('detected'); expect(s).to.not.have.property('origin'); expect(s).to.not.have.property('state'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
