info:
  name: OSE-2014 | sunny | attach | detach takes one event off the series
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-try2-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 sunny: attach: detach: 200, and it names the event', function () { expect(res.getStatus()).to.eql(200); expect(res.getBody().detached).to.eql(['series-ci-try2-evt']); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
