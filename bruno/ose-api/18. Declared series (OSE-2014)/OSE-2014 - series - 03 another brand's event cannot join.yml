info:
  name: OSE-2014 | rainy | brand | declare naming another brand's event is refused whole
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-anchor-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"name":"The daily room","cadence":"weekly","day_of_week":1,"hour_of_day":17,"event_ids":["series-ci-try1-evt","series-ci-other-evt"]}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: brand: 404 EVENT_NOT_FOUND, the same as an unknown id', function () { expect(res.getStatus()).to.eql(404); expect(res.getBody().code).to.eql('EVENT_NOT_FOUND'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
