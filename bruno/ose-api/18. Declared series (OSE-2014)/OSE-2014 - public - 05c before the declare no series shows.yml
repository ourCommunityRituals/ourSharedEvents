info:
  name: OSE-2014 | rainy | public | before the declare the public read shows no series
  type: http
  seq: 57

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/series-ci-anchor-evt"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2014 rainy: public: series is null for an event on no series', function () { expect(res.getStatus()).to.eql(200); expect(b).to.have.property('series'); expect(b.series).to.eql(null); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
