info:
  name: OSE-2014 | sunny | promote | promotion changed no count of the first try
  type: http
  seq: 85

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-try1-evt/pre-event-activity"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const a = (res.getBody() || {}).activity || {};
        test('OSE-2014 sunny: promote: posters, places, scans and taps are exactly as before', function () {
          expect(res.getStatus()).to.eql(200);
          expect(JSON.stringify([a.posters, a.places, a.scans, a.clicks])).to.eql(bru.getVar('seriesTry1CountsBefore'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
