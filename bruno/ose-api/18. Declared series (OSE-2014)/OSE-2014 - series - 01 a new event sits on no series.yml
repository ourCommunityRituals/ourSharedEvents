info:
  name: OSE-2014 | sunny | read | an event sits on no series, and its brand has two suggestions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-anchor-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2014 sunny: read: 200', function () { expect(res.getStatus()).to.eql(200); expect(b.ok).to.eql(true); });
        test('OSE-2014 sunny: read: the event sits on no series', function () { expect(b.series).to.eql(null); });
        test('OSE-2014 sunny: read: both pending suggestions of the brand are listed', function () {
          const ids = (b.suggestions || []).map(function (s) { return s.id; }).sort();
          expect(ids).to.eql(['evtsrs_ci_decline', 'evtsrs_ci_suggest']);
          (b.suggestions || []).forEach(function (s) { expect(s.state).to.eql('pending'); expect(s.origin).to.eql('detected'); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
