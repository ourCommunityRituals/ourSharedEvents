info:
  name: OSE-2014 | rainy | public | a pending suggestion is not shown publicly
  type: http
  seq: 135

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/series-ci-sugg-evt"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: public: series is null while the suggestion is pending', function () { expect(res.getStatus()).to.eql(200); expect(res.getBody().series).to.eql(null); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
