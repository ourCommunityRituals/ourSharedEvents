info:
  name: OSE-2014 | rainy | attach | a suggestion cannot be joined before it is confirmed
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-sugg-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"series_id":"evtsrs_ci_suggest"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: attach: 409 SERIES_NOT_CONFIRMED', function () { expect(res.getStatus()).to.eql(409); expect(res.getBody().code).to.eql('SERIES_NOT_CONFIRMED'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
