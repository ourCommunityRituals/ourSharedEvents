info:
  name: OSE-2014 | rainy | confirm | a suggestion already decided cannot be confirmed
  type: http
  seq: 170

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-sugg-evt/series/confirm"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"series_id":"evtsrs_ci_decline"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: confirm: 409 SERIES_NOT_PENDING', function () { expect(res.getStatus()).to.eql(409); expect(res.getBody().code).to.eql('SERIES_NOT_PENDING'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
