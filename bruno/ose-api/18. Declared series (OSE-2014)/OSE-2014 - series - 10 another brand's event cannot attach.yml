info:
  name: OSE-2014 | rainy | brand | another brand's event cannot attach to this brand's series
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-other-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"series_id":"{{declaredSeriesId}}"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: brand: 404 SERIES_NOT_FOUND', function () { expect(res.getStatus()).to.eql(404); expect(res.getBody().code).to.eql('SERIES_NOT_FOUND'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
