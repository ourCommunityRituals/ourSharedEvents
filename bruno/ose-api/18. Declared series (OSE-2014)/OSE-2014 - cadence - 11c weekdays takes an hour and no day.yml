info:
  name: OSE-2014 | sunny | cadence | a weekdays series takes an hour and no day
  type: http
  seq: 114

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-try2-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"name":"Weekday room","cadence":"daily-weekdays","hour_of_day":17}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = (res.getBody() || {}).series || {};
        test('OSE-2014 sunny: cadence: 201, daily-weekdays, no day, hour 17', function () { expect(res.getStatus()).to.eql(201); expect(s.cadence).to.eql('daily-weekdays'); expect(s.day_of_week).to.eql(null); expect(s.hour_of_day).to.eql(17); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
