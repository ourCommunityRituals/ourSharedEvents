info:
  name: OSE-2014 | rainy | never who | declare with a per-attendee field is refused
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-anchor-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"name":"The daily room","cadence":"weekly","day_of_week":1,"hour_of_day":17,"email":"someone@example.com"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: never who: 400 UNKNOWN_FIELD', function () { expect(res.getStatus()).to.eql(400); expect(res.getBody().code).to.eql('UNKNOWN_FIELD'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
