info:
  name: OSE-2014 | rainy | declare | an event already on a series cannot be declared again
  type: http
  seq: 90

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-anchor-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"name":"The daily room","cadence":"weekly","day_of_week":1,"hour_of_day":17}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2014 rainy: declare: 409 ALREADY_IN_SERIES', function () { expect(res.getStatus()).to.eql(409); expect(res.getBody().code).to.eql('ALREADY_IN_SERIES'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
