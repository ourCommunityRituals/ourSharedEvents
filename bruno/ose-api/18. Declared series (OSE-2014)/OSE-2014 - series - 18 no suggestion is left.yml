info:
  name: OSE-2014 | sunny | read | both suggestions are decided, so none is left pending
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/series-ci-sugg-evt/series"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2014 sunny: read: no pending suggestion is left', function () { expect(res.getStatus()).to.eql(200); expect(b.suggestions).to.eql([]); });
        test('OSE-2014 sunny: read: the event sits on the confirmed suggestion', function () { expect(b.series.id).to.eql('evtsrs_ci_suggest'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
