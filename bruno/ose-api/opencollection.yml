opencollection: 1.0.0
info:
  name: OSE API — Contract
request:
  scripts:
  - type: before-request
    code: |-
      // Collection-level pre-request: set timing for latency measurement
      bru.setVar('requestStartTime', Date.now());

      // If ocrInternalSecret is set, prefer X-OCR-Internal header over Bearer.
      // A request that declares X-Test-No-Auth opts OUT of this collection-wide
      // injection so negative/unauthenticated tests are genuinely credential-less
      // (OSE-1191: the blanket inject was silently authenticating the no-auth test).
      var ocrSecret = bru.getEnvVar('ocrInternalSecret');
      if (ocrSecret && !req.getHeader('X-Test-No-Auth')) {
          req.setHeader('X-OCR-Internal', ocrSecret);
      }
  - type: after-response
    code: |-
      // Collection-level test: measure latency on every request
      const elapsed = Date.now() - bru.getVar('requestStartTime');
      const isAdminRegistrationsRead = req.getPath().includes('/forms/registrations');
       // Admin registrations decrypts organizer-visible attendee names before responding;
       // live staging can exceed the generic API budget while still staying usable.
       if (isAdminRegistrationsRead) {
           test(`Response time < 9000ms (actual: ${elapsed}ms)`, function() {
               expect(elapsed).to.be.below(9000);
           });
       } else {
           test(`Response time < 6000ms (actual: ${elapsed}ms)`, function() {
               expect(elapsed).to.be.below(6000);
           });
       }

      // Verify JSON content-type on API responses
      // Skip: CORS preflight (204 no body), CF Access blocks (HTML instead of JSON)
      const isApiPath = req.getPath().startsWith('/api') || req.getPath() === '/health';
      const isCorsOptions = req.getMethod() === 'OPTIONS';
      const ct = (res.getHeader('Content-Type') || '');
      const isCfAccessBlocked = ct.includes('text/html') && !ct.includes('application/json');
      if (isApiPath && !isCorsOptions && !isCfAccessBlocked) {
          test('Content-Type is application/json', function() {
              expect(ct).to.include('application/json');
          });
      }

      // Invariant #6 — Inert Monetization Hooks: every Worker response must carry
      // X-Monetization-Inert: true. The header is set in index.ts fetch() wrapper,
      // so it appears on every route — success, error, and 404. Skipped only when
      // Cloudflare Access intercepts the request (worker never ran).
      if (!isCorsOptions && !isCfAccessBlocked) {
          test('Invariant #6: X-Monetization-Inert: true on every Worker response', function() {
              expect(res.getHeader('X-Monetization-Inert')).to.eql('true');
          });
      }
docs:
  content: |-
    Complete API collection for ourSharedEvents Worker.
    Separated from frontend pages. Covers: Health, Public Events, Admin Events, Forms (4 types), Feature Flags (8 endpoints).

    Requires: OSE - Staging environment.
  type: text/markdown
bundled: false
extensions: {}
