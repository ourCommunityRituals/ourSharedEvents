opencollection: 1.0.0
info:
  name: OSE API — Contract
request:
  scripts:
  - type: before-request
    code: |-
      // ADR-021 (OSE-906): production is read-only for tests. Writes may only go to
      // a known non-production host; anything else (production, an unknown host, or
      // a URL that does not parse cleanly) is refused before it is sent.
      (function () {
        var WRITE_HOSTS = ['stg.oursharedevents.com', 'localhost', '127.0.0.1'];
        function host(url) {
          var m = /^[a-z][a-z0-9+.-]*:\/\/([^\/?#]*)/i.exec(String(url || ''));
          if (!m) return null;
          var h = m[1].slice(m[1].lastIndexOf('@') + 1).replace(/:\d*$/, '');
          return h.toLowerCase().replace(/\.$/, '');
        }
        var method = String(req.getMethod() || '').toUpperCase();
        if (['GET', 'HEAD', 'OPTIONS'].indexOf(method) !== -1) return;
        var targets = [bru.getEnvVar('baseUrl'), req.getUrl()].map(host).filter(function (h) {
          return h !== null;
        });
        var allowed = targets.length > 0 && targets.every(function (h) {
          return WRITE_HOSTS.indexOf(h) !== -1;
        });
        if (!allowed) {
          throw new Error('ADR-021: tests write only to staging or localhost; refusing ' + method + ' ' + req.getUrl());
        }
      })();

      // Collection-level pre-request: set timing for latency measurement
      bru.setVar('requestStartTime', Date.now());

      // If ocrInternalSecret is set, prefer X-OCR-Internal header over Bearer.
      // A request that declares X-Test-No-Auth opts OUT of this collection-wide
      // injection so negative/unauthenticated tests are genuinely credential-less
      // (OSE-1191: the blanket inject was silently authenticating the no-auth test).
      var ocrSecret = bru.getEnvVar('ocrInternalSecret');
      if (ocrSecret && !req.getHeader('X-Test-No-Auth')) {
          req.setHeader('X-OCR-Internal', ocrSecret);
      }
  - type: after-response
    code: |-
      // OSE-2090: a 5xx keeps what finds it again in the Worker's logs: the status,
      // the error code and the request id. Never the URL (a signed link is a
      // credential) and never the body. A value prints only when it has the shape of
      // a code or an id; anything else prints as '-'.
      (function () {
        // Never let this block cost a request its other checks.
        try {
          var status = res.getStatus();
          if (!(status >= 500)) return;
          var body = res.getBody();
          var json = body && typeof body === 'object' ? body : {};
          var code = typeof json.code === 'string' && /^[A-Z][A-Z0-9_]{0,63}$/.test(json.code) ? json.code : '-';
          var rid = res.getHeader('X-Request-Id');
          if (typeof rid !== 'string' || rid === '') rid = json.requestId;
          rid = typeof rid === 'string' && /^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|req-[0-9]{1,16})$/i.test(rid) ? rid : '-';
          var method = String(req.getMethod() || '').toUpperCase();
          console.log('[5xx] ' + (/^[A-Z]{1,10}$/.test(method) ? method : '-') + ' status=' + status + ' code=' + code + ' requestId=' + rid);
        } catch (e) {
          console.log('[5xx] diagnostics failed: ' + (e && /^[A-Za-z]{1,40}$/.test(e.name) ? e.name : 'Error'));
        }
      })();
      
      // Collection-level test: a latency budget on every request (OSE-2091).
      // One slow sample is retried or allowed, never the gate on its own; a slow
      // retry, a sample at 2x budget or a third slow sample in the run fails.
      // Rules: lib/latency-budget.js.
      const elapsed = Date.now() - bru.getVar('requestStartTime');
      // Admin registrations decrypts organizer-visible attendee names before responding;
      // live staging can exceed the generic API budget while still staying usable.
      const isAdminRegistrationsRead = req.getPath().includes('/forms/registrations');
      await require('./lib/latency-budget.js').enforce({
          bru: bru, req: req, res: res, test: test, expect: expect,
          elapsed: elapsed,
          budget: isAdminRegistrationsRead ? 9000 : 6000
      });

      // Verify JSON content-type on API responses
      // Skip: CORS preflight (204 no body), CF Access blocks (HTML instead of JSON),
      // and the sponsor image routes under /api: the logo proxy and the asset route
      // serve image bytes, or an empty-bodied 404/502 (OSE-1432).
      const isImageRoute = /^\/api\/v2\/sponsors\/[^/]+\/(logo|asset\/)/.test(req.getPath());
      const isApiPath = (req.getPath().startsWith('/api') && !isImageRoute) || req.getPath() === '/health';
      const isCorsOptions = req.getMethod() === 'OPTIONS';
      const ct = (res.getHeader('Content-Type') || '');
      const isCfAccessBlocked = ct.includes('text/html') && !ct.includes('application/json');
      if (isApiPath && !isCorsOptions && !isCfAccessBlocked) {
          test('Content-Type is application/json', function() {
              expect(ct).to.include('application/json');
          });
      }

      // Invariant #6 — Inert Monetization Hooks: every Worker response must carry
      // X-Monetization-Inert: true. The header is set in index.ts fetch() wrapper,
      // so it appears on every route — success, error, and 404. Skipped only when
      // Cloudflare Access intercepts the request (worker never ran).
      if (!isCorsOptions && !isCfAccessBlocked) {
          test('Invariant #6: X-Monetization-Inert: true on every Worker response', function() {
              expect(res.getHeader('X-Monetization-Inert')).to.eql('true');
          });
      }
docs:
  content: |-
    Complete API collection for ourSharedEvents Worker.
    Separated from frontend pages. Covers: Health, Public Events, Admin Events, Forms (4 types), Feature Flags (8 endpoints).

    Requires: OSE - Staging environment.
  type: text/markdown
bundled: false
extensions: {}
