info:
  name: "OSE-2225 | refuse | an email address is off limits, and the answer names the rule"
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{offLimitsEventId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"entry\", \"label\": \"Painting by ann@example.com\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2225 refuse: 400 INVALID_LABEL, rule email, in plain words', function () { expect(res.getStatus()).to.eql(400); expect(b.code).to.eql('INVALID_LABEL'); expect(b.rule).to.eql('email'); expect(b.error).to.contain('an email address'); expect(b.error).to.contain('Name the work, not the person who made it.'); expect(JSON.stringify(b)).to.not.contain('ann@example.com'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
