info:
  name: "OSE-2095 | stock | the /?zip=60655 count is unchanged"
  type: http
  seq: 60

http:
  method: GET
  url: "{{baseUrl}}/?zip=60655"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // OSE-2137: the pages leg publishes zip-own-* fixtures in these places while this
        // leg runs; a stock count must not see them come or go. Real events still count.
        const n = (String(res.getBody()).match(/data-event-id="(?!zip-own-)/g) || []).length;
        test('OSE-2095 stock: the /?zip=60655 count is unchanged', function () { expect(String(n)).to.eql(bru.getVar('w1StockZipBefore')); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
