info:
  name: "OSE-2095 | fill-in | a town with many ZIPs fills nothing"
  type: http
  seq: 51

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/zip-suggest"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"address\":\"1 Main St, Blue Island, IL\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2095 fill-in (many ZIPs): no ZIP', function () { expect(res.getStatus()).to.eql(200); expect(b.zip).to.eql(null); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
