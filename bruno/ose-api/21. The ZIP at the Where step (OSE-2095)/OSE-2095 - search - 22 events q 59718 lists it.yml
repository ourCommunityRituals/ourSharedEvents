info:
  name: "OSE-2095 | search | /events?q=59718 lists it"
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/events?q=59718"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = String(res.getBody());
        test('OSE-2095 search: /events?q=59718 answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: /events lists it under its ZIP', function () { expect(body).to.include("OSE-2095 Zip Check Night (staging, synthetic)"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
