info:
  name: "OSE-2095 | search | /?where=Bozeman, MT lists it"
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/?where=Bozeman%2C%20MT"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = String(res.getBody());
        // OSE-2146: match this run's own card by its id, never the title every run
        // shares: a stopped run's leftover has the same title (run 44338955374).
        const runId = String(bru.getVar('w1ZipEventId') || '');
        const ownCard = 'data-event-id="' + runId + '"';
        test('OSE-2095 search: /?where=Bozeman%2C%20MT answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: the landing lists it under its town', function () { expect(body).to.include(ownCard); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
