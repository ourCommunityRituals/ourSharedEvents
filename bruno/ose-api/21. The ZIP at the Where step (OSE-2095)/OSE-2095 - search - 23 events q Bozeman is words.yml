info:
  name: "OSE-2095 | search | /events?q=Bozeman, MT is a words search, not a town"
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/events?q=Bozeman%2C%20MT"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // /events?q= reads a town only from its own short list (lib/place-names.ts
        // PLACES, the south-side towns); any other text is a words search over the
        // title and venue. The nationwide town search is the landing's ?where= (seq
        // 24), and /events finds this event by its ZIP (seq 22). Should /events
        // learn every town, this goes red on purpose: then it lists the event.
        const body = String(res.getBody());
        test('OSE-2095 search: /events?q=Bozeman%2C%20MT answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: /events reads "Bozeman, MT" as words, so the event (no such words in its title) is not listed', function () { expect(body).to.not.include("OSE-2095 Zip Check Night (staging, synthetic)"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
