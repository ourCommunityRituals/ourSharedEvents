info:
  name: "OSE-2095 | search | /events?q=Bozeman, MT is a words search, not a town"
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/events?q=Bozeman%2C%20MT"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // /events?q= reads a town only from its own short list (lib/place-names.ts
        // PLACES, the south-side towns); any other text is a words search over the
        // title and venue. The nationwide town search is the landing's ?where= (seq
        // 24), and /events finds this event by its ZIP (seq 22). Should /events
        // learn every town, this goes red on purpose: then it lists the event.
        const body = String(res.getBody());
        // OSE-2146: match this run's own card by its id, never the title every run
        // shares: a stopped run's leftover has the same title (run 44338955374).
        const runId = String(bru.getVar('w1ZipEventId') || '');
        const ownCard = 'data-event-id="' + runId + '"';
        test('OSE-2095 search: this run has its event id', function () { expect(runId).to.match(/^evt_[0-9a-f-]{36}$/); });
        test('OSE-2095 search: /events?q=Bozeman%2C%20MT answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: /events reads "Bozeman, MT" as words, so the event (no such words in its title) is not listed', function () { expect(body).to.not.include(ownCard); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
