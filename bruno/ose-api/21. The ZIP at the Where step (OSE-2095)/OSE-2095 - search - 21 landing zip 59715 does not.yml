info:
  name: "OSE-2095 | search | /?zip=59715 does not list it"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/?zip=59715"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = String(res.getBody());
        test('OSE-2095 search: /?zip=59715 answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: not listed under another ZIP of the same town', function () { expect(body).to.not.include("OSE-2095 Zip Check Night (staging, synthetic)"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
