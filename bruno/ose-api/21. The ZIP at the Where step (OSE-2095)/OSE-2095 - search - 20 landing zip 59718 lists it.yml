info:
  name: "OSE-2095 | search | /?zip=59718 lists the event by its ZIP"
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/?zip=59718"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = String(res.getBody());
        test('OSE-2095 search: /?zip=59718 answers 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2095 search: the event with no cell is listed under its own ZIP', function () { expect(body).to.include("OSE-2095 Zip Check Night (staging, synthetic)"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
