info:
  name: "OSE-2095 | stock | the /events?q=Oak Lawn count before this run"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/events?q=Oak%20Lawn"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const n = (String(res.getBody()).match(/data-event-id="/g) || []).length;
        test('OSE-2095 stock: /events?q=Oak Lawn answers', function () { expect(res.getStatus()).to.eql(200); });
        bru.setVar('w1StockTownBefore', String(n));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
