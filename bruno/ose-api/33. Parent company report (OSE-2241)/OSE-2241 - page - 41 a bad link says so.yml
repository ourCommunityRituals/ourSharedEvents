info:
  name: "OSE-2241 | rainy | page | a bad link says so and shows nothing"
  type: http
  seq: 41

http:
  method: GET
  url: "{{baseUrl}}/family-report?token=not-a-link"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2241 rainy page: 401, nothing of the family', function () {
          expect(res.getStatus()).to.eql(401);
          expect(String(res.getBody())).to.not.contain('Lakeside');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
