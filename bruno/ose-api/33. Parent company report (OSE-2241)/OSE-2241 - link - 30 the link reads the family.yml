info:
  name: "OSE-2241 | link | a corporate sponsor reads the family by the link"
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/api/v2/family-report"
  headers:
    - name: Authorization
      value: "Bearer {{familyReportToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2241 link: 200, the parent and its ventures, practice data marked', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.family.parent).to.eql('lakeside-co');
          expect(b.family.ventures).to.include('lakeside-club');
          expect(b.scope.data_class).to.eql('all');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
