info:
  name: "OSE-1420 | go-live evidence | cleanup: the event is archived"
  type: http
  seq: 27

# The run leaves no live event behind.
http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{goLiveEvidenceEventId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"status":"archived"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('OSE-1420 cleanup: the event is archived', function () {
          expect(res.getStatus()).to.eql(200);
          expect((res.getBody() || {}).from).to.eql('active');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
