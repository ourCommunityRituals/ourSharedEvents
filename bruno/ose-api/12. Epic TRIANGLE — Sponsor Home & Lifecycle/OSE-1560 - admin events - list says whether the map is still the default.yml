info:
  name: OSE-1560 | admin events | each item says whether the map is still at its default
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events?limit=5"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract: the admin list carries is_published (the map setting) and
        // map_default (1 while the organizer has not chosen it), never the raw
        // settings blob. The status panel states the setting from these two.
        test('200 ok', function () { expect(res.getStatus()).to.eql(200); expect(res.getBody().ok).to.eql(true); });
        test('every item carries the map setting and its default flag', function () {
          var items = res.getBody().items;
          expect(items).to.be.an('array');
          items.forEach(function (e) {
            expect(e).to.have.property('is_published');
            expect([0, 1]).to.include(e.map_default);
            expect(e).to.not.have.property('settings_json');
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
