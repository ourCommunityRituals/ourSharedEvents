info:
  name: OSE-1564 | toast script | 200 same-origin JavaScript
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/ui-toast.js"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract (router.ts, /ui-toast.js): the @ocr/ui toast script that admin and
        // sponsor home load. Public, JavaScript, revalidated by ETag, no cookie.
        const toastJs = String(res.getBody() || '');
        test('200', function () { expect(res.getStatus()).to.eql(200); });
        test('Content-Type is text/javascript', function () { expect(String(res.getHeader('content-type') || '')).to.match(/^text\/javascript/); });
        test('X-Content-Type-Options: nosniff', function () { expect(String(res.getHeader('x-content-type-options') || '')).to.eql('nosniff'); });
        test('Cross-Origin-Resource-Policy: same-origin', function () { expect(String(res.getHeader('cross-origin-resource-policy') || '')).to.eql('same-origin'); });
        test('revalidates: no-cache and an ETag for this script', function () {
          expect(String(res.getHeader('cache-control') || '')).to.eql('no-cache');
          expect(String(res.getHeader('etag') || '')).to.match(/^"ocr-toast-[0-9a-f]{8}"$/);
        });
        test('sets no cookie', function () { expect(res.getHeader('set-cookie')).to.be.oneOf([undefined, null, '']); });
        test('the body is the toast runtime', function () { expect(toastJs).to.contain('root.ocrToast = {'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
