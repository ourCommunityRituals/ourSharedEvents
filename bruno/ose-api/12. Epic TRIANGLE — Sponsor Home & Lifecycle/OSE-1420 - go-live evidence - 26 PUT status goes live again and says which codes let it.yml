info:
  name: "OSE-1420 | go-live evidence | PUT status (archived to active) answers with a receipt"
  type: http
  seq: 26

# The second door: PUT status, here on the archived to active edge ("Go live
# again"). It makes the same read verify-qr makes and answers with the same
# receipt.
http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{goLiveEvidenceEventId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"status":"active"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        const b = res.getBody() || {};
        test('OSE-1420 PUT status: 200, moved from archived', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.ok).to.eql(true);
          expect(b.from).to.eql('archived');
        });

        test('OSE-1420 PUT status: the receipt counts one working link and no poster', function () {
          expect(b.evidence).to.be.an('object');
          expect(b.evidence.shortlinks).to.eql(1);
          expect(b.evidence.active_deployments).to.eql(0);
        });
        test('OSE-1420 PUT status: the receipt has two keys, and no scan count', function () {
          expect(Object.keys(b.evidence || {}).sort()).to.eql(['active_deployments', 'shortlinks']);
          expect(JSON.stringify(b)).to.not.match(/scan/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
