info:
  name: OSE-1420 | code ledger | 404 on unknown event
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/evt_does_not_exist/code-ledger"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        const ct = (res.getHeader('Content-Type') || '');
        if (!ct.includes('application/json')) {
          test('CF Access blocked — admin route protected', function () { expect([200, 302, 403]).to.include(res.getStatus()); });
          return;
        }
        test('404 on unknown event', function () { expect(res.getStatus()).to.eql(404); });
        test('code is NOT_FOUND', function () { expect(res.getBody().code).to.eql('NOT_FOUND'); });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
