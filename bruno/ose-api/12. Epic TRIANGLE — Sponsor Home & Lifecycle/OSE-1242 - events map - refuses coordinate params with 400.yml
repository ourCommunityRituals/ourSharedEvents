info:
  name: OSE-1242 | events/map | refuses coordinate-shaped params (400)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/map?lat=41.69&lon=-87.67"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Invariant #1 by construction: the attendee map is CELL-scoped only. A
        // coordinate-shaped param (lat/lon) is refused with 400 — the endpoint
        // never accepts point precision (never-who: geography is the anonymizer).
        test('400 on coordinate-shaped params', function () { expect(res.getStatus()).to.eql(400); });
        const json = res.getBody();
        test('ok is false', function () { expect(json.ok).to.eql(false); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
