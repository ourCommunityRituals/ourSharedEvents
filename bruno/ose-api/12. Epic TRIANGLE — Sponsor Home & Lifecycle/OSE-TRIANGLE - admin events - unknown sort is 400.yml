info:
  name: TRIANGLE | admin events | unknown sort is 400
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events?sort=title"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract: an unknown sort is refused, never silently the default.
        test('400 INVALID_SORT', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('INVALID_SORT');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
