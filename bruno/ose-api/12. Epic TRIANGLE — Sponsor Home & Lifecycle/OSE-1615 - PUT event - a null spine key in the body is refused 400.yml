info:
  name: OSE-1615 | admin events | PUT with event_correlation_id null is refused (400)
  type: http
  seq: 16

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"event_correlation_id":null}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract: a client cannot clear a spine key either. Naming the field is
        // what is refused, whatever the value.
        test('400 SERVER_COMPUTED_FIELD', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('SERVER_COMPUTED_FIELD');
        });
        test('the answer names the field that was refused', function () {
          expect(String(res.getBody().error)).to.include('event_correlation_id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
