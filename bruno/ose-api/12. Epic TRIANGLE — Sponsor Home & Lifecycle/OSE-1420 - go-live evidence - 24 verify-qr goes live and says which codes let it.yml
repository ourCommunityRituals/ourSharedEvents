info:
  name: "OSE-1420 | go-live evidence | verify-qr goes live and answers with a receipt"
  type: http
  seq: 24

# verify-qr is one of two doors into active (PUT status is the other); both read
# the event's codes first. The 200 carries the counts as a receipt: links and
# posters, which are things, so the counts are exact. No scan count is returned.
http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{goLiveEvidenceEventId}}/verify-qr"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        const b = res.getBody() || {};
        test('OSE-1420 verify-qr: 200, the event is active', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.ok).to.eql(true);
          expect(b.event.status).to.eql('active');
          expect(b.event.qrVerified).to.eql(true);
        });

        test('OSE-1420 verify-qr: the receipt counts one working link and no poster', function () {
          expect(b.evidence).to.be.an('object');
          expect(b.evidence.shortlinks).to.eql(1);
          expect(b.evidence.active_deployments).to.eql(0);
        });
        test('OSE-1420 verify-qr: the receipt has two keys, and no scan count', function () {
          expect(Object.keys(b.evidence || {}).sort()).to.eql(['active_deployments', 'shortlinks']);
          expect(JSON.stringify(b)).to.not.match(/scan/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
