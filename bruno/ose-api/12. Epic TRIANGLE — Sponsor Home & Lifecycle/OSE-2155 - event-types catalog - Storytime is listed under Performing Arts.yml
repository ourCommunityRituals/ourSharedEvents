info:
  name: OSE-2155 | event-types | Storytime under Performing Arts
  type: http
  seq: 33

http:
  method: GET
  url: '{{baseUrl}}/api/v2/admin/event-types'
  headers:
    - name: CF-Access-Client-Id
      value: '{{cfAccessClientId}}'
    - name: CF-Access-Client-Secret
      value: '{{cfAccessClientSecret}}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('200 OK', function () { expect(res.getStatus()).to.eql(200); });
        const json = res.getBody() || {};
        // Part of OSE-2155 (migration 0115): Storytime is adults telling stories
        // aloud, a type of its own beside an unchanged Storytelling Night.
        const per = (json.categories || []).find(function (c) { return c.code === 'PER'; }) || { types: [] };
        const find = function (uec) {
          return per.types.find(function (t) { return t.uec_code === uec; });
        };
        test('Storytime (PER-STORYTIME-001) is listed under Performing Arts', function () {
          const t = find('PER-STORYTIME-001');
          expect(t, 'PER-STORYTIME-001 in PER').to.be.an('object');
          expect(t.id).to.eql('etr-per-storytime');
          expect(t.name).to.eql('Storytime');
        });
        test('Storytelling Night (PER-STORY-001) is still there, unchanged', function () {
          const t = find('PER-STORY-001');
          expect(t, 'PER-STORY-001 in PER').to.be.an('object');
          expect(t.name).to.eql('Storytelling Night');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
