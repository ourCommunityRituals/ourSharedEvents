info:
  name: OSE-1344 | event-types | GET Category→Type catalog
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/event-types"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('200 OK', function () { expect(res.getStatus()).to.eql(200); });
        const json = res.getBody();
        test('ok envelope', function () { expect(json.ok).to.eql(true); });
        // OSE-1344: the catalog groups Types under UEC Categories; unmapped types
        // fall under "Other" and are never dropped (orphans counted, 0 on seed).
        const cats = json.categories || json.items;
        test('returns a non-empty category catalog (array)', function () {
          expect(cats).to.be.an('array').that.is.not.empty;
        });
        test('orphans are counted, not dropped', function () {
          if (json.orphans !== undefined) expect(json.orphans).to.be.a('number');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
