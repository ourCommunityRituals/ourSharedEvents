info:
  name: GET Check-in Count
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/forms/checkin-count"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has count field (number when >= K-anon floor, else suppressed to null)', function() {

        \        // Below K=5 the count is withheld (null + suppressed), never zero. A fresh

        \        // database is below the floor; staging only has a number from accumulated smoke check-ins.

        \        if (json.suppressed) {

        \            expect(json.count).to.eql(null);

        \            expect(json.floor).to.eql(5);

        \        } else {

        \            expect(json.count).to.be.a('number');

        \        }

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
