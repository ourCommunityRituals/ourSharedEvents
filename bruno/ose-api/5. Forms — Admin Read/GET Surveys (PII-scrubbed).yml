info:
  name: GET Surveys (PII-scrubbed)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/forms/surveys"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has items or surveys array', function() {

        \        const data = json.items;

        \        expect(data).to.be.an('array');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
