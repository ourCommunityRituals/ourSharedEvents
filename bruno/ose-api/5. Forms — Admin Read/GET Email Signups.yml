info:
  name: GET Email Signups
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/forms/email-signups"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has count field (number when >= K-anon floor, else suppressed to null)', function() {

        \        // OSE-665 uniform count floor: below K=5 the exact count is

        \        // suppressed to null (never-who / anti-composition). Certify the

        \        // floor holds, do not contradict it by demanding a raw number.

        \        if (json.suppressed) {

        \            expect(json.count).to.equal(null);

        \            expect(json.floor).to.be.a('number');

        \        } else {

        \            expect(json.count).to.be.a('number');

        \        }

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
