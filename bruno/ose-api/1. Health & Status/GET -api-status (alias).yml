info:
  name: GET /api/status (alias)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/status"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        test('Status is 200', function() {

        \    expect(res.getStatus()).to.equal(200);

        });

        

        test('Same shape as /health', function() {

        \    expect(json).to.include.keys('ok', 'env', 'version', 'db', 'timestamp');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
