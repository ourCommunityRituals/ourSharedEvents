info:
  name: GET /health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        test('Status is 200 or 503', function() {

        \    expect(res.getStatus()).to.be.oneOf([200, 503]);

        });

        

        test('ok matches db state', function() {

        \    if (json.db === 'error') {

        \        expect(json.ok).to.eql(false);

        \    } else {

        \        expect(json.ok).to.eql(true);

        \    }

        });

        

        test('Has env field', function() {

        \    expect(json.env).to.be.a('string');

        });

        

        test('Has version field', function() {

        \    expect(json.version).to.be.a('string');

        });

        

        test('Has db field', function() {

        \    expect(json.db).to.be.oneOf(['ok', 'not_configured', 'error']);

        });

        

        test('Has timestamp (ISO 8601)', function() {

        \    expect(json.timestamp).to.match(/^\\d{4}-\\d{2}-\\d{2}T/);

        });

        

        // Capture environment info for other requests

        bru.setEnvVar('dbStatus', json.db);

        bru.setEnvVar('workerEnv', json.env);

        bru.setEnvVar('workerVersion', json.version);

        

        // Flag if DB is not connected — abort Collection Runner to avoid cascade failures

        // Set env var abortOnDbFailure=false to disable abort for manual exploration

        if (json.db !== 'ok') {

        \    console.warn('WARNING: D1 database status is \"' + json.db + '\" — events and forms endpoints will return 503');

        \    const shouldAbort = bru.getEnvVar('abortOnDbFailure') !== 'false';

        \    if (shouldAbort) {

        \        console.warn('ABORTING collection run — set abortOnDbFailure=false to override');

        \        bru.runner.stopExecution();

        \    }

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
