info:
  name: GET /subscribe (method not allowed)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/subscribe"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 405', function() {

        \    expect(res.getStatus()).to.equal(405);

        });

        

        test('Has Allow header', function() {

        \    expect(res.getHeader('Allow')).to.eql('POST');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
