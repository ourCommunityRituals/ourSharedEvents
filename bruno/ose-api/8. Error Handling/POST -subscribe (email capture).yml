info:
  name: POST /subscribe (email capture)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/subscribe"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "postman-subscribe@example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns a response', function() {

        \    expect(res.getStatus()).to.be.oneOf([200, 400, 405, 500, 503]);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
