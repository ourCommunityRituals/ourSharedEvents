info:
  name: GET /nonexistent-path (404)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/this/path/does/not/exist"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// CF WAF may return 403 before the Worker returns 404

        test('Returns 404 or 403 (WAF block)', function() {

        \    expect([403, 404]).to.include(res.getStatus());

        });

        

        const ct = (res.getHeader('Content-Type') || '');

        if (ct.includes('application/json')) {

        \    const json = res.getBody();

        \    test('ok is false', function() {

        \        expect(json.ok).to.eql(false);

        \    });

        \    test('Has error message', function() {

        \        expect(json.error).to.eql('Not found');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
