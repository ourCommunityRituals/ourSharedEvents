info:
  name: "OSE-2140 OSE-2142 | unpublish | the admin card reads the set closed and the event not live"
  type: http
  seq: 81

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | unpublish: closed, not live', function () { expect(res.getStatus()).to.eql(200); expect(b.set && b.set.state).to.eql('closed'); expect(b.event_live).to.eql(false); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
