info:
  name: "OSE-2140 OSE-2142 | cleanup | archiving closed the set"
  type: http
  seq: 901

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | cleanup: closed', function () { expect(res.getStatus()).to.eql(200); expect(b.set && b.set.state).to.eql('closed'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
