info:
  name: "OSE-2140 OSE-2142 | publish | a set on an unlisted Published event opens"
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}/votables/open"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"room_size\": 200}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | publish: the set opens', function () { expect(res.getStatus()).to.eql(200); expect(b.set && b.set.state).to.eql('open'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
