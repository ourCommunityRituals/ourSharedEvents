info:
  name: "OSE-2140 OSE-2142 | republish | the night is Published again"
  type: http
  seq: 84

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"status\": \"active\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2140 OSE-2142 | republish: Published', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
