info:
  name: "OSE-2140 OSE-2142 | unpublish | reopen is refused while the event is not Published"
  type: http
  seq: 82

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}/votables/reopen"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | unpublish: 409 EVENT_NOT_PUBLISHED', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('EVENT_NOT_PUBLISHED'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
