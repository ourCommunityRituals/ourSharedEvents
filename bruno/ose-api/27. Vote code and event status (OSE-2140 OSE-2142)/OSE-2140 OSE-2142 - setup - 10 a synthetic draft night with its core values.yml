info:
  name: "OSE-2140 OSE-2142 | setup | a synthetic draft night, with the core values a publish needs"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"attendance_mode\": \"in_person\", \"brand_id\": \"ose-vote-staging\", \"location\": \"OSE-2140 Hall\", \"title\": \"OSE-2140 OSE-2142 vote code night (staging, synthetic)\", \"status\": \"draft\", \"is_published\": false, \"data_class\": \"synthetic\", \"start_date\": \"2099-01-01\", \"start_time\": \"18:00\", \"timezone\": \"America/Chicago\", \"event_type_id\": \"etr-rec-bocce\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | setup: the draft night is created', function () { expect(res.getStatus()).to.eql(201); expect(b.id).to.be.a('string'); });
        bru.setVar('voteLiveNightId', b.id || 'missing-night');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
