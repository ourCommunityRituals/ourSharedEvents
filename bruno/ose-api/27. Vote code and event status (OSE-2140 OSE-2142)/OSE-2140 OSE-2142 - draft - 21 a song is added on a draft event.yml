info:
  name: "OSE-2140 OSE-2142 | draft | a song is added to the set on a draft event"
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteLiveNightId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Track one\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2140 OSE-2142 | draft: the song is added', function () { expect(res.getStatus()).to.eql(201); expect(b.object && b.object.state).to.eql('draft'); });
        bru.setVar('voteLiveSongId', (b.object && b.object.id) || 'missing-song');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
