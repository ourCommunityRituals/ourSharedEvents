info:
  name: OSE-1357 | poster deployments list | enriches rows with existing shortlink slots OR blocked at edge
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/poster-deployments"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// Contract (workers/oursharedevents/src/handlers/poster-deployments.ts, handleAdminListPosterDeployments): each deployment row is enriched with its physical scan QR (OSE-895) AND the event's EXISTING minted shortlink slots (OSE-1357), read-only, never mints a new shortlink on this GET.\r\nconst ct = (res.getHeader('Content-Type') || '');\r\nif (!ct.includes('application/json')) {\r\n    test('CF Access blocked — admin route protected', function () { expect([200, 302, 403]).to.include(res.getStatus()); });\r\n} else {\r\n    const json = res.getBody();\r\n    test('200 with ok: true', function () {\r\n        expect(res.getStatus()).to.eql(200);\r\n        expect(json.ok).to.eql(true);\r\n    });\r\n    test('items is an array', function () { expect(json.items).to.be.an('array'); });\r\n    if (json.items.length > 0) {\r\n        const item = json.items[0];\r\n        test('deployment row carries the physical scan QR (OSE-895)', function () {\r\n            expect(item.scan_url).to.be.a('string');\r\n            expect(item.scan_url).to.include('/q/');\r\n        });\r\n        test('deployment row carries the existing shortlink slots array (OSE-1357)', function () { expect(item.slots).to.be.an('array'); });\r\n        if (item.slots.length > 0) {\r\n            const slot = item.slots[0];\r\n            test('slot exposes kind/label/code/url/qr for an EXISTING shortlink', function () {\r\n                expect(slot).to.have.property('kind');\r\n                expect(slot).to.have.property('label');\r\n                expect(slot).to.have.property('code');\r\n                expect(slot.url).to.match(/\\/s\\/[A-Za-z0-9]+$/);\r\n                expect(slot.qr).to.be.a('string');\r\n            });\r\n        }\r\n    }\r\n}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
