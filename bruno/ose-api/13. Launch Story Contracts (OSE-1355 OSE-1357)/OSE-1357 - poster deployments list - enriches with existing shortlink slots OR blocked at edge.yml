info:
  name: OSE-1357 | poster deployments list | enriches rows with existing shortlink slots OR blocked at edge
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/poster-deployments"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// Contract (workers/oursharedevents/src/handlers/poster-deployments.ts, handleAdminListPosterDeployments): each deployment row is enriched with its physical scan QR (OSE-895) AND the event's EXISTING minted shortlink slots (OSE-1357), read-only, never mints a new shortlink on this GET.\nconst ct = (res.getHeader('Content-Type') || '');\nif (!ct.includes('application/json')) {\n    test('CF Access blocked — admin route protected', function () { expect([200, 302, 403]).to.include(res.getStatus()); });\n} else {\n    const json = res.getBody();\n    test('200 with ok: true', function () {\n        expect(res.getStatus()).to.eql(200);\n        expect(json.ok).to.eql(true);\n    });\n    test('items is an array', function () { expect(json.items).to.be.an('array'); });\n    if (json.items.length > 0) {\n        const item = json.items[0];\n        test('deployment row carries the physical scan QR (OSE-895)', function () {\n            expect(item.scan_url).to.be.a('string');\n            expect(item.scan_url).to.include('/q/');\n        });\n        test('deployment row carries the existing shortlink slots array (OSE-1357)', function () { expect(item.slots).to.be.an('array'); });\n        if (item.slots.length > 0) {\n            const slot = item.slots[0];\n            test('slot exposes kind/label/code/url/qr for an EXISTING shortlink', function () {\n                expect(slot).to.have.property('kind');\n                expect(slot).to.have.property('label');\n                expect(slot).to.have.property('code');\n                expect(slot.url).to.match(/\\/s\\/[A-Za-z0-9]+$/);\n                expect(slot.qr).to.be.a('string');\n            });\n        }\n    }\n}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
