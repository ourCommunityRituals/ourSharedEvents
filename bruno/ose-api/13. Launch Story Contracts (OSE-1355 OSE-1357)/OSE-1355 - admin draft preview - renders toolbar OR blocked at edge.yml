info:
  name: OSE-1355 | admin draft preview | renders toolbar OR blocked at edge
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{testEventId}}/preview"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// Contract (workers/oursharedevents/src/handlers/pages.ts, handleAdminEventPreviewPage): admin-only, auth-gated, renders the REAL public pre/live/post-event renderer plus an admin toolbar so an organizer can preview a draft before publishing (OSE-1355). Reached-vs-blocked is genuinely bimodal on staging depending on whether CF Access + admin secrets are present in this run, accept both, and only assert the deep preview contract when the toolbar is truly present.\ntest('preview reached OR blocked at edge', function () { expect([200, 302, 401, 403, 404]).to.include(res.getStatus()); });\nconst ct = (res.getHeader('Content-Type') || '');\nconst body = (typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody()));\nif (res.getStatus() === 200 && ct.includes('text/html') && body.includes('data-testid=\"admin-draft-preview-toolbar\"')) {\n    test('preview toolbar carries the go-live control', function () { expect(body).to.include('data-testid=\"admin-preview-go-live\"'); });\n    test('preview renders the real event renderer title slot', function () { expect(body).to.include('data-testid=\"event-title\"'); });\n    test('preview response is never cached (read-only contract)', function () { expect(res.getHeader('Cache-Control')).to.eql('no-store'); });\n}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
