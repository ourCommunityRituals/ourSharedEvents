info:
  name: OSE-320 | API | GET /api/v2/uec/resolve?code=xyz (non-canonical) | 400 INVALID_CODE
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v2/uec/resolve?code=xyz"
  params:
    - name: code
      value: xyz
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();

        test('Status is 400', () => expect(res.getStatus()).to.equal(400));

        test('error is INVALID_CODE', () => expect(json.error).to.eql('INVALID_CODE'));

        test('invalid_code echoed back', () => expect(json.invalid_code).to.eql('xyz'));

        test('valid_codes.ids present and complete', () => {

        \    expect(json.valid_codes.ids).to.eql(['ENTER','LIVE','SPONSOR','ARCHIVE','HELP','FEEDBACK','UTILITY','ALERT','STAFF','CHECK-IN','SHOP']);

        });

        test('message uses friendly voice', () => {

        \    expect(json.message).to.match(/canonical/i);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
