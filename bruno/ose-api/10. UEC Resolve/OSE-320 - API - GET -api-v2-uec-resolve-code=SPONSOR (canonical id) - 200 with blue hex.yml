info:
  name: OSE-320 | API | GET /api/v2/uec/resolve?code=SPONSOR (canonical id) | 200 with blue hex
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/uec/resolve?code=SPONSOR"
  params:
    - name: code
      value: SPONSOR
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        test('Status is 200', () => expect(res.getStatus()).to.equal(200));\r

        test('code.id is SPONSOR', () => expect(json.code.id).to.eql('SPONSOR'));\r

        test('code.label is Blue', () => expect(json.code.label).to.eql('Blue'));\r

        test('code.scan_hex is canonical sponsor blue', () => expect(json.code.scan_hex).to.eql('#1A3A8A'));\r

        test('code.url_path is /sponsor', () => expect(json.code.url_path).to.eql('/sponsor'));"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
