info:
  name: "OSE-2199 | update | a second draft, placed away from the seam"
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"attendance_mode\":\"in_person\",\"status\":\"draft\",\"is_published\":false,\"data_class\":\"synthetic\",\"start_date\":\"2099-01-01\",\"timezone\":\"America/Chicago\",\"location\":\"OSE-2199 Seam Check Hall\",\"title\":\"OSE-2199 Cell seam update (staging, synthetic)\",\"lat\":45.7,\"lon\":-111.03}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2199 update setup: 201', function () { expect(res.getStatus()).to.eql(201); expect(b.id).to.be.a('string'); });
        bru.setVar('seamUpdateId', b.id || 'missing-seam-update');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
