info:
  name: "OSE-2199 | cleanup | delete the first draft"
  type: http
  seq: 900

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/{{seamCreateId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2199 cleanup: the first draft is deleted', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
