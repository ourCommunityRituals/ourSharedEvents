info:
  name: OSE-INV5 | T3 | accept | respond local-bronze accepted
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v2/sponsor/placements/{{covPlacement_localBronze}}/respond"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"token":"{{covToken_localBronze}}","accepted":true}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Sponsor consents via the signed token (never admin); flips sponsor_accepted=1 and
        // busts the sponsors cache so the covenant assert sees this sponsor (ADR-019 render gate).
        test('Respond returns 200', function () { expect(res.getStatus()).to.eql(200); });
        const body = res.getBody();
        test('sponsor_accepted is now 1', function () {
          expect(body.ok).to.eql(true);
          expect(body.sponsor_accepted).to.eql(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
