info:
  name: OSE-INV5 | T3 | cleanup | DELETE captured nonlocal-title id
  type: http
  seq: 17

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/sponsors/{{covId_nonlocalTitle}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // local var `covCt` (NOT `ct`) — avoids the collection-hook redefinition.
        const covCt = res.getHeader('Content-Type') || '';
        if (!covCt.includes('application/json')) { return; }
        test('Cleanup DELETE returned 200/204/404', function () { expect([200, 204, 404]).to.include(res.getStatus()); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
