info:
  name: OSE-INV5 | T3 | seed | local-bronze sponsor
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/sponsors"
  headers:
    - name: Content-Type
      value: application/json
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"event_id":"test-event-001","name":"Covenant Local Bronze","tier":"bronze","lat":41.6903,"lon":-87.6768}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Covenant cannot be proven if seed cannot land — fail loud, not silent.
        // Classify the response so the next operator knows WHERE to fix, not just
        // THAT it broke. See OSE-349 for the full diagnosis path.
        const ct = res.getHeader('Content-Type') || '';
        if (!ct.includes('application/json')) {
            const code = res.getStatus();
            let diag;
            if (ct.includes('text/html')) {
                diag = 'CF Access challenge HTML returned (cfAccessClientId/Secret request headers ARE wired in this collection; the most common cause is a STALE service token — rotated in Cloudflare without updating the CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET repo secrets, NOT missing wiring). See OSE-349.';
            } else {
                diag = `Unexpected non-JSON response (Content-Type=${ct}, HTTP ${code}) — neither CF Access challenge nor worker JSON. Investigate the response body manually.`;
            }
            test(`COVENANT TEST BLOCKED: seed POST did not reach the worker as JSON — ${diag}`, function() {
                expect.fail(`Seed POST: HTTP ${code} / Content-Type=${ct}`);
            });
            return;
        }
        test('Seed POST status is 200 or 201', function() { expect([200, 201]).to.include(res.getStatus()); });
        const json = res.getBody();
        const sponsor = json.item || json.sponsor || json;
        // OSE-891: the create endpoint GENERATES the id (sp_<uuid>) and GEO-DERIVES is_local
        // from the sponsor's h3_res7 CORRIDOR cell vs the event's — body id/is_local are ignored.
        test('Create returned a server-generated sp_ id', function() { expect(sponsor.id).to.be.a('string').and.to.match(/^sp_/); });
        bru.setCollectionVar('covId_localBronze', sponsor.id);
        // CCR-PR567 Stage-2: capture the placement id (spl_) so the paired accept step can
        // consent this placement. Under ADR-019 strict consent, an organizer-seeded placement
        // is PENDING and does NOT render until the sponsor accepts — so the covenant assert
        // observes it only AFTER mint -> respond flips sponsor_accepted=1.
        test('Create returned a placement_id', function() { expect(sponsor.placement_id).to.be.a('string').and.to.have.length.above(0); });
        bru.setCollectionVar('covPlacement_localBronze', sponsor.placement_id);
        // This sponsor's lat/lon sit in the SAME res7 cell as test-event-001 (geo-tagged by
        // migration 0068) -> is_local derives TRUE. Proves locality is geo-derived, not purchasable.
        test('is_local is geo-derived TRUE (sponsor cell matches event corridor cell)', function() { expect(sponsor.is_local).to.eql(true); });
        test('Seeded tier is bronze', function() { expect(sponsor.tier).to.eql('bronze'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
