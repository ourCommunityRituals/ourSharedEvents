info:
  name: OSE-INV5 | T3 | assert | GET /api/v2/events/test-event-001/sponsors returns covenant-correct order
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/test-event-001/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |
        // OSE-944: the public sponsors read is cache-fronted (TTL 30s + SWR 300s). The 4
        // covenant sponsors are seeded directly into D1 by covenant-sponsors-seed.sql (no
        // API write -> no cache bust), so a stale entry from a prior run could linger a moment.
        // Back off between retries to let a stale entry age out / SWR revalidate. attempt 0 = no wait.
        const covAttempt = Number(bru.getCollectionVar('covAttempt') || 0);
        if (covAttempt > 0) {
          const backoffMs = Math.min(5000, 1000 * covAttempt);
          setTimeout(function () {}, backoffMs);
        }
    - type: after-response
      code: |
        // The Local Sponsor Covenant (#25 / OSE-INV5) proved on the deployed worker.
        // The 4 canonical sponsors are fixture-seeded ALREADY ACCEPTED
        // (covenant-sponsors-seed.sql), so this is a PURE ASSERT by fixed id — no
        // seed/mint/respond, no cross-request var capture (the Bruno multi-request
        // after-response quirk that blocked the API-seed approach). Runnable L1 twin
        // (no staging/creds): tier-equity-sort.spec.ts '#25 | OSE-INV5 covenant twin'.
        const COV_MAX_ATTEMPTS = 8;
        const covAttempt = Number(bru.getCollectionVar('covAttempt') || 0);
        const idLocalBronze   = 'sb_cov_local_bronze';
        const idLocalPlatinum = 'sb_cov_local_platinum';
        const idNonlocBronze  = 'sb_cov_nonlocal_bronze';
        const idNonlocTitle   = 'sb_cov_nonlocal_title';
        const covFixtures = [idLocalBronze, idLocalPlatinum, idNonlocBronze, idNonlocTitle];
        const covJson = res.getBody();
        const covItems = Array.isArray(covJson.items) ? covJson.items : [];
        const covIds = covItems.map(function (s) { return s.id; });
        const covPresentCount = covFixtures.filter(function (id) { return covIds.indexOf(id) > -1; }).length;
        // Bounded read-after-seed retry: re-queue this same request (NO test() on intermediate
        // attempts so --bail is not tripped) until all 4 fixtures are visible, then assert.
        if (covPresentCount < 4 && covAttempt < COV_MAX_ATTEMPTS) {
          bru.setCollectionVar('covAttempt', covAttempt + 1);
          console.log('OSE-944 covenant read-after-seed: attempt ' + (covAttempt + 1) + '/' + COV_MAX_ATTEMPTS +
                      ' — ' + covIds.length + ' sponsors visible, ' + covPresentCount + '/4 fixtures present; retrying after backoff.');
          bru.runner.setNextRequest(req.getName());
          return;
        }
        bru.setCollectionVar('covAttempt', 0);
        test('Response is 200 JSON', function () {
          expect(res.getStatus()).to.eql(200);
          expect(res.getHeader('Content-Type')).to.include('application/json');
        });
        test('Response has items array', function () { expect(covJson.items).to.be.an('array'); });
        const ids = covItems.map(function (s) { return s.id; });
        const idxLocalBronze   = ids.indexOf(idLocalBronze);
        const idxLocalPlatinum = ids.indexOf(idLocalPlatinum);
        const idxNonlocBronze  = ids.indexOf(idNonlocBronze);
        const idxNonlocTitle   = ids.indexOf(idNonlocTitle);
        test('All 4 covenant fixture sponsors are present in the public response', function () {
          expect(idxLocalBronze,   'local-bronze ('   + idLocalBronze   + ')').to.be.above(-1);
          expect(idxLocalPlatinum, 'local-platinum (' + idLocalPlatinum + ')').to.be.above(-1);
          expect(idxNonlocBronze,  'nonlocal-bronze (' + idNonlocBronze + ')').to.be.above(-1);
          expect(idxNonlocTitle,   'nonlocal-title ('  + idNonlocTitle  + ')').to.be.above(-1);
        });
        // is_local is derived from placement.locality_band: the two Chicago locals read
        // is_local=true, the NYC/LA non-locals read false — locality is geo-derived, not tier-bought.
        const byId = Object.fromEntries(covItems.map(function (s) { return [s.id, s]; }));
        if (byId[idLocalBronze] && Object.prototype.hasOwnProperty.call(byId[idLocalBronze], 'is_local')) {
          test('Public list agrees: locals are is_local, non-locals are not (geo-derived)', function () {
            expect(!!byId[idLocalBronze].is_local,   'local-bronze is_local').to.eql(true);
            expect(!!byId[idLocalPlatinum].is_local, 'local-platinum is_local').to.eql(true);
            expect(!!byId[idNonlocBronze].is_local,  'nonlocal-bronze is_local').to.eql(false);
            expect(!!byId[idNonlocTitle].is_local,   'nonlocal-title is_local').to.eql(false);
          });
        }
        // THE COVENANT (#25): locals are never zeroed/dropped (the floor) and non-locals are
        // present too (uniform eligibility). Order carries no size/slot/position meaning, so we
        // deliberately do NOT assert 'local before non-local' (that would re-encode the retired
        // tierSort model).
        test('COVENANT floor: local-bronze is never zeroed vs nonlocal-title (adversarial: lowest local tier vs highest non-local tier)', function () {
          expect(idxLocalBronze, 'local-bronze must remain in the covenant rotation, never dropped').to.be.above(-1);
        });
        test('COVENANT floor: local-platinum is never zeroed', function () {
          expect(idxLocalPlatinum).to.be.above(-1);
        });
        test('Uniform eligibility: non-local sponsors are present too (no named-slot drop)', function () {
          expect(idxNonlocTitle, 'nonlocal-title present').to.be.above(-1);
          expect(idxNonlocBronze, 'nonlocal-bronze present').to.be.above(-1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
