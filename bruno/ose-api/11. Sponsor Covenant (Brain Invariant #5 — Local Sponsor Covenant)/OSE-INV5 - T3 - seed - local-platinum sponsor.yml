info:
  name: OSE-INV5 | T3 | seed | local-platinum sponsor
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/sponsors"
  headers:
    - name: Content-Type
      value: application/json
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"event_id":"test-event-001","name":"Covenant Local Platinum","tier":"platinum","lat":41.6975,"lon":-87.682}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // local var `covCt` (NOT `ct`) — avoids the collection-hook redefinition (see local-bronze seed).
        const covCt = res.getHeader('Content-Type') || '';
        if (!covCt.includes('application/json')) { test(`CF Access shadow on seed POST (HTTP ${res.getStatus()}, Content-Type=${covCt}) — see OSE-349`, function () { expect.fail('admin path edge-shadowed; likely STALE service token rather than missing wiring'); }); return; }
        test('Seed POST status is 200 or 201', function () { expect([200, 201]).to.include(res.getStatus()); });
        const json = res.getBody();
        const sponsor = json.item || json.sponsor || json;
        test('Create returned a server-generated sp_ id', function () { expect(sponsor.id).to.be.a('string').and.to.match(/^sp_/); });
        bru.setCollectionVar('covId_localPlatinum', sponsor.id);
        test('Create returned a placement_id', function () { expect(sponsor.placement_id).to.be.a('string').and.to.have.length.above(0); });
        bru.setCollectionVar('covPlacement_localPlatinum', sponsor.placement_id);
        // ~1km from the venue — still the SAME res7 corridor cell -> is_local TRUE.
        test('Seeded local-platinum sponsor: geo-derived local + platinum tier', function () { expect(sponsor.is_local).to.eql(true); expect(sponsor.tier).to.eql('platinum'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
