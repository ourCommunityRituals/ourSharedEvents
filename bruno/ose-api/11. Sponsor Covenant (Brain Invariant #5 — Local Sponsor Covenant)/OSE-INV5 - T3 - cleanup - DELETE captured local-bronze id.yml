info:
  name: OSE-INV5 | T3 | cleanup | DELETE captured local-bronze id
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/sponsors/{{covId_localBronze}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // IIFE: own scope so `const ct` does not redefine the collection hook's `const ct`.
        (function () {
          // Cleanup is best-effort — staging soft-deletes (is_active=0) so re-runs upsert cleanly.
          const ct = res.getHeader('Content-Type') || '';
          if (!ct.includes('application/json')) { console.warn('cleanup DELETE blocked by CF Access — sponsor row remains on staging until next manual cleanup'); return; }
          test('Cleanup DELETE returned 200, 204, or 404 (already gone)', function () { expect([200, 204, 404]).to.include(res.getStatus()); });
        })();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
