info:
  name: OPTIONS /api/v2/events
  type: http
  seq: 1

http:
  method: OPTIONS
  url: "{{baseUrl}}/api/v2/events"
  headers:
    - name: Origin
      value: https://stg.oursharedevents.com
    - name: Access-Control-Request-Method
      value: GET
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 204', function() {

        \    expect(res.getStatus()).to.equal(204);

        });

        

        test('Has Access-Control-Allow-Methods', function() {

        \    const methods = res.getHeader('Access-Control-Allow-Methods');

        \    expect(methods).to.include('GET');

        \    expect(methods).to.include('POST');

        });

        

        test('Has Access-Control-Allow-Headers', function() {

        \    const headers = res.getHeader('Access-Control-Allow-Headers');

        \    expect(headers).to.include('Authorization');

        \    expect(headers).to.include('Content-Type');

        });

        

        test('Max-Age is set', function() {

        \    expect(res.getHeader('Access-Control-Max-Age')).to.eql('86400');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
