info:
  name: "OSE-2221 | operators | the owner lists a brand on the platform"
  type: http
  seq: 20

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/venues/ven_1a6e51de0c1b00000000000000000001/operators"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"brand_id":"lakeside-club","status":"on_platform"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2221 operators: 200, listed on the platform', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.status).to.eql('on_platform');
          expect(b.brand_id).to.eql('lakeside-club');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
