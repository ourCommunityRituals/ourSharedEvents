info:
  name: "Leagues | page | the started league is public"
  type: http
  seq: 90

http:
  method: GET
  url: "{{baseUrl}}/competitions/{{leagueId}}"
  headers:
    - name: Accept
      value: text/html
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var edge = res.getStatus() === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        if (edge) { test('EDGE: the page read was challenged before the Worker ran (OSE-939); nothing below was checked', function () { expect(edge).to.equal(true); }); }
        var body = typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody());
        if (!edge) {
          test('leagues page: 200 HTML', function () { expect(res.getStatus()).to.eql(200); expect(res.getHeader('content-type') || '').to.include('text/html'); });
          test('leagues page: one <h1>, the name, the table and the score', function () {
            expect((body.match(/<h1[\s>]/gi) || []).length).to.eql(1);
            expect(body).to.include('CI league (synthetic)');
            expect(body).to.include('data-testid="competition-standings"');
            expect(body).to.include('data-score="12-5"');
          });
          test('leagues page: no cookie, not indexed', function () { expect(!res.getHeader('set-cookie')).to.equal(true); expect(res.getHeader('x-robots-tag')).to.eql('noindex'); });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
