info:
  name: "Leagues | scores | the host adds who threw where, by position"
  type: http
  seq: 72

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/competitions/{{leagueId}}/fixtures/{{leagueFixtureId}}/result"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"score_a\": 12, \"score_b\": 5, \"frames\": [{\"frame\": 1, \"a\": [{\"position\": \"A\", \"end\": \"near\", \"balls\": 2}, {\"position\": \"B\", \"end\": \"near\", \"balls\": 2}], \"b\": [{\"position\": \"A\", \"end\": \"near\", \"balls\": 2}, {\"position\": \"B\", \"end\": \"near\", \"balls\": 2}]}, {\"frame\": 2, \"a\": [{\"position\": \"C\", \"end\": \"far\", \"balls\": 4}], \"b\": [{\"position\": \"C\", \"end\": \"far\", \"balls\": 4}]}]}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('leagues lineup: 200, positions per frame read back, never a name', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.fixture.result.score_a).to.eql(12);
          expect(b.fixture.result.frames.length).to.eql(2);
          expect(b.fixture.result.frames[1]).to.eql({ frame: 2, a: [{ position: 'C', end: 'far', balls: 4 }], b: [{ position: 'C', end: 'far', balls: 4 }] });
          expect(JSON.stringify(b)).to.not.match(/name|player/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
