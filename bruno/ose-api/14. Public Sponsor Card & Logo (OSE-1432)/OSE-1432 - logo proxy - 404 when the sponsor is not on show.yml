info:
  name: OSE-1432 | logo proxy | 404 when the sponsor is not on show
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_pcard_pool/logo"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // sb_pcard_pool HAS a logo but no placement: the consent gate refuses it, so this 404
        // comes from the gate, not from missing data. The upstream is never asked.
        test('404 for a sponsor that is not on show', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
