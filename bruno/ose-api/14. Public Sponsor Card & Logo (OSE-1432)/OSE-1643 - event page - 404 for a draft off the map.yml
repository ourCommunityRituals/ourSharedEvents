info:
  name: OSE-1643 | event page | 404 for a draft off the map
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/events/pcard-draft-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // The other half of the same rule: only a LIVE event opens by link while it is off
        // the map. pcard-draft-evt is a draft, so it stays the generic 404 and is never named.
        const body = String(res.getBody() || '');
        test('404 for a draft', function () { expect(res.getStatus()).to.eql(404); });
        test('it is the not-found page', function () { expect(body).to.include('data-testid="error-title"'); });
        test('the draft is never named', function () { expect(body).to.not.include('Sponsor Card Fixture (draft)'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
