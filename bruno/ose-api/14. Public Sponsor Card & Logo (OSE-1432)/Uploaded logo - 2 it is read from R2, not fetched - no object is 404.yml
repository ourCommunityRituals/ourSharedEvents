info:
  name: Uploaded logo | 2 it is read from R2, not fetched - no object is 404
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_pcard_upload/logo"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // The logo request 1 stored names an object that is not in R2. The proxy reads
        // an uploaded logo from the bucket (lib/sponsor-logo.ts serveUploadedLogo), so a
        // missing object is a plain 404, never cached, and nothing is fetched. Had the
        // path gone to the outside-URL fetcher it would answer 422 (not a URL). The
        // 200 path is checked on the stock site after every build (check-full.mjs,
        // sponsor-art), where the pictures really are in R2.
        test('404 for an uploaded logo whose object is not there', function () {
          expect(res.getStatus()).to.eql(404);
        });
        test('not cached', function () {
          expect(String(res.getHeader('cache-control') || '')).to.eql('no-store');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
