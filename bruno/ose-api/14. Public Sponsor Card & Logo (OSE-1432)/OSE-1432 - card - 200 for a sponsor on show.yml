info:
  name: OSE-1432 | sponsor card | 200 for a sponsor on show
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/sponsors/sb_pcard_onshow"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract (handlers/sponsor-card.ts): a sponsor on show (active, placement accepted
        // by both sides, on an active event) renders its public card. The title is the display
        // name, the business name stays visible, and the logo loads through the same-origin
        // proxy, never the stored upstream URL (CSP + COEP would block that).
        const body = String(res.getBody() || '');
        test('200 for a sponsor on show', function () { expect(res.getStatus()).to.eql(200); });
        test('served as HTML', function () { expect(String(res.getHeader('content-type') || '')).to.include('text/html'); });
        test('title is the display name', function () { expect(body).to.include('data-testid="sponsor-card-title">Public Card On Show<'); });
        test('business name is shown under it', function () { expect(body).to.include('data-testid="sponsor-card-business">Public Card OnShow LLC<'); });
        test('location line is shown', function () { expect(body).to.include('1 Fixture Way, Chicago IL'); });
        test('logo goes through the same-origin proxy', function () { expect(body).to.include('src="/api/v2/sponsors/sb_pcard_onshow/logo"'); });
        test('the stored upstream URL never reaches the page', function () { expect(body).to.not.include('avatars.githubusercontent.com'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
