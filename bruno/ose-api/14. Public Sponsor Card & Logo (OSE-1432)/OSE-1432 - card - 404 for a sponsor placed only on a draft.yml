info:
  name: OSE-1432 | sponsor card | 404 for a sponsor placed only on a draft
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/sponsors/sb_pcard_draft"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Accepted by both sides, but its only event is a draft: not on show until the event is live.
        const body = String(res.getBody() || '');
        test('404 for a draft-only sponsor', function () { expect(res.getStatus()).to.eql(404); });
        test('nothing of the sponsor leaks into the 404', function () { expect(body).to.not.include('Public Card Draft'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
