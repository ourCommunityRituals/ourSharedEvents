info:
  name: OSE-1432 | sponsor card | 404 for an unknown id
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/sponsors/sb_pcard_does_not_exist"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('404 for an unknown sponsor id', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
