info:
  name: OSE-1432 | sponsor card | 200 with the OSE default image when no logo
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/sponsors/sb_pcard_nologo"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // A sponsor with no logo is complete: its card shows the OSE default image.
        const body = String(res.getBody() || '');
        test('200 for an on-show sponsor without a logo', function () { expect(res.getStatus()).to.eql(200); });
        test('title falls back to the business name', function () { expect(body).to.include('data-testid="sponsor-card-title">Public Card NoLogo<'); });
        test('logo is the OSE default image', function () { expect(body).to.include('src="/sponsor-default-logo.svg"'); });
        test('no proxy path for a logo that does not exist', function () { expect(body).to.not.include('/api/v2/sponsors/sb_pcard_nologo/logo'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
