info:
  name: OSE-1900 | rainy | sponsors API | accepted placement but the switch is off, no sponsor
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-off-evt/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // sb_optin_hidden is accepted by both sides on optin-off-evt, whose switch is off.
        test('OSE-1900 rainy: 200, the event itself is fine', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1900 rainy: switch off, so the accepted sponsor is not in the list', function () { expect(res.getBody().items).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
