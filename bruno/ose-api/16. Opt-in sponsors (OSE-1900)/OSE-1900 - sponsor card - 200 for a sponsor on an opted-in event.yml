info:
  name: OSE-1900 | sunny | sponsor card | 200 for a sponsor on an opted-in event
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/sponsors/sb_optin_shown"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = String(res.getBody() || '');
        test('OSE-1900 sunny: 200 with the sponsor title', function () { expect(res.getStatus()).to.eql(200); expect(body).to.include('Opt-in Shown Sponsor'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
