info:
  name: OSE-1900 | fat finger | switch | the refused write left the switch on
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-toggle-evt/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().items || []).map(function (s) { return s.id; });
        test('OSE-1900 fat finger: after the refused write the sponsor still shows', function () {
          expect(res.getStatus()).to.eql(200);
          expect(ids).to.eql(['sb_optin_toggle']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
