info:
  name: OSE-1900 | sunny | poster bundle | opted in, the accepted sponsor, and only that one
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-on-evt/poster-bundle"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().sponsors || []).map(function (s) { return s.id; });
        test('OSE-1900 sunny: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1900 sunny: the poster shows the sponsor both sides accepted, and no other', function () { expect(ids).to.eql(['sb_optin_shown']); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
