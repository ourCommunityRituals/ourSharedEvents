info:
  name: OSE-1900 | setup | discovery | the organizer mints the asking sponsor its link
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/sponsors/sb_optin_seeker/home-link"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The sponsor's own page and its ask-to-join are opened by a signed link the
        // organizer mints. The token is kept for the next two requests and never printed.
        const json = res.getBody();
        test('OSE-1900 setup: 200 with a signed link', function () {
          expect(res.getStatus()).to.eql(200);
          expect(json.url).to.be.a('string');
        });
        const m = /[?&]t=([^&]+)/.exec(String((json && json.url) || ''));
        bru.setVar('optinSeekerToken', m ? decodeURIComponent(m[1]) : '');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
