info:
  name: OSE-1900 | rainy | switch | after the refused caller the switch is still on
  type: http
  seq: 35

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-toggle-evt/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().items || []).map(function (s) { return s.id; });
        test('OSE-1900 rainy: the sponsor still shows, so the refused caller changed nothing', function () {
          expect(res.getStatus()).to.eql(200);
          expect(ids).to.eql(['sb_optin_toggle']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
