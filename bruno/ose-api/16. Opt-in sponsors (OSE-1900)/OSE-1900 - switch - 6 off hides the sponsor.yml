info:
  name: OSE-1900 | rainy | switch | off, the sponsor is hidden at once
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-toggle-evt/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().items || []).map(function (s) { return s.id; });
        test('OSE-1900 rainy: with the switch off, the sponsor is hidden on the next read', function () {
          expect(res.getStatus()).to.eql(200);
          expect(ids).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
