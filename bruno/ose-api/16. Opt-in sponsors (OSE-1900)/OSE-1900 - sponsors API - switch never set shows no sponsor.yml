info:
  name: OSE-1900 | rainy | sponsors API | accepted placement and the switch was never set, no sponsor (absent means off)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/optin-absent-evt/sponsors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // optin-absent-evt has settings {} (the state of every new event).
        test('OSE-1900 rainy: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1900 rainy: absent means off, so the accepted sponsor is not in the list', function () { expect(res.getBody().items).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
