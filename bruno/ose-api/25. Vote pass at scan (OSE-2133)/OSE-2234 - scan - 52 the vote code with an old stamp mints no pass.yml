info:
  name: "OSE-2234 | scan | the vote code with an old stamp mints no pass, with the set open"
  type: http
  seq: 52

# The rotating vote code (2026-11-26): a pass needs this minute's stamp from the
# room screen. A photo of the code, or the code with its stamp cut off, mints
# none, writes no scan row and sets no cookie (CCR F7, F12): the visitor gets
# the voter page with no pass, which says to scan the code on the screen again.
# An edge challenge fails the case under edgeStrict (OSE-2022, CCR F10). Never
# prints the Location header: every check compares booleans.

http:
  method: GET
  url: "{{baseUrl}}/q/{{votePassToken}}?type=vote&w=1.00000000000000000000000000000000"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
    - name: Accept
      value: text/html
    - name: User-Agent
      value: ose-bruno-vote-pass
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var status = res.getStatus();
        var edge = status === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        if (edge) { test('EDGE: the scan was challenged before the Worker ran (OSE-939); nothing below was checked', function () { expect(edge).to.equal(true); }); }
        if (edge && String(bru.getEnvVar('edgeStrict')) === '1') { test('EDGE (strict, OSE-2022): the scan reached the Worker, not an edge challenge', function () { expect('edge challenge').to.eql('the Worker'); }); }
        var loc = String(res.getHeader('location') || '');
        var hashAt = loc.indexOf('#');
        var beforeHash = hashAt < 0 ? loc : loc.slice(0, hashAt);
        var frag = hashAt < 0 ? '' : loc.slice(hashAt + 1);
        var queryAt = beforeHash.indexOf('?');
        var pathOnly = (queryAt < 0 ? beforeHash : beforeHash.slice(0, queryAt)).replace(/^https?:\/\/[^/]+/, '');
        var night = bru.getVar('votePassNightId');
        loc = null;
        if (!edge) {
          test('OSE-2234 scan: 302 and no-store', function () { expect(status === 302).to.eql(true); expect(String(res.getHeader('cache-control') || '').indexOf('no-store') >= 0).to.eql(true); });
          test('OSE-2234 scan: the vote code with an old stamp mints no pass: no fragment, and the voter page that says scan again', function () {
            expect(frag === '').to.eql(true);
            expect(pathOnly === '/events/' + night + '/vote').to.eql(true);
          });
          // Cookies the edge may set (names starting __cf, _cf or cf_) are
          // Cloudflare's own, not the Worker's (as in folder 26, scan 76).
          // Only the names are read, never a value.
          var workerCookies = [];
          [].concat(res.getHeader('set-cookie') || []).forEach(function (h) {
            String(h).split(/,(?=\s*[A-Za-z0-9_.-]+=)/).forEach(function (c) {
              var name = c.split('=')[0].trim();
              if (name && !/^(__cf|_cf|cf_)/i.test(name)) workerCookies.push(name);
            });
          });
          console.log('OSE-2234 stale scan worker cookie names: ' + (workerCookies.join(',') || '(none)'));
          test('OSE-2234 scan: a stale scan sets no cookie of the Worker', function () { expect(workerCookies).to.eql([]); });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
