info:
  name: "OSE-2133 | setup | the room vote code for the night (OSE-2140)"
  type: http
  seq: 25

# Since OSE-2140 only the room's own vote code mints a pass. Never prints its URL.

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{votePassNightId}}/votables/code"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        var m = /\/q\/(qrt_[0-9a-f]{32})\?type=vote&w=(\d+\.[0-9a-f]{32})$/.exec(String((b.code && b.code.url) || ''));
        var shaped = !!m;
        bru.setVar('votePassToken', m ? m[1] : 'qrt_missing');
        // The rotating code: this minute's stamp, as the room screen shows it (60 to 120 s of life).
        bru.setVar('votePassStamp', m ? m[2] : '0.missing');
        bru.setVar('votePassCodeId', String((b.code && b.code.id) || 'missing-code'));
        m = null;
        test('OSE-2133 setup: the room vote code is made', function () { expect(res.getStatus() === 201).to.eql(true); expect(shaped).to.eql(true); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
