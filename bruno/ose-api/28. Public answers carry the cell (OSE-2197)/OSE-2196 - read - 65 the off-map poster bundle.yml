info:
  name: "OSE-2196 | rainy | the poster bundle of a live event off the map gives no directions and no point"
  type: http
  seq: 65

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/{{cellOnlyOffMapId}}/poster-bundle"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // OSE-2196 (owner 2026-11-19): "Anything that is listed as private or off
        // map cannot be routed to." The off-map event from setup 10 still has its
        // poster, but the bundle says routable false, carries no directions, and
        // holds no coordinate at all: the exception in request 60 never applies.
        const { coordinateFindings, finerCells } = require('./lib/coordinate-findings.js');
        const body = res.getBody() || {};
        test('OSE-2196: 200, the off-map event still has its poster', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2196: routable false, and no directions', function () {
          expect(body.routable).to.eql(false);
          expect(body.directions).to.eql(null);
        });
        test('OSE-2197 place, not person: no coordinate anywhere in the answer', function () {
          expect(coordinateFindings(body)).to.eql([]);
        });
        // Its stored point (setup 10: 41.657312, -87.680647) is nowhere, not even
        // cut or rounded to the five decimals a cell point has.
        test('OSE-2196: the stored point is nowhere in the answer, whole or rounded', function () {
          const text = JSON.stringify(body);
          ['41.65731', '-87.68064', '-87.68065'].forEach(function (d) {
            expect(text, d).to.not.include(d);
          });
        });
        test('OSE-2197: no cell finer than res 7', function () {
          expect(finerCells(body)).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
