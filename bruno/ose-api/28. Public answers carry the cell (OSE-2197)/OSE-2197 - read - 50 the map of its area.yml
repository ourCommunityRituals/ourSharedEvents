info:
  name: "OSE-2197 | sunny | the map of the area gives each pin its cell and no point"
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/map?cell={{cellOnlyCell}}"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { coordinateFindings, finerCells } = require('./lib/coordinate-findings.js');
        const body = res.getBody() || {};
        const text = JSON.stringify(body);
        test('OSE-2197: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2197 place, not person: no coordinate anywhere in the answer', function () {
          expect(coordinateFindings(body)).to.eql([]);
        });
        test('OSE-2197: no cell finer than res 7 (the precision the API had)', function () {
          expect(finerCells(body)).to.eql([]);
        });
        const items = body.items || [];
        const cell = bru.getVar('cellOnlyCell');
        test('OSE-2197: every pin is in the asked cell, by its h3_res7, and carries no lat or lon', function () {
          items.forEach(function (i) {
            expect(i.h3_res7, String(i.id)).to.eql(cell);
            expect(i, String(i.id)).to.not.have.any.keys('lat', 'lon');
          });
        });
        test('OSE-2197: the map has pins, and the listed event in the forward window is one of them', function () {
          expect(items.length).to.be.above(0);
          const ids = items.map(function (i) { return i.id; });
          expect(ids).to.include(bru.getVar('cellOnlyListedId'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
