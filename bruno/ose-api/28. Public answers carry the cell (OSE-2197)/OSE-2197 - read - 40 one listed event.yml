info:
  name: "OSE-2197 | sunny | one listed event's read gives its cell and not its point"
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/{{cellOnlyListedId}}"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { coordinateFindings, finerCells } = require('./lib/coordinate-findings.js');
        const body = res.getBody() || {};
        const text = JSON.stringify(body);
        test('OSE-2197: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2197 place, not person: no coordinate anywhere in the answer', function () {
          expect(coordinateFindings(body)).to.eql([]);
        });
        test('OSE-2197: no cell finer than res 7 (the precision the API had)', function () {
          expect(finerCells(body)).to.eql([]);
        });
        const item = body.item || {};
        test('OSE-2197: the read gives the same res-7 cell the list gave', function () {
          expect(item.id).to.eql(bru.getVar('cellOnlyListedId'));
          expect(item.h3_res7).to.eql(bru.getVar('cellOnlyCell'));
          expect(item).to.not.have.any.keys('lat', 'lon', 'h3_res9');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
