info:
  name: OSE-2127 | setup | a second synthetic draft event, for the final lock
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"attendance_mode\": \"in_person\", \"location\": \"OSE-2127 Hall\", \"title\": \"OSE-2127 final lock (staging, synthetic)\", \"is_published\": false, \"data_class\": \"synthetic\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 setup: the event is created', function () { expect(res.getStatus()).to.eql(201); expect(b.id).to.be.a('string'); });
        bru.setVar('voteFinalId', b.id || 'missing-final');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
