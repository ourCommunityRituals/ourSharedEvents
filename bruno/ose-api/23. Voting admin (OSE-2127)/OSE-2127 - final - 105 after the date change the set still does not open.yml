info:
  name: OSE-2127 | rainy | final | after the date change the set still does not open
  type: http
  seq: 105

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteFinalId}}/votables/open"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"room_size\": 200}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 rainy: 409 VOTE_SET_FINAL', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('VOTE_SET_FINAL'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
