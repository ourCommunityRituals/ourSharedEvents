info:
  name: OSE-2127 | close | the set is still closed
  type: http
  seq: 82

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables/close"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 close: a second close is WRONG_STATE: the refused reopen left it closed', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('WRONG_STATE'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
