info:
  name: OSE-2127 | rainy | brand | an admin of another brand cannot read the vote set
  type: http
  seq: 160

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{ciBrandClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{ciBrandClientSecret}}"
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // OSE-1800: the CI service actor (a brand admin of ci-brand, never platform).
        // Inert until the owner creates the Access service token and adds its secrets.
        // Until then this request is skipped and logs NOT RUN; it records no passing test.
        if (!bru.getEnvVar('ciBrandClientId') || !bru.getEnvVar('ciBrandClientSecret')) {
          console.log('NOT RUN (OSE-1800 setup pending): no CI brand service token configured');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 rainy: brand: 404', function () { expect(res.getStatus()).to.eql(404); expect(JSON.stringify(b)).to.not.contain('Song one'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
