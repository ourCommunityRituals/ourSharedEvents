info:
  name: OSE-2127 | close | a song's window cannot be closed early
  type: http
  seq: 71

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables/objects/{{voteSongId}}/close"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 close: 409 WINDOW_FIXED, the window runs its full length (owner card 2026-11-26)', function () { expect(res.getStatus()).to.eql(409); expect((res.getBody() || {}).code).to.eql('WINDOW_FIXED'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
