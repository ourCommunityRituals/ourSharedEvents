info:
  name: OSE-2130 | final | a second compute is refused and changes nothing
  type: http
  seq: 91

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables/finalize"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Results are computed once (OSE ADR-040 decision 4, Q10). The refusal is
        // also the denied VOTE_SET_FINALIZE row seq 170 reads.
        const b = res.getBody() || {};
        test('OSE-2130 final: a second compute is 409 VOTE_SET_FINAL', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('VOTE_SET_FINAL'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
