info:
  name: OSE-2127 | cleanup | an event with a vote set is not deleted
  type: http
  seq: 900

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 cleanup: 409 EVENT_HAS_VOTE_SET', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('EVENT_HAS_VOTE_SET'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
