info:
  name: OSE-2127 | final | make a vote set on the second event
  type: http
  seq: 100

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteFinalId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 final: 201', function () { expect(res.getStatus()).to.eql(201); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
