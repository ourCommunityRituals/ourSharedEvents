info:
  name: OSE-2127 | final | the event's date changes
  type: http
  seq: 104

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{voteFinalId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"start_date\": \"2099-09-01\", \"end_date\": \"2099-09-01\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 final: the date change is saved', function () { expect(res.getStatus()).to.be.below(300); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
