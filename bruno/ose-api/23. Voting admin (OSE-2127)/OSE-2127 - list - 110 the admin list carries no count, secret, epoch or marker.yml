info:
  name: OSE-2127 | list | the admin list carries no count, secret, epoch or marker
  type: http
  seq: 110

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        function guardedKeys(v, out) {
          out = out || [];
          if (Array.isArray(v)) { v.forEach(function (x) { guardedKeys(x, out); }); }
          else if (v && typeof v === 'object') {
            Object.keys(v).forEach(function (k) {
              if (/secret|margin|floor|counted|duplicate|refused|up_count|down_count|tall(y|ies)|receipt|marker|participant|epoch|void|count|^t$|^v$/i.test(k)) out.push(k);
              guardedKeys(v[k], out);
            });
          }
          return out;
        }
        test('OSE-2127 list: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2127 list: the set and the object carry exactly the listed fields', function () { expect(Object.keys(b.set).sort()).to.eql(['event_id', 'final', 'flood_seen', 'id', 'opened', 'played_by', 'result', 'state']); expect(Object.keys(b.set.result).sort()).to.eql(['outcome', 'winner_object', 'winner_team_id']); expect(Object.keys(b.objects[0]).sort()).to.eql(['booth_id', 'closes_at', 'group_id', 'id', 'kind', 'label', 'open_now', 'sort', 'state']); });
        test('OSE-2234 list: a night with no flood reads flood_seen false, a boolean, after reopen and final', function () { expect(b.set.flood_seen).to.eql(false); });
        test('OSE-2127 list: no guarded key anywhere in the answer', function () { expect(guardedKeys(b)).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
