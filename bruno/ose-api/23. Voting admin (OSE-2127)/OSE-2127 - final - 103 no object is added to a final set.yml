http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteFinalId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Encore\"}"
  auth: inherit

runtime:
