      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 rainy: 409 VOTE_SET_FINAL', function () { expect(res.getStatus()).to.eql(409); expect(b.code).to.eql('VOTE_SET_FINAL'); });

settings:
