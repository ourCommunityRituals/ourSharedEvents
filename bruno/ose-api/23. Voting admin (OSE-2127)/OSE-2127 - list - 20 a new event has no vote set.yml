info:
  name: OSE-2127 | list | a new event has no vote set
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 list: 200, no set, no objects', function () { expect(res.getStatus()).to.eql(200); expect(b.set).to.eql(null); expect(b.objects).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
