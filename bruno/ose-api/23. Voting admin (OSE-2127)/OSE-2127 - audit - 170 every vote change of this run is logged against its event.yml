info:
  name: OSE-2127 | audit | every vote change of this run is logged against its event
  type: http
  seq: 170

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/audit-log?resource_type=event&limit=200"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const night = bru.getVar('voteNightId');
        const fin = bru.getVar('voteFinalId');
        const rows = (b.entries || []).filter(function (r) { return r.resource_id === night || r.resource_id === fin; });
        const actions = rows.map(function (r) { return r.action + ':' + r.outcome; });
        test('OSE-2127 audit: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2127 audit: each write is logged', function () { ['VOTE_SET_CREATE:success', 'VOTE_SET_CREATE:denied', 'VOTABLE_CREATE:success', 'VOTABLE_CREATE:denied', 'VOTE_SET_OPEN:success', 'VOTE_SET_OPEN:denied', 'VOTABLE_OPEN:success', 'VOTABLE_OPEN:denied', 'VOTABLE_CLOSE:denied', 'VOTABLE_REOPEN:denied', 'VOTE_SET_CLOSE:success', 'VOTE_SET_REOPEN:denied', 'VOTE_SET_FINALIZE:success', 'VOTE_SET_FINALIZE:denied'].forEach(function (a) { expect(actions).to.include(a); }); });
        test('OSE-2127 audit: no row carries a detail', function () { rows.filter(function (r) { return /^VOT/.test(r.action); }).forEach(function (r) { expect(r.details == null || r.details === '').to.eql(true); }); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
