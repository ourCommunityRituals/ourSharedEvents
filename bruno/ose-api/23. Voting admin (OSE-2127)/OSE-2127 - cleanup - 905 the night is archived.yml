info:
  name: OSE-2127 | cleanup | the night is archived
  type: http
  seq: 905

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{voteNightId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"status\": \"archived\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2127 cleanup: archived', function () { expect(res.getStatus()).to.be.below(300); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
