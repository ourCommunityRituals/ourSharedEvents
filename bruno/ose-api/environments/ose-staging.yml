name: OSE - Staging (stg.oursharedevents.com)
variables:
  - name: baseUrl
    value: https://stg.oursharedevents.com
  - name: brandId
    value: root
  - secret: true
    name: adminKey
  - name: testEventId
    value: test-event-001
  - name: testEventSlug
    value: test-event
  - name: testFlagKey
    value: forms.register
  - name: testRegistrationId
    value: ""
  - name: testSurveyId
    value: ""
  - name: dbStatus
    value: ""
  - name: workerEnv
    value: ""
  - name: workerVersion
    value: ""
  # A copy of VOTING_ENABLED in [env.staging.vars] of wrangler.toml (OSE-2135).
  # The voting folders (24, and S3b's 25) run their switch-off half while this
  # is "off" and their switch-on half while it is "on"; the other logs NOT RUN. tests/unit/ci/
  # env-parity.test.js holds the two equal. It turns nothing on by itself.
  - name: votingSwitch
    value: "on"
  - secret: true
    name: ocrInternalSecret
