info:
  name: GET /api/v2/events carries HSTS and nosniff
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-2118: the Worker adds HSTS and nosniff to every answer, JSON included.

        // An edge challenge is not the Worker answering, so it fails here by name.

        test('OSE-2118: the Worker answered (no edge challenge)', function() {

        \    expect(res.getHeader('cf-mitigated') || '').to.eql('');

        });

        test('OSE-2118: JSON answer carries Strict-Transport-Security', function() {

        \    expect(res.getHeader('Strict-Transport-Security') || '').to.eql('max-age=31536000; includeSubDomains');

        });

        test('OSE-2118: JSON answer carries X-Content-Type-Options: nosniff', function() {

        \    expect(res.getHeader('X-Content-Type-Options') || '').to.eql('nosniff');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
