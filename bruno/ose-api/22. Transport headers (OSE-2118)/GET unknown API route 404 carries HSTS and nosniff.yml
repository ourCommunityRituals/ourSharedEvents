info:
  name: GET unknown API route 404 carries HSTS and nosniff
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/ose-2118-no-such-route"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-2118: an error answer (404) carries the transport headers too.

        test('OSE-2118: the Worker answered (no edge challenge)', function() {

        \    expect(res.getHeader('cf-mitigated') || '').to.eql('');

        });

        test('OSE-2118: unknown API route answers 404', function() {

        \    expect(res.getStatus()).to.eql(404);

        });

        test('OSE-2118: 404 carries Strict-Transport-Security', function() {

        \    expect(res.getHeader('Strict-Transport-Security') || '').to.eql('max-age=31536000; includeSubDomains');

        });

        test('OSE-2118: 404 carries X-Content-Type-Options: nosniff', function() {

        \    expect(res.getHeader('X-Content-Type-Options') || '').to.eql('nosniff');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
