info:
  name: "Partner links | cleanup | the event is deleted with its links (no scans)"
  type: http
  seq: 900

# Mock-layer twin: workers/oursharedevents/tests/event-partners-route.spec.ts.

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/{{partnerEventId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Partner links cleanup: 200', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
