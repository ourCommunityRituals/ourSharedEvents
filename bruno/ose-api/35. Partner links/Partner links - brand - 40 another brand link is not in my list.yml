info:
  name: "Partner links | brand | a link offered to another brand is not in my partner list"
  type: http
  seq: 40

# Mock-layer twin: workers/oursharedevents/tests/event-partners-route.spec.ts.

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/partner-links"
  headers:
    - name: CF-Access-Client-Id
      value: "{{ciBrandClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{ciBrandClientSecret}}"
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // OSE-1800: the CI service actor, a brand admin of ci-brand only. Inert
        // until the owner creates the Access service token and adds its secrets.
        // Until then this request is skipped and logs NOT RUN; it records no passing test.
        if (!bru.getEnvVar('ciBrandClientId') || !bru.getEnvVar('ciBrandClientSecret')) {
          console.log('NOT RUN (OSE-1800 setup pending): no CI brand service token configured');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const ls = ((res.getBody() || {}).links || []);
        test('Partner links brand: 200, and the link offered to fernbrook-parks is not here', function () {
          expect(res.getStatus()).to.eql(200);
          expect(ls.map(function (l) { return l.id; })).to.not.include(bru.getVar('partnerLinkId'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
