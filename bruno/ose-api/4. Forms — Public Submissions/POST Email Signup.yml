info:
  name: POST Email Signup
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/email-signup"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "postman-signup@example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('ok is true', function() {\r

        \        expect(json.ok).to.eql(true);\r

        \    });\r

        \r

        \    test('Has signup id', function() {\r

        \        expect(json.id).to.be.a('string');\r

        \    });\r

        } else if (res.getStatus() === 403) {\r

        \    test('403 means form disabled', function() {\r

        \        expect(json.code).to.eql('FORM_DISABLED');\r

        \    });\r

        } else if (res.getStatus() === 503) {\r

        \    test('503 has error code', function() {\r

        \        expect(json.code).to.exist;\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
