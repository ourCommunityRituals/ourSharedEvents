info:
  name: POST Check-in
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/checkin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('ok is true', function() {\r

        \        expect(json.ok).to.eql(true);\r

        \    });\r

        \r

        \    test('Has count (number)', function() {\r

        \        expect(json.count).to.be.a('number');\r

        \        expect(json.count).to.be.at.least(1);\r

        \    });\r

        } else if (res.getStatus() === 403) {\r

        \    test('403 means form disabled', function() {\r

        \        expect(json.code).to.eql('FORM_DISABLED');\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
