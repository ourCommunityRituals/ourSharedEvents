info:
  name: POST Check-in
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/checkin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has count floored like the admin count (number from 5, else null + suppressed)', function() {

        \        expect(json.floor).to.eql(5);

        \        if (json.suppressed) {

        \            expect(json.count).to.eql(null);

        \        } else {

        \            expect(json.suppressed).to.eql(false);

        \            expect(json.count).to.be.at.least(5);

        \        }

        \    });

        } else if (res.getStatus() === 403) {

        \    test('403 means form disabled', function() {

        \        expect(json.code).to.eql('FORM_DISABLED');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
