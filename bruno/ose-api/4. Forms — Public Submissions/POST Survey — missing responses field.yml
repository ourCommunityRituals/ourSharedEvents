info:
  name: POST Survey — missing responses field
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/survey"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "not_responses": "missing the required field"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        test('Returns 400 or 403', function() {\r

        \    expect(res.getStatus()).to.be.oneOf([400, 403]);\r

        });\r

        \r

        if (res.getStatus() === 400) {\r

        \    test('MISSING_FIELD code', function() {\r

        \        expect(json.code).to.eql('MISSING_FIELD');\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
