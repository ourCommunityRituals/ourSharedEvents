info:
  name: POST Survey
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/survey"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "responses": {
          "overall_rating": 5,
          "venue_score": 4,
          "speaker_quality": "excellent",
          "feedback": "Great event, well organized!",
          "would_recommend": true
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('ok is true', function() {\r

        \        expect(json.ok).to.eql(true);\r

        \    });\r

        \r

        \    test('Has survey id', function() {\r

        \        expect(json.id).to.be.a('string');\r

        \    });\r

        \r

        \    bru.setEnvVar('testSurveyId', json.id);\r

        } else if (res.getStatus() === 403) {\r

        \    test('403 means form disabled', function() {\r

        \        expect(json.code).to.eql('FORM_DISABLED');\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
