info:
  name: POST Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/{{testEventId}}/forms/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Postman Test User",
        "email": "postman-test@example.com",
        "sourcePlacementId": "qr-poster-001"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has registration id', function() {

        \        expect(json.id).to.be.a('string');

        \    });

        

        \    test('Has registrationBucket', function() {

        \        expect(json.registrationBucket).to.be.a('string');

        \    });

        

        \    bru.setEnvVar('testRegistrationId', json.id);

        \    console.log('Captured testRegistrationId: ' + json.id);

        } else if (res.getStatus() === 403) {

        \    test('403 means form disabled', function() {

        \        expect(json.code).to.eql('FORM_DISABLED');

        \    });

        } else if (res.getStatus() === 503) {

        \    test('503 is a DB or config error', function() {

        \        expect(json.code).to.be.oneOf(['DB_NOT_CONFIGURED', 'DB_ERROR', 'CONFIG_ERROR']);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
