info:
  name: "OSE-2128 | off | 60 with VOTING_ENABLED off a vote is the router 404, byte for byte"
  type: http
  seq: 60

http:
  method: POST
  url: "{{baseUrl}}/api/v2/vote/{{voteRouteNightId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Sec-Fetch-Site
      value: same-origin
  body:
    type: json
    data: "{\"object_id\": \"{{voteRouteSongId}}\", \"side\": \"up\", \"pass\": \"vp1.not-a-pass.x\"}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') === 'on') {
          console.log('NOT RUN (VOTING_ENABLED is on on this environment): the switch-off half runs only while it is off');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const text = JSON.stringify(res.getBody());
        test('OSE-2128 off: 404, the same answer as a path that never existed', function () { expect(res.getStatus()).to.eql(404); expect(text).to.eql(bru.getVar('voteRouteNowhere')); });
        test('OSE-2128 off: no cookie set', function () { expect(res.getHeader('set-cookie')).to.be.undefined; });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
