info:
  name: "OSE-2128 | on | 70 a vote with no pass is refused, with no count and no cookie"
  type: http
  seq: 70

http:
  method: POST
  url: "{{baseUrl}}/api/v2/vote/{{voteRouteNightId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Sec-Fetch-Site
      value: same-origin
  body:
    type: json
    data: "{\"object_id\": \"{{voteRouteSongId}}\", \"side\": \"up\"}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') !== 'on') {
          console.log('NOT RUN (VOTING_ENABLED off on this environment): the switch-on half of the vote route');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const text = JSON.stringify(b);
        test('OSE-2128 on: refused with 400', function () { expect(res.getStatus()).to.eql(400); expect(b.ok).to.eql(false); });
        test('OSE-2128 on: no number and no cookie in the answer', function () { expect(/\d/.test(text)).to.eql(false); expect(res.getHeader('set-cookie')).to.be.undefined; expect(String(res.getHeader('cache-control'))).to.contain('no-store'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
