info:
  name: "DEC13 | control | 59 a path that never existed"
  type: http
  seq: 59

http:
  method: POST
  url: "{{baseUrl}}/api/v2/vote-never-was"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Sec-Fetch-Site
      value: same-origin
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('DEC13 control: the router 404', function () { expect(res.getStatus()).to.eql(404); });
        bru.setVar('accessNowhere', JSON.stringify(res.getBody()));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
