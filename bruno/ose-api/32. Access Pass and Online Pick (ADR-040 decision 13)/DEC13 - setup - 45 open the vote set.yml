info:
  name: "DEC13 | setup | 45 open the vote set"
  type: http
  seq: 45

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{accessNightId}}/votables/open"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"room_size\": 200}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('DEC13 setup: the set opens', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
