info:
  name: "DEC13 | off | 61 with voting off an Online Pick vote is the router 404"
  type: http
  seq: 61

http:
  method: POST
  url: "{{baseUrl}}/api/v2/vote/{{accessNightId}}/crowd"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Sec-Fetch-Site
      value: same-origin
  body:
    type: json
    data: "{\"object_id\": \"vo_x\", \"side\": \"up\", \"pass\": \"vc1.not-a-pass.x\"}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') === 'on') {
          console.log('NOT RUN (VOTING_ENABLED is on on this environment): the switch-off half runs only while it is off');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        test('DEC13 off: crowd vote is the router 404, byte for byte', function () { expect(res.getStatus()).to.eql(404); expect(JSON.stringify(res.getBody())).to.eql(bru.getVar('accessNowhere')); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
