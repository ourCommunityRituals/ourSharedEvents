info:
  name: "DEC13 | admin | 35 give a second pass, to use"
  type: http
  seq: 35

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{accessNightId}}/votables/access-passes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const p = (res.getBody() || {}).access_pass || {};
        test('DEC13 give: a second pass, 201', function () { expect(res.getStatus()).to.eql(201); });
        bru.setVar('accessPassToken2', String(p.url || '').split('#')[1] || '');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
