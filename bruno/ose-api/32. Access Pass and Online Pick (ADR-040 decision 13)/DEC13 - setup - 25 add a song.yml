info:
  name: "DEC13 | setup | 25 add a song"
  type: http
  seq: 25

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{accessNightId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Access song one\", \"sort\": 0}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('DEC13 setup: the song is added', function () { expect(res.getStatus()).to.eql(201); });
        bru.setVar('accessSongId', (b.object && b.object.id) || 'missing-song');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
