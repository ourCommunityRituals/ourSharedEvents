info:
  name: OSE-1684 | /tv/ code | opens the TV page
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tv/{{eventCode}}"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Contract: what the organizer types on the venue TV. 302 to /events/<id>/tv.
        const id = bru.getEnvVar('testEventId');
        if (bru.getVar('eventCode')) {
          test('302 to /events/<id>/tv', function () {
            expect(res.getStatus()).to.eql(302);
            const loc = String(res.getHeader('Location') || '').replace(/^https?:\/\/[^/]+/, '');
            expect(loc).to.eql('/events/' + id + '/tv');
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
