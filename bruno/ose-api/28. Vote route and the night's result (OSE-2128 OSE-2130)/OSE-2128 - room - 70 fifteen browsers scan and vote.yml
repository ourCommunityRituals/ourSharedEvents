info:
  name: "OSE-2128 | room | fifteen browsers scan the vote code and vote (switch on)"
  type: http
  seq: 70

# Never prints a Location, a pass or a cookie: each check compares booleans or fixed
# text. The admin read is the request this check hangs on; it carries no count.

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{voteRouteNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2128 room: the admin list reads 200', function () { expect(res.getStatus()).to.eql(200); });

        // Helpers for the switch-on half (OSE-2128). They never print a Location, a
        // pass, a cookie or a voter: every check compares booleans or fixed text.
        var base = bru.getEnvVar('baseUrl');
        var access = { 'CF-Access-Client-Id': bru.getEnvVar('cfAccessClientId') || '', 'CF-Access-Client-Secret': bru.getEnvVar('cfAccessClientSecret') || '' };
        var edgeToken = bru.getEnvVar('ocrCiEdgeToken') || '';
        function send(cfg) {
          return new Promise(function (resolve) {
            bru.sendRequest(Object.assign({ timeout: 20000, maxRedirects: 0, validateStatus: null }, cfg), function (err, r) {
              var x = r || (err && err.response) || null;
              if (!x) { resolve({ status: (err && err.status) || 0, headers: {}, data: null }); return; }
              resolve({ status: x.status, headers: x.headers || {}, data: x.data });
            });
          });
        }
        function header(r, name) {
          var h = r.headers || {};
          var key = Object.keys(h).filter(function (k) { return k.toLowerCase() === name; })[0];
          var v = key ? h[key] : undefined;
          return Array.isArray(v) ? v.join(', ') : v;
        }
        function text(r) { return typeof r.data === 'string' ? r.data : JSON.stringify(r.data); }
        function browser() {
          var hex = '';
          for (var i = 0; i < 32; i++) hex += Math.floor(Math.random() * 16).toString(16);
          return 'anon_' + hex;
        }
        // One scan of the room's vote code by one browser: its pass, or '' when none.
        async function scan(token, cookie) {
          var headers = Object.assign({ Cookie: 'ose_anon=' + cookie, Accept: 'text/html', 'User-Agent': 'ose-bruno-vote-route' }, access);
          if (edgeToken) headers['X-OCR-CI'] = edgeToken;
          var r = await send({ method: 'GET', url: base + '/q/' + token + '?type=vote', headers: headers });
          var loc = String(header(r, 'location') || '');
          var at = loc.indexOf('#t=');
          var pass = at < 0 ? '' : loc.slice(at + 3);
          loc = null;
          return pass;
        }
        async function vote(nightId, objectId, side, pass) {
          var r = await send({
            method: 'POST',
            url: base + '/api/v2/vote/' + nightId,
            headers: { 'Content-Type': 'application/json', 'Sec-Fetch-Site': 'same-origin' },
            data: JSON.stringify({ object_id: objectId, side: side, pass: pass })
          });
          return { status: r.status, body: text(r), cookie: header(r, 'set-cookie') };
        }
        var on = bru.getEnvVar('votingSwitch') === 'on';

        if (!on) {
          console.log('NOT RUN (VOTING_ENABLED off on staging): 15 browsers scan the vote code at /q and vote; answers, duplicates, draft and cross-night refusals');
        } else {
          var token = bru.getVar('voteRouteToken');
          var otherToken = bru.getVar('voteRouteOtherToken');
          var night = bru.getVar('voteRouteNightId');
          var other = bru.getVar('voteRouteOtherId');
          var A = bru.getVar('voteRouteSongA');
          var B = bru.getVar('voteRouteSongB');
          var C = bru.getVar('voteRouteSongC');
          var O = bru.getVar('voteRouteOtherSong');
          var browsers = [];
          var passes = [];
          var answers = [];
          for (var i = 0; i < 15; i++) {
            var c = browser();
            browsers.push(c);
            passes.push(await scan(token, c));
          }
          var allPassed = passes.every(function (p) { return /^vp1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(p); });
          for (var v = 0; v < 15; v++) answers.push(await vote(night, v < 12 ? A : B, 'up', passes[v]));
          var dupA = await vote(night, A, 'up', passes[0]);
          var dupSide = await vote(night, A, 'down', passes[0]);
          var draft = await vote(night, C, 'up', passes[1]);
          var otherObject = await vote(night, O, 'up', passes[2]);
          var otherNight = await vote(other, O, 'up', passes[3]);
          var otherPass = await scan(otherToken, browsers[4]);
          var crossPass = await vote(night, A, 'up', otherPass);
          bru.setVar('voteRouteBrowsersB', JSON.stringify(browsers.slice(12)));
          bru.setVar('voteRoutePassesB', JSON.stringify(passes.slice(12)));
          test('OSE-2128 on: 15 browsers each got a pass from the vote code, in the fragment', function () { expect(allPassed).to.eql(true); });
          test('OSE-2128 on: every vote answers {"ok":true}, with no cookie', function () {
            answers.forEach(function (a) { expect(a.status).to.eql(200); expect(a.body).to.eql('{"ok":true}'); expect(a.cookie === undefined || a.cookie === null).to.eql(true); });
          });
          test('OSE-2128 on: a duplicate, either side, answers the same bytes', function () {
            [dupA, dupSide].forEach(function (a) { expect(a.status).to.eql(answers[0].status); expect(a.body).to.eql(answers[0].body); });
          });
          test('OSE-2128 on: a song in draft is refused', function () { expect(draft.status).to.eql(409); expect(draft.body).to.eql('{"ok":false,"code":"NOT_OPEN"}'); });
          test('OSE-2128 on: another night\'s song at this night is refused', function () { expect(otherObject.status).to.eql(409); });
          test('OSE-2128 on: this night\'s pass at another night is refused', function () { expect(otherNight.status).to.eql(403); });
          test('OSE-2128 on: another night\'s pass at this night is refused', function () { expect(crossPass.status).to.eql(403); });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
