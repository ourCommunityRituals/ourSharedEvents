info:
  name: "OSE-2128 | setup | open the vote set of the second night"
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteRouteOtherId}}/votables/open"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2128 setup: the set of the second night is open', function () { expect(res.getStatus()).to.eql(200); expect(b.set && b.set.state).to.eql('open'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
