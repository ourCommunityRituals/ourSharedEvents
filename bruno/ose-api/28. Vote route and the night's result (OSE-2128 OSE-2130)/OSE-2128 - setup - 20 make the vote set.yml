info:
  name: "OSE-2128 | setup | make the vote set of the night"
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteRouteNightId}}/votables"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"played_by\": \"object\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2128 setup: the set of the night is made, in draft', function () { expect(res.getStatus()).to.eql(201); expect(b.set && b.set.state).to.eql('draft'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
