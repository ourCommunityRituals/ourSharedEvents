info:
  name: "OSE-2128 | setup | add Song B"
  type: http
  seq: 31

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{voteRouteNightId}}/votables/objects"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"kind\": \"song\", \"label\": \"Song B\", \"sort\": 1}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2128 setup: Song B is added', function () { expect(res.getStatus()).to.eql(201); });
        bru.setVar('voteRouteSongB', (b.object && b.object.id) || 'missing-song');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
