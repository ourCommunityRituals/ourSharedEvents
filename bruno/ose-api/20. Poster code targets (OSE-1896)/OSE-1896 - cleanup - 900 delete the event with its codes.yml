info:
  name: OSE-1896 | cleanup | the event is deleted with its codes (no scans)
  type: http
  seq: 900

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-1896 cleanup: 200, the event is deleted', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
