info:
  name: OSE-1896 | sunny | save | an https link is saved (the save works on this event)
  type: http
  seq: 60

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"codes\": [{\"kind\": \"donation\", \"target_url\": \"https://example.org/give\"}]}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const codes = Array.isArray(b.codes) ? b.codes : [];
        const donate = codes.filter(function (c) { return c.kind === 'donation'; });
        test('OSE-1896 https: 200 and the donation code is on the poster', function () { expect(res.getStatus()).to.eql(200); expect(b.ok).to.eql(true); expect(donate.length).to.eql(1); });
        test('OSE-1896 https: the code points at the saved address', function () { expect((donate[0] || {}).target_url).to.eql('https://example.org/give'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
