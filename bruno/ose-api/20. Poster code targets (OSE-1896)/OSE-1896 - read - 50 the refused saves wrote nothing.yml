info:
  name: OSE-1896 | rainy | read | the refused saves wrote nothing
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const codes = Array.isArray(b.codes) ? b.codes : [{ kind: 'no-list' }];
        test('OSE-1896 nothing saved: the codes are the ones read before', function () { expect(res.getStatus()).to.eql(200); expect(JSON.stringify(codes.map(function (c) { return [c.kind, c.code, c.target_url]; }))).to.eql(bru.getVar('posterCodesBefore')); });
        test('OSE-1896 nothing saved: no donation or tickets code', function () { const kinds = codes.map(function (c) { return c.kind; }); expect(kinds).to.not.include('donation'); expect(kinds).to.not.include('tickets'); });
        test('OSE-1896 nothing saved: no code points at a javascript: or http: address', function () { codes.forEach(function (c) { expect(String(c.target_url || '')).to.not.match(/^(javascript|http):/i); expect(String(c.points_to || '')).to.not.match(/^javascript:/i); expect(String(c.points_to || '')).to.not.include('example.org'); }); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
