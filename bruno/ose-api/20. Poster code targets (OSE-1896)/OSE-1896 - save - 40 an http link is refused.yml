info:
  name: OSE-1896 | rainy | save | an http link is refused, with the good row beside it
  type: http
  seq: 40

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"codes\": [{\"kind\": \"donation\", \"target_url\": \"https://example.org/give\"}, {\"kind\": \"tickets\", \"target_url\": \"http://example.org/tickets\"}]}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1896 http: 400 INVALID_TARGET', function () { expect(res.getStatus()).to.eql(400); expect(b.ok).to.eql(false); expect(b.code).to.eql('INVALID_TARGET'); });
        test('OSE-1896 http: the refusal names the row and the rule', function () { expect(b.index).to.eql(1); expect(b.error).to.eql('The TICKETS link must be a full https:// address.'); });
        test('OSE-1896 http: the refusal carries no list of codes', function () { expect(b).to.not.have.property('codes'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
