info:
  name: OSE-1896 | rainy | read | the saved link is unchanged
  type: http
  seq: 80

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const donate = (Array.isArray(b.codes) ? b.codes : []).filter(function (c) { return c.kind === 'donation'; });
        test('OSE-1896 unchanged: the donation code still points at the https address', function () { expect(res.getStatus()).to.eql(200); expect(donate.length).to.eql(1); expect(donate[0].target_url).to.eql('https://example.org/give'); expect(donate[0].points_to).to.eql('https://example.org/give'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
