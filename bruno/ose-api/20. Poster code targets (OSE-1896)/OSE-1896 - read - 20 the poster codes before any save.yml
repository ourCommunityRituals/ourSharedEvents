info:
  name: OSE-1896 | sunny | read | the poster codes before any save
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{posterTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const codes = Array.isArray(b.codes) ? b.codes : null;
        test('OSE-1896 read: 200 and a list of codes', function () { expect(res.getStatus()).to.eql(200); expect(codes).to.be.an('array'); });
        test('OSE-1896 read: a new event has no donation or tickets code', function () { const kinds = (codes || []).map(function (c) { return c.kind; }); expect(kinds).to.not.include('donation'); expect(kinds).to.not.include('tickets'); });
        bru.setVar('posterCodesBefore', JSON.stringify((codes || [{ kind: 'no-list' }]).map(function (c) { return [c.kind, c.code, c.target_url]; })));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
