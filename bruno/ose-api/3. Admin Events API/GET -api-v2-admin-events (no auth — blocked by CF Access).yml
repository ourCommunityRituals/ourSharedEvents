info:
  name: GET /api/v2/admin/events (no auth — blocked by CF Access)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: X-Test-No-Auth
      value: "true"
      enabled: true

runtime:
  scripts:
    - type: after-response
      code: "// CF Access intercepts unauthenticated admin requests before they reach the Worker.

        // The response is either 302 (redirect to login) or 200 (login page HTML after redirect).

        // The key contract: unauthenticated requests do NOT receive JSON event data.

        test('Unauthenticated admin request is blocked', function() {

        \    const status = res.getStatus();

        \    expect([200, 302, 401, 403]).to.include(status);

        });

        

        test('Does not return JSON event data', function() {

        \    const ct = res.getHeader('Content-Type') || '';

        \    if (ct.includes('application/json')) {

        \        const json = res.getBody();

        \        expect(json.ok).to.not.eql(true);

        \    }

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
