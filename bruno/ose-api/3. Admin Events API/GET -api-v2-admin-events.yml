info:
  name: GET /api/v2/admin/events
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// CF Access may intercept this request before it reaches the Worker.

        // Three valid outcomes: 200 JSON (auth passed), 401 (Worker auth), or CF Access block (302/200 HTML).

        const ct = res.getHeader('Content-Type') || '';

        const isCfAccessBlocked = !ct.includes('application/json');

        

        if (isCfAccessBlocked) {

        \    test('CF Access blocked — admin route protected', function() {

        \        expect([200, 302, 403]).to.include(res.getStatus());

        \    });

        \    console.warn('CF Access blocked admin API — set CF-Access-Client-Id/Secret to bypass');

        } else if (res.getStatus() === 200) {

        \    const json = res.getBody();

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('items is array', function() {

        \        expect(json.items).to.be.an('array');

        \    });

        

        \    test('Cache-Control is no-store (admin)', function() {

        \        expect(res.getHeader('Cache-Control')).to.eql('no-store');

        \    });

        

        \    test('Returns items sorted by updated_at DESC', function() {

        \        if (json.items.length >= 2) {

        \            expect(json.items[0].updated_at >= json.items[1].updated_at).to.be.true;

        \        }

        \    });

        } else if (res.getStatus() === 401) {

        \    const json = res.getBody();

        \    test('401 has UNAUTH code', function() {

        \        expect(json.code).to.eql('UNAUTH');

        \    });

        \    console.warn('AUTH FAILED — set adminKey in environment');

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
