info:
  name: "OSE-2224 | off | the open-objects read says nothing while voting is off"
  type: http
  seq: 61

http:
  method: GET
  url: "{{baseUrl}}/api/v2/vote/{{voteEntryNightId}}/objects"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('votingSwitch') === 'on') {
          console.log('NOT RUN (VOTING_ENABLED is on on this environment): the switch-off half runs only while it is off');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const text = JSON.stringify(res.getBody());
        test('OSE-2224 off: 404, and no entry, id or cookie in the answer', function () { expect(res.getStatus()).to.eql(404); expect(text).to.not.contain('Entry chili one'); expect(text).to.not.contain(bru.getVar('voteEntryId')); expect(res.getHeader('set-cookie')).to.be.undefined; });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
