info:
  name: "OSE-2224 | setup | a synthetic live fair for this run, unlisted"
  type: http
  seq: 10

# Automation may create an event live (OSE-1425). It is synthetic and unlisted.
# A vote set is never deleted (ADR-040 decision 4), so seq 905 archives it.

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"attendance_mode\":\"in_person\",\"location\":\"OSE-2224 Hall\",\"title\":\"OSE-2224 chili cook-off (staging, synthetic)\",\"status\":\"active\",\"is_published\":false,\"data_class\":\"synthetic\",\"start_date\":\"2099-01-01\",\"start_time\":\"12:00\",\"timezone\":\"America/Chicago\",\"event_type_id\":\"etr-rec-bocce\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-2224 setup: the live fair is created', function () { expect(res.getStatus()).to.eql(201); expect(b.event_status).to.eql('active'); expect(b.id).to.be.a('string'); });
        bru.setVar('voteEntryNightId', b.id || 'missing-night');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
