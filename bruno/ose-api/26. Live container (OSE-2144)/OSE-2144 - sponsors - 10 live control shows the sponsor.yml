info:
  name: 'OSE-2144 | sunny | sponsors API | a live event shows its accepted sponsor (control)'
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/lc-live-evt/sponsors"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().items || []).map(function (s) { return s.id; });
        test('OSE-2144 control: a live event shows its sponsor', function () {
          expect(res.getStatus()).to.eql(200);
          expect(ids).to.eql(['sb_lc_live']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
