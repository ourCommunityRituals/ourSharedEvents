info:
  name: 'OSE-2144 | sunny | /q | a code on a live event lands on the event (control)'
  type: http
  seq: 70

http:
  method: GET
  url: "{{baseUrl}}/q/qrt_lc_live"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
    - name: Accept
      value: text/html
    - name: User-Agent
      value: ose-bruno-live-container
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The edge refuses a /q scan from a CI runner that does not carry the CI
        // edge token (X-OCR-CI), the same headers folder 25 sends (OSE-939). A
        // 403 here is the edge, not the Worker: the Worker never answers /q 403.
        test('OSE-2144 control: 302 to the event page', function () {
          expect(res.getStatus()).to.eql(302);
          expect(String(res.getHeader('location') || '')).to.include('/events/lc-live-evt');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
