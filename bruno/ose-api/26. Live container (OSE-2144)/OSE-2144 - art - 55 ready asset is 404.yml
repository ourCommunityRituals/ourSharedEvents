info:
  name: 'OSE-2144 | rainy | sponsor creative | a sponsor whose only placement is ready gets no creative and no monogram'
  type: http
  seq: 55

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_lc_ready/asset/square"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2144 rainy: ready: 404, so not even the monogram names the sponsor', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
