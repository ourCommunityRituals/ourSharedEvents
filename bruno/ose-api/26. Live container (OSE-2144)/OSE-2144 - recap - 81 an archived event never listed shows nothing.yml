info:
  name: 'OSE-2144 | rainy | recap page | an archived event that was never listed has no recap and names no sponsor'
  type: http
  seq: 81

http:
  method: GET
  url: "{{baseUrl}}/events/lc-archived-evt"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2144 rainy: no recap, no sponsor name', function () {
          expect(res.getStatus()).to.not.eql(200);
          expect(String(res.getBody() || '')).to.not.include('Live Container Archived Sponsor');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
