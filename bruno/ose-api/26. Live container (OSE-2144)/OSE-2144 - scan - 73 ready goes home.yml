info:
  name: 'OSE-2144 | rainy | /q | a code on a ready event counts nothing and goes home without the event id'
  type: http
  seq: 73

http:
  method: GET
  url: "{{baseUrl}}/q/qrt_lc_ready"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
    - name: Accept
      value: text/html
    - name: User-Agent
      value: ose-bruno-live-container
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The edge refuses a /q scan from a CI runner that does not carry the CI
        // edge token (X-OCR-CI), the same headers folder 25 sends (OSE-939). A
        // 403 here is the edge, not the Worker: the Worker never answers /q 403.
        // The same answer as a code nobody issued (request 71): the scan is not
        // looked up, so nothing is counted and no anonymous cookie is set.
        test('OSE-2144 rainy: ready: 302 to /, no event id, no cookie', function () {
          expect(res.getStatus()).to.eql(302);
          expect(res.getHeader('location')).to.eql('/');
          expect(String(res.getHeader('location') || '')).to.not.include('lc-ready-evt');
          expect(res.getHeader('set-cookie')).to.be.oneOf([undefined, null]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
