info:
  name: 'OSE-2144 | rainy | logo proxy | a sponsor whose only placement is archived gets no logo'
  type: http
  seq: 56

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sponsors/sb_lc_archived/logo?slot=sidebar"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2144 rainy: archived: 404', function () { expect(res.getStatus()).to.eql(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
