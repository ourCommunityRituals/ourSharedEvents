info:
  name: 'OSE-2144 | rainy | sponsor bundle (TV) | a ready event carries no sponsor and no beacon token'
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/lc-ready-evt/sponsor-bundle?surface=display"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const text = JSON.stringify(res.getBody());
        test('OSE-2144 rainy: ready: no sponsor, no name, no beacon token', function () {
          expect(res.getStatus()).to.eql(200);
          expect(text).to.not.include('sb_lc_ready');
          expect(text).to.not.include('Live Container');
          expect(text).to.not.include('beacon_token');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
