info:
  name: 'OSE-2144 | rainy | sponsors API | a archived listed event shows no sponsor'
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/lc-recap-evt/sponsors"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2144 rainy: archived listed: 200 with no sponsor', function () {
          expect(res.getStatus()).to.eql(200);
          expect(res.getBody().items).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
