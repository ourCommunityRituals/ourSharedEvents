info:
  name: 'OSE-2214 | sunny | /q | a poster code lands on the event and sets no cookie'
  type: http
  seq: 76

http:
  method: GET
  url: "{{baseUrl}}/q/qrt_lc_live"
  headers:
    - name: X-Test-No-Auth
      value: "1"
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
    - name: Accept
      value: text/html
    - name: User-Agent
      value: ose-bruno-live-container
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // OSE-2214 (owner, 2026-11-23; ADR-024 option C for scans): OSE counts
        // the traffic on the code, never the phone. A poster code neither reads
        // nor sets the ose_anon cookie. Only the room's vote code still does.
        // Cookies the edge may set (names starting __cf, _cf, cf_ or CF_) are
        // Cloudflare's own and are not the Worker's. The NAMES are logged,
        // never a value. A 403 here is the edge (see scan 70), not the Worker.
        var cookieNames = [];
        [].concat(res.getHeader('set-cookie') || []).forEach(function (h) {
          String(h).split(/,(?=\s*[A-Za-z0-9_.-]+=)/).forEach(function (c) {
            var name = c.split('=')[0].trim();
            if (name) cookieNames.push(name);
          });
        });
        var workerCookies = cookieNames.filter(function (n) { return !/^(__cf|_cf|cf_)/i.test(n); });
        console.log('OSE-2214 scan 76 cookie names: ' + (cookieNames.join(',') || '(none)'));
        test('OSE-2214: a poster code lands on the event page', function () {
          expect(res.getStatus()).to.eql(302);
          expect(String(res.getHeader('location') || '')).to.include('/events/lc-live-evt');
        });
        test('OSE-2214: a poster code sets no cookie of the Worker', function () {
          expect(workerCookies).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
