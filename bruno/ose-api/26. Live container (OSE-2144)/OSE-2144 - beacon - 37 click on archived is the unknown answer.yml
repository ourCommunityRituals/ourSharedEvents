info:
  name: 'OSE-2144 | rainy | click beacon | a archived event answers like an unknown pair'
  type: http
  seq: 37

http:
  method: POST
  url: "{{baseUrl}}/api/v2/events/lc-archived-evt/sponsors/sb_lc_archived/click"
  headers:
    - name: X-Test-No-Auth
      value: "1"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: '{"surface":"public","placement":"mobileBanner"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The same 404 NOT_FOUND an unknown pair gets (request 30): no row is
        // written, and the answer does not show that a placement exists.
        test('OSE-2144 rainy: click on archived: 404 NOT_FOUND', function () {
          expect(res.getStatus()).to.eql(404);
          expect(res.getBody().code).to.eql('NOT_FOUND');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
