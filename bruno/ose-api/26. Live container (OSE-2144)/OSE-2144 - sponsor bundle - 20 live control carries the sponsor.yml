info:
  name: 'OSE-2144 | sunny | sponsor bundle (TV) | a live event carries its sponsor (control)'
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/lc-live-evt/sponsor-bundle?surface=display"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-2144 control: the TV bundle carries the live sponsor', function () {
          expect(res.getStatus()).to.eql(200);
          expect(JSON.stringify(res.getBody())).to.include('sb_lc_live');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
