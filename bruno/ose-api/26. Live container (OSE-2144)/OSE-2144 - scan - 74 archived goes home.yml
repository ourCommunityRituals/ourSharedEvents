info:
  name: 'OSE-2144 | rainy | /q | a code on a archived event counts nothing and goes home without the event id'
  type: http
  seq: 74

http:
  method: GET
  url: "{{baseUrl}}/q/qrt_lc_archived"
  headers:
    - name: X-Test-No-Auth
      value: "1"
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
    - name: Accept
      value: text/html
    - name: User-Agent
      value: ose-bruno-live-container
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The edge refuses a /q scan from a CI runner that does not carry the CI
        // edge token (X-OCR-CI): the stg skip rule covers /q/* for that header
        // alone (docs/runbooks/RUNBOOK-STG-CI-SKIP-RULE.md). A 403 here is the
        // edge, not the Worker: the Worker never answers /q 403. The edge may set
        // cookies of its own, so "no cookie" means no ose_anon cookie (the
        // Worker's only one), not an empty Set-Cookie.
        var setCookie = [].concat(res.getHeader('set-cookie') || []).join('\n');
        // The same answer as a code nobody issued (request 71): the scan is not
        // looked up, so nothing is counted and no anonymous cookie is set.
        test('OSE-2144 rainy: archived: 302 to /, no event id, no cookie', function () {
          expect(res.getStatus()).to.eql(302);
          expect(res.getHeader('location')).to.eql('/');
          expect(String(res.getHeader('location') || '')).to.not.include('lc-archived-evt');
          expect(setCookie).to.not.include('ose_anon=');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
