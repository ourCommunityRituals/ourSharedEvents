info:
  name: "OSE-1998 | cleanup | the live fair is deleted with its stalls (no scans)"
  type: http
  seq: 905

http:
  method: DELETE
  url: "{{baseUrl}}/api/v2/admin/events/{{boothLiveFairId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('OSE-1998 cleanup: 200, the cascade cleared the stalls', function () { expect(res.getStatus()).to.eql(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
