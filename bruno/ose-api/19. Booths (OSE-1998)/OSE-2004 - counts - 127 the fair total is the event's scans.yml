info:
  name: OSE-2004 | sunny | counts | the fair total is the event's scans on /stats
  type: http
  seq: 127

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/stats"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Named fields only: stats.scans against the total from seq 125.
        const b = res.getBody() || {};
        test('OSE-2004 counts: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-2004 counts: /stats scans equal the stall route total', function () {
          expect(b.stats.scans).to.eql(JSON.parse(bru.getVar('boothCountsTotal') || 'null'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
