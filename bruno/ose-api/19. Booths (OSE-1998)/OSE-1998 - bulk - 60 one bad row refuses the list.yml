info:
  name: OSE-1998 | rainy | bulk | one bad row refuses the whole list and names it
  type: http
  seq: 60

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths/bulk"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"booths\": [{\"number\": \"C1\", \"name\": \"Fine\"}, {\"number\": \"C2\", \"name\": \"call 312-555-0142\"}, {\"number\": \"c1\", \"name\": \"Same number\"}]}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 bulk refused: 400 BOOTHS_REFUSED, nothing saved', function () { expect(res.getStatus()).to.eql(400); expect(b.code).to.eql('BOOTHS_REFUSED'); expect(b.created).to.eql(0); });
        test('OSE-1998 bulk refused: every refused row is named', function () {
          expect((b.failed || []).map(function (f) { return [f.index, f.code]; })).to.eql([[0, 'DUPLICATE_NUMBER'], [1, 'INVALID_NAME'], [2, 'DUPLICATE_NUMBER']]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
