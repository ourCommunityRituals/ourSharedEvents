info:
  name: OSE-1998 | audit | the create, update and deactivate are logged against the fair
  type: http
  seq: 170

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/audit-log?resource_type=event&limit=100"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const fair = bru.getVar('boothFairId');
        const rows = (res.getBody().entries || []).filter(function (r) { return r.resource_id === fair; });
        const actions = rows.map(function (r) { return r.action + ':' + r.outcome; });
        test('OSE-1998 audit: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1998 audit: each booth write of this run is logged', function () {
          ['CREATE_BOOTH:success', 'CREATE_BOOTH:denied', 'CREATE_BOOTHS_BULK:success', 'CREATE_BOOTHS_BULK:denied', 'UPDATE_BOOTH:success', 'DEACTIVATE_BOOTH:success'].forEach(function (a) {
            expect(actions).to.include(a);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
