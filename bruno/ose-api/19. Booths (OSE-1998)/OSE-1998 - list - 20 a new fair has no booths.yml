info:
  name: OSE-1998 | sunny | list | a new fair has no booths
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 list: 200 and an empty list', function () { expect(res.getStatus()).to.eql(200); expect(b.booths).to.eql([]); expect(b.event_id).to.eql(bru.getVar('boothFairId')); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
