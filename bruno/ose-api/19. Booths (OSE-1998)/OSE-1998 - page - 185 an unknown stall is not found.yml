info:
  name: "OSE-1998 | rainy | page | an unknown stall number answers the 404 page"
  type: http
  seq: 185

http:
  method: GET
  url: "{{baseUrl}}/events/{{boothLiveFairId}}/booths/Q99"
  headers:
    - name: Accept
      value: text/html
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var edge = res.getStatus() === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        if (edge) { test('EDGE: the page read was challenged before the Worker ran (OSE-939); nothing below was checked', function () { expect(edge).to.equal(true); }); }
        var body = typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody());
        if (!edge) {
          test('OSE-1998 page: 404 HTML', function () { expect(res.getStatus()).to.eql(404); expect(res.getHeader('content-type') || '').to.include('text/html'); });
          var sig = (function(h){var t=(h.match(/<title>([^<]*)<\/title>/)||[])[1]||'';var one=(h.match(/<h1[^>]*>([^<]*)<\/h1>/)||[])[1]||'';return t+' | '+one;})(body);
          test('OSE-1998 page: the not-found page has a title and one heading', function () { expect(sig.length).to.be.above(3); });
          bru.setVar('boothNotFoundBody', sig);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
