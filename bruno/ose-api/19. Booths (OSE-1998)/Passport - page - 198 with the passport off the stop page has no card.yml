info:
  name: "Passport | with the passport off the stop page has no card"
  type: http
  seq: 198

# Mock-layer twin: workers/oursharedevents/tests/passport-route.spec.ts.

http:
  method: GET
  url: "{{baseUrl}}/events/{{boothLiveFairId}}/booths/l1"
  headers:
    - name: Accept
      value: text/html
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var edge = res.getStatus() === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        if (edge) { test('EDGE: the page read was challenged before the Worker ran (OSE-939); nothing below was checked', function () { expect(edge).to.equal(true); }); }
        var body = typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody());
        if (!edge) {
          test('Passport off: 200 and no card', function () { expect(res.getStatus()).to.eql(200); expect(body).to.not.include('data-testid="passport"'); });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
