info:
  name: OSE-2004 | rainy | brand | an admin of another brand gets 404 for the scans per stall
  type: http
  seq: 162

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths/counts"
  headers:
    - name: CF-Access-Client-Id
      value: "{{ciBrandClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{ciBrandClientSecret}}"
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // OSE-1800: the CI service actor (a brand admin of ci-brand, never platform).
        // Inert until the owner creates the Access service token and adds its secrets.
        // Until then this request is skipped and logs NOT RUN; it records no passing test.
        if (!bru.getEnvVar('ciBrandClientId') || !bru.getEnvVar('ciBrandClientSecret')) {
          console.log('NOT RUN (OSE-1800 setup pending): no CI brand service token configured');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        test('OSE-2004 rainy: brand: 404 for an event outside the caller\'s brand', function () { expect(res.getStatus()).to.eql(404); });
        test('OSE-2004 rainy: brand: no count in the answer', function () { expect(JSON.stringify(res.getBody() || {})).to.not.match(/"(scans|total|any_withheld)"/); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
