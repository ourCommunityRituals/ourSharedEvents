info:
  name: OSE-1998 | sunny | update | rename the booth and move it on the plan
  type: http
  seq: 80

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths/{{boothId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"name\": \"Hilltop Honey and Wax\", \"hall_x\": 0.75, \"hall_y\": 0.1, \"sort\": 5}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 update: 200 with the new values', function () {
          expect(res.getStatus()).to.eql(200);
          expect(b.booth.name).to.eql('Hilltop Honey and Wax'); expect(b.booth.hall_x).to.eql(0.75); expect(b.booth.hall_y).to.eql(0.1); expect(b.booth.sort).to.eql(5);
          expect(b.booth.number).to.eql('A12'); expect(b.booth.category).to.eql('food');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
