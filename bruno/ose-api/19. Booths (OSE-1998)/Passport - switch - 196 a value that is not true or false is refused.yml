info:
  name: "Passport | a value that is not true or false is refused"
  type: http
  seq: 196

# Mock-layer twin: workers/oursharedevents/tests/passport-route.spec.ts.

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{boothLiveFairId}}"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"settings\": {\"passport\": \"yes\"}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Passport switch: a string is refused (400)', function () { expect(res.getStatus()).to.eql(400); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
