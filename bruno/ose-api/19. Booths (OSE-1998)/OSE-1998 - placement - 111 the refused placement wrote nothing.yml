info:
  name: OSE-1998 | rainy | placement | the other event has no placement
  type: http
  seq: 111

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{boothOtherId}}/poster-deployments"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 placement: the other event has no placement', function () { expect(res.getStatus()).to.eql(200); expect(b.items).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
