info:
  name: OSE-1998 | rainy | create | a booth takes no contact field
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"number\": \"B1\", \"name\": \"Rye and Co\", \"contact_email\": \"jo@rye.example\"}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 person field: 400 UNKNOWN_FIELD', function () { expect(res.getStatus()).to.eql(400); expect(b.code).to.eql('UNKNOWN_FIELD'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
