info:
  name: OSE-1998 | rainy | create | a hall spot outside 0 to 1 is refused
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/events/{{boothFairId}}/booths"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"number\": \"B1\", \"name\": \"Rye and Co\", \"hall_x\": 41.88, \"hall_y\": -87.63}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 hall: 400 INVALID_HALL_POSITION', function () { expect(res.getStatus()).to.eql(400); expect(b.code).to.eql('INVALID_HALL_POSITION'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
