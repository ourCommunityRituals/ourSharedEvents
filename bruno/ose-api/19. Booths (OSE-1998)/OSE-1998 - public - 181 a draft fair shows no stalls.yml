info:
  name: "OSE-1998 | rainy | public | a draft fair is refused and shows no stalls"
  type: http
  seq: 181

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/{{boothFairId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1998 public: the draft fair is refused', function () { expect(res.getStatus()).to.eql(403); });
        test('OSE-1998 public: no stalls in the refusal', function () { expect(b).to.not.have.property('booths'); expect(JSON.stringify(b)).to.not.include('Hilltop'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
