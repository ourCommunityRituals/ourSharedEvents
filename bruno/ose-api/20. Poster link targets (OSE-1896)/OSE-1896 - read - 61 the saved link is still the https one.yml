info:
  name: OSE-1896 | read | the saved link is still the https one
  type: http
  seq: 61

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/{{linkTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        const targets = (b.codes || []).map(function (c) { return c.target_url; }).filter(function (t) { return t; });
        test('OSE-1896 read: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1896 read: the one link target is the saved https address', function () { expect(targets).to.eql(['https://give.ose-1896.example/a']); });
        test('OSE-1896 read: where a scan lands is that address too', function () { expect((b.codes || []).filter(function (c) { return c.kind === 'donation'; }).map(function (c) { return c.points_to; })).to.eql(['https://give.ose-1896.example/a']); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
