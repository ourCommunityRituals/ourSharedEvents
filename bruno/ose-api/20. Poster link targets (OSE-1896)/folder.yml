info:
  name: Poster link targets (OSE-1896)
  type: folder
request: {}
docs: |-
  An organizer's link on a poster code must be a full https:// address
  (OSE-1896, the "refused at save" line). PUT
  /api/v2/admin/events/:id/poster-codes refuses a javascript: or http: target
  with 400 INVALID_TARGET and the row's index, and writes nothing: not the bad
  row, not a good row sent beside it, and not over a link saved before.

  The control is seq 50: an https target is saved through the same route, so a
  refusal here is the rule and not a broken request.

  No fixture. The folder makes one synthetic, unlisted draft event (seq 10),
  works on it and deletes it (seq 900). The event has no scans, so it
  hard-deletes with its codes. If a run stops half way, the leftover is a
  synthetic draft that the daily staging rebuild clears.

  The requests run in `seq` order.

  Mock-layer twins: workers/oursharedevents/tests/poster-codes-parse.spec.ts
  (the parser), shortlinks.spec.ts (the https guard) and
  poster-multi-code-ui.spec.ts (the route). The map never offers a non-https
  target: map-place-links.spec.ts.

  Born red (2026-11-16). The hub's UI package is private to CI, so no local
  Worker could be started where this was written. The folder was run against
  a stand-in server built on the Worker's own parser (parsePosterCodes), one
  fault at a time. That is a test rig, not the Worker and not staging:
    - the https rule taken out: 15 checks red (every refusal, and both reads)
    - a good row saved from a refused list: 3 red (seq 40 and 61)
    - a refusal that clears the saved link: 2 red (seq 61)
    - the refusal answered with another code: 4 red (seq 30, 31, 32, 60)
    - the refusal answered with no row index: 4 red (seq 30, 31, 32, 60)
  With no fault: 57 checks, none red. The first run showed three of the four
  refusal requests had never run: their names held an unquoted "javascript: "
  or "http: ", which is not valid YAML, and `bru run` skips such a file
  without failing. tests/integration/bruno-request-files-parse.test.js now
  fails on any Bruno file that does not parse.
