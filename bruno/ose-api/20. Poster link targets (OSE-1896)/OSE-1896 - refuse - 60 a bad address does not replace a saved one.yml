info:
  name: "OSE-1896 | rainy | refuse | a javascript: target does not replace a saved link"
  type: http
  seq: 60

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/{{linkTargetEventId}}/poster-codes"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: "{\"codes\": [{\"kind\": \"donation\", \"target_url\": \"javascript:alert(1)\"}]}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody() || {};
        test('OSE-1896 refuse: 400 INVALID_TARGET', function () { expect(res.getStatus()).to.eql(400); expect(b.ok).to.eql(false); expect(b.code).to.eql('INVALID_TARGET'); });
        test('OSE-1896 refuse: it names the row and says what a link must be', function () { expect(b.index).to.eql(0); expect(b.error).to.eql('The DONATE link must be a full https:// address.'); });
        test('OSE-1896 refuse: the answer carries no list of codes', function () { expect(b.codes).to.eql(undefined); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
