info:
  name: GET /api/v2/events with made-up credentials - nothing sent comes back
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events"
  headers:
    - name: Accept
      value: application/json
    - name: X-Test-No-Auth
      value: "1"
    - name: Authorization
      value: Bearer made-up-bearer-for-the-staging-echo-check
    - name: X-OCR-Internal
      value: made-up-ci-header-for-the-staging-echo-check
    - name: CF-Access-Client-Secret
      value: made-up-client-secret-for-the-staging-echo-check
    - name: Cookie
      value: CF_AppSession=made-up-app-session-for-the-staging-echo-check
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // OSE-1475: a public read that is handed credentials it has no use for
        // answers as it always does and repeats none of them, in the body or
        // in any header. The values are made up in this file; no real
        // credential is sent (X-Test-No-Auth keeps the collection from adding one).
        // Only test names print: a failure names what came back, never a value.
        var sent = {
          'the bearer value': 'made-up-bearer-for-the-staging-echo-check',
          'the CI header value': 'made-up-ci-header-for-the-staging-echo-check',
          'the service-token secret': 'made-up-client-secret-for-the-staging-echo-check',
          'the session cookie value': 'made-up-app-session-for-the-staging-echo-check'
        };
        var raw = res.getBody();
        var body = typeof raw === 'string' ? raw : JSON.stringify(raw || '');
        var headers = JSON.stringify(res.getHeaders() || {});
        test('OSE-1475: the Worker answered (no edge challenge)', function() {
          expect(res.getHeader('cf-mitigated') || '').to.eql('');
          expect(res.getStatus()).to.eql(200);
        });
        Object.keys(sent).forEach(function(name) {
          test('OSE-1475: the body does not repeat ' + name, function() {
            expect(body.indexOf(sent[name])).to.eql(-1);
          });
          test('OSE-1475: no response header repeats ' + name, function() {
            expect(headers.indexOf(sent[name])).to.eql(-1);
          });
        });
        test('OSE-1475: the answer carries no JWT (body or headers)', function() {
          var jwt = /eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{2,}/;
          expect(jwt.test(body)).to.eql(false);
          expect(jwt.test(headers)).to.eql(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
