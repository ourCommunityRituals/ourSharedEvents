info:
  name: OSE-1901 | sunny + rainy | events page | the card line is the covenant pick, in the same markup for every name
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The fixture event's cycle, one letter an hour (see the folder notes).
        const CYCLE = 'LLTMLTLBTLLLMLBTTTTMTLLMBLTMTTLMTMTLTLTLMLTMTTLLLTLTTLTTTLTLTTLLLMMLLMMTTTMLLTTTMTLLLTBTLMLBTBTTMLTM';
        const NAMES = { T: 'Covline Top Level', M: 'Covline Middle', B: 'Covline Base', L: 'Covline Local' };
        const HOUR = 3600000;
        const nameAt = function (ms) { return NAMES[CYCLE.charAt(Math.floor(ms / HOUR) % CYCLE.length)]; };
        const now = Date.now();
        const into = now % HOUR;
        const due = [nameAt(now)];
        if (into < 120000) due.push(nameAt(now - HOUR));
        if (into > HOUR - 120000) due.push(nameAt(now + HOUR));

        const html = String(res.getBody() || '');
        test('OSE-1901: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('OSE-1901 rainy: a sponsor that has not answered, was declined or is switched off is named nowhere on the list', function () {
          expect(html).to.not.include('Covline Pending');
          expect(html).to.not.include('Covline Declined');
          expect(html).to.not.include('Covline Inactive');
        });
        // The list shows a window of events. The API request before this one holds
        // the rule without a window. When the fixture card is outside the window the
        // two card checks do not run, and the log says so by name: a check that
        // passed without looking would read as coverage it is not.
        const start = html.indexOf('data-event-id="covline-evt"');
        const card = start < 0 ? '' : html.slice(start, html.indexOf('</article>', start));
        if (!card) {
          test('OSE-1901 NOT RUN (the fixture card is outside the page window): the card names the pick for this hour', function () {});
          test('OSE-1901 NOT RUN (the fixture card is outside the page window): the line sits below the name and the date', function () {});
        } else {
          test('OSE-1901 sunny: the fixture card names one sponsor, the pick for this clock hour', function () {
            const shown = Object.keys(NAMES).map(function (k) { return NAMES[k]; }).filter(function (n) { return card.includes(n); });
            expect(shown.length, 'one name on the card').to.eql(1);
            expect(due, 'hour ' + Math.floor(now / HOUR) + ', read ' + shown[0]).to.include(shown[0]);
          });
          test('OSE-1901 edge: the line is the plain card line below the name and the date, whoever it names', function () {
            const line = card.indexOf('<p class="meta" data-testid="public-event-sponsor">');
            expect(line).to.be.above(card.indexOf('data-testid="public-event-name"'));
            expect(line).to.be.above(card.indexOf('data-testid="public-event-meta"'));
            expect(card.split('data-testid="public-event-sponsor"').length - 1).to.eql(1);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
