info:
  name: "S14 | rainy | update | any other field is refused, the brand included"
  type: http
  seq: 65

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_edit"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"title":"Campaign Fixture Refused","brand_id":"ci-brand"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('S14 update: 400 UNKNOWN_FIELD', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('UNKNOWN_FIELD');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
