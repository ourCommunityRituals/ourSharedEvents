info:
  name: "S14 | projection | public event | the event response is unchanged and names no campaign"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const raw = JSON.stringify(res.getBody());
        test('S14 projection: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 projection: the public event names no campaign, by id or by title', function () {
          expect(raw).to.not.include('camp_fx_');
          expect(raw).to.not.include('Campaign Fixture Shown');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
