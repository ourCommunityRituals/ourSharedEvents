info:
  name: "S14 | rainy | auth | a caller with no identity cannot update a campaign"
  type: http
  seq: 69

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_edit"
  headers:
    - name: X-Test-No-Auth
      value: "1"
  body:
    type: json
    data: '{"title":"Campaign Fixture Refused"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // On staging Cloudflare Access may answer before the worker does; on a local
        // worker the route answers 401. Either way nothing is written: request 72 reads it.
        const body = res.getBody();
        const raw = typeof body === 'string' ? body : JSON.stringify(body);
        test('S14 auth: a caller with no identity updates nothing', function () {
          expect(res.getStatus()).to.not.eql(200);
          expect(raw).to.not.include('Campaign Fixture Refused');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
