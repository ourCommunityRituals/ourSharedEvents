info:
  name: "S14 | audit | event link | the remove and the refused remove each have an audit row"
  type: http
  seq: 52

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/audit-log?action=REMOVE_CAMPAIGN_EVENT&resource_type=campaign&limit=50"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const rows = res.getBody().entries || [];
        const of = function (id) { return rows.filter(function (r) { return r.resource_id === id; }); };
        test('S14 audit: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 audit: the newest remove on camp_fx_shown is a success', function () {
          expect((of('camp_fx_shown')[0] || {}).outcome).to.eql('success');
        });
        test('S14 audit: the newest remove on camp_fx_toggle is a refusal', function () {
          expect((of('camp_fx_toggle')[0] || {}).outcome).to.eql('denied');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
