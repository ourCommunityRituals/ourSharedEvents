info:
  name: "S14 | happy | event link | after the move the first campaign no longer lists the event"
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_toggle/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('S14 event link: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 event link: the first campaign is empty again', function () {
          expect(res.getBody().items).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
