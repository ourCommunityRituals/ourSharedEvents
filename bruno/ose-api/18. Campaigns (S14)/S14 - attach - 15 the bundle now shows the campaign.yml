info:
  name: "S14 | happy | sponsor bundle | the attached campaign shows on its sponsor"
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = ((res.getBody().bundle || {}).sponsors || []).filter(function (x) { return x.id === 'sb_camp_toggle'; })[0];
        test('S14 attach: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 attach: the sponsor carries the campaign, id and title only', function () {
          expect(s).to.be.an('object');
          expect(s.campaign).to.eql({ id: 'camp_fx_toggle', title: 'Campaign Fixture Toggle' });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
