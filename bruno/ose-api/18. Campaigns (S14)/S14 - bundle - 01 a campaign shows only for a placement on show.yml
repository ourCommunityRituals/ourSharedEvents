info:
  name: "S14 | consent | sponsor bundle | a campaign shows only for a placement that is on show"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const raw = JSON.stringify(res.getBody());
        const sponsors = (res.getBody().bundle || {}).sponsors || [];
        const byId = function (id) { return sponsors.filter(function (s) { return s.id === id; })[0]; };
        test('S14 consent: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 consent: the sponsor both sides accepted carries its campaign, id and title only', function () {
          expect(byId('sb_camp_shown')).to.be.an('object');
          expect(byId('sb_camp_shown').campaign).to.eql({ id: 'camp_fx_shown', title: 'Campaign Fixture Shown' });
        });
        test('S14 consent: a placement the sponsor has not answered shows no sponsor and no campaign', function () {
          expect(byId('sb_camp_pending')).to.eql(undefined);
          expect(raw).to.not.include('camp_fx_pending');
          expect(raw).to.not.include('Campaign Fixture Pending');
        });
        test('S14 consent: a placement the organizer declined shows no sponsor and no campaign', function () {
          expect(byId('sb_camp_declined')).to.eql(undefined);
          expect(raw).to.not.include('camp_fx_declined');
          expect(raw).to.not.include('Campaign Fixture Declined');
        });
        test('S14 consent: a paused campaign is not announced, and its sponsor still shows', function () {
          expect(byId('sb_camp_paused')).to.be.an('object');
          expect(byId('sb_camp_paused').campaign).to.eql(undefined);
          expect(raw).to.not.include('Campaign Fixture Paused');
        });
        test('S14 brand wall: a placement linked to a campaign of another brand shows no campaign', function () {
          expect(byId('sb_camp_mislinked')).to.be.an('object');
          expect(byId('sb_camp_mislinked').campaign).to.eql(undefined);
          expect(raw).to.not.include('camp_fx_other');
          expect(raw).to.not.include('Campaign Fixture Other Brand');
        });
        test('S14 consent: a sponsor with no campaign has no campaign field', function () {
          expect(byId('sb_camp_toggle')).to.be.an('object');
          expect(byId('sb_camp_toggle')).to.not.have.property('campaign');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
