info:
  name: "S14 | happy | sponsor bundle | a paused campaign is not named; its sponsor still shows"
  type: http
  seq: 64

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = ((res.getBody().bundle || {}).sponsors || []).filter(function (x) { return x.id === 'sb_camp_edit'; })[0];
        test('S14 update: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 update: the sponsor still shows, with no campaign', function () {
          expect(s).to.be.an('object');
          expect(s).to.not.have.property('campaign');
          expect(JSON.stringify(res.getBody())).to.not.include('Campaign Fixture Renamed');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
