info:
  name: "S14 | audit | update | the updates and the refused updates each have an audit row"
  type: http
  seq: 75

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/audit-log?action=UPDATE_CAMPAIGN&resource_type=campaign&limit=50"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // This run, on camp_fx_edit, newest first: 73 (success), then the refusals 65 to
        // 67 and 70 (and 69 and 71 where they reach the worker), then 63 and 61 (success).
        const rows = (res.getBody().entries || []).filter(function (r) { return r.resource_id === 'camp_fx_edit'; });
        const outcomes = rows.map(function (r) { return r.outcome; });
        test('S14 audit: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 audit: the newest row is a success, and refusals are recorded as denied', function () {
          expect(rows.length).to.be.at.least(6);
          expect(outcomes[0]).to.eql('success');
          expect(outcomes.slice(1, 4)).to.eql(['denied', 'denied', 'denied']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
