info:
  name: "S14 | rainy | public events | a campaign in the address selects nothing and is never echoed"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events?campaign=camp_fx_shown&campaign_title=Campaign%20Fixture%20Shown&q=Campaign%20Fixture%20Shown"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const raw = JSON.stringify(res.getBody());
        test('S14 never a filter: the events list answers as it does with no such parameter (200), or refuses it (400)', function () {
          expect([200, 400]).to.include(res.getStatus());
        });
        test('S14 never a filter: the events list names no campaign', function () {
          expect(raw).to.not.include('camp_fx_shown');
          expect(raw).to.not.include('Campaign Fixture Shown');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
