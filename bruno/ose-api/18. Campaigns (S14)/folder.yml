info:
  name: Campaigns (S14)
  type: folder
request: {}
docs: |-
  Campaigns an organizer can use (showcase plan S14, owner 2026-11-12). A
  campaign is a brand's named group of sponsor placements: a title and a status.

  Three rules:
    1. another brand's campaign can never be attached or seen;
    2. the public sponsor bundle shows a campaign (id and title only) only for a
       placement that is on show: the event opted in and both sides accepted;
    3. a campaign title is never a filter, a search key or a sort key.

  Fixture: bruno/fixtures/campaigns-seed.sql, applied before this run. It puts
  every row back to its starting state and removes the campaign this folder
  creates.

  The requests run in `seq` order. The attach and detach requests change
  spl_camp_toggle and nothing else.

  Request 29 (OSE-2048) reads the same public bundle for its shape: the answer,
  the bundle and each sponsor carry exactly their named fields (the list is
  workers/oursharedevents/src/lib/public-sponsor-projection.ts). It runs after
  the detach, so the fixture is in its starting state. It compares key names of
  one response; a sponsor's beacon_token is left out of the compared list.
  Mock-layer twin: workers/oursharedevents/tests/sponsor-bundle-field-list.spec.ts.

  Requests 30 to 52 (OSE-1552 scope 1): an event can be in one campaign of its
  own brand. They put camp-on-evt in camp_fx_toggle, move it to camp_fx_shown and
  take it out, and change no placement. While the event is in a campaign, every
  sponsor of it that is on show is read as in that campaign (OSE ADR-030 D8); a
  placement's own campaign is never overwritten and reads again once the event
  is taken out. The event itself, and a sponsor not on show, never name it.

  Requests 60 to 75 (OSE-1552 scope 2): rename a campaign, or change its status.
  They change camp_fx_edit and nothing else. An update takes a title and a
  status only; a paused campaign is not named in public and its sponsor still
  shows.

  Requests 80 to 84 (OSE-2046): the SharedReport campaign summary of one more
  fixture event, camp-rpt-evt. Each sponsor counts once however many surfaces
  it is on; a campaign whose displays are all under 5 is listed with its total
  withheld, and 0, 1 and 4 displays read the same. Request 80 puts the paid
  report on for that one event (the summary is a Mid section) and 84 takes it
  off. They compare named fields of one response, never a whole body.

  Request 83 (OSE-2089) reads the same report's class breakdown: a class with
  no sponsor, and a class whose one sponsor has 4 displays, both have their
  total withheld (null, with the words in the notes), never 0.

  Requests 85 to 88 (OSE-2093): two bare fixture events read as reports, one
  with nobody seen and one with 4 people seen. Each must carry the same
  "nothing yet" note and no count of people: 0 reads the same as 1 to 4.

  Mock-layer twins: workers/oursharedevents/tests/campaigns.spec.ts,
  tests/campaign-events.spec.ts, tests/campaign-update.spec.ts,
  tests/shared-report-campaign-summary.spec.ts,
  tests/shared-report-class-floor.spec.ts and
  tests/shared-report-pending-note-floor.spec.ts.
