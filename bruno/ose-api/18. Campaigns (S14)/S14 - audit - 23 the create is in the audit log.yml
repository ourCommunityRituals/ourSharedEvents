info:
  name: "S14 | audit | create | the create has an audit row"
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/audit-log?action=CREATE_CAMPAIGN&resource_type=campaign&limit=50"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const rows = (res.getBody().entries || []).filter(function (r) { return r.resource_id === bru.getVar('s14CampaignId'); });
        test('S14 audit: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 audit: the create of this run is logged once, as success', function () {
          expect(rows.length).to.eql(1);
          expect(rows[0].outcome).to.eql('success');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
