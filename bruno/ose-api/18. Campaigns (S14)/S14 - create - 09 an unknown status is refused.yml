info:
  name: "S14 | rainy | create | a status that is not active, paused or completed is refused"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/campaigns"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"title":"Campaign Fixture Refused","status":"archived"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('S14 create: 400 INVALID_STATUS', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('INVALID_STATUS');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
