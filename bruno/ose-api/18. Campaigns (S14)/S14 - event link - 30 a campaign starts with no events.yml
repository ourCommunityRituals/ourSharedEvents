info:
  name: "S14 | happy | event link | a campaign starts with no events"
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_toggle/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const b = res.getBody();
        test('S14 event link: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 event link: the campaign has no events yet', function () {
          expect(b.campaign_id).to.eql('camp_fx_toggle');
          expect(b.items).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
