info:
  name: "S14 | happy | sponsor bundle | an active campaign is named again"
  type: http
  seq: 74

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = ((res.getBody().bundle || {}).sponsors || []).filter(function (x) { return x.id === 'sb_camp_edit'; })[0];
        test('S14 update: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 update: the sponsor carries the campaign again', function () {
          expect(s.campaign).to.eql({ id: 'camp_fx_edit', title: 'Campaign Fixture Renamed' });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
