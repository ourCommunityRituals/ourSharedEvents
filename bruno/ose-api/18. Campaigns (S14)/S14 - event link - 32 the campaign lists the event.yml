info:
  name: "S14 | happy | event link | the campaign lists the event: id, title, status and start, nothing else"
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_toggle/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const items = res.getBody().items || [];
        test('S14 event link: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 event link: the one event is listed', function () {
          expect(items.map(function (i) { return i.id; })).to.eql(['camp-on-evt']);
        });
        test('S14 event link: a listed event is an id, a title, a status and a start', function () {
          expect(Object.keys(items[0] || {}).sort()).to.eql(['id', 'start_date', 'status', 'title']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
