info:
  name: "S14 | rainy | event link | the refused requests of 38 to 43 moved nothing"
  type: http
  seq: 44

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/campaigns/camp_fx_toggle/events"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const ids = (res.getBody().items || []).map(function (i) { return i.id; });
        test('S14 event link: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 event link: the event is still in its campaign', function () {
          expect(ids).to.eql(['camp-on-evt']);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
