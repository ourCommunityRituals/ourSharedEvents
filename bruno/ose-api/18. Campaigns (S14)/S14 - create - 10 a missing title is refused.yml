info:
  name: "S14 | rainy | create | a campaign with no title is refused"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v2/admin/campaigns"
  headers:
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  body:
    type: json
    data: '{"status":"active"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('S14 create: 400 MISSING_TITLE', function () {
          expect(res.getStatus()).to.eql(400);
          expect(res.getBody().code).to.eql('MISSING_TITLE');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
