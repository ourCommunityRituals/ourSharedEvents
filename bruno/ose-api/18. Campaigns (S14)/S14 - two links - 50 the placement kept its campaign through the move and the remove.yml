info:
  name: "S14 | two links | sponsor bundle | the placement kept its own campaign through the move and the remove"
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const s = ((res.getBody().bundle || {}).sponsors || []).filter(function (x) { return x.id === 'sb_camp_shown'; })[0];
        test('S14 two links: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 two links: taking the event out of camp_fx_shown did not take the placement out', function () {
          expect(s).to.be.an('object');
          expect(s.campaign).to.eql({ id: 'camp_fx_shown', title: 'Campaign Fixture Shown' });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
