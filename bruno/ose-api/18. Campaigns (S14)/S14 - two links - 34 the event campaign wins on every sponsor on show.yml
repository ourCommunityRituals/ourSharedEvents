info:
  name: "S14 | two links | sponsor bundle | the event's campaign wins on every sponsor that is on show, and on no other"
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // ADR-030 D8 (owner, 2026-11-15): camp-on-evt is now in camp_fx_toggle, so a
        // placement on it is read as in that campaign. Its own campaign counts only
        // while the event is in none. Nothing stored changed: request 50 shows the
        // placement's own campaign back once the event is taken out.
        const raw = JSON.stringify(res.getBody());
        const sponsors = (res.getBody().bundle || {}).sponsors || [];
        const by = function (id) { return sponsors.filter(function (x) { return x.id === id; })[0]; };
        const TOGGLE = { id: 'camp_fx_toggle', title: 'Campaign Fixture Toggle' };
        test('S14 two links: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 two links: a placement with no campaign of its own carries the event campaign', function () {
          expect(by('sb_camp_toggle')).to.be.an('object');
          expect(by('sb_camp_toggle').campaign).to.eql(TOGGLE);
        });
        test('S14 two links: the event campaign wins over the placement own campaign', function () {
          expect(by('sb_camp_shown').campaign).to.eql(TOGGLE);
          expect(raw).to.not.include('Campaign Fixture Shown');
        });
        test('S14 two links: it wins over a paused own campaign and a campaign of another brand too', function () {
          expect(by('sb_camp_paused').campaign).to.eql(TOGGLE);
          expect(by('sb_camp_mislinked').campaign).to.eql(TOGGLE);
          expect(raw).to.not.include('Campaign Fixture Other Brand');
        });
        test('S14 two links: a sponsor that is not on show is still not in the bundle', function () {
          expect(by('sb_camp_pending')).to.eql(undefined);
          expect(by('sb_camp_declined')).to.eql(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
