info:
  name: "S14 | two links | sponsor bundle | a placement keeps its own campaign and takes none from its event"
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/api/v2/events/camp-on-evt/sponsor-bundle?surface=public"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // camp-on-evt is now in camp_fx_toggle. Its placements are not changed by that:
        // sb_camp_toggle has no campaign of its own and still shows none; sb_camp_shown
        // keeps camp_fx_shown. Which link wins when they differ is an open owner
        // decision (OSE-1552 scope 4); until then neither overwrites the other.
        const sponsors = (res.getBody().bundle || {}).sponsors || [];
        const by = function (id) { return sponsors.filter(function (x) { return x.id === id; })[0]; };
        test('S14 two links: 200', function () { expect(res.getStatus()).to.eql(200); });
        test('S14 two links: a placement with no campaign gets none from its event', function () {
          expect(by('sb_camp_toggle')).to.be.an('object');
          expect(by('sb_camp_toggle')).to.not.have.property('campaign');
          expect(JSON.stringify(res.getBody())).to.not.include('Campaign Fixture Toggle');
        });
        test('S14 two links: a placement keeps its own campaign', function () {
          expect(by('sb_camp_shown').campaign).to.eql({ id: 'camp_fx_shown', title: 'Campaign Fixture Shown' });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
