info:
  name: GET Resolve Flags (for event)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/flags/resolve?eventId={{testEventId}}"
  params:
    - name: eventId
      value: "{{testEventId}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has resolved flags object', function() {

        \        expect(json.flags).to.be.an('object');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
