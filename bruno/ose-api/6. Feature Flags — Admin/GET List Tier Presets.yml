info:
  name: GET List Tier Presets
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/flags/tiers"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has tiers items array', function() {

        \        expect(json.items).to.be.an('array');

        \        expect(json.items.length).to.be.at.least(3);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
