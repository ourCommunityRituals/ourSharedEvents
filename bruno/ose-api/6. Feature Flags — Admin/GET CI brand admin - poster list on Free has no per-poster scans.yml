info:
  name: GET CI brand admin - poster list on Free has no per-poster scans
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/ci-free-evt/poster-deployments"
  headers:
    - name: CF-Access-Client-Id
      value: "{{ciBrandClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{ciBrandClientSecret}}"
    - name: X-Test-No-Auth
      value: "1"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // OSE-1800: the CI service actor (a brand admin of ci-brand, never platform).
        // Inert until the owner creates the Access service token and adds its secrets
        // (CF_ACCESS_CI_BRAND_CLIENT_ID / _SECRET) and CI_SERVICE_ACTORS on staging.
        // Until then this request is skipped and logs NOT RUN; it records no passing test.
        if (!bru.getEnvVar('ciBrandClientId') || !bru.getEnvVar('ciBrandClientSecret')) {
          console.log('NOT RUN (OSE-1800 setup pending): no CI brand service token configured');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        const json = res.getBody() || {};
        test('200 for its own brand', function () { expect(res.getStatus()).to.eql(200); });
        test('placements are listed', function () { expect((json.items || []).length).to.be.above(0); });
        test('no per-poster scans on Free', function () { (json.items || []).forEach(function (it) { expect(it).to.not.have.property('scans'); }); });
        test('the response names items.scans as withheld', function () { expect((json.plan || {}).locked_sections).to.include('items.scans'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
