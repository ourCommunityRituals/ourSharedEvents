info:
  name: PUT CI brand admin - switching the paid report on is refused
  type: http
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/admin/events/ci-free-evt/flags/analytics.shared-report"
  headers:
    - name: CF-Access-Client-Id
      value: "{{ciBrandClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{ciBrandClientSecret}}"
    - name: X-Test-No-Auth
      value: "1"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // OSE-1800: the CI service actor (a brand admin of ci-brand, never platform).
        // Inert until the owner creates the Access service token and adds its secrets
        // (CF_ACCESS_CI_BRAND_CLIENT_ID / _SECRET) and CI_SERVICE_ACTORS on staging.
        // Until then this request is skipped under a test named for what is missing.
        if (!bru.getEnvVar('ciBrandClientId') || !bru.getEnvVar('ciBrandClientSecret')) {
          test('SKIPPED until OSE-1800 setup: no CI brand service token configured', function () {});
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        // A brand admin cannot grant its own event a paid plan (review 2026-11-04).
        const json = res.getBody() || {};
        test('403 EVENT_FLAG_ABOVE_PLAN', function () { expect(res.getStatus()).to.eql(403); expect(json.code).to.eql('EVENT_FLAG_ABOVE_PLAN'); });
        test('the refusal carries its reference (header equals body requestId)', function () { expect(json.requestId).to.eql(String(res.getHeader('x-request-id') || '')); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
