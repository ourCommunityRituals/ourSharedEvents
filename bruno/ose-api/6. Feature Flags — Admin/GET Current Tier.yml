info:
  name: GET Current Tier
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/flags/current-tier"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const ct = (res.getHeader('Content-Type') || ''); if (!ct.includes('application/json')) { test('CF Access blocked — admin route protected', function() { expect([200, 302, 403]).to.include(res.getStatus()); }); return; } const json = res.getBody();

        

        if (res.getStatus() === 200) {

        \    test('ok is true', function() {

        \        expect(json.ok).to.eql(true);

        \    });

        

        \    test('Has tier name', function() {

        \        expect(json.tier).to.be.a('string');

        \        expect(json.tier).to.be.oneOf(['free', 'mid', 'enterprise', 'custom']);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
