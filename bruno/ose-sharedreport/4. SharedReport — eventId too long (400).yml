info:
  name: 4. SharedReport — eventId too long (400)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 400 for eventId exceeding 64 chars', function () {\r

        \  expect(res.getStatus()).to.equal(400);\r

        });\r

        \r

        test('Error code is INVALID_EVENT_ID', function () {\r

        \  const json = res.getBody();\r

        \  expect(json.code).to.eql('INVALID_EVENT_ID');\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
