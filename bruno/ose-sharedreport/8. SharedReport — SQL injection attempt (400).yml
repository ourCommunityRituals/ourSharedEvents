info:
  name: 8. SharedReport — SQL injection attempt (400)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId=1' OR '1'='1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 400 for SQL injection pattern', function () {

        \  expect(res.getStatus()).to.equal(400);

        });

        

        test('Error code is INVALID_EVENT_ID', function () {

        \  const json = res.getBody();

        \  expect(json.code).to.eql('INVALID_EVENT_ID');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
