info:
  name: 3. SharedReport — Invalid eventId format (400)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId=<script>alert(1)</script>"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 400 for XSS-style eventId', function () {\r

        \  expect(res.getStatus()).to.equal(400);\r

        });\r

        \r

        test('Error code is INVALID_EVENT_ID', function () {\r

        \  const json = res.getBody();\r

        \  expect(json.code).to.eql('INVALID_EVENT_ID');\r

        });\r

        \r

        test('Error message does not echo the malicious input', function () {\r

        \  const json = res.getBody();\r

        \  expect(json.message).to.not.include('<script>');\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
