info:
  name: 7. SharedReport — Response timing check
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId={{testEventId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Response time is under 3 seconds', function () {

        \  expect(res.getResponseTime()).to.be.below(3000);

        });

        

        test('Response time is ideally under 1 second', function () {

        \  if (res.getResponseTime() > 1000) {

        \    console.warn('SharedReport response time: ' + res.getResponseTime() + 'ms (above 1s target)');

        \  }

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
