info:
  name: 1. Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Health endpoint returns 200', function () {

        \  expect(res.getStatus()).to.equal(200);

        });

        

        test('Health response has ok=true', function () {

        \  const json = res.getBody();

        \  expect(json.ok).to.eql(true);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
