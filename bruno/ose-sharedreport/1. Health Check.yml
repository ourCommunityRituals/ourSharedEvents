info:
  name: 1. Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Health endpoint returns 200', function () {\r

        \  expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        test('Health response has ok=true', function () {\r

        \  const json = res.getBody();\r

        \  expect(json.ok).to.eql(true);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
