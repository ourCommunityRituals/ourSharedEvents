info:
  name: 5. SharedReport — Non-existent event (404 or 503)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId=nonexistent_event_xyz"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 404 or 503 for non-existent event', function () {

        \  expect([404, 503]).to.include(res.getStatus());

        });

        

        test('Error response has ok=false', function () {

        \  const json = res.getBody();

        \  expect(json.ok).to.eql(false);

        });

        

        test('Error response includes requestId', function () {

        \  const json = res.getBody();

        \  expect(json.requestId).to.be.a('string');

        });

        

        test('404 error message does not echo eventId', function () {

        \  if (res.getStatus() === 404) {

        \    const json = res.getBody();

        \    expect(json.message).to.not.include('nonexistent_event_xyz');

        \  }

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
