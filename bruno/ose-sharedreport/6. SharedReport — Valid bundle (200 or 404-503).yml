info:
  name: 6. SharedReport — Valid bundle (200 or 404/503)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport?eventId={{testEventId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const validStatuses = [200, 404, 503];

        

        test('Returns valid status code', function () {

        \  expect(validStatuses).to.include(res.getStatus());

        });

        

        test('Contract version header is 1.0.0', function () {

        \  if (res.getHeader('X-Contract-Version')) {

        \    expect(res.getHeader('X-Contract-Version')).to.eql('1.0.0');

        \  }

        });

        

        test('X-Request-Id header present', function () {

        \  expect(res.getHeaders()).to.have.property('X-Request-Id'.toLowerCase());

        });

        

        if (res.getStatus() === 200) {

        \  const json = res.getBody();

        

        \  test('Success response has ok=true', function () {

        \    expect(json.ok).to.eql(true);

        \    expect(json.status).to.eql(200);

        \  });

        

        \  test('Bundle exists with required fields', function () {

        \    expect(json.bundle).to.be.an('object');

        \    expect(json.bundle.generatedAt).to.be.a('string');

        \    expect(json.bundle.window).to.be.an('object');

        \    expect(json.bundle.integrity).to.be.an('object');

        \    expect(json.bundle.event).to.be.an('object');

        \    expect(json.bundle.sponsor).to.be.an('object');

        \    expect(json.bundle.customer).to.be.an('object');

        \  });

        

        \  test('Integrity metadata is valid', function () {

        \    const i = json.bundle.integrity;

        \    expect(typeof i.complete).to.eql('boolean');

        \    expect(typeof i.stale).to.eql('boolean');

        \    expect(i.notes).to.be.an('array');

        \  });

        

        \  test('Event section has required fields', function () {

        \    const e = json.bundle.event;

        \    expect(e.eventId).to.be.a('string');

        \    expect(e.name).to.be.a('string');

        \    expect(e.summary).to.be.an('object');

        \    expect(e.traffic).to.be.an('object');

        \    expect(e.qr).to.be.an('object');

        \    expect(typeof e.qr.verifiedOnly).to.eql('boolean');

        \  });

        

        \  test('Customer section has NO PII fields', function () {

        \    const c = json.bundle.customer;

        \    expect(c).to.not.have.property('email');

        \    expect(c).to.not.have.property('name');

        \    expect(c).to.not.have.property('deviceId');

        \    expect(c).to.not.have.property('ip');

        \    expect(c).to.not.have.property('userId');

        \    expect(c.summary).to.not.have.property('email');

        \    expect(c.notes).to.be.an('array');

        \  });

        

        \  test('Customer geo uses zip3 only (3 digits)', function () {

        \    const zips = json.bundle.customer.summary.geo.topZip3;

        \    expect(zips).to.be.an('array');

        \    zips.forEach(function(z) {

        \      expect(z).to.match(/^\\d{3}$/);

        \    });

        \  });

        

        \  test('Cache-Control allows short caching on success', function () {

        \    const cc = res.getHeader('Cache-Control');

        \    expect(cc).to.include('max-age=');

        \  });

        

        \  // Save bundle for downstream chaining

        \  bru.setCollectionVar('lastBundle', JSON.stringify(json.bundle));

        \  bru.setCollectionVar('lastRequestId', json.requestId);

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
