info:
  name: 2. SharedReport — Missing eventId (400)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/sharedreport"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 400 for missing eventId', function () {

        \  expect(res.getStatus()).to.equal(400);

        });

        

        test('Error code is INVALID_EVENT_ID', function () {

        \  const json = res.getBody();

        \  expect(json.ok).to.eql(false);

        \  expect(json.code).to.eql('INVALID_EVENT_ID');

        });

        

        test('Error response includes requestId', function () {

        \  const json = res.getBody();

        \  expect(json.requestId).to.be.a('string');

        \  expect(json.requestId.length).to.be.greaterThan(0);

        });

        

        test('X-Request-Id header present', function () {

        \  expect(res.getHeaders()).to.have.property('X-Request-Id'.toLowerCase());

        });

        

        test('Cache-Control is no-cache for errors', function () {

        \  expect(res.getHeader('Cache-Control')).to.include('no-cache');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
