opencollection: 1.0.0

info:
  name: OSE SharedReport — E2E Chain

request:
  variables:
    - name: baseUrl
      value: https://stg.oursharedevents.com
    - name: testEventId
      value: gate_test_event_f6
  scripts:
    - type: before-request
      code: |-
        // ADR-021 (OSE-906): production is read-only for tests. Refuse any write
        // before it is sent, whichever environment file was chosen.
        var adr021Target = String(bru.getEnvVar('baseUrl') || '') + ' ' + String(req.getUrl() || '');
        var adr021Method = String(req.getMethod() || '').toUpperCase();
        if (
          /(^|\s|\/\/)(www\.)?oursharedevents\.com\.?(:\d+)?(\/|\s|$)/i.test(adr021Target) &&
          ['GET', 'HEAD', 'OPTIONS'].indexOf(adr021Method) === -1
        ) {
          throw new Error('ADR-021: production is read-only for tests; refusing ' + adr021Method + ' ' + req.getUrl());
        }

docs:
  content: |-
    SharedReport deep dive: API contract validation, error handling, security, and performance E2E chain.

    Covers:
    - Valid bundle retrieval
    - Missing eventId (400)
    - Invalid eventId format (400)
    - Non-existent event (404)
    - Contract version header verification
    - Request tracing (X-Request-Id)
    - Cache header verification
    - Rate limit awareness

    Run with: npx bru run . --env <env> (from bruno/ose-sharedreport)
  type: text/markdown
bundled: false
extensions: {}
