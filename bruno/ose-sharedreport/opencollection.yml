opencollection: 1.0.0

info:
  name: OSE SharedReport — E2E Chain

request:
  variables:
    - name: baseUrl
      value: https://stg.oursharedevents.com
    - name: testEventId
      value: gate_test_event_f6
  scripts:
    - type: before-request
      code: |-
        // ADR-021 (OSE-906): production is read-only for tests. Refuse any write
        // before it is sent, whichever environment file was chosen. Compares exact
        // hostnames (userinfo, port, case and a trailing dot cannot hide production).
        (function () {
          var PRODUCTION_HOSTS = ['oursharedevents.com', 'www.oursharedevents.com'];
          function host(url) {
            var m = /^[a-z][a-z0-9+.-]*:\/\/(?:[^@\/?#]*@)?([^\/?#:]+)/i.exec(String(url || ''));
            return m ? m[1].toLowerCase().replace(/\.$/, '') : '';
          }
          var method = String(req.getMethod() || '').toUpperCase();
          var targets = [host(bru.getEnvVar('baseUrl')), host(req.getUrl())];
          var isProduction = targets.some(function (h) { return PRODUCTION_HOSTS.indexOf(h) !== -1; });
          if (isProduction && ['GET', 'HEAD', 'OPTIONS'].indexOf(method) === -1) {
            throw new Error('ADR-021: production is read-only for tests; refusing ' + method + ' ' + req.getUrl());
          }
        })();

docs:
  content: |-
    SharedReport deep dive: API contract validation, error handling, security, and performance E2E chain.

    Covers:
    - Valid bundle retrieval
    - Missing eventId (400)
    - Invalid eventId format (400)
    - Non-existent event (404)
    - Contract version header verification
    - Request tracing (X-Request-Id)
    - Cache header verification
    - Rate limit awareness

    Run with: npx bru run . --env <env> (from bruno/ose-sharedreport)
  type: text/markdown
bundled: false
extensions: {}
