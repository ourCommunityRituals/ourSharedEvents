info:
  name: OSE-1896 | taps before | reads the seeded total for map-zoom-a
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/admin/events/map-zoom-a/pre-event-activity"
  headers:
    - name: X-OCR-Internal
      value: "{{ocrInternalSecret}}"
    - name: CF-Access-Client-Id
      value: "{{cfAccessClientId}}"
    - name: CF-Access-Client-Secret
      value: "{{cfAccessClientSecret}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Map taps are not counted (epic OSE-1880, decision 4). This is the "before"
        // read; "taps after" (the last request of this folder) must show the same
        // number once every /?area= page below has been read.
        // Fixture: bruno/fixtures/map-zoom-area-seed.sql sets 63 taps on map-zoom-a,
        // 9 on every code, so the organizer's floored read shows a total, each
        // code rounded down to a multiple of 5 (OSE-2151).
        // Share opens have no HTTP read; CI reads them, and the taps again, from D1
        // right after this collection (scripts/ci/map-counts-check.mjs).
        // No "blocked by CF Access" branch: a read that does not reach the Worker
        // proves nothing, so it fails.
        const json = res.getBody();
        const clicks = json && json.activity ? json.activity.clicks : null;

        test('The admin read answers 200 with JSON (it reached the Worker)', function () {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader('Content-Type') || '')).to.include('application/json');
          expect(json.ok).to.equal(true);
        });

        test('Taps on map-zoom-a are readable, not withheld', function () {
          expect(clicks).to.be.an('object');
          expect(clicks.suppressed).to.equal(false);
        });

        // OSE-2151: each code is rounded down to a multiple of 5 before the sum:
        // 7 codes of 9 = 63 seeded, each published as 5: 5 x 7 = 35.
        test('Taps on map-zoom-a are the seeded 63, published as 35', function () {
          expect(clicks.count).to.equal(35);
        });

        bru.setVar('mapZoomTapsBefore', clicks ? clicks.count : 'unread');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
