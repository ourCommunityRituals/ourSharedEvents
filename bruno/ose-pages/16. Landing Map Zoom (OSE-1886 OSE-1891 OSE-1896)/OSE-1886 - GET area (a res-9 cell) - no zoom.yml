info:
  name: OSE-1886 | GET /?area=892664405d7ffff (a res-9 block) | no zoom
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/?area=892664405d7ffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Fat-finger ?area= (OSE-1886): a real cell, but one block (res 9), not an area (res 7). It is place 1 of the fixture.
        // Anything but a res-7 cell written as exactly 15 hex digits is ignored
        // (lib/landing-area.ts landingZoom): the plain landing answers, and the typed
        // value is echoed nowhere, not in a link and not in the canonical.
        const body = String(res.getBody());
        const typed = '892664405d7ffff';

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('It is the landing page (one h1, the map area)', function () {
          expect((body.match(/<h1[\s>]/g) || []).length).to.equal(1);
          expect(body).to.include('data-testid="area"');
        });

        test('No zoom: no data-zoom, no place panel, no zoom-empty note', function () {
          expect(body).to.not.include('data-zoom=');
          expect(body).to.not.include('data-testid="amap-panel"');
          expect(body).to.not.include('data-testid="amap-zoom-empty"');
          expect(body).to.not.include('data-testid="amap-back"');
        });

        test('The typed value is echoed nowhere', function () {
          expect(body.toLowerCase()).to.not.include(typed.toLowerCase());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
