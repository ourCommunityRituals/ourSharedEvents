info:
  name: OSE-1891 | GET /?area=872664405ffffff | zoomed list, a panel per place, dots only over streets
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/?area=872664405ffffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The zoomed area as HTML (OSE-1886, OSE-1891, OSE-1894).
        // Fixture: bruno/fixtures/map-zoom-area-seed.sql, three places in one area.
        //
        // What is drawn above the list is one of two whole pages, and nothing
        // between them passes (the rule: a dot is drawn only over a street layer):
        //   no street layer   the "street map is not here" note, and no drawing
        //   a street layer    the area's outline and a dot per place over it, no note
        // This area is inside the region the street-map archive covers, so the
        // page changes from the first to the second the day the archive is loaded.
        // The environment says which is expected (streetMapArchiveLoaded):
        //   not "true"   either page passes; with no street layer a test named
        //                NOT RUN says the dot-map assertions were not checked. It
        //                passes only while the flag is exactly "false".
        //   "true"       a page with no street layer fails by name.
        // The same three states as "1. Landing - Public", the two street cases.
        const body = String(res.getBody());
        const count = function (re) { return (body.match(re) || []).length; };
        const has = function (id) { return body.includes('data-testid="' + id + '"'); };
        const at = function (id) { return body.indexOf('data-testid="' + id + '"'); };
        const flag = String(bru.getEnvVar('streetMapArchiveLoaded'));
        const loaded = flag === 'true';
        // The zoomed part: from the map's wrapper to the Share script after the panels.
        const zoomed = body.slice(body.indexOf('data-testid="amap-wrap"'), body.indexOf('data-testid="share-script"'));

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('The page is zoomed on the asked area (data-zoom)', function () {
          expect(body).to.include('data-zoom="872664405ffffff"');
        });

        if (has('amap-streets')) {
          test('With a street layer: the area and a dot per place are drawn over it, and no "not here" note', function () {
            expect(has('amap-svg')).to.equal(true);
            expect(body).to.include('data-testid="amap-zone" data-cell="872664405ffffff"');
            // One dot per place of the fixture, each opening its panel.
            expect(count(/data-testid="amap-dot"/g)).to.equal(3);
            for (const n of [1, 2, 3]) {
              expect(body).to.match(new RegExp('<a href="#amap-dot-' + n + '"[^>]*data-testid="amap-dot"'));
            }
            // The streets are under the outline and the dots, inside the drawing.
            expect(at('amap-streets')).to.be.above(at('amap-svg'));
            expect(at('amap-zone')).to.be.above(at('amap-streets'));
            expect(at('amap-dot')).to.be.above(at('amap-zone'));
            expect(has('amap-no-tiles')).to.equal(false);
          });
        } else {
          test('With no street layer: says the street map is not here (amap-no-tiles) and draws no dot map', function () {
            expect(has('amap-no-tiles')).to.equal(true);
            expect(has('amap-dot')).to.equal(false);
            expect(has('amap-zone')).to.equal(false);
            expect(has('amap-svg')).to.equal(false);
          });

          if (loaded) {
            test('The street layer is drawn (streetMapArchiveLoaded is true for this environment)', function () {
              expect(has('amap-streets'), 'the environment file says the street-map archive is loaded, and the zoomed area drew no street layer').to.equal(true);
            });
          } else {
            test('NOT RUN (street-map archive not loaded on this environment: streetMapArchiveLoaded is not true): the area and a dot per place over the street layer, each at the centre of its own res-9 cell (OSE-2198)', function () {
              expect(flag, 'a NOT RUN test passes only while the environment file sets streetMapArchiveLoaded to "false"').to.equal('false');
            });
          }
        }

        test('No text list of places: the event cards are the list', function () {
          expect(has('amap-legend')).to.equal(false);
          expect(has('amap-legend-dot')).to.equal(false);
          expect(has('amap-place-link')).to.equal(false);
          expect(has('amap-unplaced')).to.equal(false);
        });

        test('One panel per place, each right after its target (amap-dot-1..3)', function () {
          expect(count(/data-testid="amap-panel"/g)).to.equal(3);
          for (const n of [1, 2, 3]) {
            expect(body).to.match(new RegExp('<span class="amap-t" id="amap-dot-' + n + '"></span><section class="amap-p[^"]*"[^>]*data-n="' + n + '"'));
          }
          expect(body).to.not.include('id="amap-dot-4"');
        });

        test('The ten seeded events are the cards, two of them at place 2', function () {
          expect(count(/data-testid="amap-card"/g)).to.equal(10);
          const p2 = body.slice(body.indexOf('id="amap-dot-2"'), body.indexOf('id="amap-dot-3"'));
          expect(p2).to.include('data-event-id="map-zoom-b"');
          expect(p2).to.include('data-event-id="map-zoom-c"');
        });

        test('Every card has Open event, Register and Share', function () {
          expect(count(/data-testid="amap-open"/g)).to.equal(10);
          expect(count(/data-testid="amap-register"/g)).to.equal(10);
          expect(count(/data-testid="share-btn"/g)).to.equal(10);
        });

        test('Share carries the event page share: the code where one exists, else the page', function () {
          expect(body).to.match(/data-share-url="[^"]*\/e\/MZPANA" data-share-title="Map Zoom Check \(league night\)"/);
          expect(body).to.match(/data-share-url="[^"]*\/events\/map-zoom-d\/map-zoom-d" data-share-title="Map Zoom Check \(repair cafe\)"/);
        });

        test('Prev and Next stop at the ends (no place 0, no place 4)', function () {
          expect(body).to.not.include('href="#amap-dot-0"');
          expect(body).to.not.include('href="#amap-dot-4"');
          expect(count(/data-testid="amap-prev"/g)).to.equal(2);
          expect(count(/data-testid="amap-next"/g)).to.equal(2);
        });

        test('Exactly one h1; panels are h2 and cards h3', function () {
          expect(count(/<h1[\s>]/g)).to.equal(1);
          expect(count(/<h2 class="amap-ph"/g)).to.equal(3);
          expect(count(/<h3 data-testid="amap-card-name"/g)).to.equal(10);
        });

        // Place, not person (AGENTS.md invariant 3; OSE-2150). With a street layer
        // the drawing carries its frame, so the map's script can place the phone's
        // own position on it (lib/attendee-map.ts frameAttrs, lib/map-pan-script.ts).
        // Every one of those numbers is worked out from the area's res-7 cell id
        // alone, which the page already shows (data-zoom). They are pinned here to
        // the values for 872664405ffffff, and workers/oursharedevents/tests/
        // map-georef-cell-only.spec.ts pins the same strings, so the two layers
        // cannot drift. These, and nothing else, are the coordinate-shaped numbers
        // the zoomed part may hold:
        //   on amap-svg   data-x0, data-y0, data-scale, data-mpu (the cell's frame)
        //   on amap-zone  data-ll (the cell's own centre, 5 decimals)
        //   on each dot   data-ll (OSE-2198: the centre of the res-9 cell the dot
        //                 is drawn at, 5 decimals, so the map's script measures
        //                 "where am I" to the place and not the area; pinned per
        //                 place below, from the fixture's res-9 cells)
        //   in the script the metres in a mile, 1609.344 (a unit, not a place)
        // Outside them, a coordinate-shaped number is any with three or more
        // decimals (a degree to about 110 m, near the equator or the meridian
        // too, a radian, a fraction of the frame like data-x0) or seven or more
        // digits in a row (micro-degrees). The area's own cell id, which has nine
        // digits in a row, is the only such run allowed. A number of that shape
        // anywhere else fails, and so does any change to one of the pinned values
        // (a frame drawn around a business, say).
        const CELL_FRAME = 'data-x0="0.255867824" data-y0="0.372606262" data-scale="3363057.841" data-mpu="8.909"';
        const CELL_CENTRE = 'data-ll="41.61285,-87.85547"';
        // h3-js cellToLatLng of each place's res-9 cell, to 5 decimals, by the
        // number on its dot. The worker spec pins the same strings (FIXTURE_PLACES).
        const PLACE_POINTS = {
          1: 'data-ll="41.62094,-87.85603"', // 892664405d7ffff, the business
          2: 'data-ll="41.61159,-87.86385"', // 89266440547ffff
          3: 'data-ll="41.60601,-87.84653"', // 89266440537ffff
        };
        // The seeded points themselves, which no number on the page may be.
        const SEEDED = [[41.6210, -87.8555], [41.6119, -87.8657], [41.6061, -87.8483]];
        const MILE = 'MPU / unitPx() / 1609.344';
        const drawn = has('amap-svg');
        const svgTag = drawn ? (body.slice(at('amap-svg')).match(/^[^>]*>/) || [''])[0] : '';
        const zoneTag = has('amap-zone') ? (body.slice(at('amap-zone')).match(/^[^>]*>/) || [''])[0] : '';
        const dotTag = function (n) { return (body.match(new RegExp('<a href="#amap-dot-' + n + '"[^>]*data-testid="amap-dot"[^>]*>')) || [''])[0]; };

        test('A business is named, never pinpointed; no coordinate is on the page but the area cell\'s own frame', function () {
          expect(body).to.include('at Zoom Check Lanes');
          // The seeded points are 41.6210,-87.8555 and so on: no number that fine.
          expect(zoomed.length).to.be.above(1000);
          let rest = zoomed;
          if (drawn) {
            expect(svgTag, 'the drawing\'s frame is the area cell\'s, to the digit').to.include(CELL_FRAME);
            expect(zoneTag, 'the area\'s centre is the cell\'s own centre').to.include(CELL_CENTRE);
            expect(zoomed.split(CELL_FRAME).length - 1, 'the frame is written once').to.equal(1);
            expect(zoomed.split(CELL_CENTRE).length - 1, 'the centre is written once').to.equal(1);
            rest = rest.replace(CELL_FRAME, '').replace(CELL_CENTRE, '').replace(MILE, '');
            for (const n of [1, 2, 3]) {
              expect(dotTag(n), 'place ' + n + ' carries its own res-9 cell\'s centre').to.include(PLACE_POINTS[n]);
              rest = rest.replace(PLACE_POINTS[n], '');
            }
          }
          rest = rest.split('872664405ffffff').join('');
          // URL escapes undone first: "%2060406" is a space and a ZIP, "%2E" a dot.
          rest = rest.replace(/%2e/gi, '.').replace(/%[0-9a-f]{2}/gi, ' ');
          expect(rest).to.not.match(/\d\.\d{3,}|\d{7,}/);
        });

        if (drawn) {
          test('Each place carries one point, its res-9 cell\'s centre (pinned per place), never its seeded point (OSE-2198)', function () {
            for (const n of [1, 2, 3]) {
              const tag = dotTag(n);
              expect(tag.match(/data-ll="[^"]+"/g), 'place ' + n + ' carries one point').to.deep.equal([PLACE_POINTS[n]]);
              expect(zoomed.split(PLACE_POINTS[n]).length - 1, 'place ' + n + '\'s point is written once').to.equal(1);
            }
            // At any precision the page could write it, no seeded point is on it.
            for (const p of SEEDED) {
              for (const dp of [3, 4, 5, 6]) {
                expect(zoomed).to.not.include(p[0].toFixed(dp) + ',' + p[1].toFixed(dp));
              }
            }
          });
        }

        if (drawn) {
          test('Each dot, read back through the drawing\'s frame, is its res-9 block centre, never the business\'s own point', function () {
            // Read the frame off the page, as the map's script does, and turn each
            // dot back into latitude and longitude (Web Mercator).
            const num = function (name) { return Number((svgTag.match(new RegExp(name + '="([^"]+)"')) || [])[1]); };
            const x0 = num('data-x0');
            const y0 = num('data-y0');
            const scale = num('data-scale');
            const back = function (cx, cy) {
              const wy = y0 + cy / scale;
              return [Math.atan(Math.sinh(Math.PI * (1 - 2 * wy))) * 180 / Math.PI, (x0 + cx / scale) * 360 - 180];
            };
            const metres = function (a, b) {
              const k = 111195;
              return Math.hypot((a[0] - b[0]) * k, (a[1] - b[1]) * k * Math.cos(a[0] * Math.PI / 180));
            };
            // h3-js cellToLatLng of the fixture's three res-9 blocks.
            const blocks = {
              1: [41.6209405, -87.8560261], // 892664405d7ffff, the business
              2: [41.6115876, -87.8638519], // 89266440547ffff
              3: [41.6060109, -87.8465295], // 89266440537ffff
            };
            const business = [41.6210, -87.8555]; // the seeded point of place 1
            // Each dot is one link: its touch target, its dot and its number are
            // all drawn at the same point, and that point is read back.
            const re = /<a href="#amap-dot-(\d)"[^>]*data-testid="amap-dot"[^>]*>([\s\S]*?)<\/a>/g;
            let m;
            let seen = 0;
            while ((m = re.exec(body))) {
              const xs = [...m[2].matchAll(/\s(?:cx|x)="([^"]*)"/g)].map(function (v) { return v[1]; });
              const ys = [...m[2].matchAll(/\s(?:cy|y)="([^"]*)"/g)].map(function (v) { return v[1]; });
              expect(xs.length, 'dot ' + m[1] + ' draws three parts').to.equal(3);
              expect(new Set(xs).size, 'dot ' + m[1] + ' is drawn at one x').to.equal(1);
              expect(ys.length).to.equal(3);
              expect(new Set(ys).size, 'dot ' + m[1] + ' is drawn at one y').to.equal(1);
              const p = back(Number(xs[0]), Number(ys[0]));
              const want = blocks[m[1]];
              // The drawing is written to a tenth of a map unit, about 0.9 m here.
              expect(metres(p, want), 'dot ' + m[1] + ' is its block centre').to.be.below(1);
              if (m[1] === '1') expect(metres(p, business), 'dot 1 is not the business\'s point').to.be.above(30);
              seen += 1;
            }
            expect(seen).to.equal(3);
          });
        }

        test('No panel shows a count of people (never who, only how many)', function () {
          // "2 events" counts events, which is allowed; a number of people is not.
          expect(zoomed.length).to.be.above(1000);
          expect(zoomed).to.not.match(/\d[\d,]*\s*(people|person|going|attending|attendees?|registered|checked in|taps?|scans?|share opens?)\b/i);
          expect(zoomed).to.not.match(/Fewer than 5/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
