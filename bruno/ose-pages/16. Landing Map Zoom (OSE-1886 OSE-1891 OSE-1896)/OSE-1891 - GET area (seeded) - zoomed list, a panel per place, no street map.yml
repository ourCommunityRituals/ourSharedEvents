info:
  name: OSE-1891 | GET /?area=872664405ffffff | zoomed list, a panel per place, no street map
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/?area=872664405ffffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The zoomed area as HTML (OSE-1886, OSE-1891, OSE-1894).
        // Fixture: bruno/fixtures/map-zoom-area-seed.sql, three places in one area.
        // Staging has no street layer (no MAP_TILES binding), so the zoom is a note,
        // the place list and the panels, and no dot map.
        const body = String(res.getBody());
        const count = function (re) { return (body.match(re) || []).length; };
        // The zoomed part: from the map's wrapper to the Share script after the panels.
        const zoomed = body.slice(body.indexOf('data-testid="amap-wrap"'), body.indexOf('data-testid="share-script"'));

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('The page is zoomed on the asked area (data-zoom)', function () {
          expect(body).to.include('data-zoom="872664405ffffff"');
        });

        test('Says the street map is not here (amap-no-tiles) and draws no dot map', function () {
          expect(body).to.include('data-testid="amap-no-tiles"');
          expect(body).to.not.include('data-testid="amap-dot"');
          expect(body).to.not.include('data-testid="amap-svg"');
        });

        test('Lists the three places, each row opening its panel', function () {
          expect(count(/data-testid="amap-legend-dot"/g)).to.equal(3);
          for (const n of [1, 2, 3]) {
            expect(body).to.include('href="#amap-dot-' + n + '" data-testid="amap-place-link"');
          }
        });

        test('One panel per place, each right after its target (amap-dot-1..3)', function () {
          expect(count(/data-testid="amap-panel"/g)).to.equal(3);
          for (const n of [1, 2, 3]) {
            expect(body).to.match(new RegExp('<span class="amap-t" id="amap-dot-' + n + '"></span><section class="amap-p[^"]*"[^>]*data-n="' + n + '"'));
          }
          expect(body).to.not.include('id="amap-dot-4"');
        });

        test('The ten seeded events are the cards, two of them at place 2', function () {
          expect(count(/data-testid="amap-card"/g)).to.equal(10);
          const p2 = body.slice(body.indexOf('id="amap-dot-2"'), body.indexOf('id="amap-dot-3"'));
          expect(p2).to.include('data-event-id="map-zoom-b"');
          expect(p2).to.include('data-event-id="map-zoom-c"');
        });

        test('Every card has Open event, Register and Share', function () {
          expect(count(/data-testid="amap-open"/g)).to.equal(10);
          expect(count(/data-testid="amap-register"/g)).to.equal(10);
          expect(count(/data-testid="share-btn"/g)).to.equal(10);
        });

        test('Share carries the event page share: the code where one exists, else the page', function () {
          expect(body).to.match(/data-share-url="[^"]*\/e\/MZPANA" data-share-title="Map Zoom Check \(league night\)"/);
          expect(body).to.match(/data-share-url="[^"]*\/events\/map-zoom-d\/map-zoom-d" data-share-title="Map Zoom Check \(repair cafe\)"/);
        });

        test('Prev and Next stop at the ends (no place 0, no place 4)', function () {
          expect(body).to.not.include('href="#amap-dot-0"');
          expect(body).to.not.include('href="#amap-dot-4"');
          expect(count(/data-testid="amap-prev"/g)).to.equal(2);
          expect(count(/data-testid="amap-next"/g)).to.equal(2);
        });

        test('Exactly one h1; panels are h2 and cards h3', function () {
          expect(count(/<h1[\s>]/g)).to.equal(1);
          expect(count(/<h2 class="amap-ph"/g)).to.equal(3);
          expect(count(/<h3 data-testid="amap-card-name"/g)).to.equal(10);
        });

        test('A business is named, never pinpointed; no coordinate is on the page', function () {
          expect(body).to.include('at Zoom Check Lanes');
          // The seeded points are 41.6210,-87.8555 and so on: no number that fine.
          expect(zoomed.length).to.be.above(1000);
          expect(zoomed).to.not.match(/\d{2}\.\d{3,}/);
        });

        test('No panel shows a count of people (never who, only how many)', function () {
          // "2 events" counts events, which is allowed; a number of people is not.
          expect(zoomed.length).to.be.above(1000);
          expect(zoomed).to.not.match(/\d[\d,]*\s*(people|person|going|attending|attendees?|registered|checked in|taps?|scans?|share opens?)\b/i);
          expect(zoomed).to.not.match(/Fewer than 5/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
