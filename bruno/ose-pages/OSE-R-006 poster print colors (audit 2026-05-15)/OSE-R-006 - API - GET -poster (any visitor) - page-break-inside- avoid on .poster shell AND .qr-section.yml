info:
  name: "OSE-R-006 | API | GET /poster (any visitor) | page-break-inside: avoid on .poster shell AND .qr-section"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        const match = body.match(/@media\\s+print\\s*\\{([\\s\\S]*?)\\}\\s*<\\/style>/);

        test('Print block extractable', function() { expect(match).to.not.be.null; });

        const printBlock = match[1];

        test('.poster shell has page-break-inside: avoid', function() {

        \    expect(printBlock).to.match(/\\.poster\\s*\\{[^}]*page-break-inside:\\s*avoid/);

        });

        test('.qr-section has page-break-inside: avoid', function() {

        \    expect(printBlock).to.match(/\\.qr-section\\s*\\{[^}]*page-break-inside:\\s*avoid/);

        });

        test('.poster-sponsors retains page-break-inside: avoid', function() {

        \    expect(printBlock).to.match(/\\.poster-sponsors\\s*\\{[^}]*page-break-inside:\\s*avoid/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
