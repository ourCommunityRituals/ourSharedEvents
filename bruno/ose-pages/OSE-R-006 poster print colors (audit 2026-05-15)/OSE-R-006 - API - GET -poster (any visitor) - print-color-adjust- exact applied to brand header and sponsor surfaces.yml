info:
  name: "OSE-R-006 | API | GET /poster (any visitor) | print-color-adjust: exact applied to brand header and sponsor surfaces"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        const match = body.match(/@media\\s+print\\s*\\{([\\s\\S]*?)\\}\\s*<\\/style>/);

        test('Print block extractable', function() { expect(match).to.not.be.null; });

        const printBlock = match[1];

        test('print-color-adjust: exact present', function() {

        \    expect(printBlock).to.match(/print-color-adjust:\\s*exact/);

        });

        test('-webkit-print-color-adjust: exact present', function() {

        \    expect(printBlock).to.match(/-webkit-print-color-adjust:\\s*exact/);

        });

        test('.poster-header is in the color-adjust rule set', function() {

        \    expect(printBlock).to.match(/\\.poster-header[\\s\\S]*print-color-adjust:\\s*exact/);

        });

        test('.poster-sponsor is in the color-adjust rule set', function() {

        \    expect(printBlock).to.match(/\\.poster-sponsor[\\s\\S]*print-color-adjust:\\s*exact/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
