info:
  name: OSE-R-006 | API | GET /poster (any visitor) | sponsor logos are NOT grayscaled in print rule
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-006 (2026-05-15): pre-fix the print block applied

        // filter: grayscale(1) to .poster-sponsor img. Sponsors paid for

        // full color; this lock holds the contract.

        test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        const match = body.match(/@media\\s+print\\s*\\{([\\s\\S]*?)\\}\\s*<\\/style>/);

        test('Print block extractable', function() { expect(match).to.not.be.null; });

        const printBlock = match[1];

        test('No filter: grayscale on sponsor img inside print block', function() {

        \    expect(printBlock).to.not.match(/\\.poster-sponsor\\s+img\\s*\\{[^}]*filter:\\s*grayscale/);

        });

        test('No bare grayscale filter anywhere in print block', function() {

        \    expect(printBlock).to.not.match(/filter:\\s*grayscale/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
