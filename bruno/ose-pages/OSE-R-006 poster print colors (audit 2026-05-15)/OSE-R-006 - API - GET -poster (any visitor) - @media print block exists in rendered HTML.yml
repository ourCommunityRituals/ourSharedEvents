info:
  name: OSE-R-006 | API | GET /poster (any visitor) | @media print block exists in rendered HTML
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });\r

        const body = JSON.stringify(res.getBody());\r

        test('Body has @media print block', function() {\r

        \    expect(body).to.match(/@media\\s+print\\s*\\{/);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
