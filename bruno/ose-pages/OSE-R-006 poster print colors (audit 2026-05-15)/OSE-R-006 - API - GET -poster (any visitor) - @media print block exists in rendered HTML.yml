info:
  name: OSE-R-006 | API | GET /poster (any visitor) | @media print block exists in rendered HTML
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        test('Body has @media print block', function() {

        \    expect(body).to.match(/@media\\s+print\\s*\\{/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
