info:
  name: OSE-R-015 | API | GET /poster (poster) | sponsor img tags carry referrerpolicy=no-referrer
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/poster"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });\r

        const body = JSON.stringify(res.getBody());\r

        test('poster HTML includes referrerpolicy=no-referrer', function() {\r

        \    expect(body).to.match(/referrerpolicy=[\"']no-referrer[\"']/);\r

        });\r

        test('poster HTML includes onerror handler', function() {\r

        \    expect(body).to.match(/onerror=[\"']this\\.style\\.display=/);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
