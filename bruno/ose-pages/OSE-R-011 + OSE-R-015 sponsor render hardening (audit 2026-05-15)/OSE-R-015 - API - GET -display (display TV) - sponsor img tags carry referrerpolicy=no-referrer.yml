info:
  name: OSE-R-015 | API | GET /display (display TV) | sponsor img tags carry referrerpolicy=no-referrer
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/display"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        test('display TV HTML includes referrerpolicy=no-referrer', function() {

        \    expect(body).to.match(/referrerpolicy=[\"']no-referrer[\"']/);

        });

        test('display TV HTML includes onerror handler', function() {

        \    expect(body).to.match(/onerror=[\"']this\\.style\\.display=|data-hide-on-error=[\"']/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
