info:
  name: OSE-R-004 | API | GET /events/:id (any non-existent branch) | no dev jargon leaks regardless of response source
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/evt_does_not_exist_r004"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-004: defensive — error pages must not leak D1 errors, stack

        // traces, or 'undefined' to customers.

        //

        // OSE-348: this no-leak assertion is the most important one because it's

        // the UNIVERSAL contract — true regardless of whether the response comes

        // from worker (404) or WAF (403). A WAF block page would never contain

        // D1 error messages (different infrastructure entirely), but checking it

        // here ensures the contract holds end-to-end.

        test('Response is blocked (404 worker OR 403 WAF)', function() {

        \    expect([404, 403]).to.include(res.getStatus());

        });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        ['no such table', 'no such column', 'D1_ERROR', 'stack:', 'at async'].forEach(function(phrase) {

        \    test('No dev jargon: ' + phrase, function() {

        \        expect(body).to.not.include(phrase);

        \    });

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
