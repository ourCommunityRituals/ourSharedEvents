info:
  name: OSE-R-004 | API | GET /events/:id (well-formed id, no row) | 404 worker OR 403 WAF block
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/events/evt_does_not_exist_r004"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-004 (2026-05-15): non-existent event must render the branded\r

        // error shell, not bare <h1>Event not found</h1>. Locks status + the\r

        // data-testids the FE Playwright spec relies on.\r

        //\r

        // OSE-348 reality update (2026-05-18): on Cloudflare-WAF-protected\r

        // environments (staging/prod), the WAF intercepts requests whose path\r

        // contains suspicious substrings (e.g., 'does_not_exist') and returns\r

        // 403 Forbidden BEFORE reaching the worker. The unified contract is:\r

        // 'unauthenticated request to a non-existent event must NEVER serve\r

        // real event data OR leak D1 errors.' Either 404-worker or 403-WAF\r

        // satisfies the contract. Worker-specific assertions (branded shell,\r

        // data-testids, CTA) fire ONLY when status === 404. Sibling: OSE-338\r

        // (CF Access shadowing of admin sign-in 401).\r

        test('Non-existent event blocked (404 worker OR 403 WAF)', function() {\r

        \    expect([404, 403]).to.include(res.getStatus());\r

        });\r

        test('Content-Type is text/html', function() {\r

        \    expect(res.getHeader('Content-Type') || '').to.include('text/html');\r

        });\r

        const body = JSON.stringify(res.getBody());\r

        test('Bare pre-fix HTML phrases NOT present (no 1996-style raw <h1>)', function() {\r

        \    expect(body).to.not.include('<h1>Event not found</h1>');\r

        \    expect(body).to.not.include('<title>Not found</title>');\r

        });\r

        // Worker-404 contract details — only enforced on non-WAF environments.\r

        if (res.getStatus() === 404) {\r

        \    test('Brand header present', function() {\r

        \        expect(body).to.include('data-testid=\"error-header\"');\r

        \        expect(body).to.include('OurSharedEvents');\r

        \    });\r

        \    test('Friendly title present', function() {\r

        \        expect(body).to.include('data-testid=\"error-title\"');\r

        \    });\r

        \    test('CTA back to /events present', function() {\r

        \        expect(body).to.include('href=\"/events\"');\r

        \        expect(body).to.include('Browse upcoming events');\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
