info:
  name: OSE-R-004 | API | GET /events/:id (malformed id) | 404 worker OR 403 WAF block
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/not%20a%20valid%20id!!"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-004: same branded shell for the input-validation branch.

        // OSE-348: same WAF-shadowing applies to malformed IDs (the URL-encoded

        // spaces + `!!` will almost certainly trip a WAF rule). Branded-shell

        // assertions fire only when worker is reached (status === 404).

        test('Malformed id blocked (404 worker OR 403 WAF)', function() {

        \    expect([404, 403]).to.include(res.getStatus());

        });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        if (res.getStatus() === 404) {

        \    test('Brand header present', function() {

        \        expect(body).to.include('data-testid=\"error-header\"');

        \    });

        \    test('CTA back to /events present', function() {

        \        expect(body).to.include('href=\"/events\"');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
