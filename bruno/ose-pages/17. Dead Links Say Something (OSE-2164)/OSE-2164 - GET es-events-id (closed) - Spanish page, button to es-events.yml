info:
  name: "OSE-2164 | GET /es/events/<closed id> | lang es, Spanish words, a button to /es/events"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/es/events/no-such-event-2164"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var strict = require('./lib/edge.js').isStrict(bru);
        var status = res.getStatus();
        var body = typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody());
        function lang(h) { var m = /<html lang="([a-z]+)"/.exec(h); return m ? m[1] : ''; }
        function cta(h) { var m = /data-testid="error-cta" href="([^"]*)">([^<]*)</.exec(h); return m ? [m[1], m[2]] : []; }
        // Strict (PAGES_EDGE_STRICT=1): 404 only, a 403 is a page that did not load. Lenient: the
        // edge may still answer a script client, so 404 or 403, as every pages request has done.
        if (strict) {
          test('Returns 404 from the Worker (strict, OSE-2160: a 403 is not accepted)', function () { expect(status).to.equal(404); });
        } else {
          test('Returns 404 (or 403 from the edge until PAGES_EDGE_STRICT=1)', function () { expect([404, 403]).to.include(status); });
        }

        if (status === 404) {
          test('The page is Spanish: lang="es"', function () { expect(lang(body)).to.equal('es'); });
          test('Spanish words and no English fallback', function () {
            expect(body).to.include('No encontramos ese evento');
            expect(body).to.not.include('Browse upcoming events');
          });
          test('The button keeps the prefix: /es/events', function () { expect(cta(body)[0]).to.equal('/es/events'); });
          test('No cookie', function () { expect(res.getHeader('Set-Cookie')).to.equal(undefined); });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
