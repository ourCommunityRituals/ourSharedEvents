info:
  name: "OSE-2164 | GET /s/zzzz99 (unknown, Accept: text/html) | byte-identical to the malformed code's page"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/s/zzzz99"
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var strict = require('./lib/edge.js').isStrict(bru);
        var status = res.getStatus();
        var body = typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody());
        function lang(h) { var m = /<html lang="([a-z]+)"/.exec(h); return m ? m[1] : ''; }
        function cta(h) { var m = /data-testid="error-cta" href="([^"]*)">([^<]*)</.exec(h); return m ? [m[1], m[2]] : []; }
        // Strict (PAGES_EDGE_STRICT=1): 404 only, a 403 is a page that did not load. Lenient: the
        // edge may still answer a script client, so 404 or 403, as every pages request has done.
        if (strict) {
          test('Returns 404 from the Worker (strict, OSE-2160: a 403 is not accepted)', function () { expect(status).to.equal(404); });
        } else {
          test('Returns 404 (or 403 from the edge until PAGES_EDGE_STRICT=1)', function () { expect([404, 403]).to.include(status); });
        }

        // The page as the Worker sent it. On staging the edge adds a script for its JavaScript check
        // (it names window.__CF$cv$params and holds this request's Ray ID, the time and a nonce), and
        // every nonce attribute is new per read, so those two are taken out; everything else is
        // compared. Same function as the stall pages (OSE-1998, folder 19 of ose-api). Requests 2 and
        // 3 carry it; tests/integration/bruno-dead-link-same-page.test.js runs both against edge-served
        // pages. The Worker's own /s/ page never names __CF$cv$params (tests/dead-link-words.spec.ts).
        var workerPage = function (h) {
          return h
            .replace(/<script\b[^>]*>(?:(?!<\/script>)[\s\S])*?window\.__CF\$cv\$params(?:(?!<\/script>)[\s\S])*?<\/script>/g, '')
            .replace(/nonce="[^"]*"/g, '');
        };
        if (status === 404) {
          test('A malformed and an unknown code answer the same page (no oracle)', function () {
            var before = bru.getVar('ose2164_malformed_body');
            expect(typeof before).to.equal('string');
            var mine = workerPage(body);
            if (mine === before) return;
            var i = 0;
            while (i < mine.length && i < before.length && mine.charAt(i) === before.charAt(i)) i++;
            throw new Error('the pages part at character ' + i + ' (of ' + mine.length + ' and ' + before.length + '). This page: ' + JSON.stringify(mine.slice(Math.max(0, i - 40), i + 80)) + '. The malformed code: ' + JSON.stringify(before.slice(Math.max(0, i - 40), i + 80)));
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
