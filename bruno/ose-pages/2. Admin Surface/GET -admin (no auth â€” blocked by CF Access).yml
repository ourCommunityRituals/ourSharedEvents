info:
  name: GET /admin (no auth â€” blocked by CF Access)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin"

runtime:
  scripts:
    - type: after-response
      code: "// CF Access intercepts /admin without auth and redirects to login.

        // Newman follows the redirect, landing on the CF Access login page (200 HTML).

        // The key contract: unauthenticated users never see the admin dashboard.

        test('Unauthenticated admin request is blocked', function() {

        \    const status = res.getStatus();

        \    expect([200, 302, 401, 403]).to.include(status);

        });

        

        test('Does not serve admin dashboard HTML', function() {

        \    const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        \    expect(body).to.not.include('data-testid=\"admin-header\"');

        \    expect(body).to.not.include('data-testid=\"admin-main\"');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
