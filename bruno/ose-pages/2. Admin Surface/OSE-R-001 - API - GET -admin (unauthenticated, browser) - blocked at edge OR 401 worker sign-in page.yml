info:
  name: OSE-R-001 | API | GET /admin (unauthenticated, browser) | blocked at edge OR 401 worker sign-in page
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-001 (audit ship-stopper #1, 2026-05-15): pre-fix, this returned a raw JSON 401\r

        // dump rendered as page text in the browser. After fix: browsers get HTML sign-in.\r

        //\r

        // OSE-338 (2026-05-18) reality update: on Cloudflare-Access-gated environments\r

        // (staging + prod), CF Access intercepts /admin before reaching the worker. Newman\r

        // follows the 302 to the CF Access login page (200 HTML). On non-CF-Access environments\r

        // (local dev), the worker's 401 HTML sign-in fires. The CONTRACT is unified: an\r

        // unauthenticated browser request never sees the admin dashboard, and never sees a\r

        // raw JSON error dump. Both 401-worker and 200-CF-Access satisfy this contract.\r

        // Worker-specific page assertions only fire when status === 401.\r

        test('Unauthenticated admin request is blocked (CF Access OR worker 401)', function() {\r

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());\r

        });\r

        \r

        test('Content-Type is text/html (not JSON)', function() {\r

        \    expect(res.getHeader('Content-Type')).to.include('text/html');\r

        });\r

        \r

        const body = JSON.stringify(res.getBody());\r

        \r

        test('Does NOT serve the admin dashboard HTML', function() {\r

        \    expect(body).to.not.include('data-testid=\"admin-header\"');\r

        \    expect(body).to.not.include('data-testid=\"admin-main\"');\r

        });\r

        \r

        test('Body does NOT contain the raw JSON error dump', function() {\r

        \    expect(body).to.not.match(/\"ok\":\\s*false/);\r

        \    expect(body).to.not.match(/\"code\":\\s*\"UNAUTH\"/);\r

        });\r

        \r

        // Worker-401 contract details — only enforced on non-CF-Access environments.\r

        // When CF Access fronts /admin, the response is the CF Access login page (200),\r

        // not the worker's sign-in page. The non-leak assertions above cover the universal contract.\r

        if (res.getStatus() === 401) {\r

        \    test('Renders the worker styled sign-in page', function() {\r

        \        expect(body).to.include('<!DOCTYPE html>');\r

        \        expect(body).to.include('Admin sign-in required');\r

        \        expect(body).to.include('data-testid=\"signin-cta\"');\r

        \        expect(body).to.include('data-testid=\"signin-request-access\"');\r

        \    });\r

        \r

        \    test('CSP header set (defense in depth)', function() {\r

        \        expect(res.getHeader('Content-Security-Policy')).to.not.be.null;\r

        \    });\r

        \r

        \    test('Robots noindex meta present (not crawler-facing)', function() {\r

        \        expect(body).to.match(/<meta name=\"robots\" content=\"noindex\"/);\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
