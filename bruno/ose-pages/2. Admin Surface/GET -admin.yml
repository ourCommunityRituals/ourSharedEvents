info:
  name: GET /admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {

        \    test('Returns HTML', function() {

        \        expect(res.getHeader('Content-Type')).to.include('text/html');

        \    });

        

        \    test('Has admin content', function() {

        \        expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody())).toLowerCase()).to.include('admin');

        \    });

        } else {

        \    test('Returns 401 without valid token', function() {

        \        expect(res.getStatus()).to.equal(401);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
