info:
  name: "OSE-R-001 | API | GET /admin (Accept: application/json) | blocked at edge OR 401 worker JSON error"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-001 contract: API consumers (curl, scripts, CI) get a structured JSON 401\r

        // from the worker. Only browsers (Accept: text/html) get the HTML sign-in page.\r

        //\r

        // OSE-338 (2026-05-18) reality update: on CF-Access-gated environments (staging/prod),\r

        // CF Access shadows BOTH the HTML and JSON worker paths — it doesn't differentiate by\r

        // Accept header. API consumers hitting /admin get a 302 to CF Access login (HTML).\r

        // The unified contract: unauthenticated admin request is blocked; worker JSON shape\r

        // is enforced only when status === 401.\r

        test('Unauthenticated admin request is blocked (CF Access OR worker 401)', function() {\r

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());\r

        });\r

        \r

        // Worker-401 contract details — only enforced on non-CF-Access environments.\r

        if (res.getStatus() === 401) {\r

        \    test('Content-Type is application/json (NOT HTML)', function() {\r

        \        expect(res.getHeader('Content-Type')).to.include('application/json');\r

        \    });\r

        \r

        \    test('Body is the JSON error shape', function() {\r

        \        const json = res.getBody();\r

        \        expect(json.ok).to.equal(false);\r

        \        expect(json.code).to.equal('UNAUTH');\r

        \    });\r

        \r

        \    test('WWW-Authenticate Bearer challenge present', function() {\r

        \        expect(res.getHeader('WWW-Authenticate')).to.match(/Bearer/i);\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
