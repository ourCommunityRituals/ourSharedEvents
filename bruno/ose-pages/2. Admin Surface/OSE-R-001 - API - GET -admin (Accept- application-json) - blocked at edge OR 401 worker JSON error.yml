info:
  name: "OSE-R-001 | API | GET /admin (Accept: application/json) | blocked at edge OR 401 worker JSON error"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: "// OSE-R-001 contract: API consumers (curl, scripts, CI) get a structured JSON 401

        // from the worker. Only browsers (Accept: text/html) get the HTML sign-in page.

        //

        // OSE-338 (2026-05-18) reality update: on CF-Access-gated environments (staging/prod),

        // CF Access shadows BOTH the HTML and JSON worker paths — it doesn't differentiate by

        // Accept header. API consumers hitting /admin get a 302 to CF Access login (HTML).

        // The unified contract: unauthenticated admin request is blocked; worker JSON shape

        // is enforced only when status === 401.

        test('Unauthenticated admin request is blocked (CF Access OR worker 401)', function() {

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());

        });

        

        // Worker-401 contract details — only enforced on non-CF-Access environments.

        if (res.getStatus() === 401) {

        \    test('Content-Type is application/json (NOT HTML)', function() {

        \        expect(res.getHeader('Content-Type')).to.include('application/json');

        \    });

        

        \    test('Body is the JSON error shape', function() {

        \        const json = res.getBody();

        \        expect(json.ok).to.equal(false);

        \        expect(json.code).to.equal('UNAUTH');

        \    });

        

        \    test('WWW-Authenticate Bearer challenge present', function() {

        \        expect(res.getHeader('WWW-Authenticate')).to.match(/Bearer/i);

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
