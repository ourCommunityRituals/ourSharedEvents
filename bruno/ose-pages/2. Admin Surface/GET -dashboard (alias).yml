info:
  name: GET /dashboard (alias)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/dashboard"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Returns 200 or 401', function() { expect(res.getStatus()).to.be.oneOf([200, 401]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
