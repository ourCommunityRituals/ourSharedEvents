info:
  name: "OSE-2196 | GET /events/rt-offmap-live | off map, on today: no route"
  type: http
  seq: 2

# Owner, 2026-11-19: "Anything that is listed as private or off map cannot be
# routed to." Fixture: bruno/fixtures/routable-seed.sql. rt-offmap-live is active and OFF
# THE MAP (is_published = 0), with exact coordinates (41.615273, -87.860418) and
# a street address. Its page still opens at its link (PO 2026-10-07), but it
# offers no route: no Directions menu, no maps link, no coordinate.
# 403 is accepted only as an edge challenge (cf-mitigated), and fails under
# edgeStrict (OSE-2022); every check below runs on a real 200.
http:
  method: GET
  url: "{{baseUrl}}/events/rt-offmap-live"
  headers:
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();
        const edge = status === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        test('Returns 200 (or an edge challenge)', function () {
          expect(status === 200 || edge).to.equal(true);
        });
        if (edge && String(bru.getEnvVar('edgeStrict')) === '1') {
          test('EDGE (strict, OSE-2022): the read reached the Worker, not an edge challenge', function () { expect('edge challenge').to.eql('the Worker'); });
        }
        if (status === 200) {
          const body = String(res.getBody());
          test('The page opened: it is this event, with its Where card', function () {
            expect(body).to.include('Routable Check');
            expect(body).to.include('data-testid="event-where-live"');
          });
          test('No Directions menu', function () {
            expect(body).to.not.match(/data-testid="geo-link/);
            expect(body).to.not.include('ose-directions-menu');
          });
          test('No maps link of any kind', function () {
            const maps = body.match(/href="(?:https?:\/\/(?:www\.)?google\.[a-z.]+\/maps|https?:\/\/maps\.google|https?:\/\/maps\.apple\.com|geo:|maps:)[^"]*"/gi) || [];
            expect(maps).to.eql([]);
          });
          test('No coordinate of the event anywhere on the page', function () {
            expect(body).to.not.include('41.615273');
            expect(body).to.not.include('-87.860418');
            expect(body).to.not.match(/41\.6152\d*(?:%2C|,)\s*-87\.8604/);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
