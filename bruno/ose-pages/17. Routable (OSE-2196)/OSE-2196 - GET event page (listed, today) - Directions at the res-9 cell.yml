info:
  name: "OSE-2196 | GET /events/rt-listed-live | listed, on today: Directions at the res-9 cell point (control)"
  type: http
  seq: 4

# The control for the off-map pages: rt-listed-live is LISTED (is_published = 1, past its
# publish grace). Its Directions menu stays (owner, 2026-11-19: directions are
# for listed places), and goes to the point of its res-9 cell 89298e593bbffff
# (38.51280, -116.51088), never its stored point
# (38.512345, -116.512345): "it should resolve to the H3". A maps link needs a
# point, so it is the cell's own point (lib/cell-point.ts).
# Fixture: bruno/fixtures/routable-seed.sql.
http:
  method: GET
  url: "{{baseUrl}}/events/rt-listed-live"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // OSE-2160: the edge rules live in lib/edge.js (strict under PAGES_EDGE_STRICT=1).
        require('./lib/edge.js').pageStatus({ bru: bru, res: res, test: test, expect: expect, name: 'Returns 200 or 403 (edge challenge)' });
        const status = res.getStatus();
        // Stricter than the lenient rule: a 403 here must be the edge's
        // (cf-mitigated), never a Worker 403, which would hide a broken page.
        test('A 403 is only ever the edge, never the Worker', function () {
          expect(status !== 403 || (res.getHeader('cf-mitigated') || '').length > 0).to.equal(true);
        });
        if (status === 200) {
          const body = String(res.getBody());
          test('The Directions menu is there', function () {
            expect(body).to.include('data-testid="geo-link-live"');
          });
          test('Google Maps and Apple Maps, at the res-9 cell point', function () {
            expect(body).to.include('href="https://www.google.com/maps/search/?api=1&amp;query=38.51280%2C-116.51088"');
            expect(body).to.include('href="https://maps.apple.com/?ll=38.51280,-116.51088&amp;q=Routable%20Check%20Lanes"');
          });
          test('The stored point is nowhere on the page', function () {
            expect(body).to.not.include('38.512345');
            expect(body).to.not.include('-116.512345');
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
