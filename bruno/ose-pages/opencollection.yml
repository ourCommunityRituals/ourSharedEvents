opencollection: 1.0.0

info:
  name: OSE Pages — Contract

request:
  scripts:
    - type: before-request
      code: |-
        // ADR-021 (OSE-906): production is read-only for tests. Writes may only go to
        // a known non-production host; anything else (production, an unknown host, or
        // a URL that does not parse cleanly) is refused before it is sent.
        (function () {
          var WRITE_HOSTS = ['stg.oursharedevents.com', 'localhost', '127.0.0.1'];
          function host(url) {
            var m = /^[a-z][a-z0-9+.-]*:\/\/([^\/?#]*)/i.exec(String(url || ''));
            if (!m) return null;
            var h = m[1].slice(m[1].lastIndexOf('@') + 1).replace(/:\d*$/, '');
            return h.toLowerCase().replace(/\.$/, '');
          }
          var method = String(req.getMethod() || '').toUpperCase();
          if (['GET', 'HEAD', 'OPTIONS'].indexOf(method) !== -1) return;
          var targets = [bru.getEnvVar('baseUrl'), req.getUrl()].map(host).filter(function (h) {
            return h !== null;
          });
          var allowed = targets.length > 0 && targets.every(function (h) {
            return WRITE_HOSTS.indexOf(h) !== -1;
          });
          if (!allowed) {
            throw new Error('ADR-021: tests write only to staging or localhost; refusing ' + method + ' ' + req.getUrl());
          }
        })();

        // OSE-2160 (F-51), the edge. Two headers, both aimed at the staging edge:
        //  - X-OCR-CI, the token the stg skip rule matches (scripts/ci/cf-waf-stg-ci-skip.mjs),
        //    on requests to the base URL only, never to another host. The Worker does not read it.
        //  - In strict mode (PAGES_EDGE_STRICT=1) a phone's user agent, so the edge does not
        //    read the client as a script. Lenient mode keeps the client's own agent: on 2026-11-19
        //    a phone agent from the CI runner made the edge challenge /map?area= (run 44627418989,
        //    green on main with the default agent), so it is part of the strict pattern, not
        //    sent where nothing has been widened for it. A request that sets its own agent keeps it.
        // The agent string is lib/edge.js PHONE_USER_AGENT; this script has no require (the
        // production-read-only test runs it bare), so it is written out and the edge hook test
        // checks the two are equal.
        (function () {
          var base = String(bru.getEnvVar('baseUrl') || '');
          var url = String(req.getUrl() || '');
          var toBase = url.indexOf('{{baseUrl}}') === 0 || (base !== '' && url.indexOf(base) === 0);
          var token = bru.getEnvVar('ocrCiEdgeToken');
          if (toBase && token && !req.getHeader('X-OCR-CI')) req.setHeader('X-OCR-CI', token);
          if (String(bru.getEnvVar('pagesEdgeStrict')) === '1') {
            var ua = req.getHeader('User-Agent');
            if (!ua || /^(axios|bruno-runtime)/i.test(String(ua))) {
              req.setHeader('User-Agent', 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1');
            }
          }
        })();

        bru.setVar('requestStartTime', Date.now());
    - type: after-response
      code: |-
        // OSE-2090: a 5xx keeps what finds it again in the Worker's logs: the status,
        // the error code and the request id. Never the URL (a signed link is a
        // credential) and never the body. A value prints only when it has the shape of
        // a code or an id; anything else prints as '-'.
        (function () {
          // Never let this block cost a request its other checks.
          try {
            var status = res.getStatus();
            if (!(status >= 500)) return;
            var body = res.getBody();
            var json = body && typeof body === 'object' ? body : {};
            var code = typeof json.code === 'string' && /^[A-Z][A-Z0-9_]{0,63}$/.test(json.code) ? json.code : '-';
            var rid = res.getHeader('X-Request-Id');
            if (typeof rid !== 'string' || rid === '') rid = json.requestId;
            rid = typeof rid === 'string' && /^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|req-[0-9]{1,16})$/i.test(rid) ? rid : '-';
            var method = String(req.getMethod() || '').toUpperCase();
            console.log('[5xx] ' + (/^[A-Z]{1,10}$/.test(method) ? method : '-') + ' status=' + status + ' code=' + code + ' requestId=' + rid);
          } catch (e) {
            console.log('[5xx] diagnostics failed: ' + (e && /^[A-Za-z]{1,40}$/.test(e.name) ? e.name : 'Error'));
          }
        })();

        // OSE-2160 (F-51): an answer from the Cloudflare edge (`cf-mitigated`) is not an
        // answer from the Worker. Strict (PAGES_EDGE_STRICT=1) fails it; lenient names it
        // in the log. Admin, /api/, /brands/ and calendar files are not judged here:
        // lib/edge.js says why.
        require('./lib/edge.js').enforce({ bru: bru, req: req, res: res, test: test, expect: expect, console: console });

        // Collection-level test: a latency budget on every request (OSE-2091).
        // One slow sample is retried or allowed, never the gate on its own; a slow
        // retry, a sample at 2x budget or a third slow sample in the run fails.
        // Rules: lib/latency-budget.js.
        const elapsed = Date.now() - bru.getVar('requestStartTime');
        await require('./lib/latency-budget.js').enforce({ bru: bru, req: req, res: res, test: test, expect: expect, elapsed: elapsed, budget: 3000 });


        // Invariant #6 — Inert Monetization Hooks: every Worker response (including HTML
        // pages) must carry X-Monetization-Inert: true. Skip responses the worker never
        // produced: CF Access redirects (302) AND the CF-Access-gated admin aliases
        // /admin and /manage (Newman follows the 302 to the CF Access login page — a
        // 200 with no worker header), AND CF WAF/managed-challenge EDGE BLOCKS (403 HTML
        // served by Cloudflare BEFORE the worker runs — e.g. adversarial paths like
        // evt_does_not_exist_r004; see OSE-348/OSE-939). Detected by the CF block-page
        // signature so it never misfires on a worker response: worker JSON 401/403 are
        // application/json (not text/html), and worker-branded HTML error pages carry
        // none of the CF block markers — both are still asserted.
        const __ct = res.getHeader('Content-Type') || '';
        // Primary signal: CF sets cf-mitigated on WAF block/challenge actions. Fallback:
        // the CF block-page body signature (403 HTML). Either way this fires ONLY on a
        // non-worker edge response — a worker JSON/HTML 403 has neither.
        const __cfMitigated = (res.getHeader('cf-mitigated') || '').length > 0;
        const __isCfEdgeBlock = res.getStatus() === 403 && (__cfMitigated || (/text\/html/i.test(__ct) && /Attention Required|have been blocked|cf-error-details|__cf_chl|Cloudflare Ray ID/i.test((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody())))));
        // The other pages behind the staging Access app (scripts/ci/access-protected-paths.txt)
        // answer an unauthenticated request with the Access login page, which carries no worker
        // header. Matched on the path (prefix, the way an Access destination matches), not on a
        // substring, so a public URL that merely contains one of these words is still asserted.
        const __u = req.getUrl().toString();
        const __p = __u.slice(__u.indexOf('/', __u.indexOf('://') + 3)).split('?')[0];
        const __accessGated = ['/dashboard', '/create', '/briefing', '/overview', '/summary'].some(function (x) { return __p.indexOf(x) === 0; });
        if (res.getStatus() !== 302 && !__isCfEdgeBlock && !__accessGated && req.getUrl().toString().indexOf('/admin') === -1 && req.getUrl().toString().indexOf('/manage') === -1) {
            test('Invariant #6: X-Monetization-Inert: true on every Worker response', function() {
                expect(res.getHeader('X-Monetization-Inert')).to.eql('true');
            });
        }

docs:
  content: |-
    Frontend HTML surface collection for ourSharedEvents.
    Separated from API. Covers all 5 MVP surfaces + form pages + aliases.

    Requires: OSE - Staging environment.
  type: text/markdown
bundled: false
extensions: {}
