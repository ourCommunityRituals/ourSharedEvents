opencollection: 1.0.0

info:
  name: OSE Pages — Contract

request:
  scripts:
    - type: before-request
      code: |-
        // ADR-021 (OSE-906): production is read-only for tests. Refuse any write
        // before it is sent, whichever environment file was chosen. Compares exact
        // hostnames (userinfo, port, case and a trailing dot cannot hide production).
        (function () {
          var PRODUCTION_HOSTS = ['oursharedevents.com', 'www.oursharedevents.com'];
          function host(url) {
            var m = /^[a-z][a-z0-9+.-]*:\/\/(?:[^@\/?#]*@)?([^\/?#:]+)/i.exec(String(url || ''));
            return m ? m[1].toLowerCase().replace(/\.$/, '') : '';
          }
          var method = String(req.getMethod() || '').toUpperCase();
          var targets = [host(bru.getEnvVar('baseUrl')), host(req.getUrl())];
          var isProduction = targets.some(function (h) { return PRODUCTION_HOSTS.indexOf(h) !== -1; });
          if (isProduction && ['GET', 'HEAD', 'OPTIONS'].indexOf(method) === -1) {
            throw new Error('ADR-021: production is read-only for tests; refusing ' + method + ' ' + req.getUrl());
          }
        })();

        bru.setVar('requestStartTime', Date.now());
    - type: after-response
      code: "const elapsed = Date.now() - bru.getVar('requestStartTime');

        test(`Response time < 3000ms (actual: ${elapsed}ms)`, function() {

        \    expect(elapsed).to.be.below(3000);

        });

        

        // Invariant #6 — Inert Monetization Hooks: every Worker response (including HTML

        // pages) must carry X-Monetization-Inert: true. Skip responses the worker never

        // produced: CF Access redirects (302) AND the CF-Access-gated admin aliases

        // /admin and /manage (Newman follows the 302 to the CF Access login page — a

        // 200 with no worker header), AND CF WAF/managed-challenge EDGE BLOCKS (403 HTML

        // served by Cloudflare BEFORE the worker runs — e.g. adversarial paths like

        // evt_does_not_exist_r004; see OSE-348/OSE-939). Detected by the CF block-page

        // signature so it never misfires on a worker response: worker JSON 401/403 are

        // application/json (not text/html), and worker-branded HTML error pages carry

        // none of the CF block markers — both are still asserted.

        const __ct = res.getHeader('Content-Type') || '';

        // Primary signal: CF sets cf-mitigated on WAF block/challenge actions. Fallback:

        // the CF block-page body signature (403 HTML). Either way this fires ONLY on a

        // non-worker edge response — a worker JSON/HTML 403 has neither.

        const __cfMitigated = (res.getHeader('cf-mitigated') || '').length > 0;

        const __isCfEdgeBlock = res.getStatus() === 403 && (__cfMitigated || (/text\\/html/i.test(__ct) && /Attention Required|have been blocked|cf-error-details|__cf_chl|Cloudflare Ray ID/i.test((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody())))));

        if (res.getStatus() !== 302 && !__isCfEdgeBlock && req.getUrl().toString().indexOf('/admin') === -1 && req.getUrl().toString().indexOf('/manage') === -1) {

        \    test('Invariant #6: X-Monetization-Inert: true on every Worker response', function() {

        \        expect(res.getHeader('X-Monetization-Inert')).to.eql('true');

        \    });

        }"

docs:
  content: |-
    Frontend HTML surface collection for ourSharedEvents.
    Separated from API. Covers all 5 MVP surfaces + form pages + aliases.

    Requires: OSE - Staging environment.
  type: text/markdown
bundled: false
extensions: {}
