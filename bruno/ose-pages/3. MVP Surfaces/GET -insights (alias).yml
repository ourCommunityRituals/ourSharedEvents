info:
  name: GET /insights (alias)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/insights"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });\r

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
