info:
  name: GET /kiosk (alias)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/kiosk"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "require('./lib/edge.js').pageStatus({ bru: bru, res: res, test: test, expect: expect, name: 'Returns 200 or 403 (feature flag)' });

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
