info:
  name: GET /sharedReport
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/sharedReport"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-682: everyone gets a SharedReport. The page loads on every plan; the read API

        // decides what it shows (a plan without the paid report reads at Local). It used to

        // answer 403 REPORT_DISABLED on Free, and while staging sat on Free every check

        // below was skipped.

        test('Returns 200 on every plan (OSE-682)', function() {

        \    expect(res.getStatus()).to.eql(200);

        });

        test('Is HTML', function() {

        \    expect(res.getHeader('Content-Type')).to.include('text/html');

        });

        test('Has DOCTYPE', function() {

        \    expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.include('<!DOCTYPE html>');

        });

        test('Is not kept by the browser (Cache-Control no-store)', function() {

        \    expect(String(res.getHeader('cache-control') || '')).to.eql('no-store');

        });

        test('Never sends its address on (Referrer-Policy no-referrer)', function() {

        \    expect(String(res.getHeader('referrer-policy') || '')).to.eql('no-referrer');

        });

        test('Reads the scan count as distinct_scanners, never unique_gatherings (OSE-818)', function() {

        \    const html = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        \    expect(html).to.include('report.distinct_scanners');

        \    expect(html).to.include('Distinct Scanners');

        \    expect(html).to.not.include('unique_gatherings');

        });

        test('Is the report page, not the old plan refusal', function() {

        \    const html = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        \    expect(html).to.not.include('REPORT_DISABLED');

        \    expect(html).to.not.include('switched on here yet');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
