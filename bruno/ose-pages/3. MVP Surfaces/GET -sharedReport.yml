info:
  name: GET /sharedReport
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/sharedReport"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// SharedReport is feature-flag gated (analytics.shared-report).\r

        // Returns 200 HTML when enabled, 403 JSON with REPORT_DISABLED when off.\r

        test('Returns 200 (enabled) or 403 (flag off)', function() {\r

        \    expect([200, 403]).to.include(res.getStatus());\r

        });\r

        \r

        if (res.getStatus() === 200) {\r

        \    test('Is HTML', function() {\r

        \        expect(res.getHeader('Content-Type')).to.include('text/html');\r

        \    });\r

        \    test('Has DOCTYPE', function() {\r

        \        expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.include('<!DOCTYPE html>');\r

        \    });\r

        } else if (res.getStatus() === 403) {\r

        \    test('Has REPORT_DISABLED code', function() {\r

        \        const json = res.getBody();\r

        \        expect(json.code).to.eql('REPORT_DISABLED');\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
