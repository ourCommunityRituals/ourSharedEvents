info:
  name: GET /sharedReport
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/sharedReport"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// SharedReport is feature-flag gated (analytics.shared-report).

        // Returns 200 HTML when enabled, 403 JSON with REPORT_DISABLED when off.

        test('Returns 200 (enabled) or 403 (flag off)', function() {

        \    expect([200, 403]).to.include(res.getStatus());

        });

        

        if (res.getStatus() === 200) {

        \    test('Is HTML', function() {

        \        expect(res.getHeader('Content-Type')).to.include('text/html');

        \    });

        \    test('Has DOCTYPE', function() {

        \        expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.include('<!DOCTYPE html>');

        \    });

        } else if (res.getStatus() === 403) {

        \    test('Has REPORT_DISABLED code', function() {

        \        const json = res.getBody();

        \        expect(json.code).to.eql('REPORT_DISABLED');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
