info:
  name: GET /display
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/display"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }

        test('Has DOCTYPE', function() { expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.include('<!DOCTYPE html>'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
