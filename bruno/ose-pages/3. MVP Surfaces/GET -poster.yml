info:
  name: GET /poster
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/poster"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });\r

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }\r

        test('Has DOCTYPE', function() { expect(JSON.stringify(res.getBody())).to.include('<!DOCTYPE html>'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
