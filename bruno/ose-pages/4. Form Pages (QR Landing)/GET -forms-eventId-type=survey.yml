info:
  name: GET /forms/:eventId?type=survey
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/forms/{{testEventId}}?type=survey"
  params:
    - name: type
      value: survey
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });\r

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }\r

        test('Has survey content', function() { expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody())).toLowerCase()).to.include('survey'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
