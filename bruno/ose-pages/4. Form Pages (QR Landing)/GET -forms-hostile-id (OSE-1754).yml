info:
  name: GET /forms/<id that breaks out of a script string> (OSE-1754)
  type: http
  seq: 6

http:
  method: GET
  # A quote breakout with nothing a WAF reads as an attack, so the request
  # reaches the Worker: before the fix it became submitForm('x',1754,'', ...).
  url: "{{baseUrl}}/forms/x',1754,'?type=register"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var body = typeof res.getBody()==='string' ? res.getBody() : JSON.stringify(res.getBody()); var edge = !!res.getHeader('cf-mitigated');

        if (edge) { test('OSE-1754: the edge challenged the request (cf-mitigated), so nothing reached the Worker', function() { expect(edge).to.equal(false); }); }

        test('OSE-1754: a refused /forms id answers 404', function() { expect(res.getStatus()).to.equal(404); });

        test('OSE-1754: the page carries no form', function() { expect(body.toLowerCase()).to.not.include('<form'); });

        test('OSE-1754: nothing from the id reaches the page', function() { expect(body).to.not.include(',1754,'); });

        test('OSE-1754: the 404 page leaves a way back to the events list', function() { expect(body).to.include('href=\"/events\"'); });"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
