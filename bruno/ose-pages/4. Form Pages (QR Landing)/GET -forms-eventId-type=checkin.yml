info:
  name: GET /forms/:eventId?type=checkin
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/forms/{{testEventId}}?type=checkin"
  params:
    - name: type
      value: checkin
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }

        test('Has check-in content', function() { expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody())).toLowerCase()).to.include('check'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
