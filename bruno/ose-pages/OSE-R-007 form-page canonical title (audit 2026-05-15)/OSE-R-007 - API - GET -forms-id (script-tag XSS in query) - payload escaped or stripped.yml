info:
  name: OSE-R-007 | API | GET /forms/:id (script-tag XSS in query) | payload escaped or stripped
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/forms/evt_does_not_exist_r007?event=%3Cscript%3Ealert%281%29%3C%2Fscript%3E&type=register"
  headers:
    - name: Accept
      value: text/html
  params:
    - name: event
      value: "%3Cscript%3Ealert%281%29%3C%2Fscript%3E"
      type: query
    - name: type
      value: register
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() { expect(res.getStatus()).to.equal(200); });\r

        const body = JSON.stringify(res.getBody());\r

        test('Raw <script> tag from query string NOT present', function() {\r

        \    expect(body).to.not.include('<script>alert(1)</script>');\r

        });\r

        test('alert(1) literal NOT present', function() {\r

        \    expect(body).to.not.include('alert(1)');\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
