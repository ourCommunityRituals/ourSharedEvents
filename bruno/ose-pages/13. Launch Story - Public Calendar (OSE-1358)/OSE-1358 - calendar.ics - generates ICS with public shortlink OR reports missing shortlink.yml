info:
  name: OSE-1358 | calendar.ics | generates ICS with public shortlink OR reports missing shortlink
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/events/test-event-001/calendar.ics"
  headers:
    - name: Accept
      value: text/calendar
    - name: X-OCR-CI
      value: "{{ocrCiEdgeToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// Contract (workers/oursharedevents/src/handlers/calendar.ts): 200 is a published/active event WITH an existing public shortlink — a real .ics body using the /s/<code> share URL, never the internal event id. 409 PUBLIC_SHORTLINK_MISSING is a published/active event with no minted public shortlink yet (documented gap, not a worker failure — the GET path never mints one, read-only by design, OSE-1358). 403 is a Cloudflare WAF edge block on the /events/:id path shape (same unified contract as OSE-R-004's /events/:id error page, OSE-348) — the worker never ran. All three are passing outcomes; only 200 gets the deep ICS assertions, only 409 gets the code assertion.\ntest('200 (ICS) OR 409 (shortlink not yet minted) OR 403 (WAF edge block)', function () { expect([200, 409, 403]).to.include(res.getStatus()); });\nconst body = (typeof res.getBody() === 'string' ? res.getBody() : JSON.stringify(res.getBody()));\nif (res.getStatus() === 200) {\n    test('Content-Type is text/calendar', function () { expect(res.getHeader('Content-Type') || '').to.include('text/calendar'); });\n    test('Content-Disposition offers an .ics attachment', function () { expect(res.getHeader('Content-Disposition') || '').to.include('.ics'); });\n    test('body is a VCALENDAR with one VEVENT', function () {\n        expect(body).to.include('BEGIN:VCALENDAR');\n        expect(body).to.include('BEGIN:VEVENT');\n        expect(body).to.include('DTSTART');\n    });\n    test('body carries the public /s/<code> share link, not the internal event id', function () {\n        expect(body).to.match(/URL:https?:\\/\\/[^\\r\\n]+\\/s\\/[A-Za-z0-9]+/);\n        expect(body).to.not.include('test-event-001');\n    });\n} else if (res.getStatus() === 409) {\n    test('409 code is PUBLIC_SHORTLINK_MISSING', function () { expect(res.getBody().code).to.eql('PUBLIC_SHORTLINK_MISSING'); });\n}\nif (res.getStatus() === 403 && (res.getHeader('cf-mitigated') || '').length > 0 && String(bru.getEnvVar('edgeStrict')) === '1') {\n    test('EDGE (strict, OSE-2022): the read reached the Worker, not an edge challenge', function () { expect('edge challenge').to.eql('the Worker'); });\n}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
