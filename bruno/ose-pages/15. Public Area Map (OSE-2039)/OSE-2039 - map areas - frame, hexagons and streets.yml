info:
  name: OSE-2039 | map areas | frame, hexagons, and streets when the archive is loaded
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/map/areas?cells=872664570ffffff&around=1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The drawn map for a list of areas (handlers/map-areas.ts, OSE ADR-033),
        // read the way a static-site build reads it: no credential, no cookie and
        // no X-OCR-CI header. The first reader is the OurWKRP showcase build.
        //
        // An edge challenge here is a FAILURE, not a pass: a build has no browser
        // to answer one, so a challenged read means the reader cannot use the
        // route (OSE ADR-028 found this on the calendar addresses).
        //
        // Streets, three states, as on the landing (1. Landing - Public):
        //   streets drawn          every street assertion runs.
        //   streets null, archive not loaded (streetMapArchiveLoaded is not "true")
        //                          the fail-soft answer is asserted and a test named
        //                          NOT RUN says what was not checked (it passes only
        //                          while the flag is exactly "false").
        //   streets null, archive loaded
        //                          a named test fails.
        //
        // Roads, not any path (street-map CCR 2026-11-15, R17), by the drawer's own
        // rule and number, as on the landing (base-map plan, gap G12): a highway or
        // a major road, and MIN_ROAD_POINTS points of highway, major and minor road
        // in all (lib/street-map.ts, layerShows), counted as the M and L commands
        // of the as-r as-3, as-r as-2 and as-r as-1 paths, one command a point.
        // MIN_ROAD_POINTS is a copy of the drawer's, held equal by name in
        // tests/unit/ci/street-map-staging-cases.test.js. The layer measured as
        // wrong had 8,999 points of water and 1 of road; the sparsest good frame
        // measured had 253 of highway and major road alone (one area over Sawyer,
        // Michigan).
        //
        // The right place, not just any roads (street-map CCR 2026-11-15, R17). The
        // road count passes on the streets of any town. What ties the layer to
        // THIS area is a town: streetMapTownAnchor in the environment file names one
        // that lies inside this frame, as "Name|lat|lng" (the town's own point, as
        // OpenStreetMap has it). The layer must draw that name, and draw it where
        // that town is: the point is put through the frame this answer carries and
        // the name must sit within ANCHOR_UNITS of it. A file cut for another
        // place draws other names; tiles one step out of place draw the name about
        // a tile away (256 units, give or take a zoom step), far past 30.
        //   anchor empty, flag not "true"   a test named NOT RUN says the place is
        //                                   not checked.
        //   anchor empty, flag "true"       a named test fails: the flag may not be
        //                                   set without a town to hold the place.
        //   anchor set                      it must read as "Name|lat|lng" and lie
        //                                   inside the frame; with streets drawn
        //                                   the name is looked for, whatever the
        //                                   flag. With none drawn the street tests
        //                                   below speak for the whole layer.
        // Which towns a real file names in this frame is not known until one is
        // drawn on staging, so the anchor is set in the PR that sets the flag
        // (docs/runbooks/RUNBOOK-STREET-MAP-ARCHIVE.md, "Staging, in order", step 9).
        //
        // The switch (STREET_MAP in wrangler.toml, read by lib/street-map.ts;
        // street-map CCR 2026-11-15, R20). streetMapSwitch in the environment file
        // is a copy of staging's value (tests/unit/ci/env-parity.test.js holds the
        // two equal), so every run's log says which way the switch is, in the name
        // of one test:
        //   "off"  the answer must carry no street layer, whatever the bucket holds.
        //   "on"   the three states above decide.
        //   else   the test fails: the copy must say "on" or "off".
        // It is not streetMapArchiveLoaded: that flag says what these cases must
        // see, and this says what the Worker is set to draw.
        const edge = res.getStatus() === 403 && (res.getHeader('cf-mitigated') || '').length > 0;
        const flag = String(bru.getEnvVar('streetMapArchiveLoaded'));
        const loaded = flag === 'true';
        const sw = String(bru.getEnvVar('streetMapSwitch'));
        const SWITCH_TEST = sw === 'off'
          ? 'Street-map switch: STREET_MAP is "off" for this environment, and no street layer is drawn'
          : sw === 'on'
            ? 'Street-map switch: STREET_MAP is "on" for this environment (streetMapArchiveLoaded says whether streets must be drawn)'
            : 'Street-map switch: the environment file sets streetMapSwitch to "on" or "off"';
        const anchorRaw = String(bru.getEnvVar('streetMapTownAnchor') || '');
        const ANCHOR_UNITS = 30;
        const ANCHOR_SET = 'Right place: streetMapTownAnchor is "Name|lat|lng", a town inside this frame';
        const anchorOf = function (raw) {
          const m = /^([^|]{1,60})\|(-?\d{1,2}(?:\.\d+)?)\|(-?\d{1,3}(?:\.\d+)?)$/.exec(raw);
          return m ? { name: m[1], lat: Number(m[2]), lng: Number(m[3]) } : null;
        };
        // Latitude and longitude to this answer's frame: Web Mercator, as
        // lib/street-map.ts (toWorld, project) draws it.
        const inFrame = function (frame, lat, lng) {
          const s = Math.sin((lat * Math.PI) / 180);
          const wx = (lng + 180) / 360;
          const wy = 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
          return [(wx - frame.x0) * frame.scale, (wy - frame.y0) * frame.scale];
        };
        // The town names of a street layer, each with the point it is drawn at.
        const townNames = function (layer) {
          const out = [];
          const re = /<text class="as-t" x="(-?\d+)" y="(-?\d+)"[^>]*>([^<]*)<\/text>/g;
          let m;
          while ((m = re.exec(layer)) !== null) {
            const name = m[3].replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
            out.push({ name: name, x: Number(m[1]), y: Number(m[2]) });
          }
          return out;
        };
        const MIN_ROAD_POINTS = 100;
        const roadPoints = function (layer) {
          const n = { highway: 0, major: 0, minor: 0 };
          const kind = { 3: 'highway', 2: 'major', 1: 'minor' };
          const re = /<path class="as-r as-([123])" d="([^"]*)"/g;
          let m;
          while ((m = re.exec(layer)) !== null) {
            n[kind[m[1]]] += (m[2].match(/[ML]/g) || []).length;
          }
          return n;
        };

        test('The read reaches the Worker with no credential (not an edge challenge)', function () {
          expect(edge).to.equal(false);
        });
        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        const json = res.getBody() || {};

        test(SWITCH_TEST, function () {
          expect(sw, 'streetMapSwitch in the environment file').to.be.oneOf(['on', 'off']);
          if (sw === 'off') {
            expect(json.streets, 'STREET_MAP is "off" and the route drew a street layer').to.equal(null);
          }
        });

        test('The frame is the fixed Web Mercator frame', function () {
          expect(json.ok).to.equal(true);
          expect(json.frame.projection).to.equal('web-mercator');
          expect(json.frame.w).to.equal(600);
          expect(json.frame.h).to.equal(360);
          expect(json.frame.scale).to.be.a('number');
          expect(json.frame.x0).to.be.a('number');
          expect(json.frame.y0).to.be.a('number');
        });

        test('The area is numbered 1, with a six-corner outline inside the frame', function () {
          expect(json.areas).to.have.length(1);
          const a = json.areas[0];
          expect(a.cell).to.equal('872664570ffffff');
          expect(a.n).to.equal(1);
          const pts = a.points.split(' ').map(function (p) { return p.split(',').map(Number); });
          expect(pts).to.have.length(6);
          pts.forEach(function (p) {
            expect(p[0]).to.be.within(0, 600);
            expect(p[1]).to.be.within(0, 360);
          });
          expect(a.centre).to.have.length(2);
        });

        test('around=1 returns the six neighbouring outlines, and never the area itself', function () {
          expect(json.around).to.have.length(6);
          json.around.forEach(function (c) {
            expect(c.cell).to.not.equal('872664570ffffff');
            expect(c.points.split(' ')).to.have.length(6);
          });
        });

        test('No cookie is set', function () {
          expect(!res.getHeader('set-cookie')).to.equal(true);
        });

        test('Nothing but the frame, the cells and the streets is in the answer', function () {
          expect(Object.keys(json).sort()).to.eql(['areas', 'around', 'frame', 'ok', 'status', 'streets']);
        });

        if (json.streets) {
          test('The street layer is one SVG group', function () {
            expect(json.streets.svg).to.match(/^<g class="amap-s"/);
            expect(json.streets.svg).to.match(/<\/g>$/);
          });
          test('The street layer holds roads by the drawer\'s rule: a highway or major road, and MIN_ROAD_POINTS path commands of road in all (water alone fails)', function () {
            const layer = String(json.streets.svg);
            const n = roadPoints(layer);
            expect(layer, 'no highway (as-r as-3) or major-road (as-r as-2) path in the street layer').to.match(/<path class="as-r as-[23]" d="M/);
            expect(n.highway + n.major, 'M and L commands in the highway and major-road paths').to.be.above(0);
            expect(n.highway + n.major + n.minor, 'M and L commands in the highway, major-road and minor-road paths').to.be.at.least(MIN_ROAD_POINTS);
          });
          test('The street layer comes with its CSS and the OpenStreetMap credit', function () {
            expect(json.streets.css).to.include('.as-r');
            expect(json.streets.css).to.not.include('<style');
            expect(json.streets.credit.html).to.include('href="https://www.openstreetmap.org/copyright/en"');
            expect(json.streets.credit.html).to.include('<a href="https://protomaps.com">Protomaps</a>');
          });
          test('The street layer loads nothing from another host', function () {
            expect(json.streets.svg).to.not.match(/(src|href)=|https?:/i);
          });
        } else {
          test('Without streets the answer is still the hexagons, and streets is null', function () {
            expect(json.streets).to.equal(null);
            expect(json.areas).to.have.length(1);
          });
          if (loaded) {
            test('The street layer is drawn (streetMapArchiveLoaded is true for this environment)', function () {
              expect(json.streets, 'the environment file says the street-map archive is loaded, and the route drew no street layer').to.not.equal(null);
            });
          } else {
            test('NOT RUN (street-map archive not loaded on this environment: streetMapArchiveLoaded is not true): street layer paths, CSS, OpenStreetMap credit, no third-party host', function () {
              expect(flag, 'a NOT RUN test passes only while the environment file sets streetMapArchiveLoaded to "false"').to.equal('false');
            });
          }
        }

        if (anchorRaw === '') {
          if (loaded) {
            test('Right place: streetMapTownAnchor names a town of this area (streetMapArchiveLoaded is true for this environment)', function () {
              expect(anchorRaw, 'streetMapArchiveLoaded is "true" and streetMapTownAnchor is empty: with no town named, any town\'s streets pass here').to.not.equal('');
            });
          } else {
            test('NOT RUN (no town is named for this area: streetMapTownAnchor is empty): the street layer is of this place, a named town drawn where that town is', function () {
              expect(flag, 'a NOT RUN test passes only while the environment file sets streetMapArchiveLoaded to "false"').to.equal('false');
            });
          }
        } else {
          const anchor = anchorOf(anchorRaw);
          const at = anchor && json.frame ? inFrame(json.frame, anchor.lat, anchor.lng) : null;
          test(ANCHOR_SET, function () {
            expect(anchor, 'streetMapTownAnchor is not "Name|lat|lng"').to.not.equal(null);
            expect(at[0], 'the town lies left or right of this frame').to.be.within(0, 600);
            expect(at[1], 'the town lies above or below this frame').to.be.within(0, 360);
          });
          if (json.streets) {
            test('Right place: the town named in streetMapTownAnchor is drawn, where that town is (within 30 units)', function () {
              expect(anchor, 'streetMapTownAnchor is not "Name|lat|lng"').to.not.equal(null);
              const drawn = townNames(String(json.streets.svg));
              const names = drawn.map(function (d) { return d.name; });
              const found = drawn.filter(function (d) { return d.name === anchor.name; });
              expect(found.length, 'the street layer names ' + (names.join(', ') || 'no town') + ', and not ' + anchor.name).to.be.at.least(1);
              const off = Math.min.apply(null, found.map(function (d) { return Math.hypot(d.x - at[0], d.y - at[1]); }));
              expect(off, anchor.name + ' is drawn ' + Math.round(off) + ' units from where it is (' + Math.round(at[0]) + ', ' + Math.round(at[1]) + ')').to.be.at.most(ANCHOR_UNITS);
            });
          }
          // With no street layer there is no name to look for: the street tests
          // above already say NOT RUN, or fail, for the whole layer.
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
