info:
  name: OSE-2039 | map areas | refuses a cell that is not resolution 7 (400)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/map/areas?cells=892664570a3ffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Resolution 7 is the only grain a public map is drawn at (hexagon map
        // standard, rule 1). 892664570a3ffff is a resolution-9 cell, about one
        // block: refused, never drawn.
        test('400 on a resolution-9 cell', function () { expect(res.getStatus()).to.eql(400); });
        const json = res.getBody() || {};
        test('ok is false', function () { expect(json.ok).to.eql(false); });
        test('code is CELL_RESOLUTION', function () { expect(json.code).to.eql('CELL_RESOLUTION'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
