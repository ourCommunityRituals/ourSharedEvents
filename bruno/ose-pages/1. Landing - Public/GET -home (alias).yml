info:
  name: GET /home (alias)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/home"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() {

        \    expect(res.getStatus()).to.equal(200);

        });

        test('Is HTML', function() {

        \    expect(res.getHeader('Content-Type')).to.include('text/html');

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
