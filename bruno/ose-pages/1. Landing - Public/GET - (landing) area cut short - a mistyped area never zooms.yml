info:
  name: GET /?area=872664570fffff (landing) - a mistyped area never zooms
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseUrl}}/?area=872664570fffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Fat finger (owner 2026-11-10): ?area= is the one thing a visitor can type
        // into the map. 872664570fffff is Mount Greenwood's cell with its last
        // character missing (14 characters, a res-7 cell has 15). Anything that is
        // not a res-7 cell is ignored: the landing is served as if nothing was
        // asked, never an error page and never a zoom on a guessed area.
        // The case before this one sends the whole cell and does zoom.
        const body = String(res.getBody());
        const has = function (id) { return body.includes('data-testid="' + id + '"'); };

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('Is the landing, not the error page', function () {
          expect(body).to.include('<!DOCTYPE html>');
          expect(has('public-error')).to.equal(false);
        });

        test('Opens no area: no zoom, no way back, no place list, no dot', function () {
          expect(body).to.not.include('data-zoom="');
          expect(has('amap-back')).to.equal(false);
          expect(has('amap-no-tiles')).to.equal(false);
          expect(has('amap-dot')).to.equal(false);
          expect(has('amap-zone')).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
