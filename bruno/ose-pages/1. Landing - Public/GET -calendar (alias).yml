info:
  name: GET /calendar (alias)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/calendar?when=week"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('/calendar answers 301 (or 403 when the edge challenges a script client; never the page itself)', function() { expect([301, 403]).to.include(res.getStatus()); }); if (res.getStatus() === 301) { test('/calendar redirects to /events and keeps the query', function() { expect(String(res.getHeader('location')).endsWith('/events?when=week')).to.equal(true); }); }"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
