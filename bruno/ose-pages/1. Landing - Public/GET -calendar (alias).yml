info:
  name: GET /calendar (alias)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/calendar?when=week"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('/calendar answers 301 (one address for the events page)', function() { expect(res.getStatus()).to.equal(301); }); test('/calendar redirects to /events and keeps the query', function() { expect(String(res.getHeader('location')).endsWith('/events?when=week')).to.equal(true); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false
