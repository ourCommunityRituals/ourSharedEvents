info:
  name: GET /events (public)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/events"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200 or 403 (feature flag)', function() { expect([200, 403]).to.include(res.getStatus()); });

        if (res.getStatus() === 200) { test('Is HTML', function() { expect(res.getHeader('Content-Type')).to.include('text/html'); }); }

        // OSE-871 (P-1): the public grid reads one canonical name per value now

        // (name/startDateISO/venue) with no '|| Untitled Event' fallback. The drift

        // literal must be absent from the shipped template — the assertion that

        // matters most: 'Untitled Event' never renders for a seeded event.

        if (res.getStatus() === 200) { test('OSE-871: no Untitled Event drift literal in shipped /events template', function() { expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.not.include('Untitled Event'); }); }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
