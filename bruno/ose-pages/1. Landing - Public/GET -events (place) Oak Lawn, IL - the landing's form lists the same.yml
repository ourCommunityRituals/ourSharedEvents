info:
  name: GET /events?q=Oak Lawn, IL - the landing's form lists the same
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/events?q=Oak%20Lawn%2C%20IL"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // CCR 2026-11-07 L3-04: the landing takes "Oak Lawn, IL"; /events read 0 for it.
        // Both now read a town the same way (lib/place-key.ts), state after the name or not.
        // Fixture: bruno/fixtures/landing-zip-own-area-seed.sql (published for this run only).
        const body = String(res.getBody());
        test('Returns 200', function () { expect(res.getStatus()).to.equal(200); });
        test('Heads the list with the place', function () { expect(body).to.include('Events in Oak Lawn'); });
        test('Lists the Oak Lawn event', function () { expect(body).to.include('Zip Own Area Check (Oak Lawn)'); });
        test('Does not list the Mount Greenwood event', function () { expect(body).to.not.include('Zip Own Area Check (Mount Greenwood)'); });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
