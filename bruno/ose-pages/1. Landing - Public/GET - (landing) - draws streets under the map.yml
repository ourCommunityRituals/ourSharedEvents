info:
  name: GET / (landing) - draws streets under the map
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The street map under the hexagons (lib/street-map.ts), on staging. The
        // Worker draws it from the archive in the MAP_TILES bucket; nothing in the
        // browser asks for a tile. Owner steps and the build name:
        // docs/runbooks/RUNBOOK-STREET-MAP-ARCHIVE.md.
        //
        // Three states, and none of them passes quietly:
        //   streets drawn        every street assertion runs.
        //   no streets, and the environment says the archive is not loaded
        //   (streetMapArchiveLoaded is not "true")
        //                        the fail-soft page is asserted (hexagons only, no
        //                        credit) and the street assertions print NOT RUN.
        //   no streets, and the environment says the archive is loaded
        //                        a named test fails.
        //
        // Roads, not any path (street-map CCR 2026-11-15, R17). The check before
        // this one took any path, water included, and the layer measured as wrong
        // was 8,999 points of water and one point of road. What is counted here is
        // the M and L commands of the highway path (as-r as-3) and of the
        // major-road path (as-r as-2): the roads a reader finds their way by, and
        // the ones the drawer keeps first. Minor roads (as-r as-1) are left out, as
        // a dense frame may rightly draw none.
        // ROAD_FLOOR is 50. The wrong layer had 1. The sparsest good frame measured
        // had 253 (one area over Sawyer, Michigan), so 50 leaves a small town room
        // and still fails a layer whose points all went to water.
        //
        // The switch (STREET_MAP in wrangler.toml, read by lib/street-map.ts;
        // street-map CCR 2026-11-15, R20). streetMapSwitch in the environment file
        // is a copy of staging's value (tests/unit/ci/env-parity.test.js holds the
        // two equal), so every run's log says which way the switch is, in the name
        // of one test:
        //   "off"  the landing must carry no street layer, whatever the bucket holds.
        //   "on"   the three states above decide.
        //   else   the test fails: the copy must say "on" or "off".
        // It is not streetMapArchiveLoaded: that flag says what these cases must
        // see, and this says what the Worker is set to draw.
        const body = String(res.getBody());
        const has = function (id) { return body.includes('data-testid="' + id + '"'); };
        const at = function (id) { return body.indexOf('data-testid="' + id + '"'); };
        const loaded = String(bru.getEnvVar('streetMapArchiveLoaded')) === 'true';
        const sw = String(bru.getEnvVar('streetMapSwitch'));
        const SWITCH_TEST = sw === 'off'
          ? 'Street-map switch: STREET_MAP is "off" for this environment, and no street layer is drawn'
          : sw === 'on'
            ? 'Street-map switch: STREET_MAP is "on" for this environment (streetMapArchiveLoaded says whether streets must be drawn)'
            : 'Street-map switch: the environment file sets streetMapSwitch to "on" or "off"';
        const ROAD_FLOOR = 50;
        const roadCommands = function (layer) {
          let n = 0;
          (layer.match(/<path class="as-r as-[23]" d="[^"]*"/g) || []).forEach(function (p) {
            n += (p.slice(p.indexOf(' d="')).match(/[ML]/g) || []).length;
          });
          return n;
        };

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test(SWITCH_TEST, function () {
          expect(sw, 'streetMapSwitch in the environment file').to.be.oneOf(['on', 'off']);
          if (sw === 'off') {
            expect(has('amap-streets'), 'STREET_MAP is "off" and the landing drew a street layer').to.equal(false);
            expect(has('amap-credit'), 'STREET_MAP is "off" and the landing shows the OpenStreetMap credit').to.equal(false);
          }
        });

        if (!has('amap-svg')) {
          // Under 10 events in the area the landing leads with the list, and no map
          // is drawn to put streets under. The area case (next request) does not
          // depend on that count.
          if (loaded) {
            test('The landing draws its map, so its streets can be checked (streetMapArchiveLoaded is true for this environment)', function () {
              expect(has('amap-svg'), 'the environment file says the street-map archive is loaded, and the landing drew no map to put streets under (fewer than 10 events on this environment?)').to.equal(true);
            });
          } else {
            test('The landing draws no map, and so no street layer and no OpenStreetMap credit', function () {
              expect(has('amap-streets')).to.equal(false);
              expect(has('amap-credit')).to.equal(false);
            });
            console.log('NOT RUN (the landing draws no map: fewer than 10 events on this environment): street layer under the hexagons');
          }
        } else if (has('amap-streets')) {
          test('The street layer is inside the map, under the hexagons', function () {
            expect(at('amap-streets')).to.be.above(at('amap-svg'));
            expect(at('amap-area')).to.be.above(at('amap-streets'));
          });

          test('The street layer holds roads: 50 path commands or more of highway or major road (water alone fails)', function () {
            const from = at('amap-streets');
            const layer = body.slice(from, body.indexOf('</g>', from));
            expect(layer, 'no highway (as-r as-3) or major-road (as-r as-2) path in the street layer').to.match(/<path class="as-r as-[23]" d="M/);
            expect(roadCommands(layer), 'M and L commands in the highway and major-road paths').to.be.at.least(ROAD_FLOOR);
          });

          test('The OpenStreetMap credit shows with the streets', function () {
            expect(has('amap-credit')).to.equal(true);
            // The link opens OpenStreetMap's own page in the page's language
            // (lib/attendee-map.ts, OSM_COPYRIGHT_URL).
            const lang = (/<html lang="([a-z]{2})"/.exec(body) || [])[1];
            expect(body).to.include('href="https://www.openstreetmap.org/copyright/' + lang + '"');
            // Protomaps, which prepares the file, is credited beside it.
            expect(body).to.include('<a href="https://protomaps.com">Protomaps</a>');
          });

          test('No map script, image or tile is loaded from another host', function () {
            // The credit names Protomaps with one link a visitor may tap. That one
            // link is taken out; any other address on a map host fails.
            const rest = body.replace('<a href="https://protomaps.com">Protomaps</a>', '');
            expect(rest).to.not.match(/(src|href)="https?:\/\/[^"]*(tile\.openstreetmap|protomaps|maplibre|mapbox|maptiler|maps\.googleapis\.com\/maps\/api\/js)/i);
          });
        } else {
          test('Without streets the map is hexagons only, with no OpenStreetMap credit', function () {
            expect(has('amap-area')).to.equal(true);
            expect(has('amap-credit')).to.equal(false);
          });

          if (loaded) {
            test('The street layer is drawn (streetMapArchiveLoaded is true for this environment)', function () {
              expect(has('amap-streets'), 'the environment file says the street-map archive is loaded, and the landing drew no street layer').to.equal(true);
            });
          } else {
            console.log('NOT RUN (street-map archive not loaded on this environment: streetMapArchiveLoaded is not true): street layer under the hexagons, OpenStreetMap credit, no third-party host');
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
