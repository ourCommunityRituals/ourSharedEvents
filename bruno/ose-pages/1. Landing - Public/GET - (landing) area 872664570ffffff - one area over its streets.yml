info:
  name: GET /?area=872664570ffffff (landing) - one area over its streets
  type: http
  seq: 27

http:
  method: GET
  url: "{{baseUrl}}/?area=872664570ffffff"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Tap a hexagon to zoom in (MAPPING-COST-STRUCTURE.md, decision 5): one
        // res-7 area over its street map, a dot per place. 872664570ffffff is Mount
        // Greenwood's cell; bruno/fixtures/landing-zip-own-area-seed.sql publishes
        // one event there for this run, so the case does not depend on stock data.
        //
        // The rule under test in both states (location-precision CCR, F41): a dot is
        // drawn only over a street layer. With no street layer the places are a list.
        // The three states are the same as in the landing case before this one, and
        // so is NOT RUN: a test of that name, which passes only while the flag is
        // exactly "false".
        //
        // Roads, not any path (street-map CCR 2026-11-15, R17), by the drawer's own
        // rule and number, as in that case (base-map plan, gap G12): a highway or
        // a major road, and MIN_ROAD_POINTS points of highway, major and minor road
        // in all (lib/street-map.ts, layerShows), counted as the M and L commands
        // of the as-r as-3, as-r as-2 and as-r as-1 paths, one command a point.
        // MIN_ROAD_POINTS is a copy of the drawer's, held equal by name in
        // tests/unit/ci/street-map-staging-cases.test.js. The layer measured as
        // wrong had 8,999 points of water and 1 of road; the sparsest good frame
        // measured had 253 of highway and major road alone (one area over Sawyer,
        // Michigan).
        const body = String(res.getBody());
        const has = function (id) { return body.includes('data-testid="' + id + '"'); };
        const flag = String(bru.getEnvVar('streetMapArchiveLoaded'));
        const loaded = flag === 'true';
        const MIN_ROAD_POINTS = 100;
        const roadPoints = function (layer) {
          const n = { highway: 0, major: 0, minor: 0 };
          const kind = { 3: 'highway', 2: 'major', 1: 'minor' };
          const re = /<path class="as-r as-([123])" d="([^"]*)"/g;
          let m;
          while ((m = re.exec(layer)) !== null) {
            n[kind[m[1]]] += (m[2].match(/[ML]/g) || []).length;
          }
          return n;
        };

        test('Returns 200', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('Opens that one area', function () {
          expect(body).to.include('data-zoom="872664570ffffff"');
          expect(has('amap-back')).to.equal(true);
        });

        test('Lists the event in that area (Mount Greenwood)', function () {
          expect(body).to.include('Zip Own Area Check (Mount Greenwood)');
          expect(has('amap-place-link')).to.equal(true);
        });

        test('Does not list the events of the neighbouring areas', function () {
          expect(body).to.not.include('Zip Own Area Check (Oak Lawn)');
          expect(body).to.not.include('Zip Own Area Check (Evergreen Park)');
        });

        if (has('amap-streets')) {
          test('The dot is drawn over the street layer of that area', function () {
            expect(body).to.include('data-testid="amap-zone" data-cell="872664570ffffff"');
            expect(has('amap-dot')).to.equal(true);
            expect(has('amap-no-tiles')).to.equal(false);
          });

          test('The street layer holds roads by the drawer\'s rule: a highway or major road, and MIN_ROAD_POINTS path commands of road in all (water alone fails)', function () {
            const from = body.indexOf('data-testid="amap-streets"');
            const layer = body.slice(from, body.indexOf('</g>', from));
            const n = roadPoints(layer);
            expect(layer, 'no highway (as-r as-3) or major-road (as-r as-2) path in the street layer').to.match(/<path class="as-r as-[23]" d="M/);
            expect(n.highway + n.major, 'M and L commands in the highway and major-road paths').to.be.above(0);
            expect(n.highway + n.major + n.minor, 'M and L commands in the highway, major-road and minor-road paths').to.be.at.least(MIN_ROAD_POINTS);
          });

          test('The OpenStreetMap credit shows with the streets', function () {
            expect(has('amap-credit')).to.equal(true);
            // The link opens OpenStreetMap's own page in the page's language
            // (lib/attendee-map.ts, OSM_COPYRIGHT_URL).
            const lang = (/<html lang="([a-z]{2})"/.exec(body) || [])[1];
            expect(body).to.include('href="https://www.openstreetmap.org/copyright/' + lang + '"');
            // Protomaps, which prepares the file, is credited beside it.
            expect(body).to.include('<a href="https://protomaps.com">Protomaps</a>');
          });
        } else {
          test('Without streets the places are a list: no dot, no bare hexagon, no credit', function () {
            expect(has('amap-no-tiles')).to.equal(true);
            expect(has('amap-dot')).to.equal(false);
            expect(has('amap-zone')).to.equal(false);
            expect(has('amap-credit')).to.equal(false);
          });

          if (loaded) {
            test('The street layer is drawn (streetMapArchiveLoaded is true for this environment)', function () {
              expect(has('amap-streets'), 'the environment file says the street-map archive is loaded, and the zoomed area drew no street layer').to.equal(true);
            });
          } else {
            test('NOT RUN (street-map archive not loaded on this environment: streetMapArchiveLoaded is not true): dots over the street layer, OpenStreetMap credit', function () {
              expect(flag, 'a NOT RUN test passes only while the environment file sets streetMapArchiveLoaded to "false"').to.equal('false');
            });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
