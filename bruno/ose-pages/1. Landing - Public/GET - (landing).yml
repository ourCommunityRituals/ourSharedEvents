info:
  name: GET / (landing)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Returns 200', function() {

        \    expect(res.getStatus()).to.equal(200);

        });

        

        test('Content-Type is HTML', function() {

        \    expect(res.getHeader('Content-Type')).to.include('text/html');

        });

        

        test('Has <!DOCTYPE html>', function() {

        \    expect((typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()))).to.include('<!DOCTYPE html>');

        });

        

        test('Has lang attribute', function() {

        \    expect(String(res.getBody())).to.match(/lang=[\"']en/);

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
