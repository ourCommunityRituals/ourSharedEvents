info:
  name: GET /events?q=<59 letters + emoji> - answers 200
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/events?q=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa%F0%9F%98%80"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // CCR 2026-11-07 L3-03: the search is cut to 60 characters. A cut through an
        // emoji left half a surrogate pair, encodeURIComponent threw, and the page
        // answered 500. The cap now counts code points.
        const body = String(res.getBody());
        test('Returns 200', function () { expect(res.getStatus()).to.equal(200); });
        test('Shows the search box', function () { expect(body).to.include('data-testid="disc-q"'); });
        test('Is not the error page', function () { expect(body).to.not.include('data-testid="public-error"'); });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
