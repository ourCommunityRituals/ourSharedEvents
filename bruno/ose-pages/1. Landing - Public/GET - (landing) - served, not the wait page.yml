info:
  name: GET / (landing) - served, not the wait page (OSE-1986)
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The landing and the event list are limited per caller (OSE-1986, OSE
        // ADR-038): 600 loads a minute, then an HTML 429 "wait" page in the
        // reader's language. This run is far under that, so staging must serve
        // the page itself, with no trace of the limit on it.
        //
        // What this pins on staging is the other half of the workers-pool tests
        // (tests/landing-read-limit.spec.ts): a request that is served is the
        // page it was before the limit existed. The refusal itself is not
        // provoked here: 600 loads a minute against staging from CI would be a
        // flood of our own making.
        const body = String(res.getBody());

        test('Returns 200, not the 429 wait page', function () {
          expect(res.getStatus()).to.equal(200);
        });
        test('It is the landing', function () {
          expect(body).to.include('data-surface="ose-landing"');
        });
        test('It is not the wait page', function () {
          expect(body).to.not.include('data-surface="ose-error"');
          expect(body).to.not.include('Too many visits at once');
        });
        test('A served page carries no Retry-After', function () {
          expect(!res.getHeader('retry-after')).to.equal(true);
        });
        test('No cookie is set', function () {
          expect(!res.getHeader('set-cookie')).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
