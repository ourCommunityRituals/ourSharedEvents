info:
  name: GET /events?q=Evergreen Park - lists its own event only
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/events?q=Evergreen%20Park"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        // Owner 2026-11-05: the /events search box takes a town (the owner's list,
        // lib/place-names.ts) or a zip, and lists that place's events.
        // Evergreen Park is 60805; the fixture's Evergreen Park event has no address and its nearest zip center is 60805.
        // Fixture: bruno/fixtures/landing-zip-own-area-seed.sql (published for this run only).
        const body = String(res.getBody());
        test('Returns 200', function () { expect(res.getStatus()).to.equal(200); });
        test('Heads the list with the place', function () { expect(body).to.include('Events in Evergreen Park'); });
        test('Does not list the Mount Greenwood event', function () { expect(body).to.not.include('Zip Own Area Check (Mount Greenwood)'); });
        test('Does not list the Oak Lawn event', function () { expect(body).to.not.include('Zip Own Area Check (Oak Lawn)'); });
        test('Lists the Evergreen Park event', function () { expect(body).to.include('Zip Own Area Check (Evergreen Park)'); });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
