info:
  name: OSE-R-005 | API | GET /admin (authed) | events table ID column is .col-internal-id (hidden by default) and toggle is rendered
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: text/html
    - name: Authorization
      value: Bearer {{adminBearer}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-338 reality: same CF-Access shadowing as OSE-R-005#1. Worker assertions fire only

        // when status === 200 + dashboard markup is present. Full vitest catch lives in

        // admin-friendly-labels.spec.ts; this is contract smoke only.

        test('Reached admin dashboard OR blocked at edge', function() {

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());

        });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        if (res.getStatus() === 200 && body.includes('data-testid=\"admin-main\"')) {

        \    test('ID column header carries .col-internal-id class', function() {

        \        expect(body).to.include('<th class=\\\"col-internal-id\\\">ID</th>');

        \    });

        \    test('ID cell template carries .col-internal-id class', function() {

        \        expect(body).to.include('<td class=\\\"col-internal-id\\\" data-testid=\\\"event-id\\\">');

        \    });

        \    test('Show internal IDs toggle is rendered', function() {

        \        expect(body).to.include('data-testid=\\\"show-internal-ids-toggle\\\"');

        \    });

        \    test('CSS hides .col-internal-id by default', function() {

        \        expect(body).to.include('table.events-table .col-internal-id { display: none; }');

        \    });

        \    test('Events table header column reads \\\"Event type\\\" not \\\"Phase\\\"', function() {

        \        expect(body).to.include('<th>Event type</th>');

        \        expect(body).to.not.include('<th>Phase</th>');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
