info:
  name: OSE-R-005 | API | GET /admin (authed) | create-event toast uses friendly copy (no internal id leak)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: text/html
    - name: Authorization
      value: Bearer {{adminBearer}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-338 reality: same CF-Access shadowing. Worker toast assertions fire only when\r

        // dashboard is actually rendered. Full vitest catch lives in admin-friendly-labels.spec.ts.\r

        test('Reached admin dashboard OR blocked at edge', function() {\r

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());\r

        });\r

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));\r

        if (res.getStatus() === 200 && body.includes('data-testid=\"admin-main\"')) {\r

        \    test('Friendly toast wired', function() {\r

        \        expect(body).to.include(\"msg.textContent = 'Event created.'\");\r

        \        expect(body).to.include('msg.dataset.eventId = String(data.id)');\r

        \    });\r

        \    test('Pre-fix toast pattern absent', function() {\r

        \        expect(body).to.not.match(/msg\\.textContent\\s*=\\s*['\\\"]Event created\\s*\\\\u2014/);\r

        \    });\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
