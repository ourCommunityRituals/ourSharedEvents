info:
  name: OSE-R-005 | API | GET /admin (authed) | rendered HTML embeds TIER_LABELS + PHASE_LABELS maps
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin"
  headers:
    - name: Accept
      value: text/html
    - name: Authorization
      value: Bearer {{adminBearer}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// OSE-338 reality update: on CF-Access-gated environments (staging/prod), CF Access

        // intercepts /admin before the worker sees the Authorization: Bearer header. CF Access

        // only honors its own JWT cookies / service tokens. The full label-regression catch

        // for this audit gap lives in workers/oursharedevents/tests/admin-friendly-labels.spec.ts

        // (vitest, runs in the test pool with direct worker access). This Postman test is the

        // contract smoke layer; on CF-Access environments without a service token, it accepts

        // 'blocked' as a passing state and only enforces the label contract when the worker is

        // actually reached (status === 200). Follow-on: OSE-339 configures CF Access service

        // tokens so staging contract testing recovers full rigor.

        test('Reached admin dashboard OR blocked at edge', function() {

        \    expect([200, 302, 401, 403]).to.include(res.getStatus());

        });

        const body = (typeof res.getBody()==='string'?res.getBody():JSON.stringify(res.getBody()));

        if (res.getStatus() === 200 && body.includes('data-testid=\"admin-main\"')) {

        \    test('TIER_LABELS map embedded with Free / Pro / Enterprise plan strings', function() {

        \        expect(body).to.match(/TIER_LABELS\\s*=\\s*\\{/);

        \        expect(body).to.match(/free\\s*:\\s*['\\\"]Free plan['\\\"]/);

        \        expect(body).to.match(/mid\\s*:\\s*['\\\"]Pro plan['\\\"]/);

        \        expect(body).to.match(/enterprise\\s*:\\s*['\\\"]Enterprise plan['\\\"]/);

        \    });

        \    test('PHASE_LABELS map embedded for all 5 phases', function() {

        \        expect(body).to.match(/PHASE_LABELS\\s*=\\s*\\{/);

        \        expect(body).to.include('Community events');

        \        expect(body).to.include('Commerce events');

        \        expect(body).to.include('Licensed activities');

        \        expect(body).to.include('Health events');

        \        expect(body).to.include('Youth events');

        \    });

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
