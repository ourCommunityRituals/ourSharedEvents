# @ocr/flags (packages/flags) — typecheck + Vitest suite
#
# WHY: until this workflow, no job ran the packages/flags suite. The only
# workflow that touched the package (advanced-security-scan.yml) installs its
# devDeps for SBOM generation and never runs a test. So tests/postgres.test.ts
# called `db.public.types.timestamp` — not a pg-mem 3.x API — and nothing went
# red until PR #714 fixed it by hand (DataType.timestamp). The package also
# carried a `tsc --noEmit` error (evaluator.ts, exactOptionalPropertyTypes)
# that no job ever saw.
#
# LOCKFILE: packages/flags/package-lock.json pins the devDeps (pg-mem,
# typescript, vitest, better-sqlite3) so a caret range cannot drift silently
# between runs; `npm ci` fails if package.json and the lock disagree.
#
# NATIVE BUILD: better-sqlite3 ^11 needs a prebuilt binary or node-gyp. Node 20
# on ubuntu-24.04 gets a prebuild, and the image ships build-essential + python3
# for the fallback.
#
# BRAIN CONTRACT: tests/invariants.test.ts reads
# REPO_ROOT/OCR-docs/ocr-docs-brain/flags-contract.yaml, so the private OCR-docs
# repo is checked out at ./OCR-docs (ref: main — live-read, same as
# brain-contract-check.yml and inv22-cross-repo-gate.yml) with the org secret
# OCR_HUB_READ (read-only). persist-credentials: false keeps that token out of
# .git/config before `npm ci` runs package scripts.
#
# DEPENDABOT: dependabot runs skip the brain checkout (it uses OCR_HUB_READ). They are
# exactly the runs that bump these devDeps, so the job still typechecks and
# runs the four adapter suites (memory, sqlite, d1, postgres). Only the
# contract-dependent checks are skipped (invariants.test.ts, check:generated,
# test:level0), with a notice. Everything runs on every human PR and on the
# push to main.
#
# NOT-SKIPPED GUARD: a green run that executed nothing is not coverage. The
# last step reads Vitest's JSON report and fails unless every tests/*.test.ts
# file that was meant to run did run, at least one test passed, and nothing was
# skipped, todo'd or failed.
#
# LINT (OSE-1461): the root eslint config ignores **/*.ts, so this package
# carries its own (packages/flags/eslint.config.mjs, type-aware
# typescript-eslint for .ts, Node globals for .mjs) and CI runs `npm run lint`
# (`eslint . --max-warnings 0`) over the whole package. It is not
# in the lint-staged hook: the hook runs the root eslint, which has no
# typescript-eslint, and this job is the gate.
name: '@ocr/flags CI'

on:
  push:
    branches: [main]
    paths:
      - 'packages/flags/**'
      - '.github/workflows/flags-package-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'packages/flags/**'
      - '.github/workflows/flags-package-ci.yml'
  workflow_dispatch:

concurrency:
  group: flags-package-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  flags-tests:
    name: '@ocr/flags typecheck + tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7

      - name: Checkout OCR-docs brain (flags-contract.yaml)
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          path: OCR-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ }}
          persist-credentials: false

      # OSE-1466 0.1, run time: the steps below run PR code, so prove the
      # checkout above left no credential on disk.
      - name: 'No token left behind by the brain checkout'
        if: github.actor != 'dependabot[bot]'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/assert-no-persisted-token.sh OCR-docs

      - name: Verify brain contract is present
        if: github.actor != 'dependabot[bot]'
        run: |
          test -f OCR-docs/ocr-docs-brain/flags-contract.yaml \
            || { echo "::error::OCR-docs/ocr-docs-brain/flags-contract.yaml missing after checkout — invariants.test.ts cannot run"; exit 1; }

      - name: Dependabot notice (contract checks skipped — no cross-repo token)
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "::notice::Dependabot run: the OCR_HUB_READ brain checkout is skipped, so the OCR-docs brain"
          echo "contract is not checked out. Running the adapter suites (memory, sqlite, d1,"
          echo "postgres) and skipping invariants.test.ts, check:generated and test:level0, which"
          echo "need the brain contract. Everything runs on every human PR and on the push to main."

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/flags/package-lock.json

      - name: Install dependencies (locked)
        working-directory: packages/flags
        run: npm ci --no-audit --no-fund

      # src AND tests (tsconfig.tests.json). The package tsconfig excludes
      # tests/, which is how postgres.test.ts's `db.public.types` (TS2339 on
      # pg-mem 3.x) shipped: a tests typecheck rejects it at compile time.
      - name: Typecheck src + tests (tsc --noEmit)
        working-directory: packages/flags
        run: npm run typecheck

      # eslint prints nothing on success, so the step also proves what it
      # linted: zero .ts or zero .mjs files is a lint that covered nothing.
      - name: Lint whole package (eslint; type-aware for .ts)
        working-directory: packages/flags
        run: |
          npm run lint
          npx eslint . --format json --output-file eslint-results.json
          node -e '
            const r = require("./eslint-results.json");
            const count = (ext) => r.filter((f) => f.filePath.endsWith(ext)).length;
            const ts = count(".ts"), mjs = count(".mjs");
            console.log(`eslint linted ${ts} .ts + ${mjs} .mjs files, ${r.reduce((n, f) => n + f.errorCount, 0)} errors`);
            if (ts === 0 || mjs === 0) { console.log("::error::eslint linted zero .ts or zero .mjs files"); process.exit(1); }
          '

      # Byte-compares src/generated/*.ts against the generator's output for the
      # brain contract. Catches contract drift AND hand/prettier edits to the
      # generated files (packages/flags/src/generated/ is in .prettierignore).
      - name: Generated modules match the brain contract (check:generated)
        if: github.actor != 'dependabot[bot]'
        working-directory: packages/flags
        run: npm run check:generated

      - name: Set up Python
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Level 0 security gate: secret/PII/forbidden-URL scans, contract SHA
      # parity, parameterized-SQL-only adapters, type-only workers-types
      # imports, every adapter has a spec-running test, pragma audit.
      # PyYAML backs the yaml_syntax check. Without it the check used to report
      # PASS while parsing nothing; level0 now fails closed on that SKIP.
      - name: Level 0 security gate (test:level0)
        if: github.actor != 'dependabot[bot]'
        working-directory: packages/flags
        run: |
          python3 -m pip install pyyaml
          python3 -c 'import yaml' || { echo "::error::pyyaml missing from the python3 env"; exit 1; }
          npm run test:level0

      - name: Run Vitest suite
        working-directory: packages/flags
        run: |
          EXCLUDE=()
          if [ "$IS_DEPENDABOT" = "true" ]; then
            EXCLUDE=(--exclude tests/invariants.test.ts)
          fi
          npx vitest run "${EXCLUDE[@]}" \
            --reporter=verbose \
            --reporter=json --outputFile.json=vitest-results.json

      - name: Assert the suite actually executed (no skipped files or tests)
        if: always()
        working-directory: packages/flags
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, readdirSync, existsSync } from 'node:fs';
          import { basename } from 'node:path';

          if (!existsSync('vitest-results.json')) {
            console.log('::error::vitest-results.json missing — the suite did not run');
            process.exit(1);
          }
          const r = JSON.parse(readFileSync('vitest-results.json', 'utf8'));
          const excluded = process.env.IS_DEPENDABOT === 'true' ? ['invariants.test.ts'] : [];
          const expected = readdirSync('tests')
            .filter((f) => f.endsWith('.test.ts') && !excluded.includes(f))
            .sort();
          const ran = r.testResults.map((t) => basename(t.name)).sort();

          const problems = [];
          const missing = expected.filter((f) => !ran.includes(f));
          if (missing.length) problems.push(`test files that did not run: ${missing.join(', ')}`);
          if (r.numTotalTestSuites === 0 || r.numPassedTests === 0) problems.push('zero tests passed');
          if (r.numPendingTests || r.numTodoTests) problems.push(`skipped=${r.numPendingTests} todo=${r.numTodoTests}`);
          if (r.numFailedTests) problems.push(`failed=${r.numFailedTests}`);

          console.log(`files ran: ${ran.length}/${expected.length} (${ran.join(', ')})`);
          console.log(`tests: total=${r.numTotalTests} passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${r.numPendingTests} todo=${r.numTodoTests}`);
          if (problems.length) {
            for (const p of problems) console.log(`::error::@ocr/flags suite: ${p}`);
            process.exit(1);
          }
          EOF
