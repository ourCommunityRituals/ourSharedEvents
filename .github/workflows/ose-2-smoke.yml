# OurSharedEvents — Part 2: Quality Smoke
#
# Auto-triggers when Part 1 (Deploy) completes successfully.
# Also runs on nightly schedule and manual dispatch.
#
# Tests security + IAC against the live staging deployment.
# This is the closing bookend: validates live what Part 1 validated statically.
#
# Part 3 (Functional) is manual-only — this workflow completing does NOT trigger it.

name: OurSharedEvents Smoke

on:
  workflow_run:
    workflows: ["OurSharedEvents Deploy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7 3 * * *'  # Nightly 3:07 AM UTC
  workflow_dispatch: {}

concurrency:
  group: ose-smoke-${{ github.ref || 'nightly' }}
  cancel-in-progress: true

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'

jobs:
  # ============================================================================
  # Quality Smoke → Staging
  # ============================================================================
  quality-smoke-staging:
    name: 'Quality Smoke → Staging'
    runs-on: ubuntu-latest
    # On workflow_run: only run if the triggering workflow succeeded
    # On schedule/dispatch: always run
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 'Security smoke: XSS, injection, auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + public endpoint verification'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Fail if smoke failed
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Quality smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## OurSharedEvents Quality Smoke – Staging" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Smoke | \`${{ steps.security-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| IAC Health     | \`${{ steps.iac-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $STG_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Quality Smoke → Production (tag runs only)
  # ============================================================================
  quality-smoke-production:
    name: 'Quality Smoke → Production'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 'Security smoke: XSS, injection, auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + public endpoint verification'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 30

      - name: Fail if smoke failed
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Production quality smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1
