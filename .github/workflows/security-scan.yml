# CodeQL Security Analysis (Story 1/4)
#
# Primary security workflow per ci-cd-architecture.md.
#
# This is the CANONICAL security-scan.yml - the only active security workflow.
# All other security configurations have been archived.
#
# Purpose: Security scanning for all code changes and periodic deep scans.
#
# When this runs:
#   - Push to main or claude/* branches
#   - Pull requests targeting main
#   - Weekly (Sundays 00:00 UTC) - deep vulnerability discovery
#   - Manual trigger - for security audits
#
# Story 1: Validate & Align GitHub Workflows
#   - This workflow is one of only 3 active workflows
#   - Runs on push/PR as documented in ci-cd-architecture.md
#
# Story 4: Security Scanning
#   - CodeQL security scan is a required release gate
#   - Critical and high severity findings block merges
#
# @see docs/ci-cd-architecture.md - Security scan documentation
name: CodeQL Security Analysis

on:
  push:
    # Trigger on ALL branches - any code touching the repo gets scanned
    branches:
      - '**'
    paths:
      - '**.js'
      - '**.ts'
      - '**.jsx'
      - '**.tsx'
      - '**.json'
      - '**.html'
      - '**.gs'
      - '**.mjs'
      - '**.cjs'
      - '**.sh'
      - '**.env*'
      - 'workers/**'
  pull_request:
    # Scan all PRs regardless of target branch
    branches:
      - '**'
  schedule:
    # Run weekly on Sundays at 00:00 UTC for vulnerability discovery
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger for security audits
    inputs:
      skip_cache:
        description: 'Skip cache for fresh analysis'
        required: false
        default: 'false'
        type: boolean

# Environment configuration
env:
  # Security scan policy - CRITICAL and HIGH findings block merges
  FAIL_ON_SEVERITY: 'critical,high'

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # CODEQL SECURITY SCAN
  # ============================================================================
  # Primary security gate using GitHub's CodeQL analysis.
  # This is a REQUIRED CHECK - configure in branch protection rules.
  # ============================================================================
  analyze:
    name: 🔒 CodeQL Security Scan
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write
      # Required for CodeQL to upload SARIF results
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby'
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@v2
      continue-on-error: true  # Must not block CodeQL if harden-runner itself fails
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Display security scan configuration
      run: |
        echo "=============================================="
        echo "CODEQL SECURITY SCAN (Story 1/4)"
        echo "=============================================="
        echo ""
        echo "Primary security workflow per ci-cd-architecture.md"
        echo "This scan is a REQUIRED CHECK for branch protection."
        echo ""
        echo "Trigger: ${{ github.event_name }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "Policy: $FAIL_ON_SEVERITY severity findings block merge"
        echo "=============================================="

    - name: Initialize CodeQL
      id: codeql-init
      uses: github/codeql-action/init@v4
      # Continue on error - Advanced Security may not be enabled
      continue-on-error: true
      with:
        languages: ${{ matrix.language }}
        # Custom config with technology-specific queries for our full stack:
        # Cloudflare Workers, D1, Firebase, React, HTML, CI/CD, Playwright,
        # Postman/Newman, Wrangler — plus security-extended + security-and-quality
        config-file: .github/codeql/codeql-config.yml
        # Extended security queries (also in config, but explicit here as fallback)
        queries: +security-extended,security-and-quality,.github/codeql/custom-queries

    - name: Setup Node.js (for dependency analysis)
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        echo "Installing dependencies for better analysis..."
        npm ci || npm install

    - name: Perform CodeQL Analysis
      id: codeql-analyze
      uses: github/codeql-action/analyze@v4
      # Continue on error - Advanced Security may not be enabled on all repos
      continue-on-error: true
      with:
        category: "/language:${{matrix.language}}"
        # Upload SARIF results to GitHub Security tab
        upload: true
        # Output results for summary generation
        output: codeql-results

    # Note: CodeQL analyze action will fail if Advanced Security is not enabled
    # The workflow continues so npm audit can still run
    # To enable: Settings > Security > Code security and analysis > Advanced Security

    - name: Scan CI/CD workflows for script injection
      if: always()
      run: |
        echo "=================================================="
        echo "CI/CD SCRIPT INJECTION CHECK"
        echo "=================================================="
        echo ""
        echo "Checking GitHub Actions workflows for unsafe \${{ }} expressions in run: blocks..."
        echo ""

        FOUND_INJECTION=false

        # Dangerous contexts that can be controlled by external actors
        DANGEROUS_PATTERNS=(
          "github.event.pull_request.title"
          "github.event.pull_request.body"
          "github.event.issue.title"
          "github.event.issue.body"
          "github.event.comment.body"
          "github.event.review.body"
          "github.event.discussion.title"
          "github.event.discussion.body"
          "github.head_ref"
        )

        for pattern in "${DANGEROUS_PATTERNS[@]}"; do
          # Search for the pattern inside run: blocks in workflow files
          MATCHES=$(grep -rn "\${{.*${pattern}.*}}" .github/workflows/*.yml 2>/dev/null | grep -v "env:" | grep -v "#" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Potential script injection: \${{ $pattern }}"
            echo "$MATCHES"
            echo ""
            FOUND_INJECTION=true
          fi
        done

        if [ "$FOUND_INJECTION" = "true" ]; then
          echo "=================================================="
          echo "❌ CI/CD SCRIPT INJECTION RISK DETECTED"
          echo "=================================================="
          echo "Move dangerous expressions to env: blocks instead of using them in run: directly."
          echo ""
          echo "UNSAFE:  run: echo \"\${{ github.event.pull_request.title }}\""
          echo "SAFE:    env:"
          echo "           PR_TITLE: \${{ github.event.pull_request.title }}"
          echo "         run: echo \"\$PR_TITLE\""
          # Warning only — not blocking since some uses may be safe
        else
          echo "✅ No CI/CD script injection patterns detected"
        fi

    - name: Scan wrangler.toml for security misconfigurations
      if: always()
      run: |
        echo "=================================================="
        echo "WRANGLER CONFIGURATION SECURITY CHECK"
        echo "=================================================="
        echo ""

        FOUND_ISSUES=false

        # Check for debug endpoints enabled in production configs
        for toml_file in $(find . -name "wrangler.toml" -not -path "*/node_modules/*"); do
          echo "Checking $toml_file..."

          # Debug endpoints in production
          if grep -n 'ENABLE_DEBUG_ENDPOINTS.*=.*"true"' "$toml_file" 2>/dev/null | grep -i "prod"; then
            echo "❌ $toml_file: Debug endpoints enabled in production config!"
            FOUND_ISSUES=true
          fi

          # Hardcoded secrets (not just variable names)
          if grep -nE '^\s*(ADMIN_TOKEN|HMAC_SECRET|PRIVATE_KEY)\s*=\s*"[^"]+"' "$toml_file" 2>/dev/null; then
            echo "❌ $toml_file: Hardcoded secret value detected!"
            FOUND_ISSUES=true
          fi

          # Overly permissive compatibility flags
          if grep -n 'nodejs_compat_v2' "$toml_file" 2>/dev/null; then
            echo "⚠️ $toml_file: nodejs_compat_v2 flag — verify this is intentional"
          fi
        done

        echo ""
        if [ "$FOUND_ISSUES" = "true" ]; then
          echo "❌ Wrangler security issues found — review above"
        else
          echo "✅ No wrangler security misconfigurations detected"
        fi

    - name: Create analysis summary
      if: always()
      run: |
        echo "## 🔒 CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if CodeQL analysis succeeded
        if [ "${{ steps.codeql-analyze.outcome }}" == "failure" ]; then
          echo "### ⚠️ CodeQL Analysis Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CodeQL analysis could not complete. This typically means:" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Advanced Security is not enabled on this repository" >> $GITHUB_STEP_SUMMARY
          echo "- To enable: Settings > Security > Code security and analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**npm audit will still run below for dependency scanning.**" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ CodeQL Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine scan type for better context
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Regular security audit for vulnerability discovery." >> $GITHUB_STEP_SUMMARY
          else
            echo "Security scan for code changes." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Language Analyzed" >> $GITHUB_STEP_SUMMARY
          echo "- **JavaScript** (includes .js, .gs, .html files)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Query Packs Used" >> $GITHUB_STEP_SUMMARY
          echo "- **security-extended**: Extended security queries" >> $GITHUB_STEP_SUMMARY
          echo "- **security-and-quality**: Security and code quality queries" >> $GITHUB_STEP_SUMMARY
          echo "- **security-experimental**: Experimental security queries" >> $GITHUB_STEP_SUMMARY
          echo "- **custom-queries**: Stack-specific security queries" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note:** This workflow runs on all branches per ci-cd-architecture.md" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Technology Coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Technology | Custom Query | What It Detects |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|-------------|-----------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Cloudflare Workers | cloudflare-workers.ql | Unsafe body parsing without try/catch |" >> $GITHUB_STEP_SUMMARY
        echo "| Cloudflare Workers | cloudflare-cors-wildcard.ql | Permissive CORS origins |" >> $GITHUB_STEP_SUMMARY
        echo "| Cloudflare Workers | cloudflare-timing-safe.ql | Non-timing-safe token comparison |" >> $GITHUB_STEP_SUMMARY
        echo "| Cloudflare Workers | cloudflare-insecure-random.ql | Math.random() for security |" >> $GITHUB_STEP_SUMMARY
        echo "| Cloudflare Workers | cloudflare-debug-endpoints.ql | Debug endpoints in production |" >> $GITHUB_STEP_SUMMARY
        echo "| D1 Database | d1-sql-injection.ql | SQL injection via string concat |" >> $GITHUB_STEP_SUMMARY
        echo "| Firebase Auth | firebase-auth-bypass.ql | Client-only auth without server verify |" >> $GITHUB_STEP_SUMMARY
        echo "| React | react-dangerouslysetinnerhtml.ql | Unsanitized dangerouslySetInnerHTML |" >> $GITHUB_STEP_SUMMARY
        echo "| HTML Surfaces | html-innerhtml-xss.ql | innerHTML with dynamic content |" >> $GITHUB_STEP_SUMMARY
        echo "| Wrangler | wrangler-secrets-exposure.ql | Secrets logged to console |" >> $GITHUB_STEP_SUMMARY
        echo "| CI/CD | cicd-script-injection step | GitHub Actions \${{ }} injection |" >> $GITHUB_STEP_SUMMARY
        echo "| Playwright | playwright-credential-exposure.ql | Hardcoded creds in tests |" >> $GITHUB_STEP_SUMMARY
        echo "| Postman | postman-hardcoded-secrets.ql | Real secrets in collections |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Built-in Security Checks (200+ patterns)" >> $GITHUB_STEP_SUMMARY
        echo "- SQL Injection, XSS, Command Injection, Path Traversal" >> $GITHUB_STEP_SUMMARY
        echo "- Insecure Randomness, Hardcoded Credentials, Prototype Pollution" >> $GITHUB_STEP_SUMMARY
        echo "- Regular Expression DoS (ReDoS), SSRF, Open Redirect" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Results" >> $GITHUB_STEP_SUMMARY
        echo "Check the **Security** tab to view detailed findings." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPENDENCY AUDIT (npm audit)
  # ============================================================================
  # Checks for known vulnerabilities in npm dependencies.
  # Runs alongside CodeQL for comprehensive security coverage.
  # ============================================================================
  dependency-audit:
    name: 🔍 Dependency Vulnerability Audit
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      id: npm-audit
      run: |
        echo "=============================================="
        echo "NPM DEPENDENCY AUDIT (Story 1/4)"
        echo "=============================================="
        echo ""
        echo "Dependency vulnerability audit per ci-cd-architecture.md"
        echo "High and critical vulnerabilities block merges."
        echo ""

        # Create audit report directory
        mkdir -p .security-reports

        # Run audit and capture output in JSON format for processing
        set +e
        npm audit --json > .security-reports/npm-audit.json 2>&1
        AUDIT_EXIT_CODE=$?

        # Also get human-readable output
        AUDIT_OUTPUT=$(npm audit --audit-level=high 2>&1)
        set -e

        echo "$AUDIT_OUTPUT"
        echo ""

        # Parse vulnerability counts from JSON
        if [ -f .security-reports/npm-audit.json ]; then
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          LOW=$(jq '.metadata.vulnerabilities.low // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
        else
          CRITICAL=0
          HIGH=0
          MODERATE=0
          LOW=0
          TOTAL=0
        fi

        echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high_count=$HIGH" >> $GITHUB_OUTPUT
        echo "moderate_count=$MODERATE" >> $GITHUB_OUTPUT
        echo "low_count=$LOW" >> $GITHUB_OUTPUT
        echo "total_count=$TOTAL" >> $GITHUB_OUTPUT

        # Determine if we should fail
        BLOCKING_COUNT=$((CRITICAL + HIGH))

        if [ "$BLOCKING_COUNT" -gt 0 ]; then
          echo ""
          echo "=============================================="
          echo "❌ BLOCKING VULNERABILITIES FOUND"
          echo "=============================================="
          echo "Critical: $CRITICAL"
          echo "High: $HIGH"
          echo ""
          echo "These must be resolved before merging."
          echo "See docs/SECURITY.md for remediation guidance."
          echo "=============================================="
          echo "audit_status=failed" >> $GITHUB_OUTPUT
          # Story 2.4: High severity vulnerabilities result in non-passing status
          exit 1
        else
          echo ""
          echo "✅ No high or critical vulnerabilities found"
          echo "audit_status=pass" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -gt 0 ]; then
            echo ""
            echo "Note: Found $MODERATE moderate and $LOW low severity issues."
            echo "These don't block merging but should be addressed."
          fi
          exit 0
        fi

    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dependency-audit-report
        path: .security-reports/
        retention-days: 30

    - name: Create audit summary
      if: always()
      run: |
        echo "## 🔍 Dependency Vulnerability Audit - Deep Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        AUDIT_STATUS="${{ steps.npm-audit.outputs.audit_status }}"
        CRITICAL="${{ steps.npm-audit.outputs.critical_count }}"
        HIGH="${{ steps.npm-audit.outputs.high_count }}"
        MODERATE="${{ steps.npm-audit.outputs.moderate_count }}"
        LOW="${{ steps.npm-audit.outputs.low_count }}"
        TOTAL="${{ steps.npm-audit.outputs.total_count }}"

        if [ "$AUDIT_STATUS" == "pass" ]; then
          echo "### ✅ No Blocking Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All dependencies are clear of high and critical severity issues." >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ BLOCKING: Vulnerabilities Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "High or critical vulnerabilities found. **Merge is blocked.**" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Severity | Count | Blocks Merge? |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|---------------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🔴 Critical | $CRITICAL | Yes |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟠 High | $HIGH | Yes |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟡 Moderate | $MODERATE | No |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟢 Low | $LOW | No |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total** | **$TOTAL** | |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Remediation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "If vulnerabilities were found:" >> $GITHUB_STEP_SUMMARY
        echo "1. Run \`npm audit\` locally to see details" >> $GITHUB_STEP_SUMMARY
        echo "2. Run \`npm audit fix\` to auto-fix compatible updates" >> $GITHUB_STEP_SUMMARY
        echo "3. See [docs/SECURITY.md](../docs/SECURITY.md) for manual fixes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Story 1**: This is the canonical security-scan.yml per ci-cd-architecture.md" >> $GITHUB_STEP_SUMMARY
        echo "**Artifact**: \`dependency-audit-report\` contains detailed JSON report." >> $GITHUB_STEP_SUMMARY
