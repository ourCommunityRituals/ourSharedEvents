# CodeQL Security Analysis
#
# Secondary security workflow per ci-cd-architecture.md.
#
# CodeQL itself now lives in `.github/workflows/codeql.yml` — the single
# source of truth for SARIF generation + upload. This workflow keeps the
# bespoke scanners that don't require CodeQL:
#
#   - CI/CD script-injection pattern scanner (grep-based)
#   - wrangler.toml misconfiguration scanner (grep-based)
#   - npm dependency audit (npm audit in dependency-audit job)
#
# Collapsing to a single CodeQL surface (codeql.yml) avoids SARIF category
# collisions and duplicate uploads to the same language category.
#
# When this runs:
#   - Push to main or claude/* branches
#   - Pull requests targeting main
#   - Weekly (Sundays 00:00 UTC) - deep vulnerability discovery
#   - Manual trigger - for security audits
#
# Gate behavior:
#   - Critical and high severity findings block merges
#   - Runs on push/PR as documented in ci-cd-architecture.md
#
# Workflow name (`CodeQL Security Analysis`) and job name (`analyze`) are
# preserved so existing branch-protection rules and the security-triage
# workflow_run trigger continue to match without manual reconfiguration.
#
# @see docs/ci-cd-architecture.md - Security scan documentation
# @see .github/workflows/codeql.yml - canonical CodeQL SARIF source
name: CodeQL Security Analysis

on:
  push:
    # Trigger on ALL branches, every push — no paths filter per security-unconditional rule.
    # (S0 Security must run unconditionally; paths filters only on Gate/Deploy/Smoke.)
    branches:
      - '**'
  pull_request:
    # Scan all PRs regardless of target branch
    branches:
      - '**'
  schedule:
    # Run weekly on Sundays at 00:00 UTC for vulnerability discovery
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger for security audits
    inputs:
      skip_cache:
        description: 'Skip cache for fresh analysis'
        required: false
        default: 'false'
        type: boolean

# Sweep 9 #4 (2026-05-14): cancel superseded runs.
# This workflow triggers on EVERY branch + EVERY PR with no paths filter
# (per security-unconditional doctrine). Without concurrency cancel, a
# rapid push storm to a single branch would queue N analyses on the
# 3-runner pool. Group by PR number when available, else by ref, so
# distinct branches don't interfere with each other.
concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Environment configuration
env:
  # Security scan policy - CRITICAL and HIGH findings block merges
  FAIL_ON_SEVERITY: 'critical,high'

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # BESPOKE SECURITY SCANNERS
  # ============================================================================
  # Custom scanners that don't require CodeQL: CI/CD script-injection patterns
  # and wrangler.toml misconfig detection. CodeQL SARIF generation itself lives
  # in codeql.yml — see header comment for rationale.
  #
  # Job name (`analyze`) preserved so existing branch-protection rules and the
  # security-triage workflow_run trigger continue to match.
  # ============================================================================
  analyze:
    name: 🔒 Security Config Audit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@v2
      continue-on-error: true  # Must not block audit if harden-runner itself fails
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        clean: false

    - name: Display security scan configuration
      run: |
        echo "=============================================="
        echo "SECURITY CONFIG AUDIT"
        echo "=============================================="
        echo ""
        echo "Scanners in this job: CI/CD script-injection, wrangler.toml misconfig."
        echo "CodeQL SARIF generation is in codeql.yml (single source of truth)."
        echo ""
        echo "Trigger: ${{ github.event_name }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "Policy: $FAIL_ON_SEVERITY severity findings block merge"
        echo "=============================================="

    - name: Scan CI/CD workflows for script injection
      if: always()
      run: |
        echo "=================================================="
        echo "CI/CD SCRIPT INJECTION CHECK"
        echo "=================================================="
        echo ""
        # GitHub parses any dollar-double-brace in a workflow file as an expression,
        # even escaped for the shell, so an empty one made the whole file invalid
        # (every run failed with 0 jobs from 2026-04). Build the text at runtime.
        O='$''{{'
        echo "Checking GitHub Actions workflows for unsafe ${O} }} expressions in run: blocks..."
        echo ""

        FOUND_INJECTION=false

        # Dangerous contexts that can be controlled by external actors
        DANGEROUS_PATTERNS=(
          "github.event.pull_request.title"
          "github.event.pull_request.body"
          "github.event.issue.title"
          "github.event.issue.body"
          "github.event.comment.body"
          "github.event.review.body"
          "github.event.discussion.title"
          "github.event.discussion.body"
          "github.head_ref"
        )

        for pattern in "${DANGEROUS_PATTERNS[@]}"; do
          # Search for the pattern inside run: blocks in workflow files
          MATCHES=$(grep -rn "${O}.*${pattern}.*}}" .github/workflows/*.yml 2>/dev/null | grep -v "env:" | grep -v "#" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Potential script injection: ${O} $pattern }}"
            echo "$MATCHES"
            echo ""
            FOUND_INJECTION=true
          fi
        done

        if [ "$FOUND_INJECTION" = "true" ]; then
          echo "=================================================="
          echo "❌ CI/CD SCRIPT INJECTION RISK DETECTED"
          echo "=================================================="
          echo "Move dangerous expressions to env: blocks instead of using them in run: directly."
          echo ""
          echo "UNSAFE:  run: echo \"${O} github.event.pull_request.title }}\""
          echo "SAFE:    env:"
          echo "           PR_TITLE: ${O} github.event.pull_request.title }}"
          echo "         run: echo \"\$PR_TITLE\""
          # Warning only — not blocking since some uses may be safe
        else
          echo "✅ No CI/CD script injection patterns detected"
        fi

    - name: Scan wrangler.toml for security misconfigurations
      if: always()
      run: |
        echo "=================================================="
        echo "WRANGLER CONFIGURATION SECURITY CHECK"
        echo "=================================================="
        echo ""

        FOUND_ISSUES=false

        # Check for debug endpoints enabled in production configs
        for toml_file in $(find . -name "wrangler.toml" -not -path "*/node_modules/*"); do
          echo "Checking $toml_file..."

          # Debug endpoints in production
          if grep -n 'ENABLE_DEBUG_ENDPOINTS.*=.*"true"' "$toml_file" 2>/dev/null | grep -i "prod"; then
            echo "❌ $toml_file: Debug endpoints enabled in production config!"
            FOUND_ISSUES=true
          fi

          # Hardcoded secrets (not just variable names)
          if grep -nE '^\s*(ADMIN_TOKEN|HMAC_SECRET|PRIVATE_KEY)\s*=\s*"[^"]+"' "$toml_file" 2>/dev/null; then
            echo "❌ $toml_file: Hardcoded secret value detected!"
            FOUND_ISSUES=true
          fi

          # Overly permissive compatibility flags
          if grep -n 'nodejs_compat_v2' "$toml_file" 2>/dev/null; then
            echo "⚠️ $toml_file: nodejs_compat_v2 flag — verify this is intentional"
          fi
        done

        echo ""
        if [ "$FOUND_ISSUES" = "true" ]; then
          echo "❌ Wrangler security issues found — review above"
        else
          echo "✅ No wrangler security misconfigurations detected"
        fi

    - name: Create analysis summary
      if: always()
      run: |
        O='$''{{' # see the script-injection step: no literal expression opener here
        echo "## 🔒 Security Config Audit" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Bespoke scanners in this workflow:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **CI/CD script-injection** — GitHub Actions ${O} }} expressions in \`run:\` blocks" >> $GITHUB_STEP_SUMMARY
        echo "- **wrangler.toml misconfig** — debug endpoints in prod, hardcoded secrets, risky compat flags" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### CodeQL (SARIF)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "CodeQL SARIF generation + upload is the single responsibility of" >> $GITHUB_STEP_SUMMARY
        echo "\`.github/workflows/codeql.yml\` — see that workflow for language coverage," >> $GITHUB_STEP_SUMMARY
        echo "query packs (security-extended, security-and-quality), and custom" >> $GITHUB_STEP_SUMMARY
        echo "technology queries for Cloudflare Workers, D1, Firebase, React, HTML," >> $GITHUB_STEP_SUMMARY
        echo "Wrangler, Playwright, and Postman." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Results" >> $GITHUB_STEP_SUMMARY
        echo "Check the **Security** tab for CodeQL findings. Findings from this" >> $GITHUB_STEP_SUMMARY
        echo "workflow's bespoke scanners appear in the step logs above." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPENDENCY AUDIT (npm audit)
  # ============================================================================
  # Checks for known vulnerabilities in npm dependencies.
  # Runs alongside CodeQL for comprehensive security coverage.
  # ============================================================================
  dependency-audit:
    name: 🔍 Dependency Vulnerability Audit
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        clean: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
      # Root-only job: nothing here imports @ocr/ui, so staging stays
      # best-effort (it now exits 1 if the pinned hub cannot be fetched);
      # root npm ci tolerates a missing @ocr/flags (OSE-341).
      continue-on-error: true
      timeout-minutes: 3
      env:
        GIT_TERMINAL_PROMPT: '0'
        OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
      run: bash scripts/ci-stage-ocr-workspace.sh

    - name: Install dependencies
      run: |
        HASH="$(node --version)-$(git hash-object package-lock.json)"
        STAMP=node_modules/.install-stamp
        # inputs.skip_cache is only populated on workflow_dispatch; default to 'false' for push/PR.
        SKIP_CACHE="${{ inputs.skip_cache || 'false' }}"
        if [ "$SKIP_CACHE" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
          echo "node_modules up-to-date, skipping npm ci"
        else
          npm ci --prefer-offline || npm ci
          echo "$HASH" > "$STAMP"
        fi

    - name: Run npm audit
      id: npm-audit
      run: |
        echo "=============================================="
        echo "NPM DEPENDENCY AUDIT"
        echo "=============================================="
        echo ""
        echo "Dependency vulnerability audit per ci-cd-architecture.md"
        echo "High and critical vulnerabilities block merges."
        echo ""

        # Create audit report directory
        mkdir -p .security-reports

        # Run audit and capture output in JSON format for processing
        set +e
        npm audit --json > .security-reports/npm-audit.json 2>&1
        AUDIT_EXIT_CODE=$?

        # Also get human-readable output
        AUDIT_OUTPUT=$(npm audit --audit-level=high 2>&1)
        set -e

        echo "$AUDIT_OUTPUT"
        echo ""

        # Parse vulnerability counts from JSON
        if [ -f .security-reports/npm-audit.json ]; then
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          LOW=$(jq '.metadata.vulnerabilities.low // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' .security-reports/npm-audit.json 2>/dev/null || echo "0")
        else
          CRITICAL=0
          HIGH=0
          MODERATE=0
          LOW=0
          TOTAL=0
        fi

        echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high_count=$HIGH" >> $GITHUB_OUTPUT
        echo "moderate_count=$MODERATE" >> $GITHUB_OUTPUT
        echo "low_count=$LOW" >> $GITHUB_OUTPUT
        echo "total_count=$TOTAL" >> $GITHUB_OUTPUT

        # Determine if we should fail
        BLOCKING_COUNT=$((CRITICAL + HIGH))

        if [ "$BLOCKING_COUNT" -gt 0 ]; then
          echo ""
          echo "=============================================="
          echo "❌ BLOCKING VULNERABILITIES FOUND"
          echo "=============================================="
          echo "Critical: $CRITICAL"
          echo "High: $HIGH"
          echo ""
          echo "These must be resolved before merging."
          echo "See docs/SECURITY.md for remediation guidance."
          echo "=============================================="
          echo "audit_status=failed" >> $GITHUB_OUTPUT
          # High/critical severity vulnerabilities fail the gate (merge-blocking).
          exit 1
        else
          echo ""
          echo "✅ No high or critical vulnerabilities found"
          echo "audit_status=pass" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -gt 0 ]; then
            echo ""
            echo "Note: Found $MODERATE moderate and $LOW low severity issues."
            echo "These don't block merging but should be addressed."
          fi
          exit 0
        fi

    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dependency-audit-report
        path: .security-reports/
        retention-days: 30

    - name: Create audit summary
      if: always()
      run: |
        echo "## 🔍 Dependency Vulnerability Audit - Deep Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        AUDIT_STATUS="${{ steps.npm-audit.outputs.audit_status }}"
        CRITICAL="${{ steps.npm-audit.outputs.critical_count }}"
        HIGH="${{ steps.npm-audit.outputs.high_count }}"
        MODERATE="${{ steps.npm-audit.outputs.moderate_count }}"
        LOW="${{ steps.npm-audit.outputs.low_count }}"
        TOTAL="${{ steps.npm-audit.outputs.total_count }}"

        if [ "$AUDIT_STATUS" == "pass" ]; then
          echo "### ✅ No Blocking Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All dependencies are clear of high and critical severity issues." >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ BLOCKING: Vulnerabilities Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "High or critical vulnerabilities found. **Merge is blocked.**" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Severity | Count | Blocks Merge? |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|---------------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🔴 Critical | $CRITICAL | Yes |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟠 High | $HIGH | Yes |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟡 Moderate | $MODERATE | No |" >> $GITHUB_STEP_SUMMARY
        echo "| 🟢 Low | $LOW | No |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total** | **$TOTAL** | |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Remediation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "If vulnerabilities were found:" >> $GITHUB_STEP_SUMMARY
        echo "1. Run \`npm audit\` locally to see details" >> $GITHUB_STEP_SUMMARY
        echo "2. Run \`npm audit fix\` to auto-fix compatible updates" >> $GITHUB_STEP_SUMMARY
        echo "3. See [docs/SECURITY.md](../docs/SECURITY.md) for manual fixes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "This is the canonical security-scan.yml per ci-cd-architecture.md" >> $GITHUB_STEP_SUMMARY
        echo "**Artifact**: \`dependency-audit-report\` contains detailed JSON report." >> $GITHUB_STEP_SUMMARY
