# T5 — Security (post-test integrity), then T6 — Adversarial Red Team, then the
# post-T6 bookend
#
# Starts only after the full staging pipeline (OurSharedEvents CI/CD, push on
# main) has passed. T5, T6 and post-T6 are jobs here, chained by `needs:`, not
# separate workflow_run workflows: a workflow_run fired by another workflow_run
# reports workflow_run.event == 'workflow_run', so the push-on-main gate below
# could never pass one link down the chain. As separate workflows, the later
# links skipped on every run from #743 (2026-10-01) until they became jobs here.
# Here every job reads the CI/CD run's own event, so one gate covers the chain.
#
# Order, and why:
#   T5 security-closing    First. The merged change has just run through T1-T4.
#                          Before anything else touches it (npm ci runs install
#                          scripts; the red team holds live secrets), check that
#                          the change added no prompt injection, no workflow
#                          injection, no unreviewed host or secret name.
#   T6 red-team-staging    Attacks the deployed env, only once T5 is clear.
#   post-t6-security       Last. Checks the red team left nothing behind.
name: T5/T6 — Security then Adversarial Red Team

on:
  workflow_run:
    workflows: ['OurSharedEvents CI/CD']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: red-team-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  security-closing:
    name: 'T5 Security (post-test integrity)'
    # ADR-012 0.2: a workflow_run job runs with main as its ref, so environment
    # branch rules do not stop it, and a head_repository check only stops forks.
    # It must never check out and run code from a pull_request source run while
    # holding secrets, so only push runs on main qualify. (full-pipeline/* PR
    # runs are no longer checked with live secrets; check-pr-secret-exposure
    # rule W enforces this.) Every job below repeats this gate.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Two commits: the merge and its parent, which the injection check diffs.
          fetch-depth: 2
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Install scripts are code the merged change can control. The check needs the
      # `yaml` package to read workflows, so dependencies go in first with scripts
      # off (files only, nothing runs), then the change is read as text, and only
      # then do install scripts run (npm rebuild).
      - name: Install dependencies (install scripts off)
        run: npm ci --ignore-scripts --prefer-offline || npm ci --ignore-scripts
      - name: 'T5: merged change added no injection (agent files, workflows, hosts, secrets)'
        run: node scripts/ci/check-post-pr-injection.mjs
      - name: 'T5: committed-secret gate (nothing injected during testing)'
        run: |
          python -m pip install 'detect-secrets==1.5.0' --quiet
          python scripts/check-secrets-baseline.py
      - name: Run install scripts (only after the change was read)
        run: npm rebuild
      - name: Install Playwright browsers
        run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: 'T5: deployed surface carries no injected content'
        env:
          # OSE-1418: same target as T6 (repo variable RED_TEAM_BASE_URL).
          BASE_URL: ${{ vars.RED_TEAM_BASE_URL || 'https://stg.oursharedevents.com' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.red-team.config.ts             tests/red-team/public-list-stored-xss.spec.ts             tests/red-team/security-headers.spec.ts

  red-team-staging:
    name: 'T6 Adversarial (red-team) → deployed env'
    needs: [security-closing]
    # Same ADR-012 0.2 gate as security-closing; needs: adds "only after T5
    # succeeded".
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        shell: bash
        continue-on-error: true
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci
      - name: Install Playwright browsers
        run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: 'Adversarial: red-team suite against the deployed env'
        env:
          # OSE-1418: target is a repo variable, not hardcoded. It must be the env
          # whose CF Access + ADMIN_KEY secrets are below (staging today).
          BASE_URL: ${{ vars.RED_TEAM_BASE_URL || 'https://stg.oursharedevents.com' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        # RL-* (live rate-limit bursts, ~6 min of 180-request floods) run nightly in
        # red-team-rate-limit-nightly.yml, not on every merge: they test the edge
        # rule, which no earlier tier can see, and they need not gate each push.
        run: npx playwright test --config=playwright.red-team.config.ts --grep-invert "RL-"

  post-t6-security:
    name: 'Post-T6 Security (final bookend)'
    needs: [red-team-staging]
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 'Integrity: committed tree is clean'
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git diff-tree --check HEAD

      - name: 'Closing: committed-secret gate'
        run: |
          python -m pip install 'detect-secrets==1.5.0' --quiet
          python scripts/check-secrets-baseline.py

      - name: 'Closing: dependency audit'
        run: npm audit --omit=dev --audit-level=moderate --package-lock-only

      # T5 ran before the red team, so it cannot see what the red team left on the
      # deployed env (stored payloads, changed headers). This is the last look.
      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci
      - name: Install Playwright browsers
        run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: 'Closing: the red team left no injected content on the deployed surface'
        env:
          BASE_URL: ${{ vars.RED_TEAM_BASE_URL || 'https://stg.oursharedevents.com' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.red-team.config.ts             tests/red-team/public-list-stored-xss.spec.ts             tests/red-team/security-headers.spec.ts
