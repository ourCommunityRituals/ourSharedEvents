# T5 — Adversarial red-team run
#
# This is intentionally a separate workflow run from Stage 2 — Security Finale.
# It starts only after the full staging pipeline has passed, then Stage 2 is
# triggered by this workflow's successful completion.
name: T5 — Adversarial Red Team

on:
  workflow_run:
    workflows: ['OurSharedEvents CI/CD']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: red-team-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  red-team-staging:
    name: 'T5 Adversarial (red-team) → deployed env'
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'push') &&
      (startsWith(github.event.workflow_run.head_branch, 'full-pipeline/') ||
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: 'Adversarial: red-team suite against the deployed env'
        env:
          BASE_URL: https://stg.oursharedevents.com
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npx playwright test --config=playwright.red-team.config.ts
