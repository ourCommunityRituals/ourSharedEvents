# Street-map region measure: how big each region's street-map archive would be.
# Writes nothing anywhere and holds no credential (OSE-2210).
#
# The street map is cut per region (owner, 2026-11-22): the United States file
# the load workflow cuts today (street-map-archive-load.yml), then Canada, then
# Mexico, Central America and the Caribbean, each its own archive with its own
# load and upkeep. The world is broken down the same way, region by region.
# A region is a file of boxes listed in scripts/ci/street-map-region-measure.mjs.
#
# This runs `pmtiles extract --dry-run` for each region against the Protomaps
# build the load workflow names, at the Worker's top zoom, and reports the size
# against the runner's free disk. The dry run reads the build's directories by
# byte range; it downloads no tile data and uploads nothing. It does not touch
# the bucket, the load workflow, its environment or its key.
#
# It runs on a pull request that changes a region file, so a new region is sized
# before anyone loads it, and by hand for one region.

name: Street-map region measure

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to measure (all = every region)'
        type: choice
        options:
          - all
          - us
          - ca
          - mx
        default: all
  pull_request:
    paths:
      - 'docs/runbooks/street-map-*-region.geojson'
      - 'scripts/ci/street-map-region-measure.mjs'
      - '.github/workflows/street-map-region-measure.yml'

permissions:
  contents: read

concurrency:
  group: street-map-region-measure-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Worker's top zoom (MAX_ZOOM in workers/oursharedevents/src/lib/street-map.ts);
  # the topzoom step stops the run unless they agree.
  WORKER_TOP_ZOOM: '14'
  # The same go-pmtiles release and digest the load workflow pins.
  PMTILES_VERSION: '1.31.2'
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f # pragma: allowlist secret (the public SHA-256 of a release file)

jobs:
  regions:
    name: 'Region files are boxes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: 'Every region file is a set of closed boxes'
        run: node scripts/ci/street-map-region-measure.mjs check

      - name: 'Pick the regions to measure'
        id: pick
        env:
          ASKED: ${{ inputs.region }}
        run: |
          set -euo pipefail
          case "${ASKED:-all}" in
            all) echo 'list=["us","ca","mx"]' >> "$GITHUB_OUTPUT" ;;
            us|ca|mx) echo "list=[\"${ASKED}\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown region ${ASKED}"; exit 1 ;;
          esac

  measure:
    name: 'Measure ${{ matrix.region }} (dry run, writes nothing)'
    needs: [regions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.list) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: 'Name the region file, the key and the build'
        env:
          REGION: ${{ matrix.region }}
        run: node scripts/ci/street-map-region-measure.mjs target "$REGION"

      - name: 'The cut zoom is the deepest zoom the Worker reads'
        run: node scripts/ci/street-map-archive-load.mjs topzoom

      - name: 'Download go-pmtiles and refuse it unless its SHA-256 is the pinned one'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/pmtiles"
          cd "$RUNNER_TEMP/tools/pmtiles"
          FILE="go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$FILE" \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/${FILE}"
          echo "${PMTILES_SHA256}  ${FILE}" | sha256sum --check --strict
          tar -xzf "$FILE"
          if [ ! -x ./pmtiles ]; then
            echo "::error::The go-pmtiles release file holds no pmtiles program."
            exit 1
          fi
          echo "$PWD" >> "$GITHUB_PATH"
          ./pmtiles version

      - name: 'The build is still offered at Protomaps'
        run: |
          if ! curl --fail --silent --show-error --location --range 0-0 --output /dev/null \
            "https://build.protomaps.com/${PROTOMAPS_BUILD}.pmtiles"; then
            echo "::error::Build ${PROTOMAPS_BUILD} is not offered at Protomaps any more (daily builds are kept about a week). The load workflow names it; a PR there moves it."
            exit 1
          fi

      - name: 'Dry run: the size of this region at the top zoom, against the free disk'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure"
          cd "$RUNNER_TEMP/measure"
          pmtiles extract "https://build.protomaps.com/${PROTOMAPS_BUILD}.pmtiles" "${REGION_KEY}" --region="${GITHUB_WORKSPACE}/${REGION_FILE}" --maxzoom="${WORKER_TOP_ZOOM}" --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.log"
          FREE="$(df --output=avail -B1 "$RUNNER_TEMP/measure" | tail -n 1 | tr -d ' ')"
          echo "### Region \`${REGION_KEY}\`" >> "$GITHUB_STEP_SUMMARY"
          node "${GITHUB_WORKSPACE}/scripts/ci/street-map-archive-load.mjs" fits "$RUNNER_TEMP/dry-run.log" "$FREE"
