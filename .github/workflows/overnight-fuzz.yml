# Overnight fat-finger fuzz — property tests at a case count no PR gate can afford.
#
# WHY A SEPARATE NIGHTLY JOB
# The same specs run in T0 at FC_RUNS=200 (fast, deterministic enough to gate).
# Here they run at 50,000 with a random seed, which takes minutes instead of
# seconds and would make every PR wait. Idle hours are the right home for the
# long tail: the counterexample nobody thought to write down.
#
# WHAT IT DOES NOT DO
# It never merges and never pushes to a branch — rail R5, "merges stay
# human-gated." A failure leaves an artifact and a red run for a human to read.
# The counterexample is fully reproducible from the seed printed in the log.
name: Overnight fat-finger fuzz

on:
  schedule:
    # 07:00 UTC — after the 06:00 dashboard job, before the working day.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'fast-check cases per property'
        required: false
        default: '50000'

permissions:
  contents: read

concurrency:
  group: overnight-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workers/oursharedevents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests the Worker, which
        # bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref. REQUIRED —
        # never continue-on-error: npm ci would succeed with a dangling @ocr/ui
        # link and the failure would surface later as an unresolvable import.
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_HUB_READ || secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - run: npm ci

      - name: Fuzz the wizard's input edges
        shell: bash
        env:
          # A fresh seed each night: the point is to explore inputs the
          # gate's fixed-seed run never reaches.
          FC_RUNS: ${{ github.event.inputs.runs || '50000' }}
        # OSE-1409: this job was red for 10+ nights (2026-09-20 → 09-29) without
        # ever running a property — vitest could not LOAD its config (js-yaml was
        # undeclared in the worker, so a worker-only `npm ci` could not resolve
        # it). An infra failure and a counterexample looked identical: a red run.
        # Classify them so the log says which one a human is looking at.
        run: |
          set +e
          npx vitest run tests/fat-finger.property.spec.ts --reporter=verbose 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if grep -qE 'Startup Error|failed to load config|Cannot find (package|module)|Failed to initialize projects' fuzz.log; then
              echo "::error title=Fuzz infra failure::vitest could not start — no property ran. This is NOT a counterexample; fix the toolchain (see fuzz.log)."
            else
              echo "::error title=Fuzz counterexample::a property failed — reproduce from the seed printed in fuzz.log."
            fi
          fi
          exit "$status"

      - name: Upload counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fat-finger-counterexamples
          path: |
            workers/oursharedevents/*.log
            workers/oursharedevents/test-results/**
          retention-days: 30
          if-no-files-found: ignore
