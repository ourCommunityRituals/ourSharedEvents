# OurSharedEvents – CI/CD Pipeline
#
# Security-gated pipeline: nothing deploys until security + quality pass.
# Post-deploy: quality smoke (security bookend) runs parallel with deploy,
# functional smoke validates the new deployment.
#
# Job Flow:
#   [00 Security Gate] → [02 Deploy ∥ 03 Quality Smoke] → [03b Functional Smoke]
#
# Trigger Matrix:
#   | Event          | 00 Gate | 02 Deploy | 03 QSmoke | 03b FSmoke |
#   |----------------|---------|-----------|-----------|------------|
#   | PR to main     | ✅      | ❌        | ❌        | ❌         |
#   | Push to main   | ✅      | ✅        | ✅        | ✅         |
#   | Tag vX.Y.Z     | ✅      | ❌(→prod) | ❌(→prod) | ❌(→prod)  |
#   | workflow_dispatch | ✅   | optional  | optional  | optional   |
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN      (Cloudflare API token with Workers:Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID     (Cloudflare account ID)
#   - ADMIN_KEY                 (Bearer token for /admin routes)
#
# Wrangler secrets (set once via wrangler CLI, not GitHub secrets):
#   wrangler secret put ADMIN_KEY                 --env staging
#   wrangler secret put FORMS_ENCRYPTION_KEY      --env staging
#   # Repeat for --env production

name: OurSharedEvents CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'playwright.*.config.*'
      - '.github/workflows/oursharedevents-ci.yml'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'archive/**'
      - '.claude/**'
  push:
    branches:
      - main
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'playwright.*.config.*'
      - '.github/workflows/oursharedevents-ci.yml'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'archive/**'
      - '.claude/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        required: false
        default: 'false'
        type: boolean
      deploy_production:
        description: 'Deploy to production (type PRODUCTION to confirm)'
        required: false
        type: string

concurrency:
  group: oursharedevents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

jobs:
  # ============================================================================
  # 00 SECURITY GATE — Nothing gets in until this passes
  #
  # Batched into one job for cost efficiency (1 runner, 1 checkout, 1 npm ci).
  # Security checks run FIRST (banned-origins, unit security), then quality
  # checks (lint, typecheck, unit, contract, guards).
  # ============================================================================
  security-gate:
    name: '00 Security Gate'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # --- Security checks (fail fast) ---

      - name: Install root dependencies
        run: npm ci

      - name: 'Security: Banned origins check'
        run: npm run check:banned-origins

      - name: 'Security: Unit security tests'
        run: npx vitest run tests/unit/security-middleware_MOCK.test.js tests/unit/worker/sec-iac-03-adminOAuth.test.js tests/unit/worker/sec-iac-04-public-read-only.test.js tests/unit/worker/sec-iac-05-signed-mutations.test.js tests/unit/worker/sec-iac-07-iac-smoke.test.js

      # --- Quality checks ---

      - name: 'Quality: Lint (zero warnings)'
        run: npm run lint:ci

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: TypeScript type check'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: Unit + Contract + Guards'
        run: npm test

      - name: 'Quality: Worker D1 schema + forms security'
        run: npm test
        working-directory: ${{ env.WORKER_DIR }}

  # ============================================================================
  # 02 DEPLOY → Staging (push to main only)
  # ============================================================================
  deploy-staging:
    name: '02 Deploy → Staging'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKER_DIR }}/package.json'

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: Apply D1 migrations to staging (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations to staging (forms DB — separate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      - name: Verify D1 staging tables (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "6"; then
            echo "::error::D1 staging table verification failed — expected 6 tables in main DB"
            exit 1
          fi
          echo "✓ All 6 tables verified in staging main D1"

      - name: Verify D1 staging tables (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-forms-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "5"; then
            echo "::error::D1 staging forms table verification failed — expected 5 tables in forms DB"
            exit 1
          fi
          echo "✓ All 5 tables verified in staging forms D1"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          echo "Setting WORKER_BUILD_VERSION=$VERSION"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait for worker propagation
        run: sleep 10

      - name: Health check staging
        run: |
          echo "Checking https://stg.oursharedevents.com/health ..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Health check failed – HTTP $HTTP"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP)"

  # ============================================================================
  # 03 QUALITY SMOKE → Staging (security bookend — runs parallel with deploy)
  #
  # Tests security + contracts against the EXISTING staging deployment.
  # This is the closing bookend: validates live what 00 validated statically.
  # ============================================================================
  quality-smoke-staging:
    name: '03 Quality Smoke → Staging'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 'Security smoke: XSS, injection, auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npx playwright test tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'Security smoke: IAC security verification'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/sec-iac-07-smoke.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload quality smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Fail if security smoke failed
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Quality smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # 03b FUNCTIONAL SMOKE → Staging (validates the NEW deploy)
  # ============================================================================
  functional-smoke-staging:
    name: '03b Functional Smoke → Staging'
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    permissions:
      contents: read
      checks: write  # Required for dorny/test-reporter PR annotations

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: API smoke tests
        id: api-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npm run test:api:smoke
        timeout-minutes: 10
        continue-on-error: true

      - name: UI smoke tests
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npm run test:ui:smoke
        timeout-minutes: 15
        continue-on-error: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Report staging results in PR
        if: always() && github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: "Functional Smoke Staging Results"
          path: ".test-results/*-junit.xml"
          reporter: jest-junit
          fail-on-error: false

      - name: Fail if tests failed
        if: steps.api-tests.outcome == 'failure' || steps.ui-tests.outcome == 'failure'
        run: |
          echo "::error::Functional smoke failed — API: ${{ steps.api-tests.outcome }}, UI: ${{ steps.ui-tests.outcome }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## OurSharedEvents Functional Smoke – Staging" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Smoke | \`${{ steps.api-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Smoke  | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $STG_BASE_URL" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 04 DEPLOY → Production (on tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: '04 Deploy → Production'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKER_DIR }}/package.json'

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "Checking wrangler.toml for cross-env contamination..."
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database — cross-env contamination detected"
            exit 1
          fi
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-local'; then
            echo "::error::Production config references local database — cross-env contamination detected"
            exit 1
          fi
          echo "✓ Production DB isolation verified — no cross-env references"

      - name: Apply D1 migrations to production (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "⚠️  Applying migrations to PRODUCTION D1 (approved via environment gate)"
          npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations to production (forms DB — separate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "⚠️  Applying forms migrations to PRODUCTION forms D1"
          npx wrangler d1 migrations apply FORMS_DB --env production --remote

      - name: Verify D1 production tables (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "6"; then
            echo "::error::D1 production table verification failed — expected 6 tables in main DB"
            exit 1
          fi
          echo "✓ All 6 tables verified in production main D1"

      - name: Verify D1 production tables (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-forms-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "5"; then
            echo "::error::D1 production forms table verification failed — expected 5 tables in forms DB"
            exit 1
          fi
          echo "✓ All 5 tables verified in production forms D1"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          VERSION="${GITHUB_REF_NAME:-prod-$(git rev-parse --short HEAD)}"
          echo "Setting WORKER_BUILD_VERSION=$VERSION"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait for worker propagation
        run: sleep 10

      - name: Health check production
        run: |
          echo "Checking https://oursharedevents.com/health ..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Production health check failed – HTTP $HTTP"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP)"

  # ============================================================================
  # 05 QUALITY SMOKE → Production (security bookend — parallel with deploy)
  # ============================================================================
  quality-smoke-production:
    name: '05 Quality Smoke → Production'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 'Security smoke: XSS, injection, auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npx playwright test tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'Security smoke: IAC security verification'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/sec-iac-07-smoke.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload quality smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 30

      - name: Fail if security smoke failed
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Quality smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # 05b FUNCTIONAL SMOKE → Production (validates the NEW deploy)
  # ============================================================================
  functional-smoke-production:
    name: '05b Functional Smoke → Production'
    runs-on: ubuntu-latest
    needs: [deploy-production]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: API smoke tests
        id: api-tests
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npm run test:api:smoke
        timeout-minutes: 10
        continue-on-error: true

      - name: UI smoke tests
        id: ui-tests
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: npm run test:ui:smoke
        timeout-minutes: 15
        continue-on-error: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 30

      - name: Fail if tests failed
        if: steps.api-tests.outcome == 'failure' || steps.ui-tests.outcome == 'failure'
        run: |
          echo "::error::Functional smoke failed — API: ${{ steps.api-tests.outcome }}, UI: ${{ steps.ui-tests.outcome }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## OurSharedEvents Functional Smoke – Production" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Smoke | \`${{ steps.api-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Smoke  | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $PROD_BASE_URL" >> $GITHUB_STEP_SUMMARY
