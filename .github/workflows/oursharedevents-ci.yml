# OurSharedEvents – CI/CD Pipeline
#
# S0 Security → T0 Gate → T1 Deploy → [T2 Smoke, T3 Contract]
#                                   → T4 Functional (dispatch only)
#
# Security runs unconditionally on every PR (no paths filter on pull_request trigger).
# Gate and all downstream jobs are blocked behind security via needs: — security results
# determine whether the rest of the pipeline runs at all.
# Push-to-main keeps paths filtering (deployment is expensive; path-scoping is fine there).
#
#   S0: Security — Static vulnerability analysis + supply chain inventory
#       - CodeQL SAST (JS/TS)          → github/codeql-action/analyze@v4
#       - Semgrep SAST                 → p/nodejs + p/owasp-top-ten + p/r2c-security-audit
#       - gitleaks secret scan         → gitleaks detect (self-hosted Windows binary)
#       - detect-secrets               → Yelp detect-secrets baseline scan
#       - npm audit (CVE check)        → npm audit --omit=dev --audit-level=moderate
#       - SBOM generation              → npx @cyclonedx/cyclonedx-npm --omit dev
#
#   T0: Gate — Static quality + unit/contract tests
#       - Banned origins check         → npm run check:banned-origins
#       - Security unit tests          → vitest run tests/unit/worker/sec-iac-{03,04,05,07}
#       - Lint                         → eslint config/ scripts/ tests/unit/ tests/contract/
#       - TypeScript typecheck         → tsc --noEmit (workers/oursharedevents)
#       - Unit + contract + guards     → npm test (root)
#       - Worker D1 schema             → npm test (workers/oursharedevents)
#
#   T1: Deploy — Migrations, deploy, health check
#       - D1 migrations (main + forms) → wrangler d1 migrations apply {DB,FORMS_DB} --remote
#       - Canonical-shape verification → assert tables-by-name match the spec at
#                                        workers/oursharedevents/tests/migration-smoke.spec.ts
#                                        (extracted at workflow runtime per OSE-303 —
#                                        no hard-coded copy in this workflow)
#                                        + 0 triggers, BY NAME, against the
#                                        canonical set in
#                                        tests/migration-smoke.spec.ts (OSE-209)
#       - Deploy                       → wrangler deploy
#       - Health check                 → curl /health (HTTP 200)
#
#   T2: Smoke — XSS, auth boundaries, fail-fast gates, form endpoints
#       - Security smoke               → playwright tests/e2e/1-smoke/security-smoke.spec.js
#       - IAC health + fail-fast       → playwright tests/api/smoke/{api-health,fail-fast-gates}.spec.ts
#       - Form endpoint smoke          → playwright tests/api/smoke/form-endpoints.spec.ts
#
#   T3: Contract — API + Pages spec compliance
#       - Newman API collection        → newman run postman/collections/ose-api.json
#       - Newman Pages collection      → newman run postman/collections/ose-pages.json
#
#   T4: Functional — End-to-end journeys (dispatch only)
#       - Architecture invariants      → playwright tests/e2e/0-architecture/
#       - Core journeys                → playwright tests/e2e/3-flows/sponsor-journey.spec.ts
#       - Form E2E (4 types + flows)   → playwright tests/e2e/2-pages/form-*.spec.ts + 3-flows + 4-negative
#       - UI smoke                     → npm run test:ui:smoke
#
# Trigger Matrix:
#   | Event              | Security | Gate | Deploy | Smoke | Contract | Functional |
#   |--------------------|----------|------|--------|-------|----------|------------|
#   | PR to main         | ✅ *     | ✅   | ❌     | ❌    | ❌       | ❌         |
#   | Push to main       | ✅       | ✅   | ✅     | ✅    | ✅       | ❌         |
#   | Tag vX.Y.Z         | ✅       | ✅   | →prod  | →prod | ❌       | ❌         |
#   | Schedule (nightly) | ✅       | ✅   | ❌     | ✅†   | ✅†      | ❌         |
#   | Dispatch           | ✅       | ✅   | opt    | opt   | opt      | opt        |
#   * PR trigger has NO paths filter — security runs on every PR regardless of files changed.
#     Gate/Deploy/Smoke still skip on non-code PRs via their own paths conditions (see push trigger).
#   † Nightly: runs against live staging without redeploying (environmental drift detection)
#
# Cost control: Functional (Tier 4) only runs when you check the box.
# Move tests between Tier 2/3/4 as you settle on nightly vs on-demand.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN_OSE      (Cloudflare API token)
#   - CLOUDFLARE_ACCOUNT_ID         (Cloudflare account ID)
#   - ADMIN_KEY                     (Bearer token for /admin routes)
#   - X_OCR_INTERNAL                (CI/CD auth secret)
#   - CF_ACCESS_CLIENT_ID           (Cloudflare Access service token)
#   - CF_ACCESS_CLIENT_SECRET       (Cloudflare Access service token secret)

name: OurSharedEvents CI/CD

on:
  pull_request:
    branches: [main]
    # No paths filter — security (S0) must scan every PR unconditionally.
    # Gate and all downstream jobs are gated behind security via needs:.
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.ts'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.html'
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'postman/**'
      - 'packages/**'
      - 'playwright.*.config.*'
      - '.github/workflows/**'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '7 3 * * *'  # Nightly 3:07 AM UTC — Gate + Smoke + Contract (no deploy)
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        type: boolean
        default: false
      deploy_production:
        description: 'Deploy to production (type PRODUCTION)'
        type: string
      run_functional:
        description: 'Run full functional suite (Tier 4 — expensive)'
        type: boolean
        default: false
      force_clean:
        description: 'Force npm ci regardless of stamp (bust corrupt node_modules)'
        type: boolean
        default: false

concurrency:
  group: ose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # S0: SECURITY — CodeQL SAST + SBOM (runs before test pyramid)
  # ============================================================================
  security:
    name: 'S0 Security'
    runs-on: self-hosted
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          FLAGS_NM=node_modules/@ocr/flags/package.json
          # The install-stamp lets us skip `npm ci` when package-lock.json is
          # unchanged. But the "Fix @ocr/flags for SBOM resolution" step later
          # in THIS job destructively strips devDependencies from @ocr/flags
          # IN PLACE, and self-hosted runners persist node_modules between
          # runs. The lockfile hash doesn't change when only @ocr/flags is
          # mutated, so a naive stamp-skip would let `npm audit` run against
          # the mutated tree — the npm registry then rejects the submitted
          # tree with `400 Bad Request — Invalid package tree`.
          #
          # SELF-HEALING GUARD: the stamp is only trustworthy if @ocr/flags
          # in node_modules still carries its devDependencies. If they're gone
          # (SBOM step already ran on this runner) or the file is unparseable,
          # node_modules is mutated → force a fresh `npm ci`. This recovers on
          # the very next run with no force_clean dispatch needed, and catches
          # corruption from ANY source, not just the known SBOM step.
          flags_mutated=false
          if [ -f "$FLAGS_NM" ]; then
            node -e "const p=JSON.parse(require('fs').readFileSync('$FLAGS_NM','utf8'));process.exit(p.devDependencies?0:1)" 2>/dev/null || flags_mutated=true
          fi
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ "$flags_mutated" = 'false' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            if [ "$flags_mutated" = 'true' ]; then
              echo "node_modules/@ocr/flags is mutated (devDependencies stripped by a prior SBOM run) — forcing fresh npm ci"
            fi
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # ── CodeQL moved out (Sweep 9 #2, 2026-05-14) ───────────────────────
      # CodeQL javascript-typescript analysis lived here AND in codeql.yml
      # — same trigger set, same analysis target, ~2.4 min each on
      # Bloodraven (measured on PR #160). The duplicate burned a runner
      # slot for no signal gain. codeql.yml is now the canonical entry
      # point: it owns the pull_request + push + scheduled + dispatch
      # triggers and emits the SARIF artifact. Keep S0 Security focused on
      # the non-CodeQL scanners (Semgrep, detect-secrets, gitleaks, npm
      # audit, SBOM) where the duplication didn't exist.

      # ── Semgrep + detect-secrets (Python-based) ──────────────────────────
      - name: Set up Python for Semgrep + detect-secrets
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Semgrep SAST
        run: |
          python -m pip install semgrep --quiet
          SCRIPTS_DIR=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          chmod +x "$SCRIPTS_DIR/semgrep" 2>/dev/null || true
          "$SCRIPTS_DIR/semgrep" scan \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --error \
            --exclude=node_modules \
            --exclude=.wrangler \
            --exclude=coverage \
            --exclude=dist \
            --exclude=.claude \
            --json-output=semgrep-results.json || SEMGREP_EXIT=$?
          FINDING_COUNT=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo 0)
          echo "- **Semgrep:** $FINDING_COUNT findings" >> $GITHUB_STEP_SUMMARY
          exit ${SEMGREP_EXIT:-0}

      - name: detect-secrets baseline scan
        run: |
          python -m pip install detect-secrets --quiet
          SCRIPTS_DIR=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          chmod +x "$SCRIPTS_DIR/detect-secrets" 2>/dev/null || true
          "$SCRIPTS_DIR/detect-secrets" scan \
            --exclude-files 'package-lock\.json' \
            --exclude-files '\.gitleaks\.toml' \
            --exclude-files '.*\.spec\.ts' \
            --exclude-files 'vitest\.config.*' \
            > .secrets.baseline 2>&1 || true
          SECRET_COUNT=$(jq '.results | to_entries | map(.value | length) | add // 0' .secrets.baseline 2>/dev/null || echo 0)
          echo "- **detect-secrets:** $SECRET_COUNT potential secrets found" >> $GITHUB_STEP_SUMMARY
          if [ "$SECRET_COUNT" -gt "0" ]; then
            echo "::warning::detect-secrets found $SECRET_COUNT potential secrets — review .secrets.baseline"
            jq '.results' .secrets.baseline 2>/dev/null || true
          fi

      # ── gitleaks (Windows binary via GitHub Releases) ────────────────────
      - name: gitleaks secret scan
        run: |
          GITLEAKS_VER=$(curl -sSL "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" \
            -H "Authorization: Bearer ${{ github.token }}" \
            | jq -r '.tag_name' | sed 's/v//')
          GITLEAKS_ZIP="gitleaks_${GITLEAKS_VER}_windows_x64.zip"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/${GITLEAKS_ZIP}" \
            -o /tmp/gitleaks.zip
          unzip -o -q /tmp/gitleaks.zip gitleaks.exe -d /tmp/gitleaks-bin
          # Scan only commits introduced by this PR (base..HEAD), not full history.
          # Full-history scan floods findings with historical test fixture credentials.
          git fetch origin main --depth=50 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "HEAD~1")
          /tmp/gitleaks-bin/gitleaks.exe detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${BASE}..HEAD" \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json 2>&1 || GITLEAKS_EXIT=$?
          LEAK_COUNT=$(jq '. | length' gitleaks-report.json 2>/dev/null || echo 0)
          echo "- **gitleaks:** $LEAK_COUNT secrets detected in PR commits" >> $GITHUB_STEP_SUMMARY
          exit ${GITLEAKS_EXIT:-0}

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

      # file:-linked @ocr/flags exposes its devDependencies to npm ls --all,
      # causing CycloneDX to fail. Strip them from the installed copy so SBOM
      # only inventories production dependencies.
      #
      # IMPORTANT — this step destructively mutates node_modules. Two guards
      # keep `npm audit` from later submitting the mutated tree to the npm
      # registry (which rejects it with `400 — Invalid package tree`):
      #   1. PRIMARY (self-healing): the Install Dependencies step above
      #      detects a stripped @ocr/flags and forces a fresh `npm ci`
      #      regardless of the install-stamp. See its comment block.
      #   2. BELT-AND-SUSPENDERS (this step): invalidate the install-stamp
      #      here so the stamp-hash path ALSO reinstalls next run, even if
      #      the primary detection is ever broken.
      # Diagnosed via workflow_dispatch force_clean=true (run 26111985672 =
      # success vs run 26110784159 same SHA = failure).
      - name: Fix @ocr/flags for SBOM resolution
        run: |
          FLAGS_PKG="node_modules/@ocr/flags/package.json"
          if [ -f "$FLAGS_PKG" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$FLAGS_PKG'));
              delete pkg.devDependencies;
              fs.writeFileSync('$FLAGS_PKG', JSON.stringify(pkg, null, 2));
            "
          fi
          # Belt-and-suspenders — invalidate install stamp; node_modules is no
          # longer pristine after the @ocr/flags mutation above.
          rm -f node_modules/.install-stamp

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json --output-format JSON --spec-version 1.5
          COMPONENT_COUNT=$(jq '.components | length' sbom.json 2>/dev/null || echo "unknown")
          echo "## S0 Security" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL:** see separate \`CodeQL\` workflow (canonical entry, Sweep 9)" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** $COMPONENT_COUNT components (CycloneDX 1.5)" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

  # ============================================================================
  # TIER 0: GATE — Every push, every PR
  #
  # Sweep 9 (2026-05-14): sharded into 4 parallel matrix children so the
  # 3-runner Bloodraven pool can execute lint / typecheck / tests / a11y in
  # parallel rather than serial. Baseline: PR #160 measured 6.4 min for the
  # monolithic single job. Expected wall-clock after shard: ~3 min, driven
  # by the gate-tests shard (the long pole due to ~1064 vitest cases).
  #
  # Downstream jobs (`deploy-staging`, `summary`) reference `needs: [gate]`
  # which GitHub Actions resolves to "all matrix children succeeded" — no
  # change required there.
  #
  # Each shard runs identical setup (checkout, setup-node, stage @ocr/flags,
  # install root deps). The per-runner stamp cache (node_modules/.install-stamp)
  # makes the install a near no-op on warm runners, so the duplicated setup
  # cost is bounded to ~30-45s per shard. Worker deps are skipped on the
  # lint shard since eslint only touches root files — absorbs the original
  # Sweep 9 #3 (combine npm ci) win directly into the matrix design.
  # ============================================================================
  gate:
    name: 'T0 Gate (${{ matrix.shard }})'
    needs: [security]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # `invariants` shard (OSE-350) runs the structural 0-architecture
        # invariant tests on EVERY PR + push — see the "Architecture:
        # structural invariants" step below. Before this, the 0-architecture
        # suite ran only in dispatch-only T4 Functional, so the brain's
        # architectural contracts were not gated on normal development.
        shard: [lint, typecheck, tests, a11y, invariants]
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # Worker deps not needed for the lint shard (eslint targets root paths)
      # nor the invariants shard (structural specs read source via node:fs —
      # they never import worker runtime code). All other shards exercise the
      # worker test suite or worker tsc, so they need
      # workers/oursharedevents/node_modules populated.
      - name: Install worker dependencies
        if: matrix.shard != 'lint' && matrix.shard != 'invariants'
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: lint ────────────────────────────────────────────────────────
      # Banned origins + eslint + deprecation-lock guard. Smallest shard,
      # ~30-60s. Root deps only.
      - name: 'Security: Banned origins'
        if: matrix.shard == 'lint'
        run: npm run check:banned-origins

      # Brain Invariant #10 (deprecation_lock): the canonical instance of
      # the deprecation-lock pattern. OSE migrated off Google Apps Script
      # to Cloudflare Workers + D1; this guard scans the repo for any
      # reintroduced GAS pattern and fails non-zero on hit. A guard that
      # exists in scripts/ but is never invoked by CI is cosmetic — the
      # 0-architecture invariant test
      # tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts
      # asserts this step exists in the workflow.
      #
      # Self-tests run BEFORE the guard itself. The Windows-path
      # regression that hid behind the un-wired self-tests (allowlist
      # silently inert when paths used backslashes; 91 entries loaded,
      # 0 matched) is exactly what an un-tested guard ships. Running the
      # self-tests in CI guarantees the next regression of the same class
      # surfaces in seconds, not months.
      - name: 'Security: Deprecation lock — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-no-gas

      - name: 'Security: Deprecation lock (no-GAS guard)'
        if: matrix.shard == 'lint'
        run: npm run guard:no-gas

      - name: 'Quality: Lint'
        if: matrix.shard == 'lint'
        run: npx eslint config/ scripts/ tests/unit/ tests/contract/ --cache --cache-location node_modules/.eslintcache

      # ── Shard: typecheck ───────────────────────────────────────────────────
      # tsc --noEmit on the worker. Standalone shard so a type regression
      # surfaces as a single named check, not buried inside a multi-step job.
      - name: 'Quality: TypeScript'
        if: matrix.shard == 'typecheck'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: tests ───────────────────────────────────────────────────────
      # Security-IAC unit tests + root npm test + worker D1 schema (vitest
      # against the 1064-case suite). This is the long pole and the primary
      # justification for sharding — letting it own a dedicated runner instead
      # of blocking lint/typecheck/a11y behind it.
      - name: 'Security: Unit tests'
        if: matrix.shard == 'tests'
        run: npx vitest run tests/unit/worker/sec-iac-03-adminOAuth.test.js tests/unit/worker/sec-iac-04-public-read-only.test.js tests/unit/worker/sec-iac-05-signed-mutations.test.js tests/unit/worker/sec-iac-07-iac-smoke.test.js

      - name: 'Quality: Unit + Contract + Guards'
        if: matrix.shard == 'tests'
        run: npm test

      # ── OCR-docs brain checkout (for OSE-323 UEC drift check) ──────────────
      # The drift check in workers/oursharedevents/tests/uec-drift-check.spec.ts
      # (vitest) compares the OSE consumed UEC copy against the brain canonical.
      # vitest.config.mts reads the brain artifact at config time and injects
      # TEST_BRAIN_UEC_JSON. When BRAIN_DIR is absent, the drift gate SKIPS
      # locally; this step ensures it FIRES in CI by checking out OCR-docs
      # and pointing BRAIN_DIR at it.
      - name: 'Checkout OCR-docs brain (for OSE-323 drift check)'
        if: matrix.shard == 'tests'
        uses: actions/checkout@v4
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: ocr-docs-brain-checkout
          # OCR-docs is private; needs the cross-repo read token (same one
          # brain-contract-check.yml uses). Default GITHUB_TOKEN can't read
          # across private repos.
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}

      - name: 'Quality: Worker D1 schema'
        if: matrix.shard == 'tests'
        run: npm test
        working-directory: ${{ env.WORKER_DIR }}
        env:
          BRAIN_DIR: ${{ github.workspace }}/ocr-docs-brain-checkout/ocr-docs-brain

      # ── Shard: a11y ────────────────────────────────────────────────────────
      # axe-core WCAG 2.0 AA scan via the worker test runner.
      - name: 'Quality: A11Y axe-core WCAG 2.0 AA scan'
        if: matrix.shard == 'a11y'
        run: npm run test:a11y
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: invariants (OSE-350) ────────────────────────────────────────
      # The STRUCTURAL subset of the 0-architecture invariant suite — the
      # code-shape locks that read source files via node:fs and assert the
      # brain's architectural contracts hold. These need no deployed worker,
      # so they gate EVERY PR + push here in T0 Gate.
      #
      # Why this exists: before OSE-350 the entire 0-architecture suite ran
      # only in T4 Functional, which is dispatch-only. That meant the brain's
      # "CI-enforced contracts" were NOT enforced on normal development — a PR
      # could break an invariant's code shape and nothing caught it unless
      # someone manually dispatched T4. This shard closes that
      # enforcement-continuity gap: invariants are carried from 0 through the
      # whole flow.
      #
      # ONLY the structural subset runs here. Runtime invariant specs
      # (anonymous-id, geo-resolution, ncr-accumulation, uec-codes) need a
      # deployed worker and stay in T4 / post-deploy tiers. The file list
      # below is locked by the placement guard in
      # tests/integration/infra-consistency.test.js — a new structural
      # invariant spec that is not listed here fails that guard, so the
      # continuity cannot silently regress.
      - name: 'Architecture: structural invariants'
        if: matrix.shard == 'invariants'
        run: |
          npx playwright install chromium
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts \
            tests/e2e/0-architecture/pii-retention.invariant.spec.ts \
            tests/e2e/0-architecture/runner-environment.invariant.spec.ts \
            tests/e2e/0-architecture/runner-pool-readiness.invariant.spec.ts \
            tests/e2e/0-architecture/tier-equity.invariant.spec.ts

  # ============================================================================
  # TIER 1: DEPLOY — Push to main or dispatch
  # ============================================================================
  deploy-staging:
    name: 'T1 Deploy → Staging'
    runs-on: self-hosted
    needs: [security, gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      # ────────────────────────────────────────────────────────────────────
      # Post-migration canonical-shape verification (OSE-209 hardening).
      #
      # Asserts the staging D1 schema, AFTER wrangler applies migrations,
      # matches the canonical set defined in
      #   workers/oursharedevents/tests/migration-smoke.spec.ts
      # (DB_TABLES, FORMS_DB_TABLES, EXPECTED_TRIGGER_COUNT_*).
      #
      # The earlier version of these steps asserted COUNT(*) against a
      # hardcoded 6-table list (DB) / 5-table list (FORMS_DB) and never
      # got updated as new migrations landed (0010, 0014, 0019-0023, 0026,
      # 0009-FORMS, etc.). That drift silently masked real-D1 regressions
      # — the same regressions the PR-time miniflare smoke test (OSE-209)
      # already catches in vitest. Now both layers reference the same
      # canonical set, name-based, with a trigger=0 invariant on top.
      # ────────────────────────────────────────────────────────────────────

      - name: 'Verify staging D1 (canonical shape from migration-smoke.spec.ts, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          # OSE-303: extract canonical lists from migration-smoke.spec.ts
          # at runtime instead of copying them here. The spec is the
          # SINGLE source of truth — workflow MUST NOT carry a duplicate.
          # Previous drift (PR #213) silently broke deploys for ~2 weeks
          # because the spec was updated and the workflow's copy wasn't.
          # See OSE-303 for the discipline rationale.
          EXPECTED_DB=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract DB_TABLES from spec (regex likely broken; check tests/migration-smoke.spec.ts'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 10) { console.error('::error::OSE-303: extracted ' + n.length + ' DB_TABLES; expected >= 10 (regex likely broken)'); process.exit(1); }
          console.log(n.join(' '));
          ")
          EXPECTED_FORMS=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const FORMS_DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract FORMS_DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 3) { console.error('::error::OSE-303: extracted ' + n.length + ' FORMS_DB_TABLES; expected >= 3'); process.exit(1); }
          console.log(n.join(' '));
          ")
          DB_COUNT=$(echo "$EXPECTED_DB" | wc -w | tr -d ' ')
          FORMS_COUNT=$(echo "$EXPECTED_FORMS" | wc -w | tr -d ' ')

          fetch_names() {
            local DB=$1; local OBJ=$2
            npx wrangler d1 execute "$DB" --env staging --remote --json \
              --command "SELECT name FROM sqlite_master WHERE type='$OBJ' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'd1_%' ORDER BY name" \
              | jq -r '.[0].results[].name' | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]*$//'
          }

          ACTUAL_DB=$(fetch_names ocr-db-staging table)
          if [ "$ACTUAL_DB" != "$EXPECTED_DB" ]; then
            echo "::error::DB table-set drift on staging."
            echo "  Expected: [$EXPECTED_DB]"
            echo "  Got:      [$ACTUAL_DB]"
            echo "  Update tests/migration-smoke.spec.ts DB_TABLES — workflow extracts from the spec automatically (OSE-303), so updating the spec is sufficient."
            exit 1
          fi
          echo "✓ DB: $DB_COUNT canonical tables verified by name (extracted from spec)"

          ACTUAL_FORMS=$(fetch_names ocr-forms-db-staging table)
          if [ "$ACTUAL_FORMS" != "$EXPECTED_FORMS" ]; then
            echo "::error::FORMS_DB table-set drift on staging."
            echo "  Expected: [$EXPECTED_FORMS]"
            echo "  Got:      [$ACTUAL_FORMS]"
            echo "  Update tests/migration-smoke.spec.ts FORMS_DB_TABLES — workflow extracts from the spec automatically (OSE-303)."
            exit 1
          fi
          echo "✓ FORMS_DB: $FORMS_COUNT canonical tables verified by name (extracted from spec)"

          # Triggers: must be zero on both DBs (migration 0025 documented
          # that triggers were removed; D1 parser breaks on ; in trigger
          # bodies, so state-machine enforcement lives in app code).
          DB_TRIGGERS=$(fetch_names ocr-db-staging trigger)
          if [ -n "$DB_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in staging DB: [$DB_TRIGGERS]"
            echo "  Migration 0025 documents triggers were removed; any new trigger must justify reintroducing the wrangler-parser fragility."
            exit 1
          fi
          FORMS_TRIGGERS=$(fetch_names ocr-forms-db-staging trigger)
          if [ -n "$FORMS_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in staging FORMS_DB: [$FORMS_TRIGGERS]"
            exit 1
          fi
          echo "✓ Triggers: 0 on both DBs (matches canonical)"

          echo "{\"type\":\"OSE_209_POST_WRANGLER_SMOKE_STAGING\",\"tables_db\":$DB_COUNT,\"tables_forms\":$FORMS_COUNT,\"triggers_db\":0,\"triggers_forms\":0}"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Health check passed"

  # ============================================================================
  # TIER 2: SMOKE — Post-deploy + nightly + dispatch
  # ============================================================================
  smoke-staging:
    name: 'T2 Smoke → Staging'
    runs-on: self-hosted
    needs: [security, gate, deploy-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'Security smoke: XSS + auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast gates'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: 'Forms: endpoint smoke (4 types + admin + validation)'
        id: forms-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/form-endpoints.spec.ts
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure' || steps.forms-smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}, Forms: ${{ steps.forms-smoke.outcome }}"
          exit 1

  # ============================================================================
  # TIER 3: CONTRACT — Newman API + Pages (post-deploy + nightly)
  # ============================================================================
  contract-staging:
    name: 'T3 Contract → Staging'
    runs-on: self-hosted
    needs: [security, gate, deploy-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # CF Access preflight probe (OSE-349) — diagnostic only, does not gate.
      # Hits a read-only admin path with the same credentials Newman uses,
      # classifies the response, and writes an actionable diagnosis to the
      # step summary. Lets Newman remain the source of truth per the
      # tests-surface-truth doctrine, but auto-classifies the next failure.
      - name: CF Access preflight probe
        id: preflight
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e
          URL="https://stg.oursharedevents.com/api/v2/admin/sponsors"
          BODY_FILE="$RUNNER_TEMP/preflight.body"
          response=$(curl -sS -o "$BODY_FILE" -w '%{http_code}|%{content_type}|%{size_download}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Authorization: Bearer $ADMIN_KEY" \
            "$URL")
          curl_exit=$?
          IFS='|' read -r status content_type size <<< "$response"

          {
            echo "## CF Access Preflight Probe"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| URL | \`$URL\` |"
            echo "| HTTP status | \`$status\` |"
            echo "| Content-Type | \`$content_type\` |"
            echo "| Body size | \`$size\` bytes |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          classification=unknown
          if [ "$curl_exit" -ne 0 ]; then
            classification=network
            echo "⚠ **Result:** \`curl\` exited $curl_exit before the response classified (network/DNS issue). Newman will retry." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Preflight network error::curl exit=$curl_exit"
          elif [ "$status" = "200" ] && echo "$content_type" | grep -q "application/json"; then
            classification=ok
            echo "✅ **Result:** Preflight OK — CF Access edge **and** worker \`ADMIN_KEY\` both accepting CI credentials." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$content_type" | grep -q "text/html"; then
            classification=cf_access_shadow
            {
              echo "❌ **Result:** **CF Access service-token rejected.** Response is HTML (login challenge), not JSON."
              echo ""
              echo "**Almost certainly:** \`CF_ACCESS_CLIENT_ID\` / \`CF_ACCESS_CLIENT_SECRET\` repo secrets are stale (token rotated in Cloudflare). See [OSE-349](https://linear.app/oursharedevents/issue/OSE-349) for the full fix path."
              echo ""
              echo "**Newman API smoke will fail on the OSE-INV5 sponsor covenant seed.** Do not re-run blindly — fix the service token first."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CF Access preflight failed::Service token rejected (HTML response). See OSE-349. Likely cause: CF_ACCESS_CLIENT_ID/SECRET stale after Cloudflare rotation."
          elif [ "$status" = "401" ] && echo "$content_type" | grep -q "application/json"; then
            classification=worker_auth
            {
              echo "❌ **Result:** CF Access accepted the service token, but the worker rejected the \`ADMIN_KEY\` Bearer (401 JSON)."
              echo ""
              echo "Update the \`ADMIN_KEY\` repo secret. Different cause from OSE-349 — file a sibling ticket if persistent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Worker auth preflight failed::ADMIN_KEY rejected by worker (401 JSON)."
          else
            classification=unexpected
            body_preview=$(head -c 500 "$BODY_FILE" 2>/dev/null | tr -d '\r' | tr '\n' ' ')
            {
              echo "⚠ **Result:** Unexpected response shape — manual investigation needed."
              echo ""
              echo "**Body preview (first 500 chars):**"
              echo ""
              echo '```'
              echo "$body_preview"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Preflight unexpected::status=$status content_type=$content_type — see step summary"
          fi

          echo "preflight_status=$classification" >> "$GITHUB_OUTPUT"
          echo "preflight_http_code=$status" >> "$GITHUB_OUTPUT"
          echo "Preflight classification: $classification (HTTP $status, $content_type, $size bytes)"
          exit 0

      - name: Newman API smoke
        id: newman-api
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          # CF Access service token — required for section 11 (Sponsor Covenant)
          # which seeds + cleans up admin sponsors. The seed/cleanup POSTs hit
          # /api/v2/admin/* which CF Access shadows at the edge with a 302/HTML
          # redirect before the request reaches the worker. Forwarding the
          # service token bypasses CF Access at the edge while preserving the
          # worker-side Bearer auth check. Without these secrets the covenant
          # test fails loudly (not silently) — see section 11 seed tests.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx newman run postman/collections/ose-api.json \
            -e postman/environments/ose-staging.json \
            --env-var "adminKey=$ADMIN_KEY" \
            --env-var "ocrInternalSecret=$X_OCR_INTERNAL" \
            --env-var "cfAccessClientId=$CF_ACCESS_CLIENT_ID" \
            --env-var "cfAccessClientSecret=$CF_ACCESS_CLIENT_SECRET" \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-api-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Newman Pages smoke
        id: newman-pages
        run: |
          npx newman run postman/collections/ose-pages.json \
            -e postman/environments/ose-staging.json \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-pages-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-staging-${{ github.run_number }}
          path: .test-results/
          retention-days: 14

      - name: Fail check
        if: steps.newman-api.outcome == 'failure' || steps.newman-pages.outcome == 'failure'
        run: |
          echo "::error::Contract failed — API: ${{ steps.newman-api.outcome }}, Pages: ${{ steps.newman-pages.outcome }}"
          exit 1

  # ============================================================================
  # TIER 4: FUNCTIONAL — Playwright API + UI (on-demand only)
  # ============================================================================
  functional-staging:
    name: 'T4 Functional → Staging'
    runs-on: self-hosted
    needs: [security, gate]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_functional == 'true'
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'T4a: Architecture Invariants'
        id: arch-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/0-architecture/
        timeout-minutes: 3

      - name: 'T4b: Core Journeys'
        id: journey-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/3-flows/sponsor-journey.spec.ts
        timeout-minutes: 5

      - name: 'T4c: Form E2E (4 types + flows + validation)'
        id: form-e2e-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            tests/e2e/2-pages/form-registration.spec.ts \
            tests/e2e/2-pages/form-checkin.spec.ts \
            tests/e2e/2-pages/form-email-signup.spec.ts \
            tests/e2e/2-pages/form-survey.spec.ts \
            tests/e2e/3-flows/form-submission-flows.spec.ts \
            tests/e2e/4-negative/form-validation.spec.ts
        timeout-minutes: 10

      - name: 'T4d: UI Smoke'
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: npm run test:ui:smoke
        timeout-minutes: 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Report results
        if: always()
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: "Functional Results"
          path: ".test-results/*-junit.xml"
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T4 Functional Results" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| T4a Architecture Invariants | \`${{ steps.arch-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4b Core Journeys | \`${{ steps.journey-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c Form E2E (4 types) | \`${{ steps.form-e2e-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4d UI Smoke | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # TIER 1P: DEPLOY → Production (tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: 'T1 Deploy → Production'
    runs-on: self-hosted
    needs: [security, gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database"; exit 1
          fi
          echo "✓ Production DB isolation verified"

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env production --remote

      # Canonical-shape verification on production. Mirror of the staging
      # step in T1 Deploy → Staging; keep both in sync. Source of truth:
      # workers/oursharedevents/tests/migration-smoke.spec.ts.
      - name: 'Verify production D1 (canonical shape from migration-smoke.spec.ts, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          # OSE-303: same spec-as-source-of-truth extraction as the
          # staging step above. Mirror by intent — both production and
          # staging consume the SAME canonical tables list because
          # migrations apply identically. Drift between prod and staging
          # would itself be a separate alarm (migrations out of sync).
          EXPECTED_DB=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 10) { console.error('::error::OSE-303: extracted ' + n.length + ' DB_TABLES; expected >= 10'); process.exit(1); }
          console.log(n.join(' '));
          ")
          EXPECTED_FORMS=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const FORMS_DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract FORMS_DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 3) { console.error('::error::OSE-303: extracted ' + n.length + ' FORMS_DB_TABLES; expected >= 3'); process.exit(1); }
          console.log(n.join(' '));
          ")
          DB_COUNT=$(echo "$EXPECTED_DB" | wc -w | tr -d ' ')
          FORMS_COUNT=$(echo "$EXPECTED_FORMS" | wc -w | tr -d ' ')

          fetch_names() {
            local DB=$1; local OBJ=$2
            npx wrangler d1 execute "$DB" --env production --remote --json \
              --command "SELECT name FROM sqlite_master WHERE type='$OBJ' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'd1_%' ORDER BY name" \
              | jq -r '.[0].results[].name' | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]*$//'
          }

          ACTUAL_DB=$(fetch_names ocr-db-production table)
          if [ "$ACTUAL_DB" != "$EXPECTED_DB" ]; then
            echo "::error::DB table-set drift on production."
            echo "  Expected: [$EXPECTED_DB]"
            echo "  Got:      [$ACTUAL_DB]"
            exit 1
          fi
          echo "✓ Production DB: $DB_COUNT canonical tables verified by name (extracted from spec)"

          ACTUAL_FORMS=$(fetch_names ocr-forms-db-production table)
          if [ "$ACTUAL_FORMS" != "$EXPECTED_FORMS" ]; then
            echo "::error::FORMS_DB table-set drift on production."
            echo "  Expected: [$EXPECTED_FORMS]"
            echo "  Got:      [$ACTUAL_FORMS]"
            exit 1
          fi
          echo "✓ Production FORMS_DB: $FORMS_COUNT canonical tables verified by name (extracted from spec)"

          DB_TRIGGERS=$(fetch_names ocr-db-production trigger)
          if [ -n "$DB_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in production DB: [$DB_TRIGGERS]"
            exit 1
          fi
          FORMS_TRIGGERS=$(fetch_names ocr-forms-db-production trigger)
          if [ -n "$FORMS_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in production FORMS_DB: [$FORMS_TRIGGERS]"
            exit 1
          fi
          echo "✓ Production triggers: 0 on both DBs"

          echo "{\"type\":\"OSE_209_POST_WRANGLER_SMOKE_PRODUCTION\",\"tables_db\":$DB_COUNT,\"tables_forms\":$FORMS_COUNT,\"triggers_db\":0,\"triggers_forms\":0}"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          VERSION="${GITHUB_REF_NAME:-prod-$(git rev-parse --short HEAD)}"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Production health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Production health check passed"

  # ============================================================================
  # TIER 2P: SMOKE → Production (tag only)
  #
  # NOTE — stamp cache will ALWAYS miss here, and that is intentional.
  #
  # deploy-production (the job that precedes this one) uses the default
  # clean: true checkout, which runs `git clean -ffdx` and wipes the entire
  # workspace — including root node_modules/ and its .install-stamp.
  # By the time smoke-production runs, the stamp file is gone, so the
  # stamp check below falls through and npm ci always runs fresh.
  #
  # This is the correct behaviour for production smoke:
  #   - deploy-production gets a guaranteed-clean workspace (SRE doctrine)
  #   - smoke-production inherits that cleanliness — it never tests against
  #     a stale cached node_modules from a prior unrelated run
  #   - The "skipping npm ci" log line will never appear in this job
  #
  # If you see "skipping npm ci" here, investigate — it means deploy-production
  # did NOT run before this job (e.g. needs: chain changed) and the previous
  # run's workspace state leaked in, which would be a bug.
  # ============================================================================
  smoke-production:
    name: 'T2 Smoke → Production'
    runs-on: self-hosted
    needs: [security, gate, deploy-production]
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'Security smoke: XSS + auth'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
          retention-days: 30

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Production smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: 'Pipeline Summary'
    runs-on: self-hosted
    needs: [security, gate, deploy-staging, smoke-staging, contract-staging, functional-staging, deploy-production, smoke-production]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## OurSharedEvents CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| S0 Security | security | \`${{ needs.security.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T0 Gate | gate | \`${{ needs.gate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy STG | deploy-staging | \`${{ needs.deploy-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke STG | smoke-staging | \`${{ needs.smoke-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T3 Contract STG | contract-staging | \`${{ needs.contract-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4 Functional STG | functional-staging | \`${{ needs.functional-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy PROD | deploy-production | \`${{ needs.deploy-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke PROD | smoke-production | \`${{ needs.smoke-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
