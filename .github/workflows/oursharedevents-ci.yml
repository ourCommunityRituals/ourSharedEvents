# OurSharedEvents – CI/CD Pipeline
#
# Test Pyramid in one workflow:
#
#   Tier 0: Gate        — Static analysis, unit, contract (every push/PR)
#   Tier 1: Deploy      — D1 migrations, wrangler deploy, health check (push to main)
#   Tier 2: Smoke       — Security XSS + IAC health + fail-fast (post-deploy + nightly)
#   Tier 3: Contract    — Newman API + Pages contract checks (post-deploy)
#   Tier 4: Functional  — Playwright API + UI full suite (on-demand only)
#
# Trigger Matrix:
#   | Event            | Gate | Deploy | Smoke | Contract | Functional |
#   |------------------|------|--------|-------|----------|------------|
#   | PR to main       | ✅   | ❌     | ❌    | ❌       | ❌         |
#   | Push to main     | ✅   | ✅     | ✅    | ✅       | ❌         |
#   | Tag vX.Y.Z       | ✅   | →prod  | →prod | ❌       | ❌         |
#   | Schedule (nightly)| ✅  | ❌     | ✅    | ✅       | ❌         |
#   | Dispatch          | ✅   | opt    | opt   | opt      | opt        |
#
# Cost control: Functional (Tier 4) only runs when you check the box.
# Move tests between Tier 2/3/4 as you settle on nightly vs on-demand.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN_OSE      (Cloudflare API token)
#   - CLOUDFLARE_ACCOUNT_ID         (Cloudflare account ID)
#   - ADMIN_KEY                     (Bearer token for /admin routes)
#   - X_OCR_INTERNAL                (CI/CD auth secret)
#   - CF_ACCESS_CLIENT_ID           (Cloudflare Access service token)
#   - CF_ACCESS_CLIENT_SECRET       (Cloudflare Access service token secret)

name: OurSharedEvents CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'postman/**'
      - 'playwright.*.config.*'
      - '.github/workflows/oursharedevents-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'postman/**'
      - 'playwright.*.config.*'
      - '.github/workflows/oursharedevents-ci.yml'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '7 3 * * *'  # Nightly 3:07 AM UTC — Gate + Smoke + Contract (no deploy)
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        type: boolean
        default: false
      deploy_production:
        description: 'Deploy to production (type PRODUCTION)'
        type: string
      run_functional:
        description: 'Run full functional suite (Tier 4 — expensive)'
        type: boolean
        default: false
      force_clean:
        description: 'Force npm ci regardless of stamp (bust corrupt node_modules)'
        type: boolean
        default: false

concurrency:
  group: ose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # TIER 0: GATE — Every push, every PR
  # ============================================================================
  gate:
    name: 'T0 Gate'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: 'Security: Banned origins'
        run: npm run check:banned-origins

      - name: 'Security: Unit tests'
        run: npx vitest run tests/unit/worker/sec-iac-03-adminOAuth.test.js tests/unit/worker/sec-iac-04-public-read-only.test.js tests/unit/worker/sec-iac-05-signed-mutations.test.js tests/unit/worker/sec-iac-07-iac-smoke.test.js

      - name: 'Quality: Lint'
        run: npx eslint config/ scripts/ tests/unit/ tests/contract/ --cache --cache-location node_modules/.eslintcache

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: TypeScript'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: Unit + Contract + Guards'
        run: npm test

      - name: 'Quality: Worker D1 schema'
        run: npm test
        working-directory: ${{ env.WORKER_DIR }}

  # ============================================================================
  # TIER 1: DEPLOY — Push to main or dispatch
  # ============================================================================
  deploy-staging:
    name: 'T1 Deploy → Staging'
    runs-on: self-hosted
    needs: [gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      - name: Verify D1 tables (main DB — 6 tables)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "6"; then echo "::error::Expected 6 tables"; exit 1; fi
          echo "✓ 6 tables verified"

      - name: Verify D1 tables (forms DB — 5 tables)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-forms-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "5"; then echo "::error::Expected 5 tables"; exit 1; fi
          echo "✓ 5 tables verified"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Health check passed"

  # ============================================================================
  # TIER 2: SMOKE — Post-deploy + nightly + dispatch
  # ============================================================================
  smoke-staging:
    name: 'T2 Smoke → Staging'
    runs-on: self-hosted
    needs: [gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'Security smoke: XSS + auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast gates'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # TIER 3: CONTRACT — Newman API + Pages (post-deploy + nightly)
  # ============================================================================
  contract-staging:
    name: 'T3 Contract → Staging'
    runs-on: self-hosted
    needs: [gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Newman API smoke
        id: newman-api
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: |
          npx newman run postman/collections/ose-api.json \
            -e postman/environments/ose-staging.json \
            --env-var "adminKey=$ADMIN_KEY" \
            --env-var "ocrInternalSecret=$X_OCR_INTERNAL" \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-api-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Newman Pages smoke
        id: newman-pages
        run: |
          npx newman run postman/collections/ose-pages.json \
            -e postman/environments/ose-staging.json \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-pages-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-staging-${{ github.run_number }}
          path: .test-results/
          retention-days: 14

      - name: Fail check
        if: steps.newman-api.outcome == 'failure' || steps.newman-pages.outcome == 'failure'
        run: |
          echo "::error::Contract failed — API: ${{ steps.newman-api.outcome }}, Pages: ${{ steps.newman-pages.outcome }}"
          exit 1

  # ============================================================================
  # TIER 4: FUNCTIONAL — Playwright API + UI (on-demand only)
  # ============================================================================
  functional-staging:
    name: 'T4 Functional → Staging'
    runs-on: self-hosted
    needs: [gate]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_functional == 'true'
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'T4a: Architecture Invariants'
        id: arch-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/0-architecture/
        timeout-minutes: 3

      - name: 'T4b: Core Journeys'
        id: journey-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/3-flows/sponsor-journey.spec.ts
        timeout-minutes: 5

      - name: 'T4c: UI Smoke'
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
        run: npm run test:ui:smoke
        timeout-minutes: 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Report results
        if: always()
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: "Functional Results"
          path: ".test-results/*-junit.xml"
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T4 Functional Results" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| T4a Architecture Invariants | \`${{ steps.arch-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4b Core Journeys | \`${{ steps.journey-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c UI Smoke | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # TIER 1P: DEPLOY → Production (tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: 'T1 Deploy → Production'
    runs-on: self-hosted
    needs: [gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database"; exit 1
          fi
          echo "✓ Production DB isolation verified"

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env production --remote

      - name: Verify D1 tables (main — 6, forms — 5)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          R1=$(npx wrangler d1 execute ocr-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$R1"
          if ! echo "$R1" | grep -q "6"; then echo "::error::Expected 6 main tables"; exit 1; fi
          R2=$(npx wrangler d1 execute ocr-forms-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$R2"
          if ! echo "$R2" | grep -q "5"; then echo "::error::Expected 5 forms tables"; exit 1; fi
          echo "✓ All tables verified"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          VERSION="${GITHUB_REF_NAME:-prod-$(git rev-parse --short HEAD)}"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Production health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Production health check passed"

  # ============================================================================
  # TIER 2P: SMOKE → Production (tag only)
  #
  # NOTE — stamp cache will ALWAYS miss here, and that is intentional.
  #
  # deploy-production (the job that precedes this one) uses the default
  # clean: true checkout, which runs `git clean -ffdx` and wipes the entire
  # workspace — including root node_modules/ and its .install-stamp.
  # By the time smoke-production runs, the stamp file is gone, so the
  # stamp check below falls through and npm ci always runs fresh.
  #
  # This is the correct behaviour for production smoke:
  #   - deploy-production gets a guaranteed-clean workspace (SRE doctrine)
  #   - smoke-production inherits that cleanliness — it never tests against
  #     a stale cached node_modules from a prior unrelated run
  #   - The "skipping npm ci" log line will never appear in this job
  #
  # If you see "skipping npm ci" here, investigate — it means deploy-production
  # did NOT run before this job (e.g. needs: chain changed) and the previous
  # run's workspace state leaked in, which would be a bug.
  # ============================================================================
  smoke-production:
    name: 'T2 Smoke → Production'
    runs-on: self-hosted
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'Security smoke: XSS + auth'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
          retention-days: 30

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Production smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: 'Pipeline Summary'
    runs-on: self-hosted
    needs: [gate, deploy-staging, smoke-staging, contract-staging, functional-staging, deploy-production, smoke-production]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## OurSharedEvents CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| T0 Gate | gate | \`${{ needs.gate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy STG | deploy-staging | \`${{ needs.deploy-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke STG | smoke-staging | \`${{ needs.smoke-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T3 Contract STG | contract-staging | \`${{ needs.contract-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4 Functional STG | functional-staging | \`${{ needs.functional-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy PROD | deploy-production | \`${{ needs.deploy-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke PROD | smoke-production | \`${{ needs.smoke-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
