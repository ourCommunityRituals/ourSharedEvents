# OurSharedEvents – CI/CD Pipeline
#
# S0 Security → T0 Gate → T1 Deploy → [T2 Smoke, T3 Contract]
#                                   → T4 Functional (dispatch only)
#
# Security runs unconditionally on every PR (no paths filter on pull_request trigger).
# Gate and all downstream jobs are blocked behind security via needs: — security results
# determine whether the rest of the pipeline runs at all.
# Push-to-main keeps paths filtering (deployment is expensive; path-scoping is fine there).
#
#   S0: Security — Static vulnerability analysis + supply chain inventory
#       - CodeQL SAST (JS/TS)          → github/codeql-action/analyze@v4
#       - Semgrep SAST                 → p/nodejs + p/owasp-top-ten + p/r2c-security-audit
#       - detect-secrets               → Yelp detect-secrets baseline scan (secret gate; OSE-911)
#       - npm audit (CVE check)        → npm audit --omit=dev --audit-level=moderate
#       - SBOM generation              → npx @cyclonedx/cyclonedx-npm --omit dev
#
#   T0: Gate — Static quality + unit/contract tests
#       - Banned origins check         → npm run check:banned-origins
#       - Security unit tests          → vitest run tests/unit/worker/sec-iac-{03,04,05,07}
#       - Lint                         → eslint config/ scripts/ tests/unit/ tests/contract/
#       - TypeScript typecheck         → tsc --noEmit (workers/oursharedevents)
#       - Unit + contract + guards     → npm test (root)
#       - Worker D1 schema             → npm test (workers/oursharedevents)
#
#   T1: Deploy — Migrations, deploy, health check
#       - D1 migrations (main + forms) → wrangler d1 migrations apply {DB,FORMS_DB} --remote
#       - Canonical-shape verification → assert tables-by-name match the spec at
#                                        workers/oursharedevents/tests/migration-smoke.spec.ts
#                                        (extracted at workflow runtime per OSE-303 —
#                                        no hard-coded copy in this workflow)
#                                        + 0 triggers, BY NAME, against the
#                                        canonical set in
#                                        tests/migration-smoke.spec.ts (OSE-209)
#       - Deploy                       → wrangler deploy
#       - Health check                 → curl /health (HTTP 200)
#
# Fail-fast test chain after T1 deploy: T2 Contract → T3 E2E Smoke → T4
# Functional. Each stage `needs:` the prior and gates on its success, so a red
# stage SKIPS everything downstream — fix one layer at a time. Newman-first:
# nail the API contract, then perpetuate into the FE.
#
#   T2: Contract (Newman) — API + Pages spec compliance [runs first]
#       - Newman API collection        → newman run postman/collections/ose-api.json
#       - Newman Pages collection      → newman run postman/collections/ose-pages.json
#
#   T3: E2E Smoke (Playwright) — XSS, auth boundaries, fail-fast gates, forms
#       [runs only if T2 Contract passed]
#       - Security smoke               → playwright tests/e2e/1-smoke/security-smoke.spec.js
#       - IAC health + fail-fast       → playwright tests/api/smoke/{api-health,fail-fast-gates}.spec.ts
#       - Form endpoint smoke          → playwright tests/api/smoke/form-endpoints.spec.ts
#
#   T4: Functional — End-to-end journeys [runs only if T3 E2E Smoke passed]
#       - Architecture invariants      → playwright tests/e2e/0-architecture/
#       - Core journeys                → playwright tests/e2e/3-flows/sponsor-journey.spec.ts
#       - Form E2E (4 types + flows)   → playwright tests/e2e/2-pages/form-*.spec.ts + 3-flows + 4-negative
#       - UI smoke                     → npm run test:ui:smoke
#
# Trigger Matrix:
#   | Event              | Security | Gate | Deploy | Smoke | Contract | Functional |
#   |--------------------|----------|------|--------|-------|----------|------------|
#   | PR to main         | ✅ *     | ✅   | ❌     | ❌    | ❌       | ❌         |
#   | Push to main       | ✅       | ✅   | ✅     | ✅    | ✅       | ❌         |
#   | Tag vX.Y.Z         | ✅       | ✅   | →prod  | →prod | ❌       | ❌         |
#   | Schedule (nightly) | ✅       | ✅   | ❌     | ✅†   | ✅†      | ❌         |
#   | Dispatch           | ✅       | ✅   | opt    | opt   | opt      | opt        |
#   * PR trigger has NO paths filter — security runs on every PR regardless of files changed.
#     Gate/Deploy/Smoke still skip on non-code PRs via their own paths conditions (see push trigger).
#   † Nightly: runs against live staging without redeploying (environmental drift detection)
#
# Cost control: Functional (Tier 4) only runs when you check the box.
# Move tests between Tier 2/3/4 as you settle on nightly vs on-demand.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN_OSE      (Cloudflare API token)
#   - CLOUDFLARE_ACCOUNT_ID         (Cloudflare account ID)
#   - ADMIN_KEY                     (Bearer token for /admin routes)
#   - X_OCR_INTERNAL                (CI/CD auth secret)
#   - CF_ACCESS_CLIENT_ID           (Cloudflare Access service token)
#   - CF_ACCESS_CLIENT_SECRET       (Cloudflare Access service token secret)

name: OurSharedEvents CI/CD

on:
  pull_request:
    branches: [main]
    # No paths filter — security (S0) must scan every PR unconditionally.
    # Gate and all downstream jobs are gated behind security via needs:.
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.ts'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.html'
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'postman/**'
      - 'packages/**'
      - 'playwright.*.config.*'
      - '.github/workflows/**'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '7 3 * * *'  # Nightly 3:07 AM UTC — Gate + Smoke + Contract (no deploy)
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        type: boolean
        default: false
      deploy_production:
        description: 'Deploy to production (type PRODUCTION)'
        type: string
      run_functional:
        description: 'Run full functional suite (Tier 4 — expensive)'
        type: boolean
        default: false
      force_clean:
        description: 'Force npm ci regardless of stamp (bust corrupt node_modules)'
        type: boolean
        default: false

concurrency:
  # OSE-937: key the group by EVENT so a nightly `schedule` run and a `push`-to-main
  # run never share a group. Previously both resolved to `ose-refs/heads/main`, so a
  # scheduled run firing minutes after a merge cancelled the merge's T1 Deploy run
  # (and `schedule` skips T1/T4, so nothing deployed). cancel-in-progress is scoped to
  # pull_request only — PR pushes still supersede their own stale runs for fast
  # feedback, but a merge's deploy run is never cancelled out from under it.
  group: ose-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # S0: SECURITY — CodeQL SAST + SBOM (runs before test pyramid)
  # ============================================================================
  security:
    name: 'S0 Security'
    runs-on: ubuntu-latest   # OSE-1017: managed runner (self-hosted Smart App Control blocks unsigned semgrep.exe)
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          FLAGS_NM=node_modules/@ocr/flags/package.json
          # The install-stamp lets us skip `npm ci` when package-lock.json is
          # unchanged. But the "Fix @ocr/flags for SBOM resolution" step later
          # in THIS job destructively strips devDependencies from @ocr/flags
          # IN PLACE, and self-hosted runners persist node_modules between
          # runs. The lockfile hash doesn't change when only @ocr/flags is
          # mutated, so a naive stamp-skip would let `npm audit` run against
          # the mutated tree — the npm registry then rejects the submitted
          # tree with `400 Bad Request — Invalid package tree`.
          #
          # SELF-HEALING GUARD: the stamp is only trustworthy if @ocr/flags
          # in node_modules still carries its devDependencies. If they're gone
          # (SBOM step already ran on this runner) or the file is unparseable,
          # node_modules is mutated → force a fresh `npm ci`. This recovers on
          # the very next run with no force_clean dispatch needed, and catches
          # corruption from ANY source, not just the known SBOM step.
          flags_mutated=false
          if [ -f "$FLAGS_NM" ]; then
            node -e "const p=JSON.parse(require('fs').readFileSync('$FLAGS_NM','utf8'));process.exit(p.devDependencies?0:1)" 2>/dev/null || flags_mutated=true
          fi
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ "$flags_mutated" = 'false' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            if [ "$flags_mutated" = 'true' ]; then
              echo "node_modules/@ocr/flags is mutated (devDependencies stripped by a prior SBOM run) — forcing fresh npm ci"
            fi
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # ── CodeQL moved out (Sweep 9 #2, 2026-05-14) ───────────────────────
      # CodeQL javascript-typescript analysis lived here AND in codeql.yml
      # — same trigger set, same analysis target, ~2.4 min each on
      # Bloodraven (measured on PR #160). The duplicate burned a runner
      # slot for no signal gain. codeql.yml is now the canonical entry
      # point: it owns the pull_request + push + scheduled + dispatch
      # triggers and emits the SARIF artifact. Keep S0 Security focused on
      # the non-CodeQL scanners (Semgrep, detect-secrets, npm audit, SBOM)
      # where the duplication didn't exist.

      # ── Semgrep + detect-secrets (Python-based) ──────────────────────────
      - name: Set up Python for Semgrep + detect-secrets
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Semgrep SAST
        run: |
          # OSE-1017: managed ubuntu runner. Fresh setup-python + pip, semgrep lands
          # on PATH directly — no cygpath/Scripts dance and no OSE-919 pip-repair
          # (those were self-hosted tool-Python drift workarounds, moot on ephemeral
          # runners). Pin per OSE-1016 so a bad upstream release can't crash the gate
          # (exit 2 TypeError). An install failure is flagged infra (::error + exit 1),
          # never read as a clean pass or a finding.
          python -m pip install "semgrep==1.163.0" --quiet \
            || { echo "::error::semgrep install failed (infra) — not a security finding"; exit 1; }
          semgrep --version || { echo "::error::semgrep unavailable on runner"; exit 1; }
          semgrep scan \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --error \
            --exclude=node_modules \
            --exclude=.wrangler \
            --exclude=coverage \
            --exclude=dist \
            --exclude=.claude \
            --json-output=semgrep-results.json || SEMGREP_EXIT=$?
          FINDING_COUNT=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo 0)
          echo "- **Semgrep:** $FINDING_COUNT findings" >> $GITHUB_STEP_SUMMARY
          exit ${SEMGREP_EXIT:-0}

      # Committed-secret gate (OSE-911). detect-secrets replaces gitleaks, whose
      # go-re2/wazero WASM-JIT panicked nondeterministically on the self-hosted
      # Windows runners (exit 2 = a tooling crash, not a finding) and intermittently
      # failed this required check. detect-secrets is pure Python (no WASM JIT), so
      # it is stable here. The check compares the scanned (file, hashed_secret) set
      # against the committed .secrets.baseline and fails ONLY on a NEW secret — it
      # is enforcing like gitleaks was (gitleaks used --exit-code 1), not the prior
      # warn-only posture. Version pinned so a scanner upgrade can't silently
      # reclassify the baseline. Semgrep continues to cover SAST.
      - name: detect-secrets scan (committed-secret gate)
        run: |
          python -m pip install 'detect-secrets==1.5.0' --quiet
          python scripts/check-secrets-baseline.py

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

      # file:-linked @ocr/flags exposes its devDependencies to npm ls --all,
      # causing CycloneDX to fail. Strip them from the installed copy so SBOM
      # only inventories production dependencies.
      #
      # IMPORTANT — this step destructively mutates node_modules. Two guards
      # keep `npm audit` from later submitting the mutated tree to the npm
      # registry (which rejects it with `400 — Invalid package tree`):
      #   1. PRIMARY (self-healing): the Install Dependencies step above
      #      detects a stripped @ocr/flags and forces a fresh `npm ci`
      #      regardless of the install-stamp. See its comment block.
      #   2. BELT-AND-SUSPENDERS (this step): invalidate the install-stamp
      #      here so the stamp-hash path ALSO reinstalls next run, even if
      #      the primary detection is ever broken.
      # Diagnosed via workflow_dispatch force_clean=true (run 26111985672 =
      # success vs run 26110784159 same SHA = failure).
      - name: Fix @ocr/flags for SBOM resolution
        run: |
          FLAGS_PKG="node_modules/@ocr/flags/package.json"
          if [ -f "$FLAGS_PKG" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$FLAGS_PKG'));
              delete pkg.devDependencies;
              fs.writeFileSync('$FLAGS_PKG', JSON.stringify(pkg, null, 2));
            "
          fi
          # Belt-and-suspenders — invalidate install stamp; node_modules is no
          # longer pristine after the @ocr/flags mutation above.
          rm -f node_modules/.install-stamp

      - name: Generate SBOM
        run: |
          # --ignore-npm-errors: on GitHub-hosted ubuntu the newer npm marks our
          # own file:-linked workspace package @ocr/flags as `invalid` (ELSPROBLEMS)
          # because it is required via two different relative file: specifiers
          # (root file:../packages/flags + worker file:../../packages/flags) that
          # resolve to one realpath. The self-hosted Windows npm tolerated it; the
          # hosted npm exits 254 and kills cyclonedx (OSE-953 migration). This is a
          # first-party link quirk, not a supply-chain finding — npm audit (above),
          # CodeQL and semgrep are unaffected — so the advisory SBOM tolerates the
          # npm ls error and still inventories the resolvable tree.
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --omit dev --output-file sbom.json --output-format JSON --spec-version 1.5
          COMPONENT_COUNT=$(jq '.components | length' sbom.json 2>/dev/null || echo "unknown")
          echo "## S0 Security" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL:** see separate \`CodeQL\` workflow (canonical entry, Sweep 9)" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** $COMPONENT_COUNT components (CycloneDX 1.5)" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

  # ============================================================================
  # TIER 0: GATE — Every push, every PR
  #
  # Sweep 9 (2026-05-14): sharded into 4 parallel matrix children so the
  # 3-runner Bloodraven pool can execute lint / typecheck / tests / a11y in
  # parallel rather than serial. Baseline: PR #160 measured 6.4 min for the
  # monolithic single job. Expected wall-clock after shard: ~3 min, driven
  # by the gate-tests shard (the long pole due to ~1064 vitest cases).
  #
  # Downstream jobs (`deploy-staging`, `summary`) reference `needs: [gate]`
  # which GitHub Actions resolves to "all matrix children succeeded" — no
  # change required there.
  #
  # Each shard runs identical setup (checkout, setup-node, stage @ocr/flags,
  # install root deps). The per-runner stamp cache (node_modules/.install-stamp)
  # makes the install a near no-op on warm runners, so the duplicated setup
  # cost is bounded to ~30-45s per shard. Worker deps are skipped on the
  # lint shard since eslint only touches root files — absorbs the original
  # Sweep 9 #3 (combine npm ci) win directly into the matrix design.
  # ============================================================================
  gate:
    name: 'T0 Gate (${{ matrix.shard }})'
    needs: [security]
    # OSE-954 (F2 slice, completes OSE-977): the ENTIRE T0 gate now runs on
    # ephemeral GitHub-hosted ubuntu-latest VMs. OSE-977 moved only the heavy
    # `tests` shard (the ~2879-case @cloudflare/vitest-pool-workers suite +
    # chronic OSE-696 workerd-corruption flake source); this slice moves the
    # remaining four — lint, typecheck, a11y, invariants — off the shared
    # self-hosted box as well. Rationale per shard:
    #   • lint / typecheck — pure Node (eslint, tsc, static guards), no workerd,
    #     no browser; zero-risk move.
    #   • a11y / invariants — a11y drives the workerd vitest pool and invariants
    #     drives Playwright/chromium; both are PROVEN green on ubuntu by the
    #     already-migrated `tests` shard, and a fresh per-shard VM gives workerd
    #     the "runs alone on clean hardware" condition that ended the OSE-696
    #     isolate corruption (ECONNRESET / "Failed to start cloudflare-pool
    #     worker" / "Reflect.get on non-object") on the RAM-bound box.
    # The required branch-protection check names derive from `matrix.shard`, so
    # they stay exactly "T0 Gate (<shard>)" — no protection change needed. The
    # Windows-only workerd-lock pre-install step self-skips (`runner.os ==
    # 'Windows'`). Moving the fs-reading structural gates to Linux also removes
    # the Windows path-sep vacuous-green class (OSE-980/981).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # OSE-954: `max-parallel: 1` is REMOVED. Its entire justification was the
      # single RAM-bound self-hosted box — concurrent workerd shards there
      # corrupted the shared isolate (ECONNRESET / "Worker exited unexpectedly"
      # / "Reflect.get called on non-object"). Now that every shard runs on its
      # own ephemeral ubuntu-latest VM there is zero cross-shard contention, so
      # the five shards run fully in parallel (wall-clock win: the gate is now
      # bounded by the slowest single shard, not their serial sum).
      matrix:
        # `invariants` shard (OSE-350) runs the structural 0-architecture
        # invariant tests on EVERY PR + push — see the "Architecture:
        # structural invariants" step below. Before this, the 0-architecture
        # suite ran only in dispatch-only T4 Functional, so the brain's
        # architectural contracts were not gated on normal development.
        shard: [lint, typecheck, tests, a11y, invariants]
    steps:
      # Self-hosted runner cleanup: stale _diag/pages/ log files left by
      # cancelled runs cause checkout to fail with "file already exists".
      # Run on every shard — concurrent rm -rf is safe (idempotent).
      # RUNNER_WORKSPACE = <runner_root>/_work/<repo> — go up two levels.
      - name: 'Clear stale runner diag files'
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # OSE-900: on self-hosted Windows a leftover workerd.exe from a prior job
      # can be pinned by a kernel System (PID 4) image-section handle that only
      # releases on reboot. `npm ci` on a lockfile-changing PR (stamp miss) must
      # delete node_modules and then dies on that locked file with
      # ENOTEMPTY/EPERM — which is why only Dependabot-style PRs fail install.
      # Pre-clear THIS workspace's workerd package so npm never has to delete a
      # locked file: try Remove-Item, else MOVE the dir aside (a directory
      # rename succeeds even when the file inside is section-locked; Remove-Item
      # alone cannot beat it). Path-scoped to $GITHUB_WORKSPACE — never a global
      # `taskkill /IM workerd.exe` — so concurrent jobs on the other runners that
      # share this box are untouched. Idempotent no-op; never fails the job.
      - name: 'Pre-install: clear locked workerd (Windows self-hosted)'
        if: runner.os == 'Windows' && matrix.shard != 'lint' && matrix.shard != 'invariants'
        # Windows PowerShell 5.1 — the self-hosted runners do NOT have pwsh
        # (PowerShell Core) installed. The script below is 5.1-compatible.
        shell: powershell
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          # 1) Kill ONLY workerd processes whose exe lives under this workspace.
          try {
            Get-CimInstance Win32_Process -Filter "Name='workerd.exe'" -ErrorAction Stop |
              Where-Object { $_.ExecutablePath -and $ws -and $_.ExecutablePath.StartsWith($ws, [System.StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object {
                Write-Host "stopping in-workspace workerd PID $($_.ProcessId): $($_.ExecutablePath)"
                try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch {}
              }
          } catch { Write-Host "workerd scan skipped: $($_.Exception.Message)" }
          # 2) Clear every workerd-windows-64 copy: delete, else move aside.
          $targets = @(
            'node_modules\wrangler\node_modules\@cloudflare\workerd-windows-64',
            'node_modules\@cloudflare\workerd-windows-64',
            'node_modules\@cloudflare\vitest-pool-workers\node_modules\wrangler\node_modules\@cloudflare\workerd-windows-64'
          )
          # Quarantine OUTSIDE the checkout (RUNNER_WORKSPACE = parent of the repo
          # dir, same volume) so it never lands in the git tree; it clears on reboot.
          $quarBase = if ($env:RUNNER_WORKSPACE) { $env:RUNNER_WORKSPACE } else { (Get-Location).Path }
          foreach ($t in $targets) {
            $full = Join-Path (Get-Location) $t
            $present = $true
            try { $present = Test-Path $full } catch { $present = $true }  # access-denied => treat as locked/present
            if (-not $present) { continue }
            try {
              Remove-Item -Recurse -Force -ErrorAction Stop $full
              Write-Host "removed $t"
            } catch {
              try {
                $dest = Join-Path $quarBase "_locked_workerd_quarantine_$([System.IO.Path]::GetRandomFileName())"
                [System.IO.Directory]::Move($full, $dest)
                Write-Host "quarantined (move-aside) $t -> $dest"
              } catch {
                Write-Host "WARN: could not clear $t ($($_.Exception.Message)); npm ci will attempt it"
              }
            }
          }
          exit 0

      # Worker deps not needed for the lint shard (eslint targets root paths)
      # nor the invariants shard (structural specs read source via node:fs —
      # they never import worker runtime code). All other shards exercise the
      # worker test suite or worker tsc, so they need
      # workers/oursharedevents/node_modules populated.
      - name: Install worker dependencies
        if: matrix.shard != 'lint' && matrix.shard != 'invariants'
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          # OSE-904: the "Pre-install: clear locked workerd" guard (OSE-900)
          # deletes/quarantines @cloudflare/workerd-windows-64 on EVERY run to
          # beat the image-section lock. The install-stamp alone does not know
          # workerd was cleared, so a lockfile-unchanged PR would skip npm ci and
          # leave workerd absent -> vitest dies at startup ("workerd-windows-64
          # could not be found"). Gate the skip on the workerd binary actually
          # being present so the clear/restore cycle self-heals every run.
          WORKERD=node_modules/@cloudflare/workerd-windows-64/bin/workerd.exe
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ] && [ -f "$WORKERD" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            [ -f "$WORKERD" ] || echo "workerd binary absent (cleared by the pre-install lock guard or a partial install) — forcing npm ci"
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: lint ────────────────────────────────────────────────────────
      # Banned origins + eslint + deprecation-lock guard. Smallest shard,
      # ~30-60s. Root deps only.
      - name: 'Security: Banned origins'
        if: matrix.shard == 'lint'
        run: npm run check:banned-origins

      # Brain Invariant #25 (sponsor_share_covenant, live): the sponsor-facing
      # pricing doc must not claim spend buys size/slot/position/dwell/rank.
      # Static prose-conformance guard (OSE-883); self-contained (brain YAML is
      # not vendored into OSE — same convention as the OSE-336 drift check).
      - name: 'Security: Sponsor pricing covenant (Invariant #25)'
        if: matrix.shard == 'lint'
        run: node scripts/check-sponsor-pricing-covenant.mjs

      # Brain Invariant #10 (deprecation_lock): the canonical instance of
      # the deprecation-lock pattern. OSE migrated off Google Apps Script
      # to Cloudflare Workers + D1; this guard scans the repo for any
      # reintroduced GAS pattern and fails non-zero on hit. A guard that
      # exists in scripts/ but is never invoked by CI is cosmetic — the
      # 0-architecture invariant test
      # tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts
      # asserts this step exists in the workflow.
      #
      # Self-tests run BEFORE the guard itself. The Windows-path
      # regression that hid behind the un-wired self-tests (allowlist
      # silently inert when paths used backslashes; 91 entries loaded,
      # 0 matched) is exactly what an un-tested guard ships. Running the
      # self-tests in CI guarantees the next regression of the same class
      # surfaces in seconds, not months.
      - name: 'Security: Deprecation lock — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-no-gas

      # OSE-696: self-tests for the workerd-pool retry wrapper. Locks the
      # load-bearing property that it passes ONLY on a clean exit-0 run — a
      # teardown crash (which drops a whole spec file) or a real assertion
      # failure can never be masked into a green gate.
      - name: 'Quality: vitest-retry wrapper self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:vitest-retry

      - name: 'Security: Deprecation lock (no-GAS guard)'
        if: matrix.shard == 'lint'
        run: npm run guard:no-gas

      # OSE-803 — schema guard constants must track the migration directories.
      # Static, deps-free, ~1s. Runs on every PR so a forgotten constant bump is
      # a red check pre-merge, not a silently-weakened guard discovered at deploy.
      # The pre-deploy migrations-list gate (deploy jobs below) is the runtime half.
      - name: 'Security: Schema guard constants in step (OSE-803)'
        if: matrix.shard == 'lint'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-schema-guard.mjs

      - name: 'Quality: Lint'
        if: matrix.shard == 'lint'
        run: npx eslint config/ scripts/ tests/unit/ tests/contract/ --cache --cache-location node_modules/.eslintcache

      # Tier-1 static preflight: validates manifest anchors exist in templates
      # without a browser. Catches manifest/template drift in seconds.
      - name: 'Smoke: manifest preflight (static)'
        if: matrix.shard == 'lint'
        run: OSE_TPL=workers/oursharedevents/src/templates npx tsx --test tests/ui/smoke/static-check.test.ts

      # ── Shard: typecheck ───────────────────────────────────────────────────
      # tsc --noEmit on the worker. Standalone shard so a type regression
      # surfaces as a single named check, not buried inside a multi-step job.
      - name: 'Quality: TypeScript'
        if: matrix.shard == 'typecheck'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: tests ───────────────────────────────────────────────────────
      # Security-IAC unit tests + root npm test + worker D1 schema (vitest
      # against the 1064-case suite). This is the long pole and the primary
      # justification for sharding — letting it own a dedicated runner instead
      # of blocking lint/typecheck/a11y behind it.
      - name: 'Security: Unit tests'
        if: matrix.shard == 'tests'
        run: npx vitest run tests/unit/worker/sec-iac-03-adminOAuth.test.js tests/unit/worker/sec-iac-04-public-read-only.test.js tests/unit/worker/sec-iac-05-signed-mutations.test.js tests/unit/worker/sec-iac-07-iac-smoke.test.js

      - name: 'Quality: Unit + Contract + Guards'
        if: matrix.shard == 'tests'
        run: npx vitest run

      # ── OSE-286: @ocr/ui adoption drift check ──────────────────────────────
      # Gates on critical violations (local-root-tokens, missing-shared-
      # stylesheet). Large inline CSS is reported as a migration progress
      # metric but never blocks — templates are partially migrated.
      # script mirrors packages/ui/src/contract.ts logic with no build dep.
      - name: 'Quality: @ocr/ui adoption drift'
        if: matrix.shard == 'tests'
        run: node scripts/check-ui-drift.mjs

      # ── OCR-docs brain checkout (for OSE-323 UEC drift check) ──────────────
      # The drift check in workers/oursharedevents/tests/uec-drift-check.spec.ts
      # (vitest) compares the OSE consumed UEC copy against the brain canonical.
      # vitest.config.mts reads the brain artifact at config time and injects
      # TEST_BRAIN_UEC_JSON. When BRAIN_DIR is absent, the drift gate SKIPS
      # locally; this step ensures it FIRES in CI by checking out OCR-docs
      # and pointing BRAIN_DIR at it.
      - name: 'Checkout OCR-docs brain (for OSE-323 drift check)'
        if: matrix.shard == 'tests' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: ocr-docs-brain-checkout
          # OCR-docs is private; needs the cross-repo read token (same one
          # brain-contract-check.yml uses). Default GITHUB_TOKEN can't read
          # across private repos.
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}

      - name: 'Quality: Worker D1 schema'
        if: matrix.shard == 'tests'
        # OSE-696: route the vitest-pool-workers run through the retry-once
        # wrapper. workerd intermittently segfaults with
        # "Check failed: std::numeric_limits<int>::max() >= length_"; the wrapper
        # re-runs ONCE only on that crash signature and preserves the real exit
        # code otherwise (a genuine test failure still fails the gate).
        run: node ../../scripts/vitest-retry.mjs npm test
        working-directory: ${{ env.WORKER_DIR }}
        env:
          BRAIN_DIR: ${{ github.workspace }}/ocr-docs-brain-checkout/ocr-docs-brain

      # ── Shard: a11y ────────────────────────────────────────────────────────
      # axe-core WCAG 2.0 AA scan via the worker test runner.
      - name: 'Quality: A11Y axe-core WCAG 2.0 AA scan'
        if: matrix.shard == 'a11y'
        run: npm run test:a11y
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: invariants (OSE-350) ────────────────────────────────────────
      # The STRUCTURAL subset of the 0-architecture invariant suite — the
      # code-shape locks that read source files via node:fs and assert the
      # brain's architectural contracts hold. These need no deployed worker,
      # so they gate EVERY PR + push here in T0 Gate.
      #
      # Why this exists: before OSE-350 the entire 0-architecture suite ran
      # only in T4 Functional, which is dispatch-only. That meant the brain's
      # "CI-enforced contracts" were NOT enforced on normal development — a PR
      # could break an invariant's code shape and nothing caught it unless
      # someone manually dispatched T4. This shard closes that
      # enforcement-continuity gap: invariants are carried from 0 through the
      # whole flow.
      #
      # ONLY the structural subset runs here. Runtime invariant specs
      # (anonymous-id, geo-resolution, ncr-accumulation, uec-codes) need a
      # deployed worker and stay in T4 / post-deploy tiers. The file list
      # below is locked by the placement guard in
      # tests/integration/infra-consistency.test.js — a new structural
      # invariant spec that is not listed here fails that guard, so the
      # continuity cannot silently regress.
      - name: 'Architecture: structural invariants'
        if: matrix.shard == 'invariants'
        run: |
          # OSE-954: --with-deps pulls the chromium system libraries on the
          # ephemeral ubuntu VM (passwordless sudo on GitHub-hosted runners);
          # harmless on other platforms. Prevents a missing-shared-lib failure
          # now that this shard no longer runs on the pre-provisioned box.
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            tests/e2e/0-architecture/aggregate-only.invariant.spec.ts \
            tests/e2e/0-architecture/api-response-schema.invariant.spec.ts \
            tests/e2e/0-architecture/cors-allowlist.invariant.spec.ts \
            tests/e2e/0-architecture/cost-metric-never-who.invariant.spec.ts \
            tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts \
            tests/e2e/0-architecture/migration-monotonicity.invariant.spec.ts \
            tests/e2e/0-architecture/monetization-inert.invariant.spec.ts \
            tests/e2e/0-architecture/oer-emission-boundary.invariant.spec.ts \
            tests/e2e/0-architecture/pii-retention.invariant.spec.ts \
            tests/e2e/0-architecture/runner-environment.invariant.spec.ts \
            tests/e2e/0-architecture/runner-pool-readiness.invariant.spec.ts \
            tests/e2e/0-architecture/runtime-llm-free.invariant.spec.ts \
            tests/e2e/0-architecture/slug-permanence.invariant.spec.ts \
            tests/e2e/0-architecture/shared-report-schema.invariant.spec.ts \
            tests/e2e/0-architecture/tenant-isolation.invariant.spec.ts \
            tests/e2e/0-architecture/tier-equity.invariant.spec.ts \
            tests/e2e/0-architecture/sponsor-share-covenant.invariant.spec.ts \
            tests/e2e/0-architecture/scan-path-split.invariant.spec.ts \
            tests/e2e/0-architecture/sponsor-identity-split.invariant.spec.ts \
            tests/e2e/0-architecture/edge-token-verification.invariant.spec.ts \
            tests/e2e/0-architecture/worker-claude-md.invariant.spec.ts

      # Post-job cleanup: delete _diag/pages/ so the next run's runner agent
      # can create fresh log files without "file already exists" collisions.
      # Runs on every shard, always (even on failure/cancel). Concurrent
      # rm -rf is safe — idempotent on already-missing directories.
      - name: 'Cleanup: clear diag pages for next run'
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

  # ============================================================================
  # TIER 1: DEPLOY — Push to main or dispatch
  # ============================================================================
  deploy-staging:
    name: 'T1 Deploy → Staging'
    runs-on: self-hosted
    needs: [security, gate]
    # Opt-in full-pipeline-on-PR: a PR whose HEAD branch is named `full-pipeline/*`
    # runs T1 Deploy→Staging (and therefore the whole T2 Contract → T3 E2E Smoke
    # → T4 Functional fail-fast chain, which cascade on deploy-staging success).
    # Lets you watch the staged pipeline end-to-end on a PR without merging.
    # Normal PRs still skip T1–T4. NOTE: this DEPLOYS the PR branch to the shared
    # staging worker for the duration of the run (same-repo PR → secrets present).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'full-pipeline/'))
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      # ────────────────────────────────────────────────────────────────────
      # OSE-813 — no placeholder binding IDs may reach a deploy.
      #
      # HARD GATE. The RATE_LIMIT_KV namespaces were provisioned 2026-08-18
      # (rate-limit-staging / rate-limit-production) and their real IDs are in
      # wrangler.toml, so the last placeholders are gone. This step now fails the
      # deploy if any binding ID matches PROVISION/TODO/REPLACE/… — the next
      # placeholder must not survive the way the KV ones did (OSE-544 closed the
      # D1 placeholders and never saw the KV ones).
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: no unprovisioned binding IDs (OSE-813)'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-binding-placeholders.mjs

      # ────────────────────────────────────────────────────────────────────
      # Post-migration canonical-shape verification (OSE-209 hardening).
      #
      # Asserts the staging D1 schema, AFTER wrangler applies migrations,
      # matches the canonical set defined in
      #   workers/oursharedevents/tests/migration-smoke.spec.ts
      # (DB_TABLES, FORMS_DB_TABLES, EXPECTED_TRIGGER_COUNT_*).
      #
      # The earlier version of these steps asserted COUNT(*) against a
      # hardcoded 6-table list (DB) / 5-table list (FORMS_DB) and never
      # got updated as new migrations landed (0010, 0014, 0019-0023, 0026,
      # 0009-FORMS, etc.). That drift silently masked real-D1 regressions
      # — the same regressions the PR-time miniflare smoke test (OSE-209)
      # already catches in vitest. Now both layers reference the same
      # canonical set, name-based, with a trigger=0 invariant on top.
      # ────────────────────────────────────────────────────────────────────

      - name: 'Verify staging D1 (canonical shape from migration-smoke.spec.ts, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          # OSE-303: extract canonical lists from migration-smoke.spec.ts
          # at runtime instead of copying them here. The spec is the
          # SINGLE source of truth — workflow MUST NOT carry a duplicate.
          # Previous drift (PR #213) silently broke deploys for ~2 weeks
          # because the spec was updated and the workflow's copy wasn't.
          # See OSE-303 for the discipline rationale.
          EXPECTED_DB=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract DB_TABLES from spec (regex likely broken; check tests/migration-smoke.spec.ts'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 10) { console.error('::error::OSE-303: extracted ' + n.length + ' DB_TABLES; expected >= 10 (regex likely broken)'); process.exit(1); }
          console.log(n.join(' '));
          ")
          EXPECTED_FORMS=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const FORMS_DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract FORMS_DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 3) { console.error('::error::OSE-303: extracted ' + n.length + ' FORMS_DB_TABLES; expected >= 3'); process.exit(1); }
          console.log(n.join(' '));
          ")
          DB_COUNT=$(echo "$EXPECTED_DB" | wc -w | tr -d ' ')
          FORMS_COUNT=$(echo "$EXPECTED_FORMS" | wc -w | tr -d ' ')

          fetch_names() {
            local DB=$1; local OBJ=$2
            npx wrangler d1 execute "$DB" --env staging --remote --json \
              --command "SELECT name FROM sqlite_master WHERE type='$OBJ' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'd1_%' ORDER BY name" \
              | jq -r '.[0].results[].name' | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]*$//'
          }

          ACTUAL_DB=$(fetch_names ocr-db-staging table)
          if [ "$ACTUAL_DB" != "$EXPECTED_DB" ]; then
            echo "::error::DB table-set drift on staging."
            echo "  Expected: [$EXPECTED_DB]"
            echo "  Got:      [$ACTUAL_DB]"
            echo "  Update tests/migration-smoke.spec.ts DB_TABLES — workflow extracts from the spec automatically (OSE-303), so updating the spec is sufficient."
            exit 1
          fi
          echo "✓ DB: $DB_COUNT canonical tables verified by name (extracted from spec)"

          ACTUAL_FORMS=$(fetch_names ocr-forms-db-staging table)
          if [ "$ACTUAL_FORMS" != "$EXPECTED_FORMS" ]; then
            echo "::error::FORMS_DB table-set drift on staging."
            echo "  Expected: [$EXPECTED_FORMS]"
            echo "  Got:      [$ACTUAL_FORMS]"
            echo "  Update tests/migration-smoke.spec.ts FORMS_DB_TABLES — workflow extracts from the spec automatically (OSE-303)."
            exit 1
          fi
          echo "✓ FORMS_DB: $FORMS_COUNT canonical tables verified by name (extracted from spec)"

          # Triggers: must be zero on both DBs (migration 0025 documented
          # that triggers were removed; D1 parser breaks on ; in trigger
          # bodies, so state-machine enforcement lives in app code).
          DB_TRIGGERS=$(fetch_names ocr-db-staging trigger)
          if [ -n "$DB_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in staging DB: [$DB_TRIGGERS]"
            echo "  Migration 0025 documents triggers were removed; any new trigger must justify reintroducing the wrangler-parser fragility."
            exit 1
          fi
          FORMS_TRIGGERS=$(fetch_names ocr-forms-db-staging trigger)
          if [ -n "$FORMS_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in staging FORMS_DB: [$FORMS_TRIGGERS]"
            exit 1
          fi
          echo "✓ Triggers: 0 on both DBs (matches canonical)"

          echo "{\"type\":\"OSE_209_POST_WRANGLER_SMOKE_STAGING\",\"tables_db\":$DB_COUNT,\"tables_forms\":$FORMS_COUNT,\"triggers_db\":0,\"triggers_forms\":0}"

      # ────────────────────────────────────────────────────────────────────
      # OSE-803 — pre-deploy schema gate.
      #
      # `wrangler d1 migrations apply` can fail partway: some DDL lands, the
      # d1_migrations row is never written, and the step can still exit 0. The
      # Worker then deploys against a database it is ahead of, the deploy goes
      # green, and the failure surfaces later as SQLITE_ERROR at prepare time.
      #
      # This gate asserts ZERO unapplied migrations on BOTH bindings immediately
      # before the Worker ships. Read-only (`migrations list`), reuses the
      # credentials the apply steps above already hold, adds no new secret and no
      # new permission. Fails closed — an auth error also stops the deploy.
      #
      # Runtime backstop for what CI cannot see (Worker rollback, binding
      # repointed in the dashboard): src/lib/schema-guard.ts.
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: zero unapplied D1 migrations before deploy (OSE-803)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          node scripts/check-schema-guard.mjs
          FAILED=0
          for BINDING in DB FORMS_DB; do
            OUT="$(npx wrangler d1 migrations list "$BINDING" --env staging --remote 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'No migrations to apply'; then
              echo "ok    $BINDING (staging): no unapplied migrations"
            else
              echo "FAIL  $BINDING (staging): unapplied migrations remain, or the check could not run"
              printf '%s\n' "$OUT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to deploy a Worker ahead of its database."
            exit 1
          fi

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Health check passed"

  # ============================================================================
  # TIER 2: SMOKE — Post-deploy + nightly + dispatch
  # ============================================================================
  smoke-staging:
    name: 'T3 E2E Smoke → Staging (Playwright)'
    # OSE-954: runs on ephemeral ubuntu-latest. This job only READS live staging
    # (Playwright smoke) — it does not deploy. Staging auth is header-based CF
    # Access service token (CF_ACCESS_CLIENT_ID/SECRET + Bearer ADMIN_KEY, all
    # repo secrets) which is IP-independent, so an ephemeral runner authenticates
    # exactly as the box did — there is no source-IP allow-list to lose.
    runs-on: ubuntu-latest
    # Fail-fast chain, stage 2 of 3: FE E2E smoke runs ONLY after the Newman
    # contract (T2) is green. A red here SKIPS functional (T4). Depends on
    # contract-staging so the API contract is proven before the FE E2E layer.
    needs: [security, gate, deploy-staging, contract-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.contract-staging.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        # OSE-954: --with-deps pulls chromium system libs on the fresh ubuntu VM.
        run: npx playwright install --with-deps chromium

      - name: 'Security smoke: XSS + auth boundaries'
        id: security-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast gates'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: 'Forms: endpoint smoke (4 types + admin + validation)'
        id: forms-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/form-endpoints.spec.ts
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
            test-results/
          retention-days: 14

      # Surface per-test Playwright smoke results as a GitHub Check (visible in
      # the PR/Checks tab), matching the T4 functional reporter.
      - name: Report results (E2E smoke)
        if: always()
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: 'T3 E2E Smoke Results (Playwright)'
          path: '.test-results/*junit.xml'
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T3 E2E Smoke → Staging (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "Stage 2 of the fail-fast chain — runs only after T2 contract is green; a red here skips T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security smoke (XSS + auth) | \`${{ steps.security-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| IAC health + fail-fast | \`${{ steps.iac-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Form endpoints | \`${{ steps.forms-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure' || steps.forms-smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}, Forms: ${{ steps.forms-smoke.outcome }}"
          exit 1

  # ============================================================================
  # TIER 3: CONTRACT — Newman API + Pages (post-deploy + nightly)
  # ============================================================================
  contract-staging:
    name: 'T2 Contract → Staging (Newman)'
    # OSE-954: runs on ephemeral ubuntu-latest. Newman + wrangler-d1 seed only;
    # no deploy. Staging auth is the header-based CF Access service token
    # (CF_ACCESS_CLIENT_ID/SECRET + Bearer ADMIN_KEY) and the D1 seed uses
    # CLOUDFLARE_API_TOKEN — all repo secrets, all IP-independent, so the
    # ephemeral runner reaches staging exactly as the self-hosted box did.
    runs-on: ubuntu-latest
    # Fail-fast chain, stage 1 of 3 (after T1 deploy): Newman API + Pages
    # contract. Newman-first — nail the API contract, THEN perpetuate into the
    # FE. A red here SKIPS the downstream FE E2E smoke (T3) and functional (T4),
    # so a broken API contract is fixed before any FE layer runs.
    needs: [security, gate, deploy-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # CF Access preflight probe (OSE-349) — diagnostic only, does not gate.
      # Hits a read-only admin path with the same credentials Newman uses,
      # classifies the response, and writes an actionable diagnosis to the
      # step summary. Lets Newman remain the source of truth per the
      # tests-surface-truth doctrine, but auto-classifies the next failure.
      - name: CF Access preflight probe
        id: preflight
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e
          URL="https://stg.oursharedevents.com/api/v2/admin/sponsors"
          BODY_FILE="$RUNNER_TEMP/preflight.body"
          response=$(curl -sS -o "$BODY_FILE" -w '%{http_code}|%{content_type}|%{size_download}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Authorization: Bearer $ADMIN_KEY" \
            "$URL")
          curl_exit=$?
          IFS='|' read -r status content_type size <<< "$response"

          {
            echo "## CF Access Preflight Probe"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| URL | \`$URL\` |"
            echo "| HTTP status | \`$status\` |"
            echo "| Content-Type | \`$content_type\` |"
            echo "| Body size | \`$size\` bytes |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          classification=unknown
          if [ "$curl_exit" -ne 0 ]; then
            classification=network
            echo "⚠ **Result:** \`curl\` exited $curl_exit before the response classified (network/DNS issue). Newman will retry." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Preflight network error::curl exit=$curl_exit"
          elif [ "$status" = "200" ] && echo "$content_type" | grep -q "application/json"; then
            classification=ok
            echo "✅ **Result:** Preflight OK — CF Access edge **and** worker \`ADMIN_KEY\` both accepting CI credentials." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$content_type" | grep -q "text/html"; then
            classification=cf_access_shadow
            {
              echo "❌ **Result:** **CF Access service-token rejected.** Response is HTML (login challenge), not JSON."
              echo ""
              echo "**Almost certainly:** \`CF_ACCESS_CLIENT_ID\` / \`CF_ACCESS_CLIENT_SECRET\` repo secrets are stale (token rotated in Cloudflare). See [OSE-349](https://linear.app/oursharedevents/issue/OSE-349) for the full fix path."
              echo ""
              echo "**Newman API smoke will fail on the OSE-INV5 sponsor covenant seed.** Do not re-run blindly — fix the service token first."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CF Access preflight failed::Service token rejected (HTML response). See OSE-349. Likely cause: CF_ACCESS_CLIENT_ID/SECRET stale after Cloudflare rotation."
          elif [ "$status" = "401" ] && echo "$content_type" | grep -q "application/json"; then
            classification=worker_auth
            {
              echo "❌ **Result:** CF Access accepted the service token, but the worker rejected the \`ADMIN_KEY\` Bearer (401 JSON)."
              echo ""
              echo "Update the \`ADMIN_KEY\` repo secret. Different cause from OSE-349 — file a sibling ticket if persistent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Worker auth preflight failed::ADMIN_KEY rejected by worker (401 JSON)."
          else
            classification=unexpected
            body_preview=$(head -c 500 "$BODY_FILE" 2>/dev/null | tr -d '\r' | tr '\n' ' ')
            {
              echo "⚠ **Result:** Unexpected response shape — manual investigation needed."
              echo ""
              echo "**Body preview (first 500 chars):**"
              echo ""
              echo '```'
              echo "$body_preview"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Preflight unexpected::status=$status content_type=$content_type — see step summary"
          fi

          echo "preflight_status=$classification" >> "$GITHUB_OUTPUT"
          echo "preflight_http_code=$status" >> "$GITHUB_OUTPUT"
          echo "Preflight classification: $classification (HTTP $status, $content_type, $size bytes)"
          exit 0

      # OSE-891: geo-tag test-event-001 so the OSE-INV5 covenant can seed
      # genuinely-local sponsors. is_local is GEO-DERIVED server-side (sponsor
      # h3_res7 == event h3_res7); the event fixture ships without coordinates,
      # so without this its cell is NULL and every sponsor resolves non-local.
      # A standalone fixture (not a migration) on purpose — see the file header
      # and postman/collections/ose-api.json §11 description. Idempotent UPDATE.
      - name: Seed covenant event geo (OSE-891 fixture)
        id: seed-covenant-geo
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          npx wrangler d1 execute DB --env staging --remote \
            --file ../../postman/fixtures/covenant-event-geo.sql

      - name: Reset covenant/journey sponsor fixtures (OSE-944 — prevent accumulation)
        id: reset-covenant-sponsors
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          npx wrangler d1 execute DB --env staging --remote \
            --file ../../postman/fixtures/covenant-sponsors-reset.sql

      - name: Newman API smoke
        id: newman-api
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          # CF Access service token — required for section 11 (Sponsor Covenant)
          # which seeds + cleans up admin sponsors. The seed/cleanup POSTs hit
          # /api/v2/admin/* which CF Access shadows at the edge with a 302/HTML
          # redirect before the request reaches the worker. Forwarding the
          # service token bypasses CF Access at the edge while preserving the
          # worker-side Bearer auth check. Without these secrets the covenant
          # test fails loudly (not silently) — see section 11 seed tests.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx newman run postman/collections/ose-api.json \
            -e postman/environments/ose-staging.json \
            --env-var "adminKey=$ADMIN_KEY" \
            --env-var "ocrInternalSecret=$X_OCR_INTERNAL" \
            --env-var "cfAccessClientId=$CF_ACCESS_CLIENT_ID" \
            --env-var "cfAccessClientSecret=$CF_ACCESS_CLIENT_SECRET" \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-api-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Newman Pages smoke
        id: newman-pages
        run: |
          npx newman run postman/collections/ose-pages.json \
            -e postman/environments/ose-staging.json \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export .test-results/newman-pages-junit.xml
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-staging-${{ github.run_number }}
          path: .test-results/
          retention-days: 14

      # Surface per-assertion Newman results as a GitHub Check (visible in the
      # PR/Checks tab), so a contract failure shows the failing request + message
      # by name instead of being buried in the CLI log.
      - name: Report results (Newman contract)
        if: always()
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: 'T2 Contract Results (Newman)'
          path: '.test-results/newman-*-junit.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T2 Contract → Staging (Newman)" >> $GITHUB_STEP_SUMMARY
          echo "Stage 1 of the fail-fast chain — a red here skips T3 E2E smoke + T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Collection | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API (ose-api.json) | \`${{ steps.newman-api.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages (ose-pages.json) | \`${{ steps.newman-pages.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Fail check
        if: steps.newman-api.outcome == 'failure' || steps.newman-pages.outcome == 'failure'
        run: |
          echo "::error::Contract failed — API: ${{ steps.newman-api.outcome }}, Pages: ${{ steps.newman-pages.outcome }}"
          exit 1

  # ============================================================================
  # TIER 4: FUNCTIONAL — Playwright API + UI (on-demand only)
  # ============================================================================
  functional-staging:
    name: 'T4 Functional → Staging'
    runs-on: self-hosted
    needs: [security, gate, deploy-staging, smoke-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_functional == 'true') ||
        (needs.deploy-staging.result == 'success' && needs.smoke-staging.result == 'success')
      )
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Reset synthetic sponsor fixtures (OSE-944 — journey runs on a clean event)
        id: reset-journey-sponsors
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          npx wrangler d1 execute DB --env staging --remote \
            --file ../../postman/fixtures/covenant-sponsors-reset.sql

      # OSE-551: durable "a real sponsor exists here" fixture. Gives the write-path
      # invariants (anonymous-id + ncr-accumulation impression/click) a real,
      # active, FK-valid sponsor on a dedicated event so the write returns 201
      # instead of the mock-fallback FK 503. NOT continue-on-error: a failed seed
      # must surface loudly (the specs also fail — not skip — when SMOKE_EVENT_SPONSORED
      # is set but exposes no sponsor, so green != true holds end-to-end).
      - name: Seed sponsored-event fixture (OSE-551)
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          npx wrangler d1 execute DB --env staging --remote \
            --file ../../tests/ui/smoke/fixtures/sponsored-event.sql

      - name: 'T4a: Architecture Invariants'
        id: arch-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          SMOKE_EVENT_SPONSORED: evt_smoke_sponsored
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/0-architecture/
        timeout-minutes: 3

      - name: 'T4b: Core Journeys'
        id: journey-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/sponsor-journey.spec.ts \
            tests/e2e/3-flows/cross-brand-isolation.spec.ts
        timeout-minutes: 8

      # T4c split (OSE-554): register/checkin + all validation/structure are
      # BLOCKING — the OSE-1003 forms fix makes them green on Phase-1
      # test-event-001 (verified on staging: 62 passed, 0 register/checkin
      # failures). Survey + email SUBMISSION are Phase-2 legal-clearance-gated
      # (return 403 FORM_DISABLED / PHASE_REQUIRED) and only pass against the
      # event-scoped Phase-2 fixture (OSE-1004) once real clearance lands
      # (OSE-1007) — split out to continue-on-error below so a known-deferred
      # gate can never block a PR. --grep-invert excludes the survey/email
      # describes ("Survey Form" / "Email Signup") from this blocking step.
      - name: 'T4c: Form E2E — register/checkin + validation (blocking)'
        id: form-e2e-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            --grep-invert "Survey Form|Email Signup" \
            tests/e2e/2-pages/form-registration.spec.ts \
            tests/e2e/2-pages/form-checkin.spec.ts \
            tests/e2e/2-pages/form-email-signup.spec.ts \
            tests/e2e/2-pages/form-survey.spec.ts \
            tests/e2e/3-flows/form-submission-flows.spec.ts \
            tests/e2e/4-negative/form-validation.spec.ts
        timeout-minutes: 10

      # Survey + email SUBMISSION — continue-on-error until the Phase-2 fixture
      # (OSE-1004) enables them event-scoped and real clearance (OSE-1007)
      # lands. Reported in the summary, never blocks the gate. Flip to blocking
      # (remove continue-on-error, fold back into the step above) when OSE-1004
      # ships the evt_forms_phase2 fixture.
      - name: 'T4c-phase2: Survey/Email E2E (continue-on-error — OSE-1004/1007)'
        id: form-e2e-phase2
        continue-on-error: true
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            --grep "Survey Form|Email Signup" \
            tests/e2e/2-pages/form-email-signup.spec.ts \
            tests/e2e/2-pages/form-survey.spec.ts \
            tests/e2e/3-flows/form-submission-flows.spec.ts \
            tests/e2e/4-negative/form-validation.spec.ts
        timeout-minutes: 10

      - name: Seed smoke fixtures
        id: seed-fixtures
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          npx wrangler d1 execute DB --env staging --remote \
            --file ../../tests/ui/smoke/fixtures/smoke-events.sql

      - name: 'T4d: UI Smoke — Tier-1 page smoke'
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          # CF Access service token — clears the edge so the admin routes reach
          # the worker; consumed as extraHTTPHeaders in playwright.ui-smoke.config.ts
          # (OSE-1010 / OSE-865). Present but the admin routes stay grep-inverted
          # below until a staging run confirms the edge clears (OSE-1010 DoD).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SMOKE_ADMIN_READY: '1'
          # Fixture IDs seeded via tests/ui/smoke/fixtures/smoke-events.sql (OSE-455).
          # Routes skip cleanly when absent; set to known IDs when staging has been seeded.
          SMOKE_EVENT_PRE: evt_smoke_pre
          SMOKE_EVENT_LIVE: evt_smoke_live
          SMOKE_EVENT_POST: evt_smoke_post
        # T4d fixes (OSE-554): (1) add the missing --config — tier1.spec.ts lives
        # in tests/ui/smoke, covered ONLY by playwright.ui-smoke.config.ts; with
        # no --config it fell to the default config (testDir tests/playwright) →
        # "No tests found". (2) --grep-invert 3 routes that need infra this step
        # lacks: /admin ×2 (blocked at the CF Access edge — needs the CF Access
        # service token) + /sharedReport (needs a signed link token). Those are
        # tracked in OSE-1010; the other 16 tier-1 page-smokes gate as BLOCKING.
        run: SMOKE_APP=ose SMOKE_ADMIN_READY=1 npx playwright test --config=playwright.ui-smoke.config.ts --grep-invert "admin dashboard|admin sign-in|shared report shell" tests/ui/smoke/tier1.spec.ts
        timeout-minutes: 10

      # T4e: Attendee arc — poster → pre / event / post phases (OSE-456).
      # Fixture rows (evt_smoke_{pre,live,post}) must be seeded into staging D1
      # via tests/ui/smoke/fixtures/smoke-events.sql before this runs.
      # Tests skip cleanly if fixtures are absent — continue-on-error protects CI
      # when staging has not been manually seeded for the run.
      - name: 'T4e: Attendee Arc Journey'
        id: attendee-arc-tests
        continue-on-error: true
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          SMOKE_EVENT_PRE: evt_smoke_pre
          SMOKE_EVENT_LIVE: evt_smoke_live
          SMOKE_EVENT_POST: evt_smoke_post
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/ui/smoke/journey-attendee-arc.smoke.spec.ts
        timeout-minutes: 5

      # T4f: SharedReport depth gate — E2E contract tests (S-3.3.2 / Invariant #5).
      # Tokens must be minted and stored as secrets before seeded run. Tests skip
      # cleanly when tokens are absent (continue-on-error preserves CI green).
      - name: 'T4f: SharedReport Depth Gate'
        id: sharedreport-depth-tests
        continue-on-error: true
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          SMOKE_EVENT_POST: evt_smoke_post
          SMOKE_RPT_ADMIN_TOKEN: ${{ secrets.SMOKE_RPT_ADMIN_TOKEN }}
          SMOKE_RPT_LOCAL_TOKEN: ${{ secrets.SMOKE_RPT_LOCAL_TOKEN }}
          SMOKE_RPT_MID_TOKEN: ${{ secrets.SMOKE_RPT_MID_TOKEN }}
          SMOKE_RPT_OTHER_EVENT_TOKEN: ${{ secrets.SMOKE_RPT_OTHER_EVENT_TOKEN }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/3-flows/sharedreport-depth.spec.ts
        timeout-minutes: 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-staging-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 14

      - name: Report results
        if: always()
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: "Functional Results"
          path: ".test-results/*-junit.xml"
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T4 Functional Results" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| T4a Architecture Invariants | \`${{ steps.arch-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4b Core Journeys | \`${{ steps.journey-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c Form E2E (register/checkin + validation, blocking) | \`${{ steps.form-e2e-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c Survey/Email submission (OSE-1004, non-blocking) | \`${{ steps.form-e2e-phase2.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4d UI Smoke | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4e Attendee Arc Journey | \`${{ steps.attendee-arc-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4f SharedReport Depth Gate | \`${{ steps.sharedreport-depth-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

      # ── S2 Post-execution integrity — the tamper tripwire, IN THE SAME VM that ran
      # the untrusted T4 execution (OSE-1056/1057). This is the migration-correct home
      # for the check the retired self-hosted `security-post` job used to attempt:
      # this job checked out the committed SHA at its START (the baseline), ran the
      # tests, and now asserts the tree is byte-identical — so a backdoor or lockfile
      # tamper injected DURING execution goes red here. Because the check lives at the
      # TAIL of the execution job (not a separate downstream job), it needs no cross-
      # job workspace persistence and rides the OSE-954 move to ephemeral GitHub-hosted
      # runners unchanged. The `git checkout --force` erasure that made the old design
      # vacuous cannot bite here — the checkout is the pre-execution baseline, not a
      # post-execution reset (regression-locked by post-execution-integrity.test.js).
      - name: 'S2 Integrity — no injection during execution phase'
        if: always()
        shell: bash
        run: bash scripts/check-post-execution-integrity.sh

  # ============================================================================
  # TIER 1P: DEPLOY → Production (tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: 'T1 Deploy → Production'
    runs-on: self-hosted
    needs: [security, gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database"; exit 1
          fi
          echo "✓ Production DB isolation verified"

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env production --remote

      # OSE-813 — no placeholder binding IDs may reach a deploy (HARD GATE).
      # Mirror of the staging step in T1 Deploy → Staging; keep both in sync.
      # KV namespaces provisioned 2026-08-18; the last placeholders are gone.
      - name: 'Gate: no unprovisioned binding IDs (OSE-813)'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-binding-placeholders.mjs

      # Canonical-shape verification on production. Mirror of the staging
      # step in T1 Deploy → Staging; keep both in sync. Source of truth:
      # workers/oursharedevents/tests/migration-smoke.spec.ts.
      - name: 'Verify production D1 (canonical shape from migration-smoke.spec.ts, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          # OSE-303: same spec-as-source-of-truth extraction as the
          # staging step above. Mirror by intent — both production and
          # staging consume the SAME canonical tables list because
          # migrations apply identically. Drift between prod and staging
          # would itself be a separate alarm (migrations out of sync).
          EXPECTED_DB=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 10) { console.error('::error::OSE-303: extracted ' + n.length + ' DB_TABLES; expected >= 10'); process.exit(1); }
          console.log(n.join(' '));
          ")
          EXPECTED_FORMS=$(node -e "
          const m = require('fs').readFileSync('tests/migration-smoke.spec.ts', 'utf8').match(/const FORMS_DB_TABLES = \[([\\s\\S]*?)\] as const;/);
          if (!m) { console.error('::error::OSE-303: could not extract FORMS_DB_TABLES from spec'); process.exit(1); }
          const n = (m[1].match(/'([^']+)'/g) || []).map(s => s.slice(1, -1)).sort();
          if (n.length < 3) { console.error('::error::OSE-303: extracted ' + n.length + ' FORMS_DB_TABLES; expected >= 3'); process.exit(1); }
          console.log(n.join(' '));
          ")
          DB_COUNT=$(echo "$EXPECTED_DB" | wc -w | tr -d ' ')
          FORMS_COUNT=$(echo "$EXPECTED_FORMS" | wc -w | tr -d ' ')

          fetch_names() {
            local DB=$1; local OBJ=$2
            npx wrangler d1 execute "$DB" --env production --remote --json \
              --command "SELECT name FROM sqlite_master WHERE type='$OBJ' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'd1_%' ORDER BY name" \
              | jq -r '.[0].results[].name' | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]*$//'
          }

          ACTUAL_DB=$(fetch_names ocr-db-production table)
          if [ "$ACTUAL_DB" != "$EXPECTED_DB" ]; then
            echo "::error::DB table-set drift on production."
            echo "  Expected: [$EXPECTED_DB]"
            echo "  Got:      [$ACTUAL_DB]"
            exit 1
          fi
          echo "✓ Production DB: $DB_COUNT canonical tables verified by name (extracted from spec)"

          ACTUAL_FORMS=$(fetch_names ocr-forms-db-production table)
          if [ "$ACTUAL_FORMS" != "$EXPECTED_FORMS" ]; then
            echo "::error::FORMS_DB table-set drift on production."
            echo "  Expected: [$EXPECTED_FORMS]"
            echo "  Got:      [$ACTUAL_FORMS]"
            exit 1
          fi
          echo "✓ Production FORMS_DB: $FORMS_COUNT canonical tables verified by name (extracted from spec)"

          DB_TRIGGERS=$(fetch_names ocr-db-production trigger)
          if [ -n "$DB_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in production DB: [$DB_TRIGGERS]"
            exit 1
          fi
          FORMS_TRIGGERS=$(fetch_names ocr-forms-db-production trigger)
          if [ -n "$FORMS_TRIGGERS" ]; then
            echo "::error::Unexpected triggers in production FORMS_DB: [$FORMS_TRIGGERS]"
            exit 1
          fi
          echo "✓ Production triggers: 0 on both DBs"

          echo "{\"type\":\"OSE_209_POST_WRANGLER_SMOKE_PRODUCTION\",\"tables_db\":$DB_COUNT,\"tables_forms\":$FORMS_COUNT,\"triggers_db\":0,\"triggers_forms\":0}"

      # OSE-803 — pre-deploy schema gate. Mirror of the staging step in
      # T1 Deploy → Staging; keep both in sync.
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: zero unapplied D1 migrations before deploy (OSE-803)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          node scripts/check-schema-guard.mjs
          FAILED=0
          for BINDING in DB FORMS_DB; do
            OUT="$(npx wrangler d1 migrations list "$BINDING" --env production --remote 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'No migrations to apply'; then
              echo "ok    $BINDING (production): no unapplied migrations"
            else
              echo "FAIL  $BINDING (production): unapplied migrations remain, or the check could not run"
              printf '%s\n' "$OUT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to deploy a Worker ahead of its database."
            exit 1
          fi

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          VERSION="${GITHUB_REF_NAME:-prod-$(git rev-parse --short HEAD)}"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Production health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Production health check passed"

  # ============================================================================
  # TIER 2P: SMOKE → Production (tag only)
  #
  # NOTE — stamp cache will ALWAYS miss here, and that is intentional.
  #
  # deploy-production (the job that precedes this one) uses the default
  # clean: true checkout, which runs `git clean -ffdx` and wipes the entire
  # workspace — including root node_modules/ and its .install-stamp.
  # By the time smoke-production runs, the stamp file is gone, so the
  # stamp check below falls through and npm ci always runs fresh.
  #
  # This is the correct behaviour for production smoke:
  #   - deploy-production gets a guaranteed-clean workspace (SRE doctrine)
  #   - smoke-production inherits that cleanliness — it never tests against
  #     a stale cached node_modules from a prior unrelated run
  #   - The "skipping npm ci" log line will never appear in this job
  #
  # If you see "skipping npm ci" here, investigate — it means deploy-production
  # did NOT run before this job (e.g. needs: chain changed) and the previous
  # run's workspace state leaked in, which would be a bug.
  # ============================================================================
  smoke-production:
    name: 'T2 Smoke → Production'
    runs-on: self-hosted
    needs: [security, gate, deploy-production]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage adjacent @ocr/flags package
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ '${{ inputs.force_clean }}' != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: 'Security smoke: XSS + auth'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
          retention-days: 30

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Production smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # GATE 4: POST-EXECUTION SECURITY — the closing bookend
  #
  # PO design (ratified 2026-08-09): security bookends the execution phase. Gate 1
  # (S0 Security) proves the committed input was clean; a closing gate confirms
  # nothing — a test, a package lifecycle script, any CI/CD execution — mutated the
  # source or injected files DURING execution, which a single up-front scan cannot
  # detect.
  #
  # RE-HOMED (OSE-1056/1057, Dr.-of-Security). This used to be TWO separate self-
  # hosted jobs:
  #   • `security-post`      — git-integrity tamper check. It re-checked-out the SHA,
  #                            and `git checkout --force` ERASED tracked-file/lockfile
  #                            injection before the diff → 2/3 checks vacuously green.
  #   • `security-post-scan` — a managed semgrep/detect-secrets re-scan on a CLEAN
  #                            checkout. Its only reason to exist (run semgrep where
  #                            self-hosted Smart App Control blocked it) is MOOT: S0
  #                            now runs on ubuntu with the identical configs over the
  #                            same SHA. It added zero coverage and burned hosted
  #                            minutes (its no-runner scheduling flake was the original
  #                            OSE-1056 symptom).
  # Both are RETIRED. The real post-execution value — "did untrusted execution tamper
  # the tree" — now runs as the TAIL STEP of `functional-staging`, in the same VM that
  # ran the tests (see that job). That placement needs no cross-job workspace
  # persistence, so it is correct on self-hosted today and rides the OSE-954 migration
  # to ephemeral GitHub-hosted runners unchanged. The retired-job invariant is
  # regression-locked by tests/unit/security/post-execution-integrity.test.js.
  # ============================================================================
  summary:
    name: 'Pipeline Summary'
    runs-on: self-hosted
    needs: [security, gate, deploy-staging, smoke-staging, contract-staging, functional-staging, deploy-production, smoke-production]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## OurSharedEvents CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| S0 Security | security | \`${{ needs.security.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T0 Gate | gate | \`${{ needs.gate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy STG | deploy-staging | \`${{ needs.deploy-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Contract STG (Newman) | contract-staging | \`${{ needs.contract-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T3 E2E Smoke STG (Playwright) | smoke-staging | \`${{ needs.smoke-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4 Functional STG | functional-staging | \`${{ needs.functional-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy PROD | deploy-production | \`${{ needs.deploy-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke PROD | smoke-production | \`${{ needs.smoke-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
