# OurSharedEvents – CI/CD Pipeline
#
# S0 Security → T0 Gate → T1 Deploy → T2 Bruno API → T3 Playwright Smoke
#                                   → T4 E2E → T4d Functional/UI Smoke
#                                   → T5 Adversarial (separate workflow)
#                                   → T6 Security (separate workflow)
#
# Security runs unconditionally on every PR (no paths filter on pull_request trigger).
# Gate and all downstream jobs are blocked behind security via needs: — security results
# determine whether the rest of the pipeline runs at all.
# Push-to-main keeps paths filtering (deployment is expensive; path-scoping is fine there).
#
#   S0: Security — Static vulnerability analysis + supply chain inventory
#       - CodeQL SAST (JS/TS)          → github/codeql-action/analyze@v4
#       - Semgrep SAST                 → p/nodejs + p/owasp-top-ten + p/r2c-security-audit
#       - detect-secrets               → Yelp detect-secrets baseline scan (secret gate; OSE-911)
#       - npm audit (CVE check)        → npm audit --omit=dev --audit-level=moderate
#       - SBOM generation              → npx @cyclonedx/cyclonedx-npm --omit dev
#
#   T0: Gate — Static quality + unit/contract tests
#       - Banned origins check         → npm run check:banned-origins
#       - Security unit tests          → vitest run tests/unit/worker/sec-iac-{03,04,05,07}
#       - Lint                         → eslint config/ scripts/ tests/unit/ tests/contract/
#       - TypeScript typecheck         → tsc --noEmit (workers/oursharedevents)
#       - Unit + contract + guards     → npm test (root)
#       - Worker D1 schema             → npm test (workers/oursharedevents)
#
#   T1: Deploy — Migrations, deploy, health check
#       - D1 migrations (main + forms) → wrangler d1 migrations apply {DB,FORMS_DB} --remote
#       - Canonical-shape verification → assert tables-by-name match the spec at
#                                        workers/oursharedevents/tests/migration-smoke.spec.ts
#                                        (extracted at workflow runtime per OSE-303 —
#                                        no hard-coded copy in this workflow)
#                                        + 0 triggers, BY NAME, against the
#                                        canonical set in
#                                        tests/migration-smoke.spec.ts (OSE-209)
#       - Deploy                       → wrangler deploy
#       - Health check                 → curl /health (HTTP 200)
#
# Fail-fast test chain after T1 deploy: T2 Bruno API contract → T3 Playwright
# smoke → T4 E2E → T4d functional/UI smoke. T5 Adversarial Red Team starts only
# after this CI/CD workflow succeeds, then T6 Security starts only after T5
# succeeds. Each stage gates the next, so a red stage stops everything
# downstream — fix one layer at a time. Contract-first: nail the API contract,
# then perpetuate into Playwright smoke, E2E, and functional coverage.
#
#   T2: Bruno API Contract — API + Pages spec compliance [runs first]
#       - Bruno API collection         → bru run bruno/ose-api (OSE-1191, ex-Newman)
#       - Bruno Pages collection       → bru run bruno/ose-pages (OSE-1191, ex-Newman)
#
#   T3: Playwright Smoke — XSS, auth boundaries, fail-fast gates, forms
#       [runs only if T2 Bruno passed]
#       - Security smoke               → playwright tests/e2e/1-smoke/security-smoke.spec.js
#       - IAC health + fail-fast       → playwright tests/api/smoke/{api-health,fail-fast-gates}.spec.ts
#       - Form endpoint smoke          → playwright tests/api/smoke/form-endpoints.spec.ts
#
#   T4: E2E — End-to-end journeys [runs only if T3 Playwright smoke passed]
#       - Architecture invariants      → playwright tests/e2e/0-architecture/
#       - Core journeys                → playwright tests/e2e/3-flows/sponsor-journey.spec.ts
#       - Form E2E (4 types + flows)   → playwright tests/e2e/2-pages/form-*.spec.ts + 3-flows + 4-negative
#
#   T4d: Functional/UI Smoke — runs after the E2E tiers inside functional-staging
#       - UI smoke                     → npm run test:ui:smoke
#
#   T5: Adversarial Red Team — separate workflow_run after this workflow succeeds
#       - red-team-adversarial.yml      → T5 — Adversarial Red Team
#
#   T6: Security — jobs in red-team-adversarial.yml, after the T5 job succeeds
#       - security-closing              → T6 Closing Security
#       - post-t6-security              → final post-T6 security bookend
#
# Trigger Matrix:
#   | Event              | Security | Gate | Deploy | Smoke | Contract | Functional |
#   |--------------------|----------|------|--------|-------|----------|------------|
#   | PR to main         | ✅ *     | ✅   | ❌     | ❌    | ❌       | ❌         |
#   | Push to main       | ✅       | ✅   | ✅     | ✅    | ✅       | ✅         |
#   | Tag vX.Y.Z         | ✅       | ✅   | stg→prod | stg→prod | ✅       | ✅         |
#   | Schedule (nightly) | ✅       | ✅   | ❌     | ✅†   | ✅†      | ❌         |
#   | Dispatch           | ✅       | ✅   | opt    | opt   | opt      | opt        |
#   * PR trigger has NO paths filter — security runs on every PR regardless of files changed.
#     Gate/Deploy/Smoke still skip on non-code PRs via their own paths conditions (see push trigger).
#   † Nightly: runs against live staging without redeploying (environmental drift detection)
#
# Functional (Tier 4) runs on every push to main (and tag), after T1 Deploy and the
# T2 → T3 chain are green, so every merge shows the full test scope on staging.
# That is the "Done" bar in AGENTS.md (T1–T4 green for the merge SHA). It costs
# more runner minutes than the old dispatch-only setup; that is accepted. Nightly
# skips it (no deploy). On dispatch, tick run_functional to run it without deploying.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN_OSE      (Cloudflare API token)
#   - CLOUDFLARE_ACCOUNT_ID         (Cloudflare account ID)
#   - ADMIN_KEY                     (Bearer token for /admin routes)
#   - X_OCR_INTERNAL                (CI/CD auth secret)
#   - CF_ACCESS_CLIENT_ID           (Cloudflare Access service token)
#   - CF_ACCESS_CLIENT_SECRET       (Cloudflare Access service token secret)

name: OurSharedEvents CI/CD

on:
  pull_request:
    branches: [main]
    # No paths filter — security (S0) must scan every PR unconditionally.
    # Gate and all downstream jobs are gated behind security via needs:.
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.ts'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.html'
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'bruno/**'
      - 'packages/**'
      - '.ocr-hub-ref'
      - '.ocr-design-check.json'
      - 'playwright.*.config.*'
      - '.github/workflows/**'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '7 3 * * *' # Nightly 3:07 AM UTC — Gate + Smoke + Contract (no deploy)
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        type: boolean
        default: false
      deploy_production:
        description: 'Deploy to production (type PRODUCTION)'
        type: string
      ticket:
        description: 'Linear ticket for this production change (OSE-####); a tag deploy names it in the tag message'
        type: string
      run_functional:
        description: 'Run full functional suite (Tier 4 — expensive)'
        type: boolean
        default: false
      force_clean:
        description: 'Force npm ci regardless of stamp (bust corrupt node_modules)'
        type: boolean
        default: false

concurrency:
  # OSE-937: key the group by EVENT so a nightly `schedule` run and a `push`-to-main
  # run never share a group. Previously both resolved to `ose-refs/heads/main`, so a
  # scheduled run firing minutes after a merge cancelled the merge's T1 Deploy run
  # (and `schedule` skips T1/T4, so nothing deployed). cancel-in-progress is scoped to
  # pull_request only — PR pushes still supersede their own stale runs for fast
  # feedback, but a merge's deploy run is never cancelled out from under it.
  #
  # Staging lock (2026-11-14): stg has one worker and one D1, so every run that
  # touches it joins ONE group, `ose-staging-chain`, whatever its branch or event:
  # push to main, a release tag, the nightly schedule (T2/T3 read the standing
  # build), a dispatch with deploy_staging / run_functional / deploy_production,
  # and a full-pipeline/* PR. The lock spans the whole run, so T1 Deploy → T4
  # Functional run against this run's own build; a per-job group would let the
  # next run's T1 deploy as soon as this run's T1 ended. Before the lock, two
  # dispatches on different branches overlapped, the later T1 replaced the earlier
  # build mid-chain, and the earlier run's T4 deploy-freshness preflight refused
  # it (runs 43550717549, 43550998525, 43552994911). `queue: max` keeps waiting
  # runs in FIFO order (up to 100) instead of the default one waiting run that a
  # third arrival cancels, so a merge's run and the nightly are never starved or
  # dropped, and nothing in the lock is ever cancelled. Merging OSE-937's push and
  # schedule groups is safe for the same reason: they now queue, not cancel.
  # Every other run keeps its own group, and a plain PR push still supersedes its
  # own stale run. Gate: tests/integration/staging-chain-lock.test.js.
  group: >-
    ${{ (
    (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
    github.event_name == 'schedule' ||
    (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_staging == 'true' || github.event.inputs.run_functional == 'true' || github.event.inputs.deploy_production == 'PRODUCTION')) ||
    (github.event_name == 'pull_request' && startsWith(github.head_ref, 'full-pipeline/'))
    ) && 'ose-staging-chain' || format('ose-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'full-pipeline/') }}
  queue: max

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

defaults:
  run:
    shell: bash

# Least privilege by default (CodeQL: workflow without permissions). Jobs that need more
# (security-events, checks: write) declare it themselves.
permissions:
  contents: read

jobs:
  # ============================================================================
  # S0: SECURITY — CodeQL SAST + SBOM (runs before test pyramid)
  # ============================================================================
  security:
    name: 'S0 Security'
    timeout-minutes: 20 # job ceiling; slowest observed run is far below it
    runs-on: ubuntu-24.04 # OSE-1017: managed runner (self-hosted Smart App Control blocks unsigned semgrep.exe)
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          FLAGS_NM=node_modules/@ocr/flags/package.json
          # The install-stamp lets us skip `npm ci` when package-lock.json is
          # unchanged. But the "Fix @ocr/flags for SBOM resolution" step later
          # in THIS job destructively strips devDependencies from @ocr/flags
          # IN PLACE, and self-hosted runners persist node_modules between
          # runs. The lockfile hash doesn't change when only @ocr/flags is
          # mutated, so a naive stamp-skip would let `npm audit` run against
          # the mutated tree — the npm registry then rejects the submitted
          # tree with `400 Bad Request — Invalid package tree`.
          #
          # SELF-HEALING GUARD: the stamp is only trustworthy if @ocr/flags
          # in node_modules still carries its devDependencies. If they're gone
          # (SBOM step already ran on this runner) or the file is unparseable,
          # node_modules is mutated → force a fresh `npm ci`. This recovers on
          # the very next run with no force_clean dispatch needed, and catches
          # corruption from ANY source, not just the known SBOM step.
          flags_mutated=false
          if [ -f "$FLAGS_NM" ]; then
            node -e "const p=JSON.parse(require('fs').readFileSync('$FLAGS_NM','utf8'));process.exit(p.devDependencies?0:1)" 2>/dev/null || flags_mutated=true
          fi
          if [ "$FORCE_CLEAN" != 'true' ] && [ "$flags_mutated" = 'false' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            if [ "$flags_mutated" = 'true' ]; then
              echo "node_modules/@ocr/flags is mutated (devDependencies stripped by a prior SBOM run) — forcing fresh npm ci"
            fi
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # ── CodeQL moved out (Sweep 9 #2, 2026-05-14) ───────────────────────
      # CodeQL javascript-typescript analysis lived here AND in codeql.yml
      # — same trigger set, same analysis target, ~2.4 min each on
      # Bloodraven (measured on PR #160). The duplicate burned a runner
      # slot for no signal gain. codeql.yml is now the canonical entry
      # point: it owns the pull_request + push + scheduled + dispatch
      # triggers and emits the SARIF artifact. Keep S0 Security focused on
      # the non-CodeQL scanners (Semgrep, detect-secrets, npm audit, SBOM)
      # where the duplication didn't exist.

      # ── Semgrep + detect-secrets (Python-based) ──────────────────────────
      - name: Set up Python for Semgrep + detect-secrets
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Semgrep SAST
        run: |
          # OSE-1017: managed ubuntu runner. Fresh setup-python + pip, semgrep lands
          # on PATH directly — no cygpath/Scripts dance and no OSE-919 pip-repair
          # (those were self-hosted tool-Python drift workarounds, moot on ephemeral
          # runners). Pin per OSE-1016 so a bad upstream release can't crash the gate
          # (exit 2 TypeError). An install failure is flagged infra (::error + exit 1),
          # never read as a clean pass or a finding.
          python -m pip install "semgrep==1.163.0" --quiet \
            || { echo "::error::semgrep install failed (infra) — not a security finding"; exit 1; }
          semgrep --version || { echo "::error::semgrep unavailable on runner"; exit 1; }
          semgrep scan \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/r2c-security-audit \
            --error \
            --exclude=node_modules \
            --exclude=.wrangler \
            --exclude=coverage \
            --exclude=dist \
            --exclude=.claude \
            --json-output=semgrep-results.json || SEMGREP_EXIT=$?
          FINDING_COUNT=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo 0)
          echo "- **Semgrep:** $FINDING_COUNT findings" >> $GITHUB_STEP_SUMMARY
          exit ${SEMGREP_EXIT:-0}

      # Committed-secret gate (OSE-911). detect-secrets replaces gitleaks, whose
      # go-re2/wazero WASM-JIT panicked nondeterministically on the self-hosted
      # Windows runners (exit 2 = a tooling crash, not a finding) and intermittently
      # failed this required check. detect-secrets is pure Python (no WASM JIT), so
      # it is stable here. The check compares the scanned (file, hashed_secret) set
      # against the committed .secrets.baseline and fails ONLY on a NEW secret — it
      # is enforcing like gitleaks was (gitleaks used --exit-code 1), not the prior
      # warn-only posture. Version pinned so a scanner upgrade can't silently
      # reclassify the baseline. Semgrep continues to cover SAST.
      - name: detect-secrets scan (committed-secret gate)
        run: |
          python -m pip install 'detect-secrets==1.5.0' --quiet
          python scripts/check-secrets-baseline.py

      - name: npm audit
        # Audit the committed dependency graph instead of submitting the
        # installed tree. The first-party @ocr/flags file: dependency is
        # staged beside this checkout for CI, but npm's audit endpoint rejects
        # that local linked tree as an invalid package tree.
        run: npm audit --omit=dev --audit-level=moderate --package-lock-only

      # file:-linked @ocr/flags exposes its devDependencies to npm ls --all,
      # causing CycloneDX to fail. Strip them from the installed copy so SBOM
      # only inventories production dependencies.
      #
      # IMPORTANT — this step destructively mutates node_modules. Two guards
      # keep `npm audit` from later submitting the mutated tree to the npm
      # registry (which rejects it with `400 — Invalid package tree`):
      #   1. PRIMARY (self-healing): the Install Dependencies step above
      #      detects a stripped @ocr/flags and forces a fresh `npm ci`
      #      regardless of the install-stamp. See its comment block.
      #   2. BELT-AND-SUSPENDERS (this step): invalidate the install-stamp
      #      here so the stamp-hash path ALSO reinstalls next run, even if
      #      the primary detection is ever broken.
      # Diagnosed via workflow_dispatch force_clean=true (run 26111985672 =
      # success vs run 26110784159 same SHA = failure).
      - name: Fix @ocr/flags for SBOM resolution
        run: |
          FLAGS_PKG="node_modules/@ocr/flags/package.json"
          if [ -f "$FLAGS_PKG" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$FLAGS_PKG'));
              delete pkg.devDependencies;
              fs.writeFileSync('$FLAGS_PKG', JSON.stringify(pkg, null, 2));
            "
          fi
          # Belt-and-suspenders — invalidate install stamp; node_modules is no
          # longer pristine after the @ocr/flags mutation above.
          rm -f node_modules/.install-stamp

      - name: Generate SBOM
        run: |
          # --ignore-npm-errors: on GitHub-hosted ubuntu the newer npm marks our
          # own file:-linked workspace package @ocr/flags as `invalid` (ELSPROBLEMS)
          # because it is required via two different relative file: specifiers
          # (root file:../packages/flags + worker file:../../packages/flags) that
          # resolve to one realpath. The self-hosted Windows npm tolerated it; the
          # hosted npm exits 254 and kills cyclonedx (OSE-953 migration). This is a
          # first-party link quirk, not a supply-chain finding — npm audit (above),
          # CodeQL and semgrep are unaffected — so the advisory SBOM tolerates the
          # npm ls error and still inventories the resolvable tree.
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --omit dev --output-file sbom.json --output-format JSON --spec-version 1.5
          COMPONENT_COUNT=$(jq '.components | length' sbom.json 2>/dev/null || echo "unknown")
          echo "## S0 Security" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL:** see separate \`CodeQL\` workflow (canonical entry, Sweep 9)" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** passed" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** $COMPONENT_COUNT components (CycloneDX 1.5)" >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

  # ============================================================================
  # T0 GATE — Every push, every PR
  #
  # Sweep 9 (2026-05-14): sharded into 4 parallel matrix children so the
  # 3-runner Bloodraven pool can execute lint / typecheck / tests / a11y in
  # parallel rather than serial. Baseline: PR #160 measured 6.4 min for the
  # monolithic single job. Expected wall-clock after shard: ~3 min, driven
  # by the slowest T0 test sub-gate below (formerly the monolithic tests shard).
  #
  # Downstream jobs (`deploy-staging`, `summary`) reference `needs: [gate]`
  # which GitHub Actions resolves to "all matrix children succeeded" — no
  # change required there.
  #
  # Each shard runs identical setup (checkout, setup-node, stage @ocr/flags,
  # install root deps). The per-runner stamp cache (node_modules/.install-stamp)
  # makes the install a near no-op on warm runners, so the duplicated setup
  # cost is bounded to ~30-45s per shard. Worker deps are skipped on the
  # lint shard since eslint only touches root files — absorbs the original
  # Sweep 9 #3 (combine npm ci) win directly into the matrix design.
  # ============================================================================
  gate:
    name: 'T0 Gate (${{ matrix.shard }})'
    timeout-minutes: 15 # job ceiling; slowest observed run is far below it
    needs: [security]
    # OSE-954 (F2 slice, completes OSE-977): the ENTIRE T0 gate now runs on
    # ephemeral GitHub-hosted ubuntu-latest VMs. OSE-977 moved only the heavy
    # `tests` shard (the ~2879-case @cloudflare/vitest-pool-workers suite +
    # chronic OSE-696 workerd-corruption flake source); this slice moves the
    # remaining four — lint, typecheck, a11y, invariants — off the shared
    # self-hosted box as well. Rationale per shard:
    #   • lint / typecheck — pure Node (eslint, tsc, static guards), no workerd,
    #     no browser; zero-risk move.
    #   • a11y / invariants — a11y drives the workerd vitest pool and invariants
    #     drives Playwright/chromium; both are PROVEN green on ubuntu by the
    #     already-migrated `tests` shard, and a fresh per-shard VM gives workerd
    #     the "runs alone on clean hardware" condition that ended the OSE-696
    #     isolate corruption (ECONNRESET / "Failed to start cloudflare-pool
    #     worker" / "Reflect.get on non-object") on the RAM-bound box.
    # The required branch-protection check names derive from `matrix.shard`, so
    # they stay exactly "T0 Gate (<shard>)" — no protection change needed. The
    # Windows-only workerd-lock pre-install step self-skips (`runner.os ==
    # 'Windows'`). Moving the fs-reading structural gates to Linux also removes
    # the Windows path-sep vacuous-green class (OSE-980/981).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # OSE-954: `max-parallel: 1` is REMOVED. Its entire justification was the
      # single RAM-bound self-hosted box — concurrent workerd shards there
      # corrupted the shared isolate (ECONNRESET / "Worker exited unexpectedly"
      # / "Reflect.get called on non-object"). Now that every shard runs on its
      # own ephemeral ubuntu-latest VM there is zero cross-shard contention, so
      # the five shards run fully in parallel (wall-clock win: the gate is now
      # bounded by the slowest single shard, not their serial sum).
      matrix:
        # `invariants` shard (OSE-350) runs the structural 0-architecture
        # invariant tests on EVERY PR + push — see the "Architecture:
        # structural invariants" step below. Before this, the 0-architecture
        # suite ran only in dispatch-only T4 Functional, so the brain's
        # architectural contracts were not gated on normal development.
        # `component` shard (2026-09-01) runs viewport/layout specs against a
        # LOCAL worker (`wrangler dev --local` via playwright.component.config.ts).
        # It is the first tier that executes real FE flows on a PR: every other
        # Playwright config targets a deployed URL, which is why 55 surface specs
        # were gated by nothing while T2→T3→T4 sat behind staging.
        shard: [lint, typecheck, a11y, invariants, component]
    steps:
      # Self-hosted runner cleanup: stale _diag/pages/ log files left by
      # cancelled runs cause checkout to fail with "file already exists".
      # Run on every shard — concurrent rm -rf is safe (idempotent).
      # RUNNER_WORKSPACE = <runner_root>/_work/<repo> — go up two levels.
      - name: 'Clear stale runner diag files'
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      # OSE-1466 0.6, run time: this job runs the PR's code, so prove its token is
      # refused on push, comment and issue creation. Nothing is created. One
      # shard is enough: every shard of this job gets the same token.
      - name: 'Job token cannot push, comment or open issues'
        if: github.event_name == 'pull_request' && matrix.shard == 'lint'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_ISSUE: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/assert-token-read-only.sh

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # OSE-900: on self-hosted Windows a leftover workerd.exe from a prior job
      # can be pinned by a kernel System (PID 4) image-section handle that only
      # releases on reboot. `npm ci` on a lockfile-changing PR (stamp miss) must
      # delete node_modules and then dies on that locked file with
      # ENOTEMPTY/EPERM — which is why only Dependabot-style PRs fail install.
      # Pre-clear THIS workspace's workerd package so npm never has to delete a
      # locked file: try Remove-Item, else MOVE the dir aside (a directory
      # rename succeeds even when the file inside is section-locked; Remove-Item
      # alone cannot beat it). Path-scoped to $GITHUB_WORKSPACE — never a global
      # `taskkill /IM workerd.exe` — so concurrent jobs on the other runners that
      # share this box are untouched. Idempotent no-op; never fails the job.
      - name: 'Pre-install: clear locked workerd (Windows self-hosted)'
        if: runner.os == 'Windows' && matrix.shard != 'lint' && matrix.shard != 'invariants'
        # Windows PowerShell 5.1 — the self-hosted runners do NOT have pwsh
        # (PowerShell Core) installed. The script below is 5.1-compatible.
        shell: powershell
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          # 1) Kill ONLY workerd processes whose exe lives under this workspace.
          try {
            Get-CimInstance Win32_Process -Filter "Name='workerd.exe'" -ErrorAction Stop |
              Where-Object { $_.ExecutablePath -and $ws -and $_.ExecutablePath.StartsWith($ws, [System.StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object {
                Write-Host "stopping in-workspace workerd PID $($_.ProcessId): $($_.ExecutablePath)"
                try { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop } catch {}
              }
          } catch { Write-Host "workerd scan skipped: $($_.Exception.Message)" }
          # 2) Clear every workerd-windows-64 copy: delete, else move aside.
          $targets = @(
            'node_modules\wrangler\node_modules\@cloudflare\workerd-windows-64',
            'node_modules\@cloudflare\workerd-windows-64',
            'node_modules\@cloudflare\vitest-pool-workers\node_modules\wrangler\node_modules\@cloudflare\workerd-windows-64'
          )
          # Quarantine OUTSIDE the checkout (RUNNER_WORKSPACE = parent of the repo
          # dir, same volume) so it never lands in the git tree; it clears on reboot.
          $quarBase = if ($env:RUNNER_WORKSPACE) { $env:RUNNER_WORKSPACE } else { (Get-Location).Path }
          foreach ($t in $targets) {
            $full = Join-Path (Get-Location) $t
            $present = $true
            try { $present = Test-Path $full } catch { $present = $true }  # access-denied => treat as locked/present
            if (-not $present) { continue }
            try {
              Remove-Item -Recurse -Force -ErrorAction Stop $full
              Write-Host "removed $t"
            } catch {
              try {
                $dest = Join-Path $quarBase "_locked_workerd_quarantine_$([System.IO.Path]::GetRandomFileName())"
                [System.IO.Directory]::Move($full, $dest)
                Write-Host "quarantined (move-aside) $t -> $dest"
              } catch {
                Write-Host "WARN: could not clear $t ($($_.Exception.Message)); npm ci will attempt it"
              }
            }
          }
          exit 0

      # Worker deps not needed for the lint shard (eslint targets root paths)
      # nor the invariants shard (structural specs read source via node:fs —
      # they never import worker runtime code). All other shards exercise the
      # worker test suite or worker tsc, so they need
      # workers/oursharedevents/node_modules populated.
      - name: Install worker dependencies
        if: matrix.shard != 'lint' && matrix.shard != 'invariants'
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          # OSE-904: the "Pre-install: clear locked workerd" guard (OSE-900)
          # deletes/quarantines @cloudflare/workerd-windows-64 on EVERY run to
          # beat the image-section lock. The install-stamp alone does not know
          # workerd was cleared, so a lockfile-unchanged PR would skip npm ci and
          # leave workerd absent -> vitest dies at startup ("workerd-windows-64
          # could not be found"). Gate the skip on the workerd binary actually
          # being present so the clear/restore cycle self-heals every run.
          WORKERD=node_modules/@cloudflare/workerd-windows-64/bin/workerd.exe
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ] && [ -f "$WORKERD" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            [ -f "$WORKERD" ] || echo "workerd binary absent (cleared by the pre-install lock guard or a partial install) — forcing npm ci"
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: lint ────────────────────────────────────────────────────────
      # Banned origins + eslint + deprecation-lock guard. Smallest shard,
      # ~30-60s. Root deps only.
      - name: 'Security: Banned origins'
        if: matrix.shard == 'lint'
        run: npm run check:banned-origins

      # Brain Invariant #25 (sponsor_share_covenant, live): the sponsor-facing
      # pricing doc must not claim spend buys size/slot/position/dwell/rank.
      # Static prose-conformance guard (OSE-883); self-contained (brain YAML is
      # not vendored into OSE — same convention as the OSE-336 drift check).
      - name: 'Security: Sponsor pricing covenant (Invariant #25)'
        if: matrix.shard == 'lint'
        run: node scripts/check-sponsor-pricing-covenant.mjs

      # Brain Invariant #10 (deprecation_lock): the canonical instance of
      # the deprecation-lock pattern. OSE migrated off Google Apps Script
      # to Cloudflare Workers + D1; this guard scans the repo for any
      # reintroduced GAS pattern and fails non-zero on hit. A guard that
      # exists in scripts/ but is never invoked by CI is cosmetic — the
      # 0-architecture invariant test
      # tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts
      # asserts this step exists in the workflow.
      #
      # Self-tests run BEFORE the guard itself. The Windows-path
      # regression that hid behind the un-wired self-tests (allowlist
      # silently inert when paths used backslashes; 91 entries loaded,
      # 0 matched) is exactly what an un-tested guard ships. Running the
      # self-tests in CI guarantees the next regression of the same class
      # surfaces in seconds, not months.
      - name: 'Security: Deprecation lock — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-no-gas

      # OSE-1220: declined-regimes gate. HIPAA (tier 4) / COPPA (tier 5) / SOPPA
      # are declined regimes; this fails the build if wrangler sets
      # ALLOWED_MAX_TIER above 3 or a migration seeds a tier-4/5 event type —
      # the two ways a declined regime could receive writes. Self-tests run
      # first so the guard cannot silently rot into a false green.
      - name: 'Security: Declined regimes — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-declined-regimes

      - name: 'Security: Declined regimes (no HIPAA/COPPA/SOPPA re-entry)'
        if: matrix.shard == 'lint'
        run: npm run guard:declined-regimes

      # OSE-696: self-tests for the workerd-pool retry wrapper. Locks the
      # load-bearing property that it passes ONLY on a clean exit-0 run — a
      # teardown crash (which drops a whole spec file) or a real assertion
      # failure can never be masked into a green gate.
      - name: 'Quality: vitest-retry wrapper self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:vitest-retry

      - name: 'Security: Deprecation lock (no-GAS guard)'
        if: matrix.shard == 'lint'
        run: npm run guard:no-gas

      # ADR-020 — PR-reachable secret surface stays within the reviewed allowlist
      # (no deploy/infra cred reachable on a plain, agent-authorable PR) and no
      # pull_request_target. Self-test first so a "simplified" evaluator that
      # stops detecting leaks is caught before the guard itself runs. Static,
      # deps-free (~1s); runs on every PR so a new exposure is red pre-merge.
      - name: 'Security: PR-secret exposure guard — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-pr-secrets
      - name: 'Security: PR-secret exposure guard (ADR-020)'
        if: matrix.shard == 'lint'
        run: npm run guard:pr-secrets

      # OSE-1389 — the static SMOKE_RPT_* SharedReport tokens are retired for
      # run-time minting via the worker mint-link route (scripts/
      # mint-t4-report-tokens.mjs). This fails if the static GitHub-secret
      # reference or the retired offline signer (mint-smoke-rpt-tokens) returns.
      # Self-test first so the guard cannot rot into a false green.
      - name: 'Security: no static SharedReport smoke-token secrets — self-tests'
        if: matrix.shard == 'lint'
        run: npm run test:guard-no-smoke-rpt
      - name: 'Security: no static SharedReport smoke-token secrets (OSE-1389)'
        if: matrix.shard == 'lint'
        run: npm run guard:no-smoke-rpt

      # OSE-803 — schema guard constants must track the migration directories.
      # Static, deps-free, ~1s. Runs on every PR so a forgotten constant bump is
      # a red check pre-merge, not a silently-weakened guard discovered at deploy.
      # The pre-deploy migrations-list gate (deploy jobs below) is the runtime half.
      - name: 'Security: Schema guard constants in step (OSE-803)'
        if: matrix.shard == 'lint'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-schema-guard.mjs

      # OSE-802 — prevent new cross-schema columns from reusing a name with
      # an incompatible SQLite affinity. Known legacy collisions are explicit
      # baselines in the guard and must carry a reason.
      - name: 'Security: Column type collision guard (OSE-802)'
        if: matrix.shard == 'lint'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-column-type-collisions.mjs

      - name: 'Quality: Lint'
        if: matrix.shard == 'lint'
        run: npx eslint config/ scripts/ tests/unit/ tests/contract/ --cache --cache-location node_modules/.eslintcache

      # Tier-1 static preflight: validates manifest anchors exist in templates
      # without a browser. Catches manifest/template drift in seconds.
      - name: 'Smoke: manifest preflight (static)'
        if: matrix.shard == 'lint'
        run: OSE_TPL=workers/oursharedevents/src/templates npx tsx --test tests/ui/smoke/static-check.test.ts

      # Test-id registry drift (2026-09-01). web/shared/testids.js is DERIVED from
      # the surface templates, so a template that renames or adds a data-testid
      # without regenerating leaves the registry — and the generated Bruno
      # environment `bru run` reads — silently wrong. Sits beside the manifest
      # preflight above because it is the same class of check: template/artifact
      # drift, caught statically in a second, with no browser and no network.
      - name: 'Lint: test-id registry matches the templates'
        if: matrix.shard == 'lint'
        run: node scripts/gen-testids.mjs --check

      # Pool triage manifest drift (2026-10-07). docs/testing/vitest-pool-triage.json
      # is DERIVED from the worker specs: which pool each one needs, and how many
      # tests it holds. The check existed for three weeks with nothing running it,
      # and the manifest fell 128 specs behind. Same class as the registry check
      # above: a derived file compared with its source, statically, in a second.
      # It goes red when a worker spec is added, removed or moved, or when its
      # test count changes; the fix is `node scripts/triage-vitest-pool.mjs` and
      # committing the result. Wiring held by
      # tests/integration/vitest-pool-triage-wired.test.js.
      - name: 'Lint: pool triage manifest matches the worker specs'
        if: matrix.shard == 'lint'
        run: node scripts/triage-vitest-pool.mjs --check

      # OSE-1328: one color pattern fleet-wide — colors go through var(--token),
      # never raw hex. Ratchet per surface (count can only drop; clean pages
      # locked at 0). This is what makes "theme-correct" a gate, not a pixel-check.
      - name: 'Lint: token adherence (no raw hex; one var(--token) pattern)'
        if: matrix.shard == 'lint'
        run: node scripts/check-token-adherence.mjs

      # ADR-008 Phase 0: @ocr/ui's contrast gate and its own unit suite moved to the hub CI (pnpm ui:contrast, pnpm ui:test) with the package itself.

      # ADR-008 Phase 0 — per-spoke gate against a forked design system. Runs the
      # hub's check-spoke-styles.mjs at the PINNED hub commit (.ocr-hub-ref,
      # staged to ../packages/ui above). Blocks any new/grown own-token layer,
      # own stylesheet over the inline budget, raw hex, or non-/ui.css stylesheet
      # link; existing debt is the baseline in .ocr-design-check.json and may only
      # shrink. Complements (does not replace) the token-adherence ratchet above.
      # On PRs the baseline file itself is compared against the base branch's
      # copy (--base-config, OSE-1397): a PR may lower it, never raise it or
      # widen what the check scans.
      - name: 'Lint: no spoke-owned tokens or stylesheet (@ocr/ui check-spoke-styles, pinned)'
        if: matrix.shard == 'lint'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ARGS=()
          if [ -n "$BASE_REF" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            if git cat-file -e FETCH_HEAD:.ocr-design-check.json 2>/dev/null; then
              git show FETCH_HEAD:.ocr-design-check.json > "$RUNNER_TEMP/base-design-check.json"
              ARGS=(--base-config "$RUNNER_TEMP/base-design-check.json")
            fi
          fi
          node ../packages/ui/scripts/check-spoke-styles.mjs --root . "${ARGS[@]}"

      # CI integrity ratchets (OSE-1606, wired by OSE-1691). continue-on-error
      # steps, test skips and orphan specs may only shrink; the counts live in
      # .ci-integrity-baseline.json. Until OSE-1691 nothing in CI ran this
      # script: a test only compared against origin/main when a shallow checkout
      # happened to have it, so a raised baseline passed. On a PR the baseline is
      # compared with the base branch's copy, so a PR may lower it, never raise
      # it. A deliberate raise (owner decision) is an admin merge over this red
      # step, with the reason recorded on the baseline entry.
      - name: 'Lint: CI integrity ratchets (skips, continue-on-error, orphan specs)'
        if: matrix.shard == 'lint'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ARGS=()
          if [ -n "$BASE_REF" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            if git cat-file -e FETCH_HEAD:.ci-integrity-baseline.json 2>/dev/null; then
              git show FETCH_HEAD:.ci-integrity-baseline.json > "$RUNNER_TEMP/base-ci-integrity.json"
              ARGS=(--base-config "$RUNNER_TEMP/base-ci-integrity.json")
            fi
          fi
          node scripts/ci/ci-integrity-ratchets.mjs --root . "${ARGS[@]}"

      # Staging and production stay in sync (owner, 2026-10-12): every difference
      # between [env.staging] and [env.production] in wrangler.toml is named, with
      # its reason, or this fails. Undecided items are printed on every run. While
      # production is held this run is lenient; once the owner sets PRODUCTION_LIVE
      # it runs --strict, so going live with an undecided difference turns every
      # run red instead of passing quietly. No network.
      - name: 'Lint: staging and production config parity'
        if: matrix.shard == 'lint'
        env:
          PARITY_ARGS: ${{ vars.PRODUCTION_LIVE == 'true' && '--strict' || '' }}
        run: node scripts/ci/env-parity.mjs $PARITY_ARGS

      # L1: CF Access probe classifier (OSE-349). Pins the enum shared by the
      # in-CI preflight step and the cf-access-canary tripwire — no network.
      - name: 'Unit: CF Access probe classifier'
        if: matrix.shard == 'lint'
        run: bash tests/ci/cf-access-probe.test.sh

      # ── Shard: typecheck ───────────────────────────────────────────────────
      # tsc --noEmit on the worker. Standalone shard so a type regression
      # surfaces as a single named check, not buried inside a multi-step job.
      - name: 'Quality: TypeScript'
        if: matrix.shard == 'typecheck'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      # ── Shard: a11y ────────────────────────────────────────────────────────
      # axe-core WCAG 2.0 AA scan via the worker test runner.
      - name: 'Quality: A11Y axe-core WCAG 2.0 AA scan'
        if: matrix.shard == 'a11y'
        run: npm run test:a11y
        working-directory: ${{ env.WORKER_DIR }}

      - name: Restore Playwright browser cache
        if: matrix.shard == 'invariants' || matrix.shard == 'component'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The browser cache above holds the browser binaries. This one holds the
      # Ubuntu packages `--with-deps` installs for them (WebKit: 181 packages,
      # 126 MB). On 2026-10-07 the runner's mirror served those at 30-100 kB/s
      # and the component shard hit the job ceiling before a test started.
      # scripts/ci/install-playwright-browsers.sh copies this directory into
      # apt's cache before the install and refreshes it after the download.
      # One cache per browser set, so the chromium-only shard never saves its
      # smaller set under the key the WebKit shard restores.
      - name: Restore Playwright system package cache
        if: matrix.shard == 'invariants' || matrix.shard == 'component'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pw-apt-archives
          key: ${{ runner.os }}-pw-apt-${{ matrix.shard == 'component' && 'chromium-webkit' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-apt-${{ matrix.shard == 'component' && 'chromium-webkit' || 'chromium' }}-

      # ── Shard: invariants (OSE-350) ────────────────────────────────────────
      # The STRUCTURAL subset of the 0-architecture invariant suite — the
      # code-shape locks that read source files via node:fs and assert the
      # brain's architectural contracts hold. These need no deployed worker,
      # so they gate EVERY PR + push here in T0 Gate.
      #
      # Why this exists: before OSE-350 the entire 0-architecture suite ran
      # only in T4 Functional, which was then dispatch-only. That meant the brain's
      # "CI-enforced contracts" were NOT enforced on normal development — a PR
      # could break an invariant's code shape and nothing caught it unless
      # someone manually dispatched T4. This shard closes that
      # enforcement-continuity gap: invariants are carried from 0 through the
      # whole flow.
      #
      # ONLY the structural subset runs here. Runtime invariant specs
      # (anonymous-id, geo-resolution, ncr-accumulation, uec-codes) need a
      # deployed worker and stay in T4 / post-deploy tiers. The file list
      # below is locked by the placement guard in
      # tests/integration/infra-consistency.test.js — a new structural
      # invariant spec that is not listed here fails that guard, so the
      # continuity cannot silently regress.
      - name: 'Architecture: structural invariants'
        if: matrix.shard == 'invariants'
        run: |
          # OSE-954: --with-deps pulls the chromium system libraries on the
          # ephemeral ubuntu VM (passwordless sudo on GitHub-hosted runners);
          # harmless on other platforms. Prevents a missing-shared-lib failure
          # now that this shard no longer runs on the pre-provisioned box.
          # Through the install script, so a slow package mirror cannot run
          # the shard into its ceiling (see the system package cache above).
          bash scripts/ci/install-playwright-browsers.sh chromium
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            tests/e2e/0-architecture/aggregate-only.invariant.spec.ts \
            tests/e2e/0-architecture/api-response-schema.invariant.spec.ts \
            tests/e2e/0-architecture/cors-allowlist.invariant.spec.ts \
            tests/e2e/0-architecture/csp-connect-src.invariant.spec.ts \
            tests/e2e/0-architecture/cost-metric-never-who.invariant.spec.ts \
            tests/e2e/0-architecture/declined-regimes.invariant.test.ts \
            tests/e2e/0-architecture/event-series.invariant.spec.ts \
            tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts \
            tests/e2e/0-architecture/i18n-catalog-only.invariant.spec.ts \
            tests/e2e/0-architecture/log-redaction.invariant.spec.ts \
            tests/e2e/0-architecture/migration-monotonicity.invariant.spec.ts \
            tests/e2e/0-architecture/monetization-inert.invariant.spec.ts \
            tests/e2e/0-architecture/oer-emission-boundary.invariant.spec.ts \
            tests/e2e/0-architecture/export-grain.invariant.spec.ts \
            tests/e2e/0-architecture/pii-retention.invariant.spec.ts \
            tests/e2e/0-architecture/rendered-surface-lexicon.invariant.spec.ts \
            tests/e2e/0-architecture/runtime-llm-free.invariant.spec.ts \
            tests/e2e/0-architecture/slug-permanence.invariant.spec.ts \
            tests/e2e/0-architecture/shared-report-schema.invariant.spec.ts \
            tests/e2e/0-architecture/tenant-isolation.invariant.spec.ts \
            tests/e2e/0-architecture/campaign-brand-and-consent.invariant.spec.ts \
            tests/e2e/0-architecture/admin-null-actor.invariant.spec.ts \
            tests/e2e/0-architecture/admin-guard-order.invariant.spec.ts \
            tests/e2e/0-architecture/tier-equity.invariant.spec.ts \
            tests/e2e/0-architecture/uec-poster-color.invariant.spec.ts \
            tests/e2e/0-architecture/sponsor-share-covenant.invariant.spec.ts \
            tests/e2e/0-architecture/scan-path-split.invariant.spec.ts \
            tests/e2e/0-architecture/geo-resolution.structural.invariant.spec.ts \
            tests/e2e/0-architecture/place-name-search.invariant.spec.ts \
            tests/e2e/0-architecture/ncr-accumulation.structural.invariant.spec.ts \
            tests/e2e/0-architecture/sponsor-identity-split.invariant.spec.ts \
            tests/e2e/0-architecture/edge-token-verification.invariant.spec.ts \
            tests/e2e/0-architecture/sponsor-signal-never-who.invariant.spec.ts \
            tests/e2e/0-architecture/ci-approval-gate-safety.invariant.spec.ts \
            tests/e2e/0-architecture/worker-claude-md.invariant.spec.ts \
            tests/e2e/0-architecture/qr-decode-matrix.invariant.spec.ts \
            tests/e2e/0-architecture/workflow-injection.invariant.spec.ts \
            tests/e2e/0-architecture/cookie-setters.invariant.spec.ts \
            tests/e2e/0-architecture/timestamp-precision.invariant.spec.ts \
            tests/e2e/0-architecture/lexicon-allowance.invariant.spec.ts

      # ── Shard: component ───────────────────────────────────────────────────
      # Real browser engine, no deploy. The webServer in
      # playwright.component.config.ts starts `wrangler dev --local`; root AND
      # worker deps are already installed above, which is what the bundle needs.
      #
      # ONE REVIEWED BATCH. Specs are named explicitly — never a broad
      # testMatch — because a spec written against staging can pass here while
      # no longer testing what it was written for. poster-qr-layout.spec.ts is
      # the worked example: it navigates to the absolute URL
      # http://poster.test/poster, ignores baseURL, and would not follow this
      # config at all. Add the next batch only after an assertion-level read.
      #
      # Chromium AND WebKit (OSE-1228 / OSE-1070). Layout regressions are routinely
      # engine-specific, so a Chromium-only pass understated coverage. Both projects
      # are declared in playwright.component.config.ts; installing both browsers and
      # NOT filtering --project runs both, and the config's WebKit-listed-second note
      # holds — a runner missing WebKit deps now fails on the named project rather
      # than silently reducing coverage.
      #
      # Routed through scripts/pw-guarded.sh (OSE-1228 fix 1): the bare invocation
      # had no floor, so a zero-discovery (mistyped path) or all-skipped run would
      # have reported green. The guard counts discovery BEFORE the run and fails if
      # executed==0 while discovered>0, and publishes the executed/skipped split so
      # partial skips are visible instead of silent (the old "35 passed / 22 skipped,
      # nothing flagged" false green).
      #
      # WebKit opens one blank page before the tests (2026-10-08, run
      # 37795716364): the first page a just-installed WebKit was asked for did
      # not open inside the 30 s test limit on either worker, and every later
      # one did. The warm-up loads no page of the app; retries stay at 0 and
      # the test limit at 30 s, so a page that hangs still fails.
      #
      # sponsor-thumbnails.component.spec.ts (OSE-1955) needs no worker: it
      # renders the event page with the real renderer and @ocr/ui stylesheet
      # (tests/e2e/helpers/render-event-page.ts, bundled with the worker's own
      # esbuild) and answers every request from page routes. It is the component
      # layer under T4j: logo box, 44 px targets, no sideways scroll at 320/375,
      # focus ring and axe, light and dark.
      - name: 'Component: viewport specs vs local worker'
        if: matrix.shard == 'component'
        run: |
          bash scripts/ci/install-playwright-browsers.sh chromium webkit
          node scripts/ci/warm-playwright-browser.mjs webkit
          PW_LABEL='T0: Component (viewport)' scripts/pw-guarded.sh \
            --config=playwright.component.config.ts \
            tests/e2e/2-pages/poster-print.spec.ts \
            tests/e2e/2-pages/form-pages-responsive.spec.ts \
            tests/e2e/2-pages/a11y-axe-surfaces.spec.ts \
            tests/e2e/2-pages/sponsor-thumbnails.component.spec.ts

      # Post-job cleanup: delete _diag/pages/ so the next run's runner agent
      # can create fresh log files without "file already exists" collisions.
      # Runs on every shard, always (even on failure/cancel). Concurrent
      # rm -rf is safe — idempotent on already-missing directories.
      - name: 'Cleanup: clear diag pages for next run'
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

  # T0 test sub-gates: keep the existing required context `T0 Gate (tests)` as
  # an aggregate below, but split the former 9+ minute long-pole job into
  # independently visible and parallel sections.
  gate-tests-sub:
    name: "T0 Tests (${{ matrix.section }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})"
    timeout-minutes: 20 # job ceiling; slowest observed run is far below it
    needs: [security]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: security-iac
            workdir: .
            command: >-
              npx vitest run
              tests/unit/worker/sec-iac-03-adminOAuth.test.js
              tests/unit/worker/sec-iac-04-public-read-only.test.js
              tests/unit/worker/sec-iac-05-signed-mutations.test.js
              tests/unit/worker/sec-iac-07-iac-smoke.test.js
          - section: root-vitest
            workdir: .
            command: npx vitest run
          - section: ui-drift
            workdir: .
            command: node scripts/check-ui-drift.mjs
          # The worker suite is the T0 long pole (8.2 min of an 8.9 min job,
          # measured over 56 runs, 2026-10-01). The workers pool is pinned to
          # maxWorkers: 1 (OSE-696), so a bigger runner cannot speed it up; the
          # lever is more runners. vitest --shard splits the spec FILES of both
          # projects (workers + node) into disjoint slices, each on its own VM
          # with its own single pool worker. Each slice keeps the retry wrapper.
          # qr-decode-matrix.invariant.spec.ts fails unless the slices are exactly
          # 1/N..N/N, so dropping or duplicating one cannot silently skip specs.
          - section: worker-d1-schema
            shard: 1/3
            workdir: workers/oursharedevents
            command: node ../../scripts/vitest-retry.mjs npm test -- --shard=1/3
          - section: worker-d1-schema
            shard: 2/3
            workdir: workers/oursharedevents
            command: node ../../scripts/vitest-retry.mjs npm test -- --shard=2/3
          - section: worker-d1-schema
            shard: 3/3
            workdir: workers/oursharedevents
            command: node ../../scripts/vitest-retry.mjs npm test -- --shard=3/3
          - section: launch-contracts
            workdir: workers/oursharedevents
            command: >-
              npx vitest run
              tests/public-event-page.spec.ts
              tests/public-event-calendar.spec.ts
              tests/admin-draft-preview.spec.ts
              tests/admin-event-lifecycle-ui.spec.ts
              tests/admin-ui.spec.ts
              tests/poster-qr.spec.ts
              tests/tier-equity-sort.spec.ts
    steps:
      - name: 'Clear stale runner diag files'
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Install worker dependencies
        if: matrix.workdir == 'workers/oursharedevents'
        working-directory: ${{ env.WORKER_DIR }}
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          WORKERD=node_modules/@cloudflare/workerd-windows-64/bin/workerd.exe
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ] && { [ "$RUNNER_OS" != "Windows" ] || [ -f "$WORKERD" ]; }; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # The worker D1 schema run imports OCR-docs brain artifacts at vitest config
      # time. Root/local runs skip when absent; CI must provide them.
      - name: 'Checkout OCR-docs brain (for OSE-323 drift check)'
        if: matrix.section == 'worker-d1-schema' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          ref: main
          path: ocr-docs-brain-checkout
          token: ${{ secrets.OCR_HUB_READ }}
          # ADR-012 0.1: the next step runs PR code (npm ci + tests); never leave
          # the token where it can be read.
          persist-credentials: false

      # OSE-1466 0.1, run time: the steps below run PR code, so prove the
      # checkout above left no credential on disk.
      - name: 'No token left behind by the brain checkout'
        if: matrix.section == 'worker-d1-schema' && github.actor != 'dependabot[bot]'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/assert-no-persisted-token.sh ocr-docs-brain-checkout

      - name: 'Run T0 test section'
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.command }}
        env:
          BRAIN_DIR: ${{ github.workspace }}/ocr-docs-brain-checkout/ocr-docs-brain

      - name: 'Cleanup: clear diag pages for next run'
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_WORKSPACE/../../_diag/pages" 2>/dev/null || true

  gate-tests:
    name: 'T0 Gate (tests)'
    timeout-minutes: 5 # job ceiling; slowest observed run is far below it
    needs: [gate-tests-sub]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Summarize T0 test sub-gates
        run: |
          echo "## T0 Gate (tests)" >> $GITHUB_STEP_SUMMARY
          echo "Sub-gates finished with result: \`${{ needs.gate-tests-sub.result }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.gate-tests-sub.result }}" != "success" ]; then
            echo "::error::One or more T0 test sub-gates failed or were cancelled"
            exit 1
          fi

  # ============================================================================
  # LOCAL VETTING — T2/T3 (API contract + smoke) on THIS branch's code, PRs only
  # ============================================================================
  # T2 (Bruno) and T3 (Playwright smoke) used to run only after merge, against
  # shared staging. This runs the same collections and specs on every PR against a
  # local worker with a local D1 (the way the mobile audit does), so the diff under
  # review is what gets tested, no deploy and no secrets are involved, and PRs
  # cannot step on each other's staging. The script fails a section that ran zero
  # tests. The post-merge staging T2/T3 still run unchanged (deployed-surface
  # verdict); whether they stay is a pending decision, not part of this change.
  local-vetting:
    name: 'T2/T3 Local (PR code)'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [security, gate, gate-tests]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.gate-tests.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # The worker bundles @ocr/ui from the pinned hub commit (ADR-008), so this is
        # REQUIRED, never continue-on-error.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      - name: Install root dependencies
        run: npm ci --prefer-offline || npm ci
      - name: Install worker dependencies
        working-directory: workers/oursharedevents
        run: npm ci --prefer-offline || npm ci
      - name: Install Playwright Chromium
        run: bash scripts/ci/install-playwright-browsers.sh chromium
      - name: Vet this branch (T2 Bruno + T3 smoke on a local worker)
        run: bash scripts/ci/run-local-vetting.sh
      - name: Scan artifacts for credentials
        id: artifact-scan
        if: always()
        run: bash scripts/ci/scan-artifacts-for-secrets.sh .test-results/
      - name: Upload local vetting results
        uses: actions/upload-artifact@v7
        if: always() && steps.artifact-scan.outcome == 'success'
        with:
          name: local-vetting-${{ github.run_number }}
          path: .test-results/
          retention-days: 14
          include-hidden-files: true

  # ============================================================================
  # T1 DEPLOY → Staging — Push to main or dispatch
  # ============================================================================
  deploy-staging:
    name: 'T1 Deploy → Staging'
    timeout-minutes: 20 # job ceiling; slowest observed run is far below it
    # OSE-1257 source pattern: GitHub-hosted staging deploy. wrangler deploy + D1 migrations authenticate with
    # CLOUDFLARE_API_TOKEN (a repo secret, IP-independent), so an ephemeral runner
    # deploys exactly as the self-hosted box did — there is no source-IP allow-list
    # to lose. npm ci resolves @ocr/ui (required, hub commit pinned in
    # .ocr-hub-ref — ADR-008) and @ocr/flags via ci-stage-ocr-workspace.sh,
    # already proven on ubuntu by S0 + the T0 gate. No SBOM step here (that lives in S0).
    runs-on: ubuntu-24.04
    needs: [security, gate, gate-tests]
    # Opt-in full-pipeline-on-PR: a PR whose HEAD branch is named `full-pipeline/*`
    # runs T1 Deploy→Staging (and therefore the whole T2 Contract → T3 E2E Smoke
    # → T4 Functional fail-fast chain, which cascade on deploy-staging success).
    # Lets you watch the staged pipeline end-to-end on a PR without merging.
    # Normal PRs still skip T1–T4. NOTE: this DEPLOYS the PR branch to the shared
    # staging worker for the duration of the run (same-repo PR → secrets present).
    # OSE-1217: production tag/dispatch also starts here, so production is gated
    # by a green staging chain on the SAME SHA rather than a previously-recorded
    # staging run or only S0/T0.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'full-pipeline/'))
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      # ────────────────────────────────────────────────────────────────────
      # CCR-PR567 H2 + re-run item 5 — fail-closed secret PRESENCE gate, BEFORE
      # the remote D1 migrate steps. A missing secret here ships a corner
      # SILENTLY INERT or, per OSE-1343, a masked 503 on register/email-signup
      # (missing FORMS_HASH_PEPPER never surfaced pre-deploy because this gate
      # only checked SHARED_REPORT_SIGNING_SECRET — the pepper wasn't even in
      # set-secrets.sh's REQUIRED_SECRETS list). We must not mutate the shared
      # remote D1 for a deploy we already know is doomed. `wrangler secret
      # list` sees only the NAME (never the value); value-length is enforced
      # at provisioning (set-secrets.sh) and functionally by the T4 /sponsor
      # journey (a public /health field would trip the NS-3 boring-OK gate).
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: required secrets present (pre-migrate, fail-closed corner) (OSE-1343)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          # A failed `secret list` is an auth or network finding, never "not set" (OSE-1731).
          OUT="$(npx wrangler secret list --env staging 2>&1)" && RC=0 || RC=$?
          bash ../../scripts/ci/classify-wrangler-failure.sh "$RC" "$OUT" staging
          for SECRET in SHARED_REPORT_SIGNING_SECRET FORMS_ENCRYPTION_KEY FORMS_HASH_PEPPER RATE_LIMIT_KEY_PEPPER; do
            if ! echo "$OUT" | grep -q "$SECRET"; then
              echo "::error::$SECRET is not set on the staging worker — refusing to migrate remote D1 for a deploy that would ship a fail-closed corner inert (or, for FORMS_HASH_PEPPER, a masked 503 per OSE-1343; for RATE_LIMIT_KEY_PEPPER, IP-reversible rate-limit keys per OSE-1447). Provision it: bash scripts/set-secrets.sh staging"
              echo "$OUT"
              exit 1
            fi
          done
          echo "SHARED_REPORT_SIGNING_SECRET, FORMS_ENCRYPTION_KEY, FORMS_HASH_PEPPER, RATE_LIMIT_KEY_PEPPER present on staging (names only: wrangler cannot read values; length is enforced at provisioning by scripts/set-secrets.sh)."
          # OSE-1659: ANON_ID_HASH_PEPPER keys scan_node_returns.anonymous_id and
          # hashes anon_id_returns. Without it scans are stored with no id and
          # returns are not counted, but nothing breaks and nothing leaks, so a
          # missing value is a warning until it has been provisioned once.
          if ! echo "$OUT" | grep -q "ANON_ID_HASH_PEPPER"; then
            echo "::warning title=ANON_ID_HASH_PEPPER missing::ANON_ID_HASH_PEPPER is not set on the staging worker: scans are stored with no id and returning visitors are not counted (OSE-1659). Provision it: bash scripts/set-secrets.sh staging"
          fi

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      # ────────────────────────────────────────────────────────────────────
      # OSE-813 — no placeholder binding IDs may reach a deploy.
      #
      # HARD GATE. The RATE_LIMIT_KV namespaces were provisioned 2026-08-18
      # (rate-limit-staging / rate-limit-production) and their real IDs are in
      # wrangler.toml, so the last placeholders are gone. This step now fails the
      # deploy if any binding ID matches PROVISION/TODO/REPLACE/… — the next
      # placeholder must not survive the way the KV ones did (OSE-544 closed the
      # D1 placeholders and never saw the KV ones).
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: no unprovisioned binding IDs (OSE-813)'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-binding-placeholders.mjs

      # ────────────────────────────────────────────────────────────────────
      # Post-migration canonical-shape verification (OSE-209/OSE-1347 hardening).
      #
      # Asserts the staging D1 schema, AFTER wrangler applies migrations,
      # matches the canonical table set in migration-smoke.spec.ts and the
      # canonical column set derived from the migration SQL itself.
      #
      # The earlier version of these steps asserted COUNT(*) against a
      # hardcoded 6-table list (DB) / 5-table list (FORMS_DB) and never
      # got updated as new migrations landed (0010, 0014, 0019-0023, 0026,
      # 0009-FORMS, etc.). That drift silently masked real-D1 regressions
      # — the same regressions the PR-time miniflare smoke test (OSE-209)
      # already catches in vitest. Now both layers reference the same
      # canonical set, name-based, with a trigger=0 invariant on top.
      # OSE-1347 extends the same deploy gate to PRAGMA table_info per table so
      # column drift blocks before the first staging write path discovers it.
      # ────────────────────────────────────────────────────────────────────

      - name: 'Verify staging D1 (canonical tables + columns, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/verify-d1-canonical-shape.mjs --env staging

      # ────────────────────────────────────────────────────────────────────
      # OSE-803 — pre-deploy schema gate.
      #
      # `wrangler d1 migrations apply` can fail partway: some DDL lands, the
      # d1_migrations row is never written, and the step can still exit 0. The
      # Worker then deploys against a database it is ahead of, the deploy goes
      # green, and the failure surfaces later as SQLITE_ERROR at prepare time.
      #
      # This gate asserts ZERO unapplied migrations on BOTH bindings immediately
      # before the Worker ships. Read-only (`migrations list`), reuses the
      # credentials the apply steps above already hold, adds no new secret and no
      # new permission. Fails closed — an auth error also stops the deploy.
      #
      # Runtime backstop for what CI cannot see (Worker rollback, binding
      # repointed in the dashboard): src/lib/schema-guard.ts.
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: zero unapplied D1 migrations before deploy (OSE-803)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          node scripts/check-schema-guard.mjs
          FAILED=0
          for BINDING in DB FORMS_DB; do
            OUT="$(npx wrangler d1 migrations list "$BINDING" --env staging --remote 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'No migrations to apply'; then
              echo "ok    $BINDING (staging): no unapplied migrations"
            else
              echo "FAIL  $BINDING (staging): unapplied migrations remain, or the check could not run"
              printf '%s\n' "$OUT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to deploy a Worker ahead of its database."
            exit 1
          fi

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Health check passed"
          # Signing-secret value-validity is NOT asserted here: /health stays
          # "boring OK" for the NS-3 security gate (no secret-adjacent fields on a
          # public endpoint). It is covered at provisioning (set-secrets.sh length
          # check) and functionally by the T4 /sponsor journey, which fails if the
          # signing secret is unset/short (CCR-PR567 re-run item 5, revised).

  # ============================================================================
  # T2 CONTRACT — Bruno API + Pages (post-deploy + nightly) (OSE-1191). First post-deploy gate.
  # ============================================================================
  contract-staging-sub:
    name: 'T2 Contract (${{ matrix.section }})'
    timeout-minutes: 15 # job ceiling; slowest observed run is far below it
    # One section at a time across runs. The workflow-level staging lock already keeps
    # two CI runs apart; this job group stays as a second guard, since two runs seed the same fixture ids
    # (the pages leg publishes the landing zip fixture, then unpublishes it after
    # Bruno): without this, one run's reset could land mid-way through the other's
    # assertions. A second run waits; it is never cancelled out from under a merge.
    # The pages leg writes to stg (the landing zip fixture), so it also waits for the
    # stock load, the event lifecycle and the rollback drill: one stg writer at a
    # time (CCR 2026-11-07 R-07).
    concurrency:
      group: ${{ matrix.section == 'pages' && 'stg-writer' || format('ose-t2-staging-{0}', matrix.section) }}
      cancel-in-progress: false
    # OSE-954: runs on ephemeral ubuntu-latest. Bruno (`bru run`) + wrangler-d1
    # seed only; no deploy. Staging auth is the header-based CF Access service
    # token (CF_ACCESS_CLIENT_ID/SECRET + Bearer ADMIN_KEY) and the D1 seed uses
    # CLOUDFLARE_API_TOKEN — all repo secrets, all IP-independent, so the
    # ephemeral runner reaches staging exactly as the self-hosted box did.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: write # dorny/test-reporter publishes the results as a check
    # Fail-fast chain, stage 1 of 3 (after T1 deploy): Bruno API + Pages
    # contract. Contract-first — nail the API contract, THEN perpetuate into the
    # FE. A red here SKIPS the downstream FE E2E smoke (T3) and functional (T4),
    # so a broken API contract is fixed before any FE layer runs.
    needs: [security, gate, gate-tests, deploy-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.gate-tests.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: api
            label: 'T2: Bruno API contract'
            collection: bruno/ose-api
            junit: bru-api-junit.xml
          - section: pages
            label: 'T2: Bruno Pages contract'
            collection: bruno/ose-pages
            junit: bru-pages-junit.xml
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # REQUIRED — never continue-on-error: the worker install below resolves
        # @ocr/ui from the staged hub, and the seed steps need the locked wrangler
        # it installs (OSE-1731 follow-up, run 39194783868).
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # Locked wrangler for the seed steps below (they run with the Cloudflare token).
      # Root has no wrangler, so without this `npx wrangler` fetches the newest release
      # instead of the version workers/oursharedevents/package-lock.json pins.
      - name: Install worker dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      # CF Access preflight probe (OSE-349) — diagnostic only, does not gate.
      # Delegates to the shared classifier so the in-CI probe and the scheduled
      # canary (.github/workflows/cf-access-canary.yml) can never drift into two
      # copies of the anti-drift tool. Here it runs WITHOUT --gate: the Bruno
      # contract stays the source of truth per the tests-surface-truth doctrine, and this step
      # only auto-classifies the next failure into the step summary.
      - name: CF Access preflight probe
        if: matrix.section == 'api'
        id: preflight
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          chmod +x scripts/ci/cf-access-probe.sh
          scripts/ci/cf-access-probe.sh

      # OSE-1419: migration 0086 removes 0013's test-event-001 from any database
      # where nothing references it, so the event is no longer something a
      # migration guarantees. The api, pages and sharedreport collections all target it.
      # Seed it here on purpose. NOT continue-on-error: a missing event fails at
      # this step, by name, not as a 404 in a later tier.
      # Upsert keyed on the id: an existing row only gets data_class='synthetic';
      # any other conflict (e.g. a slug clash) fails the step.
      - name: 'Seed test-event-001 (OSE-1419 fixture)'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/test-event-001.sql

      # OSE-891: geo-tag test-event-001 so the OSE-INV5 covenant can seed
      # genuinely-local sponsors. is_local is GEO-DERIVED server-side (sponsor
      # h3_res7 == event h3_res7); the event fixture ships without coordinates,
      # so without this its cell is NULL and every sponsor resolves non-local.
      # A standalone fixture (not a migration) on purpose — see the file header
      # (bruno/fixtures/covenant-event-geo.sql). Idempotent UPDATE.
      - name: Seed covenant event geo (OSE-891 fixture)
        if: matrix.section == 'api'
        id: seed-covenant-geo
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/covenant-event-geo.sql

      - name: Reset covenant/journey sponsor fixtures (OSE-944 — prevent accumulation)
        if: matrix.section == 'api'
        id: reset-covenant-sponsors
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/covenant-sponsors-reset.sql

      # CCR-PR567 Stage-2: seed the 4 canonical covenant sponsors ALREADY ACCEPTED
      # (sponsor_accepted=1) so the covenant Bruno block is a pure ASSERT. Under ADR-019
      # strict consent an organizer-created placement is PENDING until the sponsor
      # accepts; the old API-seed-then-mint-then-respond flow could not run reliably on
      # Bruno CLI (multi-request after-response scripts silently skipped), so consent is
      # now established in the fixture. Runs AFTER the reset (which clears stale rows by
      # name) so exactly these 4 exist at read time. Idempotent.
      - name: Seed covenant sponsors accepted (CCR-PR567 fixture)
        if: matrix.section == 'api'
        id: seed-covenant-sponsors
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/covenant-sponsors-seed.sql

      # OSE-1432: one fixed-id sponsor per case for the Bruno folder "14. Public
      # Sponsor Card & Logo" (on show / no logo / dead logo host / pool / draft-only),
      # on its own active-but-unlisted event so the covenant order on
      # test-event-001 is untouched. Idempotent. NOT continue-on-error, like the
      # OSE-1419 event seed: a missing fixture fails here by name, not as a 404 in
      # the contract run.
      - name: 'Seed public sponsor card fixtures (OSE-1432)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/sponsor-public-card-seed.sql

      # OSE-1900: one event per state of the sponsors switch (on, off, never set,
      # and one the folder toggles), each with an accepted sponsor, for Bruno
      # folder 16 "Opt-in sponsors". The upserts put every row back to its
      # starting state, the switch included, so a run that stopped half way cannot
      # leave the next one wrong. NOT continue-on-error: a missing fixture fails
      # here by name, not as a 404 in the contract run.
      - name: 'Seed opt-in sponsor fixtures (OSE-1900)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/opt-in-sponsors-seed.sql

      # OSE-2014 (OSE ADR-029): a series an organizer declares, for Bruno folder 18.
      # Own brands ('series-ci', 'series-ci-other'), unpublished, synthetic. The
      # folder declares, attaches, detaches, confirms and rejects; this seed puts
      # every row back first. NOT continue-on-error.
      - name: 'Seed declared series fixtures (OSE-2014)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/declared-series-seed.sql

      # OSE-1955: the event page's sponsor thumbnails, for Bruno folder 17. One
      # sponsor per case (compact, header, none, empty URL, refused URL, a URL with
      # credentials, one side only, switch off, markup in the title) on four
      # unlisted events (pre, live, post, switch off). Idempotent; the dates move
      # with each pass. NOT continue-on-error: a missing fixture fails here by name.
      - name: 'Seed sponsor thumbnail fixtures (OSE-1955)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/sponsor-thumb-seed.sql

      # OSE-2012: one event per attendance mode for Bruno folder 18 "Online or in
      # person": a listed online event (the brand API returns it; /events and the
      # landing page do not), an in-person and a both event for the page label,
      # and one the folder turns online and back. Needs migration 0108, which T1
      # applied. Idempotent. NOT continue-on-error: a missing fixture fails here
      # by name, not as a 404 in the contract run.
      - name: 'Seed attendance mode fixtures (OSE-2012)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/attendance-mode-seed.sql

      # OSE-1644: a draft with no start time and no event type, for the Bruno
      # request that asserts the 409 CORE_VALUES_MISSING contract (folder 12).
      # The upsert resets it to that state on every run. NOT continue-on-error:
      # a missing fixture fails here by name, not as a 404 in the contract run.
      - name: 'Seed core-values draft fixture (OSE-1644)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/core-values-draft-seed.sql

      # OSE-682: one event with a materialized scan signal, so folder 6 can read a
      # signed-link report on the Free plan and assert it is capped at Local. Own
      # event (plancap-evt), unpublished; idempotent upserts. NOT continue-on-error:
      # a missing fixture fails here by name, not as a 409 in the contract run.
      - name: 'Seed report plan-cap fixture (OSE-682)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/report-plan-cap-seed.sql

      # OSE-1800: the CI service actor's brand (ci-brand): one Free event with a
      # poster and scans above the floor, read in folder 6 as a BRAND admin. Own
      # brand, unpublished; idempotent upserts. NOT continue-on-error.
      - name: 'Seed CI brand fixture (OSE-1800)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/ci-brand-seed.sql

      # Showcase S14: campaigns, for Bruno folder 18. One campaign and one sponsor
      # per case (shown, sponsor pending, organizer declined, paused, switch off,
      # linked to another brand's campaign) on two root events and one ci-brand
      # event, all unlisted. It also removes the campaign the folder creates.
      # Idempotent. NOT continue-on-error: a missing fixture fails here by name.
      - name: 'Seed campaign fixtures (S14)'
        if: matrix.section == 'api'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/campaigns-seed.sql

      # Owner 2026-11-05: a landing zip lookup shows the zip's own area. Three
      # synthetic events next to Mount Greenwood (60655), one per town; the Pages
      # collection's /?zip=60655 and /?zip=60453 requests read them. Upserts by id.
      - name: 'Seed landing zip own-area fixture'
        if: matrix.section == 'pages'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/landing-zip-own-area-seed.sql

      # OSE-1191: migrated Postman/Newman → Bruno (offline/git-native `.bru`,
      # collections live in-repo under bruno/). Bruno CLI `bru run` must execute
      # from the collection root, so each step sets working-directory. Secrets are
      # still injected via --env-var (same keys as the Postman env), never inlined.
      #
      # `bru run` writes --reporter-junit to $GITHUB_WORKSPACE/.test-results and
      # EXITS 2 if that directory does not exist — even when every assertion passes
      # (OSE-1191: masked the green result until created). Make the dir first.
      - name: Prepare contract report dir
        run: mkdir -p "$GITHUB_WORKSPACE/.test-results"

      - name: Bruno contract section
        working-directory: ${{ matrix.collection }}
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          # CF Access service token — required for section 11 (Sponsor Covenant)
          # which seeds + cleans up admin sponsors. The seed/cleanup POSTs hit
          # /api/v2/admin/* which CF Access shadows at the edge with a 302/HTML
          # redirect before the request reaches the worker. Forwarding the
          # service token bypasses CF Access at the edge while preserving the
          # worker-side Bearer auth check. Without these secrets the covenant
          # test fails loudly (not silently) — see section 11 seed tests.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # OSE-1800: a SECOND service token, accepted on staging as a brand admin
          # of ci-brand (never platform). Unset until the owner creates it; the
          # folder-6 "CI brand admin" requests skip, under a named test, until then.
          CF_ACCESS_CI_BRAND_CLIENT_ID: ${{ secrets.CF_ACCESS_CI_BRAND_CLIENT_ID }}
          CF_ACCESS_CI_BRAND_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CI_BRAND_CLIENT_SECRET }}
          # OSE-2022: the calendar requests send X-OCR-CI so the stg skip rule lets
          # them reach the Worker. CALENDAR_EDGE_STRICT=1 (the owner sets it once the
          # rule covers /brands/) turns a challenged calendar read into a failure.
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
          CALENDAR_EDGE_STRICT: ${{ vars.CALENDAR_EDGE_STRICT }}
        run: |
          npx bru run . -r --env ose-staging \
            --env-var "ocrCiEdgeToken=$OCR_CI_EDGE_TOKEN" \
            --env-var "edgeStrict=$CALENDAR_EDGE_STRICT" \
            --env-var "adminKey=$ADMIN_KEY" \
            --env-var "ocrInternalSecret=$X_OCR_INTERNAL" \
            --env-var "cfAccessClientId=$CF_ACCESS_CLIENT_ID" \
            --env-var "cfAccessClientSecret=$CF_ACCESS_CLIENT_SECRET" \
            --env-var "ciBrandClientId=$CF_ACCESS_CI_BRAND_CLIENT_ID" \
            --env-var "ciBrandClientSecret=$CF_ACCESS_CI_BRAND_CLIENT_SECRET" \
            --reporter-junit "$GITHUB_WORKSPACE/.test-results/${{ matrix.junit }}"
        timeout-minutes: 5

      # The landing zip own-area fixture is published only for the run above:
      # Mount Greenwood (60655) is the seed's deliberately empty place on stg (owner
      # 2026-11-06), so take the three events off again,
      # pass or fail. A failed reset fails the job by name.
      - name: 'Unpublish landing zip own-area fixture'
        if: always() && matrix.section == 'pages'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/landing-zip-own-area-reset.sql

      # OSE-1470: Bruno ran with the admin key + CF Access token; refuse to
      # upload a report that recorded one. Upload runs only if this passes.
      - name: Scan artifacts for credentials
        id: artifact-scan
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CI_BRAND_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CI_BRAND_CLIENT_SECRET }}
        run: bash scripts/ci/scan-artifacts-for-secrets.sh .test-results/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.artifact-scan.outcome == 'success'
        with:
          name: contract-staging-${{ matrix.section }}-${{ github.run_number }}
          path: .test-results/
          retention-days: 14
          # .test-results/ is a dot-dir: upload-artifact skips hidden files by
          # default, which silently dropped every JUnit/JSON result uploaded here.
          include-hidden-files: true

      # Surface per-assertion Bruno results as a GitHub Check (visible in the
      # PR/Checks tab), so a contract failure shows the failing request + message
      # by name instead of being buried in the CLI log.
      - name: Report results (Bruno contract)
        if: always() && steps.artifact-scan.outcome == 'success' # never publish a report the scan refused (OSE-1470)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        continue-on-error: true
        with:
          name: '${{ matrix.label }} Results (Bruno)'
          path: '.test-results/bru-*-junit.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "Stage 1 of the fail-fast chain — a red here skips T3 E2E smoke + T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Collection:** \`${{ matrix.collection }}\`" >> $GITHUB_STEP_SUMMARY

  contract-staging:
    name: 'T2 Contract → Staging (Bruno)'
    timeout-minutes: 5 # job ceiling; slowest observed run is far below it
    needs: [contract-staging-sub]
    runs-on: ubuntu-24.04
    if: always() && needs.contract-staging-sub.result != 'skipped'
    steps:
      - name: Summarize T2 contract sub-gates
        run: |
          echo "## T2 Contract → Staging (Bruno)" >> $GITHUB_STEP_SUMMARY
          echo "Stage 1 of the fail-fast chain — a red here skips T3 E2E smoke + T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sub-gates finished with result: \`${{ needs.contract-staging-sub.result }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.contract-staging-sub.result }}" != "success" ]; then
            echo "::error::One or more T2 contract sub-gates failed or were cancelled"
            exit 1
          fi

  # ============================================================================
  # T3 SMOKE — Playwright E2E smoke (post-deploy + nightly + dispatch). Runs after T2 is green.
  # ============================================================================
  smoke-staging-sub:
    name: 'T3 Smoke (${{ matrix.section }})'
    timeout-minutes: 15 # job ceiling; slowest observed run is far below it
    # OSE-954: runs on ephemeral ubuntu-latest. This job only READS live staging
    # (Playwright smoke) — it does not deploy. Staging auth is header-based CF
    # Access service token (CF_ACCESS_CLIENT_ID/SECRET + Bearer ADMIN_KEY, all
    # repo secrets) which is IP-independent, so an ephemeral runner authenticates
    # exactly as the box did — there is no source-IP allow-list to lose.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: write # dorny/test-reporter publishes the results as a check
    # Fail-fast chain, stage 2 of 3: FE E2E smoke runs ONLY after the Bruno
    # contract (T2) is green. A red here SKIPS functional (T4). Depends on
    # contract-staging so the API contract is proven before the FE E2E layer.
    needs: [security, gate, gate-tests, deploy-staging, contract-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.gate-tests.result == 'success' &&
      needs.contract-staging.result == 'success' &&
      (needs.deploy-staging.result == 'success' || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: security
            label: 'T3: Security smoke'
            installBrowser: true
          - section: iac
            label: 'T3: IAC health + fail-fast'
            installBrowser: false
          - section: forms
            label: 'T3: Forms endpoint smoke'
            installBrowser: false
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      - name: Restore Playwright browser cache
        if: matrix.installBrowser == true
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # OSE-954: --with-deps pulls chromium system libs on the fresh ubuntu VM.
        if: matrix.installBrowser == true
        run: bash scripts/ci/install-playwright-browsers.sh chromium

      - name: Run T3 smoke section
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        # Same entry point as `npm run test:t3:staging` on a laptop; specs live in
        # scripts/ci/t3-sections.json.
        run: node scripts/ci/run-t3.mjs --section ${{ matrix.section }}
        timeout-minutes: 10

      # OSE-1470: the suites above send CF Access / admin credentials. Refuse to
      # upload anything that recorded one (trace, report, JUnit). Prints only the
      # file + pattern name; the upload below runs only if this passes.
      - name: Scan artifacts for credentials
        id: artifact-scan
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          bash scripts/ci/scan-artifacts-for-secrets.sh
          playwright-report-smoke/ playwright-report-e2e-smoke/ .test-results/ test-results/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.artifact-scan.outcome == 'success'
        with:
          name: smoke-staging-${{ matrix.section }}-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-e2e-smoke/
            .test-results/
            test-results/
          retention-days: 14
          # .test-results/ is a dot-dir: upload-artifact skips hidden files by
          # default, which silently dropped every JUnit/JSON result uploaded here.
          include-hidden-files: true

      # Surface per-test Playwright smoke results as a GitHub Check (visible in
      # the PR/Checks tab), matching the T4 functional reporter.
      - name: Report results (E2E smoke)
        if: always() && steps.artifact-scan.outcome == 'success' # never publish a report the scan refused (OSE-1470)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        continue-on-error: true
        with:
          name: '${{ matrix.label }} Results (Playwright)'
          path: '.test-results/*junit.xml'
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "Stage 2 of the fail-fast chain — runs only after T2 contract is green; a red sub-gate makes the aggregate T3 gate red and skips T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Section:** \`${{ matrix.section }}\` (specs in \`scripts/ci/t3-sections.json\`; locally: \`npm run test:t3:staging -- --section ${{ matrix.section }}\`)" >> $GITHUB_STEP_SUMMARY

  smoke-staging:
    name: 'T3 E2E Smoke → Staging (Playwright)'
    timeout-minutes: 5 # job ceiling; slowest observed run is far below it
    needs: [smoke-staging-sub]
    runs-on: ubuntu-24.04
    if: always() && needs.smoke-staging-sub.result != 'skipped'
    steps:
      - name: Summarize T3 smoke sub-gates
        run: |
          echo "## T3 E2E Smoke → Staging (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "Stage 2 of the fail-fast chain — runs only after T2 contract is green; a red here skips T4 functional." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sub-gates finished with result: \`${{ needs.smoke-staging-sub.result }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.smoke-staging-sub.result }}" != "success" ]; then
            echo "::error::One or more T3 smoke sub-gates failed or were cancelled"
            exit 1
          fi

  # ============================================================================
  # T4 FUNCTIONAL — Playwright API + UI (push to main, tag, or dispatch). Runs after T3 is green.
  # ============================================================================
  functional-staging-sub:
    name: 'T4 Functional (${{ matrix.label }})'
    timeout-minutes: 30 # job ceiling; slowest observed run is far below it
    # OSE-954: GitHub-hosted. Staging auth is a HEADER-based CF Access service token
    # (CF_ACCESS_CLIENT_ID/SECRET + Bearer ADMIN_KEY, repo secrets) = IP-independent
    # (proven by the T2/T3 slice), so ephemeral runners reach staging unchanged. The
    # re-homed S2 integrity tripwire (tail step) rides this move by design: its
    # baseline checkout is at the job START, not a post-execution reset (OSE-1056/1057).
    runs-on: ubuntu-24.04
    needs: [security, gate, gate-tests, deploy-staging, smoke-staging]
    if: |
      always() &&
      needs.security.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.gate-tests.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_functional == 'true') ||
        (needs.deploy-staging.result == 'success' && needs.smoke-staging.result == 'success')
      )
    # OSE-1171/1186: T4 is split into three child legs that run in PARALLEL. Each leg
    # owns the staging fixtures it seeds, and no two legs read or write the same
    # event: platform = SMOKE_EVENT_SPONSORED + test-event-001 sponsors; forms =
    # test-event-001 registrations + evt_forms_phase1/2 (FORMS_DB); surfaces = the
    # evt_smoke_* events, evt_smoke_tiers, the Eagles Hall poster and launch-story
    # events. If a new spec reads data another leg writes, put it in that leg.
    # The required check `T4 Functional → Staging` is the aggregator below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: platform
            label: 'platform: invariants + journeys'
          - section: forms
            label: 'forms: register, check-in, survey, email'
          - section: surfaces
            label: 'surfaces: UI, attendee arc, SharedReport, launch story, poster'
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # REQUIRED — never continue-on-error: the worker install below resolves
        # @ocr/ui from the staged hub, and the seed steps need the locked wrangler
        # it installs (OSE-1731 follow-up, run 39194783868).
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi

      # Locked wrangler for the seed steps below (they run with the Cloudflare token).
      # Root has no wrangler, so without this `npx wrangler` fetches the newest release
      # instead of the version workers/oursharedevents/package-lock.json pins.
      - name: Install worker dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The Ubuntu packages `--with-deps` installs for WebKit (181 packages,
      # 126 MB). Same key the T0 component shard and the phone audit save under,
      # so on a normal run apt downloads nothing. On 2026-10-08 this job spent
      # its whole 30 minutes downloading them from a slow mirror and was
      # cancelled before a test started.
      - name: Restore Playwright system package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pw-apt-archives
          key: ${{ runner.os }}-pw-apt-chromium-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-apt-chromium-webkit-

      - name: Install Playwright browsers
        # --with-deps installs the system libraries the browsers need on a fresh
        # ubuntu-latest VM (OSE-954; matches the T0 gate + T3 smoke slices).
        # chromium AND webkit: the ui-smoke pack runs cross-browser on Chrome
        # (chromium) + Safari (webkit) — the "remaining flows" tier (OSE-1058);
        # the full device matrix lives on the E2E suite. The self-hosted box had
        # webkit globally cached, masking the need; ephemeral runners must fetch
        # it explicitly.
        run: bash scripts/ci/install-playwright-browsers.sh chromium webkit

      # OSE-834 slice 2d (Fix 7): the tiers below assert against staging — prove
      # staging IS this merge before touching it. WORKER_BUILD_VERSION carries
      # stg-<shortSHA>-<date> (deploy job's "Stamp build version") and /health
      # echoes it; a stale target (or an unreachable/placeholder version) fails
      # the whole T4 job HERE, before any seed or tier, rather than every tier
      # silently passing against the wrong build. NOT continue-on-error.
      - name: 'T4 preflight: deploy-freshness (OSE-834 2d)'
        env:
          HEALTH_URL: '${{ env.STG_BASE_URL }}/health'
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: EXPECTED_SHA="$(git rev-parse --short HEAD)" node scripts/assert-deploy-freshness.mjs

      # OSE-1419: migration 0086 removes 0013's test-event-001 from any database
      # where nothing references it, so the event is no longer something a
      # migration guarantees. The T4c form E2E and the journey reset target it.
      # Seed it here on purpose. NOT continue-on-error: a missing event fails at
      # this step, by name, not as a 404 in a later tier.
      # Upsert keyed on the id: an existing row only gets data_class='synthetic';
      # any other conflict (e.g. a slug clash) fails the step.
      - name: 'Seed test-event-001 for T4 (OSE-1419 fixture)'
        if: matrix.section == 'platform' || matrix.section == 'forms'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/test-event-001.sql

      # OSE-616 (QR Path rung 5): scan the Eagles Hall test poster on staging and
      # confirm the scan lands at the poster's res9 node / res7 corridor. The
      # rest of the trace (aggregate -> corridor -> export, res9 stripped) needs
      # the nightly cron, so it runs in T0 against the real code instead
      # (workers/oursharedevents/tests/scan-to-export-trace.spec.ts).
      # NOT continue-on-error: a scan that does not land is a real failure.
      - name: 'Seed Eagles Hall trace poster (OSE-616 fixture)'
        if: matrix.section == 'surfaces'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/trace-eagles-poster.sql

      - name: 'Trace one scan on staging (OSE-616)'
        if: matrix.section == 'surfaces'
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same Access service token every other staging step sends.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # /q/* is also behind a Cloudflare managed challenge (OSE-939). A WAF
          # custom rule skips it only for stg /q/* requests carrying X-OCR-CI
          # with this value; real visitors stay challenged.
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
        run: bash scripts/ci/trace-scan-staging.sh

      - name: Reset synthetic sponsor fixtures (OSE-944 — journey runs on a clean event)
        if: matrix.section == 'platform'
        id: reset-journey-sponsors
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../bruno/fixtures/covenant-sponsors-reset.sql

      # OSE-551: durable "a real sponsor exists here" fixture. Gives the write-path
      # invariants (anonymous-id + ncr-accumulation impression/click) a real,
      # active, FK-valid sponsor on a dedicated event so the write returns 201
      # instead of the mock-fallback FK 503. NOT continue-on-error: a failed seed
      # must surface loudly (the specs also fail — not skip — when SMOKE_EVENT_SPONSORED
      # is set but exposes no sponsor, so green != true holds end-to-end).
      - name: Seed sponsored-event fixture (OSE-551)
        if: matrix.section == 'platform'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/sponsored-event.sql

      # OSE-1436: one public, upcoming event with three sponsors (logos + website;
      # no logo but a public card; a logo that cannot load), so the sponsor
      # surfaces can be looked at on staging with real logos, the CSP, COEP and
      # the edge cache together. T4j (OSE-1955) reads it, with the ten-sponsor
      # event the same file seeds; not continue-on-error, so a failed seed reds here.
      - name: Seed sponsor logo check fixture (OSE-1436)
        if: matrix.section == 'surfaces'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/sponsor-logo-check.sql

      # OSE-1004: synthetic Phase-2 event fixture so the survey/email SUBMISSION
      # E2E exercises the legal-clearance gate instead of 403-ing on a Phase-1
      # event. evt_forms_phase2 = legal_clearance_tier 2, data_class 'synthetic'.
      # Does NOT touch test-event-001 or any real event. A failed seed must
      # surface (specs would 403 and, once blocking, fail — green != true holds).
      - name: Seed forms Phase-2 fixture (OSE-1004)
        if: matrix.section == 'forms'
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/forms-phase2-event.sql
          # Per-event flag overrides live in FORMS_DB (two-DB isolation). Enables
          # forms.survey/email-signup for the synthetic events ONLY (scope='event'
          # beats global) so submission clears FORM_DISABLED. No global flag changed.
          node ../../scripts/ci/d1-seed-staging.mjs FORMS_DB ../../tests/ui/smoke/fixtures/forms-phase2-flags.sql

      - name: 'T4a: Architecture Invariants'
        if: matrix.section == 'platform'
        id: arch-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          SMOKE_EVENT_SPONSORED: evt_smoke_sponsored
        # Runtime invariants only (OSE-1507). The structural ones read source
        # files, and T0 already ran them on this SHA; re-running them after a
        # deploy proves nothing. infra-consistency.test.js derives both sets and
        # fails if this list drifts from the runtime set.
        run: |
          PW_LABEL='T4a: Architecture Invariants' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/0-architecture/anonymous-id.invariant.spec.ts \
            tests/e2e/0-architecture/geo-resolution.invariant.spec.ts \
            tests/e2e/0-architecture/ncr-accumulation.invariant.spec.ts \
            tests/e2e/0-architecture/uec-codes.invariant.spec.ts
        timeout-minutes: 3

      - name: 'T4b: Core Journeys'
        if: matrix.section == 'platform'
        id: journey-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # OSE-1197: the journey attaches its sponsor to the dedicated sponsored event,
          # read by id (it is live but not in the public list), and opens
          # /display?event=<id>. If that event has finished it uses the first listed
          # event that has not; never test-event-001, which the TV board drops.
          SMOKE_EVENT_SPONSORED: evt_smoke_sponsored
          # OSE-834 ARM: an unmet precondition (no admin key, a CF Access edge block)
          # is a FAILURE here, not a green skip — "a tier that cannot fail is not a
          # tier." The skipped-ratio ceiling (repo var T4_MAX_SKIP_RATIO, unset = no
          # ceiling) reds a mostly-skipped run once a threshold is set.
          PW_REQUIRE_PRECONDITIONS: '1'
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
        run: |
          PW_LABEL='T4b: Core Journeys' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/sponsor-journey.spec.ts \
            tests/e2e/3-flows/cross-brand-isolation.spec.ts
        timeout-minutes: 8

      # T4c split (OSE-554): register/checkin + all validation/structure are
      # BLOCKING — the OSE-1003 forms fix makes them green on Phase-1
      # test-event-001 (verified on staging: 62 passed, 0 register/checkin
      # failures). Survey + email SUBMISSION are Phase-2 legal-clearance-gated
      # (return 403 FORM_DISABLED / PHASE_REQUIRED) and only pass against the
      # event-scoped Phase-2 fixture (OSE-1004) once real clearance lands
      # (OSE-1007) — split out to continue-on-error below so a known-deferred
      # gate can never block a PR. --grep-invert excludes the survey/email
      # describes ("Survey Form" / "Email Signup") from this blocking step.
      # form-email-signup / form-survey are not named here: every describe in
      # them matches that filter, so they ran 0 tests in T4c (OSE-1507).
      # T4c-phase2 below is their home.
      - name: 'T4c: Form E2E — register/checkin + validation (blocking)'
        if: matrix.section == 'forms'
        id: form-e2e-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            --grep-invert "Survey Form|Email Signup" \
            tests/e2e/2-pages/form-registration.spec.ts \
            tests/e2e/2-pages/form-checkin.spec.ts \
            tests/e2e/3-flows/form-submission-flows.spec.ts \
            tests/e2e/4-negative/form-validation.spec.ts
        timeout-minutes: 10

      # Survey + email SUBMISSION — BLOCKING (OSE-1169). The mask is removed now
      # that both blockers landed: OSE-1004 (#442) shipped the synthetic
      # evt_forms_phase2 fixture so submission returns 201 instead of 403
      # PHASE_REQUIRED, and OSE-1168 (#443) fixed the last failing spec
      # (survey star-fill semantics). This gate asserts the submission CODE PATH
      # works against an accurately-MODELED Phase-2 event (legal_clearance_tier=2,
      # data_class='synthetic'). It does NOT assert real regulatory clearance —
      # enabling survey/email on any REAL (non-synthetic) event stays gated behind
      # OSE-1007. PHASE1_EVENT_ID (tier-1) still asserts PHASE_REQUIRED here, so the
      # legal-clearance gate is exercised, not bypassed.
      - name: 'T4c-phase2: Survey/Email E2E — synthetic Phase-2 fixture (blocking — OSE-1004/1169)'
        if: matrix.section == 'forms'
        id: form-e2e-phase2
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # OSE-1004: survey/email specs target the synthetic Phase-2 fixture so
          # submission is exercised (201) rather than 403 PHASE_REQUIRED.
          PHASE2_EVENT_ID: evt_forms_phase2
          # Synthetic tier-1 (flag ON) event — the gate-exercise proof asserts it
          # still returns PHASE_REQUIRED, independent of staging's global flag state.
          PHASE1_EVENT_ID: evt_forms_phase1
        run: |
          npx playwright test --config=playwright.e2e-smoke.config.ts \
            --grep "Survey Form|Email Signup" \
            tests/e2e/2-pages/form-email-signup.spec.ts \
            tests/e2e/2-pages/form-survey.spec.ts \
            tests/e2e/2-pages/form-phase-gate.spec.ts \
            tests/e2e/3-flows/form-submission-flows.spec.ts \
            tests/e2e/4-negative/form-validation.spec.ts
        timeout-minutes: 10

      - name: Seed smoke fixtures
        if: matrix.section == 'surfaces'
        id: seed-fixtures
        # OSE-834 ARM: continue-on-error removed — a failed seed now reds the tier
        # instead of letting downstream skip green on absent fixtures. Requires the
        # staging CF creds (present on the main pipeline) to succeed; a fork without
        # them fails here, which is correct: an unseeded run has verified nothing.
        timeout-minutes: 11
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          # Main DB (anonymous surface): bare smoke events + multi-tier sponsors.
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/smoke-events.sql
          node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/sponsors-tiers-smoke.sql
          # FORMS_DB (identified-user surface, ADR-001 two-DB isolation): one
          # registration / check-in / survey on the dedicated evt_smoke_tiers event.
          node ../../scripts/ci/d1-seed-staging.mjs FORMS_DB ../../tests/ui/smoke/fixtures/forms-smoke.sql

      - name: 'T4d: UI Smoke — Tier-1 page smoke'
        if: matrix.section == 'surfaces'
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          # CF Access service token (ose-staging-t4-admin) — clears the edge so the
          # admin routes reach the worker. The authenticated "admin dashboard"
          # route uses the config-level admin headers; the unauthenticated admin
          # sign-in route uses a scoped context with only these CF Access headers,
          # proving the worker-level 401 gate without conflating it with the edge
          # redirect (OSE-311).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SMOKE_ADMIN_READY: '1'
          # Fixture IDs seeded via tests/ui/smoke/fixtures/smoke-events.sql (OSE-455).
          # Routes skip cleanly when absent; set to known IDs when staging has been seeded.
          SMOKE_EVENT_PRE: evt_smoke_pre
          SMOKE_EVENT_LIVE: evt_smoke_live
          SMOKE_EVENT_POST: evt_smoke_post
        # T4d fixes (OSE-554): (1) add the missing --config — tier1.spec.ts lives
        # in tests/ui/smoke, covered ONLY by playwright.ui-smoke.config.ts; with
        # no --config it fell to the default config (testDir tests/playwright) →
        # "No tests found". (2) --grep-invert the route that still needs infra this
        # step can't supply: /sharedReport needs a worker signed-link HMAC token
        # (OSE-1101). Admin dashboard (200) and admin sign-in gate (401) are both
        # blocking: the latter uses a scoped context that clears CF Access but
        # omits Authorization so the worker sign-in gate is observable.
        run: |
          SMOKE_APP=ose SMOKE_ADMIN_READY=1 \
          PW_LABEL='T4d: Tier-1 UI Smoke' scripts/pw-guarded.sh \
            --config=playwright.ui-smoke.config.ts \
            --grep-invert "shared report shell" \
            tests/ui/smoke/tier1.spec.ts
        timeout-minutes: 10

      # T4e: Attendee arc — poster → pre / event / post phases (OSE-456).
      # Fixture rows (evt_smoke_{pre,live,post}) must be seeded into staging D1
      # via tests/ui/smoke/fixtures/smoke-events.sql before this runs.
      # Tests skip cleanly if fixtures are absent — continue-on-error protects CI
      # when staging has not been manually seeded for the run.
      - name: 'T4e: Attendee Arc Journey'
        if: matrix.section == 'surfaces'
        id: attendee-arc-tests
        # continue-on-error REMOVED (OSE-852 / MINE-0). This step was insulated from
        # going red three separate ways: its positional path lay outside the config's
        # testDir so discovery returned zero, a zero-discovery run exits green, and
        # continue-on-error swallowed anything left. Fixing discovery alone would have
        # been cosmetic while this line remained.
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          SMOKE_EVENT_PRE: evt_smoke_pre
          SMOKE_EVENT_LIVE: evt_smoke_live
          SMOKE_EVENT_POST: evt_smoke_post
          # OSE-834: skipped-ratio ceiling (repo var T4_MAX_SKIP_RATIO, unset = none).
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
        run: |
          PW_LABEL='T4e: Attendee Arc Journey' scripts/pw-guarded.sh \
            --config=playwright.ui-smoke.config.ts \
            tests/ui/smoke/journey-attendee-arc.smoke.spec.ts \
            tests/ui/smoke/journey-short-codes.smoke.spec.ts
        timeout-minutes: 5

      # OSE-1751: the depth gate checks the corridor baseline against a seeded 112/109
      # pair and 12 attendees. The staging Worker's 03:00 UTC cron deletes attendee rows
      # with no pepper epoch and recomputes baselines, so this seed is applied HERE, in
      # the step just before the gate, and not with the other smoke fixtures above,
      # which are two test steps earlier. Idempotent; a failed seed reds the tier.
      - name: 'T4f-seed: corridor baseline for the depth gate'
        if: matrix.section == 'surfaces'
        timeout-minutes: 11
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: node ../../scripts/ci/d1-seed-staging.mjs DB ../../tests/ui/smoke/fixtures/corridor-baseline-smoke.sql

      # T4f: SharedReport depth gate — E2E contract tests (S-3.3.2 / Invariant #5).
      # OSE-834 ARM: continue-on-error removed — with tokens absent the run all-skips
      # and Gate 0b reds it, which is the point: an unverified depth gate is not
      # green (this is the half of #25 money buys). PW_MAX_SKIP_RATIO (repo var
      # T4_MAX_SKIP_RATIO, unset = no ceiling) also reds a mostly-skipped run.
      #
      # OSE-1389: the SMOKE_RPT_* tokens are minted HERE, at run time, by calling
      # the deployed worker's admin mint-link route — not read from static GitHub
      # secrets. The signing secret never leaves the worker, and the tokens live
      # one day, not ninety (the static tokens used to desync from staging and 401
      # the whole gate — the OSE-349 token-shadow family). The mint step exports the
      # four tokens + the local sponsor id via $GITHUB_ENV for the gate step below.
      - name: 'T4f-mint: SharedReport run-time tokens'
        if: matrix.section == 'surfaces'
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # The depth E2E targets the multi-tier event so its sponsor-scoped tokens
          # resolve against real seeded sponsors (sponsors-tiers-smoke.sql).
          SMOKE_EVENT_POST: evt_smoke_tiers
          SMOKE_EVENT_OTHER: evt_smoke_other
        run: node scripts/mint-t4-report-tokens.mjs
        timeout-minutes: 2

      - name: 'T4f: SharedReport Depth Gate'
        if: matrix.section == 'surfaces'
        id: sharedreport-depth-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          SMOKE_EVENT_POST: evt_smoke_tiers
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
          # SMOKE_RPT_ADMIN/LOCAL/MID/OTHER_EVENT_TOKEN + SMOKE_RPT_SPONSOR_ID come
          # from the T4f-mint step above via $GITHUB_ENV (OSE-1389).
        run: |
          PW_LABEL='T4f: SharedReport Depth Gate' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/sharedreport-depth.spec.ts \
            tests/e2e/3-flows/recap-walk-in-wording.spec.ts
        timeout-minutes: 5

      - name: 'T4g: Launch Story Smoke'
        if: matrix.section == 'surfaces'
        id: launch-story-smoke
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PW_REQUIRE_PRECONDITIONS: '1'
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
          # OSE-2022: see the Bruno contract step for these two.
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
          CALENDAR_EDGE_STRICT: ${{ vars.CALENDAR_EDGE_STRICT }}
        run: |
          PW_LABEL='T4g: Launch Story Smoke' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/launch-story-smoke.spec.ts
        timeout-minutes: 6

      # OSE-1366: poster-print.data.spec.ts's "Print Layout" describe was written
      # for the staging E2E tier (see the file header) but no CI step named it —
      # it only ran manually. --grep scopes THIS gate to that one describe (the
      # OSE-1356/1357 rendered print regression + its 6 pre-existing checks) so a
      # newly-wired gate does not also inherit any unaudited failure from the
      # file's OTHER (pre-existing, unrelated) describes.
      - name: 'T4h: Poster Print Layout'
        if: matrix.section == 'surfaces'
        id: poster-print-layout
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
        run: |
          PW_LABEL='T4h: Poster Print Layout' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            --grep "Print Layout" \
            tests/e2e/2-pages/poster-print.data.spec.ts
        timeout-minutes: 5

      # OSE-1761: the language in the URL path. A browser against the deployed
      # Worker: the /es/ page, the switch as a plain link, a shared link that keeps
      # its prefix, a printed code that does not change, and the paths a prefix must
      # never reach. The router itself is proved at the worker layer.
      # OSE-1850: the form pages too. Event page in es, pl and ar, tap check-in, the
      # form in that language with its menu, then a check-in submitted in it.
      - name: 'T4i: Language Path Prefix'
        if: matrix.section == 'surfaces'
        id: language-path-prefix
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PW_REQUIRE_PRECONDITIONS: '1'
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
        run: |
          PW_LABEL='T4i: Language Path Prefix' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/language-path-prefix.spec.ts
        # 8, not 6: four form rows (OSE-1850), each a fresh phone context and a submit.
        timeout-minutes: 8

      # OSE-1955: the event page's sponsor thumbnails in a browser against the
      # deployed Worker, on the OSE-1436 fixture seeded above (evt_sponsor_logo_check
      # and evt_sponsor_thumb_ten). Only a browser can prove these: the art really
      # loads under the CSP, the tap leaves for the website, any shape of logo stays
      # in its 160 x 64 box, ten sponsors fit a 320 px phone with 44 px targets, and
      # axe passes on the strip in both themes. Read-only. Markup and the proxy are
      # proved in the workers pool and Bruno folder 17.
      - name: 'T4j: Sponsor Thumbnails'
        if: matrix.section == 'surfaces'
        id: sponsor-thumbnails
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          PW_MAX_SKIP_RATIO: ${{ vars.T4_MAX_SKIP_RATIO }}
        run: |
          PW_LABEL='T4j: Sponsor Thumbnails' scripts/pw-guarded.sh \
            --config=playwright.e2e-smoke.config.ts \
            tests/e2e/3-flows/sponsor-thumbnails.spec.ts
        timeout-minutes: 6

      # OSE-1470: the T4 suites send CF Access / admin credentials and mint a
      # CF_Authorization cookie. Refuse to upload anything that recorded one.
      # Prints only the file + pattern name; the upload runs only if this passes.
      - name: Scan artifacts for credentials
        id: artifact-scan
        if: always()
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          X_OCR_INTERNAL: ${{ secrets.X_OCR_INTERNAL }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
        run: >-
          bash scripts/ci/scan-artifacts-for-secrets.sh
          playwright-report-smoke/ playwright-report-e2e-smoke/ playwright-report-ui-smoke/
          .test-results/ test-results/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.artifact-scan.outcome == 'success'
        with:
          name: functional-staging-${{ matrix.section }}-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            playwright-report-e2e-smoke/
            playwright-report-ui-smoke/
            .test-results/
            test-results/
          retention-days: 14
          # .test-results/ is a dot-dir: upload-artifact skips hidden files by
          # default, which silently dropped every JUnit/JSON result uploaded here.
          include-hidden-files: true

      - name: Report results
        if: always() && steps.artifact-scan.outcome == 'success' # never publish a report the scan refused (OSE-1470)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        continue-on-error: true
        with:
          name: 'Functional Results (${{ matrix.label }})'
          path: '.test-results/*-junit.xml'
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## T4 Functional — ${{ matrix.label }}" >> $GITHUB_STEP_SUMMARY
          echo "Steps that belong to another leg show as skipped here." >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| T4a Architecture Invariants | \`${{ steps.arch-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4b Core Journeys | \`${{ steps.journey-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c Form E2E (register/checkin + validation, blocking) | \`${{ steps.form-e2e-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4c Survey/Email submission (synthetic Phase-2, blocking) | \`${{ steps.form-e2e-phase2.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4d UI Smoke | \`${{ steps.ui-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4e Attendee Arc Journey | \`${{ steps.attendee-arc-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4f SharedReport Depth Gate | \`${{ steps.sharedreport-depth-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4g Launch Story Smoke | \`${{ steps.launch-story-smoke.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4h Poster Print Layout | \`${{ steps.poster-print-layout.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4i Language Path Prefix | \`${{ steps.language-path-prefix.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4j Sponsor Thumbnails | \`${{ steps.sponsor-thumbnails.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

      # ── OSE-1171: per-gate NAMED CHECKS ──────────────────────────────────────────
      # Each leg publishes a check-run for the gates IT ran, so a red names its own
      # gate instead of the opaque aggregator (the log-dive OSE-1170's #450 forced
      # three times). Pass/fail semantics are unchanged: the blocking gates above
      # still fail the leg directly (T4a/T4b stay fail-fast; T4e keeps its OSE-852
      # no-continue-on-error invariant). A gate that did not run because an earlier
      # blocking gate halted its leg posts `neutral`, never a false green. A leg
      # posts nothing for another leg's gates. Mirrors security-human-gate.yml.
      #
      # `if: always()` is load-bearing: without it a halted leg would publish nothing.
      - name: 'Post T4 named checks'
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          post() {
            local name="$1" outcome="$2" conclusion summary
            case "$outcome" in
              success) conclusion=success; summary="passed" ;;
              failure) conclusion=failure; summary="failed" ;;
              *)        conclusion=neutral; summary="did not run (an earlier blocking gate halted the job)" ;;
            esac
            gh api -X POST "repos/${{ github.repository }}/check-runs" \
              -f name="$name" -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion="$conclusion" \
              -f "output[title]=$name" -f "output[summary]=T4 sub-gate — ${summary}." \
              >/dev/null && echo "posted: ${name} -> ${conclusion}"
          }
          case "${{ matrix.section }}" in
            platform)
              post "T4a: Architecture Invariants"                     "${{ steps.arch-tests.outcome }}"
              post "T4b: Core Journeys"                               "${{ steps.journey-tests.outcome }}"
              ;;
            forms)
              post "T4c: Form E2E (register/checkin + validation)"    "${{ steps.form-e2e-tests.outcome }}"
              post "T4c-phase2: Survey/Email E2E (synthetic Phase-2)" "${{ steps.form-e2e-phase2.outcome }}"
              ;;
            surfaces)
              post "T4d: UI Smoke (Tier-1)"                           "${{ steps.ui-tests.outcome }}"
              post "T4e: Attendee Arc Journey"                        "${{ steps.attendee-arc-tests.outcome }}"
              post "T4f: SharedReport Depth Gate"                     "${{ steps.sharedreport-depth-tests.outcome }}"
              post "T4g: Launch Story Smoke"                          "${{ steps.launch-story-smoke.outcome }}"
              post "T4h: Poster Print Layout"                         "${{ steps.poster-print-layout.outcome }}"
              post "T4i: Language Path Prefix"                        "${{ steps.language-path-prefix.outcome }}"
              post "T4j: Sponsor Thumbnails"                          "${{ steps.sponsor-thumbnails.outcome }}"
              ;;
          esac
      # ── S2 Post-execution integrity — the tamper tripwire, IN THE SAME VM that ran
      # the untrusted T4 execution (OSE-1056/1057). This is the migration-correct home
      # for the check the retired self-hosted `security-post` job used to attempt:
      # this job checked out the committed SHA at its START (the baseline), ran the
      # tests, and now asserts the tree is byte-identical — so a backdoor or lockfile
      # tamper injected DURING execution goes red here. Because the check lives at the
      # TAIL of the execution job (not a separate downstream job), it needs no cross-
      # job workspace persistence and rides the OSE-954 move to ephemeral GitHub-hosted
      # runners unchanged. The `git checkout --force` erasure that made the old design
      # vacuous cannot bite here — the checkout is the pre-execution baseline, not a
      # post-execution reset (regression-locked by post-execution-integrity.test.js).
      - name: 'S2 Integrity — no injection during execution phase'
        if: always()
        shell: bash
        run: bash scripts/check-post-execution-integrity.sh

  functional-staging:
    name: 'T4 Functional → Staging'
    timeout-minutes: 5 # job ceiling; the legs carry the real work
    needs: [functional-staging-sub]
    runs-on: ubuntu-24.04
    if: always() && needs.functional-staging-sub.result != 'skipped'
    steps:
      - name: Summarize T4 functional legs
        run: |
          echo "## T4 Functional → Staging" >> $GITHUB_STEP_SUMMARY
          echo "Stage 3 of the fail-fast chain — runs only after T3 smoke is green. Three parallel legs (platform, forms, surfaces); each names its own gates as check-runs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Legs finished with result: \`${{ needs.functional-staging-sub.result }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.functional-staging-sub.result }}" != "success" ]; then
            echo "::error::One or more T4 functional legs failed or were cancelled"
            exit 1
          fi

  # ============================================================================
  # T1 DEPLOY → Production (tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: 'T1 Deploy → Production'
    timeout-minutes: 20 # job ceiling; slowest observed run is far below it
    # OSE-1257: production applies the hosted staging deploy pattern. The
    # Cloudflare API token is IP-independent, so production can run on the same
    # fresh ubuntu-latest shape as deploy-staging without relying on a carried
    # self-hosted workspace.
    runs-on: ubuntu-24.04
    # OSE-1217: production must be gated by the same-run staging chain, not only
    # S0 + T0. A production tag/dispatch cannot ship a SHA unless T1-T4 staging
    # went green for that SHA in this workflow run.
    needs:
      [
        security,
        gate,
        gate-tests,
        deploy-staging,
        smoke-staging,
        contract-staging,
        functional-staging,
      ]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          # Full history, so the next step can see whether this commit is on main.
          fetch-depth: 0

      # OSE-1662: a `v*.*.*` tag or a dispatch can name any commit, from any
      # branch. Only a commit that is on main ships. First step after checkout,
      # so nothing else in this job runs for a commit off main. NOT
      # continue-on-error and no `if:` — held by
      # tests/integration/assert-on-main-wired.test.js.
      - name: 'Gate: the commit is on main (OSE-1662)'
        run: bash scripts/ci/assert-on-main.sh

      # Every production change has a ticket (AGENTS.md; CCR 2026-10-12, B5). The id
      # comes from the dispatch input or the annotated tag message, and is written to
      # the job summary. NOT continue-on-error and no `if:` — held by
      # tests/unit/ci/require-ticket.test.js.
      - name: 'Gate: the change names its ticket (CCR B5)'
        env:
          TICKET_INPUT: ${{ github.event.inputs.ticket }}
        run: |
          TAG_MESSAGE=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_MESSAGE="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          fi
          node scripts/ci/require-ticket.mjs --input "$TICKET_INPUT" --tag-message "$TAG_MESSAGE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install worker dependencies
        env:
          FORCE_CLEAN: ${{ inputs.force_clean }}
        run: |
          HASH="$(node --version)-$(git hash-object package-lock.json)"
          STAMP=node_modules/.install-stamp
          if [ "$FORCE_CLEAN" != 'true' ] && [ -f "$STAMP" ] && [ "$(cat $STAMP)" = "$HASH" ] && [ -f "node_modules/.package-lock.json" ]; then
            echo "worker node_modules up-to-date, skipping npm ci"
          else
            npm ci --prefer-offline || npm ci
            echo "$HASH" > "$STAMP"
          fi
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database"; exit 1
          fi
          echo "✓ Production DB isolation verified"

      # ────────────────────────────────────────────────────────────────────
      # CCR-PR567 H2 + re-run item 5 — fail-closed secret PRESENCE gate, BEFORE
      # the remote D1 migrate steps (production). Mirror of the staging step
      # in T1 Deploy → Staging; keep both in sync (OSE-1343 — the pepper check
      # was missing here too, so a production deploy could still ship the
      # exact masked-503 class of failure OSE-1343 found on staging).
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: required secrets present (pre-migrate, fail-closed corner) (OSE-1343)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          # A failed `secret list` is an auth or network finding, never "not set" (OSE-1731).
          # It also keeps the forbidden-name check below from passing on an empty list.
          OUT="$(npx wrangler secret list --env production 2>&1)" && RC=0 || RC=$?
          bash ../../scripts/ci/classify-wrangler-failure.sh "$RC" "$OUT" production
          for SECRET in SHARED_REPORT_SIGNING_SECRET FORMS_ENCRYPTION_KEY FORMS_HASH_PEPPER RATE_LIMIT_KEY_PEPPER ANON_ID_HASH_PEPPER; do
            if ! echo "$OUT" | grep -q "$SECRET"; then
              echo "::error::$SECRET is not set on the production worker — refusing to migrate remote D1 for a deploy that would ship a fail-closed corner inert (or, for FORMS_HASH_PEPPER, a masked 503 per OSE-1343; for RATE_LIMIT_KEY_PEPPER, IP-reversible rate-limit keys per OSE-1447; for ANON_ID_HASH_PEPPER, scans with no id and no return counts per OSE-1659). Provision it: bash scripts/set-secrets.sh production"
              echo "$OUT"
              exit 1
            fi
          done
          echo "SHARED_REPORT_SIGNING_SECRET, FORMS_ENCRYPTION_KEY, FORMS_HASH_PEPPER, RATE_LIMIT_KEY_PEPPER, ANON_ID_HASH_PEPPER present on production (names only: wrangler cannot read values; length is enforced at provisioning by scripts/set-secrets.sh)."
          # OSE-1659 / TL-078 (2026-10-10): ANON_ID_HASH_PEPPER is required on
          # production. Without it a scan has no keyed id, so the browser-name hash
          # is the only thing the visitor count can use, and returns are not counted.
          # Staging still only warns (its step above) until it is provisioned there.

          # ADR-012 gate R2 (OSE-1467): static admin credentials must be ABSENT on
          # production. Their presence is a standing admin path that bypasses Access.
          for SECRET in ADMIN_KEY X_OCR_INTERNAL ADMIN_TOKEN; do
            if echo "$OUT" | grep -qw "$SECRET"; then
              echo "::error::$SECRET is set on the production worker. Production admin is Cloudflare Access only; delete it: npx wrangler secret delete $SECRET --env production"
              exit 1
            fi
          done
          echo "ADMIN_KEY, X_OCR_INTERNAL, ADMIN_TOKEN absent on production."

      # CCR 2026-10-12 (A1): a rollback puts the previous Worker on the new database.
      # List the migrations this release is about to apply that remove or rename
      # something, so the operator knows before the deploy whether a no-go can be a
      # rollback or has to be a fix forward. Information only: it never fails the job.
      - name: 'Report: is this release roll-back-able?'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          for PAIR in DB:migrations FORMS_DB:migrations-forms; do
            BINDING="${PAIR%%:*}"; DIR="${PAIR##*:}"
            npx wrangler d1 migrations list "$BINDING" --env production --remote 2>&1 \
              | node ../../scripts/ci/release-rollbackability.mjs --dir "$DIR" --label "$BINDING (production)" || true
          done

      - name: Apply D1 migrations (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env production --remote

      # OSE-813 — no placeholder binding IDs may reach a deploy (HARD GATE).
      # Mirror of the staging step in T1 Deploy → Staging; keep both in sync.
      # KV namespaces provisioned 2026-08-18; the last placeholders are gone.
      - name: 'Gate: no unprovisioned binding IDs (OSE-813)'
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/check-binding-placeholders.mjs

      # Canonical-shape verification on production. Mirror of the staging
      # step in T1 Deploy → Staging; keep both in sync. Source of truth:
      # migration-smoke.spec.ts for live table names, migration SQL for columns.
      - name: 'Verify production D1 (canonical tables + columns, 0 triggers)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: node scripts/verify-d1-canonical-shape.mjs --env production

      # OSE-803 — pre-deploy schema gate. Mirror of the staging step in
      # T1 Deploy → Staging; keep both in sync.
      # ────────────────────────────────────────────────────────────────────
      - name: 'Gate: zero unapplied D1 migrations before deploy (OSE-803)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          node scripts/check-schema-guard.mjs
          FAILED=0
          for BINDING in DB FORMS_DB; do
            OUT="$(npx wrangler d1 migrations list "$BINDING" --env production --remote 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'No migrations to apply'; then
              echo "ok    $BINDING (production): no unapplied migrations"
            else
              echo "FAIL  $BINDING (production): unapplied migrations remain, or the check could not run"
              printf '%s\n' "$OUT"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to deploy a Worker ahead of its database."
            exit 1
          fi

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          # Same shape as staging ("prod-<shortSHA>-<YYYYMMDD>") so /health names
          # the commit that is live and assert-deploy-freshness can parse it.
          # The old "${GITHUB_REF_NAME:-prod-<sha>}" never reached its fallback:
          # GITHUB_REF_NAME is always set, so a dispatch from main stamped "main".
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="prod-${SHORT_SHA}-$(date -u +%Y%m%d)"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait + Health check
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then echo "::error::Production health check failed – HTTP $HTTP"; exit 1; fi
          echo "✓ Production health check passed"
          # Signing-secret value-validity is NOT asserted here — /health stays
          # "boring OK" for NS-3. Covered at provisioning (set-secrets.sh) + the
          # T4 /sponsor journey (CCR-PR567 re-run item 5, revised).

      - name: 'Gate: production route uses production Cloudflare Access app'
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          EXPECTED_ACCESS_HOST: oursharedevents.com
        run: node scripts/assert-access-routing.mjs

  # ============================================================================
  # T2 SMOKE → Production (tag only)
  #
  # OSE-1257: mirrors the staging smoke shape on its own fresh GitHub-hosted
  # workspace. Install dependencies explicitly; no state is carried over from
  # deploy-production.
  # ============================================================================
  smoke-production:
    name: 'T2 Smoke → Production'
    timeout-minutes: 15 # job ceiling; slowest observed run is far below it
    runs-on: ubuntu-24.04
    needs: [security, gate, gate-tests, deploy-production]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        run: npm ci --prefer-offline || npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Before any smoke spec reads production, prove it is running the commit
      # this run deployed and that /health stays good. The script reads /health
      # every 10 s and ends HEALTHY, WRONG BUILD, ROLL BACK or CANNOT SEE; only
      # HEALTHY passes. It rolls nothing back: ROLL BACK is an instruction to
      # the operator (docs/runbooks/ROLLBACK.md). It sends no credential. NOT
      # continue-on-error and no `if:` — held by
      # tests/integration/post-deploy-health-wired.test.js.
      - name: 'Gate: production runs this build and stays healthy'
        env:
          HEALTH_URL: '${{ env.PROD_BASE_URL }}/health'
          EXPECTED_ENV: production
          EXPECTED_PREFIX: prod
        run: EXPECTED_SHA="$(git rev-parse --short HEAD)" node scripts/ci/post-deploy-health.mjs

      - name: 'Security smoke: XSS + auth'
        id: security-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
          # No ADMIN_KEY / X_OCR_INTERNAL: production accepts neither (ADR-012 R2),
          # and sending them would put a staging credential on a production request.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test --config=playwright.e2e-smoke.config.ts tests/e2e/1-smoke/security-smoke.spec.js
        timeout-minutes: 10
        continue-on-error: true

      - name: 'IAC: health + fail-fast'
        id: iac-smoke
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npx playwright test --config=playwright.smoke.config.ts tests/api/smoke/api-health.spec.ts tests/api/smoke/fail-fast-gates.spec.ts tests/api/smoke/events-v2.spec.ts
        timeout-minutes: 10
        continue-on-error: true

      # OSE-1470: the security smoke sent production credentials. Refuse to
      # upload anything that recorded one; the upload runs only if this passes.
      # Only the CF Access secret: no step in this job receives ADMIN_KEY or
      # X_OCR_INTERNAL, so they cannot be in the reports, and passing them
      # here would only widen secret access in the production job.
      - name: Scan artifacts for credentials
        id: artifact-scan
        if: always()
        env:
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/ci/scan-artifacts-for-secrets.sh playwright-report-smoke/ .test-results/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.artifact-scan.outcome == 'success'
        with:
          name: smoke-production-${{ github.run_number }}
          path: |
            playwright-report-smoke/
            .test-results/
          retention-days: 30
          # .test-results/ is a dot-dir: upload-artifact skips hidden files by
          # default, which silently dropped every JUnit/JSON result uploaded here.
          include-hidden-files: true

      - name: Fail check
        if: steps.security-smoke.outcome == 'failure' || steps.iac-smoke.outcome == 'failure'
        run: |
          echo "::error::Production smoke failed — Security: ${{ steps.security-smoke.outcome }}, IAC: ${{ steps.iac-smoke.outcome }}"
          exit 1

  # ============================================================================
  # GATE 4: POST-EXECUTION SECURITY — the closing bookend
  #
  # PO design (ratified 2026-08-09): security bookends the execution phase. Gate 1
  # (S0 Security) proves the committed input was clean; a closing gate confirms
  # nothing — a test, a package lifecycle script, any CI/CD execution — mutated the
  # source or injected files DURING execution, which a single up-front scan cannot
  # detect.
  #
  # RE-HOMED (OSE-1056/1057, Dr.-of-Security). This used to be TWO separate self-
  # hosted jobs:
  #   • `security-post`      — git-integrity tamper check. It re-checked-out the SHA,
  #                            and `git checkout --force` ERASED tracked-file/lockfile
  #                            injection before the diff → 2/3 checks vacuously green.
  #   • `security-post-scan` — a managed semgrep/detect-secrets re-scan on a CLEAN
  #                            checkout. Its only reason to exist (run semgrep where
  #                            self-hosted Smart App Control blocked it) is MOOT: S0
  #                            now runs on ubuntu with the identical configs over the
  #                            same SHA. It added zero coverage and burned hosted
  #                            minutes (its no-runner scheduling flake was the original
  #                            OSE-1056 symptom).
  # Both are RETIRED. The real post-execution value — "did untrusted execution tamper
  # the tree" — now runs as the TAIL STEP of `functional-staging`, in the same VM that
  # ran the tests (see that job). That placement needs no cross-job workspace
  # persistence, so it is correct on self-hosted today and rides the OSE-954 migration
  # to ephemeral GitHub-hosted runners unchanged. The retired-job invariant is
  # regression-locked by tests/unit/security/post-execution-integrity.test.js.
  # ============================================================================
  gate-execution-reconciler:
    name: 'Gate-execution reconciler'
    timeout-minutes: 10 # job ceiling; slowest observed run is far below it
    # OSE-1255 (Detect model): assert every gate EXPECTED for THIS trigger actually
    # executed (from needs.*.result). The arm (OSE-834) stops a gate lying when it
    # runs; this stops a gate silently NOT running — a tier skipped/absent for no
    # legitimate reason is the false-green hole. Expected set is trigger-aware
    # (PR = S0+T0; main-push / full-pipeline PR / dispatch = the staging chain).
    # An expected gate skipped as an honest cascade of an upstream FAILURE is not a
    # violation (the failed gate is the real signal). Advisory for now; owner then
    # requires this check in branch protection to make it the enforcement anchor.
    # gate-tests is here so a red T0 test shard explains the skipped local-vetting
    # and staging tiers; it is an upstream signal, not an expected gate.
    needs:
      - security
      - gate
      - gate-tests
      - local-vetting
      - deploy-staging
      - contract-staging
      - smoke-staging
      - functional-staging
      - deploy-production
      - smoke-production
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Reconcile gate execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_DEPLOY_STAGING: ${{ github.event.inputs.deploy_staging }}
          INPUT_RUN_FUNCTIONAL: ${{ github.event.inputs.run_functional }}
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/assert-gate-execution.mjs

      # OSE-1261: a required context nothing emits (app_id:null) blocks every PR
      # invisibly (OSE-1260). This names the cause instead of a mystery "Expected —
      # Waiting" block. `if: always()` so it runs even if the reconcile step failed.
      # Read-only: REPORTS + prints the de-require command, never mutates protection.
      #
      # NOTE (OSE-1261): the default GITHUB_TOKEN CANNOT read branch protection —
      # there is no `permissions:` scope for it — so with GITHUB_TOKEN the script
      # 403s and gracefully skips (never a false-red). To activate the audit, the
      # owner provisions an admin-read token as the secret BRANCH_PROTECTION_READ_TOKEN
      # (a fine-grained PAT with Administration:read, or a GitHub App token).
      # Provisioning that token is an owner/auth-boundary decision — the agent never
      # handles it; the audit stays inert-but-safe until it exists.
      - name: Audit required checks (phantom app_id:null)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/audit-required-checks.mjs

  summary:
    name: 'Pipeline Summary'
    timeout-minutes: 10 # job ceiling; slowest observed run is far below it
    runs-on: ubuntu-24.04
    needs:
      [
        security,
        gate,
        gate-tests,
        local-vetting,
        deploy-staging,
        smoke-staging,
        contract-staging,
        functional-staging,
        deploy-production,
        smoke-production,
      ]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      # The testing flow in execution order, with a reason for every stage that did
      # not run. Built on the reconciler's expected set, so the board and the gate agree.
      - name: Testing flow board
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_DEPLOY_STAGING: ${{ github.event.inputs.deploy_staging }}
          INPUT_RUN_FUNCTIONAL: ${{ github.event.inputs.run_functional }}
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/render-pipeline-board.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        run: |
          echo "## OurSharedEvents CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| S0 Security | security | \`${{ needs.security.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T0 Gate | gate | \`${{ needs.gate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T0 Gate (tests) | gate-tests | \`${{ needs.gate-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy STG | deploy-staging | \`${{ needs.deploy-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Bruno API STG | contract-staging | \`${{ needs.contract-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T3 Playwright Smoke STG | smoke-staging | \`${{ needs.smoke-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T4 E2E + T4d Functional STG | functional-staging | \`${{ needs.functional-staging.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T5 Adversarial Red Team | red-team-adversarial.yml | separate workflow after CI success |" >> $GITHUB_STEP_SUMMARY
          echo "| T6 Security | red-team-adversarial.yml | job after T5 success |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-T6 Security Bookend | red-team-adversarial.yml | job after T6 success |" >> $GITHUB_STEP_SUMMARY
          echo "| T1 Deploy PROD | deploy-production | \`${{ needs.deploy-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| T2 Smoke PROD | smoke-production | \`${{ needs.smoke-production.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`$GITHUB_REF\`" >> $GITHUB_STEP_SUMMARY
