# Security Triage — Auto-create issues from scan failures
#
# When any security scan fails, this workflow automatically:
#   1. Creates a GitHub issue with severity label and SLA deadline
#   2. Assigns the security owner
#   3. Posts a summary linking to the failed scan
#
# This ensures no security finding is silently ignored.

name: Security Triage

on:
  workflow_run:
    workflows:
      # Canonical CodeQL SARIF source (codeql.yml)
      - "CodeQL"
      # Bespoke scanners (security-scan.yml) — CI/CD script-injection, wrangler,
      # and npm audit. Name retained for branch-protection continuity.
      - "CodeQL Security Analysis"
      # Extended scans (advanced-security-scan.yml)
      - "Advanced Security Scans"
      # Nightly input-validation fuzz (overnight-fuzz.yml). OSE-1409: it sat
      # red for 10+ nights with no one notified; a failure now files (or
      # comments on) a tracked issue like every other scan here.
      - "Overnight fat-finger fuzz"
    types:
      - completed

permissions:
  issues: write
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  triage:
    name: "🚨 Triage Security Findings"
    runs-on: ubuntu-24.04
    # Only triage when the scan failed (findings detected)
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine severity and SLA
        id: severity
        run: |
          WORKFLOW="${{ github.event.workflow_run.name }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "workflow=$WORKFLOW" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Default to high severity for automated triage
          # Manual review may downgrade after investigation
          echo "severity=high" >> $GITHUB_OUTPUT
          echo "sla=24 hours" >> $GITHUB_OUTPUT
          echo "label=priority:high" >> $GITHUB_OUTPUT

          # Calculate SLA deadline (24h from now)
          SLA_DEADLINE=$(date -u -d "+24 hours" "+%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v+24H "+%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "within 24 hours")
          echo "sla_deadline=$SLA_DEADLINE" >> $GITHUB_OUTPUT

      - name: Check for existing open issue
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Avoid duplicate issues for the same workflow failure
          EXISTING=$(gh issue list \
            --label "security,auto-triage" \
            --state open \
            --search "${{ steps.severity.outputs.workflow }} failure" \
            --json number \
            --jq 'length' 2>/dev/null || echo "0")

          echo "count=$EXISTING" >> $GITHUB_OUTPUT

      - name: Ensure auto-triage labels exist
        # `gh issue create --label X` errors when label X is missing. Create
        # the three labels we attach below idempotently so the issue creation
        # step never fails on a label-not-found error.
        #
        # OSE-340 fix (2026-05-18): pipe `|` is the spec separator, NOT colon.
        # The label name `priority:high` contains a colon, so a colon-separated
        # spec string (the prior implementation) made bash's `${spec%%:*}` strip
        # at the first colon, parsing `priority:high:#b60205:High priority` as
        # name=`priority`, color=`high` (invalid hex), desc=`#b60205:High priority`.
        # `gh label create priority --color high` then failed; `|| true` swallowed
        # the error; the real label `priority:high` was never created; the
        # downstream `gh issue create --label "priority:high"` failed with
        # `could not add label: 'priority:high' not found` (run 26051710958).
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for spec in "security|#d73a4a|Security finding" "priority:high|#b60205|High priority" "auto-triage|#0e8a16|Created by security-triage workflow"; do
            name="${spec%%|*}"
            rest="${spec#*|}"
            color="${rest%%|*}"
            desc="${rest#*|}"
            if ! gh label list --search "$name" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "[label-bootstrap] creating label: '$name' (color=$color, desc=$desc)"
              if ! gh label create "$name" --color "${color#'#'}" --description "$desc"; then
                # Don't swallow the error silently like the pre-OSE-340 code did
                # — log it so a future debug pass sees what actually happened.
                echo "[label-bootstrap] WARN: gh label create failed for '$name'; downstream issue create may fail"
              fi
            else
              echo "[label-bootstrap] label '$name' already exists; skipping create"
            fi
          done

      - name: Create security issue
        if: steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ steps.severity.outputs.workflow }}
          BRANCH: ${{ steps.severity.outputs.branch }}
          RUN_URL: ${{ steps.severity.outputs.run_url }}
          SHORT_SHA: ${{ steps.severity.outputs.short_sha }}
          SLA: ${{ steps.severity.outputs.sla }}
          SLA_DEADLINE: ${{ steps.severity.outputs.sla_deadline }}
          SEVERITY_LABEL: ${{ steps.severity.outputs.label }}
        run: |
          # Write the issue body to a temp file via heredoc (no $() wrap, no
          # indent-sensitive terminator). The previous implementation used
          # BODY=$(cat <<'ISSUEEOF' ... ISSUEEOF) inside a YAML `run: |` block
          # which left the $() without a matching ')' after the heredoc
          # terminator, causing "unexpected EOF while looking for matching ')'".
          BODY_FILE="$(mktemp -t security-triage-body.XXXXXX.md)"
          cat > "$BODY_FILE" <<'ISSUEEOF'
          ## Security Scan Failure — Requires Immediate Attention

          | Field | Value |
          |-------|-------|
          | **Workflow** | WORKFLOW_PLACEHOLDER |
          | **Branch** | `BRANCH_PLACEHOLDER` |
          | **Commit** | `SHA_PLACEHOLDER` |
          | **Failed Run** | [View logs](RUN_URL_PLACEHOLDER) |
          | **SLA** | SLA_PLACEHOLDER |
          | **SLA Deadline** | SLA_DEADLINE_PLACEHOLDER |

          ### Required Actions

          1. **Investigate** — Review the [failed workflow run](RUN_URL_PLACEHOLDER) to identify specific findings
          2. **Assess** — Determine true severity (Critical/High/Moderate/Low)
          3. **Fix or Except** — Apply remediation or file a Security Exception with justification
          4. **Verify** — Re-run the security scan to confirm resolution
          5. **Close** — Close this issue with a summary of actions taken

          ### Response SLAs

          | Severity | Response Time | Resolution Time |
          |----------|--------------|-----------------|
          | Critical | 1 hour | 4 hours |
          | High | 4 hours | 24 hours |
          | Moderate | 24 hours | 7 days |
          | Low | 7 days | 30 days |

          > If severity is upgraded to **Critical** after investigation, the 4-hour resolution SLA applies immediately.

          ### Process Reference
          - [Security Remediation Guide](docs/SECURITY.md)
          - [Exception Process](docs/SECURITY.md#exception-process)

          ---
          *Auto-created by security-triage workflow. Do not ignore — SLA is binding.*
          ISSUEEOF

          # Substitute placeholders in place. Env-based values avoid shell
          # injection from GitHub context expressions.
          sed -i \
            -e "s|WORKFLOW_PLACEHOLDER|${WORKFLOW}|g" \
            -e "s|BRANCH_PLACEHOLDER|${BRANCH}|g" \
            -e "s|SHA_PLACEHOLDER|${SHORT_SHA}|g" \
            -e "s|RUN_URL_PLACEHOLDER|${RUN_URL}|g" \
            -e "s|SLA_PLACEHOLDER|${SLA}|g" \
            -e "s|SLA_DEADLINE_PLACEHOLDER|${SLA_DEADLINE}|g" \
            "$BODY_FILE"

          # `--assignee oursharedevents` was failing because the org name is
          # not a valid issue-assignee on this repo. Drop it; the labels +
          # title prefix surface the issue clearly enough for triage. If a
          # human assignee is desired later, set repo var SECURITY_ASSIGNEE
          # to a username and re-add `--assignee "${SECURITY_ASSIGNEE}"`.
          gh issue create \
            --title "[SECURITY] ${WORKFLOW} failure on ${BRANCH} (${SHORT_SHA})" \
            --body-file "$BODY_FILE" \
            --label "security,${SEVERITY_LABEL},auto-triage"

          rm -f "$BODY_FILE"

      - name: Comment on existing issue
        if: steps.existing.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the existing issue number
          ISSUE_NUM=$(gh issue list \
            --label "security,auto-triage" \
            --state open \
            --search "${{ steps.severity.outputs.workflow }} failure" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" \
              --body "**Recurring failure detected.** New failure on \`${{ steps.severity.outputs.branch }}\` at commit \`${{ steps.severity.outputs.short_sha }}\`. [View run](${{ steps.severity.outputs.run_url }}). This issue remains unresolved — SLA clock continues."
          fi
