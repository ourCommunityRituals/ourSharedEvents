# OurSharedEvents — Part 1: Security Gate + Deploy
#
# Runs on every push/PR. Gates all code with security + quality checks,
# then deploys to staging (push to main) or production (tag vX.Y.Z).
#
# Part 2 (ose-2-smoke.yml) auto-triggers when this workflow completes.

name: OurSharedEvents Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'playwright.*.config.*'
      - '.github/workflows/ose-1-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'workers/oursharedevents/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'playwright.*.config.*'
      - '.github/workflows/ose-1-deploy.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to staging'
        required: false
        default: 'false'
        type: boolean
      deploy_production:
        description: 'Deploy to production (type PRODUCTION to confirm)'
        required: false
        type: string

concurrency:
  group: ose-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  WORKER_DIR: 'workers/oursharedevents'

jobs:
  # ============================================================================
  # 00 SECURITY GATE
  # ============================================================================
  security-gate:
    name: '00 Security Gate'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: 'Security: Banned origins check'
        run: npm run check:banned-origins

      - name: 'Security: Unit security tests'
        run: npx vitest run tests/unit/worker/sec-iac-03-adminOAuth.test.js tests/unit/worker/sec-iac-04-public-read-only.test.js tests/unit/worker/sec-iac-05-signed-mutations.test.js tests/unit/worker/sec-iac-07-iac-smoke.test.js

      - name: 'Quality: Lint (zero errors)'
        run: npx eslint config/ scripts/ tests/unit/ tests/contract/

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: TypeScript type check'
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKER_DIR }}

      - name: 'Quality: Unit + Contract + Guards'
        run: npm test

      - name: 'Quality: Worker D1 schema + forms security'
        run: npm test
        working-directory: ${{ env.WORKER_DIR }}

  # ============================================================================
  # 02 DEPLOY → Staging
  # ============================================================================
  deploy-staging:
    name: '02 Deploy → Staging'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    environment:
      name: staging
      url: ${{ env.STG_BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKER_DIR }}/package.json'

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: Apply D1 migrations to staging (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply D1 migrations to staging (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env staging --remote

      - name: Verify D1 staging tables (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "6"; then
            echo "::error::D1 staging table verification failed — expected 6 tables in main DB"
            exit 1
          fi
          echo "✓ All 6 tables verified in staging main D1"

      - name: Verify D1 staging tables (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-forms-db-staging --env staging --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "5"; then
            echo "::error::D1 staging forms table verification failed — expected 5 tables in forms DB"
            exit 1
          fi
          echo "✓ All 5 tables verified in staging forms D1"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="stg-${SHORT_SHA}-$(date -u +%Y%m%d)"
          echo "Setting WORKER_BUILD_VERSION=$VERSION"
          sed -i "s/WORKER_BUILD_VERSION = \"stg-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait for worker propagation
        run: sleep 10

      - name: Health check staging
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Checking $STG_BASE_URL/health ..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$STG_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Health check failed – HTTP $HTTP"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP)"

  # ============================================================================
  # 04 DEPLOY → Production (tag vX.Y.Z only)
  # ============================================================================
  deploy-production:
    name: '04 Deploy → Production'
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'PRODUCTION')
    environment:
      name: production
      url: ${{ env.PROD_BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKER_DIR }}/package.json'

      - name: Install worker dependencies
        run: npm ci
        working-directory: ${{ env.WORKER_DIR }}

      - name: Verify production DB isolation
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          echo "Checking wrangler.toml for cross-env contamination..."
          if grep -A5 '\[env\.production' wrangler.toml | grep -q 'ocr-db-staging'; then
            echo "::error::Production config references staging database"
            exit 1
          fi
          echo "✓ Production DB isolation verified"

      - name: Apply D1 migrations to production (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Apply D1 migrations to production (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler d1 migrations apply FORMS_DB --env production --remote

      - name: Verify D1 production tables (main DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('events','sponsors','poster_deployments','scans','scan_aggregates','subscribers')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "6"; then
            echo "::error::D1 production table verification failed"
            exit 1
          fi
          echo "✓ All 6 tables verified in production main D1"

      - name: Verify D1 production tables (forms DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          RESULT=$(npx wrangler d1 execute ocr-forms-db-production --env production --remote \
            --command "SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name IN ('form_registrations','checkin_counts','form_surveys','email_signups','feature_flags')")
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q "5"; then
            echo "::error::D1 production forms table verification failed"
            exit 1
          fi
          echo "✓ All 5 tables verified in production forms D1"

      - name: Stamp build version
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          VERSION="${GITHUB_REF_NAME:-prod-$(git rev-parse --short HEAD)}"
          echo "Setting WORKER_BUILD_VERSION=$VERSION"
          sed -i "s/WORKER_BUILD_VERSION = \"prod-.*\"/WORKER_BUILD_VERSION = \"$VERSION\"/" wrangler.toml

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
        working-directory: ${{ env.WORKER_DIR }}

      - name: Wait for worker propagation
        run: sleep 10

      - name: Health check production
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Checking $PROD_BASE_URL/health ..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PROD_BASE_URL/health")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Production health check failed – HTTP $HTTP"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP)"
