# Stock data for the staging site (stg.oursharedevents.com).
#
# Owner, 2026-11-06: runs every morning (and by hand), so stg always holds the
# permanent testing totals with future dates, for the whole CI/CD test pyramid:
# Blue Island 10, Auburn Gresham 9, Evergreen Park 11, Oak Lawn 17, Mount
# Greenwood 0 (stock/totals.json). Each run re-dates the same seed; nothing is
# searched. Owner, 2026-11-05: there is no nightly
# search. The events were searched once and committed as a fixed seed
# (stock/seed/seed.json, made by scripts/stock/make-seed.mjs); each load
# re-bases the seed's dates to the load day, so each place's count in the
# 90-day window never changes.
#
# Owner, 2026-11-06: one staging site. The seed loads into stg itself, where the
# populated zips (60406, 60620, 60805, 60453) and the deliberately empty 60655
# show both experiences side by side; there is no separate stg-full site and no
# second set of databases. stg stays open (robots.txt disallows indexing), and
# every stg page says "Testing purposes only" and that nothing is an endorsement.
#
#   seed         the committed seed re-based to today → accepted rows + businesses
#                (scripts/stock/seed.mjs); no network, no secrets
#   build        accepted rows → today's events, sponsors, posters and art, plus a manifest
#   check-swap   check every node over the public pages, then swap or purge per node
# A red job stops the next. check-swap also runs after a failed build, so the
# partial manifest's rows are purged and nothing is orphaned. The build lists its
# manifest in R2 before it creates anything and keeps that copy current, so a run
# cancelled before check-swap is purged by the next run. Only rows a manifest
# names are ever deleted: CI's own staging fixtures and hand-made events are never
# touched.
#
# stg runs main as T1 deployed it; this workflow deploys nothing. It never touches
# production, and it is not part of T1–T4: a red run here never turns main red.
# Design: docs/superpowers/specs/2026-11-04-staging-full-environment-design.md.
#
# Secrets (repo level, the ones the T2 Bruno run already uses): CLOUDFLARE_API_TOKEN_OSE
# and CLOUDFLARE_ACCOUNT_ID (build and check-swap: R2 and D1 on --env staging only),
# OCR_HUB_READ (the pinned @ocr/ui for the Worker's wrangler install), ADMIN_KEY,
# CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET.
# Optional: INSTAGRAM_ACCESS_TOKEN (secret) and INSTAGRAM_TOKEN_ISSUED (variable). The
# owner's photos in stock/art are the art without them (owner 2026-11-05); a token only
# adds Instagram posts to choose from.

name: Stock data (stg)

on:
  # 09:23 UTC (3:23 or 4:23 in Chicago): after the 03:07 UTC nightly staging run
  # and before the working day's merges, so the swap window (the old load and the
  # new one both listed for a few minutes) falls when no test chain is reading stg.
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-data-full
  cancel-in-progress: false

env:
  WORKER_DIR: 'workers/oursharedevents'

jobs:
  # Reads only committed files: no secrets, no geocoding, no network.
  seed:
    name: 'Seed: re-base to today'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Re-base the seed
        run: node scripts/stock/run-day.mjs seed
      - uses: actions/upload-artifact@v4
        with:
          name: stock-seeded
          path: |
            stock-out/accepted.json
            stock-out/businesses.json
            stock-out/load.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: 'Build the day'
    needs: [seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      # The lockfile's wrangler: the build lists its manifest in R2 with it before
      # the first admin API call.
      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci --prefer-offline || npm ci
      - uses: actions/download-artifact@v4
        with:
          name: stock-seeded
          path: stock-out
      # A step timeout fails the step, so the job ends as failure (not cancelled) and
      # check-swap still runs to purge the partial manifest. The job allows 30.
      # The Cloudflare token is for R2 only: the manifest object and the index in
      # ose-uploads-staging, every command --env staging --remote.
      - name: Build
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_ISSUED: ${{ vars.INSTAGRAM_TOKEN_ISSUED }}
        run: node scripts/stock/run-day.mjs build
      # Always: a failed build still hands its partial manifest to check-swap.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-manifest
          path: |
            stock-out/manifest.json
            stock-out/build-notes.json
          if-no-files-found: warn
          retention-days: 30

  check-swap:
    name: 'Check, then swap per node'
    needs: [build]
    # Also after a failed build, to purge its partial manifest.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      # The lockfile's wrangler.
      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci --prefer-offline || npm ci
      # A build killed before any upload leaves no artifact, and this download fails.
      # The next step still runs (its if: admits a failed download, and nothing else)
      # and purges every node of the build's R2 copy, or reports the manifest missing,
      # red either way. Not continue-on-error: that count is a
      # down-only ratchet (.ci-integrity-baseline.json), and the job is red anyway.
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: stock-manifest
          path: stock-out
      - name: Check, swap and purge
        if: ${{ !cancelled() && (success() || steps.download.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: node scripts/stock/run-day.mjs check-swap
