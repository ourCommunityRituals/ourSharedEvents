# Stock data for the staging site (stg.oursharedevents.com).
#
# Owner, 2026-11-06: runs every morning (and by hand), so stg always holds the
# permanent testing totals with future dates, for the whole CI/CD test pyramid:
# Blue Island 10, Auburn Gresham 8 (9 in its town search), Evergreen Park 11, Oak Lawn 17, Mount
# Greenwood 0 (stock/totals.json). Each run re-dates the same seed; nothing is
# searched. Owner, 2026-11-05: there is no nightly
# search. The events were searched once and committed as a fixed seed
# (stock/seed/seed.json, made by scripts/stock/make-seed.mjs); each load
# re-bases the seed's dates to the load day, so each place's count in the
# 90-day window never changes.
#
# Owner, 2026-11-06: one staging site. The seed loads into stg itself, where the
# populated zips (60406, 60620, 60805, 60453) and the deliberately empty 60655
# show both experiences side by side; there is no separate stg-full site and no
# second set of databases. stg stays open (robots.txt disallows indexing), and
# every stg page says "Testing purposes only" and that nothing is an endorsement.
#
#   preflight    the stock check's own public reads, before anything else (OSE-2082):
#                if the edge challenges CI, the run stops here and touches nothing
#   seed         the committed seed re-based to today → accepted rows + businesses
#                (scripts/stock/seed.mjs); no network, no secrets
#   build        accepted rows → today's events, sponsors, posters and art, plus a manifest
#   check-swap   check every node over the public pages, then swap or purge per node
# A red job stops the next. check-swap also runs after a failed build, so the
# partial manifest's rows are purged and nothing is orphaned. The build lists its
# manifest in R2 before it creates anything and keeps that copy current, so a run
# cancelled before check-swap is purged by the next run. Only rows a manifest
# names are ever deleted: CI's own staging fixtures and hand-made events are never
# touched.
#
# stg runs main as T1 deployed it; this workflow deploys nothing. It never touches
# production, and it is not part of T1–T4: a red run here never turns main red,
# so the announce job opens a GitHub issue for it, and "stg watch" (stg-watch.yml)
# reads the searches on its own schedule.
# Design: docs/superpowers/specs/2026-11-04-staging-full-environment-design.md.
#
# Fail fast, and say why (OSE-2082, after the 2026-11-07 → 11-14 outage): the edge
# check runs first; the run takes the staging chain's lock, so it never overlaps
# T1–T4; the admin client tries a 502/503/504 again where repeating is safe
# (scripts/stock/client.mjs); and a failed build prints its reason, which the
# announce issue carries.
#
# Secrets (repo level, the ones the T2 Bruno run already uses): CLOUDFLARE_API_TOKEN_OSE
# and CLOUDFLARE_ACCOUNT_ID (build and check-swap: R2 and D1 on --env staging only),
# OCR_HUB_READ (the pinned @ocr/ui for the Worker's wrangler install), ADMIN_KEY,
# CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET.
# Optional: INSTAGRAM_ACCESS_TOKEN (secret) and INSTAGRAM_TOKEN_ISSUED (variable). The
# owner's photos in stock/art are the art without them (owner 2026-11-05); a token only
# adds Instagram posts to choose from.

name: Stock data (stg)

on:
  # 09:23 UTC (3:23 or 4:23 in Chicago): after the 03:07 UTC nightly staging run
  # and before the working day's merges, so the swap window (the old load and the
  # new one both listed for a few minutes) falls when no test chain is reading stg.
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never while T1–T4 run on stg, in either order (OSE-2082). The whole run joins the
# staging chain's lock, `ose-staging-chain` (oursharedevents-ci.yml): a stock run
# waits for a chain that is running, and a merge's chain waits for a stock run.
# On 2026-11-14 the first run after a seven-day outage died on one 503 while
# T4 Functional was running on stg (run 43533830657); the old run-level group,
# `stg-writer`, did not cover T4.
#
# Why this lock and not the other way round: the chain's lock spans a whole run, so
# T1 → T4 run against one build. A lock per job (T1–T4's jobs joining `stg-writer`)
# would let a stock run start between T2 and T4. And the order of the two locks is
# fixed: a run takes `ose-staging-chain` first, then a job takes `stg-writer`. The
# chain already does that (its T2 pages leg). If this workflow held `stg-writer`
# for the run and asked for the chain per job, a stock run and a chain would each
# hold the lock the other waits for.
#
# One writer on stg at a time still holds (CCR 2026-11-07 R-07): the two jobs that
# write (build, check-swap) each take `stg-writer`, which the event lifecycle, the
# rollback drill and the example fair hold for their runs. One of those can now
# run between the build and the check, never during either.
#
# queue: max lines waiting runs up first in, first out (up to 100) instead of
# GitHub's default of one waiting run, which a third arrival cancels. GitHub refuses
# queue: max with cancel-in-progress: true, so nothing here is ever cancelled.
# The load writes D1 only with `d1 execute --command` (D1's query endpoint), never
# with `--file`, a remote import that takes staging offline for reads (OSE-2090).
# Gates: tests/integration/staging-chain-lock.test.js, stg-writer-concurrency.test.js.
concurrency:
  group: ose-staging-chain
  cancel-in-progress: false
  queue: max

env:
  WORKER_DIR: 'workers/oursharedevents'

jobs:
  # Edge first (OSE-2082). The stock check's own public reads (/q/, /s/,
  # /events/<id> and a zip page, with X-OCR-CI and the Access service token), made
  # before anything is loaded. If the edge challenges one, or stg does not answer as
  # the Worker does, this job fails; seed, build and check-swap are then skipped, so
  # nothing on stg is loaded and nothing is purged. Reads only: no Cloudflare token,
  # no admin key. The same reads as "stg edge probe" (scripts/stock/edge-probe.mjs).
  # Every job runs only from main (CCR 2026-11-07 R-06): a dispatch from another
  # branch skips the chain, so a branch's scripts never reach stg with this token.
  preflight:
    name: 'Edge check: can CI read stg?'
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reason: ${{ steps.edge.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read stg as the stock check does
        id: edge
        timeout-minutes: 3
        env:
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/stock/edge-probe.mjs --preflight

  # Reads only committed files: no secrets, no geocoding, no network.
  seed:
    name: 'Seed: re-base to today'
    needs: [preflight]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Re-base the seed
        run: node scripts/stock/run-day.mjs seed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-seeded
          path: |
            stock-out/accepted.json
            stock-out/businesses.json
            stock-out/load.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: 'Build the day'
    needs: [seed]
    if: ${{ github.ref == 'refs/heads/main' }}
    # One writer on stg at a time: see the note on the run's own lock, above.
    concurrency:
      group: stg-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      error: ${{ steps.build.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      # The lockfile's wrangler: the build lists its manifest in R2 with it before
      # the first admin API call.
      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci --prefer-offline || npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stock-seeded
          path: stock-out
      # A step timeout fails the step, so the job ends as failure (not cancelled) and
      # check-swap still runs to purge the partial manifest. The job allows 90.
      # The Cloudflare token is for R2 only: the manifest object and the index in
      # ose-uploads-staging, every command --env staging --remote.
      # On failure the step prints `build failed: <reason>`, writes it to the step
      # summary and sets the output `error`, which the announce issue carries.
      - name: Build
        id: build
        timeout-minutes: 75
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_ISSUED: ${{ vars.INSTAGRAM_TOKEN_ISSUED }}
        run: node scripts/stock/run-day.mjs build
      # Always: a failed build still hands its partial manifest to check-swap.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stock-manifest
          path: |
            stock-out/manifest.json
            stock-out/build-notes.json
          if-no-files-found: warn
          retention-days: 30

  check-swap:
    name: 'Check, then swap per node'
    needs: [build]
    # Also after a failed build, to purge its partial manifest.
    # A failed edge check skips seed and build, so this job is skipped too: nothing
    # is purged for a reason outside the product.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    concurrency:
      group: stg-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/oursharedevents/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh
      # The lockfile's wrangler.
      - name: Install worker dependencies
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci --prefer-offline || npm ci
      # A build killed before any upload leaves no artifact, and this download fails.
      # The next step still runs (its if: admits a failed download, and nothing else)
      # and purges every node of the build's R2 copy, or reports the manifest missing,
      # red either way. Not continue-on-error: that count is a
      # down-only ratchet (.ci-integrity-baseline.json), and the job is red anyway.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        with:
          name: stock-manifest
          path: stock-out
      - name: Check, swap and purge
        if: ${{ !cancelled() && (success() || steps.download.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # stg challenges a non-browser read of /q/, /s/ and /events/<id> at the edge;
          # the WAF skip rule lets a read carrying X-OCR-CI with this value through (OSE-939).
          OCR_CI_EDGE_TOKEN: ${{ secrets.OCR_CI_EDGE_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: node scripts/stock/run-day.mjs check-swap

  # A red run is never silent (2026-11-07/08: every run failed for days and nothing
  # turned red where anyone looked). Opens a GitHub issue, label ci-red:stock-data-stg,
  # or comments on the open one; the next green run closes it. The only job with a
  # wider token, and only issues: write; it holds no Cloudflare or admin secret.
  announce:
    name: 'Announce: open or close the stock issue'
    needs: [preflight, seed, build, check-swap]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ANNOUNCE_KEY: stock-data-stg
          ANNOUNCE_TITLE: 'Stock data (stg) is red: stg may hold no stock events'
          ANNOUNCE_HINT: 'If a "Why" line is above, start there. Otherwise open the run and read the check-swap `node … failed:` and `search … failed:` lines. edge-challenged means the stg edge blocks CI: the stg CI skip rule must skip Super Bot Fight Mode on every path. The owner runs `scripts/ci/cf-waf-stg-ci-skip.mjs` (docs/runbooks/RUNBOOK-STG-CI-SKIP-RULE.md); don''t edit the dashboard. Then dispatch "stg edge probe" and wait for green before the next stock run.'
          # Why this run is red, in its own words: the edge check's reason (path, Ray
          # ID and fix) or the build's error. One line each, built by the scripts from
          # fixed text, paths, statuses and Ray IDs; announce-run.mjs cuts it to plain
          # characters before it reaches the issue.
          ANNOUNCE_DETAIL: ${{ needs.preflight.outputs.reason || needs.build.outputs.error }}
          ANNOUNCE_ASSIGNEE: ${{ vars.PR_REVIEWER }}
        run: node scripts/ci/announce-run.mjs
