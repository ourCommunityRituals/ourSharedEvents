# CodeQL — Self-hosted SAST on every PR/push to main + weekly deep scan
#
# Runs on self-hosted (Bloodraven) to avoid GitHub-hosted billing dependency.
# By owning the pull_request trigger, GitHub's default code scanning setup is
# suppressed — preventing billing-blocked "Analyze" jobs from firing on PRs.
# Python excluded: no production Python in OSE; self-hosted runner trips the
# MS-Store python.exe alias on CodeQL autobuild (exit 9009).

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: self-hosted
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
        # Python dropped: OSE has no production Python — only .github/scripts/
        # and tests/*.py. Running CodeQL SAST on CI helpers is noise, and the
        # Windows self-hosted runner trips the MS-Store python.exe alias on
        # CodeQL autobuild (exit 9009). Brain-contract conformance still runs
        # those scripts at runtime so policy coverage is preserved.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Shield CodeQL parser from workspace ESM scope
        # CodeQL's typescript-parser-wrapper/main.js is a CommonJS module.
        # Node walks up from that file looking for the nearest package.json
        # to decide ESM vs CJS. On this self-hosted runner, actions-runner
        # lives inside the ourCommunityRituals workspace root, whose
        # package.json declares "type": "module" — so Node flags the parser
        # as ESM and crashes on `exports is not defined`. Drop a CJS-scoped
        # package.json in RUNNER_TOOL_CACHE to block the upward walk before
        # it escapes the tool directory.
        run: |
          if [ -n "$RUNNER_TOOL_CACHE" ] && [ -d "$RUNNER_TOOL_CACHE" ]; then
            printf '{"type":"commonjs"}\n' > "$RUNNER_TOOL_CACHE/package.json"
            echo "Wrote CJS shim at: $RUNNER_TOOL_CACHE/package.json"
          else
            echo "⚠️ RUNNER_TOOL_CACHE not set or missing — skipping shim"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Cap heap + parallelism — prevents OS commit-limit exhaustion under
          # concurrent runs on Bloodraven. See oursharedevents-ci.yml S0 for
          # full rationale (auto-calc was claiming ~30 GB heap + 32 threads).
          ram: 8192
          threads: 8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Decouple from repo-level Code Security (GHAS). Private repo on
          # free tier rejects upload; analysis still runs and SARIF is
          # available as a workflow artifact. Mirrors the same fix in
          # oursharedevents-ci.yml's S0 Security job.
          # When OSE goes public OR GHAS is provisioned, remove these lines
          # and the upload-artifact step below.
          upload: 'never'
          output: '${{ runner.temp }}/codeql-sarif-${{ matrix.language }}'

      - name: Upload CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: '${{ runner.temp }}/codeql-sarif-${{ matrix.language }}/'
          retention-days: 30
          if-no-files-found: warn
