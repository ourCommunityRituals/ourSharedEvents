# CodeQL — Self-hosted SAST on every PR/push to main + weekly deep scan
#
# Runs on self-hosted (Bloodraven) to avoid GitHub-hosted billing dependency.
# By owning the pull_request trigger, GitHub's default code scanning setup is
# suppressed — preventing billing-blocked "Analyze" jobs from firing on PRs.
# Python excluded: no production Python in OSE; self-hosted runner trips the
# MS-Store python.exe alias on CodeQL autobuild (exit 9009).

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC
  workflow_dispatch:

# Sweep 9 #4 (2026-05-14): cancel superseded runs.
# Without this block, pushing 3 commits in 60s would queue 3 independent
# CodeQL runs on the 3-runner Bloodraven pool (each ~2.4 min, single
# self-hosted runner per axis). cancel-in-progress: true keeps only the
# latest commit's analysis alive, freeing runner slots immediately.
#
# Group key uses PR number when on PR (so commits to the same PR cancel
# prior runs) or full ref otherwise (so main pushes don't accidentally
# cancel each other's analyses).
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
        # Python dropped: OSE has no production Python — only .github/scripts/
        # and tests/*.py. Running CodeQL SAST on CI helpers is noise, and the
        # Windows self-hosted runner trips the MS-Store python.exe alias on
        # CodeQL autobuild (exit 9009). Brain-contract conformance still runs
        # those scripts at runtime so policy coverage is preserved.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shield CodeQL parser from workspace ESM scope
        # CodeQL's typescript-parser-wrapper/main.js is a CommonJS module.
        # Node walks up from that file looking for the nearest package.json
        # to decide ESM vs CJS. On this self-hosted runner, actions-runner
        # lives inside the ourCommunityRituals workspace root, whose
        # package.json declares "type": "module" — so Node flags the parser
        # as ESM and crashes on `exports is not defined`. Drop a CJS-scoped
        # package.json in RUNNER_TOOL_CACHE to block the upward walk before
        # it escapes the tool directory.
        run: |
          if [ -n "$RUNNER_TOOL_CACHE" ] && [ -d "$RUNNER_TOOL_CACHE" ]; then
            printf '{"type":"commonjs"}\n' > "$RUNNER_TOOL_CACHE/package.json"
            echo "Wrote CJS shim at: $RUNNER_TOOL_CACHE/package.json"
          else
            echo "⚠️ RUNNER_TOOL_CACHE not set or missing — skipping shim"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # OSE-1410: the repo's config (suites, path scope, custom Cloudflare/D1
          # queries) was never referenced by any workflow. Wire it in.
          config-file: ./.github/codeql/codeql-config.yml
          # Cap heap + parallelism to prevent OS commit-limit exhaustion on
          # Bloodraven (32 GB / 32 threads). Without these, codeql-action
          # auto-calculates ram=(total-2048) and threads=cpu-count, claiming
          # ~30 GB heap + 32 threads. When a second workflow runs concurrently
          # OR the JVM later commits native memory on top, the OS commit
          # budget exhausts even with a 48 GB auto-managed pagefile (DOS
          # error 1455). 8 GB / 8 threads leaves headroom for the worker +
          # concurrent jobs + JVM native commits. Original rationale +
          # incident: closed PR #145.
          ram: 8192
          threads: 8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Decouple from repo-level Code Security (GHAS). Private repo on
          # free tier rejects upload; analysis still runs and SARIF is
          # available as a workflow artifact. Mirrors the same fix in
          # oursharedevents-ci.yml's S0 Security job.
          # When OSE goes public OR GHAS is provisioned, remove these lines
          # and the upload-artifact step below.
          upload: 'never'
          # The database upload hits the same Code Security wall and burned 4
          # retries per run ("Maximum retry attempts exhausted"). Don't try.
          upload-database: false
          output: '${{ runner.temp }}/codeql-sarif-${{ matrix.language }}'

      # OSE-1410: with upload 'never', nothing read the SARIF — the job was green
      # WITH findings (44 on 2026-09-29, 2 in live Worker src) and security-triage
      # only fires on a red run. Gate here: any security-tagged result in
      # production code fails the job; tests/scripts/CI/archive are summarised
      # but do not gate. Self-test first so the gate can't silently pass.
      - name: 'Gate: self-test the SARIF classifier'
        run: node scripts/check-codeql-sarif.mjs --self-test

      - name: 'Gate: no security findings in production code'
        run: node scripts/check-codeql-sarif.mjs '${{ runner.temp }}/codeql-sarif-${{ matrix.language }}'

      - name: Upload CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: '${{ runner.temp }}/codeql-sarif-${{ matrix.language }}/'
          retention-days: 30
          if-no-files-found: warn
