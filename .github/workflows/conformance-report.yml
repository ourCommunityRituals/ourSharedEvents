# OSE-560 — Conformance report generator
#
# Generates CONFORMANCE.md and conformance.json from:
#   - tests/fixtures/threat-ledger.ts (threat → invariant mapping + red birth dates)
#   - @born-red annotations in test files (test → ledger → invariant chain)
#   - OCR-docs/architectural-invariants.yaml (invariant claim statements)
#
# "Generated, never written." — the report is the CI artifact, not a document.
# Empty rows are the product: gaps render loudly, not silently.
#
# Triggers: push to main, weekly cron (Sundays 06:00 UTC), manual dispatch.

name: Conformance Report

on:
  push:
    branches: [main]
    paths:
      - 'workers/oursharedevents/tests/fixtures/threat-ledger.ts'
      - 'workers/oursharedevents/tests/**/*.spec.ts'
      - 'OCR-docs/ocr-docs-brain/architectural-invariants.yaml'
      - 'workers/oursharedevents/scripts/generate-conformance-report.ts'
  schedule:
    - cron: '0 6 * * 0'   # Weekly — Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — generate but do not commit'
        type: boolean
        default: false

jobs:
  generate:
    name: Generate conformance report
    runs-on: ubuntu-24.04
    permissions:
      contents: read     # OSE-1031: report writes flow through a PR opened with
                         # OCR_PROPAGATE_TOKEN (a PAT), never a direct push to protected main —
                         # the default GITHUB_TOKEN needs no write scope here.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # generator runs via `node --experimental-strip-types` (needs >=22.6); Node 20 errors `bad option` — OSE-1031
          cache: 'npm'
          cache-dependency-path: workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests the Worker, which
        # bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref. REQUIRED —
        # never continue-on-error: npm ci would succeed with a dangling @ocr/ui
        # link and the failure would surface later as an unresolvable import.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_HUB_READ || secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install dependencies
        working-directory: workers/oursharedevents
        run: npm ci

      # Checkout the brain AFTER npm ci — the OCR_PROPAGATE_TOKEN has org-write scope, so it
      # must never be present in git config while untrusted dependency postinstall scripts run
      # (supply-chain exfil surface). persist-credentials:false so it isn't left behind either.
      # OSE-1031 — this checkout was missing entirely; the generator was silently falling back
      # to a stale 24-entry inline registry, so the report could never report the canonical 25.
      - name: Checkout OCR-docs brain (read-only)
        uses: actions/checkout@v4
        with:
          repository: ourCommunityRituals/OCR-docs
          path: OCR-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ || secrets.OCR_PROPAGATE_TOKEN }}
          persist-credentials: false

      # OSE-1466 0.1, run time: the steps below run PR code, so prove the
      # checkout above left no credential on disk.
      - name: 'No token left behind by the brain checkout'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/assert-no-persisted-token.sh OCR-docs

      - name: Generate conformance report
        working-directory: workers/oursharedevents
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # Fail loud if the brain isn't present — never silently regenerate from the inline
          # fallback registry (that silent fallback is exactly how the count drifted to 24). OSE-1031.
          test -f ../../OCR-docs/ocr-docs-brain/architectural-invariants.yaml \
            || { echo "::error::OCR-docs brain not checked out — refusing to generate from the stale inline fallback"; exit 1; }
          node --experimental-strip-types scripts/generate-conformance-report.ts \
            --invariants-yaml "../../OCR-docs/ocr-docs-brain/architectural-invariants.yaml" \
            --test-dir tests \
            --out-dir docs/security \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-date "$(date -u +%Y-%m-%d)"

      - name: Check for gaps (informational — never fails CI)
        working-directory: workers/oursharedevents
        run: |
          if grep -q '❌ Gap' docs/security/CONFORMANCE.md; then
            echo "::warning::Conformance gaps detected — review docs/security/CONFORMANCE.md"
          fi
          echo "Gap count: $(grep -c '❌ Gap' docs/security/CONFORMANCE.md || echo 0)"

      - name: Open/update the conformance-refresh PR
        # OSE-1031 layer 3: the report cannot be pushed directly to protected `main`
        # (branch protection rejects the bot push — GH006). Instead open a PR from a stable
        # branch so the refresh flows through the required checks like any change. Opened with
        # OCR_PROPAGATE_TOKEN (a PAT) — a PR opened by the default GITHUB_TOKEN triggers NO
        # checks and could therefore never merge. Human/CODEOWNERS merges it; the bot does not
        # self-approve. The token is used only here (well after `npm ci`) and inline in the
        # push URL, never persisted to git config.
        if: ${{ github.event.inputs.dry_run != 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.OCR_AUTOMATION_WRITE || secrets.OCR_PROPAGATE_TOKEN }}
        run: |
          set -euo pipefail
          RPT=workers/oursharedevents/docs/security
          if git diff --quiet -- "$RPT/CONFORMANCE.md" "$RPT/conformance.json"; then
            echo "Conformance report unchanged — no refresh PR needed."
            exit 0
          fi
          # OSE-1151: fail loud and actionable, not with a bare git 403, when the PAT is
          # missing/mis-scoped — this exact failure mode (token present at the org level but
          # lacking write access to THIS repo) silently starved the refresh mechanism for
          # multiple consecutive weekly runs with no clear signal of what to fix.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Neither OCR_AUTOMATION_WRITE nor OCR_PROPAGATE_TOKEN resolved to a value here. Verify secret access for this repo."
            exit 1
          fi
          BRANCH=chore/conformance-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create-or-update: reset the stable branch to this main commit + the fresh report,
          # so scheduled runs update ONE PR instead of spawning a new one every week.
          git checkout -B "$BRANCH"
          git add "$RPT/CONFORMANCE.md" "$RPT/conformance.json"
          git commit -m "chore: regenerate conformance report (OSE-560)"
          if ! git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH" 2>push_err.log; then
            cat push_err.log
            if grep -qi "Write access to repository not granted" push_err.log; then
              echo "::error::The write token (OCR_AUTOMATION_WRITE, or OCR_PROPAGATE_TOKEN while that is unset) lacks write access to ${GITHUB_REPOSITORY} — it needs Contents: write and Pull requests: write on this repo so the conformance-refresh PR can be opened. The freshly generated report is still available as this run's artifact for manual review in the meantime."
            else
              echo "::error::conformance-refresh push failed for an unexpected reason — see push_err.log output above."
            fi
            exit 1
          fi
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: regenerate conformance report (OSE-560)" \
              --body "Automated conformance-meter refresh — generated, never hand-written. Review the coverage diff and merge; this is how the meter stays current without a direct push to protected \`main\` (OSE-1031). Human/CODEOWNERS merge — the bot does not self-approve."
          else
            echo "Refresh PR already open for $BRANCH — updated in place by the force-push."
          fi

      - name: Upload report as artifact
        # OSE-1151: always upload, even if the refresh-PR step above failed (e.g. token
        # permission gap) — the freshly generated report must not be lost on that failure,
        # it's the only way to review the current drift until the PAT is fixed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-${{ github.sha }}
          path: |
            workers/oursharedevents/docs/security/CONFORMANCE.md
            workers/oursharedevents/docs/security/conformance.json
          retention-days: 90
