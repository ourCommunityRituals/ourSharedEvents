# mobile-workability-audit.yml — enforce invariant 14.
#
# Loads each customer-facing OSE surface at 375×812 (iPhone 13 Mini /
# iPhone X) and asserts the five concrete mobile-workability contracts
# from OCR_STANDARD_mobileWorkability.md:
#
#   1. No horizontal scroll
#   2. Touch targets ≥ 44×44 px
#   3. Input font-size ≥ 16 px
#   4. Primary CTA above the fold
#   5. No pinch-zoom blocked or required
#
# TWO JOBS, TWO QUESTIONS (OSE-1236, 2026-09-05)
# ----------------------------------------------
#   pr-code   → "did THIS DIFF break mobile?"     local worker · BLOCKING
#   nightly   → "is deployed staging workable?"   STAGING_URL  · blocking
#
# Before this split there was one job, it pointed at STAGING_URL, and it was
# `continue-on-error` on pull_request. Two consequences, both measured:
#
#   - On a PR it audited DEPLOYED STAGING — whatever was already merged — and
#     reported that as a check on the PR. A PR that broke a touch target
#     passed; a PR that fixed one still failed. The verdict was uncorrelated
#     with the diff. (The root cause was in the spec, not here: it built
#     ABSOLUTE urls from STAGING_URL, so it ignored Playwright's baseURL and
#     could not be pointed anywhere. Navigation is relative now.)
#   - It could not block anyway.
#
#   Meanwhile the SCHEDULED run — the one that COULD block — failed four
#   nights running (runs 187, 188, 189, 192; every schedule event since
#   2026-09-01). Its top failure mode was not a workability violation:
#
#       browserType.launch: Executable doesn't exist at .../webkit-2336/…
#
#   Three of the four projects in playwright.config.ts are WebKit device
#   descriptors and this workflow installed `chromium` only. A gate that is
#   always red teaches people to ignore it exactly as fast as one that is
#   always green. The nightly now installs webkit too.
#
# The PR job runs Chromium against a local `wrangler dev` worker
# (playwright.mobile.config.ts). It needs no deploy, no secrets and no
# network, completes in ~50s, and covers all 11 surfaces with zero skips —
# including /admin, which had NEVER been audited on any run because
# OSE-302's staging bearer secret has been unset since May.

name: Mobile workability audit

on:
  schedule:
    - cron: '30 9 * * *'
  pull_request:
    branches: [main]
    # No `paths` filter (PO 2026-10-06). The PR job is a required check, and a
    # required check whose workflow does not start leaves the PR waiting on it
    # for good. Whether a PR changes anything the audit measures is decided
    # inside the job, by scripts/ci/phone-audit-scope.mjs (the list that used to
    # live here, with its reasons, moved there).
  workflow_dispatch:

concurrency:
  group: mobile-workability-${{ github.ref }}
  cancel-in-progress: true

# Read only: neither job comments or files issues. pr-code runs the PR's own
# code, which gets this token (OSE-1466 0.6). pull-requests: read is for the
# changed-files lookup.
permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  # ── BLOCKING: this branch's code, on a local worker ────────────────────────
  pr-code:
    # One leg per screen, in the order people use them (PO 2026-10-06): phone
    # first, desktop second, tablet third. Only the phone leg is a required
    # check: its name is the context in tools/ci/main-branch-protection.json,
    # so it must stay exactly "Mobile workability — PR code (375×812, blocking)".
    # The desktop and tablet legs report beside it and do not block a merge.
    name: Mobile workability — PR code (${{ matrix.label }})
    strategy:
      # A red desktop or tablet leg must not cancel the phone leg.
      fail-fast: false
      matrix:
        include:
          - id: phone
            label: 375×812, blocking
            projects: --project mobile-chromium --project mobile-webkit
            webkit: true
          - id: desktop
            label: desktop 1280×800
            projects: --project desktop-chromium
            webkit: false
          - id: tablet
            label: tablet 820×1180
            projects: --project tablet-chromium
            webkit: false
    # No `if`: the phone leg is a required check, and a skipped job is not
    # success. The first step decides whether there is anything to audit; every
    # later step follows it.
    runs-on: ubuntu-24.04
    # 25, not 15: the audit step alone measured 12.2 to 14.0 minutes over 14
    # runs (2026-10-05/06) and setup adds about 1.5, so 9 of those 14 runs were
    # cut off at 15 with every completed test passing.
    timeout-minutes: 25

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7

      # OSE-1466 0.6, run time: this job runs the PR's code, so prove its token is
      # refused on push, comment and issue creation. Nothing is created.
      - name: 'Job token cannot push, comment or open issues'
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_ISSUE: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/assert-token-read-only.sh

      - name: Does this change touch what the audit measures?
        # A pull request: ask the scope rule. A manual run: always audit. The
        # nightly schedule: this job is not the nightly one (see nightly-staging).
        # If the changed files cannot be read, the rule answers "run".
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            pull_request)
              files="$(gh pr diff "$PR_NUMBER" --name-only || true)"
              printf '%s\n' "$files" | node scripts/ci/phone-audit-scope.mjs | tee -a "$GITHUB_OUTPUT"
              ;;
            schedule) echo "run=false" | tee -a "$GITHUB_OUTPUT" ;;
            *) echo "run=true" | tee -a "$GITHUB_OUTPUT" ;;
          esac

      - name: Nothing to audit
        if: steps.scope.outputs.run != 'true'
        run: |
          echo "Phone audit not run: this change touches no page, spec or dependency the audit measures (scripts/ci/phone-audit-scope.mjs)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        if: steps.scope.outputs.run == 'true'
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --prefer-offline || npm ci

      # The webServer boots `wrangler dev` with cwd workers/oursharedevents
      # (playwright.mobile.config.ts), so the worker is bundled against ITS
      # node_modules — where `@ocr/ui` and `@ocr/flags` live as file: links.
      # Root `npm ci` above does not create them (root is not an npm
      # workspace), so without this step wrangler dev fails to resolve
      # `@ocr/ui` and the webServer never boots — every mobile test then
      # fails on an env bug, not a workability violation (OSE-1249). The T0
      # jobs already install here; this job simply did not. Born-red:
      # delete this step and the audit goes red with
      # `Could not resolve "@ocr/ui"`.
      - name: Install worker dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: workers/oursharedevents
        run: npm ci --prefer-offline || npm ci

      # The Ubuntu packages the browsers need (WebKit: 181 packages, 126 MB) come
      # from the runner's mirror. On 2026-10-06 and 2026-10-07 that download
      # stalled and the install step timed out with no test run. The install
      # script copies this directory into apt's cache before the install and
      # refreshes it after the download. One cache per browser set; the keys
      # match T0 Gate's, whose runs on main are what fill them for every PR.
      - name: Restore Playwright system package cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pw-apt-archives
          key: ${{ runner.os }}-pw-apt-${{ matrix.webkit && 'chromium-webkit' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-apt-${{ matrix.webkit && 'chromium-webkit' || 'chromium' }}-

      - name: Install Playwright browsers
        if: steps.scope.outputs.run == 'true'
        # 10 minutes: about a minute when the packages come from the cache. The
        # script gives the package download two attempts of 150 seconds each
        # (the second on another mirror) and fails with the reason if neither
        # finishes, so this limit is only the backstop.
        timeout-minutes: 10
        # Chromium on every leg. The spec forces 375×812 on every surface, so the
        # viewport — the thing invariant 14 is about — is identical across
        # projects; only the engine and UA differ. Engine-specific layout bugs
        # are real, which is why the nightly keeps all four. Quadrupling the
        # cost of a gate that runs on every push does not pay for itself.
        # WebKit on the phone leg only (OSE-1508): the organizer's publish loop
        # runs on WebKit too, because most phones are WebKit. One spec, so the
        # cost stays small.
        env:
          BROWSERS: ${{ matrix.webkit && 'chromium webkit' || 'chromium' }}
        # $BROWSERS is one of the two fixed lists above; it is left unquoted on
        # purpose so each browser is its own argument.
        run: bash scripts/ci/install-playwright-browsers.sh $BROWSERS

      - name: Audit this branch's code
        if: steps.scope.outputs.run == 'true'
        # No continue-on-error. This is the whole point: the check's verdict is
        # now about the diff under review, so it is allowed to mean something.
        # playwright.mobile.config.ts starts `wrangler dev --local` itself — no
        # deploy, no secrets, no network.
        env:
          PROJECTS: ${{ matrix.projects }}
        # $PROJECTS is a fixed list of --project flags from the matrix above; it
        # is left unquoted on purpose so each flag is its own argument.
        run: npx playwright test --config playwright.mobile.config.ts $PROJECTS --reporter=html,list

      - name: Upload Playwright report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-workability-pr-report-${{ matrix.id }}
          path: playwright-report/
          retention-days: 30

  # ── The deployed environment, nightly ─────────────────────────────────────
  nightly-staging:
    name: Mobile workability — deployed staging (375×812)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://stg.oursharedevents.com' }}
      OSE_ADMIN_BEARER: ${{ secrets.OSE_ADMIN_BEARER }}

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: npm ci --prefer-offline || npm ci

      - name: Install Playwright browsers
        # chromium AND webkit. playwright.config.ts declares four projects and
        # three of them (iPhone SE, iPhone 14 Pro Max, iPad Air) are WebKit
        # device descriptors. Installing chromium alone is why this job failed
        # every night since 2026-09-01 with "Executable doesn't exist at
        # .../webkit-2336/pw_run.sh" — a red that said nothing about mobile
        # workability, on the one run that could block.
        run: bash scripts/ci/install-playwright-browsers.sh chromium webkit

      - name: Audit deployed staging
        id: audit
        run: npx playwright test tests/playwright/mobile-workability.spec.ts --reporter=html,list

      # OSE-1470: this audit sends OSE_ADMIN_BEARER to deployed staging. Refuse
      # to upload a report that recorded it (prints only file + pattern name).
      - name: Scan report for credentials
        id: artifact-scan
        if: always()
        run: bash scripts/ci/scan-artifacts-for-secrets.sh playwright-report/

      - name: Upload Playwright report
        if: always() && steps.artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-workability-staging-report
          path: playwright-report/
          retention-days: 30
