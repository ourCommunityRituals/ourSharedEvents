# mobile-workability-audit.yml — enforce invariant 14.
#
# Loads each customer-facing OSE surface at 375×812 (iPhone 13 Mini /
# iPhone X) and asserts the five concrete mobile-workability contracts
# from OCR_STANDARD_mobileWorkability.md:
#
#   1. No horizontal scroll
#   2. Touch targets ≥ 44×44 px
#   3. Input font-size ≥ 16 px
#   4. Primary CTA above the fold
#   5. No pinch-zoom blocked or required
#
# TWO JOBS, TWO QUESTIONS (OSE-1236, 2026-09-05)
# ----------------------------------------------
#   pr-code   → "did THIS DIFF break mobile?"     local worker · BLOCKING
#   nightly   → "is deployed staging workable?"   STAGING_URL  · blocking
#
# Before this split there was one job, it pointed at STAGING_URL, and it was
# `continue-on-error` on pull_request. Two consequences, both measured:
#
#   - On a PR it audited DEPLOYED STAGING — whatever was already merged — and
#     reported that as a check on the PR. A PR that broke a touch target
#     passed; a PR that fixed one still failed. The verdict was uncorrelated
#     with the diff. (The root cause was in the spec, not here: it built
#     ABSOLUTE urls from STAGING_URL, so it ignored Playwright's baseURL and
#     could not be pointed anywhere. Navigation is relative now.)
#   - It could not block anyway.
#
#   Meanwhile the SCHEDULED run — the one that COULD block — failed four
#   nights running (runs 187, 188, 189, 192; every schedule event since
#   2026-09-01). Its top failure mode was not a workability violation:
#
#       browserType.launch: Executable doesn't exist at .../webkit-2336/…
#
#   Three of the four projects in playwright.config.ts are WebKit device
#   descriptors and this workflow installed `chromium` only. A gate that is
#   always red teaches people to ignore it exactly as fast as one that is
#   always green. The nightly now installs webkit too.
#
# The PR job runs Chromium against a local `wrangler dev` worker
# (playwright.mobile.config.ts). It needs no deploy, no secrets and no
# network, completes in ~50s, and covers all 11 surfaces with zero skips —
# including /admin, which had NEVER been audited on any run because
# OSE-302's staging bearer secret has been unset since May.

name: Mobile workability audit

on:
  schedule:
    - cron: '30 9 * * *'
  pull_request:
    branches: [main]
    # Widened for the blocking job (OSE-1236). The old list named two handlers
    # and the spec. It could not see a change to a TEMPLATE, to the shared
    # stylesheet, or to the design tokens — which is where mobile-workability
    # regressions actually come from: the violations this gate found on its
    # first PR-code run were in src/templates/admin.html and
    # packages/ui/src/styles.ts, neither of which was listed here.
    # ADR-008 Phase 0: @ocr/ui now lives in the hub, pinned by .ocr-hub-ref —
    # a change to the shared stylesheet/tokens reaches OSE only as a bump of
    # that file, so the pin file is the trigger (was 'packages/ui/src/**').
    paths:
      # ALL three specs this job runs (playwright.mobile.config.ts testMatch:
      # mobile-workability | admin-wizard-isolation | admin-csp-controls). The
      # list previously named only mobile-workability.spec.ts, so a change to
      # either admin spec — two of the three specs the config actually executes
      # — did not trigger the job that runs it, and the change merged green
      # without ever being exercised (found on #555, the admin-csp de-flake).
      - 'tests/playwright/mobile-workability.spec.ts'
      - 'tests/playwright/admin-wizard-isolation.spec.ts'
      - 'tests/playwright/admin-csp-controls.spec.ts'
      - 'playwright.mobile.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/mobile-workability-audit.yml'
      - 'workers/oursharedevents/src/handlers/**'
      - 'workers/oursharedevents/src/templates/**'
      - 'workers/oursharedevents/src/lib/legal-footer.ts'
      - '.ocr-hub-ref'
  workflow_dispatch:

concurrency:
  group: mobile-workability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  # ── BLOCKING: this branch's code, on a local worker ────────────────────────
  pr-code:
    name: Mobile workability — PR code (375×812, blocking)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # ADR-008 Phase 0: this job installs/builds/tests/deploys the Worker,
        # which bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref.
        # REQUIRED — never continue-on-error: without the pinned @ocr/ui the
        # Worker install/build is wrong, so fail here with a clear ::error::.
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: npm ci --prefer-offline || npm ci

      # The webServer boots `wrangler dev` with cwd workers/oursharedevents
      # (playwright.mobile.config.ts), so the worker is bundled against ITS
      # node_modules — where `@ocr/ui` and `@ocr/flags` live as file: links.
      # Root `npm ci` above does not create them (root is not an npm
      # workspace), so without this step wrangler dev fails to resolve
      # `@ocr/ui` and the webServer never boots — every mobile test then
      # fails on an env bug, not a workability violation (OSE-1249). The T0
      # jobs already install here; this job simply did not. Born-red:
      # delete this step and the audit goes red with
      # `Could not resolve "@ocr/ui"`.
      - name: Install worker dependencies
        working-directory: workers/oursharedevents
        run: npm ci --prefer-offline || npm ci

      - name: Install Playwright Chromium
        # Chromium only. The spec forces 375×812 on every surface, so the
        # viewport — the thing invariant 14 is about — is identical across
        # projects; only the engine and UA differ. Engine-specific layout bugs
        # are real, which is why the nightly keeps all four. Quadrupling the
        # cost of a gate that runs on every push does not pay for itself.
        run: npx playwright install --with-deps chromium

      - name: Audit this branch's code
        # No continue-on-error. This is the whole point: the check's verdict is
        # now about the diff under review, so it is allowed to mean something.
        # playwright.mobile.config.ts starts `wrangler dev --local` itself — no
        # deploy, no secrets, no network.
        run: npx playwright test --config playwright.mobile.config.ts --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-workability-pr-report
          path: playwright-report/
          retention-days: 30

  # ── The deployed environment, nightly ─────────────────────────────────────
  nightly-staging:
    name: Mobile workability — deployed staging (375×812)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://stg.oursharedevents.com' }}
      OSE_ADMIN_BEARER: ${{ secrets.OSE_ADMIN_BEARER }}

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        # Root-only job: nothing here imports @ocr/ui, so staging stays
        # best-effort (it now exits 1 if the pinned hub cannot be fetched);
        # root npm ci tolerates a missing @ocr/flags (OSE-341).
        continue-on-error: true
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_PROPAGATE_TOKEN: ${{ secrets.OCR_PROPAGATE_TOKEN }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - name: Install root dependencies
        run: npm ci --prefer-offline || npm ci

      - name: Install Playwright browsers
        # chromium AND webkit. playwright.config.ts declares four projects and
        # three of them (iPhone SE, iPhone 14 Pro Max, iPad Air) are WebKit
        # device descriptors. Installing chromium alone is why this job failed
        # every night since 2026-09-01 with "Executable doesn't exist at
        # .../webkit-2336/pw_run.sh" — a red that said nothing about mobile
        # workability, on the one run that could block.
        run: npx playwright install --with-deps chromium webkit

      - name: Audit deployed staging
        id: audit
        run: npx playwright test tests/playwright/mobile-workability.spec.ts --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-workability-staging-report
          path: playwright-report/
          retention-days: 30
