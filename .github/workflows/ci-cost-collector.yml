# CI Cost Collector (COST-302 / OSE-781)
#
# Collects per-job wall-clock durations for the `oursharedevents-ci` workflow
# from the GitHub Actions API and writes them as JSONL (schema ci-cost/v1) — the
# "over time" CI cost view that complements the runtime OPERATION_COST metric
# (COST-301).
#
# Delivery is a workflow artifact (90 days) plus the run summary. It is NOT
# committed: `main` is protected (required checks, enforce_admins), so a push
# from the default GITHUB_TOKEN is rejected (GH006) and this job went red daily.
# That is why the token here is read-only. If a committed series is wanted
# again, deliver it through a PR like conformance-report.yml, with the write
# token from the main-automation environment (OSE-1693 / OSE-1695).
#
# Aggregate CI timing only — no developer/actor identity is recorded (never-who
# applies to dev identities too). See docs/monitoring/CI-COST-COLLECTOR.md.
#
# Runs on GitHub-hosted ubuntu (gh preinstalled) — deliberately NOT self-hosted:
# this is a read-only Actions-API collector, not a build.

name: CI Cost Collector

on:
  schedule:
    - cron: '17 5 * * *' # Daily 05:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many recent completed runs to scan'
        type: string
        default: '20'

jobs:
  collect:
    timeout-minutes: 10 # [Claude] ceiling: ~3x the slowest of the last 25 runs (1.3 min)
    name: Collect CI job durations
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout only; nothing is pushed
      actions: read # to read workflow run + job durations

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false # nothing below pushes; keep the token off disk

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Collect CI job durations
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch input → env, never interpolated into the shell (OSE-1470).
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          node scripts/ci-cost-collector.mjs \
            --history docs/monitoring/ci-cost-history.jsonl \
            --workflow oursharedevents-ci.yml \
            --limit "$LIMIT" | tee collector-summary.json
          {
            echo '### CI cost collector'
            echo
            echo '```json'
            cat collector-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm collector-summary.json

      - name: Upload history as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-cost-history-${{ github.run_id }}
          path: docs/monitoring/ci-cost-history.jsonl
          retention-days: 90
