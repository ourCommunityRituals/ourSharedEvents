# CI Cost Collector (COST-302 / OSE-781)
#
# Collects per-job wall-clock durations for the `oursharedevents-ci` workflow
# from the GitHub Actions API and appends them to a committed JSONL time-series
# at docs/monitoring/ci-cost-history.jsonl — the "over time" CI cost view that
# complements the runtime OPERATION_COST metric (COST-301).
#
# Aggregate CI timing only — no developer/actor identity is recorded (never-who
# applies to dev identities too). See docs/monitoring/CI-COST-COLLECTOR.md.
#
# Runs on GitHub-hosted ubuntu (gh preinstalled) — deliberately NOT self-hosted:
# this is a read-only Actions-API collector, not a build.

name: CI Cost Collector

on:
  schedule:
    - cron: '17 5 * * *' # Daily 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect but do not commit'
        type: boolean
        default: false
      limit:
        description: 'How many recent completed runs to scan'
        type: string
        default: '20'

jobs:
  collect:
    name: Collect CI job durations
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the history file back to main
      actions: read # to read workflow run + job durations

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect CI job durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci-cost-collector.mjs \
            --history docs/monitoring/ci-cost-history.jsonl \
            --workflow oursharedevents-ci.yml \
            --limit "${{ github.event.inputs.limit || '20' }}"

      - name: Commit updated history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/monitoring/ci-cost-history.jsonl
          if git diff --cached --quiet; then
            echo "No new CI cost records."
          else
            git commit -m "chore(cost): collect CI job durations [skip ci]"
            git push
          fi

      - name: Upload history as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cost-history-${{ github.run_id }}
          path: docs/monitoring/ci-cost-history.jsonl
          retention-days: 90
