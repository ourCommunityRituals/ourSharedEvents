# notify-osm-flag-change.yml
# When feature flag code changes in OSE, open an issue in OSM
# so Postman collections and Newman mocks stay in sync.
#
# This is the first wired dependency from DEPENDENCY-MAP.md:
# OSE feature flags → OSM mock layer update

name: Notify OSM on Flag Change

on:
  push:
    branches: [main]
    paths:
      - 'workers/oursharedevents/src/lib/feature-flags.ts'
      - 'workers/oursharedevents/src/handlers/feature-flags.ts'
  # Manual token check (OSE-1695): opens a marked test issue in OSM and closes
  # it at once, so the write token can be proven without a flag change. Runs
  # only from main, because the environment below is main-only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    timeout-minutes: 10 # [Claude] ceiling: ~3x the slowest of the last 25 runs (0.5 min)
    name: Open issue in OSM
    runs-on: ubuntu-24.04
    # Its write token is a main-automation environment secret (OSE-1695); main only.
    environment: main-automation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Get change summary
        id: changes
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- \
            workers/oursharedevents/src/lib/feature-flags.ts \
            workers/oursharedevents/src/handlers/feature-flags.ts \
            | head -100)
          echo "diff<<EODIFF" >> "$GITHUB_OUTPUT"
          echo "$DIFF" >> "$GITHUB_OUTPUT"
          echo "EODIFF" >> "$GITHUB_OUTPUT"

      - name: Open issue in OSM
        env:
          GH_TOKEN: ${{ secrets.OCR_NOTIFY_OSM || secrets.OCR_PROPAGATE_TOKEN }}
          # Branch and author arrive through env, never interpolated into the
          # shell (OSE-1499). The quoted heredoc keeps the body literal; the
          # placeholders are filled by bash string replacement afterwards.
          BRANCH_NAME: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BODY="$(cat <<'EOISSUE'
          ## Feature Flag Change Detected

          OSE commit: __SHA__
          Branch: __BRANCH__
          Author: __AUTHOR__

          ### What changed

          Feature flag source files were modified in OSE:
          - `workers/oursharedevents/src/lib/feature-flags.ts`
          - `workers/oursharedevents/src/handlers/feature-flags.ts`

          ### Action required

          Update OSM Postman collections and Newman CI mocks to reflect the new flag configuration. The 3-tier model (Free/Mid/Enterprise) may have changed.

          ### Dependency reference

          See `OCR-docs/docs/DEPENDENCY-MAP.md` — "OSE feature flags → OSM mock layer"

          ---
          *Opened by notify-osm-flag-change workflow in ourSharedEvents.*
          EOISSUE
          )"
          # Quoted replacements: plain text, and no bash 5.2 `&` expansion.
          BODY="${BODY//__SHA__/"$GITHUB_SHA"}"
          BODY="${BODY//__BRANCH__/"$BRANCH_NAME"}"
          BODY="${BODY//__AUTHOR__/"$AUTHOR"}"
          TITLE="OSE feature flags changed — update Postman/Newman mocks"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TITLE="[token check] $TITLE"
            NOTE="Manual token check from ourSharedEvents. Not a real flag change; closed at once."
            BODY="${NOTE}"$'\n\n'"${BODY}"
          fi
          ISSUE_URL="$(gh issue create \
            --repo ourCommunityRituals/ourSharedMagnets \
            --title "$TITLE" \
            --label "dependency-sync" \
            --body "$BODY")"
          echo "Opened: $ISSUE_URL"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh issue close "$ISSUE_URL" --reason "not planned" \
              --comment "Token check passed; closing."
            echo "Closed the token-check issue."
          fi
