# Invariant #22 — Cross-Repo Import Isolation gate (OSE-1297)
#
# WHY a dedicated job (not the existing "Validate against OCR-docs brain" job):
# main-branch-protection.json deliberately EXCLUDES that job from required checks
# because its heavy steps (brain pyramid, contract conformance, Linear-ticket
# opener) have historically false-red. So the #22 canonical guard ran there but
# never BLOCKED a PR — OSE's own #22 enforcement was advisory (OSE-1297 gap #1).
#
# This job isolates ONLY the deterministic guard: checkout + setup-python + one
# fail-closed script. No pyramid, no conformance, no ticket-opener — nothing that
# false-reds — so it is safe to make REQUIRED (listed in main-branch-protection.json;
# activate out-of-band with scripts/apply-branch-protection.mjs --apply).
#
# The brain guard is the SINGLE canonical source (Invariant #22 condemns per-repo
# copies). It scans BOTH src/ and workers/ (OSE-1297 gap #2 — the retired
# check-cross-repo-imports.sh was workers/-only and is already deleted, #521).
#
# LIVE-READ: the guard + patterns are read from OCR-docs main (same as
# brain-contract-check.yml's brain checkout), so one reviewed brain edit
# re-arms/disarms the fleet (the OSE-1294 enforcement_mode model). Merges to
# brain main are gated by the brain's own test pyramid + the guard's 19-contract
# self-test, so a broken guard should not reach main; a stricter pattern that
# flags real OSE coupling SHOULD red this gate — that is the point.
#
# DEPENDABOT: the brain checkout needs OCR_PROPAGATE_TOKEN, which is not available
# to dependabot-triggered runs. Rather than a job-level skip (which would leave a
# REQUIRED context permanently unsatisfied and deadlock every dependabot PR), the
# job always runs and reports success; only the guard STEPS are skipped for
# dependabot. A dependency bump cannot introduce a cross-repo MODULE import, and
# the guard runs in full on the resulting push to main and every human PR.
name: Invariant 22 cross-repo gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: inv22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  inv22-gate:
    name: 'Invariant #22 cross-repo isolation gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Dependabot notice (guard steps skipped — no cross-repo token)
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Dependabot run: the brain guard needs OCR_PROPAGATE_TOKEN, which is"
          echo "not available here. A dependency bump cannot introduce a cross-repo"
          echo "module import; the guard runs in full on the push to main and on"
          echo "every human PR. Reporting success so this required gate does not"
          echo "deadlock dependabot PRs."

      - name: Checkout OSE
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          path: ose

      # ref: main — live-read the canonical guard + patterns, matching
      # brain-contract-check.yml. One reviewed brain edit re-arms/disarms the
      # fleet (OSE-1294). Reads ocr-docs-brain/scripts/check_cross_repo_imports.py
      # + cross_repo_patterns.json + product-registry.yaml.
      - name: Checkout OCR-docs brain guard
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ || secrets.OCR_PROPAGATE_TOKEN }}
          # ADR-012 0.1: never leave the token where later steps can read it.
          persist-credentials: false

      # OSE-1466 0.1, run time: the steps below run PR code, so prove the
      # checkout above left no credential on disk.
      - name: 'No token left behind by the brain checkout'
        if: github.actor != 'dependabot[bot]'
        working-directory: ${{ github.workspace }}
        run: bash ose/scripts/ci/assert-no-persisted-token.sh ocr-docs

      - name: Set up Python
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The guard reads product-registry.yaml (prohibited sibling scopes) via
      # pyyaml — install it into the same interpreter setup-python owns. Match
      # brain-contract-check.yml's proven install; verify the import so a missing
      # dep fails HERE with a clear message, not mid-guard.
      - name: Install guard deps
        if: github.actor != 'dependabot[bot]'
        run: |
          python3 -m pip install pyyaml
          python3 -c 'import yaml' || { echo "::error::pyyaml missing from the python3 env"; exit 1; }

      # Fail-closed: exits non-zero on any cross-repo module coupling, on a
      # dynamic/unresolvable specifier, or on a missing patterns file.
      - name: 'Invariant #22 — cross-repo import isolation (canonical brain guard)'
        if: github.actor != 'dependabot[bot]'
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_cross_repo_imports.py \
            --repo ose --product-id ose --brain ocr-docs/ocr-docs-brain
