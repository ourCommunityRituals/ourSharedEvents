# Claude Code Review — AI-Powered PR Analysis
#
# Purpose: Automated code review using Claude Code Action.
# Provides intelligent feedback on PRs aligned with project conventions
# defined in CLAUDE.md, and responds to @claude mentions in comments.
#
# Required Secrets:
#   - ANTHROPIC_API_KEY: Anthropic API key for Claude access
#
# @see CLAUDE.md - Project conventions and architecture decisions

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: "Claude PR Review"
    runs-on: ubuntu-latest
    # Run on PR events, or on issue comments that mention @claude on a PR
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check for API key
        id: check-key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping Claude review"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.check-key.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.check-key.outputs.skip != 'true'
        continue-on-error: true  # Advisory — API failures must not block PRs
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          timeout_minutes: 10
