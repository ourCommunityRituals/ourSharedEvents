# Claude Code Review — AI-Powered PR Analysis
#
# Purpose: Automated code review using Claude Code Action.
# Provides intelligent feedback on PRs aligned with project conventions
# defined in CLAUDE.md, and responds to @claude mentions in comments.
#
# Required Secrets:
#   - ANTHROPIC_API_KEY: Anthropic API key for Claude access
#
# @see CLAUDE.md - Project conventions and architecture decisions

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Concurrency is scoped by EVENT as well as PR number. Without the event in the
# group, a bot comment on a PR fires `issue_comment` ~seconds after a push's
# `pull_request` run starts; both landed in the same group and cancel-in-progress
# meant the comment run CANCELLED the real review run (which then showed red on
# the PR while never running a review). The comment run itself skips (no @claude),
# so nothing reviewed. Separating groups by event lets a push's review complete
# green while still de-duping rapid pushes within the pull_request group.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    name: "Claude PR Review"
    runs-on: ubuntu-24.04
    continue-on-error: true  # Advisory — cancellation via concurrency group must not block PRs
    defaults:
      run:
        shell: bash
    # Run on PR events, or on issue comments that mention @claude on a PR.
    # The issue_comment path is TRUSTED-ACTOR-GATED (author_association ∈
    # OWNER/MEMBER/COLLABORATOR) — comment bodies are fed to an LLM agent that runs
    # with ANTHROPIC_API_KEY and pull-requests/issues write. Without the gate, any
    # commenter could trigger it: prompt-injection + API-spend DoS. Mirrors the gate
    # already in ourWKRP's claude.yml (best-of-both CI sync flowing WKRP→OSE).
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check for API key
        id: check-key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping Claude review"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Sweep 9 #6 (2026-05-14): dropped `fetch-depth: 0`. The Claude review
      # action only needs the PR diff (head..base), not the entire repo
      # history. Default shallow checkout is faster on Bloodraven where
      # the OSE repo has ~3 years of commits.
      - uses: actions/checkout@v7
        if: steps.check-key.outputs.skip != 'true'

      # SHA-pinned (supply-chain): a mutable @v1 tag can be force-pushed to run
      # attacker code with this job's ANTHROPIC_API_KEY + write scopes. Bump via Dependabot.
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        if: steps.check-key.outputs.skip != 'true'
        continue-on-error: true  # Advisory — API failures must not block PRs
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Current, non-dated alias. Was pinned to the dated "claude-sonnet-4-20250514",
          # which retires 2026-06-15 — a dated id trades the rolling-default problem for a
          # time-bomb that (with continue-on-error) would fail SILENTLY. Owner may bump to
          # claude-opus-4-8 for higher review quality.
          model: "claude-sonnet-4-6"
          timeout_minutes: 10
