# Claude Code Review — AI-Powered PR Analysis
#
# Two jobs, two modes of anthropics/claude-code-action@v1:
#   • security-review — on every PR: a SECURITY review against OSE's invariants,
#     driven by .github/claude-review/security-charter.md (OSE-1400).
#   • respond — on a trusted `@claude` PR comment: interactive tag mode.
#
# WHY IT WAS SPLIT (OSE-1400, 2026-09-29). The single-job version never produced
# a review, for three stacked reasons:
#   1. ANTHROPIC_API_KEY was not provisioned, so every run hit the skip below and
#      still reported SUCCESS — a green check that reviewed nothing.
#   2. It passed no `prompt`. In v1, a pull_request event with no prompt does
#      nothing; only tag mode (an @claude mention) acts.
#   3. `model:` and `timeout_minutes:` are not v1 inputs — both were silently
#      ignored. The model now goes through `claude_args`; the timeout is the
#      job's `timeout-minutes`.
# A `prompt` puts the action in agent mode for EVERY event, so the security
# prompt must not ride on the @claude path — hence two jobs.
#
# Which reviewer runs (repo variable PR_REVIEWER, Settings → Secrets and variables
# → Actions → Variables):
#   - unset or `claude` (default): Claude reviews every PR; Copilot is not asked.
#   - `copilot`: the Claude review steps aside and Copilot is requested instead,
#     for when the Claude weekly limit is used up. Flip it back to `claude` after.
# The @claude respond job ignores the switch: a person asked for it by name.
#
# Auth (one is enough; the subscription token wins when both are set):
#   - CLAUDE_CODE_OAUTH_TOKEN: Claude subscription token (`claude setup-token`).
#     Reviews count against the subscription's usage limits, not API billing.
#   - ANTHROPIC_API_KEY: pay-as-you-go API key, used only without the token.
# With neither, both jobs skip with a ::warning:: rather than a silent pass.
#
# @see .github/claude-review/security-charter.md - the review charter
# @see CLAUDE.md - Project conventions and architecture decisions

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Concurrency is scoped by EVENT as well as PR number. Without the event in the
# group, a bot comment on a PR fires `issue_comment` ~seconds after a push's
# `pull_request` run starts; both landed in the same group and cancel-in-progress
# meant the comment run CANCELLED the real review run (which then showed red on
# the PR while never running a review). The comment run itself skips (no @claude),
# so nothing reviewed. Separating groups by event lets a push's review complete
# green while still de-duping rapid pushes within the pull_request group.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    timeout-minutes: 30 # [Claude] ceiling: no recent completed run to measure; generous on purpose
    name: "Claude PR Review"
    # pull_request only. Without this the job also starts on every PR comment,
    # and with a prompt set the action runs a full review there too (spend on
    # every comment). The @claude `respond` job is the only comment consumer.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true  # Advisory — cancellation via concurrency group must not block PRs
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Pick reviewer and check auth
        id: check-key
        env:
          PR_REVIEWER: ${{ vars.PR_REVIEWER || 'claude' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          case "$PR_REVIEWER" in
            copilot)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "copilot=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Reviewer is Copilot::PR_REVIEWER=copilot — Claude review skipped; Copilot is the reviewer for this PR."
              exit 0 ;;
            claude) ;;
            *) echo "::warning title=Unknown PR_REVIEWER::'$PR_REVIEWER' is not claude or copilot — using claude." ;;
          esac
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # warning, not notice: a skipped reviewer must be visible on the PR,
            # not read as a passed review (OSE-1400).
            echo "::warning title=Claude security review NOT run::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is configured — this PR was not security-reviewed by Claude."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Copilot mode: ask Copilot once per PR (opened/reopened), not on every
      # push, so a busy PR does not spend a Copilot review per commit. Best
      # effort: if GitHub refuses the request from this token, say how to ask
      # by hand instead of failing the PR.
      - name: Request Copilot review
        if: steps.check-key.outputs.copilot == 'true' && github.event_name == 'pull_request' && github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR}/requested_reviewers" \
               -f 'reviewers[]=copilot-pull-request-reviewer[bot]' > /dev/null; then
            echo "::notice title=Request Copilot by hand::GitHub did not accept the request from Actions. On the PR, open Reviewers and pick Copilot."
          fi

      # Sweep 9 #6 (2026-05-14): shallow checkout — the review works from the PR
      # diff (gh pr diff), not the repo history. No stored token: the repo is
      # public, so the base-branch `git fetch origin` below needs none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        if: steps.check-key.outputs.skip != 'true'

      # The charter is read from the BASE branch, never the PR head: a PR must
      # not be able to rewrite its own reviewer's instructions.
      - name: Load security charter from base branch
        id: charter
        if: steps.check-key.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          CHARTER: .github/claude-review/security-charter.md
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if ! git show "origin/${BASE_REF}:${CHARTER}" > "$RUNNER_TEMP/charter.md" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Claude security review NOT run::${CHARTER} is not on ${BASE_REF} yet — no charter to review against."
            exit 0
          fi
          delim="CHARTER_$(openssl rand -hex 16)"
          {
            echo "text<<${delim}"
            cat "$RUNNER_TEMP/charter.md"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Same rule as the charter, applied to what Claude Code loads by itself:
      # AGENTS.md, CLAUDE.md (and anything it imports) and .claude/ (skills,
      # agents, settings, hooks) come from the BASE branch, so a PR cannot
      # rewrite its own reviewer's instructions or add a hook that runs in this
      # job. The PR's changes to them are still reviewed through the diff.
      - name: Reviewer instructions from base branch
        if: steps.check-key.outputs.skip != 'true' && steps.charter.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf .claude AGENTS.md CLAUDE.md workers/oursharedevents/CLAUDE.md
          for p in .claude AGENTS.md CLAUDE.md workers/oursharedevents/CLAUDE.md; do
            if [ -n "$(git ls-tree --name-only "origin/${BASE_REF}" -- "${p}")" ]; then
              git checkout "origin/${BASE_REF}" -- "${p}"
            fi
          done
          echo "Instructions in use (from origin/${BASE_REF}):"
          ls -d .claude AGENTS.md CLAUDE.md 2>/dev/null || true

      # PR risk picks the reviewer model: fixed path rules in
      # scripts/ci/pr-risk.mjs, no model involved. low (docs and notes only) ->
      # Haiku, normal -> Sonnet, high (migrations, auth, PII, the under-5 floor,
      # CI and gates, agent governance, dependencies) -> Opus. These steps are
      # written so they cannot fail (every command has a fallback) and so need no
      # continue-on-error: a failure leaves the normal reviewer, never no review.
      - name: List changed files
        id: files
        if: steps.check-key.outputs.skip != 'true' && steps.charter.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ runner.temp }}/changed.txt
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename' > "$CHANGED"; then
            : > "$CHANGED"
            echo "::warning title=Changed files not listed::the PR file list could not be read; the normal reviewer will be used."
          fi
          echo "changed files: $(wc -l < "$CHANGED")"

      # The classifier is the BASE branch's copy, so a PR cannot edit the rules
      # to rate itself low. The model name comes from the case statement below,
      # never from the script's output, so nothing a script prints can reach
      # the reviewer's command line.
      - name: Classify PR risk
        id: risk
        if: steps.check-key.outputs.skip != 'true' && steps.charter.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGED: ${{ runner.temp }}/changed.txt
          WORK: ${{ runner.temp }}/base-pr-risk
        run: |
          risk=normal
          blob="$(git ls-tree "origin/${BASE_REF}" -- scripts/ci/pr-risk.mjs 2>/dev/null | awk '{print $3}' || true)"
          if [ -n "$blob" ] && [ -s "$CHANGED" ] && mkdir -p "$WORK/scripts/ci" && git cat-file blob "$blob" > "$WORK/scripts/ci/pr-risk.mjs"; then
            if json="$(node "$WORK/scripts/ci/pr-risk.mjs" --files "$CHANGED")"; then
              risk="$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).risk))}catch{}})' || true)"
            fi
          else
            echo "::warning title=PR risk not classified::no classifier on ${BASE_REF} or no changed-file list; using the normal reviewer."
          fi
          case "$risk" in
            low) model=claude-haiku-5-5 ;;
            high) model=claude-opus-5-5 ;;
            *) risk=normal; model=claude-sonnet-5-5 ;;
          esac
          echo "risk=${risk}" >> "$GITHUB_OUTPUT"
          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "::notice title=PR risk: ${risk}::reviewer model ${model}"

      - name: Label PR risk
        if: steps.risk.outputs.risk != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RISK: ${{ steps.risk.outputs.risk }}
        run: |
          gh label create "risk:low" --color 0e8a16 --description "Docs and notes only (pr-risk.mjs)" 2>/dev/null || true
          gh label create "risk:normal" --color fbca04 --description "Application code or tests (pr-risk.mjs)" 2>/dev/null || true
          gh label create "risk:high" --color d93f0b --description "Sensitive paths: needs the deep review (pr-risk.mjs)" 2>/dev/null || true
          for r in low normal high; do
            if [ "$r" != "$RISK" ]; then gh pr edit "$PR" --remove-label "risk:${r}" 2>/dev/null || true; fi
          done
          gh pr edit "$PR" --add-label "risk:${RISK}" || echo "::warning title=Risk label not set::could not label the PR risk:${RISK}."

      # SHA-pinned (supply-chain): a mutable @v1 tag can be force-pushed to run
      # attacker code with this job's Claude credentials + write scopes. Bump via Dependabot.
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        if: steps.check-key.outputs.skip != 'true' && steps.charter.outputs.skip != 'true'
        continue-on-error: true # Advisory — API failures must not block PRs
        with:
          # Subscription first; the API key is passed only when no token is set,
          # so a configured subscription is never silently bypassed for billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read the change with `gh pr diff ${{ github.event.pull_request.number }}` and
            `gh pr view ${{ github.event.pull_request.number }}`, then review it against the
            charter below.

            ${{ steps.charter.outputs.text }}
          # Model via claude_args (v1 has no `model` input), chosen by the
          # "Classify PR risk" step; Sonnet when that step did not run.
          # --max-turns bounds spend per PR.
          claude_args: |
            --model ${{ steps.risk.outputs.model || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  respond:
    name: 'Claude @mention'
    # TRUSTED-ACTOR-GATED (author_association ∈ OWNER/MEMBER/COLLABORATOR) —
    # comment bodies are fed to an LLM agent that runs with the Claude credentials and
    # pull-requests/issues write. Without the gate, any commenter could trigger
    # it: prompt-injection + API-spend DoS. Mirrors the gate in ourWKRP's
    # claude.yml (best-of-both CI sync flowing WKRP→OSE).
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true # Advisory — API failures must not block PRs
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Check auth
        id: check-key
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Claude not run::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is configured — @claude cannot respond."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        if: steps.check-key.outputs.skip != 'true'

      # No `prompt`: tag mode answers the @claude comment itself.
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        if: steps.check-key.outputs.skip != 'true'
        continue-on-error: true
        with:
          # Subscription first; the API key is passed only when no token is set,
          # so a configured subscription is never silently bypassed for billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
