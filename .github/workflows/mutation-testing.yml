# Mutation testing (StrykerJS) — OSE-1186 G1, the "teeth-check" on the pyramid.
#
# WHY A SEPARATE NIGHTLY JOB (not a per-PR gate)
# Mutation testing re-runs the covered specs once per mutant. Even on the fast
# node vitest project (the covenant guards are pure logic — see stryker.conf.mjs)
# that is minutes of work: it would tax every PR for a signal that changes slowly.
# Idle hours are the right home. A drop below the break threshold (95%, mirroring
# the CCR artifact standard) fails the run loudly for a human to read.
#
# WHAT IT PROVES
# The integrity guards catch *skipped* tests; they cannot see a *hollow* one — a
# green assertion with no teeth. A surviving mutant in count-floor.ts (Invariant
# #8, K-anon floor) or report-depth.ts (Invariant #5, tier-equity depth omission)
# means the pyramid defending that covenant invariant is hollow. Break below 95%
# so a real hollow spot fails, not quietly. OSE-1273 extended the targets to the
# PII-scrub crypto (pii.ts); OSE-1278 to the admin auth guard (src/auth/admin.ts,
# G1 authZ mutation) — a survived mutant there means the authZ boundary is hollow.
#
# WHAT IT DOES NOT DO
# Never merges, never pushes — rail R5, "merges stay human-gated." A failure
# leaves the HTML report as an artifact and a red run.
name: Mutation testing (covenant guards)

on:
  schedule:
    # 08:40 UTC — clear of overnight-fuzz (07:00) and the 08:00 jobs.
    - cron: '40 8 * * *'
  workflow_dispatch:
  # No `paths:` filter on pull_request or push (owner 2026-11-09: the mutation
  # checks are to be required on `main`). A required check whose workflow does
  # not start leaves the pull request waiting on it for good, so this workflow
  # starts on every pull request and both jobs always report. Whether a change
  # needs the run is decided inside each job, by scripts/ci/mutation-paths.mjs:
  # the list that used to be written here twice, with its reasons, moved there.
  # A change that touches nothing on the list passes in seconds without running
  # Stryker, and says so in the job summary. The run itself is six jobs side by
  # side on the node project: the main pass cut into five groups by cost
  # (workers/oursharedevents/mutation-groups.mjs), and the language layer's pass
  # (stryker.language.conf.mjs). If you add a mutate target in stryker.conf.mjs,
  # give it a group in mutation-groups.mjs (the config refuses a target with
  # none); in either config, add its source and specs to that list;
  # tests/unit/ci/mutation-paths.test.js fails on a mutated or floored file the
  # list lacks.
  pull_request:
  # OSE-1801 (CCR 2026-11-04 S-2): the same decision on a push to main, so a PR
  # that merged before its mutation run finished is still measured on main, not
  # only at 08:40 the next day. The nightly and workflow_dispatch always run.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-ref + per-event so PR runs don't serialize against each other or the
  # nightly. Cancel superseded PR runs (a newer push obsoletes the older); never
  # cancel the nightly/dispatch.
  group: mutation-testing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per group, side by side. The main pass ran 17 to 25 minutes as one
  # job and its limit cut it off (PR 1189); cut by measured cost, the slowest
  # group is about a third of that. Each group runs only the specs whose imports
  # reach its files (vitest.mutation.config.mts): no other spec can kill its
  # mutants, and static mutants, which rerun every spec in the project, are most
  # of the time. The language pass is the sixth group, as it was the second pass.
  mutation-group:
    name: mutation (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # 15: about twice the slowest group, for a slow runner.
    timeout-minutes: 15
    strategy:
      # Every group reports, so one red group does not hide another's result.
      fail-fast: false
      matrix:
        include:
          - group: map
            script: test:mutation
          - group: landing
            script: test:mutation
          - group: guards
            script: test:mutation
          - group: render
            script: test:mutation
          - group: forms
            script: test:mutation
          - group: language
            script: test:mutation:language
    defaults:
      run:
        working-directory: workers/oursharedevents
    # No job-level `if:` and no `needs:`, so every group starts on every pull
    # request; the required check is `mutation` below, which waits for all six.
    steps:
      - uses: actions/checkout@v4
        with:
          # 2, not the default 1: the scope step reads a pull request's changes as
          # the merge commit against its first parent (HEAD^1).
          fetch-depth: 2

      # Decides whether this change needs the run (scripts/ci/mutation-paths.mjs).
      # FAIL CLOSED: every step below runs unless this step said `run=false`,
      # and it says that only when it read the changed files and none is on the
      # list. If the list cannot be read (git fails, the checkout is not the
      # merge commit, the push has no before sha) it says `run=true`; if this
      # step prints nothing the steps still run; if it fails, the job is red.
      # The nightly and workflow_dispatch always get `run=true`.
      - name: Does this change need a mutation run?
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          MUTATION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/mutation-paths.mjs

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run != 'false'
        with:
          # StrykerJS 10 requires Node >= 22 (the rest of CI runs on 20; this job
          # is isolated). A lower version fails fast in stryker-cli's engine guard.
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oursharedevents/package-lock.json

      - name: Stage pinned hub packages (@ocr/ui required, @ocr/flags) @ .ocr-hub-ref
        if: steps.scope.outputs.run != 'false'
        # ADR-008 Phase 0: this job installs/builds/tests the Worker, which
        # bundles @ocr/ui from the hub commit pinned in .ocr-hub-ref. REQUIRED —
        # never continue-on-error: npm ci would succeed with a dangling @ocr/ui
        # link and the failure would surface later as an unresolvable import.
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
          OCR_HUB_READ: ${{ secrets.OCR_HUB_READ }}
        run: bash scripts/ci-stage-ocr-workspace.sh

      - run: npm ci
        if: steps.scope.outputs.run != 'false'

      # The five main groups pick their targets and specs from MUTATION_GROUP
      # (stryker.conf.mjs, vitest.mutation.config.mts); the language pass has its
      # own config and reads it as "not a main group". An unknown name fails.
      - name: Run Stryker on this group
        if: steps.scope.outputs.run != 'false'
        env:
          MUTATION_GROUP: ${{ matrix.group }}
        run: npm run ${{ matrix.script }}

      - name: Upload this group's report
        if: always() && steps.scope.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-group-${{ matrix.group }}
          path: workers/oursharedevents/reports/mutation-${{ matrix.group }}/**
          # 14 days, not 30: the reports hold source and test names only, and
          # the nightly makes a fresh one every day. Keep no more than is read.
          retention-days: 14
          if-no-files-found: error

  # The required check. It waits for every group, fails if any group did not
  # succeed, then scores every file against its own floor over all six reports
  # (mutation-file-floor.mjs refuses a file missing from them, or in two).
  mutation:
    needs: mutation-group
    # always(): it reports even when a group failed, was cancelled or timed out,
    # and then it is red. The branch-protection contract counts `if: always()`
    # behind a job that always starts as a check that always reports.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # First and unconditional: a change that needs no run still fails here if
      # a group job broke, because a group that decides "no run" succeeds.
      - name: Every group succeeded
        env:
          GROUPS_RESULT: ${{ needs.mutation-group.result }}
        run: |
          if [ "$GROUPS_RESULT" != "success" ]; then
            echo "::error title=Mutation groups::the group jobs ended $GROUPS_RESULT, not success. Read the red group above."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The same decision the groups made, so this job knows whether reports exist.
      - name: Does this change need a mutation run?
        id: scope
        env:
          MUTATION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/mutation-paths.mjs

      - name: Download every group's report
        if: steps.scope.outputs.run != 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-group-*
          path: reports

      - name: Per-file mutation floor
        if: steps.scope.outputs.run != 'false'
        # The break threshold in stryker.conf.mjs is per run; this fails when any
        # one guard file is under its own floor (admin.ts: 100%). OSE-1801, CCR S-2.
        # All six reports: a floored file missing from all, or in two, fails.
        run: node scripts/ci/mutation-file-floor.mjs reports/mutation-group-map/mutation.json reports/mutation-group-landing/mutation.json reports/mutation-group-guards/mutation.json reports/mutation-group-render/mutation.json reports/mutation-group-forms/mutation.json reports/mutation-group-language/mutation.json

  # OSE-1695 — mutation testing of the CI security rules in scripts/ci (repository root, not the
  # Worker). A surviving mutant in branch-push-secret-exposure.mjs means the test that keeps
  # secrets off branch pushes is hollow. Same 95% bar; the rule currently scores 100%.
  #
  # Needs no secret and no root install: the rule and its test use only Node, Vitest and js-yaml.
  # StrykerJS, Vitest and js-yaml go into one separate folder (exact versions: Stryker as in the
  # Worker lockfile, Vitest and js-yaml as in the root lockfile) and node_modules is linked to it.
  # --legacy-peer-deps: npm 10.9 (bundled with Node 22) crashes with "Cannot read properties of null
  # (reading 'edgesOut')" resolving this package set, even in an empty folder. Every peer is listed
  # explicitly, so skipping peer resolution loses nothing. Reproduced and checked with npm 10.9.2.
  mutation-ci-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No job-level `if:` and no `needs:`, for the same reason as the job above.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 2: the scope step reads HEAD^1, as in the job above.
          fetch-depth: 2

      # Decides whether this change needs the run (scripts/ci/mutation-paths.mjs).
      # FAIL CLOSED: every step below runs unless this step said `run=false`,
      # and it says that only when it read the changed files and none is on the
      # list. If the list cannot be read (git fails, the checkout is not the
      # merge commit, the push has no before sha) it says `run=true`; if this
      # step prints nothing the steps still run; if it fails, the job is red.
      # The nightly and workflow_dispatch always get `run=true`.
      - name: Does this change need a mutation run?
        id: scope
        env:
          MUTATION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/mutation-paths.mjs

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run != 'false'
        with:
          node-version: 22

      - name: Install StrykerJS, Vitest and js-yaml into a separate folder
        if: steps.scope.outputs.run != 'false'
        run: npm install --prefix "$RUNNER_TEMP/stryker" --legacy-peer-deps --no-audit --no-fund --ignore-scripts @stryker-mutator/core@10.0.0 @stryker-mutator/vitest-runner@10.0.0 vitest@4.1.11 js-yaml@4.3.2

      - name: Link node_modules to it
        if: steps.scope.outputs.run != 'false'
        run: ln -s "$RUNNER_TEMP/stryker/node_modules" node_modules

      - name: Run Stryker on the CI security rules
        if: steps.scope.outputs.run != 'false'
        run: node node_modules/@stryker-mutator/core/bin/stryker.js run stryker.ci-scripts.conf.mjs

      - name: Upload mutation report
        if: always() && steps.scope.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-ci-scripts
          path: reports/mutation-ci-scripts/**
          retention-days: 30
          if-no-files-found: warn
