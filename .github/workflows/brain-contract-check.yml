name: Brain contract check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

# bash is the default shell on ubuntu-latest; kept explicit so every `run:`
# step is unambiguous (and portable if this job is ever moved to a matrix).
defaults:
  run:
    shell: bash

jobs:
  contract-check:
    name: Validate against OCR-docs brain
    # ubuntu-latest, not self-hosted: this job is pure Python + bash + github-script
    # with no Windows/self-hosted dependency. On the shared self-hosted box the
    # `python3 -m pip install` below intermittently landed in a different interpreter
    # than the one run_all.py spawns levels under (`sys.executable`), so the sole
    # `packaging`-importing level (Level 4) failed to import it and the check went
    # red on unrelated PRs (green→red across #430/#431/#432 on identical brain
    # content). Ephemeral ubuntu gives one interpreter and kills that flake class.
    # See OSE-1155; consistent with OSE-1017 (S0/S2) and OSE-953/#104 (brain repo).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7
        with:
          path: ose

      - name: Checkout OCR-docs brain (read-only)
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          token: ${{ secrets.OCR_PROPAGATE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        # `python3 -m pip` pins the install to the same interpreter run_all.py spawns
        # levels under (`sys.executable`). On ubuntu-latest that is unambiguous; the
        # form is kept as belt-and-suspenders so a stray `python3` never diverges
        # from the install target (the divergence that produced OSE-1155 / the older
        # ruamel.yaml "ERROR: ruamel.yaml is required" failure on self-hosted).
        run: python3 -m pip install pyyaml packaging "ruamel.yaml>=0.18"

      - name: Run brain test pyramid
        id: brain-pyramid
        working-directory: ocr-docs/ocr-docs-brain
        run: python3 tests/run_all.py

      - name: Validate invariants registry (structural integrity gate)
        working-directory: ocr-docs/ocr-docs-brain
        run: python3 scripts/invariant.py validate

      - name: Invariant #22 — cross-repo import isolation gate (OCR-ENF-23)
        working-directory: ${{ github.workspace }}/ose
        run: bash scripts/check-cross-repo-imports.sh .

      - name: Run OSE contract conformance
        id: conformance
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_brain_contract.py \
            --brain ocr-docs/ocr-docs-brain \
            --repo ose \
            --product-id ose \
            --report-path conformance-report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

      - name: Open Linear ticket on drift
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/open_drift_ticket.py \
            --report conformance-report.json \
            --repo "$REPO_NAME" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-author "$PR_AUTHOR" \
            --commit "$COMMIT_SHA"

      - name: Comment on PR with drift summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('conformance-report.json', 'utf8'));
            } catch (e) {
              report = { failures: [{ check: 'report missing', detail: e.message }] };
            }
            const failures = report.failures || [];
            const body = [
              '### Brain contract check failed',
              '',
              'The OSE code drifted from the OCR-docs governance brain.',
              '',
              `Failures: **${failures.length}**`,
              '',
              ...failures.slice(0, 10).map(f => `- \`${f.check}\` — ${f.detail}`),
              failures.length > 10 ? `- ... and ${failures.length - 10} more` : '',
              '',
              'A Linear ticket has been opened. Resolve the drift or update the brain via a PR to `ourCommunityRituals/OCR-docs`.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
