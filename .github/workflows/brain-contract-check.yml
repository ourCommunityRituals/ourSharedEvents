name: Brain contract check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

# Read only. contract-check runs this repo's scripts, which get its token
# (OSE-1466 0.6). Only report-drift, which runs none of the PR's code, may
# comment.
permissions:
  contents: read

# bash is already the default on ubuntu-latest; kept explicit so a future
# runner change cannot silently switch these steps to another shell.
defaults:
  run:
    shell: bash

jobs:
  contract-check:
    name: Validate against OCR-docs brain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout OSE
        uses: actions/checkout@v7
        with:
          path: ose

      - name: Checkout OCR-docs brain (read-only)
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ }}
          # ADR-012 0.1: never leave the token where later steps can read it.
          persist-credentials: false

      # OSE-1466 0.1, run time: the steps below run PR code, so prove the
      # checkout above left no credential on disk.
      - name: 'No token left behind by the brain checkout'
        working-directory: ${{ github.workspace }}
        run: bash ose/scripts/ci/assert-no-persisted-token.sh ocr-docs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        # `python3 -m pip` (not bare `pip`) installs into the SAME interpreter the
        # scripts run under. On the self-hosted box those two resolved to different
        # Pythons intermittently, so ruamel.yaml landed where invariant.py could not
        # import it. That failed the pyramid BEFORE the conformance step ever wrote
        # conformance-report.json, and the failure handler then reported the missing
        # report -- naming the handler, not the fault. Observed 2026-09-01 on #431
        # and #432; a re-run of #432 on the identical commit went green with no code
        # change, which is what made it a runner-environment fault rather than drift.
        #
        # ubuntu-latest removes the cause: setup-python owns the only interpreter and
        # every run starts from a clean VM. The verify step keeps the diagnosis honest
        # if it ever regresses -- it fails HERE, where the install is, instead of
        # three steps later as a missing file.
        run: |
          python3 -m pip install pyyaml packaging "ruamel.yaml>=0.18"
          python3 -c 'import ruamel.yaml, yaml, packaging' \
            || { echo "::error::brain deps missing from the python3 env"; exit 1; }

      - name: Run brain test pyramid
        id: brain-pyramid
        working-directory: ocr-docs/ocr-docs-brain
        run: python3 tests/run_all.py

      - name: Validate invariants registry (structural integrity gate)
        working-directory: ocr-docs/ocr-docs-brain
        run: python3 scripts/invariant.py validate

      # OSE-1604: join every brain invariant's `test_file` to this repo. A named
      # test that does not exist fails (unless baselined with a reason, ratchet
      # only shrinks), and the 0-architecture README gate index must match the
      # YAML + directory (generated, never hand-written).
      - name: Invariant registry reconciliation (test_file exists, gate index generated)
        working-directory: ${{ github.workspace }}/ose
        run: python3 scripts/check-invariant-registry.py --brain ../ocr-docs/ocr-docs-brain

      # Owner 2026-10-22: the documents agree. Every [#n] tag in AGENTS.md names
      # a live or partial brain invariant, every owner decision carries a tag, and
      # every OCR-docs path AGENTS.md cites exists in the fresh checkout above.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: AGENTS.md agrees with the brain (ids exist, decisions tagged, cited paths exist)
        working-directory: ${{ github.workspace }}/ose
        run: node scripts/ci/check-agents-sync.mjs AGENTS.md ../ocr-docs/ocr-docs-brain/architectural-invariants.yaml --ocr-docs ../ocr-docs

      # Invariant #22 (OCR-ENF-23) is enforced by the canonical, live-read brain
      # guard (OCR-docs check_cross_repo_imports.py, #22 enforcement_kind:
      # brain_script). One reviewed brain edit re-arms/disarms the fleet. The
      # legacy OSE-local check-cross-repo-imports.sh was retired in this PR now
      # that the brain PR is on main.
      - name: Invariant #22 — cross-repo isolation gate (live-read brain guard, OSE-1288)
        working-directory: ${{ github.workspace }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_cross_repo_imports.py \
            --repo ose --product-id ose --brain ocr-docs/ocr-docs-brain

      - name: Run OSE contract conformance
        id: conformance
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/check_brain_contract.py \
            --brain ocr-docs/ocr-docs-brain \
            --repo ose \
            --product-id ose \
            --report-path conformance-report.json

      - name: Make sure there is a report to upload
        # If an earlier step failed, the conformance step never ran and there is
        # no file. report-drift downloads this artifact, so give it one that says
        # so, in the shape the drift comment reads.
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f conformance-report.json ]; then
            echo '{"failures":[{"check":"report missing","detail":"the check stopped before it wrote a conformance report"}]}' > conformance-report.json
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

  # Reporting is its own job so the token that can comment never sits in the job
  # that runs this repo's scripts. It runs only when the check above failed on a
  # pull request. It uses the brain's scripts and the base branch's copy of the
  # one script it needs from this repo, never the pull request's code.
  report-drift:
    name: Report brain drift
    needs: [contract-check]
    if: ${{ always() && needs.contract-check.result == 'failure' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout OSE at the base commit (for the token check script only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: ose-base
          persist-credentials: false

      - name: Checkout OCR-docs brain (read-only)
        uses: actions/checkout@v7
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ }}
          # ADR-012 0.1: never leave the token where later steps can read it.
          persist-credentials: false

      - name: 'No token left behind by the brain checkout'
        working-directory: ${{ github.workspace }}
        run: bash ose-base/scripts/ci/assert-no-persisted-token.sh ocr-docs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download conformance report
        # Always present: the check job writes a placeholder when it stopped
        # before the conformance step.
        uses: actions/download-artifact@v4
        with:
          name: conformance-report

      - name: Open Linear ticket on drift
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 ocr-docs/ocr-docs-brain/scripts/open_drift_ticket.py \
            --report conformance-report.json \
            --repo "$REPO_NAME" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-author "$PR_AUTHOR" \
            --commit "$COMMIT_SHA"

      - name: Comment on PR with drift summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('conformance-report.json', 'utf8'));
            } catch (e) {
              report = { failures: [{ check: 'report missing', detail: e.message }] };
            }
            const failures = report.failures || [];
            const body = [
              '### Brain contract check failed',
              '',
              'The OSE code drifted from the OCR-docs governance brain.',
              '',
              `Failures: **${failures.length}**`,
              '',
              ...failures.slice(0, 10).map(f => `- \`${f.check}\` — ${f.detail}`),
              failures.length > 10 ? `- ... and ${failures.length - 10} more` : '',
              '',
              'A Linear ticket has been opened. Resolve the drift or update the brain via a PR to `ourCommunityRituals/OCR-docs`.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
