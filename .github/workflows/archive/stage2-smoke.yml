# Stage-2 Smoke Tests: Post-Deploy Validation & Production Gate
#
# EPIC 5 - Story 5.1: Stage-2 Post-Deploy Smoke + Synthetic (Staging -> Prod gate)
#
# Purpose / Value:
#   Automatically verify staging after deploy and gate promotion to production.
#   Ensures no promotion to prod if staging is not healthy.
#
# Flow:
#   1. Triggered by Stage-1 CI success (workflow_run) OR manual dispatch
#   2. Hit staging endpoints:
#      - /api/status (API health)
#      - /api/events (API data)
#      - /admin smoke (Playwright UI)
#      - /public?event=<testEvent> (Playwright UI)
#      - /display?event=<testEvent> (Playwright UI)
#      - /poster?event=<testEvent> (Playwright UI)
#   3. (Optional) Trigger Datadog synthetic checks
#   4. On full pass:
#      - If auto_promote=true: deploy directly to production
#      - Otherwise: Raise manual approval gate in GitHub
#      - On approval: deploy to production
#
# Acceptance Criteria:
#   - Clear pass/fail indicator for the whole system
#   - No promotion to prod if staging is not healthy
#   - Optional auto-promote to production after smoke tests pass
#
# Negative Paths:
#   - If Stage-2 fails:
#     - Staging stays with new build (for debugging)
#     - Production remains untouched (safe)
#     - Optional rollback to previous staging version
#
# Rollback:
#   - Staging: npm run rollback:staging
#   - Production: npm run rollback:prod
#   - See: docs/ROLLBACK.md
#
# Required Secrets:
#   - CLOUDFLARE_API_TOKEN_OSE: For production deployment (wrangler deploy --env production)
#   - DATADOG_API_KEY: (Optional) For synthetic test triggers
#   - DATADOG_APP_KEY: (Optional) For synthetic test triggers

name: Stage-2 Smoke Tests

on:
  workflow_run:
    workflows:
      - "Stage-1 CI"
    types:
      - completed
  workflow_dispatch:
    inputs:
      auto_promote:
        description: 'Auto-promote to production if smoke tests pass (skip approval gate)'
        required: false
        default: 'false'
        type: boolean
      rollback_on_failure:
        description: 'Rollback staging to previous version if smoke tests fail'
        required: false
        default: 'false'
        type: boolean
      skip_ui_tests:
        description: 'Skip UI smoke tests (API only)'
        required: false
        default: 'false'
        type: boolean

# Prevent duplicate runs for the same deployment
concurrency:
  group: stage2-smoke-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  STG_BASE_URL: 'https://stg.oursharedevents.com'
  PROD_BASE_URL: 'https://oursharedevents.com'
  # Test event for UI smoke tests (use a known stable test event)
  TEST_EVENT_TAG: 'smoke-test-event'

jobs:
  # ==========================================================================
  # GATE CHECK: Verify Stage-1 succeeded or manual dispatch
  # ==========================================================================
  check-stage1:
    name: Check Stage-1 Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      conclusion: ${{ steps.check.outputs.conclusion }}
      auto_promote: ${{ steps.check.outputs.auto_promote }}
      rollback_on_failure: ${{ steps.check.outputs.rollback_on_failure }}
      skip_ui_tests: ${{ steps.check.outputs.skip_ui_tests }}

    steps:
      - name: Check Stage-1 conclusion
        id: check
        run: |
          # Handle manual dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual dispatch - proceeding with Stage-2 smoke tests"
            echo "conclusion=manual" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "auto_promote=${{ github.event.inputs.auto_promote }}" >> $GITHUB_OUTPUT
            echo "rollback_on_failure=${{ github.event.inputs.rollback_on_failure }}" >> $GITHUB_OUTPUT
            echo "skip_ui_tests=${{ github.event.inputs.skip_ui_tests }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Handle workflow_run trigger
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          TRIGGER_EVENT="${{ github.event.workflow_run.event }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "Stage-1 CI conclusion: $CONCLUSION"
          echo "Stage-1 trigger event: $TRIGGER_EVENT"
          echo "Stage-1 head branch: $HEAD_BRANCH"
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "auto_promote=false" >> $GITHUB_OUTPUT
          echo "rollback_on_failure=false" >> $GITHUB_OUTPUT
          echo "skip_ui_tests=false" >> $GITHUB_OUTPUT

          # Stage-2 should only run if:
          # 1. Stage-1 succeeded AND
          # 2. Stage-1 was triggered by a push to main (actual deployment)
          #
          # On PRs, Stage-1 validates but does NOT deploy, so Stage-2 should skip.
          if [ "$CONCLUSION" != "success" ]; then
            echo "::warning::Stage-1 CI did not succeed (conclusion: $CONCLUSION)"
            echo "Stage-2 smoke tests skipped"
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [ "$TRIGGER_EVENT" != "push" ]; then
            echo "::notice::Stage-1 was triggered by '$TRIGGER_EVENT' (not push) - no deployment occurred"
            echo "Stage-2 smoke tests skipped (staging not updated)"
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [ "$HEAD_BRANCH" != "main" ]; then
            echo "::notice::Stage-1 ran on branch '$HEAD_BRANCH' (not main) - deployment may not have occurred"
            echo "Stage-2 smoke tests skipped"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Stage-1 CI succeeded with push to main - proceeding with Stage-2 smoke tests"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Create skip summary
        if: steps.check.outputs.should_run != 'true'
        run: |
          echo "## Stage-2 Smoke Tests - Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Stage-2 only runs after Stage-1 deploys to staging (push to main)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage-1 Conclusion** | \`${{ github.event.workflow_run.conclusion }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event.workflow_run.event }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.event.workflow_run.head_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | \`${{ github.event.workflow_run.id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Why skipped?** Stage-2 smoke tests require an actual deployment to staging." >> $GITHUB_STEP_SUMMARY
          echo "PRs validate code but don't deploy. Merge to main to trigger deployment + smoke tests." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PRE-FLIGHT: Quick health check before full test suite
  # ==========================================================================
  preflight-check:
    name: Pre-Flight Health Check
    runs-on: ubuntu-latest
    needs: check-stage1
    if: needs.check-stage1.outputs.should_run == 'true'
    outputs:
      api_healthy: ${{ steps.health.outputs.api_healthy }}
      backend_healthy: ${{ steps.backend-health.outputs.backend_healthy }}

    steps:
      - name: Check /api/status
        id: health
        run: |
          echo "=============================================="
          echo "PRE-FLIGHT: Checking staging health"
          echo "=============================================="
          echo "Target: ${{ env.STG_BASE_URL }}/api/status"
          echo ""

          # Allow staging to warm up after deploy
          sleep 15

          HTTP_CODE=$(curl -s -o /tmp/status.json -w "%{http_code}" \
            --connect-timeout 30 \
            --max-time 60 \
            "${{ env.STG_BASE_URL }}/api/status" 2>&1) || HTTP_CODE="000"

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            OK_VALUE=$(jq -r '.ok // "null"' /tmp/status.json 2>/dev/null || echo "null")
            if [ "$OK_VALUE" = "true" ]; then
              echo "api_healthy=true" >> $GITHUB_OUTPUT
              echo ""
              echo "=============================================="
              echo "PRE-FLIGHT PASSED: Staging is healthy"
              echo "=============================================="
            else
              echo "api_healthy=false" >> $GITHUB_OUTPUT
              echo "::error::/api/status returned ok:$OK_VALUE (expected: true)"
              cat /tmp/status.json
              exit 1
            fi
          else
            echo "api_healthy=false" >> $GITHUB_OUTPUT
            echo "::error::Staging unavailable (HTTP $HTTP_CODE)"
            exit 1
          fi

      # Story B1: Check /api/health/backend for Google auth health
      - name: Check /api/health/backend (Story B1)
        id: backend-health
        run: |
          echo "=============================================="
          echo "STORY B1: Checking backend auth health"
          echo "=============================================="
          echo "Target: ${{ env.STG_BASE_URL }}/api/health/backend"
          echo ""

          HTTP_CODE=$(curl -s -o /tmp/backend-health.json -w "%{http_code}" \
            --connect-timeout 30 \
            --max-time 60 \
            "${{ env.STG_BASE_URL }}/api/health/backend" 2>&1) || HTTP_CODE="000"

          echo "HTTP Status: $HTTP_CODE"

          if [ -f /tmp/backend-health.json ]; then
            echo ""
            echo "Response:"
            cat /tmp/backend-health.json | jq '.' 2>/dev/null || cat /tmp/backend-health.json
            echo ""
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            OK_VALUE=$(jq -r '.ok // "null"' /tmp/backend-health.json 2>/dev/null || echo "null")
            AUTH_SUCCESS=$(jq -r '.auth.tokenMintSuccess // "null"' /tmp/backend-health.json 2>/dev/null || echo "null")

            if [ "$OK_VALUE" = "true" ]; then
              echo "backend_healthy=true" >> $GITHUB_OUTPUT
              echo ""
              echo "=============================================="
              echo "STORY B1 PASSED: Backend auth is healthy"
              echo "  - Token mint: $AUTH_SUCCESS"
              echo "=============================================="
            else
              echo "backend_healthy=false" >> $GITHUB_OUTPUT
              ERROR_CODE=$(jq -r '.code // "unknown"' /tmp/backend-health.json 2>/dev/null || echo "unknown")
              echo "::error::/api/health/backend returned ok:$OK_VALUE, code:$ERROR_CODE"
              exit 1
            fi
          else
            echo "backend_healthy=false" >> $GITHUB_OUTPUT
            ERROR_CODE=$(jq -r '.code // "unknown"' /tmp/backend-health.json 2>/dev/null || echo "unknown")
            echo "::error::Backend auth health check failed (HTTP $HTTP_CODE, code: $ERROR_CODE)"
            exit 1
          fi

      - name: Create preflight summary
        if: always()
        run: |
          echo "## Pre-Flight Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          API_HEALTHY="${{ steps.health.outputs.api_healthy }}"
          BACKEND_HEALTHY="${{ steps.backend-health.outputs.backend_healthy }}"

          echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| /api/status | $( [ \"$API_HEALTHY\" = \"true\" ] && echo '✅ Healthy' || echo '❌ Failed' ) |" >> $GITHUB_STEP_SUMMARY
          echo "| /api/health/backend (Story B1) | $( [ \"$BACKEND_HEALTHY\" = \"true\" ] && echo '✅ Healthy' || echo '❌ Failed' ) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$API_HEALTHY" = "true" ] && [ "$BACKEND_HEALTHY" = "true" ]; then
            echo "### ✅ PASSED" >> $GITHUB_STEP_SUMMARY
            echo "Staging is healthy and backend auth is working. Ready for smoke tests." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ FAILED" >> $GITHUB_STEP_SUMMARY
            if [ "$API_HEALTHY" != "true" ]; then
              echo "- API status check failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "$BACKEND_HEALTHY" != "true" ]; then
              echo "- Backend auth health check failed (Story B1)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Smoke tests will not run." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # STORY C4: CREATE-EVENT SMOKE GATE
  # Stage-2 Gate: Worker auth -> Sheets write -> Sheets read
  # ==========================================================================
  create-event-smoke-gate:
    name: Story C4 - Create Event Smoke Gate
    runs-on: ubuntu-latest
    needs: [check-stage1, preflight-check]
    if: needs.preflight-check.outputs.api_healthy == 'true' && needs.preflight-check.outputs.backend_healthy == 'true'
    outputs:
      create_event_passed: ${{ steps.c4-smoke.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Story C4 Create-Event Smoke Gate
        id: c4-smoke
        env:
          # Story C4: BASE_URL and ADMIN_KEY_STG injected from secrets
          BASE_URL: ${{ env.STG_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY_STG }}
          CI: true
        run: |
          echo "=============================================="
          echo "STORY C4: Create-Event Smoke Gate"
          echo "=============================================="
          echo "Purpose: Prove system works end-to-end"
          echo "  Worker auth -> Sheets write -> Sheets read"
          echo ""
          echo "BASE_URL: $BASE_URL"
          echo "ADMIN_KEY: $([ -n "$ADMIN_KEY" ] && echo '[CONFIGURED]' || echo '[NOT CONFIGURED - TEST WILL FAIL]')"
          echo ""
          echo "Test flow:"
          echo "  1. POST /api/v2/admin/events (create event)"
          echo "  2. GET /api/v2/events (list events)"
          echo "  3. Assert created event appears in list"
          echo ""

          # Story C4: Fail fast if secret not configured
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::ADMIN_KEY_STG secret not configured"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Run the Story C4 create event smoke test
          if npm run test:c4:smoke; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo ""
            echo "=============================================="
            echo "STORY C4 GATE: PASSED"
            echo "=============================================="
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo ""
            echo "=============================================="
            echo "STORY C4 GATE: FAILED"
            echo "=============================================="
            echo "::error::Story C4 create-event smoke test failed"
            exit 1
          fi

      - name: Upload C4 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-smoke-results
          path: |
            playwright-report-c4-smoke/
            .test-results/c4-smoke-results.json
            .test-results/c4-smoke-junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Create Story C4 summary
        if: always()
        run: |
          echo "## Story C4: Create-Event Smoke Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose**: Every staging deploy proves the system works end-to-end:" >> $GITHUB_STEP_SUMMARY
          echo "Worker auth -> Sheets write -> Sheets read" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PASSED="${{ steps.c4-smoke.outputs.passed }}"

          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| POST /api/v2/admin/events | Create event with ADMIN_KEY_STG |" >> $GITHUB_STEP_SUMMARY
          echo "| GET /api/v2/events | List events |" >> $GITHUB_STEP_SUMMARY
          echo "| Assert presence | Verify created event in list |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$PASSED" = "true" ]; then
            echo "### PASSED" >> $GITHUB_STEP_SUMMARY
            echo "Create event smoke test passed. End-to-end flow verified." >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED - Pipeline Blocked" >> $GITHUB_STEP_SUMMARY
            echo "Create event smoke test failed. Check test artifacts for requestId and error details." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # API SMOKE TESTS: /api/status and /api/events
  # ==========================================================================
  api-smoke-tests:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [check-stage1, preflight-check]
    # Story B1: Require both api_healthy AND backend_healthy
    if: needs.preflight-check.outputs.api_healthy == 'true' && needs.preflight-check.outputs.backend_healthy == 'true'
    outputs:
      api_passed: ${{ steps.api-tests.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run API smoke tests
        id: api-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          CI: true
          # Story C1: Pass ADMIN_KEY for authorized endpoint tests
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "=============================================="
          echo "API SMOKE TESTS"
          echo "=============================================="
          echo "Target: $BASE_URL"
          echo ""

          # Run API smoke tests (status, events, etc.)
          if npm run test:api:smoke; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo ""
            echo "=============================================="
            echo "API SMOKE TESTS: PASSED"
            echo "=============================================="
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "::error::API smoke tests failed"
            exit 1
          fi

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-results
          path: |
            playwright-report-smoke/
            .test-results/smoke-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Create API smoke summary
        if: always()
        run: |
          echo "## API Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.api-tests.outputs.passed }}" = "true" ]; then
            echo "### PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All API endpoints validated:" >> $GITHUB_STEP_SUMMARY
            echo "- /api/status" >> $GITHUB_STEP_SUMMARY
            echo "- /api/events" >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED" >> $GITHUB_STEP_SUMMARY
            echo "One or more API smoke tests failed." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # UI SMOKE TESTS: Admin, Public, Display, Poster pages (Playwright)
  # ==========================================================================
  ui-smoke-tests:
    name: UI Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [check-stage1, api-smoke-tests]
    # Run if API passed AND ui tests not skipped
    if: |
      needs.api-smoke-tests.outputs.api_passed == 'true' &&
      needs.check-stage1.outputs.skip_ui_tests != 'true'
    outputs:
      ui_passed: ${{ steps.ui-tests.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run UI smoke tests
        id: ui-tests
        env:
          BASE_URL: ${{ env.STG_BASE_URL }}
          TEST_BRAND: root
          CI: true
        run: |
          echo "=============================================="
          echo "UI SMOKE TESTS (Playwright)"
          echo "=============================================="
          echo "Target: $BASE_URL"
          echo "Brand: $TEST_BRAND"
          echo ""
          echo "Testing surfaces:"
          echo "  - /manage page (Story A2 - origin safety + observability)"
          echo "  - Admin page"
          echo "  - Public page"
          echo "  - Display page"
          echo "  - Poster page"
          echo ""
          echo "/manage tests verify:"
          echo "  - Page loads successfully"
          echo "  - Same-origin API calls only (no GAS direct calls)"
          echo "  - requestId + JSON error body logged on failures"
          echo ""

          # Run UI smoke tests (manage, admin, public, display, poster)
          if npm run test:ui:smoke; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo ""
            echo "=============================================="
            echo "UI SMOKE TESTS: PASSED"
            echo "=============================================="
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "::error::UI smoke tests failed"
            exit 1
          fi

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results
          path: |
            playwright-report-ui-smoke/
            .test-results/ui-smoke-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Create UI smoke summary
        if: always()
        run: |
          echo "## UI Smoke Tests (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.ui-tests.outputs.passed }}" = "true" ]; then
            echo "### PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All UI surfaces validated:" >> $GITHUB_STEP_SUMMARY
            echo "- **\`/manage\` page** (Story A2 - origin safety + observability)" >> $GITHUB_STEP_SUMMARY
            echo "  - Page loads successfully" >> $GITHUB_STEP_SUMMARY
            echo "  - Same-origin API calls only" >> $GITHUB_STEP_SUMMARY
            echo "  - requestId + JSON error body logged on failures" >> $GITHUB_STEP_SUMMARY
            echo "- Admin page (\`/?page=admin\`)" >> $GITHUB_STEP_SUMMARY
            echo "- Public page (\`/?page=public\`)" >> $GITHUB_STEP_SUMMARY
            echo "- Display page (\`/?page=display\`)" >> $GITHUB_STEP_SUMMARY
            echo "- Poster page (\`/?page=poster\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED" >> $GITHUB_STEP_SUMMARY
            echo "One or more UI smoke tests failed." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # SYNTHETIC HEALTH CHECKS: /health/origin + /events (Story 3.2)
  # ==========================================================================
  # Primary synthetic monitoring using local validation script.
  # Validates endpoints before Datadog/external monitoring.
  # Alert routing: helps distinguish upstream config drift vs frontend issues.
  # ==========================================================================
  synthetic-health-checks:
    name: Synthetic Health Checks (Story 3.2)
    runs-on: ubuntu-latest
    needs: [check-stage1, api-smoke-tests]
    if: needs.api-smoke-tests.outputs.api_passed == 'true'
    outputs:
      health_origin_passed: ${{ steps.synthetic.outputs.health_origin_passed }}
      events_passed: ${{ steps.synthetic.outputs.events_passed }}
      all_passed: ${{ steps.synthetic.outputs.all_passed }}
      alert_routing: ${{ steps.synthetic.outputs.alert_routing }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run synthetic health checks
        id: synthetic
        run: |
          echo "=============================================="
          echo "SYNTHETIC HEALTH CHECKS (Story 3.2)"
          echo "=============================================="
          echo "Target: ${{ env.STG_BASE_URL }}"
          echo ""

          # Run synthetic health check script
          RESULT=$(node scripts/synthetic-health-check.js --env staging --json 2>&1) || true

          # Parse results
          HEALTH_ORIGIN=$(echo "$RESULT" | jq -r '.checks[] | select(.name == "/health/origin") | .passed // false')
          EVENTS=$(echo "$RESULT" | jq -r '.checks[] | select(.name == "/events") | .passed // false')
          ALL_PASSED=$(echo "$RESULT" | jq -r '.allPassed // false')
          ALERT_TYPE=$(echo "$RESULT" | jq -r '.alertRouting.type // "UNKNOWN"')
          ALERT_MSG=$(echo "$RESULT" | jq -r '.alertRouting.message // "Unable to determine alert routing"')

          echo ""
          echo "Results:"
          echo "  /health/origin: $HEALTH_ORIGIN"
          echo "  /events: $EVENTS"
          echo "  All passed: $ALL_PASSED"
          echo "  Alert routing: $ALERT_TYPE"
          echo ""

          # Output for downstream jobs
          echo "health_origin_passed=$HEALTH_ORIGIN" >> $GITHUB_OUTPUT
          echo "events_passed=$EVENTS" >> $GITHUB_OUTPUT
          echo "all_passed=$ALL_PASSED" >> $GITHUB_OUTPUT
          echo "alert_routing=$ALERT_TYPE" >> $GITHUB_OUTPUT

          # Display human-readable output
          echo ""
          node scripts/synthetic-health-check.js --env staging || true

          # Exit with appropriate code
          if [ "$ALL_PASSED" = "true" ]; then
            echo ""
            echo "=============================================="
            echo "SYNTHETIC HEALTH CHECKS: PASSED"
            echo "=============================================="
            exit 0
          else
            echo ""
            echo "=============================================="
            echo "SYNTHETIC HEALTH CHECKS: FAILED"
            echo "Alert Type: $ALERT_TYPE"
            echo "Message: $ALERT_MSG"
            echo "=============================================="
            exit 1
          fi

      - name: Create synthetic summary
        if: always()
        run: |
          echo "## Synthetic Health Checks (Story 3.2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          HEALTH_ORIGIN="${{ steps.synthetic.outputs.health_origin_passed }}"
          EVENTS="${{ steps.synthetic.outputs.events_passed }}"
          ALERT_TYPE="${{ steps.synthetic.outputs.alert_routing }}"

          echo "| Endpoint | Status | Assertions |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------------|" >> $GITHUB_STEP_SUMMARY

          if [ "$HEALTH_ORIGIN" = "true" ]; then
            echo "| \`/health/origin\` | PASSED | \`ok === true\`, \`env === \"staging\"\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`/health/origin\` | **FAILED** | \`ok === true\`, \`env === \"staging\"\` |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$EVENTS" = "true" ]; then
            echo "| \`/events\` | PASSED | HTTP 200, \`data-testid=\"events-root\"\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`/events\` | **FAILED** | HTTP 200, \`data-testid=\"events-root\"\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Alert Routing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case "$ALERT_TYPE" in
            "HEALTHY")
              echo "All synthetic checks passing. System is healthy." >> $GITHUB_STEP_SUMMARY
              ;;
            "CONFIG_DRIFT")
              echo "**CONFIG_DRIFT**: \`/health/origin\` fails but \`/events\` passes." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This indicates upstream config issue, not frontend. Check:" >> $GITHUB_STEP_SUMMARY
              echo "- \`UPSTREAM_WEBAPP_URL\` environment variable" >> $GITHUB_STEP_SUMMARY
              echo "- Worker environment configuration" >> $GITHUB_STEP_SUMMARY
              ;;
            "FRONTEND_ISSUE")
              echo "**FRONTEND_ISSUE**: \`/events\` fails but \`/health/origin\` passes." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This indicates frontend/route issue, not upstream origin. Check:" >> $GITHUB_STEP_SUMMARY
              echo "- Worker routing configuration" >> $GITHUB_STEP_SUMMARY
              echo "- HTML templates in KV" >> $GITHUB_STEP_SUMMARY
              ;;
            "SYSTEM_DOWN")
              echo "**SYSTEM_DOWN**: Both checks failing." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This indicates worker down or system-wide issue. Check:" >> $GITHUB_STEP_SUMMARY
              echo "- Cloudflare Workers status" >> $GITHUB_STEP_SUMMARY
              echo "- Worker deployment logs" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "Unable to determine alert routing." >> $GITHUB_STEP_SUMMARY
              ;;
          esac

  # ==========================================================================
  # OPTIONAL: Datadog Synthetic Tests
  # ==========================================================================
  # Triggers Datadog synthetic tests for additional monitoring coverage.
  # Requires: DATADOG_API_KEY, DATADOG_APP_KEY secrets
  # Requires: DATADOG_SYNTHETICS_ENABLED variable = "true"
  # See: docs/SYNTHETIC_MONITORING.md for setup instructions
  # ==========================================================================
  datadog-synthetic:
    name: Datadog Synthetic Tests (Optional)
    runs-on: ubuntu-latest
    needs: [check-stage1, synthetic-health-checks]
    if: |
      needs.synthetic-health-checks.outputs.all_passed == 'true' &&
      vars.DATADOG_SYNTHETICS_ENABLED == 'true'
    continue-on-error: true  # Don't block pipeline if Datadog is unavailable
    outputs:
      synthetics_passed: ${{ steps.synthetics.outputs.passed }}

    steps:
      - name: Trigger Datadog synthetics
        id: synthetics
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          # Configure your Datadog synthetic test IDs here
          # Format: space-separated public IDs
          DATADOG_SYNTHETIC_TESTS: ${{ vars.DATADOG_SYNTHETIC_TEST_IDS || '' }}
        run: |
          echo "=============================================="
          echo "DATADOG SYNTHETIC TESTS (Optional)"
          echo "=============================================="

          # Check credentials
          if [ -z "$DATADOG_API_KEY" ] || [ -z "$DATADOG_APP_KEY" ]; then
            echo "Datadog credentials not configured - skipping"
            echo "passed=skipped" >> $GITHUB_OUTPUT
            echo "message=Credentials not configured" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if test IDs are configured
          if [ -z "$DATADOG_SYNTHETIC_TESTS" ]; then
            echo "No Datadog synthetic test IDs configured"
            echo "Set DATADOG_SYNTHETIC_TEST_IDS variable with space-separated test IDs"
            echo "passed=skipped" >> $GITHUB_OUTPUT
            echo "message=No test IDs configured" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Test IDs: $DATADOG_SYNTHETIC_TESTS"
          echo ""

          # Build JSON payload for test IDs
          TESTS_JSON=$(echo "$DATADOG_SYNTHETIC_TESTS" | tr ' ' '\n' | jq -R '{"public_id": .}' | jq -s '.')

          echo "Triggering Datadog synthetic tests..."

          # Trigger CI/CD synthetic tests
          RESPONSE=$(curl -s -X POST "https://api.datadoghq.com/api/v1/synthetics/tests/trigger/ci" \
            -H "DD-API-KEY: $DATADOG_API_KEY" \
            -H "DD-APPLICATION-KEY: $DATADOG_APP_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"tests\": $TESTS_JSON}" 2>&1) || true

          echo "Response: $RESPONSE"

          # Check for errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.errors[0] // "Unknown error"')
            echo "::warning::Datadog API error: $ERROR_MSG"
            echo "passed=failed" >> $GITHUB_OUTPUT
            echo "message=$ERROR_MSG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract batch ID for polling
          BATCH_ID=$(echo "$RESPONSE" | jq -r '.batch_id // empty')
          if [ -z "$BATCH_ID" ]; then
            echo "No batch ID returned - tests may not have been triggered"
            echo "passed=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Batch ID: $BATCH_ID"
          echo "Polling for results (timeout: 120s)..."

          # Poll for results
          MAX_ATTEMPTS=24
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5

            POLL_RESPONSE=$(curl -s -X GET "https://api.datadoghq.com/api/v1/synthetics/ci/batch/$BATCH_ID" \
              -H "DD-API-KEY: $DATADOG_API_KEY" \
              -H "DD-APPLICATION-KEY: $DATADOG_APP_KEY" 2>&1) || true

            STATUS=$(echo "$POLL_RESPONSE" | jq -r '.status // "pending"')
            echo "  Attempt $ATTEMPT: $STATUS"

            if [ "$STATUS" = "passed" ]; then
              echo ""
              echo "=============================================="
              echo "DATADOG SYNTHETIC TESTS: PASSED"
              echo "=============================================="
              echo "passed=true" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo ""
              echo "=============================================="
              echo "DATADOG SYNTHETIC TESTS: FAILED"
              echo "=============================================="
              # Extract failure details
              echo "$POLL_RESPONSE" | jq '.results[] | select(.passed == false) | {name, public_id, error_message}'
              echo "passed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo ""
          echo "Timeout waiting for Datadog results"
          echo "passed=timeout" >> $GITHUB_OUTPUT

      - name: Create Datadog summary
        if: always()
        run: |
          echo "## Datadog Synthetic Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          RESULT="${{ steps.synthetics.outputs.passed }}"
          case "$RESULT" in
            "true")
              echo "### PASSED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All Datadog synthetic tests passed." >> $GITHUB_STEP_SUMMARY
              ;;
            "false")
              echo "### FAILED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "One or more Datadog synthetic tests failed. Check Datadog dashboard." >> $GITHUB_STEP_SUMMARY
              ;;
            "skipped")
              echo "### SKIPPED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Datadog synthetics not configured." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "To enable:" >> $GITHUB_STEP_SUMMARY
              echo "1. Set \`DATADOG_API_KEY\` and \`DATADOG_APP_KEY\` secrets" >> $GITHUB_STEP_SUMMARY
              echo "2. Set \`DATADOG_SYNTHETICS_ENABLED=true\` variable" >> $GITHUB_STEP_SUMMARY
              echo "3. Set \`DATADOG_SYNTHETIC_TEST_IDS\` with your test IDs" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "See: [docs/SYNTHETIC_MONITORING.md](../blob/main/docs/SYNTHETIC_MONITORING.md)" >> $GITHUB_STEP_SUMMARY
              ;;
            "timeout")
              echo "### TIMEOUT" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Timed out waiting for Datadog results. Check Datadog dashboard." >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "### UNKNOWN" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Unable to determine Datadog synthetic test status." >> $GITHUB_STEP_SUMMARY
              ;;
          esac

  # ==========================================================================
  # SMOKE TEST SUMMARY
  # ==========================================================================
  smoke-summary:
    name: Smoke Test Summary
    runs-on: ubuntu-latest
    needs: [check-stage1, preflight-check, create-event-smoke-gate, api-smoke-tests, ui-smoke-tests, synthetic-health-checks]
    if: always() && needs.check-stage1.outputs.should_run == 'true'
    outputs:
      all_passed: ${{ steps.summary.outputs.all_passed }}
      auto_promote: ${{ needs.check-stage1.outputs.auto_promote }}
      rollback_on_failure: ${{ needs.check-stage1.outputs.rollback_on_failure }}

    steps:
      - name: Calculate overall result
        id: summary
        run: |
          echo "=============================================="
          echo "STAGE-2 SMOKE TEST SUMMARY"
          echo "=============================================="
          echo ""

          PREFLIGHT="${{ needs.preflight-check.result }}"
          C4_GATE="${{ needs.create-event-smoke-gate.result }}"
          API="${{ needs.api-smoke-tests.result }}"
          UI="${{ needs.ui-smoke-tests.result }}"
          SYNTHETIC="${{ needs.synthetic-health-checks.result }}"
          SKIP_UI="${{ needs.check-stage1.outputs.skip_ui_tests }}"

          echo "Pre-flight:     $PREFLIGHT"
          echo "C4 Gate:        $C4_GATE"
          echo "API Tests:      $API"
          echo "UI Tests:       $UI (skip_ui_tests=$SKIP_UI)"
          echo "Synthetic:      $SYNTHETIC"
          echo ""

          # If UI tests are skipped, consider them passed
          if [ "$SKIP_UI" = "true" ]; then
            UI="skipped_ok"
          fi

          # Story C4: Check if all required tests passed (including C4 gate)
          if [ "$PREFLIGHT" = "success" ] && [ "$C4_GATE" = "success" ] && [ "$API" = "success" ] && [ "$SYNTHETIC" = "success" ]; then
            if [ "$UI" = "success" ] || [ "$UI" = "skipped" ] || [ "$UI" = "skipped_ok" ]; then
              echo "all_passed=true" >> $GITHUB_OUTPUT
              echo "=============================================="
              echo "ALL SMOKE TESTS PASSED"
              echo "=============================================="
              echo "Staging is healthy and ready for production promotion."
            else
              echo "all_passed=false" >> $GITHUB_OUTPUT
              echo "=============================================="
              echo "UI SMOKE TESTS FAILED"
              echo "=============================================="
              echo "Production promotion blocked."
            fi
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
            echo "=============================================="
            echo "SMOKE TESTS FAILED"
            echo "=============================================="
            if [ "$C4_GATE" != "success" ]; then
              echo "Story C4 Create-Event Gate FAILED"
            fi
            echo "Production promotion blocked."
          fi

      - name: Create final summary
        run: |
          echo "# Stage-2 Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Story 5.2**: Post-Deploy Smoke + Synthetic (Staging -> Prod gate)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Flight Health | \`${{ needs.preflight-check.result == 'success' && 'PASSED' || 'FAILED' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Story C4 Create-Event Gate** | \`${{ needs.create-event-smoke-gate.result == 'success' && 'PASSED' || needs.create-event-smoke-gate.result == 'skipped' && 'SKIPPED' || 'FAILED' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Smoke Tests | \`${{ needs.api-smoke-tests.result == 'success' && 'PASSED' || needs.api-smoke-tests.result == 'skipped' && 'SKIPPED' || 'FAILED' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Smoke Tests | \`${{ needs.ui-smoke-tests.result == 'success' && 'PASSED' || needs.ui-smoke-tests.result == 'skipped' && 'SKIPPED' || 'FAILED' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Synthetic Health (Story 3.2) | \`${{ needs.synthetic-health-checks.result == 'success' && 'PASSED' || needs.synthetic-health-checks.result == 'skipped' && 'SKIPPED' || 'FAILED' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.summary.outputs.all_passed }}" = "true" ]; then
            echo "## PASSED - Ready for Production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All smoke tests passed. Manual approval required to promote to production." >> $GITHUB_STEP_SUMMARY
          else
            echo "## FAILED - Production Blocked" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more smoke tests failed. Production promotion is blocked." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Staging URL**: ${{ env.STG_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Debug the issue in staging before retrying." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # ROLLBACK ON FAILURE (Optional)
  # ==========================================================================
  # Rollback staging to previous version if smoke tests fail
  # Only runs when rollback_on_failure=true
  # ==========================================================================
  rollback-staging:
    name: Rollback Staging (On Failure)
    runs-on: ubuntu-latest
    needs: [smoke-summary]
    # Only run if smoke tests failed AND rollback_on_failure is true
    if: |
      needs.smoke-summary.outputs.all_passed != 'true' &&
      needs.smoke-summary.outputs.rollback_on_failure == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Rollback staging to previous version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
        run: |
          echo "=============================================="
          echo "ROLLBACK: Reverting staging to previous version"
          echo "=============================================="
          echo ""
          echo "Smoke tests failed - initiating automatic rollback"
          echo ""

          cd cloudflare-proxy

          # List current deployments
          echo "Current deployments:"
          wrangler deployments list --env staging || true

          # Execute rollback
          echo ""
          echo "Executing rollback..."
          wrangler rollback --env staging

          echo ""
          echo "=============================================="
          echo "ROLLBACK COMPLETE"
          echo "=============================================="

      - name: Verify rollback
        run: |
          echo "Waiting for edge propagation..."
          sleep 10

          echo "Verifying staging health..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ env.STG_BASE_URL }}/api/status" || echo "CURL_FAILED")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Staging health check passed after rollback"
          else
            echo "::warning::Staging health check returned HTTP $HTTP_CODE after rollback"
          fi

      - name: Create rollback summary
        if: always()
        run: |
          echo "## Staging Rollback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ROLLED BACK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Staging has been rolled back to the previous version due to smoke test failures." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Staging URL:** ${{ env.STG_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ROLLBACK FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Automatic rollback failed. Manual intervention required." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run manually: \`npm run rollback:staging\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # PRODUCTION APPROVAL GATE (Manual)
  # ==========================================================================
  # Manual approval required before production deployment.
  # Uses GitHub Environment protection rules.
  # Skipped when auto_promote=true
  #
  # Setup Required (GitHub Settings):
  #   1. Go to Settings > Environments
  #   2. Create environment named "production"
  #   3. Enable "Required reviewers" and add approvers
  # ==========================================================================
  production-approval:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [smoke-summary]
    # Only require approval if smoke tests passed AND auto_promote is false
    if: |
      needs.smoke-summary.outputs.all_passed == 'true' &&
      needs.smoke-summary.outputs.auto_promote != 'true'
    environment:
      name: production
      url: https://oursharedevents.com

    steps:
      - name: Approval received
        run: |
          echo "=============================================="
          echo "PRODUCTION APPROVAL RECEIVED"
          echo "=============================================="
          echo ""
          echo "Manual approval granted for production deployment."
          echo "Proceeding with production Worker deploy..."

      - name: Create approval summary
        run: |
          echo "## Production Approval Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APPROVED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deployment has been manually approved." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Approver** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target URL** | \`https://oursharedevents.com\` |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # AUTO-PROMOTE TO PRODUCTION
  # ==========================================================================
  # Automatically deploys to production when auto_promote=true
  # Skips the manual approval gate
  # ==========================================================================
  auto-promote-check:
    name: Auto-Promote Check
    runs-on: ubuntu-latest
    needs: [smoke-summary]
    # Only run if smoke tests passed AND auto_promote is true
    if: |
      needs.smoke-summary.outputs.all_passed == 'true' &&
      needs.smoke-summary.outputs.auto_promote == 'true'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Auto-promote enabled
        id: check
        run: |
          echo "=============================================="
          echo "AUTO-PROMOTE ENABLED"
          echo "=============================================="
          echo ""
          echo "Smoke tests passed and auto_promote=true"
          echo "Skipping manual approval gate"
          echo "Deploying directly to production..."
          echo ""
          echo "should_deploy=true" >> $GITHUB_OUTPUT

      - name: Create auto-promote summary
        run: |
          echo "## Auto-Promote to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AUTO-PROMOTING" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests passed. Auto-promoting to production (manual approval skipped)." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PRODUCTION DEPLOYMENT
  # ==========================================================================
  # Deploy to production after manual approval OR auto-promote
  # Uses wrangler deploy --env production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [production-approval, auto-promote-check]
    # Run if either approval received OR auto-promote enabled
    if: |
      always() &&
      (needs.production-approval.result == 'success' || needs.auto-promote-check.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Validate Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}" ]; then
            echo "::error::Missing required secret: CLOUDFLARE_API_TOKEN_OSE"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN_OSE is set"

      - name: Deploy Worker to Production
        working-directory: cloudflare-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_OSE }}
        run: |
          echo "=============================================="
          echo "DEPLOYING TO PRODUCTION"
          echo "=============================================="
          echo "Target: oursharedevents.com"
          echo "Environment: production"
          echo ""

          wrangler deploy --env production

          echo ""
          echo "=============================================="
          echo "WORKER DEPLOYED TO PRODUCTION"
          echo "=============================================="

      - name: Verify production deployment
        run: |
          echo "=============================================="
          echo "VERIFYING PRODUCTION DEPLOYMENT"
          echo "=============================================="

          # Wait for edge propagation
          sleep 15

          # Test /api/status endpoint
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ env.PROD_BASE_URL }}/api/status" || echo "CURL_FAILED")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            OK_VALUE=$(echo "$BODY" | jq -r '.ok // "null"' 2>/dev/null || echo "null")
            if [ "$OK_VALUE" = "true" ]; then
              echo ""
              echo "=============================================="
              echo "PRODUCTION VERIFICATION: PASSED"
              echo "=============================================="
            else
              echo "::warning::Production /api/status returned ok:$OK_VALUE"
            fi
          else
            echo "::warning::Production verification returned HTTP $HTTP_CODE"
          fi

      - name: Create deployment summary
        if: always()
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### DEPLOYED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Worker successfully deployed to production." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL**: https://oursharedevents.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Production deployment failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # PIPELINE FINAL STATUS
  # ==========================================================================
  pipeline-status:
    name: Pipeline Final Status
    runs-on: ubuntu-latest
    needs: [check-stage1, smoke-summary, rollback-staging, deploy-production]
    if: always()

    steps:
      - name: Report final status
        run: |
          echo "# Stage-2 Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STAGE1="${{ needs.check-stage1.outputs.should_run }}"
          SMOKE="${{ needs.smoke-summary.outputs.all_passed }}"
          DEPLOY="${{ needs.deploy-production.result }}"
          ROLLBACK="${{ needs.rollback-staging.result }}"
          AUTO_PROMOTE="${{ needs.smoke-summary.outputs.auto_promote }}"

          if [ "$STAGE1" != "true" ]; then
            echo "## SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "Stage-1 CI did not succeed. Stage-2 was not run." >> $GITHUB_STEP_SUMMARY
          elif [ "$SMOKE" != "true" ]; then
            echo "## BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "Smoke tests failed. Production deployment blocked." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$ROLLBACK" = "success" ]; then
              echo "Staging has been rolled back to the previous version." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            echo "**Staging URL**: ${{ env.STG_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
            echo "**Production is untouched**: ${{ env.PROD_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Rollback Commands" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npm run rollback:staging  # Rollback staging" >> $GITHUB_STEP_SUMMARY
            echo "npm run rollback:prod     # Rollback production" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPLOY" = "success" ]; then
            echo "## SUCCESS" >> $GITHUB_STEP_SUMMARY
            if [ "$AUTO_PROMOTE" = "true" ]; then
              echo "All smoke tests passed. Production deployment auto-promoted." >> $GITHUB_STEP_SUMMARY
            else
              echo "All smoke tests passed and production deployment completed." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL**: https://oursharedevents.com" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Rollback (if needed)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npm run rollback:prod" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPLOY" = "skipped" ]; then
            echo "## AWAITING APPROVAL" >> $GITHUB_STEP_SUMMARY
            echo "Smoke tests passed. Awaiting manual approval for production deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "## DEPLOYMENT FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Smoke tests passed but production deployment failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Rollback Production" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npm run rollback:prod" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
