<!--
================================================================================
SHARED MODULE — Accessibility Foundation
================================================================================
Purpose: WCAG 2.1 AA compliance foundation for all MVP surfaces
Status: NEW for Epic A11Y — Accessibility Audit
Included by: All 7 templates (admin, public, display, poster, report, sponsor, landing)

Provides:
  CSS:
    - .sr-only           — Screen reader only content
    - .skip-link         — Skip to main content link
    - :focus-visible     — Consistent focus ring across surfaces
    - @prefers-reduced-motion — Disable animations for vestibular disorders
    - @prefers-contrast  — High contrast mode support
    - .a11y-badge-text   — Text supplement for color-only badges
    - .live-region       — Hidden ARIA live region positioning

  JS:
    - announceToScreenReader(msg, priority)  — Announce to assistive tech
    - trapFocus(modal) → cleanup()           — Modal focus trap
    - initA11y()                             — Auto-initialize on load

  HTML:
    - ARIA live region element
    - Skip link element (injected by JS if not in markup)

WCAG References:
  - 1.3.1  Info and Relationships (landmarks, headings)
  - 1.4.1  Use of Color (text supplements)
  - 1.4.3  Contrast Minimum (high contrast mode)
  - 2.1.2  No Keyboard Trap (focus trap with Escape)
  - 2.4.1  Bypass Blocks (skip link)
  - 2.4.7  Focus Visible (focus-visible styles)
  - 3.1.1  Language of Page (lang attribute — enforced per template)
  - 4.1.3  Status Messages (ARIA live region)

DO NOT duplicate these styles in individual templates.
================================================================================
-->

<style>
/* ===== Accessibility Core — WCAG 2.1 AA Foundation ===== */

/* ----- Screen Reader Only Content (WCAG 1.3.1) ----- */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.sr-only-focusable:focus,
.sr-only-focusable:active {
  position: static;
  width: auto;
  height: auto;
  margin: 0;
  overflow: visible;
  clip: auto;
  white-space: normal;
}

/* ----- Skip Link (WCAG 2.4.1) ----- */
.skip-link {
  position: absolute;
  top: -100%;
  left: 16px;
  background: var(--color-primary, #2563eb);
  color: #ffffff;
  padding: 0.75rem 1.25rem;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.875rem;
  z-index: 10000;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  transition: top 0.15s ease-out;
}

.skip-link:focus {
  top: 0;
  outline: 3px solid var(--color-primary, #2563eb);
  outline-offset: 2px;
}

/* ----- Focus Visible (WCAG 2.4.7) ----- */
/* Only show focus ring on keyboard navigation, not mouse clicks */
*:focus:not(:focus-visible) {
  outline: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible,
[role="button"]:focus-visible,
[role="tab"]:focus-visible,
[role="link"]:focus-visible {
  outline: 3px solid var(--color-primary, #2563eb);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

/* ----- High Contrast Mode (WCAG 1.4.6) ----- */
@media (prefers-contrast: high) {
  .card,
  .event-card,
  .metric-card,
  .feature-card,
  .state-message,
  input,
  select,
  textarea,
  button {
    border-width: 2px;
    border-color: currentColor;
  }

  .card,
  .event-card,
  .feature-card {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  /* Strengthen muted text */
  .build-info,
  .text-muted,
  [class*="gray-400"],
  [class*="gray-500"] {
    color: var(--color-gray-700, #334155);
  }
}

/* ----- Reduced Motion (WCAG 2.3.3) ----- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .skip-link {
    transition: none;
  }
}

/* ----- Color-Only Supplement (WCAG 1.4.1) ----- */
/* Use alongside color badges to provide text context */
.a11y-badge-text {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ----- ARIA Live Region Positioning ----- */
.a11y-live-region {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

/* ----- Touch Target Minimum (WCAG 2.5.8) ----- */
button,
a[role="button"],
input[type="checkbox"],
input[type="radio"],
select,
summary {
  min-height: var(--touch-target-min, 44px);
}

/* Exception: inline text links in paragraphs */
p a,
li a,
td a {
  min-height: auto;
}

/* ----- Form Accessibility (WCAG 4.1.2) ----- */
label.required::after {
  content: ' *';
  color: var(--color-danger, #ef4444);
  font-weight: 700;
}

input[aria-invalid="true"],
select[aria-invalid="true"],
textarea[aria-invalid="true"] {
  border-color: var(--color-danger, #ef4444);
  border-width: 2px;
}

/* ----- Print Accessibility ----- */
@media print {
  .skip-link,
  .a11y-live-region {
    display: none;
  }

  a[href]::after {
    content: " (" attr(href) ")";
    font-size: 0.8em;
    color: #475569;
  }
}
</style>

<script>
/* ===== Accessibility Core — JavaScript Utilities ===== */
(function() {
  'use strict';

  /**
   * Announce a message to screen readers via ARIA live region.
   * @param {string} message - Text to announce
   * @param {'polite'|'assertive'} priority - Announcement urgency
   */
  window.announceToScreenReader = function(message, priority) {
    if (priority === undefined) priority = 'polite';
    var region = document.getElementById('a11y-live-region');
    if (!region) {
      region = document.createElement('div');
      region.id = 'a11y-live-region';
      region.className = 'a11y-live-region';
      region.setAttribute('aria-live', priority);
      region.setAttribute('aria-atomic', 'true');
      region.setAttribute('role', 'status');
      document.body.appendChild(region);
    }
    // Clear then set to trigger announcement even if same text
    region.textContent = '';
    setTimeout(function() {
      region.textContent = message;
    }, 50);
  };

  /**
   * Trap focus within a modal element. Returns a cleanup function.
   * @param {HTMLElement} modal - The modal container
   * @returns {Function} Call to release the focus trap
   */
  window.trapFocus = function(modal) {
    var focusableSelector = 'a[href], button:not([disabled]), textarea, input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
    var focusableElements = modal.querySelectorAll(focusableSelector);
    var firstFocusable = focusableElements[0];
    var lastFocusable = focusableElements[focusableElements.length - 1];
    var previouslyFocused = document.activeElement;

    if (firstFocusable) firstFocusable.focus();

    function handleKeyDown(e) {
      if (e.key === 'Escape') {
        cleanup();
        return;
      }
      if (e.key !== 'Tab') return;

      if (e.shiftKey) {
        if (document.activeElement === firstFocusable) {
          e.preventDefault();
          if (lastFocusable) lastFocusable.focus();
        }
      } else {
        if (document.activeElement === lastFocusable) {
          e.preventDefault();
          if (firstFocusable) firstFocusable.focus();
        }
      }
    }

    modal.addEventListener('keydown', handleKeyDown);

    function cleanup() {
      modal.removeEventListener('keydown', handleKeyDown);
      if (previouslyFocused) previouslyFocused.focus();
    }

    return cleanup;
  };

  /**
   * Initialize core accessibility features on page load.
   */
  function initA11y() {
    // Ensure ARIA live region exists
    if (!document.getElementById('a11y-live-region')) {
      var region = document.createElement('div');
      region.id = 'a11y-live-region';
      region.className = 'a11y-live-region';
      region.setAttribute('aria-live', 'polite');
      region.setAttribute('aria-atomic', 'true');
      region.setAttribute('role', 'status');
      document.body.appendChild(region);
    }

    // Ensure skip link target exists
    var main = document.querySelector('main') || document.querySelector('[role="main"]');
    if (main && !main.id) {
      main.id = 'main-content';
    }
  }

  // Auto-initialize
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initA11y);
  } else {
    initA11y();
  }
})();
</script>
