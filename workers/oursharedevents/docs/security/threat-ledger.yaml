    red_birth: { date: "2026-09-17", method: design-time-negative-assertion }
    notes: "verifySponsorHomeToken() (lib/sponsor-home-auth.ts): HMAC-SHA256 + constantTimeEqual (XOR-accumulate, no early return) + fail-closed on missing SHARED_REPORT_SIGNING_SECRET + distinct kind='sponsor_home' (no cross-kind confusion with the report token) + exp enforced + brand_id in the signed claim. Structural lock added CCR-PR567 M5; born-red verified by swapping constantTimeEqual→=== (the constant-time gate goes red)."

