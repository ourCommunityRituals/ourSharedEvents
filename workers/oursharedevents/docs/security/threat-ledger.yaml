  - id: TL-045
    threat: "Sponsor-home token forgery / timing oracle / cross-kind replay: attacker crafts a valid-looking HMAC for another sponsor_id or brand, replays a SharedReport token as a sponsor-home token, or times the signature compare to recover the HMAC"
    severity: HIGH
