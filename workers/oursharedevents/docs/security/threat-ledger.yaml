#
# AUTHORITATIVE SOURCE: tests/fixtures/threat-ledger.ts (TypeScript, type-checked)
# This YAML is a human-readable mirror for operators and security reviewers.
# When they diverge, TypeScript wins.
#
# Ledger rules:
#   - Every entry has an ID, layer, threat description, target invariant, test_ref, and status
#   - "tested" entries must have test_ref + red_birth (CI validates this)
#   - "mitigated" entries must have mitigation_story (Linear ID)
#   - "open" entries are expected — silence is not OK, named gaps are
#   - New infrastructure layers arrive with a ledger section as part of their brain landing
#
# @born-red annotation convention (in test files):
#   // @born-red TL-XXX | method: <method> | date: YYYY-MM-DD
#
# Red birth methods:
#   design-time-negative-assertion  — structural test; red = running with guard disabled
#   historical-ci-failure           — caught a real bug in a prior CI run
#   deliberate-fixture-break        — run against deliberately broken fixture before merge
#   red-team-fleet-finding          — OSE-568 red team fleet confirmed exploitable
# ──────────────────────────────────────────────────────────────────────────────

