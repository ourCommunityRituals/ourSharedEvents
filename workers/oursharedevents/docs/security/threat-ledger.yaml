    threat: "Cross-database join: attacker correlates FORMS_DB PII records with main DB scan records via shared anonymous_id field"
    severity: HIGH
    target_invariant: "1 — anonymous_id"
    test_ref: "tests/anti-logging-proof.spec.ts > P5: Cross-database join structurally impossible"
    status: tested
    red_birth: { date: "2026-08-03", method: design-time-negative-assertion }

  - id: TL-002
    threat: "FK smuggling: attacker inserts a FORMS_DB record ID as a foreign key in a main DB table, creating an implicit cross-DB link"
    severity: MEDIUM
    target_invariant: "1 — anonymous_id"
    test_ref: "tests/forms-security.spec.ts > S2: Form handlers NEVER reference main DB"
    status: tested
    red_birth: { date: "2026-08-03", method: design-time-negative-assertion }

  - id: TL-003
    threat: "TTL bypass: attacker queries FORMS_DB for expired registrations/email records before the destruction job runs"
    severity: MEDIUM
    target_invariant: "8 — bounded_pii_retention"
    test_ref: "tests/forms-security.spec.ts > S5: registration data destroyed after expires_at"
    status: tested
    red_birth: { date: "2026-08-03", method: design-time-negative-assertion }

  - id: TL-004
    threat: "Direct binding misuse: handler imports and uses both DB bindings directly, bypassing isolation abstraction"
    severity: HIGH
    target_invariant: "1 — anonymous_id"
    test_ref: "tests/forms-security.spec.ts > S3: forms-db.ts has ZERO references to main DB"
    status: tested
    red_birth: { date: "2026-08-03", method: design-time-negative-assertion }

