<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Poster – OurSharedEvents</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f8f9fa;
        color: #1e293b;
      }
      .page-header {
        background: #1a1a2e;
        color: #fff;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .page-header h1 {
        font-size: 1.2rem;
        font-weight: 700;
      }
      .page-header a,
      .page-header .print-btn {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .page-header a:hover,
      .page-header .print-btn:not(:disabled):hover {
        color: #fff;
      }
      /* OSE-286: the Print control became a <button>; reset native chrome so
         it reads as the header link it replaced, and dim it while disabled. */
      .print-controls {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
      }
      .print-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
      }
      .print-btn:disabled,
      .print-btn[disabled] {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .print-status {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.6);
      }
      .container {
        max-width: 680px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .poster {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        border: 1px solid #e2e8f0;
      }
      .poster-header {
        background: #1a1a2e;
        color: #fff;
        padding: 2.5rem 2rem 2rem;
        text-align: center;
      }
      .poster-header .org {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        opacity: 0.6;
        margin-bottom: 0.75rem;
      }
      .poster-header h2 {
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 800;
        line-height: 1.2;
      }
      .poster-body {
        padding: 2rem;
      }
      .poster-meta {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      .meta-row {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .meta-icon {
        width: 24px;
        flex-shrink: 0;
        text-align: center;
        font-size: 1rem;
        padding-top: 0.1rem;
      }
      .meta-text {
        font-size: 1rem;
        color: #334155;
      }
      /* @ocr/ui-ready: colours come from the shared design tokens (--surface-hover,
         --border, --text-muted), not hardcoded hex — so the poster art viewport
         can be adopted by @ocr/ui / synced to Claude Design without a re-skin. */
      .poster-art {
        margin: 1rem 0 1.25rem;
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface-hover);
      }
      .poster-art-img {
        display: block;
        width: 100%;
        max-height: 320px;
        object-fit: cover;
      }
      .poster-art--empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
        border: 2px dashed var(--border);
      }
      .poster-art-placeholder {
        font-size: 2rem;
        color: var(--text-muted);
        opacity: 0.5;
      }
      /* Typed-slot layout. #poster-qr-slots is the single flex child of
         .qr-section; the slot cards lay out inside it. */
      .qr-slots {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        width: 100%;
      }
      /* Printed /s shortlink under each slot's QR — a NEW class (not
         .qr-link-url), so it deliberately escapes the print display:none below:
         the poster is meant to carry the human-typeable shortlink on paper. */
      .qr-slot-code {
        display: block;
        margin: 0.35rem auto 0;
        max-width: 120px;
        font-size: 0.62rem;
        line-height: 1.3;
        color: var(--text-muted);
        word-break: break-all;
        text-align: center;
      }
      .qr-section {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        padding: 1.5rem 0;
        border-top: 1px solid #e2e8f0;
        border-bottom: 1px solid #e2e8f0;
        margin-bottom: 1.5rem;
      }
      .qr-item {
        text-align: center;
      }
      .qr-loading {
        width: 120px;
        height: 120px;
        background: #f1f5f9;
        border: 2px dashed #cbd5e1;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 0.5rem;
        font-size: 1.25rem;
        color: #64748b;
      }
      .qr-img {
        width: 120px;
        height: 120px;
        display: block;
        margin: 0 auto 0.5rem;
        image-rendering: pixelated;
      }
      .qr-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .qr-link:hover .qr-img {
        opacity: 0.85;
      }
      .qr-link-url {
        display: block;
        font-size: 0.6rem;
        color: #64748b;
        word-break: break-all;
        margin-top: 0.25rem;
        max-width: 120px;
        text-align: center;
      }
      .qr-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      /* OSE-887: GAS .qr-card frame (archive/v2-code/components/QRRegenerator.html)
         wrapping each poster QR — header carries the label, body holds the QR that
         loadPosterQR injects into #qr-img-{type}. Themed in the token-overlay block
         below; flattened for print (see @media print). */
      .qr-card {
        display: flex;
        flex-direction: column;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .qr-card-header {
        padding: 0.4rem 0.75rem;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }
      .qr-card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0.85rem 0.75rem;
      }
      /* OSE-1200: UEC word + path + consent tier. Plain text, prints in black —
         the hue lives on the code and the frame; the words carry it for everyone. */
      .qr-uec {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        margin-top: 0.5rem;
        text-align: center;
      }
      .qr-uec-word {
        font-weight: 800;
        letter-spacing: 0.12em;
        font-size: 0.8rem;
      }
      .qr-uec-path {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        color: #475569;
      }
      .qr-uec-tier {
        font-size: 0.7rem;
        line-height: 1.3;
        color: #475569;
        max-width: 16rem;
      }
      .poster-footer {
        text-align: center;
        padding: 1rem;
        background: #f8fafc;
        font-size: 0.8rem;
        color: #64748b;
      }
      .loading {
        text-align: center;
        padding: 4rem;
        color: #64748b;
      }
      .error {
        text-align: center;
        padding: 3rem;
        color: #dc2626;
      }
      .event-select {
        margin-bottom: 1.5rem;
      }
      .event-select label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.375rem;
      }
      .event-select select {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.95rem;
        background: #fff;
        color: #1e293b;
      }
      .poster-sponsors {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1rem 2rem;
        flex-wrap: wrap;
      }
      .poster-sponsors:empty {
        display: none;
      }
      .poster-sponsor {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      /* OSE-864/#25: ONE uniform logo box for every sponsor regardless of tier.
         Responsive (clamp) across viewports, tier-blind — money buys frequency,
         never size. WALL-3b (OSE-835) fails CI on any tier-keyed sponsor geometry. */
      .poster-sponsor img {
        height: clamp(24px, 4.5vw, 40px);
        width: auto;
        max-width: clamp(80px, 14vw, 140px);
        object-fit: contain;
      }
      .poster-sponsor-name {
        font-size: 0.75rem;
        color: #64748b;
        font-weight: 500;
      }
      .poster-sponsor-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #64748b;
        text-align: center;
        margin-bottom: 0.35rem;
      }
      .poster-sponsor-tier-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.2rem 0;
      }
      .poster-sponsor-tier-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #64748b;
        text-align: center;
        width: 100%;
        margin-bottom: 0.15rem;
      }
      /* OSE-864/#25: the six per-tier logo-height + name-typography rules
         (40/34/28/22px; title>...>primary) are DELETED. Every sponsor renders at
         the one .poster-sponsor img box and the one .poster-sponsor-name style
         above, regardless of tier. `data-tier` remains on the element for
         frequency-share/rotation identity, but NO CSS keys off it (WALL-3b). */
      .page-header a:focus-visible,
      .page-header .print-btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .event-select select:focus {
        border-color: #4361ee;
        outline: none;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        background: #1a1a2e;
        color: #fff;
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid #4361ee;
      }
      /* OSE-300 DRAIN 7/7: mobile workability for /poster preview.
       At 375px the default 4-up QR row at 120px each plus 2rem gaps
       overflows; the .page-header Print anchor is below the 44px
       touch-target floor; the .event-select picker renders below
       16px font-size so iOS auto-zooms on tap. This block:
         - tightens .page-header / .container / .poster-body padding
         - bumps the Print anchor to 44px min-height
         - raises the event-picker to 16px / 44px so it meets both
           the iOS auto-zoom guard and the touch-target floor
         - shrinks .qr-img / .qr-loading to 100px and looses the
           gap so two QR codes fit per row with breathing room
         - releases .qr-link-url word-break so the long URL wraps
           inside the QR column */
      @media (max-width: 768px) {
        .page-header {
          padding: 0.75rem 1rem;
        }
        .page-header h1 {
          font-size: 1.05rem;
        }
        .page-header a,
        .page-header .print-btn {
          display: inline-flex;
          align-items: center;
          min-height: 44px;
          padding: 0 0.5rem;
        }
        .container {
          padding: 0 .75rem;
          margin: 1rem auto;
        }
        .poster-header {
          padding: 1.75rem 1.25rem 1.5rem;
        }
        .poster-body {
          padding: 1.25rem 1rem;
        }
        .event-select select {
          font-size: 16px;
          min-height: 44px;
          padding: 0.65rem 0.75rem;
        }
        .qr-section {
          gap: 1rem;
          padding: 1.25rem 0;
        }
        .qr-img,
        .qr-loading {
          width: 100px;
          height: 100px;
        }
        .poster-art-img {
          max-height: 200px;
        }
        .qr-link-url {
          max-width: 100px;
          word-break: break-all;
        }
        .poster-sponsors {
          padding: 1rem;
          gap: 1rem;
        }
      }
      @media print {
        .page-header,
        .event-select,
        .no-print {
          display: none !important;
        }
        /* restore white background for print even in dark mode */
        body {
          background: #fff !important;
          color: #1e293b !important;
        }
        .poster {
          background: #fff !important;
        }
        /* OSE-R-006 (audit 2026-05-15): force-print backgrounds + sponsor
         colors. Sponsors paid for full-color logo placement; pre-fix the
         print rule grayscaled them and the dark-navy poster header dropped
         to white-on-white. Both broke the printed-poster value promise. */
        body,
        .poster,
        .poster-header,
        .poster-sponsors,
        .poster-sponsor,
        .poster-sponsor img {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          color-adjust: exact;
        }
        body {
          background: #fff;
        }
        .container {
          margin: 0;
          max-width: 100%;
        }
        /* Keep the whole poster on one page when it fits; otherwise allow
         orderly breaks at the major section boundaries. */
        .poster {
          box-shadow: none;
          border: none;
          page-break-inside: avoid;
        }
        .qr-section {
          page-break-inside: avoid;
        }
        .poster-sponsors {
          page-break-inside: avoid;
          border-top: 1px solid #ccc;
          padding: 0.75rem 1rem;
        }
        /* OSE-R-006: NO grayscale on sponsor logos in print. Keep the
         max-height clamp so logos still fit a printed A4 page — that part
         was a layout decision, separate from the color issue. */
        .poster-sponsor img {
          max-height: 20px;
        }
        .poster-sponsor-name,
        .poster-sponsor-label {
          color: #000;
        }
        .qr-loading {
          display: none !important;
        }
        /* R4: art prints when present; an empty placeholder must never print a
           dashed box where artwork would go. */
        .poster-art--empty {
          display: none !important;
        }
        .poster-art {
          page-break-inside: avoid;
        }
        /* OSE-286: defensive move for Cmd+P bypassing the disabled button —
           if ANY QR is still a loading placeholder, hide the whole section so
           the poster never prints empty labeled boxes where codes belong. */
        .qr-section:has(.qr-loading) {
          display: none !important;
        }
        .qr-link-url {
          display: none !important;
        }
        /* OSE-887: flatten the .qr-card chrome for print so the poster keeps its
           clean label-over-QR look (no card borders/fills on the page). */
        .qr-card {
          border: none;
        }
        .qr-card-header {
          background: transparent;
          border-bottom: none;
          padding: 0 0 0.2rem;
        }
        .qr-card-body {
          padding: 0;
        }
      }
    </style>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      body {
        background: var(--bg);
        color: var(--text);
      }
      .page-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      .page-header a,
      .page-header .print-btn {
        color: var(--text-muted);
      }
      .page-header a:hover,
      .page-header .print-btn:not(:disabled):hover {
        color: var(--text);
      }
      .poster {
        background: var(--surface);
        border-color: var(--border);
        box-shadow: none;
      }
      .poster-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .meta-text {
        color: var(--text-muted);
      }
      .qr-section {
        border-color: var(--border);
      }
      .qr-loading {
        background: var(--surface-hover);
        border-color: var(--border);
        color: var(--text-muted);
      }
      .qr-label {
        color: var(--text-muted);
      }
      .qr-card {
        background: var(--surface);
        border-color: var(--border);
      }
      .qr-card-header {
        background: var(--surface-hover);
        border-bottom-color: var(--border);
      }
      .qr-link-url {
        color: var(--text-muted);
      }
      .poster-footer {
        background: var(--surface-hover);
        color: var(--text-muted);
      }
      .event-select label {
        color: var(--text-muted);
      }
      .event-select select {
        background: var(--surface);
        border-color: var(--border);
        color: var(--text);
      }
      .event-select select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(212, 149, 75, 0.15);
      }
      .poster-sponsor-name,
      .poster-sponsor-label,
      .poster-sponsor-tier-label {
        color: var(--text-muted);
      }
      /* OSE-864/#25: the per-tier name-colour override (title/platinum/gold →
         brighter --text) is removed — every sponsor name is uniform --text-muted. */
      .skip-link:focus {
        background: var(--surface);
        color: var(--text);
        border-bottom-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="poster-skip-link">Skip to content</a>
    <div class="page-header no-print" data-testid="poster-header">
      <h1>OurSharedEvents — Poster</h1>
      <!-- OSE-286 / OSE-R-020: Print is a real <button> that STARTS disabled and
           is re-enabled by the gate script only once all QR codes settle, so a
           poster is never printed with empty QR boxes. (It replaced a
           `javascript:window.print()` anchor, which the nonce CSP blocks and
           which cannot be disabled.) -->
      <div class="print-controls">
        <span id="poster-print-status" class="print-status" data-testid="poster-print-status" role="status" aria-live="polite">QR codes loading&hellip;</span>
        <button type="button" id="poster-print-btn" class="print-btn" data-testid="poster-print" disabled aria-disabled="true">&#x1F5A8; Print</button>
      </div>
    </div>
    <main id="main-content" class="container" data-testid="poster-container">
      <div class="event-select no-print" data-testid="poster-event-select">
        <label for="event-picker">Select Event</label>
        <select id="event-picker" data-testid="poster-event-picker">
          <option value="">Loading events&hellip;</option>
        </select>
      </div>
      <div id="poster-area" data-testid="poster-area">
        <p class="loading" data-testid="poster-loading" role="status">Loading&hellip;</p>
      </div>
    </main>
    <script>
      const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
      const fmt = iso => iso ? new Date(iso).toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' }) : '';
      const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : '';

      // OSE-286: the Print button is gated on QR readiness. It starts disabled
      // (in the markup) and toggles here as posters render and their codes
      // settle, so a poster is never printed with empty QR boxes.
      function setPrintReady(ready) {
        const btn = document.querySelector('[data-testid="poster-print"]');
        const status = document.getElementById('poster-print-status');
        if (btn) {
          btn.disabled = !ready;
          btn.setAttribute('aria-disabled', ready ? 'false' : 'true');
        }
        if (status) status.style.display = ready ? 'none' : '';
      }
      // Resolve once every rendered QR <img> has loaded or errored. Data-URI
      // codes settle almost immediately; a slow venue link is exactly the case
      // this waits out. No images (all failed / none injected) → resolve now.
      function awaitQrImages() {
        const imgs = Array.prototype.slice.call(document.querySelectorAll('.qr-section .qr-img'));
        if (!imgs.length) return Promise.resolve();
        return Promise.all(imgs.map(function (img) {
          if (img.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        }));
      }

      function renderPoster(event) {
        // OSE-844 (X-10): the API item now carries name/startDateISO/venue
        // directly (mapped in enrichWithPhase). The old `const data = event.data
        // || {}` first branch was permanently dead — no SELECT ever exposed a
        // `data` column — so it is removed and the banned 'Event' fallback with
        // it. A genuinely-missing value renders its empty state, not a literal.
        const venue = event.venue || '';
        const address = '';
        const startISO = event.startDateISO || '';
        const name = event.name || '';
        // R4 — poster art viewport. Source is the event's cover image (public
        // projection allowlist includes cover_image_url). Snake/camel tolerant
        // so it works whether or not enrichWithPhase renames the field.
        const art = event.cover_image_url || event.coverImageUrl || '';

        return '<div class="poster" data-testid="poster-card" role="article" aria-label="' + esc(name) + ' event poster">' +
          '<div class="poster-header" data-testid="poster-card-header">' +
            '<div class="org" data-testid="poster-org">OurSharedEvents</div>' +
            '<h2 data-testid="poster-title">' + esc(name) + '</h2>' +
          '</div>' +
          '<div class="poster-body" data-testid="poster-body">' +
            '<div class="poster-meta" data-testid="poster-meta">' +
            (startISO ? '<div class="meta-row" data-testid="poster-meta-date"><div class="meta-icon" aria-hidden="true">&#x1F4C5;</div><div class="meta-text">' + esc(fmt(startISO)) + (startISO ? ' &mdash; ' + esc(fmtTime(startISO)) : '') + '</div></div>' : '') +
            (venue ? '<div class="meta-row" data-testid="poster-meta-venue"><div class="meta-icon" aria-hidden="true">&#x1F4CD;</div><div class="meta-text">' + esc(venue) + (address ? '<br><small>' + esc(address) + '</small>' : '') + '</div></div>' : '') +
            '</div>' +
            '<div class="poster-art' + (art ? '' : ' poster-art--empty') + '" data-testid="poster-art-viewport">' +
              (art
                ? '<img class="poster-art-img" src="' + esc(art) + '" alt="' + esc(name) + ' artwork" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="poster-art-img">'
                : '<span class="poster-art-placeholder" data-testid="poster-art-empty" aria-hidden="true">&#x1F3A8;</span>') +
            '</div>' +
            '<div class="qr-section" data-testid="poster-qr-section">' +
              // Typed destination slots (/q tracking + /s routing → Public /
              // Donate / Sign Up). loadPosterQR fills this from bundle.slots. The
              // .qr-loading placeholder keeps the print gate closed until codes
              // settle. NOT the forms (register/checkin/survey/feedback are a
              // separate, destroyed-by-cron implementation — off the poster).
              '<div id="poster-qr-slots" class="qr-slots" data-testid="poster-qr-slots"><div class="qr-loading" aria-busy="true">&#x23F3;</div></div>' +
            '</div>' +
          '</div>' +
          '<div id="poster-sponsor-strip" class="poster-sponsors" data-testid="poster-sponsor-strip" role="list" aria-label="Event sponsors"></div>' +
          '<div class="poster-footer" data-testid="poster-footer">oursharedevents.com</div>' +
        '</div>';
      }

      // OSE-1081: `event` is the CANONICAL surface deep-link param. admin.html's
      // scopedSurfaceUrl() emits /poster?event=<id>, but this page used to ignore
      // location.search entirely and always render items[0] — so every scoped
      // poster link an organizer copied out of the dashboard showed some OTHER
      // event. Returns the index of the requested event, or -1 when the param is
      // absent or names an event this page did not fetch (then the historical
      // first-event behaviour stands).
      function requestedEventIndex(items) {
        const wanted = new URLSearchParams(location.search).get('event');
        if (!wanted) return -1;
        for (let i = 0; i < items.length; i++) {
          if (items[i] && items[i].id === wanted) return i;
        }
        return -1;
      }

      async function init() {
        const picker = document.getElementById('event-picker');
        const area = document.getElementById('poster-area');
        try {
          const res = await fetch('/api/v2/events');
          const data = await res.json();
          const items = (data.ok && data.items) ? data.items : [];
          if (!items.length) {
            picker.innerHTML = '<option>No events available</option>';
            area.innerHTML = '<p class="loading" data-testid="poster-empty" role="status">No events scheduled.</p>';
            return;
          }
          picker.innerHTML = items.map((e, i) =>
            // OSE-844: read the single canonical `name`; fall back to the event
            // id (always present) so options stay distinguishable without the
            // banned Untitled-Event literal that made every option identical.
            '<option value="' + i + '">' + esc(e.name || e.id || '') + '</option>'
          ).join('');
          // OSE-1081: honour ?event=<id>. The <select> is the page's source of
          // truth for "which event is showing", so it is moved in step with the
          // rendered poster — otherwise the picker would read event #1 while the
          // deep-linked poster below it showed another.
          const startIdx = Math.max(requestedEventIndex(items), 0);
          picker.value = String(startIdx);
          area.innerHTML = renderPoster(items[startIdx]);
          loadPosterSponsors(items[startIdx].id);
          loadPosterQR(items[startIdx].id);
          picker.addEventListener('change', () => {
            const idx = parseInt(picker.value, 10);
            if (!isNaN(idx) && items[idx]) {
              area.innerHTML = renderPoster(items[idx]);
              loadPosterSponsors(items[idx].id);
              loadPosterQR(items[idx].id);
            }
          });
        } catch {
          area.innerHTML = '<p class="error" data-testid="poster-error" role="alert">Could not load events.</p>';
        }
      }
      async function loadPosterSponsors(eventId) {
        const strip = document.getElementById('poster-sponsor-strip');
        if (!strip || !eventId) return;
        strip.setAttribute('aria-busy', 'true');
        strip.innerHTML = '<span class="sr-only" data-testid="poster-sponsors-loading">Loading sponsors…</span>';
        try {
          const res = await fetch('/api/v2/events/' + encodeURIComponent(eventId) + '/sponsor-bundle?surface=poster');
          const data = await res.json();
          strip.setAttribute('aria-busy', 'false');
          if (!data.ok) { strip.innerHTML = ''; return; }
          const sponsors = data.bundle?.surface_sponsors?.posterTop || [];
          if (!sponsors.length) { strip.innerHTML = ''; return; }
          strip.innerHTML = '<div class="poster-sponsor-label" data-testid="poster-sponsor-label">Sponsored By</div>' +
            sponsors.map(function(s) {
              // OSE-R-015 (2026-05-15): referrerpolicy + onerror.
              // NOTE: the inner single quotes around 'none' MUST stay escaped
              // (\'). Unescaped, they terminate this single-quoted JS string
              // early ("Unexpected identifier 'none'") and kill the ENTIRE
              // poster inline script — no picker, no QR, no sponsors render.
              const logo = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.name) + ' logo" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="poster-sponsor-logo">' : '';
              const validTiers = ['title','platinum','gold','silver','bronze','primary'];
              // data-tier retained for rotation/frequency-share identity only; NO
              // poster-sponsor--<tier> class — #25 forbids tier-keyed geometry (OSE-864).
              const tier = validTiers.indexOf(String(s.tier || '')) >= 0 ? s.tier : 'primary';
              return '<div class="poster-sponsor" data-tier="' + esc(tier) + '" data-testid="poster-sponsor-item" role="listitem" aria-label="' + esc(s.name) + '">' + logo + '<span class="poster-sponsor-name" data-testid="poster-sponsor-name">' + esc(s.name) + '</span></div>';
            }).join('');
        } catch { strip.setAttribute('aria-busy', 'false'); strip.innerHTML = ''; }
      }
      async function loadPosterQR(eventId) {
        if (!eventId) return;
        // Gate Print for this render cycle until the codes below settle.
        setPrintReady(false);
        const container = document.getElementById('poster-qr-slots');
        try {
          const res = await fetch('/api/v2/events/' + encodeURIComponent(eventId) + '/poster-bundle');
          const data = await res.json();
          if (!data.ok || !container) return;
          // Typed destination slots (Public / Donate / Sign Up) from the bundle:
          // each is a /s routing shortlink (printed AND scannable) — the anonymous
          // routing layer, never a form. If the bundle has no slots, the
          // .qr-loading placeholder stays and the print gate keeps Print disabled.
          const slots = Array.isArray(data.slots) ? data.slots : [];
          if (!slots.length) return;
          container.innerHTML = slots
            .map(function (s) {
              const kind = esc(s.kind || 'slot');
              const label = esc(s.label || s.kind || '');
              const url = esc(s.url || '#');
              const shortText = esc(s.url || '');
              return (
                '<div class="qr-card qr-item" data-testid="poster-qr-slot-' + kind + '">' +
                '<div class="qr-card-header"><span class="qr-card-title qr-label" data-testid="poster-qr-slot-label-' + kind + '">' + label + '</span></div>' +
                '<div class="qr-card-body">' +
                '<a class="qr-link" href="' + url + '" target="_blank" rel="noopener noreferrer" aria-label="' + label + ' QR code — tap to open" data-testid="qr-link-' + kind + '">' +
                '<img src="' + esc(s.qr || '') + '" alt="' + label + ' QR code" class="qr-img" data-testid="qr-img-slot-' + kind + '" width="120" height="120" />' +
                '</a>' +
                '<span class="qr-slot-code" data-testid="qr-slot-code-' + kind + '">' + shortText + '</span>' +
                '</div>' +
                '</div>'
              );
            })
            .join('');
        } catch { /* QR loading is non-critical */ }
        finally {
          // AC (OSE-286): re-enable Print only after all QR images finish
          // loading OR error-out. If any code failed, its .qr-loading
          // placeholder stays and the @media print rule hides the whole
          // section — so an incomplete poster still never prints empty boxes.
          await awaitQrImages();
          setPrintReady(true);
        }
      }
      // OSE-286 / OSE-R-020: Print via a nonced listener — the button carries
      // no javascript: URI (which the nonce CSP blocks). The disabled attribute
      // already blocks clicks; the guard is belt-and-suspenders for aria state.
      (function wirePrintButton() {
        const btn = document.querySelector('[data-testid="poster-print"]');
        if (btn) btn.addEventListener('click', function () {
          if (!btn.disabled) window.print();
        });
      })();
      init();
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
