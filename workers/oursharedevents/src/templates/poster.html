<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Poster – OurSharedEvents</title>
    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family:
    system-ui,
    -apple-system,
    sans-serif;
  background: var(--bg);
  color: var(--text);
}
.page-header {
  background: var(--surface);
  color: var(--text);
  padding: 1rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.poster-kind {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
}
.page-header .poster-kind a[aria-current] {
  color: var(--text);
  font-weight: 700;
  text-decoration: underline;
}
.page-header a,
.page-header .print-btn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: 0.85rem;
  text-decoration: none;
}
.page-header a {
  padding: 0 0.5rem;
}
.page-header a:hover,
.page-header .print-btn:not(:disabled):hover {
  color: var(--text);
}
/* OSE-286: the Print control became a <button>; reset native chrome so
   it reads as the header link it replaced, and dim it while disabled. */
.print-controls {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
}
/* display:inline-flex beats the UA's [hidden]; Digital hides Print. */
.print-controls[hidden] {
  display: none;
}
.print-btn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  background: none;
  border: none;
  padding: 0 0.5rem;
  cursor: pointer;
  font-family: inherit;
}
.print-btn:disabled,
.print-btn[disabled] {
  cursor: not-allowed;
  opacity: 0.45;
}
.print-status {
  font-size: 0.75rem;
  color: var(--text-muted);
}
.container {
  max-width: 680px;
  margin: 2rem auto;
  padding: 0 1rem;
}
.poster {
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  border: 1px solid var(--border);
}
.poster-header {
  background: var(--surface);
  color: var(--text);
  padding: 2.5rem 2rem 2rem;
  text-align: center;
}
.poster {
  --title-base: clamp(1.75rem, 5.6vw, 2.75rem);
}
.poster[data-art='0'] {
  --title-base: clamp(2.25rem, 7.5vw, 3.75rem);
}
.poster-header h2 {
  font-size: calc(var(--title-base) * var(--title-scale, 1));
  font-weight: 800;
  line-height: 1.12;
  white-space: nowrap;
}
.poster-header h2[data-title-step='1'] {
  --title-scale: 0.86;
}
.poster-header h2[data-title-step='2'] {
  --title-scale: 0.74;
}
.poster-header h2[data-title-step='3'] {
  --title-scale: 0.62;
}
.poster-header h2[data-title-step='4'] {
  --title-scale: 0.52;
  white-space: normal;
}
.poster-body {
  padding: 2rem;
}
.poster-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  column-gap: 0.6rem;
  margin-bottom: 1.25rem;
  text-align: center;
}
.meta-item + .meta-item::before {
  content: '\00b7';
  margin-right: 0.6rem;
  color: var(--text-muted);
}
.poster[data-art='0'] .poster-meta .meta-text {
  font-size: 1.35rem;
}
.meta-text {
  font-size: 1rem;
  color: var(--text-muted);
}
/* @ocr/ui-ready: colours come from the shared design tokens (--surface-hover,
   --border, --text-muted), not hardcoded hex — so the poster art viewport
   can be adopted by @ocr/ui / synced to Claude Design without a re-skin. */
.poster-art {
  margin: 1rem 0 1.25rem;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-hover);
}
.poster-art-img {
  display: block;
  width: 100%;
  max-height: min(88vh, 1100px);
  object-fit: contain;
}
/* #poster-qr-slots: the one flex child of .qr-section. */
.qr-slots {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
  width: 100%;
}
/* Printed /s link under each QR (not .qr-link-url, so print keeps it). */
.qr-slot-code {
  display: block;
  margin: 0.35rem auto 0;
  max-width: 120px;
  font-size: 0.62rem;
  line-height: 1.3;
  color: var(--text-muted);
  word-break: break-all;
  text-align: center;
}
/* OSE-1357: one word per code; same size for every kind. */
.code-card {
  border-top: 6px solid var(--border);
}
.code-word {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
}
.code-action {
  display: block;
  margin: 0.1rem auto 0;
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text);
  text-align: center;
}
.qr-section {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
  padding: 1.5rem 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.qr-item {
  text-align: center;
}
.qr-loading {
  width: 120px;
  height: 120px;
  background: var(--surface-hover);
  border: 2px dashed var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 0.5rem;
  font-size: 1.25rem;
  color: var(--text-muted);
}
.qr-img {
  width: 120px;
  height: 120px;
  display: block;
  margin: 0 auto 0.5rem;
  image-rendering: pixelated;
}
.qr-link {
  display: block;
  color: inherit;
  text-decoration: none;
}
.qr-link:hover .qr-img {
  opacity: 0.85;
}
.qr-link-url {
  display: block;
  font-size: 0.6rem;
  color: var(--text-muted);
  word-break: break-all;
  margin-top: 0.25rem;
  max-width: 120px;
  text-align: center;
}
.qr-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
/* OSE-887: GAS .qr-card frame around each poster QR (loadPosterQR). */
.qr-card {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}
.qr-card-header {
  padding: 0.4rem 0.75rem;
  background: var(--surface-hover);
  border-bottom: 1px solid var(--border);
}
.qr-card-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1rem 0.9rem;
}
.poster--digital .poster-art-img {
  max-height: min(92vh, 1200px);
}
.poster--digital .qr-img,
.poster--digital .qr-loading {
  display: none;
}
.poster--digital .qr-slot-code {
  max-width: none;
  font-size: 0.85rem;
}
.meta-text a,
.poster--digital .qr-slot-code {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--accent);
}
.poster-stage {
  position: relative;
  margin: 1rem 0 1.25rem;
}
.poster-art {
  margin: 0 0 1.25rem;
}
.poster-stage .qr-section {
  margin-bottom: 0;
}
.poster[data-layout] .qr-img,
.poster[data-layout] .qr-loading {
  width: var(--code-size);
  height: var(--code-size);
}
.poster[data-layout='row'],
.poster[data-layout='corners'] {
  --code-size: clamp(100px, 24vw, 144px);
}
.poster[data-layout='side'] {
  --code-size: clamp(100px, 16vw, 130px);
}
.poster[data-layout='grid'] {
  --code-size: clamp(100px, 18vw, 130px);
}
.poster[data-layout='row'] .qr-card,
.poster[data-layout='side'] .qr-card,
.poster[data-layout='corners'] .qr-card {
  width: calc(var(--code-size) + 1.5rem);
  overflow-wrap: anywhere;
}
.poster[data-layout='row'] .qr-card-body,
.poster[data-layout='side'] .qr-card-body {
  padding: 0.75rem 0.4rem;
}
.poster[data-layout='row'] .qr-slots {
  gap: 0.75rem;
}
.poster[data-layout='corners'] .poster-art {
  margin: 0;
  min-height: 15rem;
}
.poster[data-layout='corners'] .qr-section {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0.6rem;
  margin: 0;
  border: 0;
  pointer-events: none;
}
.poster[data-layout='corners'] .qr-slots {
  flex-wrap: nowrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.5rem;
}
.poster[data-layout='corners'] .qr-card {
  pointer-events: auto;
  background: white;
  border-color: var(--border);
}
.poster[data-layout='corners'] .qr-card-header {
  background: transparent;
  border-bottom: 0;
  padding: 0.3rem 0.5rem 0;
}
.poster[data-layout='corners'] .qr-card-body {
  padding: 0.3rem 0.5rem 0.5rem;
}
.poster[data-layout='corners'] .qr-card,
.poster[data-layout='corners'] .qr-card span,
.poster[data-layout='corners'] .qr-card a {
  color: black;
}
.poster[data-layout='side'] .poster-stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 1rem;
  align-items: start;
}
.poster[data-layout='side'] .poster-art {
  margin: 0;
}
.poster[data-layout='side'] .qr-section {
  margin: 0;
  padding: 0;
  border: 0;
}
.poster[data-layout='side'] .qr-slots {
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: 1rem;
}
.poster[data-layout='grid'] .qr-slots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  justify-items: center;
}
.poster[data-layout='grid'] .qr-card {
  width: min(100%, 15rem);
}
.poster-footer {
  text-align: center;
  padding: 1rem;
  background: var(--surface-hover);
  font-size: 0.8rem;
  color: var(--text-muted);
}
.loading {
  text-align: center;
  padding: 4rem;
  color: var(--text-muted);
}
.error {
  text-align: center;
  padding: 3rem;
  color: var(--error);
}
.event-select {
  margin-bottom: 1.5rem;
}
.event-select label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 0.375rem;
}
.event-select select {
  width: 100%;
  min-height: 44px;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  font-size: 16px;
  background: var(--surface);
  color: var(--text);
}
.poster-sponsors {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 1rem 2rem;
  flex-wrap: wrap;
}
.poster-sponsors:empty {
  display: none;
}
.poster-sponsor {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
/* OSE-864/#25: ONE uniform logo box for every sponsor regardless of tier.
   Responsive (clamp) across viewports, tier-blind — money buys frequency,
   never size. WALL-3b (OSE-835) fails CI on any tier-keyed sponsor geometry. */
.poster-sponsor img {
  height: clamp(24px, 4.5vw, 40px);
  width: auto;
  max-width: clamp(80px, 14vw, 140px);
  object-fit: contain;
}
.poster-sponsor-name {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}
.poster-sponsor-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 0.35rem;
}
/* OSE-864/#25: no tier-keyed sponsor CSS (WALL-3b). */
.page-header a:focus-visible,
.page-header .print-btn:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 2px;
}
.event-select select:focus {
  border-color: var(--accent);
  outline: 2px solid var(--accent);
  outline-offset: 0;
}
.skip-link {
  position: absolute;
  left: -9999px;
  top: auto;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.skip-link:focus {
  position: fixed;
  top: 0;
  left: 0;
  width: auto;
  height: auto;
  padding: 0.5rem 1rem;
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
  z-index: 9999;
  text-decoration: none;
  border-bottom: 2px solid var(--accent);
}
/* OSE-300: phone layout (tighter padding, 100px QR, 44px/16px controls). */
@media (max-width: 768px) {
  .page-header {
    padding: 0.75rem 1rem;
  }
  .container {
    padding: 0 .75rem;
    margin: 1rem auto;
  }
  .poster-header {
    padding: 1.75rem 1.25rem 1.5rem;
  }
  .poster-meta {
    flex-direction: column;
    align-items: center;
  }
  .meta-item + .meta-item::before {
    content: none;
  }
  .poster[data-art='0'] .poster-meta .meta-text {
    font-size: 1.1rem;
  }
  .poster-body {
    padding: 1.25rem 1rem;
  }
  .event-select select {
    padding: 0.65rem 0.75rem;
  }
  .qr-section {
    gap: 1rem;
    padding: 1.25rem 0;
  }
  .qr-img,
  .qr-loading {
    width: 100px;
    height: 100px;
  }
  .poster-art-img,
  .poster--digital .poster-art-img {
    max-height: 80vh;
  }
  .qr-link-url {
    max-width: 100px;
    word-break: break-all;
  }
  .poster-sponsors {
    padding: 1rem;
    gap: 1rem;
  }
}
@media print {
  @page {
    size: 11in 14in;
    margin: 0.35in;
  }
  /* Raw hex here is deliberate + baseline-gated: print is PAPER (white,
     dark ink, theme-invariant). A theme token would print dark-on-dark.
     Goes to 0 when /ui.css gains a print :root of light tokens. */
  .page-header,
  .event-select,
  .no-print {
    display: none !important;
  }
  body {
    background: #fff !important;
    color: #1e293b !important;
  }
  .poster {
    background: #fff !important;
  }
  /* OSE-R-006 (audit 2026-05-15): force-print backgrounds + sponsor
   colors. Sponsors paid for full-color logo placement; pre-fix the
   print rule grayscaled them and the dark-navy poster header dropped
   to white-on-white. Both broke the printed-poster value promise. */
  body,
  .poster,
  .poster-header,
  .poster-sponsors,
  .poster-sponsor,
  .poster-sponsor img,
  .code-card {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }
  body {
    background: #fff;
  }
  .container {
    margin: 0;
    max-width: 100%;
  }
  /* Keep the whole poster on one page when it fits; otherwise allow
   orderly breaks at the major section boundaries. */
  .poster {
    box-shadow: none;
    border: none;
    page-break-inside: avoid;
    min-height: 13.25in;
  }
  .poster-header {
    padding: 0.45in 0.35in 0.3in;
  }
  .poster {
    --title-base: 38pt;
  }
  .poster[data-art='0'] {
    --title-base: 46pt;
  }
  .poster-header h2 {
    line-height: 1.05;
    font-size: max(36pt, calc(var(--title-base) * var(--title-scale, 1)));
    white-space: normal;
  }
  .poster-body {
    padding: 0.3in 0.35in 0.25in;
  }
  .poster-meta {
    margin-bottom: 0.2in;
  }
  .poster .poster-meta .meta-text {
    font-size: 14pt;
  }
  .poster[data-art='0'] .poster-meta .meta-text {
    font-size: 18pt;
  }
  .qr-section {
    page-break-inside: avoid;
    padding: 0.18in 0;
    gap: 0.3in;
  }
  .poster-sponsors {
    page-break-inside: avoid;
    border-top: 1px solid #ccc;
    padding: 0.75rem 1rem;
  }
  /* OSE-R-006: NO grayscale on sponsor logos in print. Keep the
   max-height clamp so logos still fit a printed A4 page — that part
   was a layout decision, separate from the color issue. */
  .poster-sponsor img {
    max-height: 20px;
  }
  .poster-sponsor-name,
  .poster-sponsor-label {
    color: #000;
  }
  .qr-loading {
    display: none !important;
  }
  .poster-art {
    page-break-inside: avoid;
    margin: 0.12in 0 0.2in;
  }
  .poster-art-img {
    max-height: 7in;
    object-fit: contain;
  }
  /* OSE-286: defensive move for Cmd+P bypassing the disabled button —
     if ANY QR is still a loading placeholder, hide the whole section so
     the poster never prints empty labeled boxes where codes belong. */
  .qr-section:has(.qr-loading) {
    display: none !important;
  }
  .qr-link-url {
    display: none !important;
  }
  /* OSE-887: flatten the .qr-card chrome for print so the poster keeps its
     clean label-over-QR look (no card borders/fills on the page). */
  .qr-card {
    border: none;
  }
  .qr-card-header {
    background: transparent;
    border-bottom: none;
    padding: 0 0 0.2rem;
  }
  .qr-card-body {
    padding: 0.12in;
    background: white;
  }
  .qr-img {
    width: 1.25in;
    height: 1.25in;
    margin: 0 auto 0.08in;
    padding: 0.08in;
    background: white;
  }
  .poster[data-layout] .qr-img,
  .poster[data-layout] .qr-loading {
    width: var(--code-in, 1.25in);
    height: var(--code-in, 1.25in);
  }
  .poster[data-layout='grid'] .poster-art-img {
    max-height: calc(var(--art-max-in, 7) * 1in);
  }
  .poster[data-layout='corners'] .poster-art {
    min-height: 2.6in;
  }
  .poster[data-layout='corners'] .qr-card {
    width: 1.9in;
  }
  .poster[data-layout='row'] .qr-card,
  .poster[data-layout='side'] .qr-card {
    width: calc(var(--code-in, 1.25in) + 0.5in);
  }
  .poster[data-layout='corners'] .qr-section {
    padding: 0.15in;
  }
  .poster[data-layout='corners'] .qr-card-header {
    padding: 0.05in 0.1in 0;
  }
  .poster[data-layout='corners'] .qr-card-body {
    padding: 0.05in 0.1in 0.1in;
  }
  .poster[data-layout='grid'] .qr-section {
    padding: 0.08in 0;
  }
  .poster[data-layout='grid'] .qr-slots {
    gap: 0.1in 0.2in;
  }
  .poster[data-layout='grid'] .qr-card-header {
    padding: 0 0 0.04in;
  }
  .poster[data-layout='grid'] .qr-card-body {
    padding: 0.04in 0.1in;
  }
  .poster[data-layout='grid'] .qr-img {
    margin-bottom: 0.04in;
  }
  .poster[data-layout='grid'] .qr-slot-code {
    max-width: none;
    margin-top: 0.1rem;
    font-size: 0.55rem;
    line-height: 1.2;
  }
}

  <body>
    <a href="#main-content" class="skip-link" data-testid="poster-skip-link">Skip to content</a>
    <div class="page-header no-print" data-testid="poster-header" style="flex-wrap:wrap;gap:0 0.75rem">
      <!-- The title is the EVENT's (poster-page-title is filled with its name);
           the OurSharedEvents name lives at the bottom of the poster only. -->
      <h1 class="sr-only" id="poster-page-title" data-testid="poster-page-title">Event poster</h1>
      <!-- Print keeps the QR codes and a large art area; Digital drops the
           codes (it's already on a screen — the short links are tappable),
           gives the art the room, and turns the date/venue into taps. The URL
           is the state (?kind=), so Back and a shared link keep the choice. -->
      <!-- One tap back to the event's page and the list (lib/event-nav.ts is
           the same set of links on the event page). Hidden when printing. -->
      <nav class="poster-kind" aria-label="This event" data-testid="poster-event-nav">
        <a href="/events" data-testid="poster-nav-events">&larr; All events</a>
      </nav>
      <nav class="poster-kind" aria-label="Poster type" data-testid="poster-kind">
        <a href="?kind=print" data-kind="print" data-testid="poster-kind-print">Print</a>
        <a href="?kind=digital" data-kind="digital" data-testid="poster-kind-digital">Digital</a>
      </nav>
      <!-- OSE-286 / OSE-R-020: Print is a real <button> that STARTS disabled and
           is re-enabled by the gate script only once all QR codes settle, so a
           poster is never printed with empty QR boxes. (It replaced a
           `javascript:window.print()` anchor, which the nonce CSP blocks and
           which cannot be disabled.) -->
      <div class="print-controls" id="poster-print-controls">
        <span id="poster-print-status" class="print-status" data-testid="poster-print-status" role="status" aria-live="polite">QR codes loading&hellip;</span>
        <button type="button" id="poster-print-btn" class="print-btn" data-testid="poster-print" disabled aria-disabled="true" aria-label="Print poster"><span aria-hidden="true">&#x1F5A8;</span> Print</button>
      </div>
    </div>
    <main id="main-content" class="container" data-testid="poster-container">
      <div class="event-select no-print" id="poster-event-select" data-testid="poster-event-select">
        <label for="event-picker">Select Event</label>
        <select id="event-picker" data-testid="poster-event-picker">
          <option value="">Loading events&hellip;</option>
        </select>
      </div>
      <div id="poster-area" data-testid="poster-area">
        <p class="loading" data-testid="poster-loading" role="status">Loading&hellip;</p>
      </div>
    </main>
    <script>
      // ONE escaper for every value this page writes into markup, safe as
      // element text AND as the value of a quoted attribute: it escapes all five
      // of & < > " '. The browser mirror of lib/html-escape.ts escapeHtml, which
      // client code can't import. The helper it replaces was built on
      // textContent/innerHTML, which leaves quote marks alone, so an event name
      // holding a quote mark ended the attribute it was written into. Escape at
      // the write, never ahead of it. Not for an unquoted attribute or a style.
      // Not enough for an address by itself: an address is built here from a
      // fixed start, or passes posterArtAddress / slotLink / slotPicture first.
      window.escapePosterHtml = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      const esc = window.escapePosterHtml;
      // OSE-1313 — dates and times render in the EVENT's zone, never the
      // viewer's. A timed event carries its UTC instant in starts_at; a
      // date-only YYYY-MM-DD is a calendar date, pinned via UTC so no zone can
      // shift it a day (and it shows no invented time).
      const inZone = (iso, tz, opts) => {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return ''; // dirty value: render nothing, never throw
        try { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz || 'UTC' }, opts)).format(d); }
        catch (e) { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, opts)).format(d); } // unknown zone only
      };
      const DATE_OPTS = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
      const fmtEventDate = ev => {
        if (ev.starts_at) return inZone(ev.starts_at, ev.timezone, DATE_OPTS);
        const d = String(ev.startDateISO || '').slice(0, 10);
        return /^\d{4}-\d{2}-\d{2}$/.test(d) ? inZone(d + 'T00:00:00Z', 'UTC', DATE_OPTS) : '';
      };
      const fmtEventTime = ev => ev.starts_at ? inZone(ev.starts_at, ev.timezone, { hour:'numeric', minute:'2-digit', timeZoneName:'short' }) : '';

      // OSE-286: the Print button is gated on QR readiness. It starts disabled
      // (in the markup) and toggles here as posters render and their codes
      // settle, so a poster is never printed with empty QR boxes.
      function setPrintReady(ready) {
        const btn = document.querySelector('[data-testid="poster-print"]');
        const status = document.getElementById('poster-print-status');
        if (btn) {
          btn.disabled = !ready;
          btn.setAttribute('aria-disabled', ready ? 'false' : 'true');
        }
        if (status) status.style.display = ready ? 'none' : '';
      }
      // Resolve once every rendered QR <img> has loaded or errored. Data-URI
      // codes settle almost immediately; a slow venue link is exactly the case
      // this waits out. No images (all failed / none injected) → resolve now.
      // 0083: sponsor logos are part of the printed page too (they load through
      // the same-origin proxy, or swap to the OSE default), so Print also waits
      // for their images to settle. The strip itself renders from the same
      // poster-bundle call before this runs (OSE-867), so there is no separate
      // sponsor request to wait on.
      function awaitQrImages() {
        const imgs = Array.prototype.slice.call(document.querySelectorAll('.qr-section .qr-img, [data-testid="poster-sponsor-logo"]'));
        if (!imgs.length) return Promise.resolve();
        return Promise.all(imgs.map(function (img) {
          if (img.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        }));
      }

      // Print (default) or Digital, from ?kind= — the URL is the state.
      const KIND = new URLSearchParams(location.search).get('kind') === 'digital' ? 'digital' : 'print';

      // Keep the URL, the Print|Digital links, the page title and the print
      // controls in step with the event on show.
      function syncChrome(event) {
        const params = new URLSearchParams(location.search);
        if (event && event.id) params.set('event', event.id);
        params.set('kind', KIND);
        try { history.replaceState(null, '', '?' + params.toString()); } catch (e) { /* sandboxed */ }
        document.querySelectorAll('[data-kind]').forEach(function (a) {
          const p = new URLSearchParams(params);
          p.set('kind', a.getAttribute('data-kind'));
          a.setAttribute('href', '?' + p.toString());
          if (a.getAttribute('data-kind') === KIND) a.setAttribute('aria-current', 'page');
          else a.removeAttribute('aria-current');
        });
        // The event's other screens, one tap away (the same links as the event
        // page's nav, lib/event-nav.ts). A draft preview has no public page or
        // TV yet, so it keeps only "All events".
        const eventNav = document.querySelector('[data-testid="poster-event-nav"]');
        if (eventNav && event && event.id && !PREVIEW_EVENT) {
          const eid = encodeURIComponent(event.id);
          [['poster-nav-event', '/events/' + eid, 'Event page'], ['poster-nav-display', '/display?event=' + eid, 'TV display']].forEach(function (l) {
            let a = eventNav.querySelector('[data-testid="' + l[0] + '"]');
            if (!a) { a = document.createElement('a'); a.setAttribute('data-testid', l[0]); a.textContent = l[2]; eventNav.appendChild(a); }
            a.setAttribute('href', l[1]);
          });
        }
        const title = document.getElementById('poster-page-title');
        if (title && event && event.name) title.textContent = event.name + (KIND === 'digital' ? ' — digital poster' : ' — poster');
        const controls = document.getElementById('poster-print-controls');
        if (controls) controls.hidden = KIND === 'digital';
      }

      /* poster-layout:begin */
      // OSE-1516 — the poster arranges itself from what the event has: how many
      // codes, whether there is artwork, whether there are sponsors. The
      // organizer picks nothing. Pure and DOM-free (tests run it as a function).
      //
      // Layouts: no artwork -> 'row' (the art area is not drawn at all); artwork
      // and no codes yet -> 'art'; 1-2 codes -> 'corners' (on top of the art, on
      // white tiles); 3 -> 'side' (a column beside the art); 4-8 -> 'grid' (two
      // columns under the art). Codes keep their size ahead of the artwork: none
      // is ever under 100px, and with many codes it is the ARTWORK that gives
      // way (eight codes = four rows of two; the art shrinks to what is left of
      // the sheet but is never dropped; the sheet does not get taller).
      //
      // A placement is a NAMED SPOT ('art-bottom-left', 'side-2', 'grid-5'),
      // never a pixel position, so a later drag-and-drop only has to say which
      // spot a code takes.
      var POSTER_MAX_CODES = 8;
      var POSTER_CODE_FLOOR_PX = 100;
      var POSTER_SHEET_IN = 13.3; // 14in sheet less its 0.35in margins
      var POSTER_ART_FULL_IN = 7;
      var POSTER_CHROME_IN = 3.25; // title, details, footer and padding (measured in print, 2026-10-04)
      var POSTER_SPONSORS_IN = 0.5; // the sponsor strip
      var POSTER_GRID_PAD_IN = 0.3; // the code section's own padding
      var POSTER_GRID_ROW_IN = 1.85; // one row of two codes, label and link included
      // What scanning each kind does, by kind. Allowlist; unknown kinds read as
      // 'learn more'. The label never comes from the bundle.
      var POSTER_ACTIONS = Object.assign(Object.create(null), {
        public: 'see the event',
        checkin: 'check in',
        register: 'register',
        donation: 'donate',
        sponsor: 'become a sponsor',
        signup: 'sign up',
        tickets: 'get tickets',
        ow: 'hear the music',
        league: 'see the league',
        workshop: 'register',
        substack: 'subscribe',
        menu: 'see the menu',
        website: 'learn more'
      });
      function posterActionLabel(kind, digital) {
        var what = POSTER_ACTIONS[String(kind == null ? '' : kind)] || 'learn more';
        return (digital ? 'Tap to ' : 'Scan to ') + what;
      }
      // Where the title starts (0 = full size .. 4 = smallest, may wrap), from
      // its length. The page then steps further down while it still overflows.
      function posterTitleStep(name) {
        var n = String(name == null ? '' : name).length;
        return n <= 20 ? 0 : n <= 28 ? 1 : n <= 38 ? 2 : n <= 50 ? 3 : 4;
      }
      function posterLayout(input) {
        var i = input || {};
        var n = Math.floor(Number(i.codes));
        if (isNaN(n) || n < 0) n = 0;
        if (n > POSTER_MAX_CODES) n = POSTER_MAX_CODES;
        var art = !!i.hasArt;
        var sponsors = !!i.hasSponsors;
        var out = {
          layout: 'row', count: n, art: art, sponsors: sponsors,
          columns: 0, rows: 0, spots: [],
          codeIn: 1.5, codeMinPx: POSTER_CODE_FLOOR_PX,
          artMaxIn: null, titleSize: art ? 'normal' : 'large'
        };
        var k;
        if (!art) {
          out.columns = Math.min(n, 4);
          out.rows = Math.ceil(n / 4);
          out.codeIn = n > 4 ? 1.3 : 1.5;
          for (k = 1; k <= n; k++) out.spots.push('row-' + k);
          return out;
        }
        out.artMaxIn = POSTER_ART_FULL_IN;
        if (n === 0) {
          out.layout = 'art';
        } else if (n <= 2) {
          out.layout = 'corners';
          out.columns = n;
          out.rows = 1;
          out.spots = ['art-bottom-left', 'art-bottom-right'].slice(0, n);
        } else if (n === 3) {
          out.layout = 'side';
          out.columns = 1;
          out.rows = 3;
          out.codeIn = 1.25;
          out.spots = ['side-1', 'side-2', 'side-3'];
        } else {
          out.layout = 'grid';
          out.columns = 2;
          out.rows = Math.ceil(n / 2);
          out.codeIn = 1.05;
          for (k = 1; k <= n; k++) out.spots.push('grid-' + k);
          var chrome = sponsors ? POSTER_CHROME_IN + POSTER_SPONSORS_IN : POSTER_CHROME_IN;
          var left = POSTER_SHEET_IN - chrome - POSTER_GRID_PAD_IN - out.rows * POSTER_GRID_ROW_IN;
          out.artMaxIn = Math.round(Math.min(POSTER_ART_FULL_IN, left) * 10) / 10; // never under 1.5in: the unit tests hold it
        }
        return out;
      }
      /* poster-layout:end */

      // Hold the title to one line: start on the step its length suggests, then
      // step down while it is still wider than its room (with a little spare,
      // because paper is a touch tighter than the screen it was measured on).
      function fitPosterTitle() {
        const h = document.querySelector('[data-testid="poster-title"]');
        if (!h) return;
        let step = posterTitleStep(h.textContent);
        h.setAttribute('data-title-step', String(step));
        // The width of the text itself (the block's own scrollWidth is never
        // less than its box, so it cannot say whether the text fits).
        const textWidth = function () {
          const r = document.createRange();
          r.selectNodeContents(h);
          return typeof r.getBoundingClientRect === 'function' ? r.getBoundingClientRect().width : 0;
        };
        while (step < 4 && h.clientWidth > 0 && textWidth() * 1.06 > h.clientWidth) {
          step++;
          h.setAttribute('data-title-step', String(step));
        }
      }
      // Re-read what the poster has (codes drawn, artwork on screen, sponsors)
      // and set the layout. Called once the bundle is drawn and whenever the
      // artwork drops out (the image failed).
      function relayoutPoster() {
        const p = document.querySelector('[data-testid="poster-card"]');
        if (!p) return;
        const cards = Array.prototype.slice.call(p.querySelectorAll('#poster-qr-slots .code-card'));
        const l = posterLayout({
          codes: cards.length,
          hasArt: !!p.querySelector('.poster-art'),
          hasSponsors: !!p.querySelector('[data-testid="poster-sponsor-item"]')
        });
        p.setAttribute('data-layout', l.layout);
        p.setAttribute('data-codes', String(l.count));
        p.setAttribute('data-art', l.art ? '1' : '0');
        p.style.setProperty('--code-in', l.codeIn + 'in');
        if (l.artMaxIn === null) p.style.removeProperty('--art-max-in');
        else p.style.setProperty('--art-max-in', String(l.artMaxIn));
        cards.forEach(function (c, idx) {
          if (l.spots[idx]) c.setAttribute('data-spot', l.spots[idx]);
          else c.removeAttribute('data-spot');
        });
        fitPosterTitle();
      }
      window.addEventListener('resize', fitPosterTitle);

      // The artwork address is typed: events.cover_image_url is free text, and
      // nothing checks it when it is saved. It is drawn only when it is a path
      // on this site (what the admin's artwork upload saves) or an https
      // address, the rule slotLink() keeps for a code's link. Anything else
      // (javascript:, data:, plain http, another host with no scheme) is the
      // same as no artwork. Escaping keeps an address inside its attribute; it
      // does not decide what the address is.
      function posterArtAddress(raw) {
        const u = String(raw == null ? '' : raw);
        if (/^\/(?![\/\\])[^\s"'<>]*$/.test(u) || /^https:\/\/[^\s"'<>]+$/.test(u)) return u;
        return '';
      }

      function renderPoster(event) {
        // OSE-844 (X-10): the API item now carries name/startDateISO/venue
        // directly (mapped in enrichWithPhase). The old `const data = event.data
        // || {}` first branch was permanently dead — no SELECT ever exposed a
        // `data` column — so it is removed and the banned 'Event' fallback with
        // it. A genuinely-missing value renders its empty state, not a literal.
        const venue = event.venue || '';
        const startDate = fmtEventDate(event);
        const startTime = fmtEventTime(event);
        const name = event.name || '';
        // R4 — poster art viewport. Source is the event's cover image (public
        // projection allowlist includes cover_image_url). Snake/camel tolerant
        // so it works whether or not enrichWithPhase renames the field.
        // Only an address posterArtAddress() lets through is drawn. (Its own
        // name, not `art`: posterLayout() has a yes/no of that name.)
        const artAddress = posterArtAddress(event.cover_image_url || event.coverImageUrl);

        // Digital: the date adds itself to a calendar, the venue opens a map.
        // Print has nothing to tap, so it stays plain text. Both addresses are
        // a fixed start with one encoded value after it.
        const digital = KIND === 'digital';
        const whenText = esc(startDate) + (startTime ? ' &mdash; ' + esc(startTime) : '');
        const whenHtml = digital && event.id
          ? '<a href="/events/' + encodeURIComponent(event.id) + '/calendar.ics" download data-testid="poster-add-to-calendar">' + whenText + ' &middot; Add to calendar</a>'
          : whenText;
        const venueHtml = digital
          ? '<a href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(venue) + '" target="_blank" rel="noopener noreferrer" data-testid="poster-open-map">' + esc(venue) + ' &middot; Map</a>'
          : esc(venue);

        // OSE-1516: the layout starts from the artwork alone (the codes are not
        // here yet); relayoutPoster() redoes it once they and the sponsors are.
        const first = posterLayout({ codes: 0, hasArt: !!artAddress, hasSponsors: false });

        return '<div class="poster' + (digital ? ' poster--digital' : '') + '" data-testid="poster-card" data-kind="' + esc(KIND) + '" data-layout="' + esc(first.layout) + '" data-codes="0" data-art="' + (artAddress ? '1' : '0') + '" role="article" aria-label="' + esc(name) + ' event poster">' +
          '<div class="poster-header" data-testid="poster-card-header">' +
            '<h2 data-testid="poster-title">' + esc(name) + '</h2>' +
          '</div>' +
          // Sponsors sit directly below the title, above the details, artwork
          // and codes — the same place as on the public event page.
          '<div id="poster-sponsor-strip" class="poster-sponsors" data-testid="poster-sponsor-strip" role="list" aria-label="Event sponsors"></div>' +
          '<div class="poster-body" data-testid="poster-body">' +
            // OSE-1516: date, start time and venue are ONE line.
            '<div class="poster-meta" data-testid="poster-meta">' +
            (startDate ? '<span class="meta-item" data-testid="poster-meta-date"><span class="meta-text">' + whenHtml + '</span></span>' : '') +
            (venue ? '<span class="meta-item" data-testid="poster-meta-venue"><span class="meta-text">' + venueHtml + '</span></span>' : '') +
            '</div>' +
            // The stage holds the artwork and the codes. No artwork: the art area
            // is not drawn at all (nothing dashed, nothing to hide in print).
            '<div class="poster-stage" data-testid="poster-stage">' +
            (artAddress
              ? '<div class="poster-art" data-testid="poster-art-viewport">' +
                '<img class="poster-art-img" src="' + esc(artAddress) + '" alt="' + esc(name) + ' artwork" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="poster-art-img">' +
                '</div>'
              : '') +
            '<div class="qr-section" data-testid="poster-qr-section">' +
              // Typed destination slots (/q tracking + /s routing → Public /
              // Donate / Sign Up). loadPosterBundle fills this from bundle.slots. The
              // .qr-loading placeholder keeps the print gate closed until codes
              // settle. NOT the forms (register/checkin/survey/feedback are a
              // separate, destroyed-by-cron implementation — off the poster).
              '<div id="poster-qr-slots" class="qr-slots" data-testid="poster-qr-slots"><div class="qr-loading" aria-busy="true">&#x23F3;</div></div>' +
            '</div>' +
            '</div>' +
          '</div>' +
          '<div class="poster-footer" data-testid="poster-footer"><span data-testid="poster-org">OurSharedEvents</span> &middot; oursharedevents.com</div>' +
        '</div>';
      }

      // OSE-1081: `event` is the CANONICAL surface deep-link param —
      // admin.html's scopedSurfaceUrl() emits /poster?event=<id>.
      // OSE-867: a scoped poster is ONE network call. poster-bundle carries the
      // event (title / start / venue under the public projection's names), the
      // sponsor strip and the QR slots, so nothing else is fetched: no events
      // list, no sponsor-bundle. An event the bundle refuses (unknown, draft,
      // archived) says so — it never silently falls back to some other event.
      // Set only by the admin poster preview (draft events, admin-only route).
      const PREVIEW_EVENT = document.body.getAttribute('data-preview-event') || '';

      async function init() {
        const picker = document.getElementById('event-picker');
        const area = document.getElementById('poster-area');
        // Admin preview (a draft): the server names the event on <body>.
        const wanted = PREVIEW_EVENT || new URLSearchParams(location.search).get('event');
        if (wanted) {
          document.getElementById('poster-event-select').hidden = true;
          const shown = await loadPosterBundle(wanted, true);
          if (!shown) {
            area.innerHTML = '<p class="error" data-testid="poster-error" role="alert">This poster is not available. The event may not be live yet.</p>';
          }
          return;
        }
        // No event named: offer the picker. The list is navigation; each
        // chosen poster still loads through its single bundle call.
        try {
          const res = await fetch('/api/v2/events');
          const data = await res.json();
          const items = (data.ok && data.items) ? data.items : [];
          if (!items.length) {
            picker.innerHTML = '<option>No events available</option>';
            area.innerHTML = '<p class="loading" data-testid="poster-empty" role="status">No events scheduled.</p>';
            return;
          }
          picker.innerHTML = items.map((e, i) =>
            // OSE-844: read the single canonical `name`; fall back to the event
            // id (always present) so options stay distinguishable without the
            // banned Untitled-Event literal that made every option identical.
            '<option value="' + esc(i) + '">' + esc(e.name || e.id || '') + '</option>'
          ).join('');
          const show = (item) => {
            area.innerHTML = renderPoster(item);
            syncChrome(item);
            loadPosterBundle(item.id, false);
          };
          picker.value = '0';
          show(items[0]);
          picker.addEventListener('change', () => {
            const idx = parseInt(picker.value, 10);
            if (!isNaN(idx) && items[idx]) show(items[idx]);
          });
        } catch {
          area.innerHTML = '<p class="error" data-testid="poster-error" role="alert">Could not load events.</p>';
        }
      }
      // The sponsor strip, rendered from the bundle's `sponsors` (OSE-867 —
      // the same set sponsor-bundle?surface=poster serves). Print-safe: no
      // links; logos hide themselves on error (see the capture listener below).
      function renderPosterSponsors(sponsors) {
        const strip = document.getElementById('poster-sponsor-strip');
        if (!strip) return;
        strip.setAttribute('aria-busy', 'false');
        if (!Array.isArray(sponsors) || !sponsors.length) { strip.innerHTML = ''; return; }
        strip.innerHTML = '<div class="poster-sponsor-label" data-testid="poster-sponsor-label">Sponsored By</div>' +
          sponsors.map(function(s) {
            // OSE-R-015 (2026-05-15): referrerpolicy + data-hide-on-error.
            // 0083: logo via the same-origin proxy (external URLs are CSP-
            // blocked here), or the OSE default; title = display_name → name.
            // The title is typed and sits in attributes: esc() escapes quotes.
            const title = s.title || s.name;
            const logo = '<img src="' + (s.logo_url ? '/api/v2/sponsors/' + encodeURIComponent(s.id) + '/logo' : '/sponsor-default-logo.svg') + '" alt="' + esc(title) + '" referrerpolicy="no-referrer" data-hide-on-error="1" data-default-src="/sponsor-default-logo.svg" data-testid="poster-sponsor-logo">';
            const validTiers = ['title','platinum','gold','silver','bronze','primary'];
            // data-tier retained for rotation/frequency-share identity only; NO
            // poster-sponsor--<tier> class — #25 forbids tier-keyed geometry (OSE-864).
            const tier = validTiers.indexOf(String(s.tier || '')) >= 0 ? s.tier : 'primary';
            return '<div class="poster-sponsor" data-tier="' + esc(tier) + '" data-testid="poster-sponsor-item" role="listitem" aria-label="' + esc(title) + '">' + logo + '<span class="poster-sponsor-name" data-testid="poster-sponsor-name">' + esc(title) + '</span></div>';
          }).join('');
        rotatePosterSponsors(strip);
      }
      // Digital poster: one sponsor at a time, each in turn. Tier-blind — every
      // sponsor gets the same share of the cycle. The print poster shows all of
      // them at once, since paper cannot rotate. A hidden tab holds its place.
      //
      // The TV display moves sponsors across the screen; the poster is tall, so
      // here they travel up and down. All motion is declared below as data and
      // played with element.animate(), so a new entrance or scene is one more
      // entry and no stylesheet change.
      var POSTER_SPONSOR_ROTATE_MS = 5000;
      var posterSponsorTimer = null;
      // How the next sponsor arrives.
      var POSTER_ENTRANCES = {
        rise: { ms: 500, frames: [
          { transform: 'translateY(100%)', opacity: 0 },
          { transform: 'none', opacity: 1 }
        ] },
        spin: { ms: 700, frames: [
          { transform: 'translateY(100%) rotate(-360deg)', opacity: 0 },
          { transform: 'none', opacity: 1 }
        ] },
        shake: { ms: 600, frames: [
          { transform: 'translateY(100%)', opacity: 0, offset: 0 },
          { transform: 'translateY(0) rotate(-4deg)', opacity: 1, offset: 0.4 },
          { transform: 'rotate(3deg)', offset: 0.6 },
          { transform: 'rotate(-2deg)', offset: 0.8 },
          { transform: 'none', offset: 1 }
        ] }
      };
      // How the sponsor on screen leaves when a scene knocks it.
      var POSTER_EXITS = {
        topple: { ms: 320, delay: 780, origin: '0% 100%', frames: [
          { transform: 'none', opacity: 1 },
          { transform: 'rotate(-82deg) translateY(0.5rem)', opacity: 0 }
        ] }
      };
      // The vignette library: small scenes that play before a sponsor changes.
      // Each is line art on a transparent background, coloured by the page's own
      // text colour, so any scene works on any poster, theme or brand. An entry
      // is its art, where it stands, how it moves and for how long, how the
      // sponsor on screen leaves (if the scene knocks it), and how the next one
      // arrives when the scene lands.
      var POSTER_VIGNETTES = {
        // Backyard bocce: a ball thrown askew arcs in and knocks the sponsor.
        bocce: {
          ms: 700,
          lands: 'shake',
          place: { left: '50%', bottom: '0.75rem' },
          easing: 'cubic-bezier(0.3, 0, 0.6, 1)',
          frames: [
            { transform: 'translate(-48vw, 1.5rem) rotate(-540deg)', offset: 0 },
            { transform: 'translate(-22vw, -1.75rem) rotate(-200deg)', offset: 0.55 },
            { transform: 'translate(-4.5rem, 0) rotate(0deg)', offset: 1 }
          ],
          art: '<svg viewBox="0 0 32 32" width="28" height="28" focusable="false">' +
            '<circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>' +
            '<path d="M6 11c6 4 14 4 20 0M6 21c6-4 14-4 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            '</svg>'
        },
        // Softball: the throw sails past first base, flat and fast, into the sponsor.
        softball: {
          ms: 550,
          lands: 'spin',
          place: { left: '50%', bottom: '0.75rem' },
          easing: 'linear',
          frames: [
            { transform: 'translate(48vw, -0.75rem) rotate(0deg)' },
            { transform: 'translate(4.5rem, -0.25rem) rotate(-720deg)' }
          ],
          art: '<svg viewBox="0 0 32 32" width="26" height="26" focusable="false">' +
            '<circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>' +
            '<path d="M8 6c5 6 5 14 0 20M24 6c-5 6-5 14 0 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>' +
            '</svg>'
        },
        // Darts: one misses the board and sticks in the sponsor instead.
        darts: {
          ms: 450,
          lands: 'shake',
          place: { left: '50%', bottom: '1.5rem' },
          easing: 'cubic-bezier(0.2, 0, 0.9, 0.6)',
          frames: [
            { transform: 'translate(-50vw, -0.5rem) rotate(-6deg)' },
            { transform: 'translate(-6.5rem, 0) rotate(4deg)' }
          ],
          art: '<svg viewBox="0 0 40 16" width="36" height="14" focusable="false">' +
            '<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M10 8h28"/>' +
            '<path d="M10 8L3 2v12z"/>' +
            '<path d="M20 5v6" stroke-width="3"/>' +
            '</g></svg>'
        },
        // The DJ: rocking to her own set, she bumps the sponsor and it topples.
        dj: {
          ms: 1100,
          leaves: 'topple',
          lands: 'rise',
          place: { right: '0.5rem', bottom: '0.15rem', transformOrigin: '50% 100%' },
          easing: 'ease-in-out',
          frames: [
            { transform: 'translateX(130%)', offset: 0 },
            { transform: 'translateX(0) rotate(-9deg)', offset: 0.2 },
            { transform: 'rotate(9deg)', offset: 0.35 },
            { transform: 'rotate(-9deg)', offset: 0.5 },
            { transform: 'rotate(8deg)', offset: 0.62 },
            { transform: 'translateX(-1.6rem) rotate(-16deg)', offset: 0.78 },
            { transform: 'translateX(-0.4rem) rotate(0deg)', offset: 1 }
          ],
          art: '<svg viewBox="0 0 48 48" width="44" height="44" focusable="false">' +
            '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="24" cy="12" r="6"/>' +
            '<path d="M17 12c0-9 14-9 14 0"/>' +
            '<path d="M16 11v4M32 11v4" stroke-width="3.4"/>' +
            '<path d="M29 16c4 1 6 4 6 8"/>' +
            '<path d="M24 18v12"/>' +
            '<path d="M24 22l-9-11"/>' +
            '<path d="M24 22l8 9"/>' +
            '<path d="M5 31h38v6H5z"/>' +
            '<path d="M9 37v8M39 37v8"/>' +
            '<ellipse cx="14" cy="31" rx="5" ry="1.6"/>' +
            '<ellipse cx="34" cy="31" rx="5" ry="1.6"/>' +
            '<path d="M22 13c1 1.5 3 1.5 4 0" stroke-width="1.8"/>' +
            '<path d="M8 6v6M8 6l4 1.5" stroke-width="1.8"/>' +
            '<circle cx="6.5" cy="12" r="1.6" fill="currentColor" stroke="none"/>' +
            '</g></svg>'
        }
      };
      function rotatePosterSponsors(strip) {
        if (posterSponsorTimer) { clearInterval(posterSponsorTimer); posterSponsorTimer = null; }
        strip.removeAttribute('data-rotating');
        if (KIND !== 'digital') return;
        const items = Array.prototype.slice.call(strip.querySelectorAll('[data-testid="poster-sponsor-item"]'));
        if (items.length < 2) return;
        let at = 0;
        const entrances = Object.keys(POSTER_ENTRANCES);
        const vignettes = Object.keys(POSTER_VIGNETTES);
        // People who ask for less motion get a plain swap: no entrance, no scene.
        const calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        const play = function(el, move, extra) {
          if (calm || !move || !el.animate) return;
          const timing = { duration: move.ms, easing: move.easing || 'ease-out', fill: 'both' };
          if (extra) Object.keys(extra).forEach(function(k) { timing[k] = extra[k]; });
          el.animate(move.frames, timing);
        };
        const show = function(effect) {
          items.forEach(function(el, i) {
            const on = i === at;
            el.hidden = !on;
            el.style.display = on ? '' : 'none';
            if (on) { el.setAttribute('data-effect', effect); play(el, POSTER_ENTRANCES[effect]); }
          });
        };
        const pick = function(list) { return list[Math.floor(Math.random() * list.length)]; };
        const advance = function() {
          const next = (at + 1) % items.length;
          // Roughly one turn in five is a vignette.
          const name = !calm && vignettes.length && Math.random() >= 0.8 ? pick(vignettes) : null;
          if (!name) { at = next; show(pick(entrances)); return; }
          const scene = POSTER_VIGNETTES[name];
          const actor = document.createElement('span');
          actor.setAttribute('data-testid', 'poster-vignette');
          actor.setAttribute('data-vignette', name);
          actor.setAttribute('aria-hidden', 'true');
          actor.style.position = 'absolute';
          actor.style.lineHeight = '0';
          actor.style.pointerEvents = 'none';
          Object.keys(scene.place).forEach(function(k) { actor.style[k] = scene.place[k]; });
          actor.innerHTML = scene.art;
          strip.appendChild(actor);
          play(actor, scene);
          // Some scenes knock the sponsor that is on screen before the next arrives.
          const leaving = items[at];
          const exit = scene.leaves ? POSTER_EXITS[scene.leaves] : null;
          if (exit) {
            leaving.setAttribute('data-leaving', scene.leaves);
            leaving.style.transformOrigin = exit.origin;
            play(leaving, { ms: exit.ms, frames: exit.frames, easing: 'ease-in' }, { delay: exit.delay });
          }
          // The scene ends by touching the sponsor; that touch is the change.
          setTimeout(function() {
            actor.remove();
            if (leaving.getAnimations) leaving.getAnimations().forEach(function(a) { a.cancel(); });
            leaving.removeAttribute('data-leaving');
            leaving.style.transformOrigin = '';
            at = next;
            show(scene.lands);
          }, scene.ms);
        };
        strip.style.position = 'relative';
        strip.style.overflow = 'hidden';
        strip.setAttribute('data-rotating', 'true');
        show('rise');
        posterSponsorTimer = setInterval(function() {
          if (document.hidden) return;
          advance();
        }, POSTER_SPONSOR_ROTATE_MS);
        // Paper cannot rotate: if someone prints the digital poster, show every
        // sponsor for the print and go back to one afterwards.
        window.addEventListener('beforeprint', function() {
          items.forEach(function(el) { el.style.display = ''; });
        });
        window.addEventListener('afterprint', function() {
          items.forEach(function(el, i) { el.style.display = i === at ? '' : 'none'; });
        });
      }
      // Typed destination slots (Public / Donate / Sign Up) from the bundle:
      // each is a /s routing shortlink (printed AND scannable) — the anonymous
      // routing layer, never a form. If the bundle has no slots, the
      // .qr-loading placeholder stays and the print gate keeps Print disabled.
      function renderPosterSlots(slots) {
        const container = document.getElementById('poster-qr-slots');
        if (!container || !Array.isArray(slots) || !slots.length) return;
        // OSE-1357 part 2: every code the organizer chose, in their order —
        // one big WORD + icon per code, in its UEC colour with the UEC name in
        // text (never colour alone; docs/features/UEC-CODES.md). Kind and icon come from
        // allowlists here, the link is rebuilt from a validated code on this
        // origin, and a QR src must be a data:image — no response value
        // reaches an href or src unchecked (slotLink, slotPicture).
        const ICON = Object.assign(Object.create(null), { public: '★', checkin: '✓', register: '✎', donation: '♥', sponsor: '◆', ow: '♪' });
        // A live poster links only through a validated short code. The admin
        // preview never mints one, so a slot with no code yet carries its
        // destination instead: accepted only in preview, and only when it is
        // this site or an https link.
        function slotLink(s) {
          if (/^[A-Za-z0-9]{6}$/.test(String(s.code || ''))) return location.origin + '/s/' + s.code;
          if (!PREVIEW_EVENT) return '';
          const u = String(s.url || '');
          if (u.indexOf(location.origin + '/') === 0 || /^https:\/\/[^\s"'<>]+$/.test(u)) return u;
          return '';
        }
        // A code's picture is drawn only from an inline PNG or GIF.
        function slotPicture(s) {
          const q = String(s.qr || '');
          return /^data:image\/(png|gif);base64,/.test(q) ? q : '';
        }
        // The colour never enters the markup: it is checked here and set on the
        // card through the CSSOM after the cards exist.
        function slotHex(s) {
          return /^#[0-9A-Fa-f]{6}$/.test(String((s.uec && s.uec.scan_hex) || '')) ? String(s.uec.scan_hex) : '';
        }
        // At most eight codes are drawn (the largest plan's allotment).
        const shown = slots.filter(function (s) { return slotLink(s) !== ''; }).slice(0, POSTER_MAX_CODES);
        container.innerHTML = shown
          .map(function (s) {
            const kind = String(s.kind || 'slot').replace(/[^a-z0-9-]/gi, '');
            // UEC id from the bundle, shown as text beside the word.
            const uecId = String((s.uec && s.uec.id) || '').replace(/[^A-Z-]/g, '');
            const uecName = uecId.replace(/-/g, ' ');
            // Raw here, escaped where each is written (never ahead of it).
            const word = s.word || s.label || kind;
            const label = s.label || s.word || kind;
            const link = slotLink(s);
            const picture = slotPicture(s);
            // What scanning does ("Scan to register"), from the page's own list.
            const action = '<span class="code-action" data-testid="poster-qr-slot-action-' + esc(kind) + '">' + esc(posterActionLabel(kind, KIND === 'digital')) + '</span>';
            return (
              '<div class="qr-card qr-item code-card" data-uec="' + esc(uecId) + '" data-testid="poster-qr-slot-' + esc(kind) + '">' +
              '<div class="qr-card-header"><span class="qr-card-title qr-label code-word" data-testid="poster-qr-slot-label-' + esc(kind) + '"><span aria-hidden="true">' + (ICON[kind] || '→') + '</span> ' + esc(word) + (uecName && uecName !== String(s.word || '') ? ' <span class="code-uec meta-text" data-testid="poster-qr-slot-uec-' + esc(kind) + '">&middot; ' + esc(uecName) + '</span>' : '') + '</span></div>' +
              '<div class="qr-card-body">' +
              (KIND === 'digital'
                ? '<a class="qr-slot-code" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(label) + '" data-testid="qr-slot-code-' + esc(kind) + '">' + esc(link) + '</a>' + action
                : '<a class="qr-link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(label) + ' QR code — tap to open" data-testid="qr-link-' + esc(kind) + '">' +
                  '<img src="' + esc(picture) + '" alt="' + esc(label) + ' QR code" class="qr-img" data-testid="qr-img-slot-' + esc(kind) + '" width="120" height="120" />' +
                  '</a>' + action +
                  '<span class="qr-slot-code" data-testid="qr-slot-code-' + esc(kind) + '">' + esc(link) + '</span>') +
              '</div>' +
              '</div>'
            );
          })
          .join('');
        // The band colour is set through the CSSOM (no inline style attribute).
        container.querySelectorAll('.code-card').forEach(function (el, i) {
          const hex = shown[i] ? slotHex(shown[i]) : '';
          if (hex) el.style.borderTopColor = hex;
        });
      }
      // OSE-867: the poster's ONE data call. With renderEvent, the poster card
      // itself is drawn from data.event (the scoped path); otherwise the card
      // is already on screen from the picker list and only the sponsors and
      // codes are filled. Resolves true when the bundle was usable.
      // OSE-1441: the picker can switch events while a bundle is still out.
      // Each call takes the next number; an answer whose number is no longer
      // the latest is dropped, so a late answer for the event just left never
      // paints its codes or sponsors (or opens Print) on the one now chosen.
      // The switch itself clears them: show() redraws the card with an empty
      // strip and the .qr-loading placeholder before this call goes out.
      let posterBundleSeq = 0;
      async function loadPosterBundle(eventId, renderEvent) {
        if (!eventId) return false;
        const seq = ++posterBundleSeq;
        const current = function () { return seq === posterBundleSeq; };
        // Gate Print for this render cycle until the codes below settle.
        setPrintReady(false);
        const strip = document.getElementById('poster-sponsor-strip');
        if (strip) {
          strip.setAttribute('aria-busy', 'true');
          strip.innerHTML = '<span class="sr-only" data-testid="poster-sponsors-loading">Loading sponsors…</span>';
        }
        let shown = false;
        try {
          const res = await fetch(
            (PREVIEW_EVENT ? '/api/v2/admin/events/' : '/api/v2/events/') +
              encodeURIComponent(eventId) +
              '/poster-bundle'
          );
          const data = await res.json();
          if (!current() || !data.ok) return false;
          if (renderEvent) {
            if (!data.event || !data.event.id) return false;
            document.getElementById('poster-area').innerHTML = renderPoster(data.event);
            syncChrome(data.event);
          }
          renderPosterSponsors(data.sponsors);
          // OSE-869: the organiser turned the QR grid off (a walk-up event has
          // nothing to scan). Remove the whole section — absent, not empty, so
          // the printed poster keeps no QR-shaped hole. Absent setting = on.
          // PRINT only: the digital poster's codes are tappable links, not QR
          // images, and stay (CCR PR701 F2 — the switch says "Print QR codes").
          if (KIND === 'print' && data.settings && data.settings.showQRSection === false) {
            const qrSection = document.querySelector('[data-testid="poster-qr-section"]');
            if (qrSection) qrSection.remove();
          } else {
            renderPosterSlots(data.slots);
          }
          relayoutPoster();
          shown = true;
        } catch { /* the caller shows the error state (scoped) or keeps the card */ }
        finally {
          // A dropped answer leaves the strip and Print to the newer call.
          if (current()) {
            const s = document.getElementById('poster-sponsor-strip');
            if (s && s.getAttribute('aria-busy') === 'true') { s.setAttribute('aria-busy', 'false'); s.innerHTML = ''; }
            // AC (OSE-286): re-enable Print only after all QR images finish
            // loading OR error-out. If any code failed, its .qr-loading
            // placeholder stays and the @media print rule hides the whole
            // section — so an incomplete poster still never prints empty boxes.
            await awaitQrImages();
            // A scoped poster that never rendered has nothing to print.
            if (current()) setPrintReady(shown || !renderEvent);
          }
        }
        return shown;
      }
      // OSE-286 / OSE-R-020: Print via a nonced listener — the button carries
      // no javascript: URI (which the nonce CSP blocks). The disabled attribute
      // already blocks clicks; the guard is belt-and-suspenders for aria state.
      (function wirePrintButton() {
        const btn = document.querySelector('[data-testid="poster-print"]');
        if (btn) btn.addEventListener('click', function () {
          if (!btn.disabled) window.print();
        });
      })();
      init();
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          // OSE-1516: artwork that fails to load is the same as no artwork: the
          // art area drops out and the poster lays itself out again.
          if (el && el.tagName === 'IMG' && el.classList.contains('poster-art-img')) {
            var box = el.closest('.poster-art');
            if (box) box.remove();
            if (typeof relayoutPoster === 'function') relayoutPoster();
            return;
          }
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            // 0083: a sponsor logo that fails becomes the OSE default instead of
            // vanishing; only if the default itself fails is the image hidden.
            // The fallback is a fixed same-origin path, never read back from
            // the DOM — data-default-src only marks which images may fall back.
            var d = '/sponsor-default-logo.svg';
            if (el.hasAttribute('data-default-src') && el.getAttribute('src') !== d) el.setAttribute('src', d);
            else el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
