<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Poster – OurSharedEvents</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page-header {
        background: var(--surface);
        color: var(--text);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .poster-kind {
        display: flex;
        gap: 0.25rem;
      }
      .page-header .poster-kind a[aria-current] {
        color: var(--text);
        font-weight: 700;
        text-decoration: underline;
      }
      .page-header a,
      .page-header .print-btn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        font-size: 0.85rem;
        text-decoration: none;
      }
      .page-header a:hover,
      .page-header .print-btn:not(:disabled):hover {
        color: var(--text);
      }
      /* OSE-286: the Print control became a <button>; reset native chrome so
         it reads as the header link it replaced, and dim it while disabled. */
      .print-controls {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
      }
      /* display:inline-flex beats the UA's [hidden]; Digital hides Print. */
      .print-controls[hidden] {
        display: none;
      }
      .print-btn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        background: none;
        border: none;
        padding: 0 0.5rem;
        cursor: pointer;
        font-family: inherit;
      }
      .print-btn:disabled,
      .print-btn[disabled] {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .print-status {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .container {
        max-width: 680px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .poster {
        background: var(--surface);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        border: 1px solid var(--border);
      }
      .poster-header {
        background: var(--surface);
        color: var(--text);
        padding: 2.5rem 2rem 2rem;
        text-align: center;
      }
      .poster-header h2 {
        font-size: clamp(1.75rem, 5.6vw, 2.75rem);
        font-weight: 800;
        line-height: 1.12;
      }
      .poster-body {
        padding: 2rem;
      }
      .poster-meta {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      .meta-row {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .meta-icon {
        width: 24px;
        flex-shrink: 0;
        text-align: center;
        font-size: 1rem;
        padding-top: 0.1rem;
      }
      .meta-text {
        font-size: 1rem;
        color: var(--text-muted);
      }
      /* @ocr/ui-ready: colours come from the shared design tokens (--surface-hover,
         --border, --text-muted), not hardcoded hex — so the poster art viewport
         can be adopted by @ocr/ui / synced to Claude Design without a re-skin. */
      .poster-art {
        margin: 1rem 0 1.25rem;
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface-hover);
      }
      .poster-art-img {
        display: block;
        width: 100%;
        max-height: min(64vh, 720px);
        object-fit: cover;
      }
      .poster-art--empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 140px;
        border: 2px dashed var(--border);
      }
      .poster-art-placeholder {
        font-size: 2rem;
        color: var(--text-muted);
        opacity: 0.5;
      }
      /* #poster-qr-slots: the one flex child of .qr-section. */
      .qr-slots {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        width: 100%;
      }
      /* Printed /s link under each QR (not .qr-link-url, so print keeps it). */
      .qr-slot-code {
        display: block;
        margin: 0.35rem auto 0;
        max-width: 120px;
        font-size: 0.62rem;
        line-height: 1.3;
        color: var(--text-muted);
        word-break: break-all;
        text-align: center;
      }
      /* OSE-1357: one word per code; same size for every kind. */
      .code-card {
        border-top: 6px solid var(--border);
      }
      .tone-checkin {
        border-top-color: var(--success);
      }
      .tone-donate {
        border-top-color: var(--info);
      }
      .code-word {
        font-size: 1rem;
        font-weight: 800;
        color: var(--text);
      }
      .qr-section {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        padding: 1.5rem 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        margin-bottom: 1.5rem;
      }
      .qr-item {
        text-align: center;
      }
      .qr-loading {
        width: 120px;
        height: 120px;
        background: var(--surface-hover);
        border: 2px dashed var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 0.5rem;
        font-size: 1.25rem;
        color: var(--text-muted);
      }
      .qr-img {
        width: 120px;
        height: 120px;
        display: block;
        margin: 0 auto 0.5rem;
        image-rendering: pixelated;
      }
      .qr-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .qr-link:hover .qr-img {
        opacity: 0.85;
      }
      .qr-link-url {
        display: block;
        font-size: 0.6rem;
        color: var(--text-muted);
        word-break: break-all;
        margin-top: 0.25rem;
        max-width: 120px;
        text-align: center;
      }
      .qr-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      /* OSE-887: GAS .qr-card frame (archive/v2-code/components/QRRegenerator.html)
         wrapping each poster QR — header carries the label, body holds the QR that
         loadPosterQR injects into #qr-img-{type}. Themed in the token-overlay block
         below; flattened for print (see @media print). */
      .qr-card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface);
      }
      .qr-card-header {
        padding: 0.4rem 0.75rem;
        background: var(--surface-hover);
        border-bottom: 1px solid var(--border);
      }
      .qr-card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem 0.9rem;
      }
      /* OSE-1200: UEC word + path + consent tier. Plain text, prints in black —
         the hue lives on the code and the frame; the words carry it for everyone. */
      .qr-uec {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        margin-top: 0.5rem;
        text-align: center;
      }
      .qr-uec-word {
        font-weight: 800;
        letter-spacing: 0.12em;
        font-size: 0.8rem;
      }
      .qr-uec-path {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        color: var(--text-muted);
      }
      .qr-uec-tier {
        font-size: 0.7rem;
        line-height: 1.3;
        color: var(--text-muted);
        max-width: 16rem;
      }
      .poster--digital .poster-art-img {
        max-height: min(80vh, 960px);
      }
      .poster--digital .qr-img,
      .poster--digital .qr-loading {
        display: none;
      }
      .poster--digital .qr-slot-code {
        max-width: none;
        font-size: 0.85rem;
      }
      .meta-text a,
      .poster--digital .qr-slot-code {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--accent);
      }
      .poster-footer {
        text-align: center;
        padding: 1rem;
        background: var(--surface-hover);
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .loading {
        text-align: center;
        padding: 4rem;
        color: var(--text-muted);
      }
      .error {
        text-align: center;
        padding: 3rem;
        color: var(--error);
      }
      .event-select {
        margin-bottom: 1.5rem;
      }
      .event-select label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 0.375rem;
      }
      .event-select select {
        width: 100%;
        min-height: 44px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font-size: 16px;
        background: var(--surface);
        color: var(--text);
      }
      .poster-sponsors {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1rem 2rem;
        flex-wrap: wrap;
      }
      .poster-sponsors:empty {
        display: none;
      }
      .poster-sponsor {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      /* OSE-864/#25: ONE uniform logo box for every sponsor regardless of tier.
         Responsive (clamp) across viewports, tier-blind — money buys frequency,
         never size. WALL-3b (OSE-835) fails CI on any tier-keyed sponsor geometry. */
      .poster-sponsor img {
        height: clamp(24px, 4.5vw, 40px);
        width: auto;
        max-width: clamp(80px, 14vw, 140px);
        object-fit: contain;
      }
      .poster-sponsor-name {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
      }
      .poster-sponsor-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 0.35rem;
      }
      .poster-sponsor-tier-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.2rem 0;
      }
      .poster-sponsor-tier-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        text-align: center;
        width: 100%;
        margin-bottom: 0.15rem;
      }
      /* OSE-864/#25: no tier-keyed sponsor CSS (WALL-3b). */
      .page-header a:focus-visible,
      .page-header .print-btn:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .event-select select:focus {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
      }
      /* OSE-300: phone layout (tighter padding, 100px QR, 44px/16px controls). */
      @media (max-width: 768px) {
        .page-header {
          padding: 0.75rem 1rem;
        }
        .page-header a {
          padding: 0 0.5rem;
        }
        .container {
          padding: 0 .75rem;
          margin: 1rem auto;
        }
        .poster-header {
          padding: 1.75rem 1.25rem 1.5rem;
        }
        .poster-body {
          padding: 1.25rem 1rem;
        }
        .event-select select {
          padding: 0.65rem 0.75rem;
        }
        .qr-section {
          gap: 1rem;
          padding: 1.25rem 0;
        }
        .qr-img,
        .qr-loading {
          width: 100px;
          height: 100px;
        }
        .poster-art-img {
          max-height: 360px;
        }
        .poster--digital .poster-art-img {
          max-height: 70vh;
        }
        .qr-link-url {
          max-width: 100px;
          word-break: break-all;
        }
        .poster-sponsors {
          padding: 1rem;
          gap: 1rem;
        }
      }
      @media print {
        @page {
          size: 11in 14in;
          margin: 0.35in;
        }
        /* Raw hex here is deliberate + baseline-gated: print is PAPER (white,
           dark ink, theme-invariant). A theme token would print dark-on-dark.
           Goes to 0 when /ui.css gains a print :root of light tokens. */
        .page-header,
        .event-select,
        .no-print {
          display: none !important;
        }
        /* restore white background for print even in dark mode */
        body {
          background: #fff !important;
          color: #1e293b !important;
        }
        .poster {
          background: #fff !important;
        }
        /* OSE-R-006 (audit 2026-05-15): force-print backgrounds + sponsor
         colors. Sponsors paid for full-color logo placement; pre-fix the
         print rule grayscaled them and the dark-navy poster header dropped
         to white-on-white. Both broke the printed-poster value promise. */
        body,
        .poster,
        .poster-header,
        .poster-sponsors,
        .poster-sponsor,
        .poster-sponsor img,
        .code-card {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          color-adjust: exact;
        }
        body {
          background: #fff;
        }
        .container {
          margin: 0;
          max-width: 100%;
        }
        /* Keep the whole poster on one page when it fits; otherwise allow
         orderly breaks at the major section boundaries. */
        .poster {
          box-shadow: none;
          border: none;
          page-break-inside: avoid;
          min-height: 13.25in;
        }
        .poster-header {
          padding: 0.45in 0.35in 0.3in;
        }
        .poster-header h2 {
          font-size: 38pt;
          line-height: 1.05;
        }
        .poster-body {
          padding: 0.3in 0.35in 0.25in;
        }
        .poster-meta {
          margin-bottom: 0.2in;
        }
        .qr-section {
          page-break-inside: avoid;
          padding: 0.18in 0;
          gap: 0.3in;
        }
        .poster-sponsors {
          page-break-inside: avoid;
          border-top: 1px solid #ccc;
          padding: 0.75rem 1rem;
        }
        /* OSE-R-006: NO grayscale on sponsor logos in print. Keep the
         max-height clamp so logos still fit a printed A4 page — that part
         was a layout decision, separate from the color issue. */
        .poster-sponsor img {
          max-height: 20px;
        }
        .poster-sponsor-name,
        .poster-sponsor-label {
          color: #000;
        }
        .qr-loading {
          display: none !important;
        }
        /* R4: art prints when present; an empty placeholder must never print a
           dashed box where artwork would go. */
        .poster-art--empty {
          display: none !important;
        }
        .poster-art {
          page-break-inside: avoid;
          margin: 0.12in 0 0.2in;
        }
        .poster-art-img {
          max-height: 7in;
          object-fit: cover;
        }
        /* OSE-286: defensive move for Cmd+P bypassing the disabled button —
           if ANY QR is still a loading placeholder, hide the whole section so
           the poster never prints empty labeled boxes where codes belong. */
        .qr-section:has(.qr-loading) {
          display: none !important;
        }
        .qr-link-url {
          display: none !important;
        }
        /* OSE-887: flatten the .qr-card chrome for print so the poster keeps its
           clean label-over-QR look (no card borders/fills on the page). */
        .qr-card {
          border: none;
        }
        .qr-card-header {
          background: transparent;
          border-bottom: none;
          padding: 0 0 0.2rem;
        }
        .qr-card-body {
          padding: 0.12in;
          background: white;
        }
        .qr-img {
          width: 1.25in;
          height: 1.25in;
          margin: 0 auto 0.08in;
          padding: 0.08in;
          background: white;
        }
      }
    </style>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      body {
        background: var(--bg);
        color: var(--text);
      }
      .page-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      .page-header a,
      .page-header .print-btn {
        color: var(--text-muted);
      }
      .page-header a:hover,
      .page-header .print-btn:not(:disabled):hover {
        color: var(--text);
      }
      .poster {
        background: var(--surface);
        border-color: var(--border);
        box-shadow: none;
      }
      .poster-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .meta-text {
        color: var(--text-muted);
      }
      .qr-section {
        border-color: var(--border);
      }
      .qr-loading {
        background: var(--surface-hover);
        border-color: var(--border);
        color: var(--text-muted);
      }
      .qr-label {
        color: var(--text-muted);
      }
      .qr-card {
        background: var(--surface);
        border-color: var(--border);
      }
      .qr-card-header {
        background: var(--surface-hover);
        border-bottom-color: var(--border);
      }
      .qr-link-url {
        color: var(--text-muted);
      }
      .poster-footer {
        background: var(--surface-hover);
        color: var(--text-muted);
      }
      .event-select label {
        color: var(--text-muted);
      }
      .event-select select {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .poster-sponsor-name,
      .poster-sponsor-label,
      .poster-sponsor-tier-label {
        color: var(--text-muted);
      }
      .skip-link:focus {
        background: var(--surface);
        color: var(--text);
        border-bottom-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="poster-skip-link">Skip to content</a>
    <div class="page-header no-print" data-testid="poster-header">
      <!-- The title is the EVENT's (poster-page-title is filled with its name);
           the OurSharedEvents name lives at the bottom of the poster only. -->
      <h1 class="sr-only" id="poster-page-title" data-testid="poster-page-title">Event poster</h1>
      <!-- Print keeps the QR codes and a large art area; Digital drops the
           codes (it's already on a screen — the short links are tappable),
           gives the art the room, and turns the date/venue into taps. The URL
           is the state (?kind=), so Back and a shared link keep the choice. -->
      <nav class="poster-kind" aria-label="Poster type" data-testid="poster-kind">
        <a href="?kind=print" data-kind="print" data-testid="poster-kind-print">Print</a>
        <a href="?kind=digital" data-kind="digital" data-testid="poster-kind-digital">Digital</a>
      </nav>
      <!-- OSE-286 / OSE-R-020: Print is a real <button> that STARTS disabled and
           is re-enabled by the gate script only once all QR codes settle, so a
           poster is never printed with empty QR boxes. (It replaced a
           `javascript:window.print()` anchor, which the nonce CSP blocks and
           which cannot be disabled.) -->
      <div class="print-controls" id="poster-print-controls">
        <span id="poster-print-status" class="print-status" data-testid="poster-print-status" role="status" aria-live="polite">QR codes loading&hellip;</span>
        <button type="button" id="poster-print-btn" class="print-btn" data-testid="poster-print" disabled aria-disabled="true" aria-label="Print poster"><span aria-hidden="true">&#x1F5A8;</span> Print</button>
      </div>
    </div>
    <main id="main-content" class="container" data-testid="poster-container">
      <div class="event-select no-print" id="poster-event-select" data-testid="poster-event-select">
        <label for="event-picker">Select Event</label>
        <select id="event-picker" data-testid="poster-event-picker">
          <option value="">Loading events&hellip;</option>
        </select>
      </div>
      <div id="poster-area" data-testid="poster-area">
        <p class="loading" data-testid="poster-loading" role="status">Loading&hellip;</p>
      </div>
    </main>
    <script>
      const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
      // OSE-1313 — dates and times render in the EVENT's zone, never the
      // viewer's. A timed event carries its UTC instant in starts_at; a
      // date-only YYYY-MM-DD is a calendar date, pinned via UTC so no zone can
      // shift it a day (and it shows no invented time).
      const inZone = (iso, tz, opts) => {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return ''; // dirty value: render nothing, never throw
        try { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz || 'UTC' }, opts)).format(d); }
        catch (e) { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, opts)).format(d); } // unknown zone only
      };
      const DATE_OPTS = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
      const fmtEventDate = ev => {
        if (ev.starts_at) return inZone(ev.starts_at, ev.timezone, DATE_OPTS);
        const d = String(ev.startDateISO || '').slice(0, 10);
        return /^\d{4}-\d{2}-\d{2}$/.test(d) ? inZone(d + 'T00:00:00Z', 'UTC', DATE_OPTS) : '';
      };
      const fmtEventTime = ev => ev.starts_at ? inZone(ev.starts_at, ev.timezone, { hour:'numeric', minute:'2-digit', timeZoneName:'short' }) : '';

      // OSE-286: the Print button is gated on QR readiness. It starts disabled
      // (in the markup) and toggles here as posters render and their codes
      // settle, so a poster is never printed with empty QR boxes.
      function setPrintReady(ready) {
        const btn = document.querySelector('[data-testid="poster-print"]');
        const status = document.getElementById('poster-print-status');
        if (btn) {
          btn.disabled = !ready;
          btn.setAttribute('aria-disabled', ready ? 'false' : 'true');
        }
        if (status) status.style.display = ready ? 'none' : '';
      }
      // Resolve once every rendered QR <img> has loaded or errored. Data-URI
      // codes settle almost immediately; a slow venue link is exactly the case
      // this waits out. No images (all failed / none injected) → resolve now.
      function awaitQrImages() {
        const imgs = Array.prototype.slice.call(document.querySelectorAll('.qr-section .qr-img'));
        if (!imgs.length) return Promise.resolve();
        return Promise.all(imgs.map(function (img) {
          if (img.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        }));
      }

      // Print (default) or Digital, from ?kind= — the URL is the state.
      const KIND = new URLSearchParams(location.search).get('kind') === 'digital' ? 'digital' : 'print';

      // Keep the URL, the Print|Digital links, the page title and the print
      // controls in step with the event on show.
      function syncChrome(event) {
        const params = new URLSearchParams(location.search);
        if (event && event.id) params.set('event', event.id);
        params.set('kind', KIND);
        try { history.replaceState(null, '', '?' + params.toString()); } catch (e) { /* sandboxed */ }
        document.querySelectorAll('[data-kind]').forEach(function (a) {
          const p = new URLSearchParams(params);
          p.set('kind', a.getAttribute('data-kind'));
          a.setAttribute('href', '?' + p.toString());
          if (a.getAttribute('data-kind') === KIND) a.setAttribute('aria-current', 'page');
          else a.removeAttribute('aria-current');
        });
        const title = document.getElementById('poster-page-title');
        if (title && event && event.name) title.textContent = event.name + (KIND === 'digital' ? ' — digital poster' : ' — poster');
        const controls = document.getElementById('poster-print-controls');
        if (controls) controls.hidden = KIND === 'digital';
      }

      function renderPoster(event) {
        // OSE-844 (X-10): the API item now carries name/startDateISO/venue
        // directly (mapped in enrichWithPhase). The old `const data = event.data
        // || {}` first branch was permanently dead — no SELECT ever exposed a
        // `data` column — so it is removed and the banned 'Event' fallback with
        // it. A genuinely-missing value renders its empty state, not a literal.
        const venue = event.venue || '';
        const address = '';
        const startDate = fmtEventDate(event);
        const startTime = fmtEventTime(event);
        const name = event.name || '';
        // R4 — poster art viewport. Source is the event's cover image (public
        // projection allowlist includes cover_image_url). Snake/camel tolerant
        // so it works whether or not enrichWithPhase renames the field.
        const art = event.cover_image_url || event.coverImageUrl || '';

        // Digital: the date adds itself to a calendar, the venue opens a map.
        // Print has nothing to tap, so it stays plain text.
        const digital = KIND === 'digital';
        const id = encodeURIComponent(event.id || '');
        const whenText = esc(startDate) + (startTime ? ' &mdash; ' + esc(startTime) : '');
        const whenHtml = digital && id
          ? '<a href="/events/' + id + '/calendar.ics" download data-testid="poster-add-to-calendar">' + whenText + ' &middot; Add to calendar</a>'
          : whenText;
        const mapHref = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(venue);
        const venueHtml = digital
          ? '<a href="' + esc(mapHref) + '" target="_blank" rel="noopener noreferrer" data-testid="poster-open-map">' + esc(venue) + ' &middot; Map</a>'
          : esc(venue);

        return '<div class="poster' + (digital ? ' poster--digital' : '') + '" data-testid="poster-card" data-kind="' + KIND + '" role="article" aria-label="' + esc(name) + ' event poster">' +
          '<div class="poster-header" data-testid="poster-card-header">' +
            '<h2 data-testid="poster-title">' + esc(name) + '</h2>' +
          '</div>' +
          '<div class="poster-body" data-testid="poster-body">' +
            '<div class="poster-meta" data-testid="poster-meta">' +
            (startDate ? '<div class="meta-row" data-testid="poster-meta-date"><div class="meta-icon" aria-hidden="true">&#x1F4C5;</div><div class="meta-text">' + whenHtml + '</div></div>' : '') +
            (venue ? '<div class="meta-row" data-testid="poster-meta-venue"><div class="meta-icon" aria-hidden="true">&#x1F4CD;</div><div class="meta-text">' + venueHtml + (address ? '<br><small>' + esc(address) + '</small>' : '') + '</div></div>' : '') +
            '</div>' +
            '<div class="poster-art' + (art ? '' : ' poster-art--empty') + '" data-testid="poster-art-viewport">' +
              (art
                ? '<img class="poster-art-img" src="' + esc(art) + '" alt="' + esc(name) + ' artwork" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="poster-art-img">'
                : '<span class="poster-art-placeholder" data-testid="poster-art-empty" aria-hidden="true">&#x1F3A8;</span>') +
            '</div>' +
            '<div class="qr-section" data-testid="poster-qr-section">' +
              // Typed destination slots (/q tracking + /s routing → Public /
              // Donate / Sign Up). loadPosterQR fills this from bundle.slots. The
              // .qr-loading placeholder keeps the print gate closed until codes
              // settle. NOT the forms (register/checkin/survey/feedback are a
              // separate, destroyed-by-cron implementation — off the poster).
              '<div id="poster-qr-slots" class="qr-slots" data-testid="poster-qr-slots"><div class="qr-loading" aria-busy="true">&#x23F3;</div></div>' +
            '</div>' +
          '</div>' +
          '<div id="poster-sponsor-strip" class="poster-sponsors" data-testid="poster-sponsor-strip" role="list" aria-label="Event sponsors"></div>' +
          '<div class="poster-footer" data-testid="poster-footer"><span data-testid="poster-org">OurSharedEvents</span> &middot; oursharedevents.com</div>' +
        '</div>';
      }

      // OSE-1081: `event` is the CANONICAL surface deep-link param —
      // admin.html's scopedSurfaceUrl() emits /poster?event=<id>.
      // OSE-867: a scoped poster is ONE network call. poster-bundle carries the
      // event (title / start / venue under the public projection's names), the
      // sponsor strip and the QR slots, so nothing else is fetched: no events
      // list, no sponsor-bundle. An event the bundle refuses (unknown, draft,
      // archived) says so — it never silently falls back to some other event.
      async function init() {
        const picker = document.getElementById('event-picker');
        const area = document.getElementById('poster-area');
        const wanted = new URLSearchParams(location.search).get('event');
        if (wanted) {
          document.getElementById('poster-event-select').hidden = true;
          const shown = await loadPosterBundle(wanted, true);
          if (!shown) {
            area.innerHTML = '<p class="error" data-testid="poster-error" role="alert">This poster is not available. The event may not be live yet.</p>';
          }
          return;
        }
        // No event named: offer the picker. The list is navigation; each
        // chosen poster still loads through its single bundle call.
        try {
          const res = await fetch('/api/v2/events');
          const data = await res.json();
          const items = (data.ok && data.items) ? data.items : [];
          if (!items.length) {
            picker.innerHTML = '<option>No events available</option>';
            area.innerHTML = '<p class="loading" data-testid="poster-empty" role="status">No events scheduled.</p>';
            return;
          }
          picker.innerHTML = items.map((e, i) =>
            // OSE-844: read the single canonical `name`; fall back to the event
            // id (always present) so options stay distinguishable without the
            // banned Untitled-Event literal that made every option identical.
            '<option value="' + i + '">' + esc(e.name || e.id || '') + '</option>'
          ).join('');
          const show = (item) => {
            area.innerHTML = renderPoster(item);
            syncChrome(item);
            loadPosterBundle(item.id, false);
          };
          picker.value = '0';
          show(items[0]);
          picker.addEventListener('change', () => {
            const idx = parseInt(picker.value, 10);
            if (!isNaN(idx) && items[idx]) show(items[idx]);
          });
        } catch {
          area.innerHTML = '<p class="error" data-testid="poster-error" role="alert">Could not load events.</p>';
        }
      }
      // The sponsor strip, rendered from the bundle's `sponsors` (OSE-867 —
      // the same set sponsor-bundle?surface=poster serves). Print-safe: no
      // links; logos hide themselves on error (see the capture listener below).
      function renderPosterSponsors(sponsors) {
        const strip = document.getElementById('poster-sponsor-strip');
        if (!strip) return;
        strip.setAttribute('aria-busy', 'false');
        if (!Array.isArray(sponsors) || !sponsors.length) { strip.innerHTML = ''; return; }
        strip.innerHTML = '<div class="poster-sponsor-label" data-testid="poster-sponsor-label">Sponsored By</div>' +
          sponsors.map(function(s) {
            // OSE-R-015 (2026-05-15): referrerpolicy + data-hide-on-error.
            const logo = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.name) + ' logo" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="poster-sponsor-logo">' : '';
            const validTiers = ['title','platinum','gold','silver','bronze','primary'];
            // data-tier retained for rotation/frequency-share identity only; NO
            // poster-sponsor--<tier> class — #25 forbids tier-keyed geometry (OSE-864).
            const tier = validTiers.indexOf(String(s.tier || '')) >= 0 ? s.tier : 'primary';
            return '<div class="poster-sponsor" data-tier="' + esc(tier) + '" data-testid="poster-sponsor-item" role="listitem" aria-label="' + esc(s.name) + '">' + logo + '<span class="poster-sponsor-name" data-testid="poster-sponsor-name">' + esc(s.name) + '</span></div>';
          }).join('');
      }
      // Typed destination slots (Public / Donate / Sign Up) from the bundle:
      // each is a /s routing shortlink (printed AND scannable) — the anonymous
      // routing layer, never a form. If the bundle has no slots, the
      // .qr-loading placeholder stays and the print gate keeps Print disabled.
      function renderPosterSlots(slots) {
        const container = document.getElementById('poster-qr-slots');
        if (!container || !Array.isArray(slots) || !slots.length) return;
        // OSE-1357 part 2: every code the organizer chose, in their order —
        // one big WORD + icon per code (never colour alone; green = anonymous
        // check-in only, blue = donate only). Kind, tone and icon come from
        // allowlists here, the link is rebuilt from a validated code on this
        // origin, and a QR src must be a data:image — no response value
        // reaches an href or src unchecked.
        const ICON = { public: '★', checkin: '✓', donation: '♥', ow: '♪' };
        container.innerHTML = slots
          .filter(function (s) { return /^[A-Za-z0-9]{6}$/.test(String(s.code || '')); })
          .map(function (s) {
            const kind = String(s.kind || 'slot').replace(/[^a-z0-9-]/gi, '');
            const tone = kind === 'checkin' ? 'checkin' : kind === 'donation' ? 'donate' : 'neutral';
            const word = esc(s.word || s.label || kind);
            const label = esc(s.label || s.word || kind);
            const link = location.origin + '/s/' + s.code;
            const url = esc(link);
            const shortText = esc(link);
            const qr = /^data:image\/(png|gif);base64,/.test(String(s.qr || '')) ? esc(s.qr) : '';
            return (
              '<div class="qr-card qr-item code-card tone-' + tone + '" data-tone="' + tone + '" data-testid="poster-qr-slot-' + kind + '">' +
              '<div class="qr-card-header"><span class="qr-card-title qr-label code-word" data-testid="poster-qr-slot-label-' + kind + '"><span aria-hidden="true">' + (ICON[kind] || '→') + '</span> ' + word + '</span></div>' +
              '<div class="qr-card-body">' +
              (KIND === 'digital'
                ? '<a class="qr-slot-code" href="' + url + '" target="_blank" rel="noopener noreferrer" aria-label="' + label + '" data-testid="qr-slot-code-' + kind + '">' + shortText + '</a>'
                : '<a class="qr-link" href="' + url + '" target="_blank" rel="noopener noreferrer" aria-label="' + label + ' QR code — tap to open" data-testid="qr-link-' + kind + '">' +
                  '<img src="' + qr + '" alt="' + label + ' QR code" class="qr-img" data-testid="qr-img-slot-' + kind + '" width="120" height="120" />' +
                  '</a>' +
                  '<span class="qr-slot-code" data-testid="qr-slot-code-' + kind + '">' + shortText + '</span>') +
              '</div>' +
              '</div>'
            );
          })
          .join('');
      }
      // OSE-867: the poster's ONE data call. With renderEvent, the poster card
      // itself is drawn from data.event (the scoped path); otherwise the card
      // is already on screen from the picker list and only the sponsors and
      // codes are filled. Resolves true when the bundle was usable.
      async function loadPosterBundle(eventId, renderEvent) {
        if (!eventId) return false;
        // Gate Print for this render cycle until the codes below settle.
        setPrintReady(false);
        const strip = document.getElementById('poster-sponsor-strip');
        if (strip) {
          strip.setAttribute('aria-busy', 'true');
          strip.innerHTML = '<span class="sr-only" data-testid="poster-sponsors-loading">Loading sponsors…</span>';
        }
        let shown = false;
        try {
          const res = await fetch('/api/v2/events/' + encodeURIComponent(eventId) + '/poster-bundle');
          const data = await res.json();
          if (!data.ok) return false;
          if (renderEvent) {
            if (!data.event || !data.event.id) return false;
            document.getElementById('poster-area').innerHTML = renderPoster(data.event);
            syncChrome(data.event);
          }
          renderPosterSponsors(data.sponsors);
          renderPosterSlots(data.slots);
          shown = true;
        } catch { /* the caller shows the error state (scoped) or keeps the card */ }
        finally {
          const s = document.getElementById('poster-sponsor-strip');
          if (s && s.getAttribute('aria-busy') === 'true') { s.setAttribute('aria-busy', 'false'); s.innerHTML = ''; }
          // AC (OSE-286): re-enable Print only after all QR images finish
          // loading OR error-out. If any code failed, its .qr-loading
          // placeholder stays and the @media print rule hides the whole
          // section — so an incomplete poster still never prints empty boxes.
          await awaitQrImages();
          // A scoped poster that never rendered has nothing to print.
          setPrintReady(shown || !renderEvent);
        }
        return shown;
      }
      // OSE-286 / OSE-R-020: Print via a nonced listener — the button carries
      // no javascript: URI (which the nonce CSP blocks). The disabled attribute
      // already blocks clicks; the guard is belt-and-suspenders for aria state.
      (function wirePrintButton() {
        const btn = document.querySelector('[data-testid="poster-print"]');
        if (btn) btn.addEventListener('click', function () {
          if (!btn.disabled) window.print();
        });
      })();
      init();
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
