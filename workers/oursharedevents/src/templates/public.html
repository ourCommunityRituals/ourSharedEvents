<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{t:list.title}}</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      header { background: var(--surface); border-bottom: 1px solid var(--border); color: var(--text); padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1rem; }
      header h1 { overflow-wrap: anywhere; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
      main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      h2 { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem; }
      /*OCR_EVENT_CARD_CSS*/
      .loading {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .error {
        text-align: center;
        padding: 2rem;
        color: var(--danger);
      }
      .sponsor-strip {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 0;
        margin-bottom: 1rem;
        overflow-x: auto;
      }
      .sponsor-strip:empty {
        display: none;
      }
      .sponsor-card {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .sponsor-card img {
        height: 32px;
        width: auto;
        max-width: 100px;
        object-fit: contain;
      }
      .sponsor-card a {
        font-size: 0.8rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .sponsor-card a:hover {
        text-decoration: underline;
      }
      .sponsor-card a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
      }
      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      /*OCR_NEVER_WHO_CSS*/
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="public-skip-link">{{t:page.skipContent}}</a>
    <header data-testid="public-header" role="banner" aria-label="OurSharedEvents">
      <h1 data-testid="public-title"><a href="/{{langdir}}" data-testid="public-home-link" style="color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px">OurSharedEvents</a></h1>
    </header>
    <main id="main-content" data-testid="public-main" aria-label="{{t:list.mainLabel}}">
      <section data-testid="public-sponsor-section" aria-label="{{t:sponsors.label}}">
        <div
          id="sponsor-banner"
          data-testid="public-sponsor-banner"
          role="region"
          aria-label="{{t:list.sponsorsRegion}}"
        ></div>
      </section>
      <section data-testid="public-events-section" aria-labelledby="events-heading">
        <p id="events-count" class="sr-only" data-testid="public-events-count" role="status" aria-live="polite"><!--OCR_EVENT_COUNT--></p>
        <h2 id="events-heading" data-testid="public-events-heading" tabindex="-1"><!--OCR_EVENTS_HEADING--></h2>
        <!-- Discovery filters (lib/event-discovery): server-rendered GET form +
             "when" chips. Works with no JS; the URL is the state. -->
        <!--OCR_EVENT_FILTERS-->
        <!-- OSE-1243: server-rendered. The Worker replaces this marker with the
             event cards before the page is sent, so the served HTML is the
             truth and there is no second round trip to see an event. The
             "Loading events…" paragraph that used to sit here is gone with the
             script that resolved it. -->
        <div id="events" data-testid="public-events" aria-live="polite" aria-atomic="false">
          <!--OCR_EVENT_LIST-->
        </div>
      </section>
      <!--OCR_NEVER_WHO-->
    </main>
    <!--OCR_LEGAL_FOOTER-->
    <script>
      (async () => {
        const banner = document.getElementById('sponsor-banner');
        if (!banner) return;
        try {
          const params = new URLSearchParams(window.location.search);
          const eventId = params.get('event');
          if (!eventId) return;
          const res = await fetch(
            '/api/v2/events/' + encodeURIComponent(eventId) + '/sponsor-bundle?surface=public'
          );
          const data = await res.json();
          if (!data.ok) return;
          const sponsors = data.bundle?.surface_sponsors?.mobileBanner || [];
          if (!sponsors.length) {
            banner.innerHTML = '<span hidden data-testid="public-sponsor-empty"></span>';
            return;
          }
          const SPONSOR_DEFAULT_LOGO = '/sponsor-default-logo.svg';
          const attr = (v) =>
            String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
          banner.innerHTML = sponsors
            .map((s) => {
              // 0083: every sponsor shows an image — its logo through the
              // same-origin proxy (the page CSP is img-src 'self' data:, so an
              // external URL here was always blocked), or the OSE default. The
              // title is display_name → name. attr() escapes quotes too: these
              // values land inside attributes.
              const title = s.title || s.name;
              const src = s.logo_url
                ? '/api/v2/sponsors/' + encodeURIComponent(s.id) + '/logo'
                : SPONSOR_DEFAULT_LOGO;
              const logo =
                '<img src="' + attr(src) + '" alt="' + attr(title) + '" referrerpolicy="no-referrer" data-hide-on-error="1" data-default-src="' + SPONSOR_DEFAULT_LOGO + '" data-testid="public-sponsor-logo">';
              const place = s.address_line
                ? '<small class="sub-line" data-testid="public-sponsor-address">' + attr(s.address_line) + '</small>'
                : '';
              // A tap goes to the https website when there is one, otherwise to
              // the sponsor's own card (title, location, contact). OSE-1438: the
              // resolver sends card_url only when that card renders; without
              // either, the name shows unlinked rather than linking to a 404.
              const link = s.website_url
                ? // OSE-1164: noreferrer (not just noopener) so clicking a sponsor sends NO
                  // Referer header to the sponsor's site — the outbound click leaks neither
                  // the attendee nor which OSE event page they came from.
                  '<a href="' + attr(s.website_url) + '" target="_blank" rel="noopener noreferrer" data-testid="public-sponsor-link"><span data-testid="public-sponsor-name">' + attr(title) + '</span></a>'
                : s.card_url
                  ? '<a href="' + attr(s.card_url) + '" data-testid="public-sponsor-card-link"><span data-testid="public-sponsor-name">' + attr(title) + '</span></a>'
                  : '<span data-testid="public-sponsor-name">' + attr(title) + '</span>';
              return '<div class="sponsor-card" data-testid="public-sponsor-card">' + logo + link + place + '</div>';
            })
            .join('');
          banner.classList.add('sponsor-strip');
          sponsors.forEach((s) => {
            fetch(
              '/api/v2/events/' +
                encodeURIComponent(eventId) +
                '/sponsors/' +
                encodeURIComponent(s.id) +
                '/impression',
              {
                method: 'POST',
                // OSE-1164: the sponsor-signal endpoints are aggregate-only (never-who).
                // Omit credentials so the anonymous-scan cookie (ose_anon) is not even
                // SENT to them — the "no link back to you" guarantee is then structural
                // (the identity never reaches the server), not merely a handler that
                // chooses not to read it. Locked by sponsor-signal-never-who.invariant.spec.ts.
                credentials: 'omit',
                headers: { 'Content-Type': 'application/json' },
                // OSE-1310: beacon_token is minted per-sponsor into this bundle
                // response; without it the write is dropped (honest 202, not counted).
                body: JSON.stringify({ surface: 'public', placement: 'mobileBanner', beacon_token: s.beacon_token }),
              }
            ).catch(() => {});
          });
        } catch {
          if (banner) banner.innerHTML = '<span hidden data-testid="public-sponsor-error"></span>';
        }
      })();
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            // 0083: a sponsor logo that fails becomes the OSE default instead of
            // vanishing; only if the default itself fails is the image hidden.
            // The fallback is a fixed same-origin path, never read back from
            // the DOM — data-default-src only marks which images may fall back.
            var d = '/sponsor-default-logo.svg';
            if (el.hasAttribute('data-default-src') && el.getAttribute('src') !== d) el.setAttribute('src', d);
            else el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
