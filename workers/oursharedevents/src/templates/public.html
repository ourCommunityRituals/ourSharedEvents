<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OurSharedEvents</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        padding: 1.25rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      main {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }
      #events {
        display: grid;
        gap: 1rem;
      }
      .event-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1.25rem 1.5rem;
        border-left: 3px solid var(--accent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        transition: background 0.15s;
      }
      .event-card:hover {
        background: var(--surface-hover);
      }
      .event-card .event-info {
        flex: 1;
        min-width: 0;
      }
      .event-card h3 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--text);
      }
      .event-card .meta {
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .event-card .cta {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1.25rem;
        min-height: var(--tap-min);
        background: var(--accent);
        color: var(--on-accent);
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .event-card .cta:hover {
        background: var(--accent-hover);
      }
      .event-card .cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .loading {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .error {
        text-align: center;
        padding: 2rem;
        color: var(--danger);
      }
      .sponsor-strip {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 0;
        margin-bottom: 1rem;
        overflow-x: auto;
      }
      .sponsor-strip:empty {
        display: none;
      }
      .sponsor-card {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .sponsor-card img {
        height: 32px;
        width: auto;
        max-width: 100px;
        object-fit: contain;
      }
      .sponsor-card a {
        font-size: 0.8rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .sponsor-card a:hover {
        text-decoration: underline;
      }
      .sponsor-card a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="public-skip-link">Skip to content</a>
    <header data-testid="public-header" role="banner" aria-label="OurSharedEvents">
      <h1 data-testid="public-title">OurSharedEvents</h1>
    </header>
    <main id="main-content" data-testid="public-main" aria-label="Upcoming community events">
      <section data-testid="public-sponsor-section" aria-label="Event sponsors">
        <div
          id="sponsor-banner"
          data-testid="public-sponsor-banner"
          role="region"
          aria-label="Sponsors"
        ></div>
      </section>
      <section data-testid="public-events-section" aria-labelledby="events-heading">
        <p id="events-count" class="sr-only" data-testid="public-events-count" role="status" aria-live="polite"></p>
        <h2 id="events-heading" data-testid="public-events-heading" tabindex="-1">Upcoming Events</h2>
        <div id="events" data-testid="public-events" aria-live="polite" aria-atomic="false">
          <p class="loading" data-testid="public-loading" role="status">Loading events&hellip;</p>
        </div>
      </section>
    </main>
    <footer data-testid="public-footer">
      <p data-testid="public-footer-copyright">&copy; 2026 OurSharedEvents &middot; <a href="/events" data-testid="public-footer-browse">Browse Events</a></p>
    </footer>
    <script>
      (async () => {
        const esc = (s) => {
          const d = document.createElement('div');
          d.textContent = s;
          return d.innerHTML;
        };
        const container = document.getElementById('events');
        try {
          const res = await fetch('/api/v2/events');
          const data = await res.json();
          if (!data.ok || !data.items.length) {
            container.innerHTML =
              '<p class="loading" data-testid="public-events-empty" role="status">No events scheduled.</p>';
            return;
          }
          const countEl = document.getElementById('events-count');
          if (countEl) countEl.textContent = data.items.length + ' upcoming event' + (data.items.length === 1 ? '' : 's');
          container.innerHTML = data.items
            .map((e) => {
              const safeId = esc(String(e.id || ''));
              // OSE-871 (P-1): read ONE canonical name per value. The API emits
              // name/startDateISO/venue (OSE-844, mapped in enrichWithPhase), so
              // the `|| e.title` / `|| e.start_date` / `|| e.location` dual-reads
              // are gone — public no longer teaches future surfaces that two
              // names per value is normal. Empty renders its empty state.
              const safeName = esc(e.name || '');
              const encodedName = encodeURIComponent(e.name || '');
              const dateStr = e.startDateISO
                ? esc(
                    new Date(e.startDateISO).toLocaleDateString('en-US', {
                      weekday: 'long',
                      year: 'numeric',
                      month: 'long',
                      day: 'numeric',
                    })
                  )
                : '';
              const venueStr = e.venue ? esc(e.venue) : '';
              const datePart = dateStr ? '<span data-testid="public-event-date">' + dateStr + '</span>' : '';
              const venuePart = venueStr ? ' &middot; <span data-testid="public-event-venue">' + venueStr + '</span>' : '';
              return `
          <div class="event-card" data-testid="public-event-card" data-event-id="${safeId}">
            <div class="event-info" data-testid="public-event-info">
              <h3 data-testid="public-event-name">${safeName}</h3>
              <p class="meta" data-testid="public-event-meta">${datePart}${venuePart}</p>
            </div>
            <a class="cta" href="/forms/${safeId}?type=register&event=${encodedName}" data-testid="public-event-cta" aria-label="Register for ${safeName}">Register</a>
          </div>`;
            })
            .join('');
        } catch (err) {
          container.innerHTML =
            '<p class="error" data-testid="public-error">Could not load events. Please try again.</p>';
        }
      })();
    </script>
    <script>
      (async () => {
        const banner = document.getElementById('sponsor-banner');
        if (!banner) return;
        try {
          const params = new URLSearchParams(window.location.search);
          const eventId = params.get('event');
          if (!eventId) return;
          const res = await fetch(
            '/api/v2/events/' + encodeURIComponent(eventId) + '/sponsor-bundle?surface=public'
          );
          const data = await res.json();
          if (!data.ok) return;
          const sponsors = data.bundle?.surface_sponsors?.mobileBanner || [];
          if (!sponsors.length) {
            banner.innerHTML = '<span hidden data-testid="public-sponsor-empty"></span>';
            return;
          }
          const esc = (s) => {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
          };
          banner.innerHTML = sponsors
            .map((s) => {
              const logo = s.logo_url
                ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.name) + '" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'" data-testid="public-sponsor-logo">'
                : '';
              const link = s.website_url
                ? '<a href="' + esc(s.website_url) + '" target="_blank" rel="noopener" data-testid="public-sponsor-link"><span data-testid="public-sponsor-name">' + esc(s.name) + '</span></a>'
                : '<span data-testid="public-sponsor-fallback">' + esc(s.name) + '</span>';
              return '<div class="sponsor-card" data-testid="public-sponsor-card">' + logo + link + '</div>';
            })
            .join('');
          banner.classList.add('sponsor-strip');
          sponsors.forEach((s) => {
            fetch(
              '/api/v2/events/' +
                encodeURIComponent(eventId) +
                '/sponsors/' +
                encodeURIComponent(s.id) +
                '/impression',
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ surface: 'public', placement: 'mobileBanner' }),
              }
            ).catch(() => {});
          });
        } catch {
          if (banner) banner.innerHTML = '<span hidden data-testid="public-sponsor-error"></span>';
        }
      })();
    </script>
  </body>
</html>
