<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OurSharedEvents</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        padding: 1.25rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
      }
      main {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }
      #events {
        display: grid;
        gap: 1rem;
      }
      .event-card {
        min-height: var(--tap-min);
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1.25rem 1.5rem;
        border-left: 3px solid var(--accent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        transition: background 0.15s;
      }
      .event-card:hover {
        background: var(--surface-hover);
      }
      .event-card-link {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: var(--radius-sm);
      }
      .event-card-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .event-card .event-info {
        position: relative;
        z-index: 2;
        pointer-events: none;
        flex: 1;
        min-width: 0;
      }
      .event-card h3 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--text);
      }
      .disc-search {
        display: flex;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
      }
      .disc-q {
        flex: 1;
        min-height: 48px;
        font-size: 1rem;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
      }
      .disc-go {
        min-height: 48px;
        padding: 0 1.1rem;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      /* OSE-1372: wrap */
      .disc-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .disc-chip,
      .disc-clear {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 0.95rem;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .disc-chip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .disc-chip.active::before {
        content: '\2713';
        margin-right: 0.35rem;
      }
      .disc-clear {
        color: var(--text);
        text-decoration: underline;
      }
      .disc-summary {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin: 0 0 0.75rem;
      }
      .empty {
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        padding: 1.5rem 1rem;
        text-align: center;
        color: var(--text-muted);
      }
      .event-card .meta {
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .event-thumb {
        flex: none;
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: var(--radius-sm);
        background: var(--border);
      }
      .event-card .cta {
        position: relative;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1.25rem;
        min-height: var(--tap-min);
        background: var(--accent);
        color: var(--on-accent);
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .event-card .cta-secondary {
        background: transparent;
        color: var(--accent);
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .tag-wrapped {
        display: inline-block;
        margin-left: 0.5rem;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: middle;
        background: var(--bg);
        color: var(--text-muted);
      }
      .event-card .cta:hover {
        background: var(--accent-hover);
      }
      .event-card .cta:focus-visible,
      .sponsor-card a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .loading {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .error {
        text-align: center;
        padding: 2rem;
        color: var(--danger);
      }
      .sponsor-strip {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 0;
        margin-bottom: 1rem;
        overflow-x: auto;
      }
      .sponsor-strip:empty {
        display: none;
      }
      .sponsor-card {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .sponsor-card img {
        height: 32px;
        max-width: 100px;
        object-fit: contain;
      }
      .sponsor-card a {
        font-size: 0.8rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .sponsor-card a:hover {
        text-decoration: underline;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        background: var(--surface);
        color: var(--text);
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      /* Never-who: lib/never-who.ts */
      /*OCR_NEVER_WHO_CSS*/
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="public-skip-link">Skip to content</a>
    <header data-testid="public-header" role="banner" aria-label="OurSharedEvents">
      <h1 data-testid="public-title">OurSharedEvents</h1>
    </header>
    <main id="main-content" data-testid="public-main" aria-label="Upcoming community events">
      <section data-testid="public-sponsor-section" aria-label="Event sponsors">
        <div
          id="sponsor-banner"
          data-testid="public-sponsor-banner"
          role="region"
          aria-label="Sponsors"
        ></div>
      </section>
      <section data-testid="public-events-section" aria-labelledby="events-heading">
        <p id="events-count" class="sr-only" data-testid="public-events-count" role="status" aria-live="polite"><!--OCR_EVENT_COUNT--></p>
        <h2 id="events-heading" data-testid="public-events-heading" tabindex="-1">Upcoming Events</h2>
        <!-- Discovery filters (lib/event-discovery): server-rendered GET form +
             "when" chips. Works with no JS; the URL is the state. -->
        <!--OCR_EVENT_FILTERS-->
        <!-- OSE-1243: server-rendered. The Worker replaces this marker with the
             event cards before the page is sent, so the served HTML is the
             truth and there is no second round trip to see an event. The
             "Loading events…" paragraph that used to sit here is gone with the
             script that resolved it. -->
        <div id="events" data-testid="public-events" aria-live="polite" aria-atomic="false">
          <!--OCR_EVENT_LIST-->
        </div>
      </section>
      <!--OCR_NEVER_WHO-->
    </main>
    <!--OCR_LEGAL_FOOTER-->
    <script>
      (async () => {
        const banner = document.getElementById('sponsor-banner');
        if (!banner) return;
        try {
          const params = new URLSearchParams(window.location.search);
          const eventId = params.get('event');
          if (!eventId) return;
          const res = await fetch(
            '/api/v2/events/' + encodeURIComponent(eventId) + '/sponsor-bundle?surface=public'
          );
          const data = await res.json();
          if (!data.ok) return;
          const sponsors = data.bundle?.surface_sponsors?.mobileBanner || [];
          if (!sponsors.length) {
            banner.innerHTML = '<span hidden data-testid="public-sponsor-empty"></span>';
            return;
          }
          const esc = (s) => {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
          };
          banner.innerHTML = sponsors
            .map((s) => {
              const logo = s.logo_url
                ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.name) + '" referrerpolicy="no-referrer" data-hide-on-error="1" data-testid="public-sponsor-logo">'
                : '';
              const link = s.website_url
                ? // OSE-1164: noreferrer (not just noopener) so clicking a sponsor sends NO
                  // Referer header to the sponsor's site — the outbound click leaks neither
                  // the attendee nor which OSE event page they came from.
                  '<a href="' + esc(s.website_url) + '" target="_blank" rel="noopener noreferrer" data-testid="public-sponsor-link"><span data-testid="public-sponsor-name">' + esc(s.name) + '</span></a>'
                : '<span data-testid="public-sponsor-fallback">' + esc(s.name) + '</span>';
              return '<div class="sponsor-card" data-testid="public-sponsor-card">' + logo + link + '</div>';
            })
            .join('');
          banner.classList.add('sponsor-strip');
          sponsors.forEach((s) => {
            fetch(
              '/api/v2/events/' +
                encodeURIComponent(eventId) +
                '/sponsors/' +
                encodeURIComponent(s.id) +
                '/impression',
              {
                method: 'POST',
                // OSE-1164: the sponsor-signal endpoints are aggregate-only (never-who).
                // Omit credentials so the anonymous-scan cookie (ose_anon) is not even
                // SENT to them — the "no link back to you" guarantee is then structural
                // (the identity never reaches the server), not merely a handler that
                // chooses not to read it. Locked by sponsor-signal-never-who.invariant.spec.ts.
                credentials: 'omit',
                headers: { 'Content-Type': 'application/json' },
                // OSE-1310: beacon_token is minted per-sponsor into this bundle
                // response; without it the write is dropped (honest 202, not counted).
                body: JSON.stringify({ surface: 'public', placement: 'mobileBanner', beacon_token: s.beacon_token }),
              }
            ).catch(() => {});
          });
        } catch {
          if (banner) banner.innerHTML = '<span hidden data-testid="public-sponsor-error"></span>';
        }
      })();
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
