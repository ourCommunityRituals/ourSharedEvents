<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in &middot; OurSharedEvents Admin</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/ui.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        color: var(--text);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        text-decoration: none;
        color: var(--text);
      }
      nav {
        display: flex;
        gap: 1.5rem;
      }
      /* OSE-292: signin/public secondary nav links also need 44px floor. */
      nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 0.5rem;
      }
      nav a:hover,
      nav a:focus-visible {
        color: var(--text);
      }
      nav a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      .signin-card {
        background: var(--surface);
        max-width: 460px;
        width: 100%;
        border-radius: var(--radius);
        padding: 2.5rem 2rem;
        border: 1px solid var(--border);
      }
      .signin-card h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.5rem;
      }
      .signin-card .lede {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 1.75rem;
      }
      /* Foreground comes from the canonical .btn-primary in /ui.css (the CTA
         adopts `btn btn-primary` below), so no on-accent hex lives here. The
         .cta keeps only its layout deltas (font-size, padding, margin); its
         higher specificity preserves those over .btn's defaults. */
      .signin-card .cta {
        display: inline-flex;
        align-items: center;
        background: var(--accent);
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius-sm);
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        min-height: var(--tap-min);
        transition: background 0.2s;
        margin-bottom: 1.5rem;
      }
      .signin-card .cta:hover {
        background: var(--accent-hover);
      }
      .signin-card .cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .signin-card .helper {
        font-size: 0.85rem;
        color: var(--text-muted);
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        margin-top: 0.5rem;
      }
      .signin-card .helper a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .signin-card .helper a:hover {
        text-decoration: underline;
      }
      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8rem;
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--text);
      }
      .skip-link {
        position: absolute;
        left: -9999px;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        padding: 0.5rem 1rem;
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid var(--accent);
      }
      @media (max-width: 480px) {
        header {
          padding: 0.75rem 1rem;
        }
        nav {
          gap: 1rem;
        }
        .signin-card {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <header data-testid="signin-header">
      <a href="/" class="logo" data-testid="signin-logo">OurSharedEvents</a>
      <nav data-testid="signin-nav">
        <a href="/events" data-testid="nav-events">Events</a>
      </nav>
    </header>
    <main id="main-content" data-testid="signin-main">
      <section class="signin-card" data-testid="signin-card">
        <h1 data-testid="signin-heading">Admin sign-in required</h1>
        <p class="lede" data-testid="signin-lede">
          This page is for event organizers. Sign in with your authorized work email to manage your
          events and access reports.
        </p>
        <a href="/admin" class="cta btn btn-primary" data-testid="signin-cta" rel="noopener"
          >Sign in to admin</a
        >
        <p class="helper" data-testid="signin-helper">
          New to OurSharedEvents?
          <a href="/" data-testid="signin-request-access">Request access from the home page</a>
          &mdash; subscribe and we&#x2019;ll be in touch.
        </p>
      </section>
    </main>
    <!--OCR_LEGAL_FOOTER-->
  </body>
</html>
