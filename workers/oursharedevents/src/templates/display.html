<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display – OurSharedEvents</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .clock {
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
      }
      main {
        flex: 1;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .event-card {
        border-radius: 12px;
        padding: 2rem 2.5rem;
        border: 1px solid;
      }
      .event-card .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.5rem;
      }
      .event-card h2 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 0.75rem;
      }
      .event-card .meta {
        font-size: 1.1rem;
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      .next-events {
        display: grid;
        gap: 1rem;
      }
      .next-events h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.25rem;
      }
      .next-card {
        border-radius: 8px;
        padding: 1rem 1.25rem;
        border: 1px solid;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .next-card .name {
        font-weight: 600;
        font-size: 1rem;
      }
      .next-card .date {
        font-size: 0.85rem;
      }
      .empty {
        text-align: center;
        padding: 4rem;
        font-size: 1.1rem;
      }
      .display-consent {
        margin: 0;
        padding: 0.75rem 2rem;
        background: var(--surface);
        color: var(--text);
        font-size: 1.25rem;
        text-align: center;
        letter-spacing: 0.01em;
      }
      @media (min-width: 1600px) {
        .display-consent {
          font-size: 2rem;
          padding: 1.25rem 3rem;
        }
      }
      .ticker {
        padding: 0.6rem 2rem;
        font-size: 0.85rem;
        border-top: 1px solid;
        overflow: hidden;
        white-space: nowrap;
      }
      .ticker-inner {
        display: inline-block;
        animation: scroll 30s linear infinite;
      }
      @keyframes scroll {
        from {
          transform: translateX(100vw);
        }
        to {
          transform: translateX(-100%);
        }
      }
      .display-sponsor-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        border: 1px solid;
        min-height: 48px;
      }
      .display-sponsor-banner:empty {
        display: none;
      }
      .display-sponsor-sidebar {
        position: fixed;
        right: 0;
        top: 60px;
        width: 200px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        z-index: 10;
      }
      .display-sponsor-sidebar:empty {
        display: none;
      }
      .display-sponsor-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid;
        transition: opacity 0.6s ease-in-out;
      }
      .display-sponsor-item.fade-out {
        opacity: 0;
      }
      /* OSE-878/#25: ONE uniform logo box for every sponsor regardless of tier,
         responsive (clamp) from phone to the 10-foot TV. Tier-blind — money buys
         frequency, never size/slot/treatment. WALL-3b (OSE-835) enforces this. */
      .display-sponsor-item img {
        height: clamp(32px, 3.5vw, 56px);
        width: auto;
        max-width: clamp(80px, 12vw, 160px);
        object-fit: contain;
        filter: brightness(1.1);
      }
      .display-sponsor-item .name {
        font-size: 0.8rem;
      }
      /* OSE-878/#25: the per-tier treatment blocks (title/platinum gold accent
         border + background + padding + 48px/64px logos + brighter/bolder name;
         gold mid-strength border + 42px logo) are DELETED. Every sponsor item
         renders identically; `data-tier` stays for rotation identity but NO CSS
         keys off it. Rotation FREQUENCY (buildShareRotation) is the only diff. */
      .sponsor-counter {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-align: center;
        margin-top: 0.25rem;
        font-variant-numeric: tabular-nums;
      }
      @media (min-width: 1920px) {
        header h1 {
          font-size: 2rem;
        }
        .clock {
          font-size: 1.4rem;
        }
        main {
          max-width: 1600px;
          padding: 3rem 2.5rem;
          gap: 2rem;
        }
        .event-card {
          padding: 3rem 3.5rem;
        }
        .event-card h2 {
          font-size: 3rem;
        }
        .event-card .meta {
          font-size: 1.4rem;
        }
        .display-sponsor-sidebar {
          width: 280px;
          padding: 1.5rem;
          top: 80px;
        }
        /* OSE-878/#25: per-breakpoint sponsor logo sizes removed — the tier-blind
           clamp() on .display-sponsor-item img already scales to the TV; the old
           uniform 48px + tier 64px overrides here would (a) freeze the clamp and
           (b) reintroduce a tier-keyed dimension. Only the uniform name bump stays. */
        .display-sponsor-item .name {
          font-size: 1rem;
        }
        .display-sponsor-banner {
          padding: 1rem 2rem;
          gap: 3rem;
          min-height: 64px;
        }
        .ticker {
          font-size: 1.1rem;
          padding: 0.8rem 2rem;
        }
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        z-index: 9999;
        text-decoration: none;
        border-bottom: 2px solid;
      }
    </style>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      body {
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .event-card {
        background: var(--surface-hover);
        border-color: var(--border);
      }
      .next-card {
        background: var(--surface);
        border-color: var(--border);
      }
      .event-card .label,
      .next-card .date,
      .clock,
      .empty {
        color: var(--text-muted);
      }
      .event-card .meta {
        color: var(--text-muted);
      }
      .event-card h2 {
        color: var(--text);
      }
      .next-events h3 {
        color: var(--text-muted);
      }
      .ticker {
        background: var(--surface);
        color: var(--accent);
        border-top-color: var(--border);
      }
      .display-sponsor-item {
        background: var(--surface);
        border-color: var(--border);
      }
      .display-sponsor-item .name {
        color: var(--text-muted);
      }
      .display-sponsor-banner {
        background: var(--surface);
        border-color: var(--border);
      }
      .skip-link:focus {
        background: var(--surface);
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .pane-dots {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        list-style: none;
      }
      .pane-dots li {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: var(--border);
      }
      .pane-dots li[aria-current='true'] {
        background: var(--accent);
      }
      .pane-paused {
        text-align: center;
        color: var(--text-muted);
      }
      .league-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .league-card img {
        width: clamp(140px, 14vw, 240px);
      }
      .sponsor-wall {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="display-skip-link">Skip to content</a>
    <header data-testid="display-header" aria-label="OurSharedEvents live display">
      <h1 data-testid="display-title">OurSharedEvents</h1>
      <div class="clock" id="clock" aria-live="off" data-testid="display-clock"></div>
    </header>
    <aside
      id="display-sponsor-sidebar"
      class="display-sponsor-sidebar"
      data-testid="display-sponsor-sidebar"
      aria-label="Side sponsors"
    ></aside>
    <main id="main-content" data-testid="display-main" aria-live="polite" aria-atomic="false">
      <p class="empty" data-testid="display-loading">Loading&hellip;</p>
    </main>
    <div
      id="display-sponsor-banner"
      class="display-sponsor-banner"
      data-testid="display-sponsor-banner"
    ></div>
    <!-- Walkthrough 2026-09-03: the TV is the one surface a whole room looks at,
         and it carried no privacy line. The promise, in 10-foot type, in the voice. -->
    <p class="display-consent" data-testid="display-consent" role="note">
      We count the room, never the person. Nothing about you is collected to show this screen.
    </p>
    <div class="ticker" aria-hidden="true" data-testid="display-ticker">
      <span class="ticker-inner" id="ticker" data-testid="display-ticker-text"
        >OurSharedEvents &mdash; Community events on Chicago&rsquo;s Southside &mdash; We count the room, never the person</span
      >
    </div>
    <script>
      // Clock
      function updateClock() {
        const el = document.getElementById('clock');
        if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      updateClock();
      setInterval(updateClock, 30_000);

      // OSE-1081: `event` is the CANONICAL surface deep-link param. admin.html's
      // scopedSurfaceUrl() emits /display?event=<id>, but this page used to ignore
      // location.search entirely and always feature items[0] — so a kiosk pointed
      // at a scoped display link showed whichever event happened to sort first.
      // Returns the index of the requested event, or -1 when the param is absent
      // or names an event this page did not fetch (then items[0] still leads).
      function requestedEventIndex(items) {
        const wanted = new URLSearchParams(location.search).get('event');
        if (!wanted) return -1;
        for (let i = 0; i < items.length; i++) {
          if (items[i] && items[i].id === wanted) return i;
        }
        return -1;
      }

      // ── Pane rotation ──
      // Ported from the GAS display's rotation engine (MVP-EVENT-TOOLKIT,
      // startRotationEngine). Instead of one fixed layout, the TV cycles through
      // screens ("panes") one at a time. Only a pane with something to show
      // joins the cycle; with one pane there is no timer and no dots.
      // The order and seconds per pane are what the organiser saved in /admin
      // (GET /api/v2/events/:id/display-config, re-checked every minute with its
      // ETag: unchanged means no re-render). The kiosk URL can still override:
      //   ?panes=event,upcoming,sponsors,league  picks and orders them
      //                                          (allowlisted; others ignored)
      //   ?dwell=15                              seconds per pane, 5..120
      // Space pauses, the arrow keys step: the remote a host actually holds.
      // The panes are a VISIBILITY layer: every pane renders the same data,
      // escaped the same way, as the board did before; rotation only hides.
      var PANE_TYPES = ['event', 'upcoming', 'sponsors', 'league'];
      var PANE_LABELS = { event: 'Featured event', upcoming: 'Also coming up', sponsors: 'Our sponsors', league: 'League' };
      function clampDwell(secs) {
        return Math.min(120, Math.max(5, secs));
      }
      // The saved config wins over the default; the URL wins over both.
      function effectiveRotation(url, saved) {
        var order = url.order;
        var dwellMs = url.dwellMs;
        if (saved && !url.fixedOrder && Array.isArray(saved.panes)) {
          var picked = saved.panes.filter(function (t) { return PANE_TYPES.indexOf(t) !== -1; });
          if (picked.length) order = picked;
        }
        if (saved && !url.fixedDwell && saved.dwell_seconds > 0) dwellMs = clampDwell(saved.dwell_seconds) * 1000;
        return { order: order, dwellMs: dwellMs };
      }
      function rotationConfig(search) {
        var params = new URLSearchParams(search);
        var order = [];
        String(params.get('panes') || '').split(',').forEach(function (t) {
          t = t.trim();
          if (PANE_TYPES.indexOf(t) !== -1 && order.indexOf(t) === -1) order.push(t);
        });
        var fixedOrder = order.length > 0;
        if (!fixedOrder) order = PANE_TYPES.slice();
        var secs = parseInt(params.get('dwell') || '', 10);
        var fixedDwell = secs > 0;
        if (!fixedDwell) secs = 15;
        return { order: order, dwellMs: clampDwell(secs) * 1000, fixedOrder: fixedOrder, fixedDwell: fixedDwell };
      }
      // Pure engine: no DOM. onShow(pane, index, paused) does the painting, and
      // timers are injectable so the cadence can be tested without waiting.
      function createPaneRotation(panes, dwellMs, onShow, timers) {
        var t = timers || {
          set: function (f, ms) { return setTimeout(f, ms); },
          clear: function (id) { clearTimeout(id); }
        };
        var state = { index: 0, paused: false, hidden: false, timer: null };
        function schedule() {
          if (state.timer !== null) { t.clear(state.timer); state.timer = null; }
          if (panes.length > 1 && !state.paused && !state.hidden) {
            state.timer = t.set(function () { state.timer = null; go(state.index + 1); }, dwellMs);
          }
        }
        function go(i) {
          if (!panes.length) return;
          state.index = ((i % panes.length) + panes.length) % panes.length;
          onShow(panes[state.index], state.index, state.paused);
          schedule();
        }
        return {
          start: function (i, paused) { state.paused = !!paused; go(i || 0); },
          next: function () { go(state.index + 1); },
          prev: function () { go(state.index - 1); },
          togglePause: function () { state.paused = !state.paused; go(state.index); return state.paused; },
          setHidden: function (h) { state.hidden = !!h; schedule(); },
          stop: function () { if (state.timer !== null) t.clear(state.timer); state.timer = null; },
          current: function () { return panes[state.index]; },
          isPaused: function () { return state.paused; },
          size: function () { return panes.length; }
        };
      }
      var ROTATION = rotationConfig(location.search);
      // board.items: the fetched events; board.sponsors: [{ title, src }] for
      // the sponsors pane, filled by loadDisplaySponsors (logo rules live there).
      // board.config: the last display-config body, board.configEtag its ETag.
      // board.sponsorsFor: the event whose sponsors are on screen (loadDisplaySponsors).
      var board = { items: null, sponsors: [], rotation: null, config: null, configEtag: null, configFor: null, sponsorsFor: null, stopSideRail: null, sideRailVisibility: null };
      // A league link's QR is a PNG data URI from our own endpoint; anything
      // else is not put in an <img src>.
      function isQrDataUri(v) {
        return typeof v === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(v);
      }
      // "league.example/standings" — enough to recognise, short enough for a TV.
      function shortUrl(u) {
        try { var x = new URL(u); var t = x.hostname.replace(/^www\./, '') + (x.pathname === '/' ? '' : x.pathname); return t.length > 40 ? t.slice(0, 39) + '…' : t; }
        catch (err) { return ''; }
      }
      // Quote-safe: sponsor values land inside attributes.
      function escAttr(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      }
      function showPane(type, index, paused) {
        document.querySelectorAll('[data-pane]').forEach(function (el) {
          el.hidden = el.getAttribute('data-pane') !== type;
        });
        document.querySelectorAll('.pane-dots li').forEach(function (li, i) {
          li.setAttribute('aria-current', i === index ? 'true' : 'false');
        });
        var note = document.querySelector('.pane-paused');
        if (note) note.hidden = !paused;
      }

      // Events
      function renderBoard() {
        const main = document.getElementById('main-content');
        const items = board.items;
        if (!main || !items || !items.length) return;
        const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
        // OSE-1313 — render in the EVENT's zone, never the viewer's (see poster.html).
        const inZone = (iso, tz, opts) => {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return ''; // dirty value: render nothing, never throw
          try { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz || 'UTC' }, opts)).format(d); }
          catch (err) { return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, opts)).format(d); } // unknown zone only
        };
        const DATE_OPTS = { weekday:'long', month:'long', day:'numeric' };
        const fmt = ev => {
          const day = ev.starts_at ? inZone(ev.starts_at, ev.timezone, DATE_OPTS) : '';
          if (day) {
            return day + ' · ' +
              inZone(ev.starts_at, ev.timezone, { hour:'numeric', minute:'2-digit', timeZoneName:'short' });
          }
          const d = String(ev.startDateISO || '').slice(0, 10);
          return /^\d{4}-\d{2}-\d{2}$/.test(d) ? inZone(d + 'T00:00:00Z', 'UTC', DATE_OPTS) : '';
        };
        // OSE-1081: the deep-linked event takes the featured slot; the rest of
        // the board is unchanged (still every other event, original order), so
        // a scoped link narrows the focus without hiding what else is coming up.
        const featuredIdx = Math.max(requestedEventIndex(items), 0);
        const featured = items[featuredIdx];
        const rest = items.filter((_, i) => i !== featuredIdx);
        // The saved TV config applies only to the event it was loaded for; while
        // the featured event's own config is on its way, the defaults are shown.
        const cfg = board.config && board.configFor === featured.id ? board.config : null;
        const paneHtml = {};
        paneHtml.event = '<section data-pane="event" data-testid="display-pane-event" aria-label="Featured event" hidden>' +
          '<div class="event-card" data-testid="display-featured-card">' +
          '<div class="label" data-testid="display-featured-label">Upcoming Event</div>' +
          '<h2 data-testid="display-featured-title">' + esc(featured.name || '') + '</h2>' +
          '<div class="meta" data-testid="display-featured-meta">' +
          (fmt(featured) ? '<span data-testid="display-featured-date">' + esc(fmt(featured)) + '</span>' : '') +
          (featured.venue ? '<span data-testid="display-featured-venue">' + esc(featured.venue) + '</span>' : '') +
          '</div></div></section>';
        if (rest.length) {
          paneHtml.upcoming = '<section data-pane="upcoming" data-testid="display-pane-upcoming" aria-label="Also coming up" hidden>' +
            '<div class="next-events" data-testid="display-upcoming"><h3 data-testid="display-upcoming-heading">Also Coming Up</h3>' +
            rest.slice(0, 6).map(e => '<div class="next-card" data-testid="display-upcoming-card"><div class="name" data-testid="display-upcoming-name">' + esc(e.name || '') + '</div>' +
              '<div class="date" data-testid="display-upcoming-date">' + esc(fmt(e)) + '</div></div>').join('') +
            '</div></section>';
        }
        // Tier-blind (OSE-878/#25): one uniform box per sponsor, no data-tier,
        // no size or order treatment. Impressions are NOT logged again here:
        // loadDisplaySponsors already counted each sponsor once per placement.
        if (board.sponsors.length) {
          paneHtml.sponsors = '<section data-pane="sponsors" data-testid="display-pane-sponsors" aria-label="Our sponsors" hidden>' +
            '<div class="next-events"><h3 data-testid="display-wall-heading">Thanks to our sponsors</h3><div class="sponsor-wall">' +
            board.sponsors.map(s => '<div class="display-sponsor-item" data-testid="display-wall-sponsor">' +
              '<img src="' + escAttr(s.src) + '" alt="' + escAttr(s.title) + '" referrerpolicy="no-referrer" data-hide-on-error="1" data-default-src="/sponsor-default-logo.svg" data-testid="display-wall-sponsor-logo">' +
              '<span class="name" data-testid="display-wall-sponsor-name">' + escAttr(s.title) + '</span></div>').join('') +
            '</div></div></section>';
        }
        // League: the links the organiser saved (the league keeps its own
        // tools; we link out). Each card: label, scan-to-open QR, short link.
        const league = (cfg && Array.isArray(cfg.league) ? cfg.league : [])
          .filter(l => l && typeof l.url === 'string');
        if (league.length) {
          paneHtml.league = '<section data-pane="league" data-testid="display-pane-league" aria-label="League" hidden>' +
            '<div class="next-events"><h3 data-testid="display-league-heading">League</h3><div class="sponsor-wall">' +
            league.map(l => '<div class="league-card" data-testid="display-league-item">' +
              (isQrDataUri(l.qr) ? '<img src="' + escAttr(l.qr) + '" alt="Scan for the ' + escAttr(l.label) + '" data-testid="display-league-qr">' : '') +
              '<strong data-testid="display-league-label">' + escAttr(l.label) + '</strong>' +
              '<span data-testid="display-league-url">' + escAttr(shortUrl(l.url)) + '</span></div>').join('') +
            '</div></div></section>';
        }
        const rot = effectiveRotation(ROTATION, cfg);
        const panes = rot.order.filter(type => paneHtml[type]);
        // The featured event always exists, so a narrowed ?panes= that matches
        // nothing renderable still shows it rather than a blank TV.
        if (!panes.length) panes.push('event');
        const prev = board.rotation;
        const keepType = prev ? prev.current() : null;
        const keepPaused = prev ? prev.isPaused() : false;
        if (prev) prev.stop();
        main.innerHTML = '<div class="display-panes" aria-live="off" data-testid="display-panes">' +
          panes.map(type => paneHtml[type]).join('') + '</div>' +
          (panes.length > 1
            ? '<ol class="pane-dots" data-testid="display-pane-dots" aria-label="Screens">' +
              panes.map(type => '<li aria-label="' + PANE_LABELS[type] + '" aria-current="false"></li>').join('') + '</ol>' +
              '<p class="pane-paused" data-testid="display-pane-paused" hidden>Paused. Press Space to resume.</p>'
            : '');
        board.rotation = createPaneRotation(panes, rot.dwellMs, showPane);
        board.rotation.setHidden(document.hidden);
        board.rotation.start(Math.max(panes.indexOf(keepType), 0), keepPaused);
      }
      async function loadEvents() {
        const main = document.getElementById('main-content');
        try {
          const res = await fetch('/api/v2/events');
          const data = await res.json();
          let items = (data.ok && data.items) ? data.items : [];
          // A ?event=<id> that is live but not in the public list (unlisted, or
          // another brand's) is fetched by id, so the TV shows THAT event and
          // loads its config. Drafts are not public: the list falls back as before.
          const wanted = new URLSearchParams(location.search).get('event');
          if (wanted && requestedEventIndex(items) === -1) {
            try {
              const one = await fetch('/api/v2/events/' + encodeURIComponent(wanted));
              const oneData = one.ok ? await one.json() : null;
              if (oneData && oneData.ok && oneData.item && oneData.item.id === wanted) items = [oneData.item].concat(items);
            } catch { /* fall back to the list */ }
          }
          if (!items.length) {
            if (board.rotation) board.rotation.stop();
            board.rotation = null;
            main.innerHTML = '<p class="empty">No upcoming events scheduled.</p>';
            return;
          }
          board.items = items;
          renderBoard();
          loadDisplayConfig();
          loadDisplaySponsors();
          // Update ticker
          const ticker = document.getElementById('ticker');
          if (ticker) ticker.textContent = items.map(e => e.name).filter(Boolean).join(' • ');
        } catch {
          if (board.rotation) board.rotation.stop();
          board.rotation = null;
          main.innerHTML = '<p class="empty" data-testid="display-empty">Could not load events.</p>';
        }
      }
      // Remote control: only when there is more than one pane to move between.
      document.addEventListener('keydown', function (e) {
        const r = board.rotation;
        if (!r || r.size() < 2) return;
        if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'MediaPlayPause') {
          e.preventDefault();
          r.togglePause();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          r.next();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          r.prev();
        }
      });
      document.addEventListener('visibilitychange', function () {
        if (board.rotation) board.rotation.setHidden(document.hidden);
        if (board.sideRailVisibility) board.sideRailVisibility();
      });
      // The featured event's saved TV config. The response carries a strong
      // ETag with Cache-Control: no-cache, so the browser revalidates it and the
      // server answers 304 while nothing changed (ported from the GAS bundles'
      // ETag + swr()). Same ETag as last time → nothing to do: the rotation is
      // never restarted by a check. A failed check keeps the last config.
      async function loadDisplayConfig() {
        const items = board.items;
        if (!items || !items.length || document.hidden) return;
        const featuredId = () => {
          const list = board.items || [];
          const f = list[Math.max(requestedEventIndex(list), 0)];
          return f && f.id;
        };
        const id = featuredId();
        if (!id) return;
        // Overlapping checks: only the newest may write, and only if the
        // featured event is still the one it asked about.
        const seq = (board.configSeq = (board.configSeq || 0) + 1);
        const current = () => seq === board.configSeq && featuredId() === id;
        try {
          const res = await fetch('/api/v2/events/' + encodeURIComponent(id) + '/display-config', { cache: 'no-cache' });
          if (!current() || !res.ok) return;
          const etag = res.headers.get('ETag');
          if (etag && etag === board.configEtag && board.configFor === id) return;
          const data = await res.json();
          if (!current() || !data || !data.ok) return;
          board.config = data;
          board.configEtag = etag;
          board.configFor = id;
          renderBoard();
        } catch { /* keep the last config */ }
      }
      loadEvents();
      // Auto-refresh every 5 minutes; the TV config is re-checked every minute.
      setInterval(loadEvents, 5 * 60 * 1000);
      setInterval(loadDisplayConfig, 60 * 1000);

      // ── Display sponsor loading + rotation ──
      // Called by loadEvents() on every refresh, with the events it just read.
      // It loads only when the FEATURED event changed (board.sponsorsFor), so a
      // refresh of the same event never reloads, never restarts the side rail and
      // never logs impressions twice. When the featured event does change (the
      // leading event ended, say), the previous event's sponsors are cleared
      // from the banner, the side rail and the sponsors pane before the new
      // event's load; a failed load is retried on the next refresh.
      async function loadDisplaySponsors() {
        const sidebar = document.getElementById('display-sponsor-sidebar');
        const banner = document.getElementById('display-sponsor-banner');
        const items = board.items || [];
        if (!items.length) return;
        // OSE-1081: sponsors follow the FEATURED event, so a ?event=<id> kiosk
        // shows that event's sponsors rather than items[0]'s. Same resolution as
        // loadEvents(), so the two halves of the screen can never disagree.
        const featuredIdx = Math.max(requestedEventIndex(items), 0);
        const eventId = items[featuredIdx] && items[featuredIdx].id;
        if (!eventId || eventId === board.sponsorsFor) return;
        const hadSponsors = board.sponsorsFor !== null;
        board.sponsorsFor = eventId;
        if (hadSponsors) {
          if (board.stopSideRail) board.stopSideRail();
          board.stopSideRail = null;
          board.sideRailVisibility = null;
          if (banner) banner.innerHTML = '';
          if (sidebar) sidebar.innerHTML = '';
          board.sponsors = [];
          renderBoard();
        }
        const stale = () => board.sponsorsFor !== eventId;
        try {
          const res = await fetch('/api/v2/events/' + encodeURIComponent(eventId) + '/sponsor-bundle?surface=display');
          const data = await res.json();
          if (stale()) return; // a newer featured event won
          if (!data.ok) { board.sponsorsFor = null; return; }
          const bundle = data.bundle || {};
          // Escapes quotes as well: these values land inside attributes (0083).
          const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
          const SPONSOR_DEFAULT_LOGO = '/sponsor-default-logo.svg';
          // 0083: logos load through the same-origin proxy (the page CSP and
          // COEP both block an external <img src>), and a sponsor with no logo
          // shows the OSE default. slot=sidebar prefers the compact logo.
          const logoSrc = (s, slot) => s.logo_url || s.sidebar_logo_url
            ? '/api/v2/sponsors/' + encodeURIComponent(s.id) + '/logo' + (slot ? '?slot=' + slot : '')
            : SPONSOR_DEFAULT_LOGO;
          const tvTop = bundle.surface_sponsors?.tvTop || [];
          const tvSide = bundle.surface_sponsors?.tvSide || [];
          // The sponsors pane: every display sponsor once (a sponsor in both
          // slots is one tile), same proxy + default-logo rule as the banner.
          const seen = new Set();
          board.sponsors = tvTop.concat(tvSide).filter(s => s && s.id && !seen.has(s.id) && seen.add(s.id))
            // The header logo, else the compact one (the proxy's slot=sidebar
            // serves compact-or-header), else the OSE default.
            .map(s => ({ title: s.title || s.name, src: s.logo_url ? logoSrc(s) : logoSrc(s, 'sidebar') }));
          renderBoard();
          if (banner && tvTop.length) {
            banner.innerHTML = tvTop.map(s => {
              // OSE-R-015 (2026-05-15): referrerpolicy + onerror.
              const title = s.title || s.name;
              const logo = '<img src="' + esc(s.logo_url ? logoSrc(s) : SPONSOR_DEFAULT_LOGO) + '" alt="' + esc(title) + '" referrerpolicy="no-referrer" data-hide-on-error="1" data-default-src="' + SPONSOR_DEFAULT_LOGO + '" data-testid="display-sponsor-logo">';
              return '<div class="display-sponsor-item" data-tier="' + esc(s.tier || 'primary') + '" data-testid="display-sponsor-item">' + logo + '<span class="name" data-testid="display-sponsor-name">' + esc(title) + '</span></div>';
            }).join('');
          }
          if (sidebar && tvSide.length) {
            let idx = 0;
            const total = tvSide.length;
            function renderSideItem(s, num) {
              // OSE-R-015 + OSE-R-011 (2026-05-15): referrerpolicy +
              // onerror — when the sponsor host 404s, the broken-image
              // listener attached below advances the rotation immediately
              // instead of leaving a broken <img> on the venue TV.
              // OSE-1317: the side rail is the compact slot, so it prefers the
              // sidebar logo and falls back to the header logo (the proxy's
              // slot=sidebar does both), then — 0083 — to the OSE default.
              const title = s.title || s.name;
              const logo = '<img src="' + esc(logoSrc(s, 'sidebar')) + '" alt="' + esc(title) + '" referrerpolicy="no-referrer" data-default-src="' + SPONSOR_DEFAULT_LOGO + '" data-testid="display-sponsor-sidebar-logo">';
              return '<div class="display-sponsor-item" data-tier="' + esc(s.tier || 'primary') + '" data-testid="display-sponsor-rotate">' + logo + '<span class="name" data-testid="display-sponsor-sidebar-name">' + esc(title) + '</span></div>' +
                (total > 1 ? '<div class="sponsor-counter" data-testid="display-sponsor-counter">' + num + '/' + total + '</div>' : '');
            }
            function attachErrorAdvance() {
              // OSE-R-011: hide the broken image immediately + advance to
              // next sponsor. Without this, a 404'd sponsor logo would sit
              // on the bar's TV until the next rotation tick. Emits a
              // sentinel element (testid display-sponsor-error) for QA.
              // Sidebar always renders exactly one img at a time (the current
              // rotation slot). Selecting by tag is the simplest reliable handle
              // and avoids tripping the testid-pyramid duplicate-detection lint
              // that scans data-testid attribute substrings across template scope.
              const img = sidebar.querySelector('img');
              if (!img) return;
              img.addEventListener('error', function onLogoError() {
                if (!sidebar.querySelector('[data-testid="display-sponsor-error"]')) {
                  const sentinel = document.createElement('span');
                  sentinel.setAttribute('data-testid', 'display-sponsor-error');
                  sentinel.hidden = true;
                  sidebar.appendChild(sentinel);
                }
                // 0083: the sponsor keeps its slot on the OSE default rather
                // than losing its rotation time to a broken host (#25 share).
                if (img.getAttribute('src') !== SPONSOR_DEFAULT_LOGO) {
                  img.setAttribute('src', SPONSOR_DEFAULT_LOGO);
                  return;
                }
                // Only if the default itself cannot load: hide it and move on.
                img.removeEventListener('error', onLogoError);
                img.style.display = 'none';
                if (total > 1) showNext();
              });
            }
            function showNext() {
              const s = tvSide[idx % total];
              const current = sidebar.querySelector('.display-sponsor-item');
              if (current && total > 1) {
                current.classList.add('fade-out');
                setTimeout(function() {
                  if (stale()) return; // this event's rail was replaced
                  sidebar.innerHTML = renderSideItem(s, (idx % total) + 1);
                  attachErrorAdvance();
                }, 600);
              } else {
                sidebar.innerHTML = renderSideItem(s, (idx % total) + 1);
                attachErrorAdvance();
              }
              idx++;
            }
            showNext();
            // OSE-191: count-based cadence (1→none, ≤5→30s, ≤10→20s, ≤15→15s).
            var rotMs = total <= 1 ? 0 : total <= 5 ? 30000 : total <= 10 ? 20000 : 15000;
            var rotTimer = null;
            function startRot() { if (rotMs > 0 && !rotTimer) rotTimer = setInterval(showNext, rotMs); }
            function stopRot() { if (rotTimer) { clearInterval(rotTimer); rotTimer = null; } }
            // One page-level visibilitychange listener calls this; it is replaced,
            // not added to, when the featured event changes.
            board.sideRailVisibility = function() { document.hidden ? stopRot() : startRot(); };
            board.stopSideRail = stopRot;
            startRot();
          }
          // Log impressions — placement is bound per SOURCE array (FE-14). The
          // sponsor objects come from bundle.surface_sponsors.tvTop / .tvSide and
          // carry NO `.tvTop` flag, so deriving placement from `s.tvTop` collapsed
          // every impression to 'tvSide' and erased the top-banner vs sidebar split.
          function logImpression(s, placement) {
            // OSE-1164: credentials:'omit' — the anon_id cookie is never sent to the
            // aggregate-only sponsor-signal endpoint (structural never-who).
            // OSE-1310: s.beacon_token is minted per-sponsor into THIS bundle
            // response; the write is dropped (honest 202, not counted) without it.
            fetch('/api/v2/events/' + encodeURIComponent(eventId) + '/sponsors/' + encodeURIComponent(s.id) + '/impression', {
              method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ surface: 'display', placement: placement, beacon_token: s.beacon_token })
            }).catch(() => {});
          }
          tvTop.forEach(s => logImpression(s, 'tvTop'));
          tvSide.forEach(s => logImpression(s, 'tvSide'));
        } catch {
          // Sponsor loading is non-critical; retry on the next refresh.
          if (!stale()) board.sponsorsFor = null;
        }
      }
    </script>
    <!-- Sponsor logos hide themselves when the image 404s (OSE-1239).
         This replaced onerror="this.style.display='none'", which the nonce CSP
         refused at fire time — so a dead logo URL left a broken-image icon on
         this surface instead of disappearing quietly. The `error` event does
         NOT bubble, so this listens in the CAPTURE phase; that is the whole
         reason it cannot be folded into an ordinary delegated listener. -->
    <script>
      document.addEventListener(
        'error',
        function (ev) {
          var el = ev.target;
          if (el && el.tagName === 'IMG' && el.hasAttribute('data-hide-on-error')) {
            // 0083: a sponsor logo that fails becomes the OSE default instead of
            // vanishing; only if the default itself fails is the image hidden.
            // The fallback is a fixed same-origin path, never read back from
            // the DOM — data-default-src only marks which images may fall back.
            var d = '/sponsor-default-logo.svg';
            if (el.hasAttribute('data-default-src') && el.getAttribute('src') !== d) el.setAttribute('src', d);
            else el.style.display = 'none';
          }
        },
        true
      );
    </script>
  </body>
</html>
