<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-surface="ose-landing">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{t:landing.title}}</title>
    <meta
      name="description"
      content="{{t:landing.description}}"
    />
    <link rel="stylesheet" href="/ui.css" />
    <!--
      OSE-1312 / owner 2026-10-10: one question first, "where are you?". A zip box
      everywhere; on a phone also "Use my location" (the one script below). No
      cookies, no analytics, no storage. List/map and window toggles are CSS-only.
    -->
    <style>
      [data-surface='ose-landing'] {
        --muted: var(--text-muted, #5a5a5a);
        --line: var(--border, rgba(42, 42, 42, 0.12));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .skip-link { position: absolute; inset-inline-start: -9999px; }
      .skip-link:focus { inset-inline-start: 1rem; top: 1rem; background: var(--accent); color: var(--on-accent); padding: 0.5rem 1rem; z-index: 10; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      .logo,
      nav a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        text-decoration: none;
      }
      .logo {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
      }
      nav a {
        padding: 0 0.75rem;
        color: var(--muted);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      .lead {
        font-size: clamp(1.5rem, 4vw, 2rem);
        line-height: 1.15;
        margin: 0.25rem 0 1rem;
      }
      .where {
        margin: 0 0 2rem;
      }
      .where-label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .where-row {
        display: flex;
        gap: 0.5rem;
        max-width: 420px;
      }
      .where-row .input {
        flex: 1;
      }
      .where-msg,
      .near-note {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }
      .near-me {
        margin: 0 0 1rem;
      }
      .where-change {
        font-size: 1rem;
        font-weight: 400;
        margin-inline-start: 0.5rem;
      }
      .doors {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 0 0 2rem;
      }
      .door {
        text-decoration: none;
      }
      .doors-why {
        flex-basis: 100%;
        color: var(--muted);
      }
      .doors-why summary {
        padding: 0.7rem 0;
        cursor: pointer;
      }
      .area-section {
        margin: 0 0 2rem;
      }
      .area-heading {
        font-size: 1.15rem;
        margin: 0 0 0.75rem;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        margin: 0 0 1rem;
      }
      .toggle-radio {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .view-map {
        display: none;
      }
      #view-map:checked ~ .area .view-map {
        display: block;
      }
      /*OCR_EVENT_CARD_CSS*/
      .empty-state,
      .near-empty,
      .map-placeholder {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 1.5rem 1.25rem;
        text-align: center;
        color: var(--muted);
      }
      .empty-state strong,
      .near-empty strong {
        color: var(--text);
      }
      /*OCR_NEVER_WHO_CSS*/
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-testid="landing-skip-link">{{t:page.skipContent}}</a>
    <header data-testid="landing-header">
      <div class="ose-langmenu-bar">
        <!--OCR_LANGUAGE_MENU-->
        <a href="/{{langdir}}" class="logo" data-testid="landing-logo" aria-label="{{t:landing.homeLabel}}"
          >OurSharedEvents</a
        >
      </div>
      <nav data-testid="landing-nav" aria-label="{{t:landing.navLabel}}">
        <a href="/{{langdir}}events" data-testid="nav-events">{{t:landing.events}}</a>
      </nav>
    </header>

    <main id="main-content" data-testid="landing-main">
      <h1 class="lead" data-testid="landing-h1">{{t:landing.lead}}</h1>
      <section class="where" aria-label="{{t:landing.whereLabel}}" data-testid="landing-where">
        <div class="near-me" data-testid="near-me" hidden>
          <button class="btn btn-primary" type="button" data-testid="near-me-button">
            {{t:landing.nearMe}}
          </button>
          <p class="near-note" data-testid="near-me-note" aria-live="polite">
            {{t:landing.nearNote}}
          </p>
        </div>
        <!--OCR_WHERE-->
        <form id="near-form" method="post" action="/near" hidden>
          <input type="hidden" name="g" />
        </form>
      </section>
      <!-- Doors lead the area below LIST_MAX events, follow it at or above
           (lib/landing-area.ts orderLandingSections). -->
      <!--OCR_DOORS_START-->
      <section class="doors" data-testid="landing-doors" aria-label="{{t:landing.doorsLabel}}">
        <a class="door" href="/admin?start=event" data-testid="door-create-event"
          ><span class="btn btn-secondary" data-testid="door-event-cta"
            >{{t:landing.doorEvent}}</span
          ></a
        >
        <a class="door" href="/admin?start=sponsor" data-testid="door-create-sponsor"
          ><span class="btn btn-secondary" data-testid="door-sponsor-cta"
            >{{t:landing.doorSponsor}}</span
          ></a
        >
        <details class="doors-why">
          <summary>{{t:landing.whySignIn}}</summary>
          <p data-testid="doors-signin-note">
            {{t:landing.signInNote}}
          </p>
        </details>
      </section>
      <!--OCR_DOORS_END-->

      <section class="area-section" aria-label="{{t:landing.events}}" data-testid="landing-area">
        <h2 class="area-heading" data-testid="area-heading"><!--OCR_AREA_HEADING--></h2>
        <!--OCR_LANDING_AREA-->
      </section>
      <!--OCR_AFTER_AREA-->

      <!--OCR_NEVER_WHO-->
    </main>
    <!--OCR_LEGAL_FOOTER-->
    <script>
      // "Use my location" (owner 2026-10-10). Phones only, never on its own
      // unless the person already allowed it. The phone turns its position into
      // a 5-character geohash box (about 5 km) here, and only that box is sent,
      // in a form body, to POST /near, which answers with the nearest zip.
      // Nothing is stored. Gate: tests/landing-where.spec.ts.
      (function () {
        var box = document.querySelector('[data-testid="near-me"]');
        var form = document.getElementById('near-form');
        var geo = navigator.geolocation;
        if (!box || !form || !geo || !window.matchMedia('(pointer: coarse)').matches) return;
        var btn = box.querySelector('button');
        var note = box.querySelector('p');
        var B = '0123456789bcdefghjkmnpqrstuvwxyz';
        function roughBox(lat, lon) {
          var la = [-90, 90], lo = [-180, 180], h = '', ch = 0, bit = 0, even = true;
          while (h.length < 5) {
            var r = even ? lo : la, v = even ? lon : lat, mid = (r[0] + r[1]) / 2;
            if (v >= mid) { ch = ch * 2 + 1; r[0] = mid; } else { ch = ch * 2; r[1] = mid; }
            even = !even;
            if (++bit === 5) { h += B.charAt(ch); ch = 0; bit = 0; }
          }
          return h;
        }
        function off() {
          btn.hidden = true;
          note.textContent = '{{js:landing.locationOff}}';
        }
        function find() {
          btn.disabled = true;
          note.textContent = '{{js:landing.finding}}';
          geo.getCurrentPosition(
            function (p) {
              form.elements.g.value = roughBox(p.coords.latitude, p.coords.longitude);
              form.submit();
            },
            function () {
              btn.disabled = false;
              off();
            },
            { enableHighAccuracy: false, maximumAge: 600000, timeout: 15000 }
          );
        }
        btn.addEventListener('click', find);
        var fresh = location.search === '';
        function show(state) {
          if (state === 'denied') return;
          box.hidden = false;
          if (state === 'granted' && fresh) find();
        }
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'geolocation' }).then(
            function (s) { show(s.state); },
            function () { show('prompt'); }
          );
        } else {
          show('prompt');
        }
      })();
    </script>
  </body>
</html>
