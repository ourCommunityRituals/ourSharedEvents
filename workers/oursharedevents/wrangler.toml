# ============================================
# OurSharedEvents – Cloudflare Worker
# Domain: oursharedevents.com
# ============================================
#
# Prerequisites (do once in Cloudflare dashboard):
#   1. Add oursharedevents.com as a zone (Websites → Add a site)
#   2. Set nameservers at your registrar to Cloudflare's assigned NS
#   3. Add DNS A records (see CLOUDFLARE-SETUP.md)
#
# Deploy staging:
#   cd workers/oursharedevents && wrangler deploy --env staging
#
# Deploy production:
#   cd workers/oursharedevents && wrangler deploy --env production
#
# Local dev:
#   cd workers/oursharedevents && wrangler dev
# ============================================

name = "oursharedevents"
main = "src/index.ts"
# Compatibility date — bumped from "2024-01-01" (20 months stale).
#
# CEILING, NOT TODAY. The pinned toolchain (wrangler 4.84.1 / workerd
# 1.20260421.1) supports dates up to 2026-04-28 only. Setting this to today
# (2026-09-01) deploys fine to the edge but breaks EVERY local test:
#   "This Worker requires compatibility date 2026-09-01, but the newest date
#    supported by this server binary is 2026-04-28"  → 212 errors, 0 tests run.
# Reaching today requires wrangler >=4.127, which peer-requires
# @cloudflare/workers-types ^5 (major bump from our 4.x). Tracked separately —
# do not raise this date without raising the toolchain in the same change.
#
# Inheritable key: this single top-level value covers env.staging and
# env.production. (Contrast OSE-813 below: triggers/vars/d1/kv/r2 are NOT.)
# Audited before bumping — no node: imports, no require(), no TransformStream,
# no WebSocket, every TextDecoder is default UTF-8. None of the breaking flags
# in the 2024-01→2026-04 window apply. Bundle measured byte-identical after.
compatibility_date = "2026-04-28"
account_id = "c4dee735e39737db94d7befeecf96e82"

# ── HTML templates (S-1.2.1: extracted from pages.ts) ───────────
[[rules]]
type = "Text"
globs = ["**/*.html"]

# ── D1 Database (local dev) ──────────────────────────────────────
# Migrations applied via: wrangler d1 migrations apply ocr-db-local --local
[[d1_databases]]
binding = "DB"
database_name = "ocr-db-local"
database_id = "local"
migrations_dir = "migrations"

# ── Forms D1 Database (local dev) — SEPARATE from anonymous scan system ──
# Migrations applied via: wrangler d1 migrations apply FORMS_DB --local
[[d1_databases]]
binding = "FORMS_DB"
database_name = "ocr-forms-db-local"
database_id = "local-forms"
migrations_dir = "migrations-forms"

# ── R2 Uploads Bucket (local dev) ────────────────────────────────────────────
# Create once: wrangler r2 bucket create ose-uploads-dev
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "ose-uploads-dev"

# ── Rate Limit KV (local dev) ─────────────────────────────────────────────────
# Provision once: wrangler kv namespace create rate-limit-dev
# Then fill id below with the ID from: wrangler kv namespace list
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "rate-limit-kv-dev-local"

# ── Observability: structured logs and traces ────────────────────
# Enables Workers Logs in CF Dashboard (real-time + historical)
# See: https://developers.cloudflare.com/workers/observability/
[observability]
enabled = true

# ── Cron trigger: data lifecycle job (destroy expired forms data) ──
# Runs daily at 3 AM UTC. Deletes expired registrations, scrubs survey PII,
# removes email signups past 30-day retention.
# NOTE (OSE-813): this top-level block applies to LOCAL DEV / workers.dev ONLY.
# Named environments do NOT inherit triggers. See [env.staging.triggers] and
# [env.production.triggers] below — if you add an environment, add its triggers too.
[triggers]
crons = ["0 3 * * *"]

# ── Default (local dev / workers.dev) ─────────────────────────────
[vars]
WORKER_ENV = "development"
WORKER_BUILD_VERSION = "dev-local"
# Draft auto-expiry (lifecycle cron): archive — never delete — drafts untouched
# for >= N days; 0 disables. Declared explicitly so the nightly fleet-wide sweep
# is visible config, not an invisible code default of 30 (CCR-PR567 L2).
DRAFT_EXPIRY_DAYS = "30"
# Path-2 template+geo sponsor auto-match: OFF at launch (ADR-019 dark-at-launch, CCR-PR567).
SPONSOR_GEO_MATCH_ENABLED = "0"
# Admin email allowlist (OSE-211) — empty = deny all CF Access JWT identities
ALLOWED_ADMIN_EMAILS = ""
ALLOWED_ADMIN_DOMAINS = ""
# Google Cloud (OSE-215/216) — non-sensitive config (WIF keyless auth)
GCP_PROJECT_ID     = "project-7cc9adcd-ed55-47aa-958"
GCP_PROJECT_NUMBER = "295230478705"
WIF_POOL_ID        = "cf-workers-pool"
WIF_PROVIDER_ID    = "cf-workers-oidc"
WIF_ISSUER         = "http://localhost:8787"
BIGQUERY_DATASET_ID = "oursharedevents_backup"
VERTEX_AI_MODEL_ID = "gemini-2.0-flash"
GCP_REGION         = "us-central1"

# ── Staging: stg.oursharedevents.com ─────────────────────────────
[env.staging]
name = "oursharedevents-stg"
routes = [
  { pattern = "stg.oursharedevents.com/*", zone_name = "oursharedevents.com" }
]

# ── D1 Database (staging) ────────────────────────────────────────
# Migrations applied via CI: wrangler d1 migrations apply ocr-db-staging --env staging --remote
[[env.staging.d1_databases]]
binding = "DB"
database_name = "ocr-db-staging"
database_id = "4c4381db-3823-412d-8275-e35d80e603b4"
migrations_dir = "migrations"

# ── Forms D1 Database (staging) — SEPARATE from anonymous scan system ──
# Migrations applied via CI: wrangler d1 migrations apply ocr-forms-db-staging --env staging --remote
[[env.staging.d1_databases]]
binding = "FORMS_DB"
database_name = "ocr-forms-db-staging"
database_id = "ff1cb46d-cb3b-463d-9aad-713de4d272b5"
migrations_dir = "migrations-forms"

# ── R2 Uploads Bucket (staging) ──────────────────────────────────────────────
# Create once: wrangler r2 bucket create ose-uploads-staging
[[env.staging.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "ose-uploads-staging"

# ── Rate Limit KV (staging) ───────────────────────────────────────────────────
# Provisioned 2026-08-18 (OSE-813) in account c4dee735… — namespace `rate-limit-staging`.
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4418eb1709e24987bf86b1aa280725c2"

# ── Scan write-buffer (staging) — engine-hardening #1, ACTIVE ─────────────────
# Producer + consumer for the /q/ QR-scan write buffer (src/lib/scan-buffer.ts).
# The `ose-scans` / `ose-scans-dlq` queues were created 2026-09-16 (account-level;
# `wrangler queues create` ignores --env, so this ONE pair is staging's). A queue
# allows exactly ONE consumer Worker, so production must use its OWN queues — see
# the production block below; staging and prod cannot share `ose-scans`.
#
# On the next deploy of this Worker, SCAN_QUEUE binds and the /q/ hot path enqueues
# instead of writing D1 inline; the consumer (queue() in index.ts) drains + batches.
# Reversible: re-comment these two blocks and redeploy → back to the direct write.
[[env.staging.queues.producers]]
binding = "SCAN_QUEUE"
queue   = "ose-scans"

[[env.staging.queues.consumers]]
queue             = "ose-scans"
max_batch_size    = 100
max_batch_timeout = 5
max_retries       = 3
dead_letter_queue = "ose-scans-dlq"

# ── Cron trigger: data lifecycle (staging) ────────────────────────────────────
# OSE-813 — Wrangler does NOT inherit [triggers] into named environments, the same
# rule that applies to vars / d1_databases / kv_namespaces / r2_buckets. The
# top-level [triggers] block above covers local dev only. Without this block the
# scheduled() handler in src/index.ts is never invoked on staging, and the
# retention promises rendered on the forms (90d registrations, 30d emails) are
# printed but never executed.
[env.staging.triggers]
crons = ["0 3 * * *"]

[env.staging.vars]
WORKER_ENV = "staging"
WORKER_BUILD_VERSION = "stg-2026.03.22"
# Named CF envs do NOT inherit top-level [vars] — declare launch config explicitly
# (CCR-PR567 re-run item 9 / L2). Otherwise staging runs the invisible code defaults.
DRAFT_EXPIRY_DAYS = "30"
SPONSOR_GEO_MATCH_ENABLED = "0"
# Allow Bearer token fallback in staging (for local testing without CF Access)
ALLOW_ADMIN_KEY_FALLBACK = "true"
# Allow X-OCR-Internal header for CI/CD automation
ALLOW_OCR_INTERNAL = "true"
# Automation/CI escape hatch (admin-brand-scope.ts): a `key:` actor (X-OCR-Internal /
# ADMIN_KEY) runs UNSCOPED — sees every brand's rows — only when this is exactly "true".
# Required for the T4 admin-path E2E (sponsor-journey) to see the sponsors it creates;
# without it the CI actor resolves to mode:'deny' and every admin list is empty (OSE-865).
# STAGING ONLY — deliberately absent from [env.production.vars]; unscoped automation
# access to real tenant data on prod is a security boundary that must never open.
ADMIN_SCOPE_ALL = "true"
# Admin email allowlist — plaintext vars take priority over secrets; set actual values here
ALLOWED_ADMIN_EMAILS = "mzdano@gmail.com"
ALLOWED_ADMIN_DOMAINS = "oursharedevents.com"
# CF Access team domain for JWT signature verification (OSE-573)
# Leave empty in local dev to skip signature verification (ALLOW_ADMIN_KEY_FALLBACK handles dev auth)
CF_ACCESS_TEAM_DOMAIN = "mzdano.cloudflareaccess.com"
# Google Cloud — non-sensitive WIF config
GCP_PROJECT_ID     = "project-7cc9adcd-ed55-47aa-958"
GCP_PROJECT_NUMBER = "295230478705"
WIF_POOL_ID        = "cf-workers-pool"
WIF_PROVIDER_ID    = "cf-workers-oidc-stg"
WIF_ISSUER         = "https://stg.oursharedevents.com"
BIGQUERY_DATASET_ID = "oursharedevents_backup"
VERTEX_AI_MODEL_ID = "gemini-2.0-flash"
GCP_REGION         = "us-central1"

# Required secrets for staging (set with wrangler secret put … --env staging):
#   ADMIN_KEY                (strong random string, min 32 chars)
#   X_OCR_INTERNAL           (CI/CD auth secret for X-OCR-Internal header)
#   FORMS_ENCRYPTION_KEY     (AES-GCM key for email encryption — min 32 chars, DIFFERENT from prod)
#   FORMS_HASH_PEPPER        (HMAC-SHA256 pepper — min 32 chars, DIFFERENT from prod — OSE-598)
#   ANON_ID_HASH_PEPPER      (pepper for anonymous ID hashing — min 32 chars)
#   IP_HASH_PEPPER           (pepper for IP hashing — min 32 chars)
#   SHARED_REPORT_SIGNING_SECRET  (HMAC key for signed link tokens — min 32 chars)
#   WKRP_SERVICE_TOKEN       (bearer token for WKRP batch endpoint — OSE-577: cross_product class, fails closed)
#   OSE_INTERNAL_BATCH_TOKEN (bearer token for the internal-fleet batch consumer — OSE-577: internal class, full payload)
#   GOOGLE_MAPS_API_KEY      (Google Maps for SharedReports venue maps)
#   — OSE-215 (BE-19): Workload Identity Federation (keyless GCP auth) —
#   WIF_PRIVATE_KEY_PEM      (RSA private key for WIF JWT signing — SECRET, not a GCP SA key)
#   WIF_PUBLIC_JWKS          (JWKS JSON for /.well-known/jwks.json — public key, not secret)
#   — OSE-SEC-1: Security monitoring (optional — cron runs without them, just skips alerts) —
#   LINEAR_API_KEY           (Linear personal API token for issue creation)
#   LINEAR_TEAM_ID           (Linear team ID, e.g. "OUR")

# ── Production: oursharedevents.com ──────────────────────────────
[env.production]
name = "oursharedevents-prod"
routes = [
  { pattern = "oursharedevents.com/*",     zone_name = "oursharedevents.com" },
  { pattern = "www.oursharedevents.com/*", zone_name = "oursharedevents.com" }
]

# ── D1 Database (production) ─────────────────────────────────────
# Production migrations NEVER run locally — only via deploy-prod CI with approval gate
# Migrations applied via CI: wrangler d1 migrations apply ocr-db-production --env production --remote
[[env.production.d1_databases]]
binding = "DB"
database_name = "ocr-db-production"
database_id = "c19285d2-9c9e-435e-b978-5fc9d737a914"
migrations_dir = "migrations"

# ── Forms D1 Database (production) — SEPARATE from anonymous scan system ──
# Migrations applied via CI: wrangler d1 migrations apply ocr-forms-db-production --env production --remote
[[env.production.d1_databases]]
binding = "FORMS_DB"
database_name = "ocr-forms-db-production"
database_id = "ff327b4a-430d-428e-b134-b3d8071be8e4"
migrations_dir = "migrations-forms"

# ── R2 Uploads Bucket (production) ───────────────────────────────────────────
# Create once: wrangler r2 bucket create ose-uploads-production
[[env.production.r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "ose-uploads-production"

# ── Rate Limit KV (production) ────────────────────────────────────────────────
# Provisioned 2026-08-18 (OSE-813) in account c4dee735… — namespace `rate-limit-production`.
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e44974e89361435e97b3cb79bd10abbb"

# ── Scan write-buffer (production) — engine-hardening #1, DARK (needs own queues) ─
# Commented until PRODUCTION-SPECIFIC queues exist. Production must NOT share
# staging's `ose-scans`: a queue allows exactly one consumer Worker, so binding a
# consumer here on `ose-scans` would collide with the staging Worker's consumer.
# Until activated, SCAN_QUEUE is unbound and the /q/ hot path takes the direct D1
# batch (the fallback floor) — identical to today.
#
# To activate (owner, separate terminal — note the -prod queue names):
#   npx wrangler queues create ose-scans-prod
#   npx wrangler queues create ose-scans-prod-dlq
# then uncomment the two blocks below and redeploy. Reversible by re-commenting.
#
# [[env.production.queues.producers]]
# binding = "SCAN_QUEUE"
# queue   = "ose-scans-prod"
#
# [[env.production.queues.consumers]]
# queue             = "ose-scans-prod"
# max_batch_size    = 100
# max_batch_timeout = 5
# max_retries       = 3
# dead_letter_queue = "ose-scans-prod-dlq"

# ── Cron trigger: data lifecycle (production) ─────────────────────────────────
# OSE-813 — see the staging block. Must be declared per-environment; not inherited.
[env.production.triggers]
crons = ["0 3 * * *"]

[env.production.vars]
WORKER_ENV = "production"
WORKER_BUILD_VERSION = "prod-2026.03.22"
# Named CF envs do NOT inherit top-level [vars] — declare launch config explicitly
# (CCR-PR567 re-run item 9 / L2). Otherwise production runs the invisible code defaults.
DRAFT_EXPIRY_DAYS = "30"
SPONSOR_GEO_MATCH_ENABLED = "0"
# Allow X-OCR-Internal header for CI/CD automation
ALLOW_OCR_INTERNAL = "true"
# Admin email allowlist — set explicitly here (not inherited from [vars])
ALLOWED_ADMIN_EMAILS = "mzdano@gmail.com"
ALLOWED_ADMIN_DOMAINS = "oursharedevents.com"
# CF Access team domain for JWT signature verification (OSE-573)
CF_ACCESS_TEAM_DOMAIN = "mzdano.cloudflareaccess.com"
# Google Cloud — non-sensitive WIF config
GCP_PROJECT_ID     = "project-7cc9adcd-ed55-47aa-958"
GCP_PROJECT_NUMBER = "295230478705"
WIF_POOL_ID        = "cf-workers-pool"
WIF_PROVIDER_ID    = "cf-workers-oidc"
WIF_ISSUER         = "https://oursharedevents.com"
BIGQUERY_DATASET_ID = "oursharedevents_backup"
VERTEX_AI_MODEL_ID = "gemini-2.0-flash"
GCP_REGION         = "us-central1"

# Required secrets for production (set with wrangler secret put … --env production):
#   ADMIN_KEY                (strong random string, min 32 chars)
#   X_OCR_INTERNAL           (CI/CD auth secret for X-OCR-Internal header)
#   FORMS_ENCRYPTION_KEY     (AES-GCM key for email encryption — min 32 chars, unique per env)
#   FORMS_HASH_PEPPER        (HMAC-SHA256 pepper for email hashing — min 32 chars, unique per env)
#                            OSE-598: different from FORMS_ENCRYPTION_KEY; rotate every 90 days
#   ANON_ID_HASH_PEPPER      (pepper for anonymous ID hashing — min 32 chars)
#   IP_HASH_PEPPER           (pepper for IP hashing — min 32 chars)
#   SHARED_REPORT_SIGNING_SECRET  (HMAC key for signed link tokens — min 32 chars)
#   WKRP_SERVICE_TOKEN       (bearer token for WKRP batch endpoint — OSE-577: cross_product class, fails closed)
#   OSE_INTERNAL_BATCH_TOKEN (bearer token for the internal-fleet batch consumer — OSE-577: internal class, full payload)
#   GOOGLE_MAPS_API_KEY      (Google Maps for SharedReports venue maps)
#   — OSE-215 (BE-19): Workload Identity Federation (keyless GCP auth) —
#   WIF_PRIVATE_KEY_PEM      (RSA private key for WIF JWT signing — SECRET, not a GCP SA key)
#   WIF_PUBLIC_JWKS          (JWKS JSON for /.well-known/jwks.json — public key, not secret)
#   — OSE-SEC-1: Security monitoring —
#   LINEAR_API_KEY           (Linear personal API token for issue creation)
#   LINEAR_TEAM_ID           (Linear team ID, e.g. "OUR")
